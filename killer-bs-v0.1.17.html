CHANGELOG
// v0.1.17  2026-08-31  Installable with auto-updates, on MadGolf's pattern. The page checks for a new service worker on every load rather than waiting out the browser's 24-hour delay, checks again hourly, and hands the waiting worker a SKIP_WAITING message the moment nothing is half-finished on screen — the analogue of MadGolf's mid-round guard here is an open modal or a form field with typing in it. When it is busy it toasts and polls every twenty seconds instead of leaving the update stranded until the next cold start, then reloads once on controllerchange. Home carries an Install button where Chrome offers one and iOS instructions where it does not, since Safari never fires beforeinstallprompt; both disappear once the app is running standalone. Manifest completed with id, scope, description, orientation, categories and a maskable icon. Caching split by what it holds: the shell is cache-first because it only changes on a bump, while data.json and map.json are network-first with the cache as fallback — this app is used at home and in shops rather than on the back nine, so a current shelf beats an offline one. Fault tolerance where it actually bites: localStorage is probed once at startup so private browsing degrades to a session rather than throwing, each saved key is validated for shape and discarded individually if unreadable so one corrupt entry cannot take the shelf down, a failed save says storage is full instead of silently losing an edit, a failed data load explains what to check, and an unhandled render error toasts rather than leaving a blank screen. Eight new audit checks cover the update handshake, the install hook, the maskable icon and the storage probe.
// v0.1.16  2026-08-31  Shop tab added. Type what you are holding in the store: it searches the shelf for anything by that name and shows how many you own, open or sealed, and what you paid. Then it judges the bottle against the shelf from your own data — no lookup service, works offline. Findings cover whether you already own it and whether a sealed backup fits your stocking rule, whether the distillery, category, region or finish would be new, how crowded that corner already is (same category within five proof points), whether it would form a matched pair with something you own at the same house and within one proof point, its price band against your median for that category, and its release tier. A one-line verdict sits on top, counted from the findings so the reasoning stays on screen. Bought it? One tap adds it — a sealed spare if you already own it, a new open bottle if you do not, with the price recorded as paid. Two defects the real shelf exposed and fixed in the same pass: a naive plural produced 'scotchs' and 'irishs', and owning a bottle already was being counted as a point in favour so Ardbeg 10 read as adding something the shelf lacks; owning it now settles the verdict before any other finding is counted. Nav went to seven slots and Reference shortened to Info. +30 tests.
// v0.1.15  2026-08-31  Reference gained two more bodies of content behind a group switcher, so it is one nav slot rather than a seventh tab. Tasting (12 terms): what each of the five sheet columns is actually testing — colour and why a darker dram is not older or stronger given E150a, nosing without numbing yourself, palate, finish, and why perceived heat is not proof — plus how this shelf runs a blind flight: ascending proof, unpeated before peated, one variable, spotted controls, write before you talk, water added at the same point by everyone, six pours as the fatigue ceiling, one glass shape for the room. Whiskey (25 terms): mashbill and what each grain brings, malting and where peat smoke actually enters, pot against column and why every category caps distillation proof, single pot still; then the barrel — toasting adds flavour, charring adds and subtracts, char levels through alligator, new versus used oak, maturation and why three Kentucky years are not three Speyside years, angel's share, cask size as faster not better; finishing, the four sherry styles, what double/triple/quarter cask do not tell you, STR, single barrel against small batch, solera; and the bottle — cask strength, chill filtration and why non-chill-filtered travels with higher strength, Bottled in Bond, no age statement, independent bottlers and the Williamson name. Searching spans all three groups and labels each hit with its group; browsing shows the chosen group. 73 terms total. +18 tests.
// v0.1.14  2026-08-31  Reference tab added: every attribute the app stores, defined, split by who defines it — categories set in law (bourbon, rye, wheat, Tennessee, American single malt, Scotch, Irish, Canadian, tequila) each cite their standard of identity; Japanese whisky sits under trade-defined because the JSLMA rules are voluntary association labelling standards, not law; then the Scotch regions, what the shelf records (product versus bottle, open/sealed/gone, exit reasons, proof, age, finish, wine cask), our own conventions stated plainly as ours (recognition, release, occasion, the honestly-renamed Ohio retail label, premium, the stocking rule) and the flight vocabulary. Searchable across term, definition and source. Tests assert that every type and every Scotch region has a definition, that legal entries cite a source and house conventions do not, so the two can never read as the same kind of claim. Map pins now carry their bottle count inside the dot on both the Scotland and world layers, shown only once the digits fit the pin. The Detail nav slot became Reference — Detail opened a blank screen when nothing was selected, and every bottle and flight still opens it by tap. Road trip planner recorded in BACKLOG.md with what it needs. +15 tests.
// v0.1.13  2026-08-31  Home is now a summary page and the map grew two more layers. Summary: six tiles (bottles, open, distinct whiskies, shelf value at MSRP, flights designed, flights run), then sorted horizontal bar charts for type, open-versus-sealed, recognition, occasion and Scotch by region — no pie charts, and the two ordered scales keep their sequence instead of being sorted by size, since a scale read out of order is harder to read. A small world map sits on the home page, and recent adds and recent pours close it out. Map gained World and United States layers alongside Scotland: the world layer draws land with one dot per country sized by bottle count, tapping Scotland or the United States drops into their detail layer, and the US layer is a banded choropleth rather than dots because a state is an area and Kentucky's 126 bottles against Nevada's one would flatten any linear ramp. 53 US distilleries mapped to states, 181 of 186 US bottles placed; three small bottlers I could not confirm are left unplaced rather than guessed onto the wrong state. Alberta Distillers refiled from rye to Canadian — it is in Calgary — taking Canadian to 8. All 325 products now land in a country. +47 tests.
// v0.1.12  2026-08-31  Old Elk Wheat N Rye moved from wheat to rye. Rye 36 to 37; wheat is now the one straight wheat whiskey, Old Elk 10 Year. +1 test.
// v0.1.11  2026-08-31  Barrell Craft Spirits 33 Year refiled from bourbon to Canadian: it is distilled in Canada and matured 33 years there, and only finished and bottled in Kentucky — Barrell is the bottler, not the distiller, so country beats the bottler's address. Its casks are now recorded from the producer's own description, French oak and Oloroso sherry, which makes it a wine-cask bottle; finishes known 109 to 110, wine casks 58 to 59, Canadian 6 to 7 and bourbon 130 to 129. It appears only as an extension in What Does Gray Label Buy?, where the card asks what tier it belongs to — being Canadian sharpens that question rather than breaking it. +5 tests.
// v0.1.10  2026-08-31  Map view added: a real, zoomable map of Scotland built from Natural Earth 10m coastline data, simplified to about 2,600 points so Islay keeps its shape, with all 23 of your Scottish distilleries plotted at their true coordinates and sized by how many bottles you own. Pinch, drag, wheel and the plus/minus controls all zoom about a fixed point; the view clamps to the map so a gesture cannot pan off into blank space. Region chips along the bottom filter and frame — tapping Islay flies to the 39 bottles that make it half your Scotch — and tapping any pin lists that distillery's bottles with open and sealed marked. Labels appear once there is room and scale with zoom rather than ballooning. Loaded as a separate map.json so the shelf still works if it fails, and precached with the shell for offline use. +28 tests, including a guard that every regioned Scotch distillery has coordinates and a check that Ardbeg, Lagavulin and Laphroaig really do sit within three miles, since Three Miles Apart is only a flight because they do.
// v0.1.9  2026-08-31  One capitalization rule applied everywhere: sentence case for headings, buttons and prose; Title Case for data values shown as a label or a chip. Two tested helpers do the work — titleCase for chips, reel faces, type column, cask tags, status, region, recognition, release and the form dropdowns, and sentenceCase for the shouted flight titles, which now render as 'Sherry is not one thing' and 'What does Gray Label buy?' rather than all-lower. Both keep acronyms (MSRP, NAS, PX, STR), house spellings (Flavoured), interior capitals (A'Bunadh, McKenna) and proper nouns including two-word names matched before the string is split. The type reel no longer mixes lower-case bourbon with capitalised Scotch, and the status chips no longer read Title Case beside lower-case type chips. New tests forbid a lower-case reel face and a lower-case flight title. +23 tests.
// v0.1.8  2026-08-31  Old Elk Wheat N Rye filed under wheat: country beats grain where a country category exists, and among the American categories grain decides — Wheat N Rye has no corn, so it is not a bourbon. The blended category is now empty and removed from the type reel, the type list and the add/edit form, leaving twelve categories. The add/edit form's type dropdown now derives from L.TYPES rather than a second hand-maintained list that could drift out of step with the reel. New test forbids a reel face that no bottle on the shelf can satisfy, so a dud spin fails the build. +3 tests.
// v0.1.7  2026-08-31  Eight bourbon-forward blends refiled from blended to bourbon per BZ — the four Barrells, Little Book Chapter 8, Traveller Full Proof, Nelson Brothers Black Brier and Keeper's Heart — with the style field keeping 'blended' so the construction survives the recategorisation, and Keeper's Heart carrying a note that it is half Irish and crosses two categories. Bourbon 122 to 130. Old Elk Wheat N Rye held back pending a ruling: the name names two grains and neither is corn. +3 tests pinning the refiling and the holdout.
// v0.1.6  2026-08-31  Type taxonomy rebuilt on real categories — thirteen exact subcategories replace the malt/other catch-alls, with American single malt named as the TTB standard of identity it became in January 2025 rather than a bucket. Two misfilings corrected in the data: Macaloney's (Victoria BC) moved from world to Canadian and Crown Royal from blended to Canadian, taking Canadian from 1 to 6 and leaving world as the genuine two, Pokeno and Rampur; anejo renamed tequila so the one non-whiskey is still reachable. Scotch now carries its region — 76 of 80 mapped by distillery across Islay 39, Speyside 16, Highland 11, Islands 8, Lowland and Campbeltown 1 each, with blenders and independent bottlers left null rather than guessed. New notes panel on every bottle gathering what each source knows — inventory note, price provenance, cask and whether wine touched it, region, and the host prose from every flight the bottle appears in — plus a free-text note of your own, saved per bottle. +19 tests.
// v0.1.5  2026-08-31  Time for a Taste replaces Pick My Pour: a four-reel slot machine (proof band, type, recognition, occasion) with per-reel holds and a spin, paying out into three Glencairn glasses drawn as inline SVG and filled with the type colour — tap a glass to open that bottle. A tight filter fills fewer glasses and says how many lined up. Full add/edit/delete across shelf and flights: products validate before saving, corrections layer over the shipped catalog as per-user overrides, custom bottles and deletions are user-scoped so nothing shipped is destroyed, sealed spares add in one tap, and flights gain a pour editor with reorder, remove, sort-by-proof and add-from-open-shelf. Palette drawn from the liquid — six type colours from deep amber through peat-grey to dark plum, coding the type column and the dot; sealed reads as a ring rather than a fill; the machine sits on a dark felt cabinet. +94 tests including a coverage assertion that every one of the 325 products is reachable by some reel combination.
// v0.1.4  2026-08-31  Version info moved into the MadGolf header format: boxed file header with Version/Build/Author/Deploy/SW Cache/Data/Storage lines, a canonical CHANGELOG block written newest-first as '// vX.Y.Z date entry', a v-number sub-line under the masthead (header-version, MadGolf's hdr-sub pattern), and Build time in the footer. bump.py rewritten to write all five locations plus the changelog in that format, with Eastern Time stamps computed without a tz-database dependency, and it now aborts rather than silently no-matching if any of the five anchors is missing. audit.sh checks the header version line, that the changelog has an entry for this version, and that no entry is blank.
// v0.1.3  2026-08-31  Shelf density pass: denser three-column rows (Bottle / Type / Proof) with a header row, sticky status + type filter bars with counts, type column collapsing under 430px, Bottle Tracker capitalised, and the 400-row display cap removed. Shelf filtering extracted from the render into a tested helper (L.shelfFilter). +11 tests.

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1613">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Killer B's Bottle Tracker</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink-deep:#1A1613; --gold:#8A6A28; --rust:#7A3B1E;
  --paper:#F2EDE3; --card:#FFFCF6; --ink:#241F1A; --mute:#6E665C;
  --line:#D8CFBD; --ok:#2E6B4F;
  /* Type colours are the liquid: the range your own flight cards name,
     pale gold through mahogany. They code the type column, not decorate it. */
  --t-bourbon:#B4762B;   /* deep amber   */
  --t-scotch:#5C6B63;    /* peat, coastal green-grey */
  --t-irish:#8C8034;     /* green gold   */
  --t-rye:#9C4A22;       /* rust         */
  --t-malt:#7A6142;      /* burnished    */
  --t-other:#6B3550;     /* dark plum    */
  --felt:#243B33;        /* the machine's cabinet */
  --nav-h:58px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:15px; line-height:1.45;
  font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
h1,h2,h3{font-family:'Cinzel',Georgia,serif;font-weight:600;margin:0;line-height:1.2;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink-deep);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- structure ---------- */
.screen{display:none;padding:14px 14px 24px}
.screen.on{display:block}
.hdr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.hdr h1{font-size:21px;color:var(--ink-deep)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.brand img{width:52px;height:52px;flex:none}
.brand .wm{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:17px;
  line-height:1.1;color:var(--ink-deep)}
.brand .wm span{display:block;font-family:'IBM Plex Sans',sans-serif;font-weight:400;
  font-size:11.5px;color:var(--mute);letter-spacing:.04em;margin-top:3px}
.hdr-sub{font-family:'IBM Plex Sans',sans-serif;font-weight:400;font-size:10.5px;
  color:var(--mute);letter-spacing:.04em;margin-top:2px}
.count{color:var(--mute);font-size:13px}

/* ---------- nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:250;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(7,1fr);
  background:var(--ink-deep);
}
nav button{
  background:none;border:0;color:#B9C3D4;font-size:9.5px;letter-spacing:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:0;
}
nav button .g{font-size:16px;line-height:1}
nav button[aria-current="page"]{color:#fff;box-shadow:inset 0 2px 0 var(--gold)}

/* ---------- controls ---------- */
.field{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
  background:var(--card);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{
  padding:5px 11px;border:1px solid var(--line);border-radius:999px;
  background:var(--card);font-size:13px;color:var(--mute);
}
.chip[aria-pressed="true"]{background:var(--ink-deep);border-color:var(--ink-deep);color:#fff}
.btn{padding:10px 15px;border:1px solid var(--ink-deep);border-radius:7px;
  background:var(--ink-deep);color:#fff;font-size:14px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink-deep)}
.btn.wide{width:100%;margin-top:8px}

/* ---------- bottle rows ---------- */
.list{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:9px;overflow:hidden}
.item{background:var(--card);border:0;width:100%;text-align:left;
  padding:6px 11px;display:grid;grid-template-columns:1fr 96px 52px;
  gap:10px;align-items:baseline}
.item .nm{font-size:13.5px;font-weight:500;line-height:1.3}
.item .sub{font-size:11.5px;color:var(--mute);line-height:1.3}
.item .ty{font-size:11.5px;color:var(--mute);text-align:left}
.item .pf{font-size:13.5px;color:var(--ink-deep);font-weight:600;text-align:right}
/* Narrow phones drop the type column into the subtitle line. */
@media (max-width:430px){
  .item{grid-template-columns:1fr 48px}
  .item .ty{display:none}
}
.listhead{display:grid;grid-template-columns:1fr 96px 52px;gap:10px;
  padding:0 11px 5px;font-size:11px;color:var(--mute)}
.listhead b:last-child{text-align:right}
.listhead b{font-weight:500}
@media (max-width:430px){.listhead{display:none}}
.filterbar{position:sticky;top:0;z-index:20;background:var(--paper);
  padding-top:8px;margin-bottom:8px}
.scroller{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px;
  scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}
.sealed .nm{color:var(--mute)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:middle;
  margin-right:6px;background:var(--t-other)}
.t-bourbon .dot{background:var(--t-bourbon)} .t-scotch .dot{background:var(--t-scotch)}
.t-irish .dot{background:var(--t-irish)}     .t-rye .dot{background:var(--t-rye)}
.t-malt .dot{background:var(--t-malt)}       .t-other .dot{background:var(--t-other)}
/* Sealed reads as a ring rather than a fill: the bottle exists, it is not open. */
.sealed .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.item .ty{font-weight:500}
.t-bourbon .ty{color:var(--t-bourbon)} .t-scotch .ty{color:var(--t-scotch)}
.t-irish .ty{color:var(--t-irish)}     .t-rye .ty{color:var(--t-rye)}
.t-malt .ty{color:var(--t-malt)}       .t-other .ty{color:var(--t-other)}

/* ---------- detail ---------- */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;
  background:#EDE9DF;color:var(--gold);margin:0 4px 4px 0}
.tag.wine{background:#F3E4E4;color:var(--rust)}
.tag.wood{background:#E6EAE6;color:var(--ok)}
.src{font-size:11px;color:var(--mute)}

/* ---------- proof ladder: the signature element ---------- */
.ladder{position:relative;margin:14px 0 6px;padding-left:52px}
.ladder .axis{position:absolute;left:42px;top:0;bottom:0;width:1px;background:var(--line)}
.rung{position:relative;display:grid;grid-template-columns:1fr;padding:3px 0}
.rung .pin{position:absolute;left:-52px;width:40px;text-align:right;
  font-size:13px;color:var(--ink-deep);font-weight:600}
.rung .tick{position:absolute;left:-11px;top:50%;width:11px;height:1px;background:var(--line)}
.rung .body{border-left:3px solid var(--line);padding:4px 0 4px 10px}
.rung.spot .body{border-left-color:var(--gold)}
.rung.blind .body{border-left-color:var(--rust)}
.rung .b{font-size:13.5px;font-weight:500}
.rung .w{font-size:12px;color:var(--mute)}

/* ---------- flights ---------- */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 13px;margin-bottom:9px;width:100%;text-align:left}
.fcard h3{font-size:15px;color:var(--ink-deep);letter-spacing:.02em}
.fcard .var{font-size:12.5px;color:var(--gold);margin-top:2px}
.fcard .meta{font-size:12px;color:var(--mute);margin-top:6px}
.done{border-left:3px solid var(--ok)}
.warn{background:#FBF5EC;border:1px solid #E3D3B4;border-radius:8px;padding:9px 11px;
  font-size:13px;margin-bottom:8px}
.warn b{color:var(--gold)}
.ok{background:#EFF5F1;border-color:#CBDFD2}
.ok b{color:var(--ok)}
.snack{font-size:13px;color:var(--mute);margin-top:8px}
.note{font-size:13px;padding:7px 0;border-top:1px solid var(--line);line-height:1.4}
.note:first-of-type{border-top:0}
.nsrc{font-size:10px;letter-spacing:.05em;color:var(--gold);text-transform:uppercase;
  margin-bottom:2px}
textarea.field{font:inherit;resize:vertical;min-height:56px}
.empty{color:var(--mute);font-size:14px;padding:20px 4px;text-align:center}
footer{text-align:center;color:var(--mute);font-size:11px;padding:14px 0 4px}

/* ---------- the machine ---------- */
.machine{background:var(--felt);border-radius:14px;padding:13px 12px 15px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 2px 10px rgba(26,22,19,.22)}
.reels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.reel{background:#F7F2E7;border-radius:8px;padding:7px 4px 6px;text-align:center;
  border:2px solid transparent;cursor:pointer;overflow:hidden}
.reel[data-held="true"]{border-color:var(--gold);background:#FBF4E2}
.reel .rl{font-size:9px;letter-spacing:.05em;color:var(--mute);text-transform:uppercase}
.reel .rv{font-family:'Cinzel',Georgia,serif;font-size:13px;font-weight:600;
  color:var(--ink-deep);margin-top:3px;min-height:19px;line-height:1.45}
.reel .hold{font-size:8.5px;color:var(--gold);letter-spacing:.06em;
  visibility:hidden;margin-top:1px}
.reel[data-held="true"] .hold{visibility:visible}
.reel.spinning .rv{animation:tumble .42s linear}
@keyframes tumble{
  0%{transform:translateY(0);opacity:1}
  40%{transform:translateY(-16px);opacity:0}
  60%{transform:translateY(16px);opacity:0}
  100%{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.reel.spinning .rv{animation:none}}
.lever{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:11px}
.lever .btn{background:var(--gold);border-color:var(--gold);color:#1A1613;font-weight:600;
  letter-spacing:.02em}
.lever .btn.sm{background:transparent;border-color:rgba(255,255,255,.28);color:#EDE4D2;
  font-weight:400}

/* ---------- the payout: three Glencairns ---------- */
.payline{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}
.glass{background:transparent;border:0;padding:0;text-align:center;cursor:pointer}
.glass svg{width:100%;height:auto;max-width:88px;display:block;margin:0 auto}
.glass .gn{font-size:11px;line-height:1.25;color:#EDE4D2;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.glass .gp{font-size:11px;color:var(--gold);font-weight:600;margin-top:2px}
.glass.empty .gn{color:rgba(237,228,210,.42)}
.glass:disabled{cursor:default}
.machine .empty{color:rgba(237,228,210,.6)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(26,22,19,.55);
  display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:var(--paper);width:100%;max-width:560px;max-height:88vh;
  overflow-y:auto;border-radius:14px 14px 0 0;padding:16px 15px
  calc(18px + env(safe-area-inset-bottom))}
.modal h2{font-size:18px;color:var(--ink-deep);margin-bottom:11px}
.form{display:grid;gap:9px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);

.errs{background:#FBECEA;border:1px solid #E4C4BE;color:var(--rust);

.danger{border-color:var(--rust);color:var(--rust);background:transparent}
.addbar{display:flex;gap:8px;margin-bottom:10px}

  paint-order:stroke;stroke:#F2EDE3;stroke-width:2.4px;stroke-linejoin:round;
  vector-effect:non-scaling-stroke}
.pin.dim circle{opacity:.22} .pin.dim text{opacity:.28}

.mapnote{font-size:12px;color:var(--mute);margin-top:8px}
.refsec h3{font-size:16px;color:var(--ink-deep)}

  line-height:1.25}

.find .m{font-weight:600}
.find.f-ok .m{color:var(--ok)} .find.f-warn .m{color:var(--rust)}
.find.f-info .m{color:var(--mute)}
.pin .cnt{font-weight:600;fill:#FFFCF6;stroke:none;paint-order:normal}

.state.s1{fill:#EFE3CB} .state.s2{fill:#E7D2A6} .state.s3{fill:#D9B978}

  color:var(--ink-deep);line-height:1.1}

.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;
  font-size:12.5px}
.bar .t{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{background:#E7E0D2;border-radius:3px;height:14px;overflow:hidden}
.bar .fill{height:100%;border-radius:3px;background:var(--gold)}
.bar .n{text-align:right;color:var(--mute);font-size:12px}
.bar.b-open .fill{background:var(--ok)} .bar.b-sealed .fill{background:#B0A68F}
.homemap{height:38vh;min-height:210px}
.recent{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:9px;overflow:hidden}
.recent .item{padding:7px 11px;grid-template-columns:1fr auto}

<!-- ======================= HOME ======================= -->
<section id="scr-home" class="screen on">
  <div class="brand">
    <img src="./mark.png" alt="" width="52" height="52">
    <div class="wm">Killer B’s<span>Bottle Tracker</span>
      <div class="hdr-sub" id="header-version"></div></div>
  </div>
  <div id="homeBody"></div>
</section>

<!-- ======================= SHELF ======================= -->
<section id="scr-shelf" class="screen">
  <div class="hdr"><h1>The shelf</h1><span class="count" id="shelfCount"></span></div>
  <div class="filterbar">
    <input id="q" class="field" type="search" placeholder="Search name or distillery" aria-label="Search bottles">
    <div class="scroller" id="shelfFilters" style="margin-top:8px"></div>
    <div class="scroller" id="typeFilters"></div>
  </div>

  <div class="listhead"><b>Bottle</b><b>Type</b><b>Proof</b></div>
  <div class="list" id="shelfList"></div>
</section>

<!-- ======================= TIME FOR A TASTE ======================= -->
<section id="scr-pour" class="screen">
  <div class="hdr"><h1>Time for a taste</h1></div>
  <div class="machine">
    <div class="reels" id="reels"></div>
    <div class="lever">
      <button class="btn" id="spinBtn">Spin</button>
      <button class="btn sm" id="clearHolds">Clear holds</button>
    </div>
    <div class="payline" id="payline"></div>
    <div class="empty" id="payMsg" style="display:none"></div>
  </div>
</section>

<!-- ======================= FLIGHTS ======================= -->
<section id="scr-flights" class="screen">
  <div class="hdr"><h1>Flights</h1><span class="count" id="flightCount"></span></div>
  <div class="addbar"><button class="btn" id="addFlightBtn">Build a flight</button></div>
  <div id="flightList"></div>
</section>

<!-- ======================= MAP ======================= -->
<section id="scr-map" class="screen">
  <div class="hdr"><h1>Where it comes from</h1><span class="count" id="mapCount"></span></div>
  <div class="scroller" id="mapLayers" style="margin-bottom:9px"></div>
  <div class="mapwrap">
    <svg id="map" role="img" aria-label="Map of Scotland showing your distilleries"></svg>
    <div class="mapctl">
      <button id="zIn" aria-label="Zoom in">+</button>
      <button id="zOut" aria-label="Zoom out">−</button>
      <button id="zRe" aria-label="Reset the view">◌</button>
    </div>
  </div>

</section>

</section>

</section>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const APP_VERSION = '0.1.17';
const BUILD_TIME  = '2026-08-31 10:05 PM ET';

/* =====================================================================
   PURE LOGIC — every function below is called by the test harness.
   Render functions do templating only (build rule 30): anything that
   computes lives here, named, and is exercised by dram-test.js.
   ===================================================================== */
const L = {};

/* --- inventory ----------------------------------------------------- */

// A product is pourable when at least one bottle of it is open. Derived,
// never stored: BZ buys a backup of anything he wants to keep having, so
// "do I own two" and "can I pour it" are different questions.
L.pourable = function (key, bottles) {
  return bottles.some(b => b.k === key && b.status === 'open');
};

L.ownedCount = function (key, bottles) {
  return bottles.filter(b => b.k === key && b.status !== 'gone').length;
};

// Secondary over MSRP. Null when either side is missing or zero -- 0.0 in
// the source data means "not recorded", not "worthless".
L.premium = function (msrp, secondary) {
  if (!msrp || !secondary || msrp <= 0 || secondary <= 0) return null;
  return Math.round((secondary / msrp) * 100) / 100;
};

// Exits are not all the same event. A drain pour is an opinion; a gift
// leaves the bottle in existence somewhere else.
L.EXITS = ['finished', 'drain pour', 'gifted', 'traded', 'sold', 'broken'];

L.isDrain = function (reason) { return reason === 'drain pour'; };

// Shelf filtering. Kept out of the render function so the harness can
// exercise it: status, type and free text are three independent gates and
// getting their interaction wrong is silent.
L.shelfFilter = function (products, bottles, opts) {
  const o = opts || {};
  const q = (o.q || '').toLowerCase().trim();
  const types = o.types && o.types.length ? o.types : null;
  return products.filter(p => {
    if (L.ownedCount(p.k, bottles) === 0) return false;
    const open = L.pourable(p.k, bottles);
    if (o.status === 'open' && !open) return false;
    if (o.status === 'sealed' && open) return false;
    if (types && !types.includes(p.sub)) return false;
    if (q && !((p.name || '') + ' ' + (p.dist || '')).toLowerCase().includes(q)) return false;
    return true;
  });
};

/* --- pick my pour --------------------------------------------------- */

// Score a candidate. Higher is a better suggestion tonight. Every term
// has a reason attached so the UI can say WHY, which is the whole point
// of the feature -- an unexplained random pick is just a shuffle.
L.pourScore = function (prod, opts, history) {
  const o = opts || {};
  if (o.maxProof && prod.proof > o.maxProof) return null;
  if (o.style && o.style.length && !o.style.includes(prod.sub)) return null;
  if (o.obsc && o.obsc.length && !o.obsc.includes(prod.obsc)) return null;

  let score = 0;
  const why = [];
  const seen = (history || []).filter(h => h.k === prod.k).length;

  if (seen === 0) { score += 40; why.push('never poured'); }
  else if (seen === 1) { score += 15; why.push('poured once'); }
  else { score -= seen * 6; }

  if (prod.obsc === 'obscure') { score += 18; why.push('nobody you know owns this'); }
  else if (prod.obsc === 'niche') { score += 8; }

  if (prod.scar === 'exclusive') { score += 12; why.push('distillery exclusive'); }
  else if (prod.scar === 'limited') { score += 6; }

  // A bottle finished in something unusual is a better talking point than
  // another ex-bourbon pour.
  if (prod.fin && prod.wine) { score += 7; why.push('finished in ' + prod.fin); }
  else if (prod.fin) { score += 5; why.push(prod.fin); }

  return { k: prod.k, score, why };
};

L.pickPour = function (catalog, bottles, opts, history) {
  const out = [];
  Object.values(catalog).forEach(p => {
    if (!L.pourable(p.k, bottles)) return;
    const s = L.pourScore(p, opts, history);
    if (s) out.push(s);
  });
  out.sort((a, b) => b.score - a.score || a.k.localeCompare(b.k));
  return out;
};

/* --- capitalization -------------------------------------------------- */

// House rule: sentence case for headings, buttons and prose; Title Case for
// data values shown as a label or a chip. Acronyms and the few names with
// their own casing are spelled out rather than guessed at.
L.CASE_FIXED = {
  'msrp': 'MSRP', 'nas': 'NAS', 'px': 'PX', 'str': 'STR', 'abv': 'ABV',
  'american single malt': 'American Malt', 'flavored': 'Flavoured',
  'and': 'and', 'or': 'or', 'the': 'the', 'of': 'of', 'a': 'a', 'n': 'N'
};

L.PROPER = ['islay', 'speyside', 'highland', 'lowland', 'campbeltown',
            'scotch', 'irish', 'tennessee', 'kentucky', 'american', 'japanese',
            'canadian', 'americans', 'ardbeg', 'laphroaig', 'cairdeas', 'aberlour',
            'blanton', 'pappy'];
// Names of more than one word have to be matched before the string is split
// into words, or only the first half gets its capital.
L.PROPER_PHRASES = [['gray label', 'Gray Label'], ['van winkle', 'Van Winkle'],
                    ['single malt', 'single malt']];

// Sentence case for a heading: first letter up, the rest down, except the
// proper nouns and acronyms that carry their own capitals.
L.sentenceCase = function (s) {
  if (!s) return '';
  let str = String(s).trim().toLowerCase();
  const held = [];
  L.PROPER_PHRASES.forEach(([find, rep], i) => {
    if (str.indexOf(find) >= 0) {
      str = str.split(find).join('\u0000' + i + '\u0000');
      held.push(rep);
    }
  });
  const words = str.split(/\s+/);
  const out = words.map((w, i) => {
    const bare = w.replace(/[^a-z']/g, '');
    if (L.CASE_FIXED[bare] && bare !== 'a' && bare !== 'the'
        && bare !== 'and' && bare !== 'of' && bare !== 'or' && bare !== 'n') {
      return w.replace(bare, L.CASE_FIXED[bare]);
    }
    if (L.PROPER.indexOf(bare) >= 0) {
      return w.replace(bare, bare.charAt(0).toUpperCase() + bare.slice(1));
    }
    return w;
  });
  let joined = out.join(' ');
  L.PROPER_PHRASES.forEach(([find, rep], i) => {
    joined = joined.split('\u0000' + i + '\u0000').join(rep);
  });
  return joined.charAt(0).toUpperCase() + joined.slice(1);
};

L.titleCase = function (s) {
  if (s === null || s === undefined || s === '') return '';
  const whole = String(s).trim().toLowerCase();
  if (L.CASE_FIXED[whole]) return L.CASE_FIXED[whole];
  return String(s).trim().split(/\s+/).map((w, i) => {
    const lw = w.toLowerCase();
    if (L.CASE_FIXED[lw]) return i === 0 ? L.CASE_FIXED[lw].charAt(0).toUpperCase()
      + L.CASE_FIXED[lw].slice(1) : L.CASE_FIXED[lw];
    // Keep an already-capitalised interior (McKenna, A'Bunadh) intact.
    if (/[A-Z]/.test(w.slice(1))) return w;
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  }).join(' ');
};

/* --- the reels: Time for a Taste ------------------------------------- */

// Four reels. Each face is a predicate over a product, so a spin result is
// just a set of filters -- the machine picks nothing on its own, it narrows
// the shelf and the room picks from what lines up.
L.REELS = [
  { id: 'proof', label: 'Proof', faces: [
    { v: 'any',     t: 'Any' },
    { v: 'le90',    t: '\u226490' },
    { v: '90-105',  t: '90\u2013105' },
    { v: '105-120', t: '105\u2013120' },
    { v: 'ge120',   t: '120+' } ] },
  // Real categories only. 'American single malt' is a legal standard of
  // identity (TTB, effective January 2025), not a bucket -- and single malt
  // itself is a construction that cuts across Scotch, Irish and Japanese,
  // so it cannot be a peer of bourbon.
  { id: 'type', label: 'Type', faces: [
    { v: 'any',                  t: 'Any' },
    { v: 'bourbon',              t: 'Bourbon' },
    { v: 'tennessee',            t: 'Tennessee' },
    { v: 'rye',                  t: 'Rye' },
    { v: 'wheat',                t: 'Wheat' },
    { v: 'american single malt', t: 'American Malt' },
    { v: 'scotch',               t: 'Scotch' },
    { v: 'irish',                t: 'Irish' },
    { v: 'canadian',             t: 'Canadian' },
    { v: 'japanese',             t: 'Japanese' },
    { v: 'world',                t: 'World' },
    { v: 'flavored',             t: 'Flavoured' },
    { v: 'tequila',              t: 'Tequila' } ] },
  { id: 'obsc', label: 'Recognition', faces: [
    { v: 'any',     t: 'Any' },
    { v: 'known',   t: 'Known' },
    { v: 'niche',   t: 'Niche' },
    { v: 'obscure', t: 'Obscure' } ] },
  { id: 'price', label: 'Occasion', faces: [
    { v: 'any',      t: 'Any' },
    { v: 'everyday', t: 'Everyday' },
    { v: 'good',     t: 'Good' },
    { v: 'special',  t: 'Special' },
    { v: 'vault',    t: 'Vault' } ] }
];

// Every face is an exact subcategory match now, so nothing is swept into a
// catch-all and no bottle is unreachable.
L.TYPES = ['bourbon', 'tennessee', 'rye', 'wheat', 'american single malt',
           'scotch', 'irish', 'canadian', 'japanese', 'world',
           'flavored', 'tequila'];

// The six regions the Scotch Whisky Regulations recognise. Blends and
// independent bottlings draw from everywhere, so they carry no region.
L.SCOTCH_REGIONS = ['Islay', 'Speyside', 'Highland', 'Islands',
                    'Lowland', 'Campbeltown'];

L.faceMatch = function (reelId, face, p) {
  if (!face || face === 'any') return true;
  if (reelId === 'proof') {
    const n = p.proof;
    if (face === 'le90') return n <= 90;
    if (face === '90-105') return n > 90 && n <= 105;
    if (face === '105-120') return n > 105 && n <= 120;
    if (face === 'ge120') return n > 120;
    return true;
  }
  if (reelId === 'type') return (p.sub || '').toLowerCase() === face;
  if (reelId === 'obsc') return p.obsc === face;
  if (reelId === 'price') return L.priceBand(p.msrp) === face;
  return true;
};

// Occasion, said the way a host says it rather than the way a receipt does.
L.priceBand = function (msrp) {
  if (!msrp || msrp <= 0) return null;
  if (msrp < 50) return 'everyday';
  if (msrp < 100) return 'good';
  if (msrp < 200) return 'special';
  return 'vault';
};

// Spin the reels that are not held. rnd is injectable so the harness can
// drive it deterministically.
L.spin = function (current, held, rnd) {
  const r = rnd || Math.random;
  const out = {};
  L.REELS.forEach(reel => {
    if (held && held[reel.id]) { out[reel.id] = current[reel.id] || 'any'; return; }
    out[reel.id] = reel.faces[Math.floor(r() * reel.faces.length)].v;
  });
  return out;
};

// Everything open that matches every reel. Three glasses get filled from the
// top of this, ranked by the same scorer the shelf uses.
L.reelMatches = function (catalog, bottles, reels, history) {
  const hits = [];
  Object.values(catalog).forEach(p => {
    if (!L.pourable(p.k, bottles)) return;
    if (p.drained) return;
    const ok = L.REELS.every(reel => L.faceMatch(reel.id, reels[reel.id], p));
    if (!ok) return;
    const s = L.pourScore(p, {}, history);
    if (s) hits.push(s);
  });
  hits.sort((a, b) => b.score - a.score || a.k.localeCompare(b.k));
  return hits;
};

// Three glasses. A tight filter fills fewer, which is the honest signal that
// the reels are asking for something the shelf does not have.
L.GLASSES = 3;
L.pourGlasses = function (catalog, bottles, reels, history) {
  return L.reelMatches(catalog, bottles, reels, history).slice(0, L.GLASSES);
};

/* --- the map --------------------------------------------------------- */

// Equirectangular with the longitude axis scaled by cos(latitude). Over a
// country the size of Scotland this is accurate enough that the distilleries
// sit where they really are, which is the whole point: Three Miles Apart is
// only a flight because Ardbeg, Lagavulin and Laphroaig genuinely are.
L.MAP_LAT0 = 56.8;

L.project = function (lon, lat) {
  return [lon * Math.cos(L.MAP_LAT0 * Math.PI / 180), -lat];
};

// Fit a set of projected points into a viewBox with a margin.
L.mapExtent = function (rings, pad) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  rings.forEach(r => r.forEach(pt => {
    const [x, y] = L.project(pt[0], pt[1]);
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }));
  const m = pad === undefined ? 0.1 : pad;
  return { x: x0 - m, y: y0 - m, w: (x1 - x0) + m * 2, h: (y1 - y0) + m * 2 };
};

// One pin per distillery: how many bottles, which region, where.
L.mapPins = function (catalog, coords, bottles) {
  const by = {};
  Object.values(catalog).forEach(p => {
    if (p.sub !== 'scotch' || !coords[p.dist]) return;
    const e = by[p.dist] || (by[p.dist] = {
      dist: p.dist, region: p.region || null, lon: coords[p.dist][0],
      lat: coords[p.dist][1], total: 0, open: 0, keys: [] });
    e.total++;
    e.keys.push(p.k);
    if (L.pourable(p.k, bottles)) e.open++;
  });
  return Object.values(by).sort((a, b) => b.total - a.total || a.dist.localeCompare(b.dist));
};

// Pin radius by bottle count. Square-rooted so twelve Laphroaigs read as
// bigger than one Bladnoch without swamping the island they sit on.
L.pinRadius = function (n) { return Math.round((0.9 + Math.sqrt(n) * 0.55) * 100) / 100; };

// Clamp a zoom level to the range the map supports. 1 is all of Scotland;
// 40 is close enough to separate the three south-coast Islay distilleries.
L.MAP_ZOOM = { min: 1, max: 40 };
L.clampZoom = function (z) {
  return Math.min(L.MAP_ZOOM.max, Math.max(L.MAP_ZOOM.min, z));
};

// Keep the visible window inside the map: panning off into blank space is
// disorienting on a phone where the gesture is easy to overshoot.
L.clampView = function (view, full) {
  const w = Math.min(view.w, full.w), h = Math.min(view.h, full.h);
  return {
    x: Math.min(Math.max(view.x, full.x), full.x + full.w - w),
    y: Math.min(Math.max(view.y, full.y), full.y + full.h - h),
    w: w, h: h
  };
};

// Zoom about a point so pinching and double-tap keep that point still.
L.zoomAbout = function (view, full, factor, fx, fy) {
  const z = L.clampZoom((full.w / view.w) * factor);
  const w = full.w / z, h = full.h / z;
  return L.clampView({ x: fx - (fx - view.x) * (w / view.w),
                       y: fy - (fy - view.y) * (h / view.h), w: w, h: h }, full);
};

/* --- map layers ------------------------------------------------------ */

// Three layers, because the useful unit of place changes with the country.
// Scotland has tasting regions; the US has states; everywhere else a single
// dot is the whole truth.
L.MAP_LAYERS = ['world', 'us', 'scotland'];

L.countryOf = function (p, subCountry, worldDist) {
  return (worldDist && worldDist[p.dist]) || (subCountry && subCountry[p.sub]) || null;
};

L.countryCounts = function (catalog, subCountry, worldDist, bottles) {
  const by = {};
  Object.values(catalog).forEach(p => {
    const c = L.countryOf(p, subCountry, worldDist);
    if (!c) return;
    const e = by[c] || (by[c] = { name: c, total: 0, open: 0, keys: [] });
    e.total++; e.keys.push(p.k);
    if (L.pourable(p.k, bottles)) e.open++;
  });
  return Object.values(by).sort((a, b) => b.total - a.total);
};

L.US_SUBS = ['bourbon', 'rye', 'tennessee', 'wheat', 'american single malt', 'flavored'];

L.stateCounts = function (catalog, stateOf, bottles) {
  const by = {};
  Object.values(catalog).forEach(p => {
    if (L.US_SUBS.indexOf(p.sub) < 0) return;
    const s = stateOf[p.dist];
    if (!s) return;                      // unconfirmed bottler: not placed
    const e = by[s] || (by[s] = { name: s, total: 0, open: 0, keys: [] });
    e.total++; e.keys.push(p.k);
    if (L.pourable(p.k, bottles)) e.open++;
  });
  return by;
};

// Choropleth steps. Kentucky holds 126 bottles and Nevada holds one, so a
// linear ramp would paint everything but Kentucky the same colour.
L.CHORO = [0, 1, 3, 8, 20, 60];
L.choroStep = function (n) {
  if (!n) return 0;
  let s = 1;
  for (let i = 1; i < L.CHORO.length; i++) if (n >= L.CHORO[i]) s = i;
  return s;
};

/* --- shopping -------------------------------------------------------- */

// Loose name match against what is already owned. The question in a shop is
// "do I have this already", and the answer has to survive the shelf calling
// it "Aberlour A'Bunadh Alba" while the label says "A'bunadh Alba".
L.shopNorm = function (s) {
  return String(s || '').toLowerCase()
    .replace(/[\u2019']/g, '')
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\b(whisky|whiskey|bourbon|straight|kentucky|single|malt|scotch|irish|the|year|years|yr|old)\b/g, ' ')
    .split(/\s+/).filter(Boolean).join(' ');
};

L.shopSearch = function (q, catalog, limit) {
  const t = L.shopNorm(q);
  if (t.length < 2) return [];
  const words = t.split(' ');
  const hits = [];
  Object.values(catalog).forEach(p => {
    const n = L.shopNorm(p.name + ' ' + p.dist);
    let score = 0;
    words.forEach(w => { if (n.indexOf(w) >= 0) score++; });
    if (!score) return;
    hits.push({ p: p, score: score / words.length });
  });
  hits.sort((a, b) => b.score - a.score || a.p.name.localeCompare(b.p.name));
  return hits.slice(0, limit || 8);
};

// "scotchs" and "irishs" are what a naive plural gives you. Categories that
// are already mass nouns or end in a sibilant stay as they are.
L.NO_PLURAL = ['scotch', 'irish', 'wheat', 'world', 'tequila', 'canadian',
               'japanese', 'american single malt', 'flavored'];
L.plural = function (word, n) {
  if (n === 1) return word;
  return L.NO_PLURAL.indexOf(word) >= 0 ? word + ' bottles' : word + 's';
};

L.median = function (nums) {
  const a = (nums || []).slice().sort((x, y) => x - y);
  if (!a.length) return 0;
  const m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
};

// Does a candidate add anything to THIS shelf? Every finding is derived
// from the collection, so it works with no lookup service and no network.
L.shelfFit = function (cand, catalog, bottles) {
  const out = { findings: [], own: null, neighbours: [], pairs: [] };
  const all = Object.values(catalog);
  const candNorm = L.shopNorm(cand.name);

  const owned = all.filter(p => L.shopNorm(p.name) === candNorm);
  if (owned.length) {
    const k = owned[0].k;
    const n = L.ownedCount(k, bottles);
    const open = L.pourable(k, bottles);
    out.own = { key: k, count: n, open: open };
    // The stocking rule: a backup of something worth keeping is a deliberate
    // purchase, not a duplicate.
    out.findings.push(open && n === 1
      ? { level: 'ok', msg: 'You own one, open. A sealed backup fits your stocking rule.' }
      : { level: 'warn', msg: 'You already own ' + n + ' of these.' });
  }

  if (cand.dist && !all.some(p => p.dist === cand.dist)) {
    out.findings.push({ level: 'ok', msg: 'A distillery you do not own yet.' });
  }
  if (cand.sub && !all.some(p => p.sub === cand.sub)) {
    out.findings.push({ level: 'ok', msg: 'A category you do not own yet.' });
  }
  if (cand.region && !all.some(p => p.region === cand.region)) {
    out.findings.push({ level: 'ok', msg: cand.region + ' would be new to the shelf.' });
  }
  if (cand.fin && !all.some(p => p.fin === cand.fin)) {
    out.findings.push({ level: 'ok', msg: 'A finish you do not have: ' + cand.fin + '.' });
  }

  if (cand.proof) {
    // How crowded is this corner? Same category, within five proof points --
    // close enough that a flight would treat them as peers.
    out.neighbours = all.filter(p => p.sub === cand.sub
      && Math.abs(p.proof - cand.proof) <= 5
      && L.shopNorm(p.name) !== candNorm);
    if (out.neighbours.length >= 5) {
      out.findings.push({ level: 'warn', msg: 'You already own ' + out.neighbours.length
        + ' ' + L.plural(cand.sub, out.neighbours.length)
        + ' within five proof points of this.' });
    } else if (out.neighbours.length === 0) {
      out.findings.push({ level: 'ok', msg: 'Nothing else on the shelf sits near it.' });
    }

    // A matched pair is the strongest flight shape there is: same house,
    // same proof, one perceptible difference.
    out.pairs = all.filter(p => p.dist === cand.dist
      && Math.abs(p.proof - cand.proof) <= 1
      && L.shopNorm(p.name) !== candNorm);
    if (out.pairs.length) {
      out.findings.push({ level: 'ok', msg: 'Matched pair with '
        + out.pairs[0].name + ' at ' + out.pairs[0].proof + '.' });
    }
  }

  if (cand.msrp) {
    const band = L.priceBand(cand.msrp);
    const same = all.filter(p => p.sub === cand.sub && p.msrp).map(p => p.msrp);
    const med = L.median(same);
    out.findings.push({ level: 'info', msg: L.titleCase(band)
      + (med ? ' \u2014 your ' + cand.sub + ' median is $' + Math.round(med) + '.' : '.') });
  }
  if (cand.scar && cand.scar !== 'standard') {
    out.findings.push({ level: 'info', msg: L.titleCase(cand.scar) + ' release.' });
  }
  return out;
};

// One line, counted from the findings rather than an invented score, so the
// reasoning behind it stays on screen.
L.fitVerdict = function (fit) {
  // Owning it already settles the question before any other finding counts.
  if (fit.own) {
    return fit.own.count > 1 ? 'You have this covered.'
      : 'You have it open. This would be the backup.';
  }
  // The stocking finding is excluded above, so what is left is genuinely new
  // ground rather than shelf maintenance.
  const good = fit.findings.filter(f => f.level === 'ok').length;
  const bad = fit.findings.filter(f => f.level === 'warn').length;
  if (good === 0 && bad) return 'It duplicates what you have.';
  if (good >= 2) return 'It adds something the shelf lacks.';
  if (good === 1) return 'A modest addition.';
  return 'Nothing either way \u2014 buy it if you want to drink it.';
};
