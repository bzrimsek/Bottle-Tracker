    def: 'A spotted pour is named and shown before tasting; a blind pour is not. A spotted control lets the room measure rather than hunt.' },
  { term: 'Matched pair',
    def: 'Two pours at the same proof differing in one perceptible way. The strongest shape a flight can take.' },
  { term: 'The ask',
    def: 'The one column with a right answer. Written and collected before it is discussed.' }
 ]}
];

L.refGroup = function (id) {
  const g = L.REF_GROUPS.find(x => x.id === id) || L.REF_GROUPS[0];
  return L[g.data];
};

L.referenceCount = function (id) {
  const groups = id ? [L.refGroup(id)] : L.REF_GROUPS.map(g => L[g.data]);
  return groups.reduce((n, sec) => n + sec.reduce((m, s) => m + s.items.length, 0), 0);
};

// A search with a term in it looks across every group, because someone
// searching for "char" does not know or care which tab it lives on.
L.searchReference = function (q, id) {
  const t = (q || '').toLowerCase().trim();
  if (!t) return L.refGroup(id);
  const out = [];
  L.REF_GROUPS.forEach(g => {
    L[g.data].forEach(s => {
      const items = s.items.filter(i =>
        (i.term + ' ' + i.def + ' ' + (i.src || '')).toLowerCase().includes(t));
      if (items.length) out.push(Object.assign({}, s, { items: items, group: g.label }));
    });
  });
  return out;
};

/* --- summary ---------------------------------------------------------- */

// Bar-chart rows: one series, sorted by size, labelled with its value. No
// pies -- a pie makes the reader compare angles when they want to compare
// lengths.
L.barRows = function (counts, opts) {
  const o = opts || {};
  const rows = Object.keys(counts).map(k => ({ label: k, n: counts[k] }));
  rows.sort((a, b) => o.keepOrder ? 0 : (b.n - a.n || a.label.localeCompare(b.label)));
  const max = rows.reduce((m, r) => Math.max(m, r.n), 0);
  return rows.map(r => Object.assign({}, r,
    { pct: max ? Math.round((r.n / max) * 1000) / 10 : 0 }));
};

L.countBy = function (items, fn) {
  const out = {};
  items.forEach(x => { const k = fn(x); if (k !== null && k !== undefined) out[k] = (out[k] || 0) + 1; });
  return out;
};

// What the shelf is worth at MSRP, and what it cost. Bottles, not products:
// two sealed spares are two bottles of value.
L.shelfValue = function (catalog, bottles) {
  let msrp = 0, paid = 0, priced = 0, gone = 0;
  bottles.forEach(b => {
    if (b.status === 'gone') { gone++; return; }
    const p = catalog[b.k];
    if (p && p.msrp) { msrp += p.msrp; priced++; }
    if (b.paid) paid += b.paid;
  });
  return { msrp: Math.round(msrp), paid: Math.round(paid), priced: priced, gone: gone };
};

L.shelfStats = function (catalog, bottles) {
  const live = bottles.filter(b => b.status !== 'gone');
  const open = live.filter(b => b.status === 'open');
  const prods = {};
  live.forEach(b => { if (catalog[b.k]) prods[b.k] = 1; });
  return { bottles: live.length, open: open.length,
           sealed: live.length - open.length, products: Object.keys(prods).length,
           gone: bottles.length - live.length };
};

// Most recent first, and only entries whose product still exists.
L.recent = function (list, catalog, n) {
  return (list || []).filter(x => catalog[x.k])
    .slice().reverse().slice(0, n || 5);
};

/* --- add / edit / delete -------------------------------------------- */

// The shared catalog is reference data. A user's corrections, additions and
// removals are layered on top, so nothing the app ships with is ever
// destroyed -- deleting a stock product hides it for you alone.
L.mergeCatalog = function (base, edits, custom, deleted) {
  const out = {};
  Object.keys(base || {}).forEach(k => {
    if (deleted && deleted[k]) return;
    out[k] = (edits && edits[k]) ? Object.assign({}, base[k], edits[k]) : base[k];
  });
  Object.keys(custom || {}).forEach(k => {
    if (deleted && deleted[k]) return;
    out[k] = (edits && edits[k]) ? Object.assign({}, custom[k], edits[k]) : custom[k];
  });
  return out;
};

L.PRODUCT_FIELDS = ['name', 'dist', 'proof', 'sub', 'style', 'age', 'fin',
                    'msrp', 'sec', 'obsc', 'scar', 'size'];

// Reject what cannot be stored rather than storing a broken record. Name and
// proof are the identity; everything else can be filled in later.
L.validateProduct = function (f) {
  const errs = [];
  const name = (f.name || '').trim();
  if (name.length < 2) errs.push('Name is required.');
  const proof = parseFloat(f.proof);
  if (!(proof > 0)) errs.push('Proof is required.');
  else if (proof < 20 || proof > 200) errs.push('Proof must be between 20 and 200.');
  if (f.msrp !== '' && f.msrp !== undefined && f.msrp !== null
      && isNaN(parseFloat(f.msrp))) errs.push('Price must be a number.');
  if (f.age !== '' && f.age !== undefined && f.age !== null && f.age !== '') {
    const a = parseFloat(f.age);
    if (isNaN(a) || a < 1 || a > 80) errs.push('Age must be 1 to 80 years, or blank.');
  }
  return errs;
};

L.normalizeProduct = function (f) {
  const num = v => (v === '' || v === undefined || v === null) ? null : parseFloat(v);
  const p = {
    k: (f.k || '').trim() || (f.name || '').trim(),
    name: (f.name || '').trim(),
    dist: (f.dist || '').trim(),
    proof: parseFloat(f.proof),
    sub: (f.sub || 'bourbon').trim(),
    style: (f.style || '').trim(),
    age: num(f.age), msrp: num(f.msrp), sec: num(f.sec),
    fin: (f.fin || '').trim() || null,
    obsc: f.obsc || 'known', scar: f.scar || 'standard',
    size: num(f.size) || 750
  };
  p.wine = p.fin ? L.finIsWine(p.fin) : null;
  return p;
};

// Same wood-versus-wine split the enrichment pass uses, so a hand-typed
// finish classifies the way an imported one does.
L.WOOD_ONLY = ['Toasted Oak', 'French Oak', 'Virgin Oak', 'Mizunara',
               'Hungarian Oak', 'Chinkapin Oak', 'American Oak', 'Amburana'];
L.UNKNOWN_CASK = ['Multi-cask', 'STR'];
L.finIsWine = function (fin) {
  if (!fin) return null;
  const parts = String(fin).split('+').map(s => s.trim()).filter(Boolean);
  if (!parts.length) return null;
  if (parts.every(p => L.UNKNOWN_CASK.indexOf(p) >= 0)) return null;
  return parts.some(p => L.WOOD_ONLY.indexOf(p) < 0 && L.UNKNOWN_CASK.indexOf(p) < 0);
};

// Bottle ids must not collide with the shipped B001..B344 range.
L.nextBottleId = function (bottles) {
  let max = 0;
  (bottles || []).forEach(b => {
    const m = /^B(\d+)$/.exec(b.id || '');
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return 'B' + String(max + 1).padStart(3, '0');
};

// A product cannot be deleted while bottles of it remain -- that would strand
// them. Retire the bottles first.
L.canDeleteProduct = function (key, bottles) {
  return !(bottles || []).some(b => b.k === key && b.status !== 'gone');
};

/* --- notes ----------------------------------------------------------- */

// Everything the app knows about one bottle, gathered from every source it
// came from, plus whatever the user has written. Each note carries its
// origin so a producer fact never gets confused with a tasting impression.
L.notesFor = function (p, flights, userNote) {
  const out = [];
  if (!p) return out;
  if (p.notes) out.push({ src: 'inventory', text: p.notes });
  if (p.msrpNote) out.push({ src: 'price', text: p.msrpNote });
  if (p.fin) {
    out.push({ src: 'cask',
      text: p.fin.split('+').join(', ')
            + (p.wine === true ? ' \u2014 a wine cask'
             : p.wine === false ? ' \u2014 wood only, no wine' : '') });
  }
  if (p.region) out.push({ src: 'region', text: p.region });
  // The flight cards carry a line of host prose per pour; surface the ones
  // that mention this bottle.
  (flights || []).forEach(f => {
    const i = (f.core || []).findIndex(x => x.k === p.k);
    if (i < 0) return;
    const card = (f.cards || [])[i];
    if (card && card.wood) out.push({ src: f.title.toLowerCase(), text: card.wood });
  });
  if (userNote) out.push({ src: 'you', text: userNote });
  return out;
};

/* --- flight editing -------------------------------------------------- */

L.newFlight = function (title) {
  return { title: (title || 'NEW FLIGHT').toUpperCase(), tag: '', premise: '',
           why: [], core: [], ext: [], cards: [], custom: true };
};

// Pour letters are positional: removing pour C makes the old D into C, so
// they are always relabelled from the current order rather than stored.
L.relabel = function (pours) {
  return (pours || []).map((p, i) => Object.assign({}, p, {
    letter: String.fromCharCode(65 + i), ord: i + 1 }));
};

L.addPour = function (pours, key) {
  return L.relabel((pours || []).concat([{ k: key, role: 'core' }]));
};

L.removePour = function (pours, idx) {
  const out = (pours || []).slice();
  out.splice(idx, 1);
  return L.relabel(out);
};

L.movePour = function (pours, idx, delta) {
  const out = (pours || []).slice();
  const to = idx + delta;
  if (to < 0 || to >= out.length) return L.relabel(out);
  const [x] = out.splice(idx, 1);
  out.splice(to, 0, x);
  return L.relabel(out);
};

// Order the pours by ascending proof -- the house rule, applied in one call.
L.sortByProof = function (pours, catalog) {
  const out = (pours || []).slice().sort((a, b) => {
    const pa = catalog[a.k], pb = catalog[b.k];
    return ((pa && pa.proof) || 0) - ((pb && pb.proof) || 0);
  });
  return L.relabel(out);
};

/* --- flight design -------------------------------------------------- */

L.CORE_TARGET = 6;
L.EXT_TARGET = 4;

// Position a pour on the ladder by its real proof, not by its index, so
// three Cairdeas bottlings 0.4 apart visibly cluster.
L.ladderOffsets = function (proofs) {
  if (!proofs.length) return [];
  const lo = Math.min(...proofs), hi = Math.max(...proofs);
  const span = hi - lo;
  return proofs.map(p => span === 0 ? 0.5
    : Math.round(((p - lo) / span) * 10000) / 10000);
};

// Validate a flight instance against BZ's own build rules. Failing a check
// is a warning with a reason, never a block -- the proof rule has been
// deliberately overridden three times already.
L.validate = function (pours, catalog, opts) {
  const o = opts || {};
  const msgs = [];
  const prods = pours.map(p => catalog[p.k]).filter(Boolean);

  if (pours.length !== (o.coreTarget || L.CORE_TARGET)) {
    msgs.push({ level: 'warn', msg: pours.length + ' core pours, not ' +
      (o.coreTarget || L.CORE_TARGET) });
  }

  const proofs = prods.map(p => p.proof);
  let ascends = true;
  for (let i = 1; i < proofs.length; i++) if (proofs[i] < proofs[i - 1]) ascends = false;
  if (!ascends && !o.allowDescent) {
    msgs.push({ level: 'warn', msg: 'proof does not ascend — flag it or reorder' });
  }

  // "One obscure pour minimum" tests recognition, not price. The imported
  // rarity label would pass a Weller here, which is exactly backwards.
  const obscure = prods.filter(p => p.obsc === 'obscure').length;
  if (obscure < 1) msgs.push({ level: 'warn', msg: 'no obscure pour — every flight needs one' });
  else msgs.push({ level: 'ok', msg: obscure + ' obscure pour' + (obscure > 1 ? 's' : '') });

  const unpourable = prods.filter(p => !L.pourable(p.k, o.bottles || []));
  if (unpourable.length) {
    msgs.push({ level: 'warn', msg: unpourable.length + ' pour' +
      (unpourable.length > 1 ? 's are' : ' is') + ' not open: ' +
      unpourable.map(p => p.name.slice(0, 28)).join(', ') });
  }

  // Matched pairs are the strongest flight shape BZ has found: identical
  // proof, one perceptible difference.
  const pairs = [];
  for (let i = 0; i < prods.length; i++)
    for (let j = i + 1; j < prods.length; j++)
      if (Math.abs(prods[i].proof - prods[j].proof) <= 0.4) pairs.push([i, j]);
  if (pairs.length) {
    msgs.push({ level: 'ok', msg: pairs.length + ' matched pair' +
      (pairs.length > 1 ? 's' : '') + ' at proof' });
  }
  return msgs;
};

// How often a product has already been poured, across every flight and
// every recorded run. Overuse control: run two should not be run one with
// two bottles changed.
L.useCount = function (key, flights, history) {
  let n = 0;
  (flights || []).forEach(f => f.core.forEach(p => { if (p.k === key) n++; }));
  (history || []).forEach(h => { if ((h.pours || []).includes(key)) n++; });
  return n;
};

L.overused = function (keys, flights, history, limit) {
  const cap = limit || 3;
  return keys.filter(k => L.useCount(k, flights, history) > cap);
};

/* --- snacks --------------------------------------------------------- */

// BZ's rule: simple bowls, not plates. No vinegar, no citrus -- both
// wreck the palate for the next pour. Suggestions follow the dominant
// cask, because that is what the snack has to sit beside.
L.SNACKS = {
  sherry: ['dark chocolate', 'dried cherries', 'salted pecans'],
  wine:   ['dark chocolate', 'dried figs', 'marcona almonds'],
  wood:   ['salted pecans', 'shortbread', 'toasted walnuts'],
  peat:   ['smoked almonds', 'aged cheddar', 'oatcakes'],
  plain:  ['plain crackers', 'salted almonds', 'shortbread']
};

L.snacksFor = function (prods) {
  const fin = prods.map(p => (p.fin || '')).join(' ').toLowerCase();
  const peated = prods.some(p => /laphroaig|ardbeg|lagavulin|octomore|peat|caol|bunnahabhain/i
    .test(p.name + ' ' + p.dist));
  if (peated) return L.SNACKS.peat;
  if (/ximenez|oloroso|sherry|fino|manzanilla|amontillado|cream/.test(fin)) return L.SNACKS.sherry;
  if (/port|madeira|moscatel|sauternes|bordeaux|rum|cognac|armagnac/.test(fin)) return L.SNACKS.wine;
  if (/oak|toasted|mizunara|amburana/.test(fin)) return L.SNACKS.wood;
  return L.SNACKS.plain;
};

/* --- SMS summary ---------------------------------------------------- */

// One identical text to everyone: the bottle list and the theme. Sent
// after the reveal, so it is the answer key people keep.
L.smsBody = function (flight, prods) {
  const lines = [flight.title, L.variableOf(flight)];
  prods.forEach((p, i) => {
    const letter = String.fromCharCode(65 + i);
    const bits = [p.name, p.fin, p.proof].filter(Boolean);
    lines.push(letter + ' \u00b7 ' + bits.join(', '));
  });
  lines.push('Snacks: ' + L.snacksFor(prods).join(', '));
  return lines.join('\n');
};

// The tag line carries "ONE VARIABLE: WHICH SHERRY" on most cards.
L.variableOf = function (flight) {
  const m = /ONE VARIABLE:\s*([^\u00b7]+)/i.exec(flight.tag || '');
  if (m) return 'One variable: ' + m[1].trim().toLowerCase();
  return (flight.tag || '').split('\u00b7').slice(-1)[0].trim();
};

/* =====================================================================
   STATE + RENDER
   ===================================================================== */
const S = { base: {}, catalog: {}, bottles: [], flights: [], history: [],
            edits: {}, custom: {}, deleted: {}, customFlights: [],
            filters: { status: 'open', types: [] }, refGroup: 'tasting', shop: {},
            reels: { proof: 'any', type: 'any', obsc: 'any', price: 'any' },
            held: {} };

// The effective catalog is the shipped reference data with the user's
// corrections layered on, their own bottles added, and their deletions
// hidden. Rebuilt whenever any of those three change.
function rebuildCatalog() {
  S.catalog = L.mergeCatalog(S.base, S.edits, S.custom, S.deleted);
}

const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };

const KEYS = ['history', 'edits', 'custom', 'deleted', 'customFlights', 'bottles'];

// Private browsing and locked-down browsers throw on the first touch of
// localStorage. The app runs either way; it just cannot remember.
const CAN_STORE = (function () {
  try {
    localStorage.setItem('kb.probe', '1');
    localStorage.removeItem('kb.probe');
    return true;
  } catch (e) { return false; }
})();

function load() {
  if (!CAN_STORE) return;
  KEYS.forEach(k => {
    try {
      const raw = localStorage.getItem('kb.' + k);
      if (!raw) return;
      const val = JSON.parse(raw);
      // One corrupt key must not take the rest of the shelf down with it, and
      // a value of the wrong shape is corruption too.
      const wantArray = Array.isArray(S[k]);
      if (wantArray !== Array.isArray(val)) throw new Error('shape');
      S[k] = val;
    } catch (e) {
      console.warn('discarding unreadable ' + k, e);
      try { localStorage.removeItem('kb.' + k); } catch (e2) { /* nothing to do */ }
    }
  });
}

let _storageWarned = false;
function save_() {
  if (!CAN_STORE) {
    if (!_storageWarned && typeof toast === 'function') {
      _storageWarned = true;
      toast('This browser will not let the app save. Changes last until you close it.');
    }
    return;
  }
  try {
    KEYS.forEach(k => localStorage.setItem('kb.' + k, JSON.stringify(S[k])));
  } catch (e) {
    // Quota, almost always. Say so rather than failing silently, because the
    // user is about to lose an edit they think landed.
    if (typeof toast === 'function') toast('Could not save — storage is full.');
    console.warn('save failed', e);
  }
}

// Read order: your override, then the shared catalog. The UI shows which
// layer a value came from so you always know what you are trusting.
function prod(k) { return S.catalog[k] || null; }

function show(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  const t = document.getElementById('scr-' + name);
  if (t) t.classList.add('on');
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.scr === name ? 'page' : 'false'));
  window.scrollTo(0, 0);
}

/* --- shelf ---------------------------------------------------------- */
const STATUS_FILTERS = [['open', 'Open'], ['sealed', 'Sealed'], ['all', 'All']];

function renderShelfFilters() {
  const box = $('#shelfFilters'); box.innerHTML = '';
  STATUS_FILTERS.forEach(([v, label]) => {
    const b = el('button', 'chip', label);
    b.setAttribute('aria-pressed', S.filters.status === v);
    b.onclick = () => { S.filters.status = v; renderShelfFilters(); renderShelf(); };
    box.appendChild(b);
  });

  const tb = $('#typeFilters'); tb.innerHTML = '';
  const counts = {};
  Object.values(S.catalog).forEach(p => { counts[p.sub] = (counts[p.sub] || 0) + 1; });
  const types = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const all = el('button', 'chip', 'All types');
  all.setAttribute('aria-pressed', S.filters.types.length === 0);
  all.onclick = () => { S.filters.types = []; renderShelfFilters(); renderShelf(); };
  tb.appendChild(all);
  types.forEach(t => {
    const b = el('button', 'chip', L.titleCase(t) + ' ' + counts[t]);
    b.setAttribute('aria-pressed', S.filters.types.includes(t));
    b.onclick = () => {
      const i = S.filters.types.indexOf(t);
      if (i < 0) S.filters.types.push(t); else S.filters.types.splice(i, 1);
      renderShelfFilters(); renderShelf();
    };
    tb.appendChild(b);
  });
}

function shelfRows() {
  const all = Object.keys(S.catalog).map(prod).filter(Boolean);
  const hits = L.shelfFilter(all, S.bottles, {
    q: $('#q').value, status: S.filters.status, types: S.filters.types
  });
  return hits.map(p => ({ p, open: L.pourable(p.k, S.bottles),
                          owned: L.ownedCount(p.k, S.bottles) }))
             .sort((a, b) => a.p.name.localeCompare(b.p.name));
}

function renderShelf() {
  const list = $('#shelfList'); list.innerHTML = '';
  const rows = shelfRows();
  $('#shelfCount').textContent = rows.length + ' of ' + Object.keys(S.catalog).length;
  if (!rows.length) {
    list.appendChild(el('div', 'empty', 'Nothing matches. Clear the search or switch filters.'));
    return;
  }
  rows.forEach(({ p, open, owned }) => {
    const b = el('button', 'item ' + typeClass(p) + (open ? '' : ' sealed'));
    const left = el('div');
    const nm = el('div', 'nm'); nm.innerHTML = '<span class="dot"></span>';
    nm.appendChild(document.createTextNode(p.name));
    left.appendChild(nm);
    left.appendChild(el('div', 'sub',
      [p.dist, owned > 1 ? owned + ' bottles' : null].filter(Boolean).join(' \u00b7 ')));
    b.appendChild(left);
    b.appendChild(el('div', 'ty', L.titleCase(p.style || p.sub)));
    b.appendChild(el('div', 'pf', p.proof));
    b.onclick = () => showBottle(p.k);
    list.appendChild(b);
  });
}

/* --- bottle detail -------------------------------------------------- */
function showBottle(k) {
  S.lastList = 'shelf';
  const p = prod(k);
  const body = $('#detailBody'); body.innerHTML = '';
  const h = el('div', 'sheet');
  const t = el('h2'); t.style.fontSize = '21px'; t.style.color = 'var(--ink-deep)';
  t.textContent = p.name; h.appendChild(t);

  const dl = el('dl', 'kv');
  const add = (k2, v, cls) => {
    if (v === null || v === undefined || v === '') return;
    dl.appendChild(el('dt', null, k2));
    const dd = el('dd', cls); dd.textContent = v; dl.appendChild(dd);
  };
  add('Distillery', p.dist);
  add('Style', [p.sub, p.style].filter(Boolean)
    .map(L.titleCase).join(' \u00b7 '));
  add('Proof', p.proof);
  add('Age', p.age ? p.age + ' years' : 'No age stated');
  h.appendChild(dl);

  if (p.fin) {
    const f = el('div'); f.style.marginTop = '10px';
    p.fin.split('+').forEach(part => {
      f.appendChild(el('span', 'tag ' + (p.wine ? 'wine' : 'wood'),
        L.titleCase(part)));
    });
    const src = el('div', 'src', p.finc === 'stated' ? 'confirmed from the producer'
      : p.finc === 'from_cards' ? 'from your flight cards' : 'read from the label');
    f.appendChild(src);
    h.appendChild(f);
  }

  const dl2 = el('dl', 'kv'); dl2.style.marginTop = '10px';
  const add2 = (a, b2) => { if (b2 === null || b2 === undefined || b2 === '') return;
    dl2.appendChild(el('dt', null, a)); dl2.appendChild(el('dd', null, b2)); };
  add2('Region', L.titleCase(p.region));
  add2('Recognition', L.titleCase(p.obsc));
  add2('Release', L.titleCase(p.scar));
  add2('Ohio retail', L.titleCase(p.alloc));
  const prem = L.premium(p.msrp, p.sec);
  add2('Premium', prem ? prem + '\u00d7 over MSRP' : null);
  add2('MSRP', p.msrp ? '$' + p.msrp : null);
  h.appendChild(dl2);
  body.appendChild(h);

  const mine = S.bottles.filter(b => b.k === k);
  const bs = el('div', 'sheet');
  bs.appendChild(el('h3', null, mine.length > 1 ? mine.length + ' bottles' : 'Your bottle'));
  mine.forEach(b => {
    const r = el('div'); r.style.cssText =
      'display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line)';
    r.appendChild(el('span', null, b.id + ' \u00b7 ' + L.titleCase(b.status)));
    const btn = el('button', 'chip', b.status === 'sealed' ? 'Open it' : 'Retire');
    btn.onclick = () => b.status === 'sealed' ? openBottle(b, k) : retireBottle(b, k);
    r.appendChild(btn);
    bs.appendChild(r);
  });
  body.appendChild(bs);

  // Notes: what every source knows, and what you have written.
  const notes = L.notesFor(p, allFlights(), (S.edits[k] || {}).userNote);
  const nb = el('div', 'sheet');
  nb.appendChild(el('h3', null, 'Notes'));
  if (!notes.length) {
    nb.appendChild(el('div', 'sub', 'Nothing recorded yet.'));
  } else {
    notes.forEach(n => {
      const row = el('div', 'note');
      row.appendChild(el('div', 'nsrc', n.src));
      row.appendChild(el('div', null, n.text));
      nb.appendChild(row);
    });
  }
  const ta = document.createElement('textarea');
  ta.className = 'field'; ta.rows = 3;
  ta.placeholder = 'Your own note \u2014 how it drank, who liked it, what it sat next to';
  ta.value = (S.edits[k] || {}).userNote || '';
  ta.style.marginTop = '9px';
  nb.appendChild(ta);
  const saveNote = el('button', 'chip', 'Save note');
  saveNote.style.marginTop = '7px';
  saveNote.onclick = () => {
    const v = ta.value.trim();
    S.edits[k] = Object.assign({}, S.edits[k], { userNote: v || null });
    save_(); rebuildCatalog(); showBottle(k); toast(v ? 'Note saved' : 'Note cleared');
  };
  nb.appendChild(saveNote);
  body.appendChild(nb);

  const acts = el('div', 'sheet');
  const edit = el('button', 'btn wide', 'Edit this bottle');
  edit.onclick = () => productForm(p);
  acts.appendChild(edit);
  const addAnother = el('button', 'btn ghost wide', 'Add another bottle of this');
  addAnother.onclick = () => {
    S.bottles.push({ id: L.nextBottleId(S.bottles), k: k, status: 'sealed', paid: null });
    save_(); showBottle(k); renderShelf(); renderHome(); toast('Sealed spare added');
  };
  acts.appendChild(addAnother);
  const del = el('button', 'btn ghost wide danger', 'Delete from the shelf');
  del.onclick = () => {
    if (!L.canDeleteProduct(k, S.bottles)) {
      toast('Retire its bottles first'); return;
    }
    confirmDelete(p.name, () => {
      S.deleted[k] = true; delete S.custom[k]; delete S.edits[k];
      S.bottles = S.bottles.filter(b => b.k !== k);
      save_(); rebuildCatalog(); renderShelf(); renderPayline(); renderHome();
      show('shelf'); toast('Removed');
    });
  };
  acts.appendChild(del);
  body.appendChild(acts);

  const used = L.useCount(k, S.flights, S.history);
  if (used) {
    const u = el('div', 'sheet');
    u.appendChild(el('h3', null, 'In the curriculum'));
    const fl = S.flights.filter(f => f.core.some(x => x.k === k) || f.ext.some(x => x.k === k));
    fl.forEach(f => {
      const isCore = f.core.some(x => x.k === k);
      const b2 = el('button', 'chip',
        L.sentenceCase(f.title) + (isCore ? '' : ' (bench)'));
      b2.style.marginRight = '5px';
      b2.onclick = () => showFlight(f);
      u.appendChild(b2);
    });
    body.appendChild(u);
  }
  show('detail');
}

function openBottle(b, k) { b.status = 'open'; showBottle(k); renderShelf(); }

function retireBottle(b, k) {
  const body = $('#detailBody');
  const box = el('div', 'sheet');
  box.appendChild(el('h3', null, 'Why is it leaving?'));
  const row = el('div', 'row'); row.style.marginTop = '8px';
  L.EXITS.forEach(reason => {
    const c = el('button', 'chip', L.titleCase(reason));
    c.onclick = () => {
      b.status = 'gone'; b.exit = reason; b.exitDate = new Date().toISOString().slice(0, 10);
      // A drain pour is the strongest opinion available. Record it so the
      // bottle never resurfaces as a flight candidate.
      if (L.isDrain(reason)) { S.edits[k] = Object.assign({}, S.edits[k], { drained: true }); }
      save_(); showBottle(k); renderShelf();
    };
    row.appendChild(c);
  });
  box.appendChild(row);
  body.insertBefore(box, body.firstChild);
  window.scrollTo(0, 0);
}

/* --- Time for a Taste: the machine ----------------------------------- */

// A Glencairn, filled to a level. The fill is the type colour, so a payout
// line reads as three different whiskies at a glance.
function glassSvg(fill, level) {
  const y = 46 - (level * 16);
  return '<svg viewBox="0 0 44 62" aria-hidden="true">'
    + '<defs><clipPath id="cg"><path d="M11 6 h22 l-2.5 20 a9 9 0 0 1-17 0 Z"/></clipPath></defs>'
    + '<rect x="0" y="' + y + '" width="44" height="30" fill="' + fill
    + '" clip-path="url(#cg)" opacity=".85"/>'
    + '<path d="M11 6 h22 l-2.5 20 a9 9 0 0 1-17 0 Z" fill="none" stroke="currentColor" '
    + 'stroke-width="1.6" stroke-linejoin="round"/>'
    + '<path d="M19.5 34 h5 l1 8 h-7 Z" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '<ellipse cx="22" cy="45" rx="9" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '<path d="M13 45 v3 a9 3.2 0 0 0 18 0 v-3" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '</svg>';
}

// Colour groups the categories by family: American grain, malt, and the
// rest of the world. Nine subcategories, six liquid colours.
const TYPE_CLASS = {
  'bourbon': 't-bourbon', 'tennessee': 't-bourbon',
  'rye': 't-rye', 'wheat': 't-rye', 'flavored': 't-rye',
  'scotch': 't-scotch',
  'irish': 't-irish',
  'american single malt': 't-malt', 'japanese': 't-malt',
  'canadian': 't-other', 'world': 't-other', 'tequila': 't-other'
};
function typeClass(p) {
  return TYPE_CLASS[(p.sub || '').toLowerCase()] || 't-other';
}
const TYPE_HEX = { 't-bourbon': '#B4762B', 't-scotch': '#5C6B63', 't-irish': '#8C8034',
                   't-rye': '#9C4A22', 't-malt': '#7A6142', 't-other': '#6B3550' };

function faceText(reelId, v) {
  const reel = L.REELS.find(r => r.id === reelId);
  const f = reel.faces.find(x => x.v === v);
  return f ? f.t : 'any';
}

function renderReels() {
  const box = $('#reels'); box.innerHTML = '';
  L.REELS.forEach(reel => {
    const d = el('button', 'reel');
    d.type = 'button';
    d.dataset.reel = reel.id;
    d.dataset.held = !!S.held[reel.id];
    d.setAttribute('aria-pressed', !!S.held[reel.id]);
    d.appendChild(el('div', 'rl', reel.label));
    d.appendChild(el('div', 'rv', faceText(reel.id, S.reels[reel.id])));
    d.appendChild(el('div', 'hold', 'HELD'));
    d.onclick = () => { S.held[reel.id] = !S.held[reel.id]; renderReels(); };
    box.appendChild(d);
  });
}

function doSpin() {
  S.reels = L.spin(S.reels, S.held, Math.random);
  document.querySelectorAll('.reel').forEach(d => {
    if (S.held[d.dataset.reel]) return;
    d.classList.remove('spinning');
    void d.offsetWidth;                 // restart the animation
    d.classList.add('spinning');
  });
  renderReels();
  renderPayline();
}

function renderPayline() {
  const box = $('#payline'); box.innerHTML = '';
  const msg = $('#payMsg');
  const hits = L.pourGlasses(S.catalog, S.bottles, S.reels, S.history);
  const total = L.reelMatches(S.catalog, S.bottles, S.reels, S.history).length;

  for (let i = 0; i < L.GLASSES; i++) {
    const hit = hits[i];
    const g = el('button', 'glass' + (hit ? '' : ' empty'));
    g.type = 'button';
    if (!hit) {
      g.disabled = true;
      g.innerHTML = glassSvg('none', 0);
      g.style.color = 'rgba(237,228,210,.30)';
      g.appendChild(el('div', 'gn', '\u2014'));
      box.appendChild(g);
      continue;
    }
    const p = prod(hit.k);
    const cls = typeClass(p);
    g.innerHTML = glassSvg(TYPE_HEX[cls], 1);
    g.style.color = '#EDE4D2';
    g.appendChild(el('div', 'gn', p.name));
    g.appendChild(el('div', 'gp', String(p.proof)));
    g.onclick = () => showBottle(p.k);
    box.appendChild(g);
  }

  if (!total) {
    msg.style.display = '';
    msg.textContent = 'Nothing open lines up. Release a hold and spin again.';
  } else if (total > L.GLASSES) {
    msg.style.display = '';
    msg.textContent = total + ' bottles line up \u2014 showing the top three.';
  } else {
    msg.style.display = 'none';
  }
}

/* --- the map ---------------------------------------------------------- */

const REGION_HEX = { 'Islay': '#5C6B63', 'Speyside': '#B4762B', 'Highland': '#7A6142',
                     'Islands': '#3E6274', 'Lowland': '#8C8034', 'Campbeltown': '#9C4A22' };
const M = { full: null, view: null, pins: [], region: null, layer: 'world' };
const LAYER_LABEL = { world: 'The world', us: 'United States', scotland: 'Scotland' };

function ptStr(ring) {
  let s = '';
  for (let i = 0; i < ring.length; i++) {
    const p = L.project(ring[i][0], ring[i][1]);
    s += (i ? 'L' : 'M') + p[0].toFixed(4) + ' ' + p[1].toFixed(4);
  }
  return s + 'Z';
}

function applyView() {
  const v = M.view;
  $('#map').setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h);
  // Labels only once there is room for them, and only for the region in focus.
  const z = M.full.w / v.w;
  const labelAt = M.layer === 'world' ? 1 : 3;
  document.querySelectorAll('#map .pin').forEach(g => {
    const inRegion = !M.region || g.dataset.region === M.region;
    g.classList.toggle('dim', !inRegion);
    const t = g.querySelector('text');
    if (t) {
      t.style.display = (z >= labelAt && inRegion) ? '' : 'none';
      t.setAttribute('font-size', (0.16 / Math.sqrt(z) * 3).toFixed(3));
    }
    const c = g.querySelector('circle');
    const base = L.pinRadius(+g.dataset.n) * (M.layer === 'world' ? 1.5 : 1);
    const r = base / Math.sqrt(z);
    if (c) c.setAttribute('r', r.toFixed(3));
    const cnt = g.querySelector('.cnt');
    if (cnt) {
      // Only when the digits fit inside the dot -- a number spilling over
      // its own pin is worse than no number.
      const fits = r > 0.9 * String(g.dataset.n).length * 0.42;
      cnt.style.display = (fits && inRegion) ? '' : 'none';
      cnt.setAttribute('font-size', (r * 1.05).toFixed(3));
    }
  });
}

function renderLayerChips() {
  const box = $('#mapLayers'); box.innerHTML = '';
  L.MAP_LAYERS.forEach(k => {
    const b = el('button', 'chip', LAYER_LABEL[k]);
    b.setAttribute('aria-pressed', M.layer === k);
    b.onclick = () => { M.layer = k; M.region = null; M.view = null;
      $('#mapPick').innerHTML = ''; renderMap(); };
    box.appendChild(b);
  });
}

function svgEl(n) { return document.createElementNS('http://www.w3.org/2000/svg', n); }

function renderMap() {
  const svg = $('#map');
  svg.innerHTML = '';
  renderLayerChips();
  if (M.layer === 'scotland') return renderScotland(svg);
  if (M.layer === 'us') return renderStates(svg);
  return renderWorld(svg);
}

// World: land, and one dot per country sized by how many bottles come from it.
function renderWorld(svg) {
  M.full = L.mapExtent(MAPDATA.world, 3);
  if (!M.view) M.view = Object.assign({}, M.full);
  const land = svgEl('path');
  land.setAttribute('class', 'land');
  land.setAttribute('d', MAPDATA.world.map(ptStr).join(' '));
  svg.appendChild(land);

  const counts = L.countryCounts(S.catalog, MAPDATA.subCountry, MAPDATA.worldDist, S.bottles);
  counts.forEach(c => {
    const pos = MAPDATA.countryPos[c.name];
    if (!pos) return;
    const [x, y] = L.project(pos[0], pos[1]);
    const g = svgEl('g');
    g.setAttribute('class', 'pin');
    g.dataset.n = c.total; g.dataset.region = '';
    const dot = svgEl('circle');
    dot.setAttribute('cx', x); dot.setAttribute('cy', y);
    dot.setAttribute('r', L.pinRadius(c.total) * 1.5);
    dot.setAttribute('fill', '#8A6A28');
    g.appendChild(dot);
    const t = svgEl('text');
    t.setAttribute('x', x); t.setAttribute('y', y - 3.4);
    t.setAttribute('text-anchor', 'middle');
    t.textContent = c.name;
    g.appendChild(t);
    const n = svgEl('text');
    n.setAttribute('class', 'cnt');
    n.setAttribute('x', x); n.setAttribute('y', y);
    n.setAttribute('text-anchor', 'middle');
    n.setAttribute('dominant-baseline', 'central');
    n.textContent = c.total;
    g.appendChild(n);
    g.onclick = e => { e.stopPropagation();
      if (c.name === 'Scotland') { M.layer = 'scotland'; M.view = null; renderMap(); }
      else if (c.name === 'United States') { M.layer = 'us'; M.view = null; renderMap(); }
      else showKeyList(c.name, c.keys, c.open); };
    svg.appendChild(g);
  });
  $('#mapCount').textContent = counts.reduce((n, c) => n + c.total, 0)
    + ' bottles \u00b7 ' + counts.length + ' countries';
  $('#mapLegend').innerHTML = '';
  applyView();
}

// United States: a choropleth, because states are areas and a dot in the
// middle of Kentucky says less than Kentucky itself being dark.
function renderStates(svg) {
  const byState = L.stateCounts(S.catalog, MAPDATA.stateOf, S.bottles);
  const rings = [];
  Object.values(MAPDATA.states).forEach(rs => rs.forEach(r => rings.push(r)));
  M.full = L.mapExtent(rings, 2);
  if (!M.view) M.view = Object.assign({}, M.full);

  Object.keys(MAPDATA.states).forEach(name => {
    const e = byState[name];
    const p = svgEl('path');
    p.setAttribute('class', 'state s' + L.choroStep(e ? e.total : 0));
    p.setAttribute('d', MAPDATA.states[name].map(ptStr).join(' '));
    if (e) p.onclick = ev => { ev.stopPropagation(); showKeyList(name, e.keys, e.open); };
    svg.appendChild(p);
  });

  const placed = Object.values(byState).reduce((n, e) => n + e.total, 0);
  const usTotal = Object.values(S.catalog).filter(p => L.US_SUBS.indexOf(p.sub) >= 0).length;
  $('#mapCount').textContent = placed + ' of ' + usTotal + ' US bottles placed';
  renderChoroKey(byState);
  applyView();
}

function renderChoroKey(byState) {
  const box = $('#mapLegend'); box.innerHTML = '';
  const bands = ['none', '1\u20132', '3\u20137', '8\u201319', '20\u201359', '60+'];
  bands.forEach((b, i) => {
    const c = el('span', 'chip');
    const wrap = el('span', 'rlegend');
    const sw = el('i');
    sw.style.background = ['#EFEAdd', '#EFE3CB', '#E7D2A6', '#D9B978', '#C79A4B', '#A9762B'][i];
    sw.style.borderRadius = '2px';
    wrap.appendChild(sw);
    wrap.appendChild(document.createTextNode(b));
    c.appendChild(wrap);
    box.appendChild(c);
  });
  const top = Object.values(byState).sort((a, b) => b.total - a.total)[0];
  if (top) {
    const note = el('span', 'chip', top.name + ' leads with ' + top.total);
    box.appendChild(note);
  }
}

function showKeyList(title, keys, open) {
  const box = $('#mapPick'); box.innerHTML = '';
  const card = el('div', 'sheet');
  card.appendChild(el('h3', null, title));
  card.appendChild(el('div', 'sub', keys.length + ' bottles \u00b7 ' + open + ' open'));
  keys.map(prod).filter(Boolean)
    .sort((a, b) => a.name.localeCompare(b.name))
    .slice(0, 60)
    .forEach(p => {
      const r = el('button', 'item ' + typeClass(p)
        + (L.pourable(p.k, S.bottles) ? '' : ' sealed'));
      const left = el('div');
      const nm = el('div', 'nm'); nm.innerHTML = '<span class="dot"></span>';
      nm.appendChild(document.createTextNode(p.name));
      left.appendChild(nm);
      r.appendChild(left);
      r.appendChild(el('div', 'pf', p.proof));
      r.onclick = () => showBottle(p.k);

function renderScotland(svg) {
  M.pins = L.mapPins(S.catalog, MAPDATA.distilleries, S.bottles);
  M.full = L.mapExtent(MAPDATA.coast, 0.12);
  if (!M.view) M.view = Object.assign({}, M.full);

  const land = svgEl('path');
  land.setAttribute('class', 'land');
  land.setAttribute('d', MAPDATA.coast.map(ptStr).join(' '));
  svg.appendChild(land);

  M.pins.forEach(pin => {
    const [x, y] = L.project(pin.lon, pin.lat);
    const g = svgEl('g');
    g.setAttribute('class', 'pin');
    g.dataset.region = pin.region || '';
    g.dataset.n = pin.total;
    const c = svgEl('circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y);
    c.setAttribute('r', L.pinRadius(pin.total));
    c.setAttribute('fill', REGION_HEX[pin.region] || '#6B3550');
    g.appendChild(c);
    const t = svgEl('text');
    t.setAttribute('x', x); t.setAttribute('y', y - 0.08);
    t.setAttribute('text-anchor', 'middle');
    t.textContent = pin.dist.replace(/ Distillery$/, '').replace(/^The /, '');
    g.appendChild(t);
    // The count sits inside the dot, so volume reads without a legend and
    // without needing the label to be visible.
    const n = svgEl('text');
    n.setAttribute('class', 'cnt');
    n.setAttribute('x', x); n.setAttribute('y', y);
    n.setAttribute('text-anchor', 'middle');
    n.setAttribute('dominant-baseline', 'central');
    n.textContent = pin.total;
    g.appendChild(n);
    g.onclick = e => { e.stopPropagation(); showPinBottles(pin); };
    svg.appendChild(g);
  });

  const placed = M.pins.reduce((n, p) => n + p.total, 0);
  $('#mapCount').textContent = placed + ' bottles \u00b7 ' + M.pins.length + ' distilleries';
  renderLegend();
  applyView();
}

function renderLegend() {
  const box = $('#mapLegend'); box.innerHTML = '';
  const counts = {};
  M.pins.forEach(p => { if (p.region) counts[p.region] = (counts[p.region] || 0) + p.total; });
  const all = el('button', 'chip', 'All regions');
  all.setAttribute('aria-pressed', !M.region);
  all.onclick = () => { M.region = null; M.view = Object.assign({}, M.full);
    renderLegend(); applyView(); $('#mapPick').innerHTML = ''; };
  box.appendChild(all);
  L.SCOTCH_REGIONS.forEach(r => {
    if (!counts[r]) return;
    const b = el('button', 'chip');
    b.setAttribute('aria-pressed', M.region === r);
    const dot = el('i'); dot.style.background = REGION_HEX[r];
    const wrap = el('span', 'rlegend');
    wrap.appendChild(dot);
    wrap.appendChild(document.createTextNode(r + ' ' + counts[r]));
    b.appendChild(wrap);
    b.onclick = () => { M.region = (M.region === r) ? null : r; zoomToRegion(); };
    box.appendChild(b);
  });
}

// Framing a region is a view calculation, not a hand-tuned coordinate: fit
// the pins that belong to it, then let the clamp keep it on the map.
function zoomToRegion() {
  if (!M.region) { M.view = Object.assign({}, M.full); renderLegend(); applyView(); return; }
  const pts = M.pins.filter(p => p.region === M.region).map(p => [p.lon, p.lat]);
  const ext = L.mapExtent([pts], 0.25);
  const z = L.clampZoom(Math.min(M.full.w / ext.w, M.full.h / ext.h));
  const w = M.full.w / z, h = M.full.h / z;
  M.view = L.clampView({ x: ext.x + ext.w / 2 - w / 2,
                         y: ext.y + ext.h / 2 - h / 2, w: w, h: h }, M.full);
  renderLegend(); applyView(); $('#mapPick').innerHTML = '';
}

function showPinBottles(pin) {
  const box = $('#mapPick'); box.innerHTML = '';
  const card = el('div', 'sheet');
  card.appendChild(el('h3', null, pin.dist));
  card.appendChild(el('div', 'sub', [pin.region, pin.total + ' bottles',
    pin.open + ' open'].filter(Boolean).join(' \u00b7 ')));
  pin.keys.map(prod).filter(Boolean)
    .sort((a, b) => a.proof - b.proof)
    .forEach(p => {
      const r = el('button', 'item ' + typeClass(p)
        + (L.pourable(p.k, S.bottles) ? '' : ' sealed'));
      const left = el('div');
      const nm = el('div', 'nm'); nm.innerHTML = '<span class="dot"></span>';
      nm.appendChild(document.createTextNode(p.name));
      left.appendChild(nm);
      r.appendChild(left);
      r.appendChild(el('div', 'pf', p.proof));
      r.onclick = () => showBottle(p.k);
      card.appendChild(r);
    });
  box.appendChild(card);
}

// Pan and pinch. Pointer events cover mouse, touch and pen in one path.
function wireMap() {
  const svg = $('#map');
  const active = new Map();
  let last = null, startDist = 0, startView = null;

  const toMap = e => {
    const r = svg.getBoundingClientRect();
    return [M.view.x + ((e.clientX - r.left) / r.width) * M.view.w,
            M.view.y + ((e.clientY - r.top) / r.height) * M.view.h];
  };

  svg.addEventListener('pointerdown', e => {
    svg.setPointerCapture(e.pointerId);
    active.set(e.pointerId, e);
    if (active.size === 1) { last = toMap(e); svg.classList.add('drag'); }
    else if (active.size === 2) {
      const [a, b] = [...active.values()];
      startDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      startView = Object.assign({}, M.view);
    }
  });

  svg.addEventListener('pointermove', e => {
    if (!active.has(e.pointerId)) return;
    active.set(e.pointerId, e);
    if (active.size === 2 && startDist) {
      const [a, b] = [...active.values()];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const r = svg.getBoundingClientRect();
      const cx = startView.x + (((a.clientX + b.clientX) / 2 - r.left) / r.width) * startView.w;
      const cy = startView.y + (((a.clientY + b.clientY) / 2 - r.top) / r.height) * startView.h;
      M.view = L.zoomAbout(startView, M.full, d / startDist, cx, cy);
      applyView();
      return;
    }
    if (active.size === 1 && last) {
      const p = toMap(e);
      M.view = L.clampView({ x: M.view.x - (p[0] - last[0]), y: M.view.y - (p[1] - last[1]),
                             w: M.view.w, h: M.view.h }, M.full);
      applyView();
    }
  });

  const up = e => {
    active.delete(e.pointerId);
    if (active.size < 2) startDist = 0;
    if (!active.size) { last = null; svg.classList.remove('drag'); }
  };
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', up);

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const p = toMap(e);
    M.view = L.zoomAbout(M.view, M.full, e.deltaY < 0 ? 1.22 : 1 / 1.22, p[0], p[1]);
    applyView();
  }, { passive: false });

  const step = f => {
    M.view = L.zoomAbout(M.view, M.full, f,
      M.view.x + M.view.w / 2, M.view.y + M.view.h / 2);
    applyView();
  };
  $('#zIn').onclick = () => step(1.6);
  $('#zOut').onclick = () => step(1 / 1.6);
  $('#zRe').onclick = () => { M.region = null; M.view = Object.assign({}, M.full);
    renderLegend(); applyView(); $('#mapPick').innerHTML = ''; };
}

/* --- home: the summary ------------------------------------------------ */

function barBlock(title, rows, cls) {
  const s = el('div', 'sheet');
  s.appendChild(el('h3', null, title));
  const b = el('div', 'bars');
  b.style.marginTop = '8px';
  rows.forEach(r => {
    const row = el('div', 'bar' + (cls ? ' ' + cls(r) : ''));
    row.appendChild(el('div', 't', r.label));
    const track = el('div', 'track');
    const fill = el('div', 'fill');
    fill.style.width = r.pct + '%';
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el('div', 'n', String(r.n)));
    b.appendChild(row);
  });
  s.appendChild(b);
  return s;
}

function renderHome() {
  const box = $('#homeBody'); box.innerHTML = '';
  const stats = L.shelfStats(S.catalog, S.bottles);
  const val = L.shelfValue(S.catalog, S.bottles);

  // Install: Chrome hands us a prompt; iOS Safari never does, so it gets
  // told where the control actually is.
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const standalone = window.matchMedia('(display-mode: standalone)').matches
    || navigator.standalone === true;
  if (!standalone) {
    const inst = el('div', 'sheet');
    inst.style.padding = '10px 12px';
    if (iOS) {
      inst.appendChild(el('div', 'sub',
        'Add to your home screen: tap Share, then Add to Home Screen.'));
    } else {
      const b = el('button', 'btn', 'Install on this device');
      b.id = 'installBtn';
      b.style.display = _installEvt ? '' : 'none';
      b.onclick = async () => {
        if (!_installEvt) return;
        _installEvt.prompt();
        await _installEvt.userChoice;
        _installEvt = null;
        b.style.display = 'none';
      };
      inst.appendChild(b);
      if (!_installEvt) {
        inst.appendChild(el('div', 'sub',
          'Your browser will offer to install this once it has seen it a couple of times.'));
      }
    }
    box.appendChild(inst);
  }

  const tiles = el('div', 'tiles');
  [[stats.bottles, 'bottles on the shelf'],
   [stats.open, 'open and pourable'],
   [stats.products, 'different whiskies'],
   ['$' + val.msrp.toLocaleString(), 'shelf value at MSRP'],
   [allFlights().length, 'flights designed'],
   [S.history.filter(x => x.kind === 'flight').length, 'flights run']
  ].forEach(([v, l]) => {
    const t = el('div', 'tile');
    t.appendChild(el('div', 'v', String(v)));
    t.appendChild(el('div', 'l', l));
    tiles.appendChild(t);
  });
  box.appendChild(tiles);

  const live = Object.values(S.catalog);

  box.appendChild(barBlock('By type',
    L.barRows(L.countBy(live, p => L.titleCase(p.sub)))));

  box.appendChild(barBlock('Open or sealed', L.barRows({
    Open: stats.open, Sealed: stats.sealed
  }, { keepOrder: true }), r => 'b-' + r.label.toLowerCase()));

  // Recognition and occasion are ordered scales, so they keep their order
  // rather than being sorted by size -- a scale read out of sequence is
  // harder to read, not easier.
  const obscCounts = { Known: 0, Niche: 0, Obscure: 0 };
  live.forEach(p => { const k = L.titleCase(p.obsc); if (k in obscCounts) obscCounts[k]++; });
  box.appendChild(barBlock('Recognition', L.barRows(obscCounts, { keepOrder: true })));

  const bandCounts = { Everyday: 0, Good: 0, Special: 0, Vault: 0 };
  live.forEach(p => { const b = L.priceBand(p.msrp);
    if (b) bandCounts[L.titleCase(b)]++; });
  box.appendChild(barBlock('Occasion', L.barRows(bandCounts, { keepOrder: true })));

  const scotch = live.filter(p => p.sub === 'scotch' && p.region);
  if (scotch.length) {
    box.appendChild(barBlock('Scotch by region',
      L.barRows(L.countBy(scotch, p => p.region))));
  }

  // The map, small, on the home page.
  const mapCard = el('div', 'sheet');
  mapCard.appendChild(el('h3', null, 'Where it comes from'));
  const wrap = el('div', 'mapwrap');
  wrap.style.marginTop = '8px';
  const mini = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  mini.setAttribute('id', 'homeMap');
  mini.setAttribute('class', 'homemap');
  mini.style.width = '100%';
  wrap.appendChild(mini);
  mapCard.appendChild(wrap);
  const go = el('button', 'chip', 'Open the map');
  go.style.marginTop = '8px';
  go.onclick = () => show('map');
  mapCard.appendChild(go);
  box.appendChild(mapCard);
  drawHomeMap();

  // Recent activity, newest first.
  const adds = L.recent(S.bottles.filter(b => /^B(3[5-9]\d|[4-9]\d\d)$/.test(b.id)),
                        S.catalog, 5);
  if (adds.length) {
    const s = el('div', 'sheet');
    s.appendChild(el('h3', null, 'Recently added'));
    const list = el('div', 'recent');
    list.style.marginTop = '8px';
    adds.forEach(b => list.appendChild(recentRow(b.k, L.titleCase(b.status))));
    s.appendChild(list);
    box.appendChild(s);
  }

  const pours = L.recent(S.history.filter(x => x.kind === 'pour'), S.catalog, 5);
  const s2 = el('div', 'sheet');
  s2.appendChild(el('h3', null, 'Recently poured'));
  if (!pours.length) {
    s2.appendChild(el('div', 'sub', 'Nothing yet. Spin the reels and pour something.'));
  } else {
    const list = el('div', 'recent');
    list.style.marginTop = '8px';
    pours.forEach(x => list.appendChild(recentRow(x.k, x.at)));
    s2.appendChild(list);
  }
  box.appendChild(s2);
}

function recentRow(key, right) {
  const p = prod(key);
  const r = el('button', 'item ' + (p ? typeClass(p) : ''));
  const left = el('div');
  const nm = el('div', 'nm'); nm.innerHTML = '<span class="dot"></span>';
  nm.appendChild(document.createTextNode(p ? p.name : key));
  left.appendChild(nm);
  r.appendChild(left);
  r.appendChild(el('div', 'pf', right));
  if (p) r.onclick = () => showBottle(p.k);
  return r;
}

// A still world map for the home page: the same land and dots as the map
// screen's world layer, without the gestures.
function drawHomeMap() {
  const svg = document.getElementById('homeMap');
  if (!svg || !MAPDATA.world || !MAPDATA.world.length) return;
  svg.innerHTML = '';
  const ext = L.mapExtent(MAPDATA.world, 3);
  svg.setAttribute('viewBox', [ext.x, ext.y, ext.w, ext.h].join(' '));
  const land = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  land.setAttribute('class', 'land');
  land.setAttribute('d', MAPDATA.world.map(ptStr).join(' '));
  svg.appendChild(land);
  L.countryCounts(S.catalog, MAPDATA.subCountry, MAPDATA.worldDist, S.bottles)
    .forEach(c => {
      const pos = MAPDATA.countryPos[c.name];
      if (!pos) return;
      const [x, y] = L.project(pos[0], pos[1]);
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', x); dot.setAttribute('cy', y);
      dot.setAttribute('r', L.pinRadius(c.total) * 1.5);
      dot.setAttribute('fill', '#8A6A28');
      dot.setAttribute('opacity', '.82');
      svg.appendChild(dot);
    });
}

/* --- shopping --------------------------------------------------------- */

function renderShop() {
  const box = $('#shopBody'); box.innerHTML = '';
  const q = $('#shopQ').value;
  if (!q.trim()) {
    box.appendChild(el('div', 'empty',
      'Type a name to see whether it is already on your shelf and what it would add.'));
    return;
  }

  // What you already own that resembles it.
  const hits = L.shopSearch(q, S.catalog, 6);
  if (hits.length) {
    const owned = el('div', 'sheet');
    owned.appendChild(el('h3', null, 'Already on your shelf'));
    hits.forEach(hit => {
      const p = hit.p;
      const n = L.ownedCount(p.k, S.bottles);
      const open = L.pourable(p.k, S.bottles);
      const r = el('button', 'item ' + typeClass(p) + (open ? '' : ' sealed'));
      const left = el('div');
      const nm = el('div', 'nm'); nm.innerHTML = '<span class="dot"></span>';
      nm.appendChild(document.createTextNode(p.name));
      left.appendChild(nm);
      left.appendChild(el('div', 'sub', [n + (n > 1 ? ' bottles' : ' bottle'),
        open ? 'open' : 'sealed', p.msrp ? '$' + p.msrp : null]
        .filter(Boolean).join(' \u00b7 ')));
      r.appendChild(left);
      r.appendChild(el('div', 'pf', p.proof));
      r.onclick = () => showBottle(p.k);
      owned.appendChild(r);
    });
    box.appendChild(owned);
  } else {
    const none = el('div', 'sheet');
    none.appendChild(el('h3', null, 'Not on your shelf'));
    none.appendChild(el('div', 'sub', 'Nothing you own matches that name.'));
    box.appendChild(none);
  }

  // Judge the fit. Fields the shop tells you go in here; everything else is
  // read off the shelf.
  const card = el('div', 'sheet');
  card.appendChild(el('h3', null, 'Would it add anything?'));
  const f = el('div', 'form');
  f.style.marginTop = '9px';
  f.appendChild(fieldRow('Name', 'name', q, {}));
  const two = el('div', 'two');
  two.appendChild(fieldRow('Proof', 'proof', S.shop.proof, { type: 'number', step: '0.1' }));
  two.appendChild(fieldRow('Price', 'msrp', S.shop.msrp, { type: 'number', step: '0.01' }));
  f.appendChild(two);
  const two2 = el('div', 'two');
  two2.appendChild(selectRow('Type', 'sub', S.shop.sub || (hits[0] && hits[0].p.sub) || 'bourbon',
    L.TYPES));
  two2.appendChild(selectRow('Release', 'scar', S.shop.scar || 'standard',
    ['standard', 'batched', 'limited', 'exclusive']));
  f.appendChild(two2);
  const two3 = el('div', 'two');
  two3.appendChild(fieldRow('Distillery', 'dist', S.shop.dist || (hits[0] && hits[0].p.dist) || '', {}));
  two3.appendChild(fieldRow('Finish', 'fin', S.shop.fin, { placeholder: 'e.g. Oloroso' }));
  f.appendChild(two3);
  card.appendChild(f);

  const judge = el('button', 'btn wide', 'Judge it against the shelf');
  const result = el('div');
  judge.onclick = () => {
    const vals = {};
    f.querySelectorAll('input,select').forEach(i => { vals[i.name] = i.value; });
    S.shop = vals;
    const cand = {
      name: vals.name, dist: vals.dist.trim(), sub: vals.sub,
      proof: parseFloat(vals.proof) || null, msrp: parseFloat(vals.msrp) || null,
      fin: vals.fin.trim() || null, scar: vals.scar
    };
    const fit = L.shelfFit(cand, S.catalog, S.bottles);
    result.innerHTML = '';
    result.appendChild(el('div', 'verdict', L.fitVerdict(fit)));
    const list = el('div');
    list.style.marginTop = '8px';
    fit.findings.forEach(x => {
      const row = el('div', 'find f-' + x.level);
      row.appendChild(el('div', 'm', x.level === 'ok' ? '\u2713'
        : x.level === 'warn' ? '!' : '\u00b7'));
      row.appendChild(el('div', null, x.msg));
      list.appendChild(row);
    });
    result.appendChild(list);

    if (fit.neighbours.length && fit.neighbours.length < 9) {
      const nb = el('div');
      nb.style.marginTop = '9px';
      nb.appendChild(el('div', 'rs', 'What sits near it'));
      fit.neighbours.slice(0, 8).forEach(p => {
        nb.appendChild(el('div', 'sub', p.name + '  ' + p.proof));
      });
      result.appendChild(nb);
    }

    // Bought it? One tap puts it on the shelf.
    const buy = el('button', 'btn wide', 'I bought it \u2014 add to the shelf');
    buy.style.marginTop = '11px';
    buy.onclick = () => {
      const errs = L.validateProduct(vals);
      if (errs.length) { toast(errs[0]); return; }
      if (fit.own) {
        S.bottles.push({ id: L.nextBottleId(S.bottles), k: fit.own.key,
                         status: 'sealed', paid: cand.msrp });
        save_(); renderShelf(); renderHome(); renderShop();
        toast('Sealed spare added'); return;
      }
      const np = L.normalizeProduct(vals);
      if (S.catalog[np.k]) { toast('Already on the shelf'); return; }
      np.finc = np.fin ? 'stated' : null;
      S.custom[np.k] = np;
      S.bottles.push({ id: L.nextBottleId(S.bottles), k: np.k,
                       status: 'open', paid: cand.msrp });
      save_(); rebuildCatalog(); renderShelf(); renderHome(); renderPayline();
      renderShop(); toast('Added to the shelf');
      showBottle(np.k);
    };
    result.appendChild(buy);
  };
  card.appendChild(judge);
  card.appendChild(result);
  box.appendChild(card);
}

/* --- modal + toast ---------------------------------------------------- */

function closeModal() { $('#overlay').classList.remove('on'); $('#modal').innerHTML = ''; }

function openModal(title, build) {
  const m = $('#modal'); m.innerHTML = '';
  m.appendChild(el('h2', null, title));
  build(m);
  $('#overlay').classList.add('on');
  const first = m.querySelector('input,select');
  if (first) first.focus();
}

let _toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

function fieldRow(label, name, value, attrs) {
  const l = el('label', null, label);
  const i = document.createElement('input');
  i.className = 'field'; i.name = name; i.value = (value === null || value === undefined) ? '' : value;
  Object.keys(attrs || {}).forEach(a => i.setAttribute(a, attrs[a]));
  l.appendChild(i);
  return l;
}

function selectRow(label, name, value, options) {
  const l = el('label', null, label);
  const s = document.createElement('select');
  s.className = 'field'; s.name = name;
  options.forEach(o => {
    const op = document.createElement('option');
    op.value = o; op.textContent = L.titleCase(o);
    if (o === value) op.selected = true;
    s.appendChild(op);
  });
  l.appendChild(s);
  return l;
}

// The add/edit form offers exactly the categories the reels can name, so a
// hand-typed bottle can never land somewhere no spin reaches.
const SUBS = L.TYPES.slice();

function productForm(existing) {
  const p = existing || {};
  openModal(existing ? 'Edit ' + p.name : 'Add a bottle', m => {
    const errBox = el('div', 'errs'); errBox.style.display = 'none';
    m.appendChild(errBox);
    const f = el('div', 'form');
    f.appendChild(fieldRow('Name', 'name', p.name, { placeholder: 'Bottle name' }));
    f.appendChild(fieldRow('Distillery', 'dist', p.dist, {}));
    const two1 = el('div', 'two');
    two1.appendChild(fieldRow('Proof', 'proof', p.proof, { type: 'number', step: '0.1' }));
    two1.appendChild(fieldRow('Age (blank = NAS)', 'age', p.age, { type: 'number' }));
    f.appendChild(two1);
    const two2 = el('div', 'two');
    two2.appendChild(selectRow('Type', 'sub', p.sub || 'bourbon', SUBS));
    two2.appendChild(fieldRow('Style', 'style', p.style, { placeholder: 'e.g. single malt' }));
    f.appendChild(two2);
    f.appendChild(fieldRow('Finish (join several with +)', 'fin', p.fin,
      { placeholder: 'e.g. Oloroso+American Oak' }));
    const two3 = el('div', 'two');
    two3.appendChild(fieldRow('MSRP', 'msrp', p.msrp, { type: 'number', step: '0.01' }));
    two3.appendChild(fieldRow('Secondary', 'sec', p.sec, { type: 'number', step: '0.01' }));
    f.appendChild(two3);
    const two4 = el('div', 'two');
    two4.appendChild(selectRow('Recognition', 'obsc', p.obsc || 'known',
      ['known', 'niche', 'obscure']));
    two4.appendChild(selectRow('Release', 'scar', p.scar || 'standard',
      ['standard', 'batched', 'limited', 'exclusive']));
    f.appendChild(two4);
    if (!existing) {
      f.appendChild(selectRow('Status', 'status', 'open', ['open', 'sealed']));
    }
    m.appendChild(f);

    const save = el('button', 'btn wide', existing ? 'Save changes' : 'Add to the shelf');
    save.onclick = () => {
      const vals = {};
      f.querySelectorAll('input,select').forEach(i => { vals[i.name] = i.value; });
      const errs = L.validateProduct(vals);
      if (errs.length) {
        errBox.style.display = ''; errBox.textContent = errs.join(' ');
        return;
      }
      if (existing) {
        vals.k = p.k;
        const np = L.normalizeProduct(vals);
        delete np.k;
        S.edits[p.k] = Object.assign({}, S.edits[p.k], np, { finc: 'stated' });
      } else {
        const np = L.normalizeProduct(vals);
        if (S.catalog[np.k]) { errBox.style.display = '';
          errBox.textContent = 'A bottle with that name is already on the shelf.'; return; }
        np.finc = np.fin ? 'stated' : null;
        S.custom[np.k] = np;
        S.bottles.push({ id: L.nextBottleId(S.bottles), k: np.k,
                         status: vals.status === 'sealed' ? 'sealed' : 'open', paid: null });
      }
      save_(); rebuildCatalog();
      closeModal(); renderShelf(); renderPayline(); renderHome();
      toast(existing ? 'Saved' : 'Added to the shelf');
    };
    m.appendChild(save);

    const cancel = el('button', 'btn ghost wide', 'Cancel');
    cancel.onclick = closeModal;
    m.appendChild(cancel);
  });
}

function confirmDelete(what, onYes) {
  openModal('Delete ' + what + '?', m => {
    m.appendChild(el('p', null, 'This removes it from your shelf. It cannot be undone.'));
    const yes = el('button', 'btn wide danger', 'Delete it');
    yes.onclick = () => { onYes(); closeModal(); };
    m.appendChild(yes);
    const no = el('button', 'btn ghost wide', 'Keep it');
    no.onclick = closeModal;
    m.appendChild(no);
  });
}

// Shipped flights and the ones BZ builds live in one list; only the custom
// ones can be deleted, and either can be edited.
function allFlights() { return S.flights.concat(S.customFlights); }

function flightEditor(f) {
  openModal(f.custom ? 'Edit flight' : 'Adjust ' + L.sentenceCase(f.title), m => {
    const form = el('div', 'form');
    form.appendChild(fieldRow('Title', 'title', f.title, {}));
    form.appendChild(fieldRow('Variable', 'tag', f.tag,
      { placeholder: 'ONE VARIABLE: WHICH SHERRY' }));
    form.appendChild(fieldRow('Premise', 'premise', f.premise, {}));
    m.appendChild(form);

    // Pours: reorder, remove, sort by proof, add from the open shelf.
    const list = el('div');
    function paint() {
      list.innerHTML = '';
      list.appendChild(el('h3', null, f.core.length + ' pours'));
      f.core.forEach((p, i) => {
        const pd = prod(p.k);
        const r = el('div', 'pourrow');
        r.appendChild(el('div', null, (p.letter || String.fromCharCode(65 + i))
          + ' \u00b7 ' + (pd ? pd.name + '  ' + pd.proof : p.card)));
        const mv = el('div', 'mv');
        [['\u2191', -1], ['\u2193', 1]].forEach(([g, d]) => {
          const b = el('button', null, g);
          b.onclick = () => { f.core = L.movePour(f.core, i, d); paint(); };
          mv.appendChild(b);
        });
        const x = el('button', null, '\u00d7');
        x.onclick = () => { f.core = L.removePour(f.core, i); paint(); };
        mv.appendChild(x);
        r.appendChild(mv);
        list.appendChild(r);
      });

      const sortBtn = el('button', 'chip', 'Sort by proof');
      sortBtn.style.marginTop = '8px';
      sortBtn.onclick = () => { f.core = L.sortByProof(f.core, S.catalog); paint(); };
      list.appendChild(sortBtn);

      const pick = document.createElement('select');
      pick.className = 'field'; pick.style.marginTop = '8px';
      const first = document.createElement('option');
      first.value = ''; first.textContent = 'Add a pour\u2026';
      pick.appendChild(first);
      Object.values(S.catalog)
        .filter(p => L.pourable(p.k, S.bottles))
        .sort((a, b) => a.proof - b.proof)
        .forEach(p => {
          const o = document.createElement('option');
          o.value = p.k; o.textContent = p.name + '  ' + p.proof;
          pick.appendChild(o);
        });
      pick.onchange = () => {
        if (!pick.value) return;
        f.core = L.addPour(f.core, pick.value);
        paint();
      };
      list.appendChild(pick);
    }
    paint();
    m.appendChild(list);

    const save = el('button', 'btn wide', 'Save flight');
    save.onclick = () => {
      const vals = {};
      form.querySelectorAll('input').forEach(i => { vals[i.name] = i.value; });
      const title = (vals.title || '').trim();
      if (title.length < 2) { toast('A flight needs a title'); return; }
      f.title = title.toUpperCase();
      f.tag = vals.tag; f.premise = vals.premise;
      f.cards = f.core.map((p, i) => {
        const pd = prod(p.k) || {};
        return { letter: p.letter || String.fromCharCode(65 + i),
                 bottle: pd.name || '', proof: pd.proof || '', wood: pd.fin || '' };
      });
      if (f.custom && S.customFlights.indexOf(f) < 0) S.customFlights.push(f);
      if (!f.custom) S.edits['flight:' + f.title] = { title: f.title, tag: f.tag,
        premise: f.premise, core: f.core };
      save_(); closeModal(); renderFlights(); showFlight(f); toast('Flight saved');
    };
    m.appendChild(save);

    if (f.custom) {
      const del = el('button', 'btn ghost wide danger', 'Delete this flight');
      del.onclick = () => confirmDelete(L.sentenceCase(f.title), () => {
        S.customFlights = S.customFlights.filter(x => x !== f);
        save_(); closeModal(); renderFlights(); show('flights'); toast('Flight deleted');
      });
      m.appendChild(del);
    }
    const cancel = el('button', 'btn ghost wide', 'Cancel');
    cancel.onclick = closeModal;
    m.appendChild(cancel);
  });
}

function showFlight(f) {
  S.lastList = 'flights';
  const body = $('#detailBody'); body.innerHTML = '';
  const head = el('div', 'sheet');
  const t = el('h2'); t.style.cssText = 'font-size:23px;color:var(--ink-deep)';
  t.textContent = L.sentenceCase(f.title);
  head.appendChild(t);
  head.appendChild(el('div', 'var', L.variableOf(f)));
  const pr = el('p'); pr.style.cssText = 'font-size:14px;margin:9px 0 0';
  pr.textContent = f.premise || '';
  head.appendChild(pr);
  body.appendChild(head);

  const prods = f.core.map(p => prod(p.k)).filter(Boolean);

  // validators
  const vbox = el('div');
  L.validate(f.core, S.catalog, { bottles: S.bottles, coreTarget: L.CORE_TARGET })
    .forEach(m => {
      const w = el('div', 'warn' + (m.level === 'ok' ? ' ok' : ''));
      w.innerHTML = '<b>' + (m.level === 'ok' ? '\u2713' : '!') + '</b> ';
      w.appendChild(document.createTextNode(m.msg));
      vbox.appendChild(w);
    });
  body.appendChild(vbox);

  // the proof ladder
  const lad = el('div', 'sheet');
  lad.appendChild(el('h3', null, 'The pours'));
  const ladder = el('div', 'ladder');
  ladder.appendChild(el('div', 'axis'));
  f.core.forEach((p, i) => {
    const pd = prod(p.k);
    const card = f.cards[i] || {};
    const spotted = /SPOTTED/i.test(card.wood || '');
    const r = el('div', 'rung ' + (spotted ? 'spot' : 'blind'));
    r.appendChild(el('div', 'pin', pd ? pd.proof : (card.proof || '')));
    r.appendChild(el('div', 'tick'));
    const b = el('div', 'body');
    b.appendChild(el('div', 'b', (p.letter || String.fromCharCode(65 + i)) + ' \u00b7 '
      + (pd ? pd.name : p.card)));
    const woodBits = pd && pd.fin ? pd.fin : (card.wood || '').split('\u2014')[0].trim();
    if (woodBits) b.appendChild(el('div', 'w', woodBits));
    r.appendChild(b);
    ladder.appendChild(r);
  });
  lad.appendChild(ladder);
  lad.appendChild(el('div', 'snack', 'Snacks: ' + L.snacksFor(prods).join(', ')));
  body.appendChild(lad);

  // bench
  if (f.ext.length) {
    const e = el('div', 'sheet');
    e.appendChild(el('h3', null, 'On the bench'));
    f.ext.forEach(x => {
      const pd = prod(x.k);
      e.appendChild(el('div', 'sub', (pd ? pd.name + ' \u00b7 ' + pd.proof : x.card)));
    });
    body.appendChild(e);
  }

  // why it is built this way
  if (f.why && f.why.length) {
    const w = el('div', 'sheet');
    w.appendChild(el('h3', null, 'Why it is built this way'));
    f.why.forEach(x => {
      const p2 = el('p'); p2.style.cssText = 'font-size:13px;margin:8px 0 0;color:var(--ink)';
      p2.textContent = x; w.appendChild(p2);
    });
    body.appendChild(w);
  }

  const act = el('div', 'sheet');
  const edit = el('button', 'btn ghost wide', 'Edit this flight');
  edit.onclick = () => flightEditor(f);
  act.appendChild(edit);
  const sms = el('button', 'btn wide', 'Text the summary');
  sms.onclick = () => {
    const bodyTxt = L.smsBody(f, prods);
    location.href = 'sms:?&body=' + encodeURIComponent(bodyTxt);
  };
  act.appendChild(sms);
  const ran = el('button', 'btn ghost wide', 'Mark as run tonight');
  ran.onclick = () => {
    S.history.push({ flight: f.title, at: new Date().toISOString().slice(0, 10),
                     pours: f.core.map(p => p.k), kind: 'flight' });
    save_(); renderFlights(); renderHome(); showFlight(f);
  };
  act.appendChild(ran);
  body.appendChild(act);

  show('detail');
}

/* --- boot ----------------------------------------------------------- */
function boot(data) {
  S.base = data.catalog; S.bottles = data.bottles; S.flights = data.flights;
  load();                       // user layers, including their own bottles list
  rebuildCatalog();
  // A shipped flight the user has adjusted: re-apply their version.
  S.flights = S.flights.map(f => {
    const ov = S.edits['flight:' + f.title];
    return ov ? Object.assign({}, f, ov) : f;
  });
  renderShelfFilters(); renderShelf(); renderReels(); renderPayline();
  renderFlights(); renderHome(); renderReference(); renderShop();
  fetch('./map.json').then(r => r.json()).then(md => {
    MAPDATA = md; wireMap(); renderMap(); drawHomeMap();
  }).catch(() => {
    $('#mapCount').textContent = 'map.json did not load';
  });
  const f = el('footer');
  f.innerHTML = 'Killer B\u2019s Bottle Tracker <span id="verString">v0.1.17</span>'
    + ' \u00b7 <span id="buildTime"></span>';
  document.body.appendChild(f);
  // Header sub-line and build stamp, kept in sync with the constants.
  const hv = document.getElementById('header-version');
  if (hv) hv.textContent = 'v' + APP_VERSION;
  const bt = document.getElementById('buildTime');
  if (bt) bt.textContent = 'Build ' + BUILD_TIME;
}

window.addEventListener('error', e => {
  console.warn('unhandled error', e.error || e.message);
  if (typeof toast === 'function') toast('Something went wrong on that screen.');
});

document.querySelectorAll('nav button').forEach(b =>
  b.onclick = () => show(b.dataset.scr));
$('#backBtn').onclick = () => show(S.lastList || 'flights');
$('#q').addEventListener('input', renderShelf);
$('#refQ').addEventListener('input', renderReference);
$('#shopQ').addEventListener('input', renderShop);
$('#spinBtn').onclick = doSpin;
$('#clearHolds').onclick = () => { S.held = {}; renderReels(); };
$('#addBottleBtn').onclick = () => productForm(null);
$('#addFlightBtn').onclick = () => flightEditor(L.newFlight('New flight'));
$('#overlay').onclick = e => { if (e.target.id === 'overlay') closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

let MAPDATA = { world: [], states: {}, coast: [], distilleries: {},
                countryPos: {}, subCountry: {}, worldDist: {}, stateOf: {} };

fetch('./data.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(boot)
  .catch(err => {
    console.warn('data load failed', err);
    const box = document.createElement('div');
    box.className = 'warn';
    box.style.margin = '14px';
    box.innerHTML = '<b>!</b> The shelf did not load. '
      + 'data.json has to sit beside index.html. '
      + 'If you are offline and have opened the app before, try again once you '
      + 'have a connection — the cached copy is used automatically.';
    document.body.insertBefore(box, document.body.firstChild);
  });

/* --- install and auto-update ------------------------------------------
   The same shape MadGolf uses: check for a new worker on every load, take
   it immediately when nothing is half-finished on screen, and hold it with
   a toast when something is. */
if ('serviceWorker' in navigator) {
  let _swReg = null;
  let _swReloading = false;

  // The analogue of "mid-round" here is an open form: a modal with typing in
  // it, or a flight being edited. Reloading under those loses work.
  function _swIsBusy() {
    const ov = document.getElementById('overlay');
    if (ov && ov.classList.contains('on')) return true;
    const el2 = document.activeElement;
    return !!(el2 && /^(INPUT|TEXTAREA|SELECT)$/.test(el2.tagName) && el2.value);
  }

  function _swActivateNow() {
    if (_swReg && _swReg.waiting) _swReg.waiting.postMessage({ type: 'SKIP_WAITING' });
  }

  function _swHandleUpdate(worker) {
    if (!worker) return;
    const act = () => {
      if (!_swIsBusy()) { _swActivateNow(); return; }
      if (typeof toast === 'function') toast('Update ready — reload when you are done');
      // Take it as soon as the screen is idle rather than leaving it waiting
      // until the next cold start.
      const poll = setInterval(() => {
        if (!_swIsBusy()) { clearInterval(poll); _swActivateNow(); }
      }, 20000);
    };
    if (worker.state === 'installed') act();
    worker.addEventListener('statechange', () => {
      if (worker.state === 'installed' && navigator.serviceWorker.controller) act();
    });
  }

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      _swReg = reg;
      reg.update().catch(() => {});          // bypass the browser's 24-hour delay
      reg.addEventListener('updatefound', () => _swHandleUpdate(reg.installing));
      if (reg.waiting) _swHandleUpdate(reg.waiting);
      // Used at home and in shops rather than all day: an hourly check is
      // plenty and costs nothing when the app is closed.
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
    }).catch(err => console.warn('SW registration failed:', err));

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!_swReloading) { _swReloading = true; window.location.reload(); }
    });
  });
}

// Install to the home screen. Chrome fires this; iOS Safari does not, so the
// home page tells iOS users to use Share, Add to Home Screen instead.
let _installEvt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _installEvt = e;
  const b = document.getElementById('installBtn');
  if (b) b.style.display = '';
});
window.addEventListener('appinstalled', () => {
  _installEvt = null;
  const b = document.getElementById('installBtn');
  if (b) b.style.display = 'none';
});



if (typeof module !== 'undefined' && module.exports) module.exports = L;
