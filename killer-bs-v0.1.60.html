<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1613">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Killer B's Bottle Tracker</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink-deep:#1A1613; --gold:#8A6A28; --rust:#7A3B1E;
  --paper:#F2EDE3; --card:#FFFCF6; --ink:#241F1A; --mute:#6E665C;
  --line:#D8CFBD; --ok:#2E6B4F;
  /* Type colours are the liquid: the range your own flight cards name,
     pale gold through mahogany. They code the type column, not decorate it. */
  --t-bourbon:#B4762B;   /* deep amber   */
  --t-scotch:#5C6B63;    /* peat, coastal green-grey */
  --t-irish:#8C8034;     /* green gold   */
  --t-rye:#9C4A22;       /* rust         */
  --t-malt:#7A6142;      /* burnished    */
  --t-other:#6B3550;     /* dark plum    */
  --felt:#243B33;        /* the machine's cabinet */
  --nav-h:58px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:15px; line-height:1.45;
  font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
  /* 100dvh, not 100vh: on mobile Safari the toolbar makes vh wrong. */
  height:100dvh;
  display:flex; flex-direction:column;
  overflow:hidden;
  padding-top:env(safe-area-inset-top);
}
h1,h2,h3{font-family:'Cinzel',Georgia,serif;font-weight:600;margin:0;line-height:1.2;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink-deep);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- structure ---------- */
.screen{display:none}
/* The active screen is the only thing that scrolls, inside a body sized to
   the viewport. The nav sits after it in the flex column, so nothing can
   ever be underneath it.

   The fade is the second half of that: a scrolling box clips whatever row
   happens to meet its bottom edge, and a row sliced in half against the bar
   reads as content hidden behind it. Fading the last few pixels makes the
   cut deliberate, and the extra bottom padding means the final row can
   always be scrolled clear of the fade. */
.screen.on{display:block;flex:1;min-height:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:14px 14px 40px;width:100%;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent)}

/* A hairline and a lift, so the bar reads as sitting above the page rather
   than being part of it. */
nav{box-shadow:0 -1px 0 rgba(26,22,19,.10), 0 -8px 18px rgba(26,22,19,.06)}
.screen.on{display:block}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:12px;flex-wrap:wrap}
.hdr-acts{display:flex;align-items:center;gap:7px;margin-left:auto}
.btn-sm{padding:8px 13px;font-size:13px}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#1A1613;font-weight:600}
/* Detail screens put their actions on one row under the back button, so the
   thing you came to do is reachable without scrolling past the record. */
.detail-acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center;
  margin-bottom:12px}
/* Back sits first and is visually quieter than the actions beside it. */
.detail-acts #backBtn{padding-left:10px}
.hdr h1{font-size:21px;color:var(--ink-deep)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.instbtn{width:36px;height:36px;flex:none;border-radius:9px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-deep);
  font-size:17px;line-height:1}
/* Only the first pushes off the wordmark; the rest sit beside it. */
.brand .instbtn:first-of-type{margin-left:auto}
.brand .instbtn + .instbtn{margin-left:6px}
/* Hidden buttons must not claim the auto margin, or the gear jumps left when
   the install prompt appears. */
.brand .instbtn[hidden]{display:none}
.brand img{width:52px;height:52px;flex:none}
.brand .wm{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:17px;
  line-height:1.1;color:var(--ink-deep)}
.brand .wm span{display:block;font-family:'IBM Plex Sans',sans-serif;font-weight:400;
  font-size:11.5px;color:var(--mute);letter-spacing:.04em;margin-top:3px}
.hdr-sub{font-family:'IBM Plex Sans',sans-serif;font-weight:400;font-size:10.5px;
  color:var(--mute);letter-spacing:.04em;margin-top:2px}
.count{color:var(--mute);font-size:13px}

/* ---------- nav ---------- */
nav{
  /* position:relative so the z-index actually applies: an unpositioned
     element ignores it, which would drop the bar behind the modal overlay.
     Rule 19 puts nav above the overlay on purpose, so it stays tappable. */
  position:relative;flex-shrink:0;z-index:250;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(7,1fr);
  background:var(--ink-deep);
}
nav button{
  background:none;border:0;color:#B9C3D4;font-size:9.5px;letter-spacing:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:0;
}
nav button .g{font-size:16px;line-height:1;display:flex;align-items:center;
  justify-content:center;height:17px}
nav button .ni{height:17px;width:auto;fill:none;stroke:currentColor;
  stroke-width:1.5;stroke-linejoin:round}
nav button[aria-current="page"] .ni{stroke:#fff}
nav button[aria-current="page"]{color:#fff;box-shadow:inset 0 2px 0 var(--gold)}

/* ---------- controls ---------- */
.field{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
  background:var(--card);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{
  padding:5px 11px;border:1px solid var(--line);border-radius:999px;
  background:var(--card);font-size:13px;color:var(--mute);
}
.chip[aria-pressed="true"]{background:var(--ink-deep);border-color:var(--ink-deep);color:#fff}
.btn{padding:10px 15px;border:1px solid var(--ink-deep);border-radius:7px;
  background:var(--ink-deep);color:#fff;font-size:14px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink-deep)}
.btn.wide{width:100%;margin-top:8px}

/* ---------- bottle rows ---------- */
.list{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:9px;overflow:hidden}
.item{background:var(--card);border:0;width:100%;text-align:left;
  padding:6px 11px;display:grid;grid-template-columns:1fr 96px 52px;
  gap:10px;align-items:baseline}
.item .nm{font-size:13.5px;font-weight:500;line-height:1.3}
.item .sub{font-size:11.5px;color:var(--mute);line-height:1.3}
.item .ty{font-size:11.5px;color:var(--mute);text-align:left}
.item .pf{font-size:13.5px;color:var(--ink-deep);font-weight:600;text-align:right}
/* Narrow phones drop the type column into the subtitle line. */
@media (max-width:430px){
  .item{grid-template-columns:1fr 48px}
  .item .ty{display:none}
}
.listhead{display:grid;grid-template-columns:1fr 96px 52px;gap:10px;
  padding:0 11px 5px;font-size:11px;color:var(--mute)}
.listhead b:last-child{text-align:right}
.listhead b{font-weight:500}
@media (max-width:430px){.listhead{display:none}}
.filterbar{position:sticky;top:0;z-index:20;background:var(--paper);
  padding-top:8px;margin-bottom:8px}
.sortrow{display:flex;gap:8px;align-items:center;margin-top:7px}
.sortrow .chip{flex:none}
.sortrow .chip[data-on="true"]{background:var(--gold);border-color:var(--gold);color:#1A1613}
.sortpick{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;
  color:var(--mute);white-space:nowrap}
.sortpick select{padding:6px 26px 6px 9px;font-size:13px}
.facet{margin-top:8px}
.facet .fh{font-size:10.5px;letter-spacing:.05em;color:var(--gold);
  text-transform:uppercase;margin-bottom:4px}
.clearrow{display:flex;justify-content:space-between;align-items:center;
  margin-top:9px;font-size:12px;color:var(--mute)}
/* A pour that is not a bottle on the shelf reads differently. */
.rung.wish .b, .item.wish{opacity:.72}
.pourtag{display:inline-block;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;padding:1px 5px;border-radius:3px;margin-left:6px;
  vertical-align:2px}
.pourtag.wish{background:#EDE0C4;color:#6E5320}
.pourtag.blend{background:#DCE6DE;color:#2F5D45}
.chip.pick{flex:none;padding-right:22px;position:relative}
.chip.pick::after{content:'';position:absolute;right:9px;top:calc(50% - 2px);
  border:4px solid transparent;border-top-color:currentColor}
.chip.pick[data-on="true"]{background:var(--ink-deep);border-color:var(--ink-deep);
  color:#fff}
/* A list inside a card that could run long enough to bury what follows it. */
.scrollbox{max-height:40vh;overflow-y:auto;margin-top:6px;
  border-top:1px solid var(--line);padding-bottom:10px;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent)}
/* Shop is a column: search fixed at the top, shelf data scrolling in the
   middle, the verdict held at the bottom where it can always be read. */
.shopscreen.on{display:flex;flex-direction:column;
  padding-bottom:8px;overflow:hidden;
  -webkit-mask-image:none;mask-image:none}
/* Only the shelf scrolls. The bottle and the verdict are what you came for,
   so they hold the bottom of the screen and never move. */
.shopscreen #shopScroll{flex:1 1 auto;overflow-y:auto;min-height:54px;
  margin-top:10px;-webkit-overflow-scrolling:touch;padding-bottom:16px;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent)}
.shopscreen #shopFixed{flex:0 0 auto;margin-top:9px;
  border-top:1px solid var(--line);padding-top:9px;
  max-height:62vh;overflow-y:auto}
.picklist{background:var(--card);border:1px solid var(--line);border-radius:9px;
  margin-top:7px;box-shadow:0 6px 18px rgba(26,22,19,.14);
  max-height:52vh;overflow-y:auto}
.pickrow{display:grid;grid-template-columns:20px 1fr auto;gap:8px;width:100%;
  align-items:center;padding:9px 12px;background:none;border:0;
  border-top:1px solid var(--line);text-align:left;font-size:13.5px}
.pickrow:first-child{border-top:0}
.pickrow.on{background:#FBF4E2}
.pickrow .tick{color:var(--gold);font-weight:700}
.pickrow .num{color:var(--mute);font-size:12px}
.scroller{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px;
  scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}
.sealed .nm{color:var(--mute)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:middle;
  margin-right:6px;background:var(--t-other)}
.t-bourbon .dot{background:var(--t-bourbon)} .t-scotch .dot{background:var(--t-scotch)}
.t-irish .dot{background:var(--t-irish)}     .t-rye .dot{background:var(--t-rye)}
.t-malt .dot{background:var(--t-malt)}       .t-other .dot{background:var(--t-other)}
/* Sealed reads as a ring rather than a fill: the bottle exists, it is not open. */
.sealed .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.item .ty{font-weight:500}
.t-bourbon .ty{color:var(--t-bourbon)} .t-scotch .ty{color:var(--t-scotch)}
.t-irish .ty{color:var(--t-irish)}     .t-rye .ty{color:var(--t-rye)}
.t-malt .ty{color:var(--t-malt)}       .t-other .ty{color:var(--t-other)}

/* ---------- detail ---------- */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
.kv.tn{grid-template-columns:64px 1fr;margin-top:8px;font-size:13px;line-height:1.4}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;
  background:#EDE9DF;color:var(--gold);margin:0 4px 4px 0}
.tag.wine{background:#F3E4E4;color:var(--rust)}
.tag.wood{background:#E6EAE6;color:var(--ok)}
.src{font-size:11px;color:var(--mute)}

/* ---------- proof ladder: the signature element ---------- */
.ladder{position:relative;margin:14px 0 6px;padding-left:52px}
.ladder .axis{position:absolute;left:42px;top:0;bottom:0;width:1px;background:var(--line)}
.rung{position:relative;display:grid;grid-template-columns:1fr;padding:3px 0}
.rung .pin{position:absolute;left:-52px;width:40px;text-align:right;
  font-size:13px;color:var(--ink-deep);font-weight:600}
.rung .tick{position:absolute;left:-11px;top:50%;width:11px;height:1px;background:var(--line)}
.rung .body{border-left:3px solid var(--line);padding:4px 0 4px 10px}
.rung.spot .body{border-left-color:var(--gold)}
.rung.blind .body{border-left-color:var(--rust)}
.rung .b{font-size:13.5px;font-weight:500}
.rung .w{font-size:12px;color:var(--mute)}

/* ---------- flights ---------- */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 13px;margin-bottom:9px;width:100%;text-align:left}
.fcard h3{font-size:15px;color:var(--ink-deep);letter-spacing:.02em}
.fcard .var{font-size:12.5px;color:var(--gold);margin-top:2px}
.fcard .meta{font-size:12px;color:var(--mute);margin-top:6px}
.done{border-left:3px solid var(--ok)}
.warn{background:#FBF5EC;border:1px solid #E3D3B4;border-radius:8px;padding:9px 11px;
  font-size:13px;margin-bottom:8px}
.warn b{color:var(--gold)}
.ok{background:#EFF5F1;border-color:#CBDFD2}
.ok b{color:var(--ok)}
.snack{font-size:13px;color:var(--mute);margin-top:8px}
.note{font-size:13px;padding:7px 0;border-top:1px solid var(--line);line-height:1.4}
.note:first-of-type{border-top:0}
.nsrc{font-size:10px;letter-spacing:.05em;color:var(--gold);text-transform:uppercase;
  margin-bottom:2px}
textarea.field{font:inherit;resize:vertical;min-height:56px}
.empty{color:var(--mute);font-size:14px;padding:20px 4px;text-align:center}
footer{text-align:center;color:var(--mute);font-size:11px;padding:14px 0 4px}

/* ---------- wider screens ----------
   The app is laid out for a phone. On a desktop the same single column
   stretched to 1400px, which made every row a long thin ribbon and the
   summary tiles enormous. Cap the measure, then use the width that is left
   to put the summary side by side instead of scrolling past it. */
.screen{max-width:820px;margin:0 auto}
@media (min-width:700px){
  .tiles{grid-template-columns:repeat(6,1fr)}
  .tile .v{font-size:24px}
  /* Charts two across, so the summary fits a screen instead of six. */
  #homeBody{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;
    align-items:start}
  #homeBody > .tiles{grid-column:1 / -1}
  /* The map, the log and anything after them run the full width. */
  #homeBody > .sheet:nth-last-child(-n+2){grid-column:1 / -1}
  #homeBody > div:last-child{grid-column:1 / -1}
  .homemap{height:46vh}
  .payline{gap:14px}
  .glass svg{max-width:118px}
  .reel .rv{font-size:17px}
}
@media (min-width:1000px){
  .screen{max-width:960px}
  nav{max-width:960px;margin:0 auto;width:100%;border-radius:12px 12px 0 0}
}

/* ---------- the machine ---------- */
.machine{background:var(--felt);border-radius:14px;padding:13px 12px 15px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 2px 10px rgba(26,22,19,.22)}
.reels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.reel{background:#F7F2E7;border-radius:8px;padding:9px 4px 8px;text-align:center;
  border:2px solid transparent;cursor:pointer;overflow:hidden}
.reel[data-held="true"]{border-color:var(--gold);background:#FBF4E2}
.reel .rl{font-size:10px;letter-spacing:.04em;color:var(--mute);text-transform:uppercase}
.reel .rv{font-family:'Cinzel',Georgia,serif;font-size:15.5px;font-weight:700;
  color:var(--ink-deep);margin-top:4px;min-height:38px;line-height:1.22;
  display:flex;align-items:center;justify-content:center;hyphens:auto}
.reel .hold{font-size:9.5px;color:var(--gold);letter-spacing:.06em;
  visibility:hidden;margin-top:2px;font-weight:600}
.reel[data-held="true"] .hold{visibility:visible}
.reel.spinning .rv{animation:tumble .42s linear}
@keyframes tumble{
  0%{transform:translateY(0);opacity:1}
  40%{transform:translateY(-16px);opacity:0}
  60%{transform:translateY(16px);opacity:0}
  100%{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.reel.spinning .rv{animation:none}}
.spinrow{display:flex;justify-content:center;margin-top:13px}
.spin{background:var(--gold);border:2px solid var(--gold);border-radius:999px;
  color:#1A1613;font-family:'Cinzel',Georgia,serif;font-weight:700;
  font-size:19px;letter-spacing:.06em;padding:14px 46px;
  box-shadow:0 3px 0 #6E5320, 0 5px 14px rgba(26,22,19,.3)}
.spin:active{transform:translateY(2px);box-shadow:0 1px 0 #6E5320}
.holdhint{text-align:center;font-size:11.5px;color:rgba(237,228,210,.6);
  margin-top:9px;letter-spacing:.03em}
.lever{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:11px}
.lever .btn{background:var(--gold);border-color:var(--gold);color:#1A1613;font-weight:600;
  letter-spacing:.03em;font-size:15px;padding:12px 15px}
.lever .btn.sm{background:transparent;border-color:rgba(255,255,255,.28);color:#EDE4D2;
  font-weight:400}

/* ---------- the payout: three Glencairns ---------- */
.payline{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}
.glass{background:transparent;border:0;padding:0;text-align:center;cursor:pointer}
.glass svg{width:100%;height:auto;max-width:96px;display:block;margin:0 auto}
.glass .gn{font-size:12.5px;line-height:1.3;color:#EDE4D2;margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.glass .gp{font-size:13px;color:var(--gold);font-weight:600;margin-top:3px}
.glass.empty .gn{color:rgba(237,228,210,.42)}
.glass:disabled{cursor:default}
.machine .empty{color:rgba(237,228,210,.72);font-size:13px;padding:12px 4px 2px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(26,22,19,.55);
  display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:var(--paper);width:100%;max-width:560px;max-height:88vh;
  overflow-y:auto;border-radius:14px 14px 0 0;padding:16px 15px
  calc(18px + env(safe-area-inset-bottom))}
.modal h2{font-size:18px;color:var(--ink-deep);margin-bottom:11px}
.form{display:grid;gap:9px}
.form label{font-size:12px;color:var(--mute);display:block}
.form label .field,.form label select{margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.lookrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

<script>
'use strict';
const APP_VERSION = '0.1.60';
const BUILD_TIME  = '2026-09-01 09:56 AM ET';

/* =====================================================================
   PURE LOGIC — every function below is called by the test harness.
   Render functions do templating only (build rule 30): anything that
   computes lives here, named, and is exercised by dram-test.js.
   ===================================================================== */
const L = {};

/* --- inventory ----------------------------------------------------- */

// A product is pourable when at least one bottle of it is open. Derived,
// never stored: BZ buys a backup of anything he wants to keep having, so
// "do I own two" and "can I pour it" are different questions.
L.pourable = function (key, bottles) {
  return bottles.some(b => b.k === key && b.status === 'open');
};

L.ownedCount = function (key, bottles) {
  return bottles.filter(b => b.k === key && b.status !== 'gone').length;
};

// Secondary over MSRP. Null when either side is missing or zero -- 0.0 in
// the source data means "not recorded", not "worthless".
// Wording for a premium ratio. Above 1 is a premium; below 1 the secondary
// is UNDER retail, which is a discount and must not read as a premium.
L.premiumText = function (r) {
  if (!r) return null;
  if (r > 1.02) return r + '\u00d7 over MSRP';
  if (r < 0.98) return r + '\u00d7 MSRP \u2014 under retail';
  return 'about MSRP';
};

L.premium = function (msrp, secondary) {
  if (!msrp || !secondary || msrp <= 0 || secondary <= 0) return null;
  return Math.round((secondary / msrp) * 100) / 100;
};

// Exits are not all the same event. A drain pour is an opinion; a gift
// leaves the bottle in existence somewhere else.
L.EXITS = ['finished', 'drain pour', 'gifted', 'traded', 'sold', 'broken'];

L.isDrain = function (reason) { return reason === 'drain pour'; };

// Shelf filtering. Kept out of the render function so the harness can
// exercise it: status, type and free text are three independent gates and
// getting their interaction wrong is silent.
// Each facet is an independent gate; an empty list means that facet is off.
// They are all AND-ed, so narrowing one never widens another.
L.shelfFilter = function (products, bottles, opts) {
  const o = opts || {};
  const q = (o.q || '').toLowerCase().trim();
  const has = k => o[k] && o[k].length ? o[k] : null;
  const types = has('types'), obsc = has('obsc'), regions = has('regions');
  const bands = has('bands'), proofs = has('proofs'), scars = has('scars');

  return products.filter(p => {
    if (L.ownedCount(p.k, bottles) === 0) return false;
    const open = L.pourable(p.k, bottles);
    if (o.status === 'open' && !open) return false;
    if (o.status === 'sealed' && open) return false;
    if (types && types.indexOf(p.sub) < 0) return false;
    if (obsc && obsc.indexOf(p.obsc) < 0) return false;
    if (regions && regions.indexOf(p.region) < 0) return false;
    if (scars && scars.indexOf(p.scar) < 0) return false;
    if (bands && bands.indexOf(L.priceBand(p.msrp)) < 0) return false;
    if (proofs && !proofs.some(f => L.faceMatch('proof', f, p))) return false;
    // A finish filter that is on but has nothing selected would hide the
    // whole shelf; treat the three states explicitly instead.
    if (o.cask === 'wine' && p.wine !== true) return false;
    if (o.cask === 'wood' && p.wine !== false) return false;
    if (o.cask === 'none' && p.fin) return false;
    if (o.age === 'stated' && !p.age) return false;
    if (o.age === 'nas' && p.age) return false;
    if (q && !((p.name || '') + ' ' + (p.dist || '')).toLowerCase().includes(q)) return false;
    return true;
  });
};

// Sorting the shelf. Every comparator falls back to name so the order is
// stable rather than depending on object insertion order.
L.SORTS = [
  { id: 'name',   label: 'Name' },
  { id: 'proof',  label: 'Proof \u2191' },
  { id: 'proofd', label: 'Proof \u2193' },
  { id: 'dist',   label: 'Distillery' },
  { id: 'age',    label: 'Oldest' },
  { id: 'price',  label: 'Dearest' },
  { id: 'cheap',  label: 'Cheapest' }
];

L.shelfSort = function (products, id) {
  const by = (products || []).slice();
  const name = (a, b) => (a.name || '').localeCompare(b.name || '');
  // Missing values sort last on every key rather than reading as zero, so a
  // no-age-stated bottle never poses as the youngest.
  const num = (v, dir) => (v === null || v === undefined || v === '')
    ? (dir > 0 ? Infinity : -Infinity) : v;
  const cmp = {
    name: name,
    proof: (a, b) => (a.proof - b.proof) || name(a, b),
    proofd: (a, b) => (b.proof - a.proof) || name(a, b),
    dist: (a, b) => (a.dist || '').localeCompare(b.dist || '') || name(a, b),
    age: (a, b) => (num(b.age, -1) - num(a.age, -1)) || name(a, b),
    price: (a, b) => (num(b.msrp, -1) - num(a.msrp, -1)) || name(a, b),
    cheap: (a, b) => (num(a.msrp, 1) - num(b.msrp, 1)) || name(a, b)
  };
  return by.sort(cmp[id] || cmp.name);
};

// Which facets are actually narrowing the shelf right now.
L.activeFacets = function (o) {
  let n = 0;
  ['types', 'obsc', 'regions', 'bands', 'proofs', 'scars'].forEach(k => {
    if (o[k] && o[k].length) n++;
  });
  if (o.cask) n++;
  if (o.age) n++;
  return n;
};

/* --- pick my pour --------------------------------------------------- */

// Score a candidate. Higher is a better suggestion tonight. Every term
// has a reason attached so the UI can say WHY, which is the whole point
// of the feature -- an unexplained random pick is just a shuffle.
L.pourScore = function (prod, opts, history) {
  const o = opts || {};
  if (o.maxProof && prod.proof > o.maxProof) return null;
  if (o.style && o.style.length && !o.style.includes(prod.sub)) return null;
  if (o.obsc && o.obsc.length && !o.obsc.includes(prod.obsc)) return null;

  let score = 0;
  const why = [];
  const seen = (history || []).filter(h => h.k === prod.k).length;

  if (seen === 0) { score += 40; why.push('never poured'); }
  else if (seen === 1) { score += 15; why.push('poured once'); }
  else { score -= seen * 6; }

  if (prod.obsc === 'obscure') { score += 18; why.push('nobody you know owns this'); }
  else if (prod.obsc === 'niche') { score += 8; }

  if (prod.scar === 'exclusive') { score += 12; why.push('distillery exclusive'); }
  else if (prod.scar === 'limited') { score += 6; }

  // A bottle finished in something unusual is a better talking point than
  // another ex-bourbon pour.
  if (prod.fin && prod.wine) { score += 7; why.push('finished in ' + prod.fin); }
  else if (prod.fin) { score += 5; why.push(prod.fin); }

  return { k: prod.k, score, why };
};

L.pickPour = function (catalog, bottles, opts, history) {
  const out = [];
  Object.values(catalog).forEach(p => {
    if (!L.pourable(p.k, bottles)) return;
    const s = L.pourScore(p, opts, history);
    if (s) out.push(s);
  });
  out.sort((a, b) => b.score - a.score || a.k.localeCompare(b.k));
  return out;
};

/* --- capitalization -------------------------------------------------- */

// House rule: sentence case for headings, buttons and prose; Title Case for
// data values shown as a label or a chip. Acronyms and the few names with
// their own casing are spelled out rather than guessed at.
L.CASE_FIXED = {
  'msrp': 'MSRP', 'nas': 'NAS', 'px': 'PX', 'str': 'STR', 'abv': 'ABV',
  'american single malt': 'American Malt', 'flavored': 'Flavoured',
  'and': 'and', 'or': 'or', 'the': 'the', 'of': 'of', 'a': 'a', 'n': 'N'
};

L.PROPER = ['islay', 'speyside', 'highland', 'lowland', 'campbeltown',
            'scotch', 'irish', 'tennessee', 'kentucky', 'american', 'japanese',
            'canadian', 'americans', 'ardbeg', 'laphroaig', 'cairdeas', 'aberlour',
            'blanton', 'pappy'];
// Names of more than one word have to be matched before the string is split
// into words, or only the first half gets its capital.
L.PROPER_PHRASES = [['gray label', 'Gray Label'], ['van winkle', 'Van Winkle'],
                    ['single malt', 'single malt']];

// Sentence case for a heading: first letter up, the rest down, except the
// proper nouns and acronyms that carry their own capitals.
L.sentenceCase = function (s) {
  if (!s) return '';
  let str = String(s).trim().toLowerCase();
  const held = [];
  L.PROPER_PHRASES.forEach(([find, rep], i) => {
    if (str.indexOf(find) >= 0) {
      str = str.split(find).join('\u0000' + i + '\u0000');
      held.push(rep);
    }
  });
  const words = str.split(/\s+/);
  const out = words.map((w, i) => {
    const bare = w.replace(/[^a-z']/g, '');
    if (L.CASE_FIXED[bare] && bare !== 'a' && bare !== 'the'
        && bare !== 'and' && bare !== 'of' && bare !== 'or' && bare !== 'n') {
      return w.replace(bare, L.CASE_FIXED[bare]);
    }
    if (L.PROPER.indexOf(bare) >= 0) {
      return w.replace(bare, bare.charAt(0).toUpperCase() + bare.slice(1));
    }
    return w;
  });
  let joined = out.join(' ');
  L.PROPER_PHRASES.forEach(([find, rep], i) => {
    joined = joined.split('\u0000' + i + '\u0000').join(rep);
  });
  return joined.charAt(0).toUpperCase() + joined.slice(1);
};

L.titleCase = function (s) {
  if (s === null || s === undefined || s === '') return '';
  const whole = String(s).trim().toLowerCase();
  if (L.CASE_FIXED[whole]) return L.CASE_FIXED[whole];
  return String(s).trim().split(/\s+/).map((w, i) => {
    const lw = w.toLowerCase();
    if (L.CASE_FIXED[lw]) return i === 0 ? L.CASE_FIXED[lw].charAt(0).toUpperCase()
      + L.CASE_FIXED[lw].slice(1) : L.CASE_FIXED[lw];
    // Keep an already-capitalised interior (McKenna, A'Bunadh) intact.
    if (/[A-Z]/.test(w.slice(1))) return w;
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  }).join(' ');
};

/* --- the reels: Time for a Taste ------------------------------------- */

// Four reels. Each face is a predicate over a product, so a spin result is
// just a set of filters -- the machine picks nothing on its own, it narrows
// the shelf and the room picks from what lines up.
L.REELS = [
  { id: 'proof', label: 'Proof', faces: [
    { v: 'any',     t: 'Any' },
    { v: 'le90',    t: '\u226490' },
    { v: '90-105',  t: '90\u2013105' },
    { v: '105-120', t: '105\u2013120' },
    { v: 'ge120',   t: '120+' } ] },
  // Real categories only. 'American single malt' is a legal standard of
  // identity (TTB, effective January 2025), not a bucket -- and single malt
  // itself is a construction that cuts across Scotch, Irish and Japanese,
  // so it cannot be a peer of bourbon.
  { id: 'type', label: 'Type', faces: [
    { v: 'any',                  t: 'Any' },
    { v: 'bourbon',              t: 'Bourbon' },
    { v: 'tennessee',            t: 'Tennessee' },
    { v: 'rye',                  t: 'Rye' },
    { v: 'wheat',                t: 'Wheat' },
    { v: 'american single malt', t: 'American Malt' },
    { v: 'scotch',               t: 'Scotch' },
    { v: 'irish',                t: 'Irish' },
    { v: 'canadian',             t: 'Canadian' },
    { v: 'japanese',             t: 'Japanese' },
    { v: 'world',                t: 'World' },
    { v: 'flavored',             t: 'Flavoured' },
    { v: 'tequila',              t: 'Tequila' } ] },
  { id: 'obsc', label: 'Recognition', faces: [
    { v: 'any',     t: 'Any' },
    { v: 'known',   t: 'Known' },
    { v: 'niche',   t: 'Niche' },
    { v: 'obscure', t: 'Obscure' } ] },
  { id: 'price', label: 'Occasion', faces: [
    { v: 'any',      t: 'Any' },
    { v: 'everyday', t: 'Everyday' },
    { v: 'good',     t: 'Good' },
    { v: 'special',  t: 'Special' },
    { v: 'vault',    t: 'Vault' } ] }
];

// Every face is an exact subcategory match now, so nothing is swept into a
// catch-all and no bottle is unreachable.
L.TYPES = ['bourbon', 'tennessee', 'rye', 'wheat', 'american single malt',
           'scotch', 'irish', 'canadian', 'japanese', 'world',
           'flavored', 'tequila'];

// The six regions the Scotch Whisky Regulations recognise. Blends and
// independent bottlings draw from everywhere, so they carry no region.
L.SCOTCH_REGIONS = ['Islay', 'Speyside', 'Highland', 'Islands',
                    'Lowland', 'Campbeltown'];

L.faceMatch = function (reelId, face, p) {
  if (!face || face === 'any') return true;
  if (reelId === 'proof') {
    const n = p.proof;
    if (face === 'le90') return n <= 90;
    if (face === '90-105') return n > 90 && n <= 105;
    if (face === '105-120') return n > 105 && n <= 120;
    if (face === 'ge120') return n > 120;
    return true;
  }
  if (reelId === 'type') return (p.sub || '').toLowerCase() === face;
  if (reelId === 'obsc') return p.obsc === face;
  if (reelId === 'price') return L.priceBand(p.msrp) === face;
  return true;
};

// Occasion, said the way a host says it rather than the way a receipt does.
L.priceBand = function (msrp) {
  if (!msrp || msrp <= 0) return null;
  if (msrp < 50) return 'everyday';
  if (msrp < 100) return 'good';
  if (msrp < 200) return 'special';
  return 'vault';
};

// Spin the reels that are not held. rnd is injectable so the harness can
// drive it deterministically. Free-running: this can land on a combination
// nothing satisfies, which is why spinValid below is what the machine uses.
L.spin = function (current, held, rnd) {
  const r = rnd || Math.random;
  const out = {};
  L.REELS.forEach(reel => {
    if (held && held[reel.id]) { out[reel.id] = current[reel.id] || 'any'; return; }
    out[reel.id] = reel.faces[Math.floor(r() * reel.faces.length)].v;
  });
  return out;
};

// The reels a bottle would satisfy, one face per reel.
L.facesOf = function (p) {
  const out = {};
  L.REELS.forEach(reel => {
    const f = reel.faces.find(x => x.v !== 'any' && L.faceMatch(reel.id, x.v, p));
    out[reel.id] = f ? f.v : 'any';
  });
  return out;
};

// A spin that pays nothing is a broken machine. Rather than rolling blind and
// hoping, pick a bottle that satisfies the HELD reels and then describe it
// with the unheld ones -- each unheld reel either narrows to that bottle's
// face or opens up. Whatever lands, at least one pour matches.
// Returns null when the holds themselves are unsatisfiable; the caller says so
// rather than showing an empty payline.
L.spinValid = function (current, held, catalog, bottles, rnd) {
  const r = rnd || Math.random;
  const heldIds = L.REELS.filter(x => held && held[x.id]).map(x => x.id);

  const pool = Object.values(catalog).filter(p => {
    if (!L.pourable(p.k, bottles) || p.drained) return false;
    return heldIds.every(id => L.faceMatch(id, current[id], p));
  });
  if (!pool.length) return null;

  const pick = pool[Math.floor(r() * pool.length)];
  const faces = L.facesOf(pick);
  const out = {};
  L.REELS.forEach(reel => {
    if (held && held[reel.id]) { out[reel.id] = current[reel.id] || 'any'; return; }
    // Half the time narrow to the bottle, half leave the reel open, so the
    // machine still varies instead of always naming one exact whisky.
    out[reel.id] = r() < 0.5 ? 'any' : faces[reel.id];
  });
  return out;
};

// Everything open that matches every reel. Three glasses get filled from the
// top of this, ranked by the same scorer the shelf uses.
L.reelMatches = function (catalog, bottles, reels, history) {
  const hits = [];
  Object.values(catalog).forEach(p => {
    if (!L.pourable(p.k, bottles)) return;
    if (p.drained) return;
    const ok = L.REELS.every(reel => L.faceMatch(reel.id, reels[reel.id], p));
    if (!ok) return;
    const s = L.pourScore(p, {}, history);
    if (s) hits.push(s);
  });
  hits.sort((a, b) => b.score - a.score || a.k.localeCompare(b.k));
  return hits;
};

// Three glasses. A tight filter fills fewer, which is the honest signal that
// the reels are asking for something the shelf does not have.
L.GLASSES = 3;
L.pourGlasses = function (catalog, bottles, reels, history) {
  return L.reelMatches(catalog, bottles, reels, history).slice(0, L.GLASSES);
};

/* --- the map --------------------------------------------------------- */

// Equirectangular with the longitude axis scaled by cos(latitude). Over a
// country the size of Scotland this is accurate enough that the distilleries
// sit where they really are, which is the whole point: Three Miles Apart is
// only a flight because Ardbeg, Lagavulin and Laphroaig genuinely are.
L.MAP_LAT0 = 56.8;

L.project = function (lon, lat) {
  return [lon * Math.cos(L.MAP_LAT0 * Math.PI / 180), -lat];
};

// Fit a set of projected points into a viewBox with a margin.
L.mapExtent = function (rings, pad) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  rings.forEach(r => r.forEach(pt => {
    const [x, y] = L.project(pt[0], pt[1]);
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }));
  const m = pad === undefined ? 0.1 : pad;
  return { x: x0 - m, y: y0 - m, w: (x1 - x0) + m * 2, h: (y1 - y0) + m * 2 };
};

// One pin per distillery: how many bottles, which region, where.
// One pin per distillery. `subs` limits which categories are placed, so the
// same function serves the Scotch layer and the US layer.
L.mapPins = function (catalog, coords, bottles, subs) {
  const by = {};
  Object.values(catalog).forEach(p => {
    if (subs ? subs.indexOf(p.sub) < 0 : p.sub !== 'scotch') return;
    if (!coords[p.dist]) return;
    const e = by[p.dist] || (by[p.dist] = {
      dist: p.dist, region: p.region || null, lon: coords[p.dist][0],
      lat: coords[p.dist][1], total: 0, open: 0, keys: [] });
    e.total++;
    e.keys.push(p.k);
    if (L.pourable(p.k, bottles)) e.open++;
  });
  const pins = Object.values(by)
    .sort((a, b) => b.total - a.total || a.dist.localeCompare(b.dist));

  // Brands that share a site land on the same point -- Penelope bottles at
  // Bardstown Bourbon Company, Diageo's Kentucky stock comes off Buffalo
  // Trace. Two pins on one coordinate means one of them can never be tapped,
  // so co-located pins fan out onto a small ring. Deterministic, so a pin
  // does not move between renders.
  // Grouped by proximity, not exact equality: six Louisville brands sit
  // within a kilometre of each other and would still collide if only exact
  // duplicates were fanned. The ring grows with the group so a crowded town
  // spreads further than a pair.
  const at = {};
  pins.forEach(p => {
    const key = p.lat.toFixed(2) + ',' + p.lon.toFixed(2);
    (at[key] = at[key] || []).push(p);
  });
  Object.values(at).forEach(group => {
    if (group.length < 2) return;
    const ring = L.PIN_FAN * Math.max(1, group.length / 3);
    const step = (Math.PI * 2) / group.length;
    // Anchor on the group's own centre so the cluster stays where it is.
    const cLat = group.reduce((s, p) => s + p.lat, 0) / group.length;
    const cLon = group.reduce((s, p) => s + p.lon, 0) / group.length;
    group.forEach((p, i) => {
      p.lat = cLat + Math.cos(i * step) * ring;
      p.lon = cLon + Math.sin(i * step) * ring;
      p.fanned = true;
    });
  });
  return pins;
};

// About 800 metres at the base. Far enough to separate two pins at high
// zoom, close enough that neither ends up in the wrong town.
L.PIN_FAN = 0.0075;

// Pin radius, in MAP UNITS. The SVG works in degrees, so a radius has to be
// a fraction of the map's own span or it swamps the country it sits on --
// a fixed 1.45 was 64% of Scotland's width. Sized against the largest count
// in the set as well, so one layer's 185 and another's 12 both fit.
L.PIN_MIN = 0.012;      // smallest pin, as a fraction of the map width
L.PIN_MAX = 0.045;      // largest pin, same units

L.pinRadius = function (n, span, maxN) {
  const s = span || 100;
  const top = Math.max(maxN || n || 1, 1);
  const t = Math.sqrt(Math.max(n, 0) / top);          // sub-linear by area
  return s * (L.PIN_MIN + (L.PIN_MAX - L.PIN_MIN) * t);
};

// Type sizes are map units too, for the same reason.
L.mapFont = function (span, kind) {
  return span * (kind === 'count' ? 0.020 : 0.026);
};

// One map, not three. The world, the states and the Scottish coastline are
// the same surface at different detail; which of them is drawn follows the
// zoom, the way a real map does, so there is no mode to switch.
//
// One ceiling covers everything now, set by the tightest cluster anywhere on
// the map: the seven distilleries inside Bardstown need about 5,100x of the
// world span to come apart, and Islay's trio about 3,600x.
L.MAP_ZOOM = { min: 1, max: 5200 };

L.clampZoom = function (z) {
  return Math.min(L.MAP_ZOOM.max, Math.max(L.MAP_ZOOM.min, z));
};

// What is worth drawing at this zoom. Country dots give way to states, and
// states to coastline and distilleries, as the view tightens.
// Pins arrive at 8x, which is where the United States fills the window --
// landing on a view of the US with no distilleries on it was a dead chip.
L.DETAIL = { states: 4, pins: 8, coast: 26 };

L.detailAt = function (zoom) {
  return {
    countries: zoom < L.DETAIL.pins,
    states:    zoom >= L.DETAIL.states,
    usPins:    zoom >= L.DETAIL.pins,
    iePins:    zoom >= L.DETAIL.pins,
    scotPins:  zoom >= L.DETAIL.pins,
    coast:     zoom >= L.DETAIL.coast
  };
};

// A key for the current detail set, so geometry is redrawn only when it
// actually changes rather than on every frame of a pinch.
L.detailKey = function (zoom) {
  const d = L.detailAt(zoom);
  return Object.keys(d).filter(k => d[k]).join(',');
};

// Somewhere to fly to. These replace the layer chips: they move the view
// rather than switching a mode.
L.MAP_PLACES = [
  { id: 'world',     label: 'The world', lon: -30,     lat: 25,    span: 400 },
  { id: 'us',        label: 'US',        lon: -98.5,   lat: 39.5,  span: 40 },
  { id: 'kentucky',  label: 'Kentucky',  lon: -85.3,   lat: 37.9,  span: 2.2 },
  { id: 'bardstown', label: 'Bardstown', lon: -85.467, lat: 37.82, span: 0.09 },
  { id: 'tennessee', label: 'Tennessee', lon: -86.4,   lat: 35.9,  span: 2.4 },
  { id: 'scotland',  label: 'Scotland',  lon: -4.2,    lat: 57.2,  span: 8 },
  { id: 'islay',     label: 'Islay',     lon: -6.2,    lat: 55.75, span: 0.7 },
  { id: 'speyside',  label: 'Speyside',  lon: -3.22,   lat: 57.47, span: 0.5 },
  { id: 'ireland',   label: 'Ireland',   lon: -7.8,    lat: 53.4,  span: 6 },
  { id: 'midleton',  label: 'Midleton',  lon: -8.17,   lat: 51.92, span: 0.3 }
];

// Is a point inside the window, with a margin so a pin half off the edge
// still draws? Used to cull: at high zoom over Kentucky there is no reason
// to draw Scotland, and no honesty in counting it as in view.
L.inView = function (lon, lat, view, pad) {
  const [x, y] = L.project(lon, lat);
  const m = (pad === undefined ? 0.15 : pad);
  return x >= view.x - view.w * m && x <= view.x + view.w * (1 + m)
      && y >= view.y - view.h * m && y <= view.y + view.h * (1 + m);
};

// Frame a place: centre on it and fit the span it asks for. span is in
// degrees of LONGITUDE, which the projection narrows by cos(latitude), so a
// place asking for more than the map holds gets the whole map rather than a
// window two thirds its width.
L.viewFor = function (place, full) {
  const c = L.project(place.lon, place.lat);
  const spanX = place.span * Math.cos(L.MAP_LAT0 * Math.PI / 180);
  if (spanX >= full.w) return Object.assign({}, full);
  const z = L.clampZoom(full.w / spanX);
  const w = full.w / z, h = full.h / z;
  return L.clampView({ x: c[0] - w / 2, y: c[1] - h / 2, w: w, h: h }, full);
};

// Keep the visible window inside the map: panning off into blank space is
// disorienting on a phone where the gesture is easy to overshoot.
L.clampView = function (view, full) {
  const w = Math.min(view.w, full.w), h = Math.min(view.h, full.h);
  return {
    x: Math.min(Math.max(view.x, full.x), full.x + full.w - w),
    y: Math.min(Math.max(view.y, full.y), full.y + full.h - h),
    w: w, h: h
  };
};

// Zoom about a point so pinching and double-tap keep that point still.
L.zoomAbout = function (view, full, factor, fx, fy) {
  const z = L.clampZoom((full.w / view.w) * factor);
  const w = full.w / z, h = full.h / z;
  return L.clampView({ x: fx - (fx - view.x) * (w / view.w),
                       y: fy - (fy - view.y) * (h / view.h), w: w, h: h }, full);
};

/* --- map layers ------------------------------------------------------ */

// Three layers, because the useful unit of place changes with the country.
// Scotland has tasting regions; the US has states; everywhere else a single
// dot is the whole truth.
L.MAP_LAYERS = ['world', 'us', 'scotland'];

L.countryOf = function (p, subCountry, worldDist) {
  return (worldDist && worldDist[p.dist]) || (subCountry && subCountry[p.sub]) || null;
};

L.countryCounts = function (catalog, subCountry, worldDist, bottles) {
  const by = {};
  Object.values(catalog).forEach(p => {
    const c = L.countryOf(p, subCountry, worldDist);
    if (!c) return;
    const e = by[c] || (by[c] = { name: c, total: 0, open: 0, keys: [] });
    e.total++; e.keys.push(p.k);
    if (L.pourable(p.k, bottles)) e.open++;
  });
  return Object.values(by).sort((a, b) => b.total - a.total);
};

L.US_SUBS = ['bourbon', 'rye', 'tennessee', 'wheat', 'american single malt', 'flavored'];

L.stateCounts = function (catalog, stateOf, bottles) {
  const by = {};
  Object.values(catalog).forEach(p => {
    if (L.US_SUBS.indexOf(p.sub) < 0) return;
    const s = stateOf[p.dist];
    if (!s) return;                      // unconfirmed bottler: not placed
    const e = by[s] || (by[s] = { name: s, total: 0, open: 0, keys: [] });
    e.total++; e.keys.push(p.k);
    if (L.pourable(p.k, bottles)) e.open++;
  });
  return by;
};

// Choropleth steps. Kentucky holds 126 bottles and Nevada holds one, so a
// linear ramp would paint everything but Kentucky the same colour.
L.CHORO = [0, 1, 3, 8, 20, 60];
L.choroStep = function (n) {
  if (!n) return 0;
  let s = 1;
  for (let i = 1; i < L.CHORO.length; i++) if (n >= L.CHORO[i]) s = i;
  return s;
};

/* --- import ----------------------------------------------------------- */

// A CSV parser that survives real exports: quoted fields, embedded commas,
// doubled quotes, CRLF, and a trailing newline.
L.parseCSV = function (text) {
  const rows = [];
  let row = [], cell = '', q = false;
  const s = String(text || '').replace(/^\uFEFF/, '');   // strip a BOM
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) {
      if (c === '"') {
        if (s[i + 1] === '"') { cell += '"'; i++; } else { q = false; }
      } else { cell += c; }
    } else if (c === '"') { q = true; }
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') { cell += c; }
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
};

// Column aliases. Only Drams, a spreadsheet and this app's own export all
// name the same things differently; one map covers all three rather than a
// separate importer each.
L.IMPORT_ALIASES = {
  name:  ['name', 'bottle', 'product', 'title', 'spirit', 'whiskey', 'whisky',
          'bottle name', 'product name'],
  dist:  ['distillery', 'dist', 'producer', 'brand', 'distiller'],
  proof: ['proof', 'abv', 'alcohol', 'strength', 'abv %', 'alc'],
  sub:   ['category', 'type', 'subcategory', 'sub', 'style', 'spirit type'],
  age:   ['age', 'age statement', 'years', 'age (years)'],
  msrp:  ['msrp', 'price', 'retail', 'retail price', 'srp', 'value'],
  sec:   ['secondary', 'secondary price', 'market', 'market value'],
  paid:  ['paid', 'purchase price', 'cost', 'i paid'],
  fin:   ['finish', 'cask', 'cask finish', 'finished in', 'wood'],
  size:  ['size', 'volume', 'ml', 'bottle size'],
  status: ['status', 'state', 'opened', 'open'],
  notes: ['notes', 'note', 'comment', 'comments', 'my notes']
};

L.matchColumns = function (header) {
  const out = {};
  header.forEach((raw, i) => {
    const h2 = String(raw || '').trim().toLowerCase().replace(/[_-]+/g, ' ');
    Object.keys(L.IMPORT_ALIASES).forEach(field => {
      if (out[field] !== undefined) return;
      if (L.IMPORT_ALIASES[field].indexOf(h2) >= 0) out[field] = i;
    });
  });
  return out;
};

// Only Drams exports ABV, not proof. A number under 60 in a proof column is
// almost certainly an ABV, and doubling it is the only reading that makes
// sense for a whisky.
L.readProof = function (raw) {
  const n = parseFloat(String(raw || '').replace(/[^\d.]/g, ''));
  if (!isFinite(n) || n <= 0) return null;
  if (n < 60) return Math.round(n * 2 * 10) / 10;
  return Math.round(n * 10) / 10;
};

L.SUB_ALIASES = {
  'bourbon': 'bourbon', 'straight bourbon': 'bourbon', 'american whiskey': 'bourbon',
  'rye': 'rye', 'straight rye': 'rye', 'rye whiskey': 'rye',
  'wheat': 'wheat', 'wheat whiskey': 'wheat',
  'tennessee': 'tennessee', 'tennessee whiskey': 'tennessee',
  'american single malt': 'american single malt', 'american malt': 'american single malt',
  'scotch': 'scotch', 'single malt scotch': 'scotch', 'scotch whisky': 'scotch',
  'blended scotch': 'scotch', 'islay': 'scotch', 'speyside': 'scotch',
  'irish': 'irish', 'irish whiskey': 'irish', 'single pot still': 'irish',
  'canadian': 'canadian', 'canadian whisky': 'canadian',
  'japanese': 'japanese', 'japanese whisky': 'japanese',
  'world': 'world', 'world whisky': 'world', 'other': 'world',
  'flavored': 'flavored', 'flavoured': 'flavored',
  'tequila': 'tequila', 'anejo': 'tequila', 'reposado': 'tequila'
};

L.readSub = function (raw) {
  const s = String(raw || '').trim().toLowerCase();
  if (!s) return null;
  if (L.SUB_ALIASES[s]) return L.SUB_ALIASES[s];
  if (L.TYPES.indexOf(s) >= 0) return s;
  // Fall back to a word in the value: "Single Malt Scotch Whisky" is Scotch.
  const found = Object.keys(L.SUB_ALIASES).sort((a, b) => b.length - a.length)
    .find(k => s.indexOf(k) >= 0);
  return found ? L.SUB_ALIASES[found] : null;
};

// Turn a parsed CSV into rows the app can commit, with everything that went
// wrong attached to the row it went wrong on. Nothing is written here: an
// import you cannot inspect first is an import you cannot trust.
L.prepareImport = function (rows, catalog) {
  if (!rows || rows.length < 2) {
    return { cols: {}, rows: [], fatal: 'The file has no rows under its header.' };
  }
  const cols = L.matchColumns(rows[0]);
  if (cols.name === undefined) {
    return { cols: cols, rows: [],
             fatal: 'No column looks like a bottle name. Expected one of: '
               + L.IMPORT_ALIASES.name.slice(0, 4).join(', ') + '.' };
  }
  const get = (r, f) => cols[f] === undefined ? '' : (r[cols[f]] || '').trim();
  const seen = {};
  const out = [];

  rows.slice(1).forEach((r, i) => {
    const name = get(r, 'name');
    if (!name) return;                       // a blank line, not an error
    const row = { line: i + 2, name: name, issues: [], action: 'add' };
    row.proof = L.readProof(get(r, 'proof'));
    if (row.proof === null) row.issues.push('no proof');
    row.dist = get(r, 'dist') || null;
    row.sub = L.readSub(get(r, 'sub'));
    if (!row.sub) { row.sub = 'bourbon'; row.issues.push('category guessed'); }
    const num = f => {
      const v = parseFloat(get(r, f).replace(/[^\d.]/g, ''));
      return isFinite(v) && v > 0 ? v : null;
    };
    row.age = num('age'); row.msrp = num('msrp');
    row.sec = num('sec'); row.paid = num('paid');
    row.size = num('size') || 750;
    row.fin = get(r, 'fin') || null;
    row.notes = get(r, 'notes') || null;
    const st = get(r, 'status').toLowerCase();
    row.status = /seal|unopen|closed|no/.test(st) ? 'sealed' : 'open';

    // Already on the shelf, or twice in the file itself?
    const key = L.shopNorm(name);
    if (seen[key]) { row.action = 'duplicate'; row.issues.push('appears earlier in the file'); }
    seen[key] = true;
    const owned = Object.values(catalog).find(p => L.shopNorm(p.name) === key);
    if (owned) {
      row.match = owned.k;
      // A row repeated inside the file stays a duplicate: overwriting that
      // with 'exists' would add a second sealed spare for the same line.
      if (row.action !== 'duplicate') row.action = 'exists';
    }
    if (row.proof === null && row.action === 'add') row.action = 'skip';
    out.push(row);
  });

  return { cols: cols, rows: out, fatal: null };
};

L.importSummary = function (prep) {
  const c = { add: 0, exists: 0, duplicate: 0, skip: 0 };
  (prep.rows || []).forEach(r => { c[r.action] = (c[r.action] || 0) + 1; });
  return c;
};

// The template, so a spreadsheet can be built to fit rather than guessed at.
L.TEMPLATE_COLS = ['name', 'distillery', 'proof', 'category', 'age', 'finish',
                   'msrp', 'secondary', 'paid', 'size', 'status', 'notes'];

L.templateCSV = function () {
  const head = L.TEMPLATE_COLS.join(',');
  const rows = [
    ['Lagavulin 16 Year Old', 'Lagavulin', '86', 'scotch', '16', '',
     '109.99', '', '99.99', '750', 'open', 'Islay benchmark'],
    ['Old Forester 1920', 'Old Forester', '115', 'bourbon', '', '',
     '59.99', '', '', '750', 'sealed', ''],
    ['Redbreast 12 PX Edition', 'Midleton', '46', 'irish', '12', 'Pedro Ximenez',
     '99.99', '', '', '700', 'open', 'ABV works too — 46 becomes 92 proof']
  ];
  return [head].concat(rows.map(r => r.map(c =>
    /[",]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c).join(','))).join('\n');

/* --- bottle lookup ---------------------------------------------------- */

// Free half first: the catalog already knows 325 whiskies, so a name that is
// already there fills the form with no call and no cost. Only genuinely new
// bottles reach the network.
L.lookupFromCatalog = function (name, catalog) {
  const hits = L.shopSearch(name, catalog, 3);
  if (!hits.length || hits[0].score < 0.6) return null;
  const p = hits[0].p;
  return {
    source: 'shelf', name: p.name, dist: p.dist, proof: p.proof, sub: p.sub,
    style: p.style, age: p.age, fin: p.fin, msrp: p.msrp, sec: p.sec,
    scar: p.scar, obsc: p.obsc, region: p.region,
    note: 'Filled from a bottle already in the catalog.'
  };
};

// Anything coming back from a lookup is untrusted: a wrong proof is worse
// than a blank one. Keep only fields that survive a type and range check,
// and drop the rest silently rather than writing nonsense into the shelf.
L.parseLookup = function (raw) {
  if (!raw || typeof raw !== 'object') return null;
  const out = { source: 'lookup' };
  const str = (v, max) => (typeof v === 'string' && v.trim())
    ? v.trim().slice(0, max || 120) : null;
  const num = (v, lo, hi) => {
    const n = typeof v === 'number' ? v : parseFloat(v);
    return (isFinite(n) && n >= lo && n <= hi) ? n : null;
  };

  out.name = str(raw.name);
  out.dist = str(raw.dist || raw.distillery, 80);
  out.proof = num(raw.proof, 20, 200);
  // An ABV came back instead of a proof: 43 is not a proof, it is 86.
  if (out.proof === null) {
    const abv = num(raw.abv, 10, 100);
    if (abv !== null) out.proof = Math.round(abv * 2 * 10) / 10;
  }
  const sub = str(raw.sub || raw.type, 40);
  out.sub = sub && L.TYPES.indexOf(sub.toLowerCase()) >= 0 ? sub.toLowerCase() : null;
  out.style = str(raw.style, 40);
  out.age = num(raw.age, 1, 80);
  out.msrp = num(raw.msrp || raw.price, 1, 100000);
  out.fin = str(raw.fin || raw.finish, 80);
  const scar = str(raw.scar || raw.release, 20);
  out.scar = ['standard', 'batched', 'limited', 'exclusive']
    .indexOf((scar || '').toLowerCase()) >= 0 ? scar.toLowerCase() : null;
  const region = str(raw.region, 20);
  out.region = L.SCOTCH_REGIONS.indexOf(region) >= 0 ? region : null;
  out.note = str(raw.note, 300);

  // A name and a proof are the identity. Without them there is nothing worth
  // filling in.
  if (!out.name || out.proof === null) return null;
  return out;
};

// Which fields a lookup actually filled, so the form can mark them as
// somebody else's answer rather than yours.
L.lookupFilled = function (res) {
  if (!res) return [];
  return ['name', 'dist', 'proof', 'sub', 'style', 'age', 'fin', 'msrp',
          'scar', 'region'].filter(k => res[k] !== null && res[k] !== undefined
                                        && res[k] !== '');
};

L.lookupUrl = function (base, name) {
  if (!base) return null;
  const sep = base.indexOf('?') >= 0 ? '&' : '?';
  return base + sep + 'name=' + encodeURIComponent(name);
};


/* --- shopping -------------------------------------------------------- */

// Loose name match against what is already owned. The question in a shop is
// "do I have this already", and the answer has to survive the shelf calling
// it "Aberlour A'Bunadh Alba" while the label says "A'bunadh Alba".
L.shopNorm = function (s) {
  return String(s || '').toLowerCase()
    .replace(/[\u2019']/g, '')
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\b(whisky|whiskey|bourbon|straight|kentucky|single|malt|scotch|irish|the|year|years|yr|old)\b/g, ' ')
    .split(/\s+/).filter(Boolean).join(' ');
};

L.shopSearch = function (q, catalog, limit) {
  const t = L.shopNorm(q);
  if (t.length < 2) return [];
  const words = t.split(' ').filter(Boolean);
  // A number on its own is not an identification. Searching "springbank 15"
  // shared only "15" with the shelf and returned every fifteen-year-old on
  // it, then seeded the Shop form with a Barrell Craft Spirits at 109.76.
  const named = words.filter(w => !/^\d+(\.\d+)?$/.test(w));
  const hits = [];
  Object.values(catalog).forEach(p => {
    const n = L.shopNorm(p.name + ' ' + (p.dist || ''));
    let score = 0, namedHit = 0;
    words.forEach(w => {
      if (n.indexOf(w) < 0) return;
      score++;
      if (named.indexOf(w) >= 0) namedHit++;
    });
    if (!score) return;
    // If the query has any word that is not a number, at least one of them
    // has to match. Otherwise this is a match on digits alone.
    if (named.length && !namedHit) return;
    hits.push({ p: p, score: score / words.length });
  });
  hits.sort((a, b) => b.score - a.score || a.p.name.localeCompare(b.p.name));
  return hits.slice(0, limit || 8);
};

// "scotchs" and "irishs" are what a naive plural gives you. Categories that
// are already mass nouns or end in a sibilant stay as they are.
L.NO_PLURAL = ['scotch', 'irish', 'wheat', 'world', 'tequila', 'canadian',
               'japanese', 'american single malt', 'flavored'];
L.plural = function (word, n) {
  if (n === 1) return word;
  return L.NO_PLURAL.indexOf(word) >= 0 ? word + ' bottles' : word + 's';
};

L.median = function (nums) {
  const a = (nums || []).slice().sort((x, y) => x - y);
  if (!a.length) return 0;
  const m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
};

// Does a candidate add anything to THIS shelf? Every finding is derived
// from the collection, so it works with no lookup service and no network.
L.shelfFit = function (cand, catalog, bottles) {
  const out = { findings: [], own: null, neighbours: [], pairs: [] };
  const all = Object.values(catalog);
  const candNorm = L.shopNorm(cand.name);

  const owned = all.filter(p => L.shopNorm(p.name) === candNorm);
  if (owned.length) {
    const k = owned[0].k;
    const n = L.ownedCount(k, bottles);
    const open = L.pourable(k, bottles);
    out.own = { key: k, count: n, open: open };
    // The stocking rule: a backup of something worth keeping is a deliberate
    // purchase, not a duplicate.
    out.findings.push(open && n === 1
      ? { level: 'ok', msg: 'You own one, open. A sealed backup fits your stocking rule.' }
      : { level: 'warn', msg: 'You already own ' + n + ' of these.' });
  }

  if (cand.dist && !all.some(p => p.dist === cand.dist)) {
    out.findings.push({ level: 'ok', msg: 'A distillery you do not own yet.' });
  }
  if (cand.sub && !all.some(p => p.sub === cand.sub)) {
    out.findings.push({ level: 'ok', msg: 'A category you do not own yet.' });
  }
  if (cand.region && !all.some(p => p.region === cand.region)) {
    out.findings.push({ level: 'ok', msg: cand.region + ' would be new to the shelf.' });
  }
  if (cand.fin && !all.some(p => p.fin === cand.fin)) {
    out.findings.push({ level: 'ok', msg: 'A finish you do not have: ' + cand.fin + '.' });
  }

  if (cand.proof) {
    // How crowded is this corner? Same category, within five proof points --
    // close enough that a flight would treat them as peers.
    out.neighbours = all.filter(p => p.sub === cand.sub
      && Math.abs(p.proof - cand.proof) <= 5
      && L.shopNorm(p.name) !== candNorm);
    if (out.neighbours.length >= 5) {
      out.findings.push({ level: 'warn', msg: 'You already own ' + out.neighbours.length
        + ' ' + L.plural(cand.sub, out.neighbours.length)
        + ' within five proof points of this.' });
    } else if (out.neighbours.length === 0) {
      out.findings.push({ level: 'ok', msg: 'Nothing else on the shelf sits near it.' });
    }

    // A matched pair is the strongest flight shape there is: same house,
    // same proof, one perceptible difference.
    out.pairs = all.filter(p => p.dist === cand.dist
      && Math.abs(p.proof - cand.proof) <= 1
      && L.shopNorm(p.name) !== candNorm);
    if (out.pairs.length) {
      out.findings.push({ level: 'ok', msg: 'Matched pair with '
        + out.pairs[0].name + ' at ' + out.pairs[0].proof + '.' });
    }
  }

  if (cand.msrp) {
    const band = L.priceBand(cand.msrp);
    const same = all.filter(p => p.sub === cand.sub && p.msrp).map(p => p.msrp);
    const med = L.median(same);
    out.findings.push({ level: 'info', msg: L.titleCase(band)
      + (med ? ' \u2014 your ' + cand.sub + ' median is $' + Math.round(med) + '.' : '.') });
  }
  if (cand.scar && cand.scar !== 'standard') {
    out.findings.push({ level: 'info', msg: L.titleCase(cand.scar) + ' release.' });
  }
  return out;
};

// One line, counted from the findings rather than an invented score, so the
// reasoning behind it stays on screen.
L.fitVerdict = function (fit) {
  // Owning it already settles the question before any other finding counts.
  if (fit.own) {
    return fit.own.count > 1 ? 'You have this covered.'
      : 'You have it open. This would be the backup.';
  }
  // The stocking finding is excluded above, so what is left is genuinely new
  // ground rather than shelf maintenance.
  const good = fit.findings.filter(f => f.level === 'ok').length;
  const bad = fit.findings.filter(f => f.level === 'warn').length;
  if (good === 0 && bad) return 'It duplicates what you have.';
  if (good >= 2) return 'It adds something the shelf lacks.';
  if (good === 1) return 'A modest addition.';
  return 'Nothing either way \u2014 buy it if you want to drink it.';
};

    def: 'A bottle is open, sealed, or gone. Pourable is derived, never typed: a product is pourable when at least one of its bottles is open.' },
  { term: 'Exit reason',
    def: 'Why a bottle left: finished, drain pour, gifted, traded, sold, broken. A drain pour is an opinion, not an exit \u2014 it is recorded so the bottle never comes back up as a suggestion.' },
  { term: 'Proof',
    def: 'Twice the alcohol by volume. 100 proof is 50% ABV.' },
  { term: 'Age',
    def: 'Years stated on the label, which by law is the age of the youngest whisky in the bottle. Blank means no age statement \u2014 not unknown, and not young.' },
  { term: 'Finish',
    def: 'The secondary cask, or casks. Several are joined with a plus. A named sherry replaces the generic one: PX Sherry Cask is recorded as Pedro Ximenez, not both.' },
  { term: 'Wine cask',
    def: 'Whether a wine or fortified-wine cask ever touched the spirit. Wood-only finishes \u2014 toasted oak, mizunara, amburana \u2014 are finishes that are not wine, which is the distinction Angel\u2019s Envy Triple Oak exists to prove. "Double cask" and STR say how many or how treated, not what was in them, so they record as unknown rather than no.' }
 ]},
 { section: 'Our own conventions',
   note: 'Judgements about this shelf, not standards anyone else uses.',
   items: [
  { term: 'Recognition',
    def: 'Whether the room will know the name. Known, niche, or obscure. This is what the build rule "one obscure pour minimum" actually tests \u2014 not price and not availability. Raasay, Natterjack and Pokeno are obscure; Weller is not, however hard it is to buy.' },
  { term: 'Release',
    def: 'How few bottles exist: standard, batched, limited, exclusive. Read from the release wording \u2014 a Feis Ile bottling is exclusive regardless of price.' },
  { term: 'Occasion',
    def: 'Price band. Everyday under $50, good $50 to $99, special $100 to $199, vault $200 and up. Said the way a host says it rather than the way a receipt does.' },
  { term: 'Ohio retail',
    def: 'The rarity label imported from OnlyDrams. It measures how hard a bottle is to buy at US retail, not how scarce it is \u2014 it calls a $484 Feis Ile bottling common and a $50 Weller a unicorn. Kept under an honest name rather than deleted.' },
  { term: 'Premium',
    def: 'Secondary price divided by MSRP. The honest version of an allocation label, computed from your own numbers where a secondary price exists.' },
  { term: 'Stocking',
    def: 'You buy a backup of anything you want to keep having. So any whisky you own more than one of has exactly one open and the rest sealed, and a single bottle is always open.' }
 ]},
 { section: 'Flight terms', items: [
  { term: 'Variable',
    def: 'The one thing a flight changes. A flight with two variables answers nothing.' },
  { term: 'Core and bench',
    def: 'Core pours are the flight. Bench pours are held in reserve for a night with legs.' },
  { term: 'Spotted and blind',
    def: 'A spotted pour is named and shown before tasting; a blind pour is not. A spotted control lets the room measure rather than hunt.' },
  { term: 'Matched pair',
    def: 'Two pours at the same proof differing in one perceptible way. The strongest shape a flight can take.' },
  { term: 'The ask',
    def: 'The one column with a right answer. Written and collected before it is discussed.' }
 ]}
];

L.refGroup = function (id) {
  const g = L.REF_GROUPS.find(x => x.id === id) || L.REF_GROUPS[0];
  return L[g.data];
};

L.referenceCount = function (id) {
  const groups = id ? [L.refGroup(id)] : L.REF_GROUPS.map(g => L[g.data]);
  return groups.reduce((n, sec) => n + sec.reduce((m, s) => m + s.items.length, 0), 0);
};

// A search with a term in it looks across every group, because someone
// searching for "char" does not know or care which tab it lives on.
L.searchReference = function (q, id) {
  const t = (q || '').toLowerCase().trim();
  if (!t) return L.refGroup(id);
  const out = [];
  L.REF_GROUPS.forEach(g => {
    L[g.data].forEach(s => {
      const items = s.items.filter(i =>
        (i.term + ' ' + i.def + ' ' + (i.src || '')).toLowerCase().includes(t));
      if (items.length) out.push(Object.assign({}, s, { items: items, group: g.label }));
    });
  });
  return out;
};

/* --- summary ---------------------------------------------------------- */

// Bar-chart rows: one series, sorted by size, labelled with its value. No
// pies -- a pie makes the reader compare angles when they want to compare
// lengths.
L.barRows = function (counts, opts) {
  const o = opts || {};
  const rows = Object.keys(counts).map(k => ({ label: k, n: counts[k] }));
  rows.sort((a, b) => o.keepOrder ? 0 : (b.n - a.n || a.label.localeCompare(b.label)));
  const max = rows.reduce((m, r) => Math.max(m, r.n), 0);
  return rows.map(r => Object.assign({}, r,
    { pct: max ? Math.round((r.n / max) * 1000) / 10 : 0 }));
};

L.countBy = function (items, fn) {
  const out = {};
  items.forEach(x => { const k = fn(x); if (k !== null && k !== undefined) out[k] = (out[k] || 0) + 1; });
  return out;
};

// What the shelf is worth at MSRP, and what it cost. Bottles, not products:
// two sealed spares are two bottles of value.
L.shelfValue = function (catalog, bottles) {
  let msrp = 0, paid = 0, priced = 0, gone = 0;
  bottles.forEach(b => {
    if (b.status === 'gone') { gone++; return; }
    const p = catalog[b.k];
    if (p && p.msrp) { msrp += p.msrp; priced++; }
    if (b.paid) paid += b.paid;
  });
  return { msrp: Math.round(msrp), paid: Math.round(paid), priced: priced, gone: gone };
};

L.shelfStats = function (catalog, bottles) {
  const live = bottles.filter(b => b.status !== 'gone');
  const open = live.filter(b => b.status === 'open');
  const prods = {};
  live.forEach(b => { if (catalog[b.k]) prods[b.k] = 1; });
  return { bottles: live.length, open: open.length,
           sealed: live.length - open.length, products: Object.keys(prods).length,
           gone: bottles.length - live.length };
};

// Most recent first, and only entries whose product still exists.
// Completion is recorded against a date you give, not the clock: a flight
// gets logged the morning after as often as the night of.
L.todayISO = function (d) {
  const t = d || new Date();
  return new Date(t.getTime() - t.getTimezoneOffset() * 60000)
    .toISOString().slice(0, 10);
};

L.validDate = function (s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false;
  const d = new Date(s + 'T12:00:00');
  if (isNaN(d.getTime())) return false;
  if (s.slice(0, 10) !== L.todayISO(d)) return false;   // rejects 2026-02-31
  return d <= new Date(Date.now() + 86400000);          // no future logging
};

L.logEntry = function (kind, payload, when) {
  const at = L.validDate(when) ? when : L.todayISO();
  return Object.assign({ kind: kind, at: at }, payload);
};

// The log, newest first, with names resolved and anything whose subject has
// been deleted dropped rather than shown as a bare key.
L.historyRows = function (history, catalog, flights, kind) {
  // The index is stamped against the ORIGINAL array, before any filtering:
  // it is what a removal splices on, so an index into the filtered view
  // would delete the wrong entry.
  const rows = (history || [])
    .map((x, i) => Object.assign({ _i: i }, x))
    .filter(x => !kind || x.kind === kind)
    .filter(x => {
      if (x.kind === 'pour') return !!catalog[x.k];
      if (x.kind === 'flight') return (flights || []).some(f => f.title === x.flight);
      return false;
    });
  // Same-day entries keep the order they were logged in, newest last-logged
  // first, so two pours on one night do not shuffle.
  rows.sort((a, b) => (b.at || '').localeCompare(a.at || '') || b._i - a._i);
  return rows.map(x => Object.assign({}, x, {
    label: x.kind === 'pour' ? (catalog[x.k] || {}).name : L.sentenceCase(x.flight)
  }));
};

// A month-by-month count, for a small bar block under the log.
L.historyByMonth = function (history, kind, months) {
  const out = {};
  const now = new Date();
  const span = months || 6;
  for (let i = span - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    out[d.toISOString().slice(0, 7)] = 0;
  }
  (history || []).forEach(x => {
    if (kind && x.kind !== kind) return;
    const m = (x.at || '').slice(0, 7);
    if (m in out) out[m]++;
  });
  return out;
};

/* --- add / edit / delete -------------------------------------------- */

// The shared catalog is reference data. A user's corrections, additions and
// removals are layered on top, so nothing the app ships with is ever
// destroyed -- deleting a stock product hides it for you alone.
L.mergeCatalog = function (base, edits, custom, deleted) {
  const out = {};
  Object.keys(base || {}).forEach(k => {
    if (deleted && deleted[k]) return;
    out[k] = (edits && edits[k]) ? Object.assign({}, base[k], edits[k]) : base[k];
  });
  Object.keys(custom || {}).forEach(k => {
    if (deleted && deleted[k]) return;
    out[k] = (edits && edits[k]) ? Object.assign({}, custom[k], edits[k]) : custom[k];
  });
  return out;
};

L.PRODUCT_FIELDS = ['name', 'dist', 'proof', 'sub', 'style', 'age', 'fin',
                    'msrp', 'sec', 'obsc', 'scar', 'size'];

// Reject what cannot be stored rather than storing a broken record. Name and
// proof are the identity; everything else can be filled in later.
L.validateProduct = function (f) {
  const errs = [];
  const name = (f.name || '').trim();
  if (name.length < 2) errs.push('Name is required.');
  const proof = parseFloat(f.proof);
  if (!(proof > 0)) errs.push('Proof is required.');
  else if (proof < 20 || proof > 200) errs.push('Proof must be between 20 and 200.');
  if (f.msrp !== '' && f.msrp !== undefined && f.msrp !== null
      && isNaN(parseFloat(f.msrp))) errs.push('Price must be a number.');
  if (f.age !== '' && f.age !== undefined && f.age !== null && f.age !== '') {
    const a = parseFloat(f.age);
    if (isNaN(a) || a < 1 || a > 80) errs.push('Age must be 1 to 80 years, or blank.');
  }
  return errs;
};

L.normalizeProduct = function (f) {
  const num = v => (v === '' || v === undefined || v === null) ? null : parseFloat(v);
  const p = {
    k: (f.k || '').trim() || (f.name || '').trim(),
    name: (f.name || '').trim(),
    dist: (f.dist || '').trim(),
    proof: parseFloat(f.proof),
    sub: (f.sub || 'bourbon').trim(),
    style: (f.style || '').trim(),
    age: num(f.age), msrp: num(f.msrp), sec: num(f.sec),
    fin: (f.fin || '').trim() || null,
    obsc: f.obsc || 'known', scar: f.scar || 'standard',
    size: num(f.size) || 750
  };
  p.wine = p.fin ? L.finIsWine(p.fin) : null;
  return p;
};

// Same wood-versus-wine split the enrichment pass uses, so a hand-typed
// finish classifies the way an imported one does.
L.WOOD_ONLY = ['Toasted Oak', 'French Oak', 'Virgin Oak', 'Mizunara',
               'Hungarian Oak', 'Chinkapin Oak', 'American Oak', 'Amburana'];
L.UNKNOWN_CASK = ['Multi-cask', 'STR'];
L.finIsWine = function (fin) {
  if (!fin) return null;
  const parts = String(fin).split('+').map(s => s.trim()).filter(Boolean);
  if (!parts.length) return null;
  if (parts.every(p => L.UNKNOWN_CASK.indexOf(p) >= 0)) return null;
  return parts.some(p => L.WOOD_ONLY.indexOf(p) < 0 && L.UNKNOWN_CASK.indexOf(p) < 0);
};

// Bottle ids must not collide with the shipped B001..B344 range.
L.nextBottleId = function (bottles) {
  let max = 0;
  (bottles || []).forEach(b => {
    const m = /^B(\d+)$/.exec(b.id || '');
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return 'B' + String(max + 1).padStart(3, '0');
};

// A product cannot be deleted while bottles of it remain -- that would strand
// them. Retire the bottles first.
L.canDeleteProduct = function (key, bottles) {
  return !(bottles || []).some(b => b.k === key && b.status !== 'gone');
};

/* --- notes ----------------------------------------------------------- */

// Everything the app knows about one bottle, gathered from every source it
// came from, plus whatever the user has written. Each note carries its
// origin so a producer fact never gets confused with a tasting impression.
// The distiller's tasting notes: colour, nose, palate, finish. Kept apart
// from the provenance notes because they are a different kind of fact --
// these are what the bottle tastes like, not where it came from.
L.TN_ORDER = ['colour', 'nose', 'palate', 'finish'];

// Where a tasting note came from. Kept on the record because a note you
// wrote, a note lifted off your own flight card and a note sourced from a
// producer are three different levels of trust, and a blank is more useful
// than a plausible invention.
// Three levels, and the first one is weaker than it looks: the flight-card
// notes were WRITTEN FOR the cards as prompts to guide a taster, not taken
// from a producer. They are a starting point, not a source. Saying so is the
// difference between a useful note and one that quietly poses as fact.
L.TN_SOURCES = {
  card:      'written for the flight card \u2014 a prompt, not a source',
  distiller: "the producer's own notes",
  you:       'your own tasting'
};

L.tastingNotes = function (p) {
  if (!p || !p.tn) return [];
  return L.TN_ORDER.filter(k => p.tn[k])
    .map(k => ({ label: L.titleCase(k), text: p.tn[k] }));
};

L.tnSource = function (p) {
  if (!p || !p.tn) return null;
  if (p.tnSrc && L.TN_SOURCES[p.tnSrc]) return L.TN_SOURCES[p.tnSrc];
  return p.tnFrom
    ? 'Written for the ' + L.sentenceCase(p.tnFrom) + ' card \u2014 a prompt, not a source'
    : null;
};

// How much of the shelf is described, and by whom.
L.tnCoverage = function (catalog) {
  const out = { total: 0, with: 0, without: 0, bySource: {} };
  Object.values(catalog).forEach(p => {
    out.total++;
    if (!p.tn) { out.without++; return; }
    out.with++;
    const s = p.tnSrc || 'card';
    out.bySource[s] = (out.bySource[s] || 0) + 1;
  });
  return out;
};

L.notesFor = function (p, flights, userNote) {
  const out = [];
  if (!p) return out;
  if (p.notes) out.push({ src: 'inventory', text: p.notes });
  if (p.msrpNote) out.push({ src: 'price', text: p.msrpNote });
  if (p.fin) {
    out.push({ src: 'cask',
      text: p.fin.split('+').join(', ')
            + (p.wine === true ? ' \u2014 a wine cask'
             : p.wine === false ? ' \u2014 wood only, no wine' : '') });
  }
  if (p.region) out.push({ src: 'region', text: p.region });
  // The flight cards carry a line of host prose per pour; surface the ones
  // that mention this bottle.
  (flights || []).forEach(f => {
    const i = (f.core || []).findIndex(x => x.k === p.k);
    if (i < 0) return;
    const card = (f.cards || [])[i];
    if (card && card.wood) out.push({ src: f.title.toLowerCase(), text: card.wood });
  });
  if (userNote) out.push({ src: 'you', text: userNote });
  return out;
};

/* --- flight builder --------------------------------------------------- */

// Give it a variable and a premise; it proposes pours off the shelf.
//
// The whole design follows one rule BZ arrived at the hard way: a flight
// works when the room can TASTE the answer. So the builder scores candidates
// on whether they separate along the stated variable, holds everything else
// as still as it can, and refuses to reach for a bottle that is not open.

L.VARIABLES = [
  { id: 'proof',   label: 'Proof',            hint: 'same everything, strength climbs' },
  { id: 'finish',  label: 'The cask',         hint: 'one spirit, several finishes' },
  { id: 'region',  label: 'Place',            hint: 'one category, several regions' },
  { id: 'house',   label: 'The house',        hint: 'one distillery, its whole range' },
  { id: 'age',     label: 'Age',              hint: 'one house, years apart' },
  { id: 'grain',   label: 'Grain',            hint: 'one distillery, different mashbills' },
  { id: 'price',   label: 'Price',            hint: 'cheap against dear, proof held' }
];

// What the variable reads off a bottle. A candidate with no value here
// cannot take part, because it cannot sit anywhere on the axis.
L.axisOf = function (varId, p) {
  switch (varId) {
    case 'proof':  return p.proof || null;
    case 'finish': return p.fin || null;
    case 'region': return p.region || p.sub || null;
    case 'house':  return p.fin || p.style || p.name || null;
    case 'age':    return p.age || null;
    case 'grain':  return p.sub || null;
    case 'price':  return L.priceBand(p.msrp) || null;
    default:       return null;
  }
};

// What has to stay STILL for that variable to be readable. Change two things
// and the flight answers neither.
L.holdsFor = function (varId) {
  return {
    proof:  ['dist'],
    finish: ['dist'],
    region: ['sub'],
    house:  ['dist'],
    age:    ['dist'],
    grain:  ['dist'],
    price:  ['sub']
  }[varId] || [];
};

// Every group of open bottles that could carry the variable, best first.
// A group is a set that agrees on the held fields and differs on the axis.
L.flightCandidates = function (varId, catalog, bottles, opts) {
  const o = opts || {};
  const size = o.size || L.CORE_TARGET;
  const holds = L.holdsFor(varId);
  const pool = Object.values(catalog).filter(p =>
    L.pourable(p.k, bottles) && !p.drained && L.axisOf(varId, p) !== null
    && (!o.sub || p.sub === o.sub));

  // Bucket by whatever must be held still.
  const groups = {};
  pool.forEach(p => {
    const key = holds.length ? holds.map(f => p[f] || '?').join('|') : 'all';
    (groups[key] = groups[key] || []).push(p);
  });

  const out = [];
  Object.keys(groups).forEach(key => {
    const members = groups[key];
    // Distinct positions on the axis is the whole point: six bottles that
    // all read the same are not a flight.
    const axes = new Set(members.map(p => String(L.axisOf(varId, p))));
    if (axes.size < 3) return;
    const picked = L.pickSpread(varId, members, size);
    if (picked.length < 4) return;
    out.push({
      key: key, holds: holds, pours: picked,
