function renderHome() {
  const box = $('#homeBody'); box.innerHTML = '';
  const stats = L.shelfStats(S.catalog, S.bottles);
  const val = L.shelfValue(S.catalog, S.bottles);

  const tiles = el('div', 'tiles');
  [[stats.bottles, 'bottles on the shelf'],
   [stats.open, 'open and pourable'],
   [stats.products, 'different whiskies'],
   ['$' + val.msrp.toLocaleString(), 'shelf value at MSRP'],
   [allFlights().length, 'flights designed'],
   [S.history.filter(x => x.kind === 'flight').length, 'flights run']
  ].forEach(([v, l]) => {
    const t = el('div', 'tile');
    t.appendChild(el('div', 'v', String(v)));
    t.appendChild(el('div', 'l', l));
    tiles.appendChild(t);
  });
  box.appendChild(tiles);

  const live = Object.values(S.catalog);
  const where = fn => live.filter(fn);

  // The two long charts sit side by side at the top; the three short scales
  // run beneath them, so nothing tall is stranded next to something short.
  box.appendChild(barBlock('By type',
    L.barRows(L.countBy(live, p => L.titleCase(p.sub))),
    { match: v => where(p => L.titleCase(p.sub) === v) }));

  const scotch = live.filter(p => p.sub === 'scotch' && p.region);
  if (scotch.length) {
    box.appendChild(barBlock('Scotch by region',
      L.barRows(L.countBy(scotch, p => p.region)),
      { match: v => where(p => p.region === v) }));
  }

  box.appendChild(barBlock('Open or sealed', L.barRows({
    Open: stats.open, Sealed: stats.sealed
  }, { keepOrder: true }), {
    cls: r => 'b-' + r.label.toLowerCase(),
    match: v => where(p => L.pourable(p.k, S.bottles) === (v === 'Open'))
  }));

  // Recognition and occasion are ordered scales, so they keep their order
  // rather than being sorted by size -- a scale read out of sequence is
  // harder to read, not easier.
  const obscCounts = { Known: 0, Niche: 0, Obscure: 0 };
  live.forEach(p => { const k = L.titleCase(p.obsc); if (k in obscCounts) obscCounts[k]++; });
  box.appendChild(barBlock('Recognition', L.barRows(obscCounts, { keepOrder: true }),
    { match: v => where(p => L.titleCase(p.obsc) === v) }));

  const bandCounts = { Everyday: 0, Good: 0, Special: 0, Vault: 0 };
  live.forEach(p => { const b = L.priceBand(p.msrp);
    if (b) bandCounts[L.titleCase(b)]++; });
  box.appendChild(barBlock('Occasion', L.barRows(bandCounts, { keepOrder: true }),
    { match: v => where(p => L.priceBand(p.msrp) === v.toLowerCase()) }));

  // The map, small, on the home page.
  const mapCard = el('div', 'sheet');
  mapCard.appendChild(el('h3', null, 'Where it comes from'));
  const wrap = el('div', 'mapwrap');
  wrap.style.marginTop = '8px';
  const mini = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  mini.setAttribute('id', 'homeMap');
  mini.setAttribute('class', 'homemap');
  mini.style.width = '100%';
  wrap.appendChild(mini);
  mapCard.appendChild(wrap);
  const go = el('button', 'chip', 'Open the map');
  go.style.marginTop = '8px';
  go.onclick = () => show('map');
  mapCard.appendChild(go);
  box.appendChild(mapCard);
  drawHomeMap();

  // The log, in full, rather than two five-row teasers.
  const hist = el('div');
  box.appendChild(hist);
  renderHistory(hist);
}

// A still world map for the home page: the same land and dots as the map
// screen's world layer, without the gestures.
function drawHomeMap() {
  const svg = document.getElementById('homeMap');
  if (!svg || !MAPDATA.world || !MAPDATA.world.length) return;
  svg.innerHTML = '';
  const ext = L.mapExtent(MAPDATA.world, 3);
  svg.setAttribute('viewBox', [ext.x, ext.y, ext.w, ext.h].join(' '));
  const land = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  land.setAttribute('class', 'land');
  land.setAttribute('d', MAPDATA.world.map(ptStr).join(' '));
  svg.appendChild(land);
  const cc = L.countryCounts(S.catalog, MAPDATA.subCountry, MAPDATA.worldDist, S.bottles);
  const maxN = cc.reduce((m, c) => Math.max(m, c.total), 1);
  cc.forEach(c => {
      const pos = MAPDATA.countryPos[c.name];
      if (!pos) return;
      const [x, y] = L.project(pos[0], pos[1]);
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', x); dot.setAttribute('cy', y);
      dot.setAttribute('r', L.pinRadius(c.total, ext.w, maxN));
      dot.setAttribute('fill', '#8A6A28');
      dot.setAttribute('opacity', '.82');
      svg.appendChild(dot);
    });
}

function importDialog() {
  openModal('Import bottles', m => {
    m.appendChild(el('div', 'sub',
      'Takes a CSV from Only Drams, a spreadsheet of your own, or an export '
      + 'from this app. Column names are matched loosely \u2014 abv or proof, '
      + 'category or type \u2014 and nothing is written until you have seen '
      + 'what it found.'));

    const tmpl = el('button', 'chip', 'Download the template');
    tmpl.style.margin = '9px 8px 0 0';
    tmpl.onclick = () => {
      const blob = new Blob([L.templateCSV()], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'killer-bs-import-template.csv';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
    m.appendChild(tmpl);

    const spec = el('button', 'chip', 'What the columns mean');
    spec.style.margin = '9px 0 0 0';
    spec.onclick = () => { closeModal(); templateSpec(); };
    m.appendChild(spec);

    const file = document.createElement('input');
    file.type = 'file'; file.accept = '.csv,text/csv,text/plain';
    file.className = 'field'; file.style.marginTop = '11px';
    m.appendChild(file);

    const out = el('div');
    m.appendChild(out);

    file.onchange = () => {
      const f = file.files && file.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onerror = () => { out.innerHTML = '';
        out.appendChild(el('div', 'errs', 'That file could not be read.')); };
      rd.onload = () => {
        let prep;
        try {
          prep = L.prepareImport(L.parseCSV(rd.result), S.catalog);
        } catch (e) {
          out.innerHTML = '';
          out.appendChild(el('div', 'errs', 'That does not read as a CSV.'));
          return;
        }
        showImportPreview(out, prep);
      };
      rd.readAsText(f);
    };

    const cancel = el('button', 'btn ghost wide', 'Close');
    cancel.style.marginTop = '11px';
    cancel.onclick = closeModal;
    m.appendChild(cancel);
  });
}

function showImportPreview(out, prep) {
  out.innerHTML = '';
  if (prep.fatal) {
    out.appendChild(el('div', 'errs', prep.fatal));
    return;
  }
  const sum = L.importSummary(prep);
  const matched = Object.keys(prep.cols).sort();
  out.appendChild(el('div', 'rs', 'Columns found: ' + matched.join(', ')));

  const lines = [
    [sum.add, 'new bottles to add', 'ok'],
    [sum.exists, 'already on your shelf \u2014 added as a sealed spare each', 'info'],
    [sum.duplicate, 'repeated inside the file \u2014 skipped', 'warn'],
    [sum.skip, 'skipped, no usable proof', 'warn']
  ];
  const box = el('div');
  box.style.marginTop = '8px';
  lines.forEach(([n, label, lvl]) => {
    if (!n) return;
    const row = el('div', 'find f-' + lvl);
    row.appendChild(el('div', 'm', lvl === 'ok' ? '\u2713' : lvl === 'warn' ? '!' : '\u00b7'));
    row.appendChild(el('div', null, n + ' ' + label));
    box.appendChild(row);
  });
  out.appendChild(box);

  const flagged = prep.rows.filter(r => r.issues.length).slice(0, 12);
  if (flagged.length) {
    const fl = el('div');
    fl.style.marginTop = '9px';
    fl.appendChild(el('div', 'rs', 'Rows worth a look'));
    flagged.forEach(r => fl.appendChild(el('div', 'sub',
      'line ' + r.line + ' \u00b7 ' + r.name.slice(0, 40)
      + ' \u2014 ' + r.issues.join(', '))));
    out.appendChild(fl);
  }

  if (!sum.add && !sum.exists) {
    out.appendChild(el('div', 'errs', 'Nothing in that file can be imported.'));
    return;
  }

  const go = el('button', 'btn wide btn-gold', 'Import '
    + (sum.add + sum.exists) + ' bottles');
  go.style.marginTop = '11px';
  go.onclick = () => {
    const added = runImport(prep);
    closeModal();
    renderShelf(); renderShelfFilters(); renderHome(); renderPayline();
    toast(added.products + ' whiskies, ' + added.bottles + ' bottles imported');
  };
  out.appendChild(go);
}

// Commit. Existing whiskies gain a bottle rather than a duplicate product,
// which is what a re-import of the same export should do.
function runImport(prep) {
  let products = 0, bottles = 0;
  prep.rows.forEach(r => {
    if (r.action === 'duplicate' || r.action === 'skip') return;
    let key = r.match;
    if (r.action === 'add') {
      const np = L.normalizeProduct({
        name: r.name, dist: r.dist || '', proof: r.proof, sub: r.sub,
        age: r.age, msrp: r.msrp, sec: r.sec, fin: r.fin || '', size: r.size
      });
      if (S.catalog[np.k]) { key = np.k; }
      else {
        np.finc = np.fin ? 'stated' : null;
        if (r.notes) np.notes = r.notes;
        S.custom[np.k] = np;
        delete S.deleted[np.k];
        key = np.k;
        products++;
      }
    }
    if (!key) return;
    S.bottles.push({ id: L.nextBottleId(S.bottles), k: key,
                     status: r.action === 'exists' ? 'sealed' : r.status,
                     paid: r.paid || null });
    bottles++;
  });
  save_(); rebuildCatalog();
  return { products: products, bottles: bottles };
}

// What the shelf is missing, ranked by what a purchase would unlock.
function renderGaps(box) {
  const gaps = L.shelfGaps(S.catalog, S.bottles, allFlights(), S.wish, S.history);
  const card = el('div', 'sheet');
  card.appendChild(el('h3', null, 'What to look for'));
  card.appendChild(el('div', 'sub',
    'Worked out from your own shelf: houses worth going further into, '
    + 'contrasts you cannot currently taste, and dimensions too thin to '
    + 'compare. Type a name above to judge a specific bottle instead.'));

  if (!gaps.length) {
    card.appendChild(el('div', 'empty', 'Nothing obvious is missing.'));
    box.appendChild(card);
    return;
  }

  const KIND_LABEL = { flight: 'Unlocks a flight', wish: 'You wanted it',
    extend: 'Goes further', contrast: 'The other side',
    region: 'Thin region', category: 'Thin category', proof: 'Proof range',
    pair: 'No matched pair' };

  // Five on the page, the rest in a scroller. "and 6 more" was a dead end —
  // it named things there was no way to reach.
  const TOP = 5;
  const rest = gaps.length > TOP
    ? el('div', 'scrollbox') : null;
  const place = (g, i) => (i < TOP ? card : rest);

  gaps.forEach((g, gi) => {
    const r = el('button', 'find f-'
      + (g.kind === 'flight' || g.kind === 'extend' ? 'ok' : 'info'));
    r.style.width = '100%';
    r.style.textAlign = 'left';
    const body = el('div');
    const nm = el('div', 'nm', g.name);
    if (g.owned) nm.appendChild(el('span', 'pourtag blend', 'you own it'));
    body.appendChild(nm);
    body.appendChild(el('div', 'sub', g.why));
    r.appendChild(el('div', 'm',
      g.kind === 'flight' ? '\u2605'
      : g.kind === 'extend' ? '\u2197'
      : g.kind === 'contrast' ? '\u21c4' : '\u00b7'));
    r.appendChild(body);
    r.title = KIND_LABEL[g.kind] || '';
    // Tapping searches for it, which drops you into the judging half with
    // the name already filled in.
    r.onclick = () => {
      $('#shopQ').value = g.name.replace(/^(A|Another|Something|A second)\s+/i, '');
      renderShop();
    };
    place(g, gi).appendChild(r);
  });
  if (rest) {
    const more = el('div', 'rs');
    more.style.marginTop = '10px';
    more.textContent = (gaps.length - TOP) + ' more, worth less than the five above';
    card.appendChild(more);
    rest.style.maxHeight = '38vh';
    card.appendChild(rest);
  }
  box.appendChild(card);

  // The wishlist itself, since this is where you would look at it.
  if (S.wish.length) {
    const w = el('div', 'sheet');
    const hd = el('div', 'hdr');
    hd.style.marginBottom = '6px';
    hd.appendChild(el('h3', null, 'Your wishlist'));
    hd.appendChild(el('span', 'count', String(S.wish.length)));
    w.appendChild(hd);
    S.wish.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(x => {
      const r = el('div', 'item');
      const left = el('div');
      left.appendChild(el('div', 'nm', x.name));
      left.appendChild(el('div', 'sub', x.forFlight
        ? 'For ' + L.sentenceCase(x.forFlight)
        : (x.reason || 'Added ' + x.added)));
      r.appendChild(left);
      const drop = el('button', 'chip', 'Remove');
      drop.onclick = () => {
        S.wish = L.wishRemove(S.wish, x.name);
        save_(); renderShop(); toast('Off the wishlist');
      };
      r.appendChild(drop);
      w.appendChild(r);
    });
    box.appendChild(w);
  }
}

function renderShop() {
  const top = $('#shopScroll'), bottom = $('#shopFixed');
  top.innerHTML = ''; bottom.innerHTML = '';
  const q = $('#shopQ').value;
  if (!q.trim()) {
    // An empty box is not a dead end, it is the other half of the question:
    // typing a name judges a bottle, and this says what to look for.
    renderGaps(top);
    return;
  }

  // Top half, scrolling: what you already own that resembles it.
  const hits = L.shopSearch(q, S.catalog, 8);
  const owned = el('div', 'sheet');
  owned.appendChild(el('h3', null, hits.length
    ? 'Already on your shelf' : 'Not on your shelf'));
  if (!hits.length) {
    owned.appendChild(el('div', 'sub', 'Nothing you own matches that name.'));
  }
  hits.forEach(hit => {
    const p = hit.p;
    const n = L.ownedCount(p.k, S.bottles);
    const open = L.pourable(p.k, S.bottles);
    const r = el('button', 'item ' + typeClass(p) + (open ? '' : ' sealed'));
    const left = el('div');
    const nm = el('div', 'nm'); nm.innerHTML = '<span class="dot"></span>';
    nm.appendChild(document.createTextNode(p.name));
    left.appendChild(nm);
    left.appendChild(el('div', 'sub', [n + (n > 1 ? ' bottles' : ' bottle'),
      open ? 'open' : 'sealed', p.msrp ? '$' + p.msrp : null]
      .filter(Boolean).join(' \u00b7 ')));
    r.appendChild(left);
    r.appendChild(el('div', 'pf', String(p.proof)));
    r.onclick = () => showBottle(p.k);
    owned.appendChild(r);
  });
  top.appendChild(owned);

  // The bottle's own details, fixed at the bottom with the verdict.
  const detail = el('div', 'sheet');
  detail.appendChild(el('h3', null, 'The bottle'));
  const f = el('div', 'form');
  f.style.marginTop = '8px';
  // S.shop holds what you last typed into these fields, so the verdict
  // survives a re-render. But it must not survive a change of BOTTLE:
  // searching springbank 15 was showing Barrell Craft Spirits at 109.76
  // left over from the previous search.
  if (L.shopNorm(S.shop.name || '') !== L.shopNorm(q)) S.shop = { name: q };
  const seed = hits[0] ? hits[0].p : {};
  const two = el('div', 'two');
  two.appendChild(fieldRow('Proof', 'proof', S.shop.proof || seed.proof || '',
    { type: 'number', step: '0.1' }));
  two.appendChild(fieldRow('Price', 'msrp', S.shop.msrp || seed.msrp || '',
    { type: 'number', step: '0.01' }));
  f.appendChild(two);
  const two2 = el('div', 'two');
  two2.appendChild(selectRow('Type', 'sub',
    S.shop.sub || seed.sub || 'bourbon', L.TYPES));
  two2.appendChild(selectRow('Release', 'scar',
    S.shop.scar || seed.scar || 'standard',
    ['standard', 'batched', 'limited', 'exclusive']));
  f.appendChild(two2);
  const two3 = el('div', 'two');
  two3.appendChild(fieldRow('Distillery', 'dist', S.shop.dist || seed.dist || '', {}));
  two3.appendChild(fieldRow('Finish', 'fin', S.shop.fin || seed.fin || '',
    { placeholder: 'e.g. Oloroso' }));
  f.appendChild(two3);

  // Mark anything that came from the seed rather than from you, so a lookup
  // can overwrite a guess while still deferring to what you typed.
  ['proof', 'msrp', 'sub', 'scar', 'dist', 'fin'].forEach(k => {
    const input = f.querySelector('[name="' + k + '"]');
    if (input && input.value && S.shop[k] === undefined) {
      input.dataset.seeded = '1';
    }
  });
  detail.appendChild(f);

  // Lookup lives here, where you are standing in front of the bottle.
  const lookRow = el('div', 'lookrow');
  lookRow.style.marginTop = '9px';
  const look = el('button', 'btn btn-sm', 'Look it up');
  const buy = el('button', 'btn btn-sm btn-gold', 'I bought it');
  const wanted = L.onWishlist(S.wish, q);
  const want = el('button', 'btn btn-sm', wanted ? 'On your wishlist' : 'Want it');
  want.dataset.on = wanted;
  want.onclick = () => {
    if (L.onWishlist(S.wish, q)) {
      S.wish = L.wishRemove(S.wish, q);
      save_(); renderShop(); toast('Off the wishlist');
      return;
    }
    // Record WHY. A name alone is a note to self; a name with a reason is
    // something you can act on standing in a shop.
    const unlocks = allFlights().filter(f =>
      (f.core || []).some(p => L.pourKind(p) === 'wish'
        && L.shopNorm(p.name) === L.shopNorm(q)));
    S.wish = L.wishAdd(S.wish, {
      name: q.trim(),
      est: parseFloat((f.querySelector('[name=\"msrp\"]') || {}).value) || null,
      forFlight: unlocks.length ? unlocks[0].title : null,
      reason: unlocks.length ? null : L.fitVerdict(L.shelfFit({
        name: q.trim(), sub: S.shop.sub,
        proof: parseFloat(S.shop.proof) || null
      }, S.catalog, S.bottles))
    });
    save_(); renderShop(); toast('Added to your wishlist');
  };
  const lookMsg = el('div', 'looknote');
  lookRow.appendChild(look);
  lookRow.appendChild(want);
  lookRow.appendChild(buy);
  lookRow.appendChild(lookMsg);
  detail.appendChild(lookRow);

  const applyRes = res => {
    L.lookupFilled(res).forEach(k => {
      const input = f.querySelector('[name="' + k + '"]');
      if (!input) return;
      // What YOU typed wins; what was merely seeded from a similar bottle
      // does not. A looked-up proof should replace a guess, not defer to it.
      if (input.value && !input.dataset.seeded) return;
      input.value = res[k];
      delete input.dataset.seeded;
      input.classList.add('looked');
    });
    lookMsg.className = 'looknote ok';
    lookMsg.textContent = (res.source === 'shelf' ? 'From your catalog.'
      : 'Looked up. Check it before you trust it.');
    judge();
  };

  look.onclick = async () => {
    const fromShelf = L.lookupFromCatalog(q, S.catalog);
    if (fromShelf) { applyRes(fromShelf); return; }
    if (!S.lookupUrl) {
      lookMsg.className = 'looknote';
      lookMsg.textContent = 'Not on your shelf. Set up lookup in Settings, '
        + 'or fill the fields in yourself.';
      return;
    }
    look.disabled = true;
    lookMsg.className = 'looknote';
    lookMsg.textContent = 'Looking it up\u2026';
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 15000);
      const r = await fetch(L.lookupUrl(S.lookupUrl, q.trim()), { signal: ctrl.signal });
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const res = L.parseLookup(await r.json());
      if (!res) throw new Error('nothing usable came back');
      applyRes(res);
    } catch (e) {
      lookMsg.className = 'looknote warn2';
      lookMsg.textContent = 'Lookup failed (' + e.message + ').';
    } finally {
      look.disabled = false;
    }
  };
  bottom.appendChild(detail);

  // And the verdict under it, which is the reason you opened this.
  const verdict = el('div');
  bottom.appendChild(verdict);
  function judge() {
    const vals = {};
    f.querySelectorAll('input,select').forEach(i => { vals[i.name] = i.value; });
    S.shop = Object.assign({}, vals, { name: q });
    const cand = {
      name: q.trim(), dist: (vals.dist || '').trim(), sub: vals.sub,
      proof: parseFloat(vals.proof) || null, msrp: parseFloat(vals.msrp) || null,
      fin: (vals.fin || '').trim() || null, scar: vals.scar
    };
    const fit = L.shelfFit(cand, S.catalog, S.bottles);
    verdict.innerHTML = '';
    verdict.appendChild(el('div', 'verdict', L.fitVerdict(fit)));
    const list = el('div');
    list.style.marginTop = '7px';
    fit.findings.forEach(x => {
      const row = el('div', 'find f-' + x.level);
      row.appendChild(el('div', 'm', x.level === 'ok' ? '\u2713'
        : x.level === 'warn' ? '!' : '\u00b7'));
      row.appendChild(el('div', null, x.msg));
      list.appendChild(row);
    });
    verdict.appendChild(list);

    buy.onclick = () => {
      const errs = L.validateProduct(Object.assign({ name: q }, vals));
      if (errs.length) { toast(errs[0]); return; }
      if (fit.own) {
        askStatus(q.trim(), st => {
          S.bottles.push({ id: L.nextBottleId(S.bottles), k: fit.own.key,
                           status: st, paid: cand.msrp });
          save_(); renderShelf(); renderHome(); renderShop();
          toast(st === 'sealed' ? 'Sealed spare added' : 'Added, open');
        });
        return;
      }
      const np = L.normalizeProduct(Object.assign({ name: q }, vals));
      if (S.catalog[np.k]) { toast('Already on the shelf'); return; }
      // Buying it is the end of wanting it.
      S.wish = L.wishRemove(S.wish, q);
      np.finc = np.fin ? 'stated' : null;
      S.custom[np.k] = np;
      delete S.deleted[np.k];
      S.bottles.push({ id: L.nextBottleId(S.bottles), k: np.k,
                       status: 'open', paid: cand.msrp });
      save_(); rebuildCatalog();
      renderShelf(); renderShelfFilters(); renderHome(); renderPayline();
      toast('Added to the shelf');
      showBottle(np.k);
    };
  }

  // Re-judge as you correct a field, so the verdict is never stale.
  f.querySelectorAll('input,select').forEach(i => {
    i.addEventListener('change', judge);
  });
  judge();
}

/* --- reference -------------------------------------------------------- */

function renderRefGroups() {
  const box = $('#refGroups'); box.innerHTML = '';
  L.REF_GROUPS.forEach(g => {
    const b = el('button', 'chip', g.label);
    b.setAttribute('aria-pressed', S.refGroup === g.id);
    b.onclick = () => { S.refGroup = g.id; renderReference(); };
    box.appendChild(b);
  });
}

function renderSettings() {
  const box = $('#settingsBody'); box.innerHTML = '';

  // Account: nothing to configure until sign-in exists, but the shape of the
  // page should not change when it does.
  const acct = el('div', 'sheet');
  acct.appendChild(el('h3', null, 'Account'));
  acct.appendChild(el('div', 'sub',
    'This shelf lives in this browser. Sign-in and sharing arrive with the '
    + 'Firebase build; until then, use Export to move it or keep a copy.'));
  box.appendChild(acct);

  renderLookupSetup(box);

  // Your data, in a form you can take away.
  const data = el('div', 'sheet');
  data.appendChild(el('h3', null, 'Your data'));
  const st = L.shelfStats(S.catalog, S.bottles);
  data.appendChild(el('div', 'sub', st.bottles + ' bottles, '
    + st.products + ' whiskies, ' + S.history.length + ' logged entries, '
    + Object.keys(S.edits).length + ' of your own corrections.'));
  const row = el('div', 'detail-acts');
  row.style.marginTop = '9px';

  const exp = el('button', 'btn btn-sm', 'Export CSV');
  exp.onclick = () => {
    const rows = [L.TEMPLATE_COLS.join(',')];
    S.bottles.filter(b => b.status !== 'gone').forEach(b => {
      const p = prod(b.k);
      if (!p) return;
      rows.push([p.name, p.dist || '', p.proof, p.sub, p.age || '', p.fin || '',
                 p.msrp || '', p.sec || '', b.paid || '', p.size || 750,
                 b.status, (p.notes || '').replace(/\n/g, ' ')]
        .map(c => /[",]/.test(String(c)) ? '"' + String(c).replace(/"/g, '""') + '"' : c)
        .join(','));
    });
    const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'killer-bs-shelf.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  row.appendChild(exp);

  const imp = el('button', 'btn btn-sm', 'Import');
  imp.onclick = importDialog;
  row.appendChild(imp);

  const reset = el('button', 'btn btn-sm ghost danger', 'Reset my changes');
  reset.onclick = () => confirmDelete('every change you have made', () => {
    // The shipped shelf is untouched by this: only the layers on top go.
    S.edits = {}; S.custom = {}; S.deleted = {}; S.customFlights = [];
    S.history = [];
    save_(); rebuildCatalog();
    renderShelf(); renderShelfFilters(); renderHome(); renderFlights();
    renderPayline(); renderSettings();
    toast('Back to the shipped shelf');
  });
  row.appendChild(reset);
  data.appendChild(row);
  box.appendChild(data);

  const about = el('div', 'sheet');
  about.appendChild(el('h3', null, 'About'));
  about.appendChild(el('div', 'sub',
    'Killer B\u2019s Bottle Tracker v' + APP_VERSION + ' \u00b7 built ' + BUILD_TIME));
  box.appendChild(about);
}

function renderLookupSetup(box) {
  const card = el('div', 'sheet');
  card.appendChild(el('h3', null, 'Bottle lookup'));
  card.appendChild(el('div', 'sub',
    'Adding a bottle fills itself from your catalog for free. To fill in '
    + 'bottles the catalog has never seen, paste the web-app URL of your '
    + 'lookup script here. Leave it blank and adding stays fully manual.'));
  const cov = L.tnCoverage(S.catalog);
  card.appendChild(el('div', 'sub',
    cov['with'] + ' of ' + cov.total + ' bottles carry tasting notes, and '
    + (cov.bySource.card || 0) + ' of those were written for the flight cards '
    + 'as prompts rather than taken from a producer \u2014 treat them as a '
    + 'starting point. ' + cov.without + ' bottles have none. Add your own as '
    + 'you pour, or run the batch filler in lookup.gs to source them properly.'));
  const copyBtn = el('button', 'chip', 'Copy the ' + cov.without + ' missing names');
  copyBtn.style.margin = '8px 0';
  copyBtn.onclick = () => {
    const names = Object.values(S.catalog).filter(p => !p.tn)
      .map(p => "  '" + p.name.replace(/'/g, "\\'") + "',").join('\n');
    const text = 'var MISSING = [\n' + names + '\n];';
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text)
        .then(() => toast('Copied \u2014 paste into lookup.gs'))
        .catch(() => toast('Could not copy'));
    } else { toast('Clipboard not available here'); }
  };
  card.appendChild(copyBtn);

  const inp = document.createElement('input');
  inp.className = 'field'; inp.type = 'url'; inp.style.marginTop = '9px';
  inp.placeholder = 'https://script.google.com/macros/s/…/exec';
  inp.value = S.lookupUrl || '';
  card.appendChild(inp);
  const save = el('button', 'chip', 'Save');
  save.style.marginTop = '8px';
  save.onclick = () => {
    const v = inp.value.trim();
    if (v && !/^https:\/\//.test(v)) { toast('That has to be an https URL'); return; }
    S.lookupUrl = v;
    save_();
    toast(v ? 'Lookup endpoint saved' : 'Lookup turned off');
  };
  card.appendChild(save);
  box.appendChild(card);
}

function renderReference() {
  const box = $('#refBody'); box.innerHTML = '';
  const q = $('#refQ').value;
  renderRefGroups();
  // Searching spans every group; browsing shows the group you picked.
  $('#refGroups').style.display = q.trim() ? 'none' : '';
  const secs = L.searchReference(q, S.refGroup);
  $('#refCount').textContent = q.trim()
    ? secs.reduce((n, s) => n + s.items.length, 0) + ' matches'
    : L.referenceCount(S.refGroup) + ' terms';
  if (!secs.length) {
    box.appendChild(el('div', 'empty', 'Nothing matches that.'));
    return;
  }
  secs.forEach(s => {
    const card = el('div', 'sheet refsec');
    card.appendChild(el('h3', null, s.section));
    if (s.group) card.appendChild(el('div', 'rs', s.group));
    if (s.note) card.appendChild(el('div', 'snote', s.note));
    if (s.src) card.appendChild(el('div', 'snote', s.src));
    s.items.forEach(i => {
      const it = el('div', 'refitem');
      it.appendChild(el('div', 'rt', i.term));
      if (i.src) it.appendChild(el('div', 'rs', i.src));
      it.appendChild(el('div', 'rd', i.def));
      card.appendChild(it);
    });
    box.appendChild(card);
  });
}

// Tapping a glass opens the bottle, with the option to record the pour.
// Recording is a decision, not a side effect of looking at it.
function showPourChoice(p) {
  openModal(p.name, m => {
    const tn = L.tastingNotes(p);
    if (tn.length) {
      const dl = el('dl', 'kv tn');
      tn.forEach(n => {
        dl.appendChild(el('dt', null, n.label));
        dl.appendChild(el('dd', null, n.text));
      });
      m.appendChild(dl);
    } else {
      m.appendChild(el('div', 'sub',
        [p.dist, p.proof, L.titleCase(p.sub)].filter(Boolean).join(' \u00b7 ')));
    }
    const open = el('button', 'btn wide', 'Open its page');
    open.onclick = () => { closeModal(); showBottle(p.k); };
    m.appendChild(open);
    const done = el('button', 'btn ghost wide', 'I poured this');
    done.onclick = () => {
      closeModal();
      confirmDone('Poured ' + p.name, 'Recorded so it drops down the list next time.',
        when => {
          S.history.push(L.logEntry('pour', { k: p.k }, when));
          save_(); renderPayline(); renderHome();
          toast('Logged');
        });
    };
    m.appendChild(done);
    const cancel = el('button', 'btn ghost wide', 'Close');
    cancel.onclick = closeModal;
    m.appendChild(cancel);
  });
}

/* --- history ---------------------------------------------------------- */

const HIST_TABS = [{ id: 'pour', label: 'Pours' }, { id: 'flight', label: 'Flights' }];

function renderHistory(host) {
  const box = host || document.getElementById('histBody');
  if (!box) return;
  box.innerHTML = '';

  const card = el('div', 'sheet');
  const hd = el('div', 'hdr');
  hd.style.marginBottom = '6px';
  hd.appendChild(el('h3', null,
    S.histTab === 'pour' ? 'What you have poured' : 'Flights you have run'));
  const tabs = el('div', 'hdr-acts');
  HIST_TABS.forEach(t => {
    const n = S.history.filter(x => x.kind === t.id).length;
    const b = el('button', 'chip', t.label + (n ? ' ' + n : ''));
    b.setAttribute('aria-pressed', S.histTab === t.id);
    b.onclick = () => { S.histTab = t.id; renderHistory(box); };
    tabs.appendChild(b);
  });
  hd.appendChild(tabs);
  card.appendChild(hd);

  const rows = L.historyRows(S.history, S.catalog, allFlights(), S.histTab);

  if (!rows.length) {
    card.appendChild(el('div', 'sub', S.histTab === 'pour'
      ? 'Nothing logged yet. Spin, tap a glass, and record the pour.'
      : 'No flight marked run yet. Open one and mark it when you have.'));
    box.appendChild(card);
    return;
  }

  // A count per month, so a run of quiet weeks is visible.
  const byMonth = L.historyByMonth(S.history, S.histTab, 6);
  const bars = L.barRows(byMonth, { keepOrder: true });
  if (bars.some(b => b.n)) {
    const b = el('div', 'bars');
    b.style.margin = '4px 0 10px';
    bars.forEach(r => {
      const row = el('div', 'bar');
      row.appendChild(el('div', 't', r.label));
      const track = el('div', 'track');
      const fill = el('div', 'fill');
      fill.style.width = r.pct + '%';
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el('div', 'n', String(r.n)));
      b.appendChild(row);
    });
    card.appendChild(b);
  }

  const list = el('div', 'recent');
  rows.slice(0, 60).forEach(x => {
    const p = x.kind === 'pour' ? prod(x.k) : null;
    const r = el('button', 'item ' + (p ? typeClass(p) : ''));
    const left = el('div');
    const nm = el('div', 'nm');
    if (p) nm.innerHTML = '<span class="dot"></span>';
    nm.appendChild(document.createTextNode(x.label));
    left.appendChild(nm);
    if (x.kind === 'flight' && x.pours) {
      left.appendChild(el('div', 'sub', x.pours.length + ' pours'));
    }
    r.appendChild(left);
    r.appendChild(el('div', 'pf', x.at));
    r.onclick = () => {
      if (p) return showBottle(p.k);
      const f = allFlights().find(y => y.title === x.flight);
      if (f) showFlight(f);
    };
    list.appendChild(r);
  });
  card.appendChild(list);
  if (rows.length > 60) card.appendChild(el('div', 'sub', 'Showing the most recent 60.'));

  // Removing a mistaken entry, since a wrong date in the log is worse than
  // a missing one.
  const undo = el('button', 'chip', 'Remove the most recent');
  undo.style.marginTop = '9px';
  undo.onclick = () => {
    const newest = rows[0];
    confirmDelete(newest.label + ' on ' + newest.at, () => {
      S.history.splice(newest._i, 1);
      save_(); renderHome(); renderFlights(); renderPayline();
      toast('Removed from the log');
    });
  };
  card.appendChild(undo);
  box.appendChild(card);
}

/* --- modal + toast ---------------------------------------------------- */

function closeModal() { $('#overlay').classList.remove('on'); $('#modal').innerHTML = ''; }

function openModal(title, build) {
  const m = $('#modal'); m.innerHTML = '';
  m.appendChild(el('h2', null, title));
  build(m);
  $('#overlay').classList.add('on');
  const first = m.querySelector('input,select');
  if (first) first.focus();
}

let _toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

function fieldRow(label, name, value, attrs) {
  const l = el('label', null, label);
  const i = document.createElement('input');
  i.className = 'field'; i.name = name; i.value = (value === null || value === undefined) ? '' : value;
  Object.keys(attrs || {}).forEach(a => i.setAttribute(a, attrs[a]));
  l.appendChild(i);
  return l;
}

function selectRow(label, name, value, options) {
  const l = el('label', null, label);
  const s = document.createElement('select');
  s.className = 'field'; s.name = name;
  options.forEach(o => {
    const op = document.createElement('option');
    op.value = o; op.textContent = L.titleCase(o);
    if (o === value) op.selected = true;
    s.appendChild(op);
  });
  l.appendChild(s);
  return l;
}

/* --- add / edit a product --------------------------------------------- */

// The add/edit form offers exactly the categories the reels can name, so a
// hand-typed bottle can never land somewhere no spin reaches.
const SUBS = L.TYPES.slice();

function productForm(existing) {
  const p = existing || {};
  openModal(existing ? 'Edit ' + p.name : 'Add a bottle', m => {
    const errBox = el('div', 'errs'); errBox.style.display = 'none';
    m.appendChild(errBox);
    const f = el('div', 'form');
    const nameRow = fieldRow('Name', 'name', p.name, { placeholder: 'Bottle name' });
    f.appendChild(nameRow);

    // Type the name, take the rest. The catalog answers for free; only a
    // genuinely new bottle reaches the network, and nothing auto-commits.
    const lookRow = el('div', 'lookrow');
    const look = el('button', 'btn ghost', 'Fill in the rest');
    const lookMsg = el('div', 'looknote');
    lookRow.appendChild(look);
    lookRow.appendChild(lookMsg);
    f.appendChild(lookRow);

    const applyLookup = res => {
      const filled = L.lookupFilled(res);
      filled.forEach(k => {
        const input = f.querySelector('[name="' + k + '"]');
        if (!input) return;
        // Never overwrite something already typed: what you entered wins.
        if (input.value && input.name !== 'name') return;
        input.value = res[k];
        input.classList.add('looked');
      });
      lookMsg.textContent = (res.source === 'shelf'
        ? 'From your catalog \u2014 ' : 'Looked up \u2014 ')
        + filled.length + ' fields filled. Check them before saving.';
      lookMsg.className = 'looknote ok';
    };

    look.onclick = async () => {
      const nameInput = f.querySelector('[name="name"]');
      const q = (nameInput.value || '').trim();
      if (q.length < 3) { lookMsg.textContent = 'Type a name first.';
        lookMsg.className = 'looknote'; return; }

      const fromShelf = L.lookupFromCatalog(q, S.catalog);
      if (fromShelf) { applyLookup(fromShelf); return; }

      if (!S.lookupUrl) {
        lookMsg.className = 'looknote';
        lookMsg.textContent = 'Not on your shelf. Set up lookup in Info \u203a '
          + 'Our data to fill new bottles automatically, or type the rest.';
        return;
      }
      look.disabled = true;
      lookMsg.className = 'looknote';
      lookMsg.textContent = 'Looking it up\u2026';
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        const r = await fetch(L.lookupUrl(S.lookupUrl, q), { signal: ctrl.signal });
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const res = L.parseLookup(await r.json());
        if (!res) throw new Error('nothing usable came back');
        applyLookup(res);
      } catch (e) {
        lookMsg.className = 'looknote warn2';
        lookMsg.textContent = 'Lookup failed (' + e.message + '). Type the rest.';
      } finally {
        look.disabled = false;
      }
    };

    f.appendChild(fieldRow('Distillery', 'dist', p.dist, {}));
    const two1 = el('div', 'two');
    two1.appendChild(fieldRow('Proof', 'proof', p.proof, { type: 'number', step: '0.1' }));
    two1.appendChild(fieldRow('Age (blank = NAS)', 'age', p.age, { type: 'number' }));
    f.appendChild(two1);
    const two2 = el('div', 'two');
    two2.appendChild(selectRow('Type', 'sub', p.sub || 'bourbon', SUBS));
    two2.appendChild(fieldRow('Style', 'style', p.style, { placeholder: 'e.g. single malt' }));
    f.appendChild(two2);
    f.appendChild(fieldRow('Finish (join several with +)', 'fin', p.fin,
      { placeholder: 'e.g. Oloroso+American Oak' }));
    const two3 = el('div', 'two');
    two3.appendChild(fieldRow('MSRP', 'msrp', p.msrp, { type: 'number', step: '0.01' }));
    two3.appendChild(fieldRow('Secondary', 'sec', p.sec, { type: 'number', step: '0.01' }));
    f.appendChild(two3);
    const two4 = el('div', 'two');
    two4.appendChild(selectRow('Recognition', 'obsc', p.obsc || 'known',
      ['known', 'niche', 'obscure']));
    two4.appendChild(selectRow('Release', 'scar', p.scar || 'standard',
      ['standard', 'batched', 'limited', 'exclusive']));
    f.appendChild(two4);
    if (!existing) {
      f.appendChild(selectRow('Status', 'status', 'open', ['open', 'sealed']));
    }
    m.appendChild(f);

    const save = el('button', 'btn wide', existing ? 'Save changes' : 'Add to the shelf');
    save.onclick = () => {
      const vals = {};
      f.querySelectorAll('input,select').forEach(i => { vals[i.name] = i.value; });
      const errs = L.validateProduct(vals);
      if (errs.length) {
        errBox.style.display = ''; errBox.textContent = errs.join(' ');
        return;
      }
      if (existing) {
        vals.k = p.k;
        const np = L.normalizeProduct(vals);
        delete np.k;
        S.edits[p.k] = Object.assign({}, S.edits[p.k], np, { finc: 'stated' });
      } else {
        const np = L.normalizeProduct(vals);
        if (S.catalog[np.k]) { errBox.style.display = '';
          errBox.textContent = 'A bottle with that name is already on the shelf.'; return; }
        np.finc = np.fin ? 'stated' : null;
        S.custom[np.k] = np;
        S.bottles.push({ id: L.nextBottleId(S.bottles), k: np.k,
                         status: vals.status === 'sealed' ? 'sealed' : 'open', paid: null });
      }
      save_(); rebuildCatalog();
      closeModal(); renderShelf(); renderPayline(); renderHome();
      toast(existing ? 'Saved' : 'Added to the shelf');
    };
    m.appendChild(save);

    const cancel = el('button', 'btn ghost wide', 'Cancel');
    cancel.onclick = closeModal;
    m.appendChild(cancel);
  });
}

// Log something as done, on a date you pick. Defaults to today but never
// assumes it: a flight is written up the morning after as often as the night
// of, and a wrong date is worse than a prompt.
function tastingNoteForm(p) {
  openModal('Tasting notes \u2014 ' + p.name, m => {
    const cur = (p.tn || {});
    const f = el('div', 'form');
    const fields = {};
    L.TN_ORDER.forEach(k => {
      const l = el('label', null, L.titleCase(k));
      const ta = document.createElement('textarea');
      ta.className = 'field'; ta.rows = 2; ta.value = cur[k] || '';
      ta.placeholder = { colour: 'Pale gold, amber, deep mahogany\u2026',
        nose: 'What it smells like', palate: 'What it tastes like',
        finish: 'What is left, and for how long' }[k];
      l.appendChild(ta);
      fields[k] = ta;
      f.appendChild(l);
    });
    m.appendChild(f);
    const src = el('div', 'sub');
    src.style.marginTop = '8px';
    src.textContent = 'Saved as your own tasting. Existing card notes stay '
      + 'credited to the card unless you change them.';
    m.appendChild(src);

    const save = el('button', 'btn wide', 'Save notes');
    save.onclick = () => {
      const tn = {};
      L.TN_ORDER.forEach(k => {
        const v = fields[k].value.trim();
        if (v) tn[k] = v;
      });
      const patch = Object.keys(tn).length
        ? { tn: tn, tnSrc: 'you', tnFrom: null }
        : { tn: null, tnSrc: null, tnFrom: null };
      S.edits[p.k] = Object.assign({}, S.edits[p.k], patch);
      save_(); rebuildCatalog(); closeModal(); showBottle(p.k);
      toast(Object.keys(tn).length ? 'Notes saved' : 'Notes cleared');
    };
    m.appendChild(save);
    const cancel = el('button', 'btn ghost wide', 'Cancel');
    cancel.onclick = closeModal;
    m.appendChild(cancel);
  });
}

/* --- flights -------------------------------------------------------- */
function renderFlightFilters() {
  const all = allFlights();
  const stateCount = v => L.filterFlights(all, S.catalog, S.bottles, S.history,
    { state: v }).length;

  pickList({
    btnId: 'fstatePick', listId: 'fstateList', single: true,
    value: S.fflt.state, allValue: 'all', allLabel: 'All',
    open: S.fflt.showState,
    options: [['all', 'All'], ['todo', 'Not run'], ['run', 'Run'],
              ['ready', 'Fully pourable']].map(([v, t]) => [v, t, stateCount(v)]),
    onPick: v => { S.fflt.state = v; S.fflt.showState = false; renderFlights(); }
  });

  // Type counts here are flights that use the type, not bottles.
  const counts = {};
  all.forEach(f => {
    const subs = new Set(f.core.map(p => (S.catalog[p.k] || {}).sub).filter(Boolean));
    subs.forEach(s => { counts[s] = (counts[s] || 0) + 1; });
  });
  pickList({
    btnId: 'ftypePick', listId: 'ftypeList',
    value: S.fflt.types, allLabel: 'Any type', plural: 'types',
    open: S.fflt.showTypes,
    options: Object.keys(counts).sort((a, b) => counts[b] - counts[a])
      .map(t => [t, L.titleCase(t), counts[t]]),
    onAll: () => { S.fflt.types = []; renderFlights(); },
    onPick: t => {
      const i = S.fflt.types.indexOf(t);
      if (i < 0) S.fflt.types.push(t); else S.fflt.types.splice(i, 1);
      renderFlights();
    }
  });

  const sel = $('#fsortSel');
  if (!sel.options.length) {
    L.FLIGHT_SORTS.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.label;
      sel.appendChild(o);
    });
    sel.onchange = () => { S.fflt.sort = sel.value; renderFlights(); };
  }
  sel.value = S.fflt.sort;
}

function renderFlights() {
  const box = $('#flightList'); box.innerHTML = '';
  renderFlightFilters();
  const opts = Object.assign({}, S.fflt, { q: $('#fq').value });
  const hits = L.sortFlights(
    L.filterFlights(allFlights(), S.catalog, S.bottles, S.history, opts),
    S.catalog, S.bottles, S.history, S.fflt.sort);

  $('#flightCount').textContent = hits.length === allFlights().length
    ? hits.length + ' flights'
    : hits.length + ' of ' + allFlights().length;

  if (!hits.length) {
    box.appendChild(el('div', 'empty', 'No flight matches that.'));
    return;
  }
  hits.forEach(f => {
    const runAt = L.flightRunAt(f, S.history);
    const ready = L.flightReady(f, S.catalog, S.bottles);
    const c = el('button', 'fcard' + (runAt ? ' done' : ''));
    c.appendChild(el('h3', null, L.sentenceCase(f.title)));
    c.appendChild(el('div', 'var', L.variableOf(f)));
    const bits = [f.core.length + ' core', f.ext.length + ' bench'];
    if (ready.open < ready.total) bits.push(ready.open + ' of ' + ready.total + ' open');
    if (runAt) bits.push('run ' + runAt);
    c.appendChild(el('div', 'meta', bits.join(' \u00b7 ')));
    c.onclick = () => showFlight(f);
    box.appendChild(c);
  });
}

// Shipped flights and the ones BZ builds live in one list; only the custom
// ones can be deleted, and either can be edited.
function allFlights() { return S.flights.concat(S.customFlights); }

// Build a flight: you give the variable and the premise, it proposes the
// pours off your shelf and names one bottle that would improve it.
// The same flight, a different cast. Same question, different whisky.
function showRecast(f) {
  const res = L.recastFlight(f, S.catalog, S.bottles, S.history);
  openModal('Run ' + L.sentenceCase(f.title) + ' again', m => {
    if (!res.ok) {
      m.appendChild(el('div', 'errs', res.why));
      const close = el('button', 'btn ghost wide', 'Close');
      close.onclick = closeModal;
      m.appendChild(close);
      return;
    }
    m.appendChild(el('div', 'sub',
      'Run ' + res.run + '. Same variable \u2014 ' + res.variable
      + (res.held ? ', still all ' + L.titleCase(res.held) : '')
      + ' \u2014 cast from what is open now.'));
    if (res.previous) {
      m.appendChild(el('div', 'rs', 'Last run ' + res.previous.at
        + ', ' + res.previous.pours.length + ' pours.'));
    }

    const list = el('div', 'recent');
    list.style.marginTop = '9px';
    res.pours.forEach((x, i) => {
      const p = prod(x.k);
      if (!p) return;
      const repeat = res.repeats.indexOf(x.k) >= 0;
      const r = el('button', 'item ' + typeClass(p));
      const left = el('div');
      const nm = el('div', 'nm');
      nm.innerHTML = '<span class="dot"></span>';
      nm.appendChild(document.createTextNode(
        String.fromCharCode(65 + i) + '  ' + p.name));
      if (repeat) nm.appendChild(el('span', 'pourtag blend', 'poured before'));
      left.appendChild(nm);
      r.appendChild(left);
      r.appendChild(el('div', 'pf', String(p.proof)));
      r.onclick = () => { closeModal(); showBottle(p.k); };
      list.appendChild(r);
    });
    m.appendChild(list);
    m.appendChild(el('div', 'rs', res.fresh + ' of ' + res.pours.length
      + ' have not been poured in this flight before.'));

    (res.notes || []).forEach(n => {
      const w = el('div', 'find f-' + (n.level === 'ok' ? 'ok' : 'warn'));
      w.appendChild(el('div', 'm', n.level === 'ok' ? '\u2713' : '!'));
      w.appendChild(el('div', null, n.msg));
      m.appendChild(w);
    });

    // Keeping it makes a NEW flight rather than overwriting the original,
    // because run one is a record of what was actually poured that night.
    const keep = el('button', 'btn wide btn-gold', 'Keep this cast');
    keep.onclick = () => {
      const nf = L.newFlight(f.title);
      nf.core = L.relabel(res.pours);
      nf.premise = f.premise;
      nf.tag = f.tag;
      nf.why = (f.why || []).slice();
      nf.recastOf = f.title;
      nf.run = res.run;
      nf.cards = nf.core.map(p => {
        const pd = prod(p.k) || {};
        return { letter: p.letter, bottle: pd.name || '', proof: pd.proof || '',
                 wood: pd.fin || '' };
      });
      closeModal();
      flightEditor(nf);
    };
    m.appendChild(keep);
    const cancel = el('button', 'btn ghost wide', 'Cancel');
    cancel.onclick = closeModal;
    m.appendChild(cancel);
  });
}

function flightBuilder() {
  openModal('Build a flight', m => {
    m.appendChild(el('div', 'sub',
      'Pick what the flight changes. Everything else is held as still as the '
      + 'shelf allows, and only open bottles are considered.'));

    const form = el('div', 'form');
    const varSel = document.createElement('select');
    varSel.className = 'field';
    L.VARIABLES.forEach(v => {
      const o = document.createElement('option');
      o.value = v.id; o.textContent = v.label + ' \u2014 ' + v.hint;
      varSel.appendChild(o);
    });
    const vl = el('label', null, 'The variable');
    vl.appendChild(varSel);
    form.appendChild(vl);

    const prem = document.createElement('textarea');
    prem.className = 'field'; prem.rows = 2;
    prem.placeholder = 'What is the room being asked? One sentence.';
    const pl = el('label', null, 'The premise');
    pl.appendChild(prem);
    form.appendChild(pl);
    m.appendChild(form);

    const out = el('div');
    m.appendChild(out);

    const status = el('div', 'looknote');
    status.style.marginTop = '9px';
    m.appendChild(status);

    // Ask the model first when it is configured. It sees only what is open,
    // it is told the house rules, and everything it returns is checked
    // against the real shelf before a drop of it reaches the screen.
    const ask = el('button', 'btn wide btn-gold', S.lookupUrl
      ? 'Design it' : 'Propose from my shelf');
    ask.style.marginTop = '10px';
    ask.onclick = async () => {
      const premise = prem.value.trim();
      const vLabel = (L.VARIABLES.find(v => v.id === varSel.value) || {}).label
        || varSel.value;
      if (!S.lookupUrl) {
        renderProposal(out, L.buildFlight(varSel.value, premise,
          S.catalog, S.bottles), varSel.value, premise);
        return;
      }
      ask.disabled = true;
      status.className = 'looknote';
      status.textContent = 'Designing against your shelf\u2026';
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 45000);
        const r = await fetch(S.lookupUrl, {
          method: 'POST', signal: ctrl.signal,
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(L.flightRequestBody(vLabel, premise,
            S.catalog, S.bottles))
        });
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const res = L.verifyProposal(await r.json(), S.catalog, S.bottles);
        if (!res.ok) throw new Error(res.why);
        status.className = 'looknote ok';
        status.textContent = 'Designed for your shelf.'
          + (res.rejected.length ? '  ' + res.rejected.length
            + ' suggestion(s) dropped \u2014 see below.' : '');
        renderAIProposal(out, res, premise);
      } catch (e) {
        status.className = 'looknote warn2';
        status.textContent = e.message + ' \u2014 falling back to your shelf.';
        renderProposal(out, L.buildFlight(varSel.value, premise,
          S.catalog, S.bottles), varSel.value, premise);
      } finally {
        ask.disabled = false;
      }
    };
    m.appendChild(ask);

    if (S.lookupUrl) {
      const local = el('button', 'btn ghost wide', 'Propose from my shelf instead');
      local.onclick = () => renderProposal(out,
        L.buildFlight(varSel.value, prem.value.trim(), S.catalog, S.bottles),
        varSel.value, prem.value.trim());
      m.appendChild(local);
    } else {
      const hint = el('div', 'sub');
      hint.style.marginTop = '7px';
      hint.textContent = 'Set up the design service in Settings to have a '
        + 'flight written for you, with its reasoning.';
      m.appendChild(hint);
    }

    const manual = el('button', 'btn ghost wide', 'Build it by hand instead');
    manual.onclick = () => { closeModal(); flightEditor(L.newFlight('New flight')); };
    m.appendChild(manual);
    const cancel = el('button', 'btn ghost wide', 'Cancel');
    cancel.onclick = closeModal;
    m.appendChild(cancel);
  });
}

// A designed flight, with the reasoning it came with and everything that
// was thrown out for not being on the shelf.
function renderAIProposal(out, res, premise) {
  out.innerHTML = '';
  if (res.title) {
    const t = el('h3', null, L.sentenceCase(res.title));
    t.style.marginTop = '11px';
    out.appendChild(t);
  }
  if (res.variable) out.appendChild(el('div', 'var', 'One variable: ' + res.variable));
  if (res.premise) {
    const p = el('p'); p.style.cssText = 'font-size:13.5px;margin:7px 0 0';
    p.textContent = res.premise;
    out.appendChild(p);
  }

  const list = el('div', 'recent');
  list.style.marginTop = '9px';
  res.pours.forEach((x, i) => {
    const p = prod(x.k);
    if (!p) return;
    const r = el('button', 'item ' + typeClass(p));
    const left = el('div');
    const nm = el('div', 'nm');
    nm.innerHTML = '<span class="dot"></span>';
    nm.appendChild(document.createTextNode(
      String.fromCharCode(65 + i) + '  ' + p.name));
    left.appendChild(nm);
    if (x.note) left.appendChild(el('div', 'sub', x.note));
    r.appendChild(left);
    r.appendChild(el('div', 'pf', String(p.proof)));
    r.onclick = () => { closeModal(); showBottle(p.k); };
    list.appendChild(r);
  });
  out.appendChild(list);

  (res.notes || []).forEach(n => {
    const w = el('div', 'find f-' + (n.level === 'ok' ? 'ok' : 'warn'));
    w.appendChild(el('div', 'm', n.level === 'ok' ? '\u2713' : '!'));
    w.appendChild(el('div', null, n.msg));
    out.appendChild(w);
  });

  // Anything it named that is not on the shelf is shown, not hidden: it is
  // the difference between a proposal and a fact.
  if (res.rejected && res.rejected.length) {
    const rj = el('div');
    rj.style.marginTop = '9px';
    rj.appendChild(el('div', 'rs', 'Dropped'));
    res.rejected.forEach(x => rj.appendChild(el('div', 'sub',
      x.name + ' \u2014 ' + x.why)));
    out.appendChild(rj);
  }

  if (res.why.length) {
    const w = el('div', 'sheet');
    w.style.marginTop = '10px';
    w.appendChild(el('h3', null, 'Why it is built this way'));
    res.why.forEach(x => {
      const p = el('p');
      p.style.cssText = 'font-size:13px;margin:7px 0 0';
      p.textContent = x;
      w.appendChild(p);
    });
    out.appendChild(w);
  }

  if (res.buy) {
    const b = el('div', 'sheet');
    b.style.marginTop = '10px';
    b.appendChild(el('h3', null, res.buy.onShelf ? 'Open this' : 'One to buy'));
    b.appendChild(el('div', 'nm', res.buy.name));
    if (res.buy.why) b.appendChild(el('div', 'rd', res.buy.why));
    if (!res.buy.onShelf) {
      b.appendChild(el('div', 'src', 'Not on your shelf \u2014 check it before you buy.'));
    }
    out.appendChild(b);
  }

  const keep = el('button', 'btn wide btn-gold', 'Keep it and edit');
  keep.style.marginTop = '11px';
  keep.onclick = () => {
    const f = L.newFlight(res.title || 'New flight');
    f.core = L.relabel(res.pours.map(x => ({ k: x.k })));
    f.premise = res.premise || premise;
    f.tag = res.variable ? 'ONE VARIABLE: ' + res.variable.toUpperCase() : '';
    f.why = res.why.slice();
    f.cards = f.core.map((p, i) => {
      const pd = prod(p.k) || {};
      return { letter: p.letter, bottle: pd.name || '', proof: pd.proof || '',
               wood: pd.fin || '' };
    });
    closeModal();
    flightEditor(f);
  };
  out.appendChild(keep);
}

function renderProposal(out, res, varId, premise) {
  out.innerHTML = '';
  if (!res.ok) {
    out.appendChild(el('div', 'errs', res.why));
    return;
  }
  const head = el('div');
  head.style.marginTop = '11px';
  head.appendChild(el('div', 'rs', 'Holding ' + res.holds.join(' and ')
    + ' at ' + res.held + (res.alternatives
      ? '  \u00b7  ' + res.alternatives + ' other groupings possible' : '')));
  out.appendChild(head);

  const list = el('div', 'recent');
  list.style.marginTop = '8px';
  res.pours.forEach((x, i) => {
    const p = prod(x.k);
    if (!p) return;
    const r = el('button', 'item ' + typeClass(p));
    const left = el('div');
    const nm = el('div', 'nm');
    nm.innerHTML = '<span class="dot"></span>';
    nm.appendChild(document.createTextNode(
      String.fromCharCode(65 + i) + '  ' + p.name));
    left.appendChild(nm);
    left.appendChild(el('div', 'sub', L.axisLabel(varId, p)));
    r.appendChild(left);
    r.appendChild(el('div', 'pf', String(p.proof)));
    r.onclick = () => { closeModal(); showBottle(p.k); };
    list.appendChild(r);
  });
  out.appendChild(list);

  (res.notes || []).forEach(n => {
    const w = el('div', 'find f-' + (n.level === 'ok' ? 'ok' : 'warn'));
    w.appendChild(el('div', 'm', n.level === 'ok' ? '\u2713' : '!'));
    w.appendChild(el('div', null, n.msg));
    out.appendChild(w);
  });

  if (res.buy) {
    const b = el('div', 'sheet');
    b.style.marginTop = '10px';
    b.appendChild(el('h3', null, res.buy.own ? 'Open this' : 'One to buy'));
    b.appendChild(el('div', 'nm', res.buy.p.name));
    b.appendChild(el('div', 'sub', [res.buy.p.dist, res.buy.p.proof,
      res.buy.p.msrp ? '$' + res.buy.p.msrp : null].filter(Boolean).join(' \u00b7 ')));
    b.appendChild(el('div', 'rd', res.buy.why));
    out.appendChild(b);
  }

  const keep = el('button', 'btn wide btn-gold', 'Keep it and edit');
  keep.style.marginTop = '11px';
  keep.onclick = () => {
    const f = L.newFlight(premise ? premise.split(/[.?!]/)[0].slice(0, 48)
      : (L.VARIABLES.find(v => v.id === varId) || {}).label + ' flight');
    f.core = L.relabel(res.pours);
    f.premise = premise;
    f.tag = 'ONE VARIABLE: ' + (L.VARIABLES.find(v => v.id === varId) || {})
      .label.toUpperCase();
    f.cards = f.core.map((p, i) => {
      const pd = prod(p.k) || {};
      return { letter: p.letter, bottle: pd.name || '', proof: pd.proof || '',
               wood: pd.fin || '' };
    });
    closeModal();
    flightEditor(f);
  };
  out.appendChild(keep);
}

function flightEditor(f) {
  openModal(f.custom ? 'Edit flight' : 'Adjust ' + L.sentenceCase(f.title), m => {
    const form = el('div', 'form');
    form.appendChild(fieldRow('Title', 'title', f.title, {}));
    form.appendChild(fieldRow('Variable', 'tag', f.tag,
      { placeholder: 'ONE VARIABLE: WHICH SHERRY' }));
    form.appendChild(fieldRow('Premise', 'premise', f.premise, {}));
    m.appendChild(form);

    // Pours: reorder, remove, sort by proof, add from the open shelf.
    const list = el('div');
    function paint() {
      list.innerHTML = '';
      list.appendChild(el('h3', null, f.core.length + ' pours'));
      f.core.forEach((p, i) => {
        const pd = prod(p.k);
        const r = el('div', 'pourrow');
        r.appendChild(el('div', null, (p.letter || String.fromCharCode(65 + i))
          + ' \u00b7 ' + (pd ? pd.name + '  ' + pd.proof : p.card)));
        const mv = el('div', 'mv');
        [['\u2191', -1], ['\u2193', 1]].forEach(([g, d]) => {
          const b = el('button', null, g);
          b.onclick = () => { f.core = L.movePour(f.core, i, d); paint(); };
          mv.appendChild(b);
        });
        const x = el('button', null, '\u00d7');
        x.onclick = () => { f.core = L.removePour(f.core, i); paint(); };
        mv.appendChild(x);
        r.appendChild(mv);
        list.appendChild(r);
      });

      const sortBtn = el('button', 'chip', 'Sort by proof');
      sortBtn.style.marginTop = '8px';
      sortBtn.onclick = () => { f.core = L.sortByProof(f.core, S.catalog); paint(); };
      list.appendChild(sortBtn);

      const pick = document.createElement('select');
      pick.className = 'field'; pick.style.marginTop = '8px';
      const first = document.createElement('option');
      first.value = ''; first.textContent = 'Add a pour\u2026';
      pick.appendChild(first);
      Object.values(S.catalog)
        .filter(p => L.pourable(p.k, S.bottles))
        .sort((a, b) => a.proof - b.proof)
        .forEach(p => {
          const o = document.createElement('option');
          o.value = p.k; o.textContent = p.name + '  ' + p.proof;
          pick.appendChild(o);
        });
      pick.onchange = () => {
        if (!pick.value) return;
        f.core = L.addPour(f.core, pick.value);
        paint();
      };
      list.appendChild(pick);
    }
    paint();
    m.appendChild(list);

    const save = el('button', 'btn wide', 'Save flight');
    save.onclick = () => {
      const vals = {};
      form.querySelectorAll('input').forEach(i => { vals[i.name] = i.value; });
      const title = (vals.title || '').trim();
      if (title.length < 2) { toast('A flight needs a title'); return; }
      f.title = title.toUpperCase();
      f.tag = vals.tag; f.premise = vals.premise;
      f.cards = f.core.map((p, i) => {
        const pd = prod(p.k) || {};
        return { letter: p.letter || String.fromCharCode(65 + i),
                 bottle: pd.name || '', proof: pd.proof || '', wood: pd.fin || '' };
      });
      if (f.custom && S.customFlights.indexOf(f) < 0) S.customFlights.push(f);
      if (!f.custom) S.edits['flight:' + f.title] = { title: f.title, tag: f.tag,
        premise: f.premise, core: f.core };
      save_(); closeModal(); renderFlights(); showFlight(f); toast('Flight saved');
    };
    m.appendChild(save);

    if (f.custom) {
      const del = el('button', 'btn ghost wide danger', 'Delete this flight');
      del.onclick = () => confirmDelete(L.sentenceCase(f.title), () => {
        S.customFlights = S.customFlights.filter(x => x !== f);
        save_(); closeModal(); renderFlights(); show('flights'); toast('Flight deleted');
      });
      m.appendChild(del);
    }
    const cancel = el('button', 'btn ghost wide', 'Cancel');
    cancel.onclick = closeModal;
    m.appendChild(cancel);
  });
}

function showFlight(f) {
  S.lastList = 'flights';
  const body = $('#detailBody'); body.innerHTML = '';

  const fa = detailActs();
  const fEdit = el('button', 'btn btn-sm btn-gold', 'Edit');
  fEdit.onclick = () => flightEditor(f);
  fa.appendChild(fEdit);
  const fSms = el('button', 'btn btn-sm', 'Text it');
  fSms.onclick = () => {
    const prods0 = f.core.map(x => prod(x.k)).filter(Boolean);
    location.href = 'sms:?&body=' + encodeURIComponent(L.smsBody(f, prods0));
  };
  fa.appendChild(fSms);
  // A flight that has been run can be run again with a different cast.
  const runs = L.flightRuns(f, S.history);
  if (runs.length) {
    const again = el('button', 'btn btn-sm', 'Run it again');
    again.onclick = () => showRecast(f);
    fa.appendChild(again);
  }

  const fRun = el('button', 'btn btn-sm', 'Mark it run');
  fRun.onclick = () => confirmDone('Mark ' + L.sentenceCase(f.title) + ' as run',
    'It moves to the completed list and its pours count toward overuse.',
    when => {
      S.history.push(L.logEntry('flight',
        { flight: f.title, pours: f.core.map(x => x.k) }, when));
      save_(); renderFlights(); renderHome(); showFlight(f);
      toast('Recorded for ' + when);
    });
  fa.appendChild(fRun);
  const head = el('div', 'sheet');
  const t = el('h2'); t.style.cssText = 'font-size:23px;color:var(--ink-deep)';
  t.textContent = L.sentenceCase(f.title);
  head.appendChild(t);
  head.appendChild(el('div', 'var', L.variableOf(f)));
  const pr = el('p'); pr.style.cssText = 'font-size:14px;margin:9px 0 0';
  pr.textContent = f.premise || '';
  head.appendChild(pr);
  body.appendChild(head);

  const prods = f.core.map(p => prod(p.k)).filter(Boolean);

  // validators
  const vbox = el('div');
  L.validate(f.core, S.catalog, { bottles: S.bottles, coreTarget: L.CORE_TARGET })
    .forEach(m => {
      const w = el('div', 'warn' + (m.level === 'ok' ? ' ok' : ''));
      w.innerHTML = '<b>' + (m.level === 'ok' ? '\u2713' : '!') + '</b> ';
      w.appendChild(document.createTextNode(m.msg));
      vbox.appendChild(w);
    });
  body.appendChild(vbox);

  // the proof ladder
  const lad = el('div', 'sheet');
  lad.appendChild(el('h3', null, 'The pours'));
  const ladder = el('div', 'ladder');
  ladder.appendChild(el('div', 'axis'));
  f.core.forEach((p, i) => {
    const kind = L.pourKind(p);
    const pd = kind === 'shelf' ? prod(p.k) : null;
    const card = f.cards[i] || {};
    const spotted = /SPOTTED/i.test(card.wood || '');
    const proof = L.pourProof(p, S.catalog);
    const r = el('div', 'rung ' + (spotted ? 'spot' : 'blind')
      + (kind === 'wish' ? ' wish' : ''));
    r.appendChild(el('div', 'pin', proof !== null ? proof : (card.proof || '')));
    r.appendChild(el('div', 'tick'));
    const b = el('div', 'body');
    const line = el('div', 'b');
    line.appendChild(document.createTextNode(
      (p.letter || String.fromCharCode(65 + i)) + ' \u00b7 '
      + (L.pourLabel(p, S.catalog) || p.card || '')));
    // A wish and a blend are not bottles on the shelf, and the ladder should
    // not pretend otherwise.
    if (kind !== 'shelf') {
      line.appendChild(el('span', 'pourtag ' + kind,
        kind === 'wish' ? 'want it' : 'blend'));
    }
    b.appendChild(line);

    if (kind === 'blend') {
      // Say what it is made of, since that is the whole instruction.
      const parts = (p.parts || []).map(k => (S.catalog[k] || {}).name || k);
      b.appendChild(el('div', 'w', p.note || ('Equal parts ' + parts.join(' and '))));
    } else {
      const woodBits = pd && pd.fin ? pd.fin
        : (card.wood || '').split('\u2014')[0].trim();
      if (woodBits) b.appendChild(el('div', 'w', woodBits));
    }

    if (pd) { b.style.cursor = 'pointer'; b.onclick = () => showBottle(pd.k); }
    r.appendChild(b);
    ladder.appendChild(r);
  });
  lad.appendChild(ladder);
  lad.appendChild(el('div', 'snack', 'Snacks: ' + L.snacksFor(prods).join(', ')));
  body.appendChild(lad);

  // bench
  if (f.ext.length) {
    const e = el('div', 'sheet');
    e.appendChild(el('h3', null, 'On the bench'));
    f.ext.forEach(x => {
      const pd = prod(x.k);
      e.appendChild(el('div', 'sub', (pd ? pd.name + ' \u00b7 ' + pd.proof : x.card)));
    });
    body.appendChild(e);
  }

  // why it is built this way
  if (f.why && f.why.length) {
    const w = el('div', 'sheet');
    w.appendChild(el('h3', null, 'Why it is built this way'));
    f.why.forEach(x => {
      const p2 = el('p'); p2.style.cssText = 'font-size:13px;margin:8px 0 0;color:var(--ink)';
      p2.textContent = x; w.appendChild(p2);
    });
    body.appendChild(w);
  }

  show('detail');
}

/* --- boot ----------------------------------------------------------- */
function boot(data) {
  S.base = data.catalog; S.bottles = data.bottles; S.flights = data.flights;
  load();                       // user layers, including their own bottles list
  rebuildCatalog();
  // A shipped flight the user has adjusted: re-apply their version.
  S.flights = S.flights.map(f => {
    const ov = S.edits['flight:' + f.title];
    return ov ? Object.assign({}, f, ov) : f;
  });
  renderShelfFilters(); renderShelf(); renderReels(); renderPayline();
  renderFlights(); renderHome(); renderReference(); renderShop();
  fetch('./map.json').then(r => r.json()).then(md => {
    MAPDATA = md; wireMap(); renderMap(); drawHomeMap();
  }).catch(() => {
    $('#mapCount').textContent = 'map.json did not load';
  });
  // Inside the scrolling screen, not on body: body is a flex column ending
  // with the nav, so anything appended after it lands below the bar.
  const f = el('footer');
  f.innerHTML = 'Killer B\u2019s Bottle Tracker <span id="verString">v0.1.60</span>'
    + ' \u00b7 <span id="buildTime"></span>';
  const home = document.getElementById('scr-home');
  if (home) home.appendChild(f);
  // Header sub-line and build stamp, kept in sync with the constants.
  const hv = document.getElementById('header-version');
  if (hv) hv.textContent = 'v' + APP_VERSION;
  const bt = document.getElementById('buildTime');
  if (bt) bt.textContent = 'Build ' + BUILD_TIME;
}

/* --- install and auto-update ------------------------------------------
   The same shape MadGolf uses: check for a new worker on every load, take
   it immediately when nothing is half-finished on screen, and hold it with
   a toast when something is. */
if ('serviceWorker' in navigator) {
  let _swReg = null;
  let _swReloading = false;

  // The analogue of "mid-round" here is an open form: a modal with typing in
  // it, or a flight being edited. Reloading under those loses work.
  function _swIsBusy() {
    const ov = document.getElementById('overlay');
    if (ov && ov.classList.contains('on')) return true;
    const el2 = document.activeElement;
    return !!(el2 && /^(INPUT|TEXTAREA|SELECT)$/.test(el2.tagName) && el2.value);
  }

  function _swActivateNow() {
    if (_swReg && _swReg.waiting) _swReg.waiting.postMessage({ type: 'SKIP_WAITING' });
  }

  function _swHandleUpdate(worker) {
    if (!worker) return;
    const act = () => {
      if (!_swIsBusy()) { _swActivateNow(); return; }
      if (typeof toast === 'function') toast('Update ready — reload when you are done');
      // Take it as soon as the screen is idle rather than leaving it waiting
      // until the next cold start.
      const poll = setInterval(() => {
        if (!_swIsBusy()) { clearInterval(poll); _swActivateNow(); }
      }, 20000);
    };
    if (worker.state === 'installed') act();
    worker.addEventListener('statechange', () => {
      if (worker.state === 'installed' && navigator.serviceWorker.controller) act();
    });
  }

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      _swReg = reg;
      reg.update().catch(() => {});          // bypass the browser's 24-hour delay
      reg.addEventListener('updatefound', () => _swHandleUpdate(reg.installing));
      if (reg.waiting) _swHandleUpdate(reg.waiting);
      // Used at home and in shops rather than all day: an hourly check is
      // plenty and costs nothing when the app is closed.
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
    }).catch(err => console.warn('SW registration failed:', err));

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!_swReloading) { _swReloading = true; window.location.reload(); }
    });
  });
}

// Install to the home screen. Chrome fires this; iOS Safari does not, so the
// home page tells iOS users to use Share, Add to Home Screen instead.
let _installEvt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _installEvt = e;
  const b = document.getElementById('installBtn');
  if (b) {
    b.hidden = false;
    b.onclick = async () => {
      if (!_installEvt) return;
      _installEvt.prompt();
      await _installEvt.userChoice;
      _installEvt = null;
      b.hidden = true;
    };
  }
});
window.addEventListener('appinstalled', () => {
  _installEvt = null;
  const b = document.getElementById('installBtn');
  if (b) b.hidden = true;
});
