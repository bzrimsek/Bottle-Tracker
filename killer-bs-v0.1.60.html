      spread: new Set(picked.map(p => String(L.axisOf(varId, p)))).size,
      score: L.flightScore(varId, picked)
    });
  });
  out.sort((a, b) => b.score - a.score);
  return out;
};

// Choose a spread along the axis rather than the first N. For a numeric
// variable that means even steps; for a categorical one, one of each.
L.pickSpread = function (varId, members, size) {
  const numeric = varId === 'proof' || varId === 'age';
  if (numeric) {
    const sorted = members.slice().sort((a, b) =>
      L.axisOf(varId, a) - L.axisOf(varId, b));
    if (sorted.length <= size) return sorted;
    const out = [];
    for (let i = 0; i < size; i++) {
      out.push(sorted[Math.round(i * (sorted.length - 1) / (size - 1))]);
    }
    return out.filter((p, i, a) => a.indexOf(p) === i);
  }
  // Categorical: one per value, the most interesting first, then fill.
  const byVal = {};
  members.forEach(p => {
    const v = String(L.axisOf(varId, p));
    (byVal[v] = byVal[v] || []).push(p);
  });
  const rank = p => (p.obsc === 'obscure' ? 2 : p.obsc === 'niche' ? 1 : 0);
  const vals = Object.keys(byVal);
  vals.forEach(v => byVal[v].sort((a, b) => rank(b) - rank(a) || a.proof - b.proof));

  // One of each value first, so the axis is covered before anything is
  // doubled up. Then keep going round, taking a second of each, until the
  // flight is full -- otherwise a three-value axis yields three pours and
  // fails the floor.
  const out = [];
  for (let round = 0; out.length < size; round++) {
    let took = 0;
    vals.forEach(v => {
      if (out.length >= size) return;
      const p = byVal[v][round];
      if (p) { out.push(p); took++; }
    });
    if (!took) break;
  }
  out.sort((a, b) => a.proof - b.proof);
  return out.slice(0, size);
};

// How good a flight this set would make, by the rules BZ actually uses.
L.flightScore = function (varId, pours) {
  if (!pours.length) return 0;
  let s = 0;
  const axes = pours.map(p => String(L.axisOf(varId, p)));
  s += new Set(axes).size * 12;                       // spread along the axis

  const proofs = pours.map(p => p.proof);
  let ascends = true;
  for (let i = 1; i < proofs.length; i++) if (proofs[i] < proofs[i - 1]) ascends = false;
  if (ascends) s += 15;

  // A matched pair at the same proof is the strongest shape there is.
  for (let i = 0; i < pours.length; i++) {
    for (let j = i + 1; j < pours.length; j++) {
      if (Math.abs(pours[i].proof - pours[j].proof) <= 0.5
          && axes[i] !== axes[j]) { s += 20; }
    }
  }
  if (pours.some(p => p.obsc === 'obscure')) s += 18;   // the build rule
  else if (pours.some(p => p.obsc === 'niche')) s += 6;
  if (pours.length === L.CORE_TARGET) s += 10;

  // For a proof flight the range has to be worth tasting; for the others a
  // wide proof range is noise on top of the variable.
  const range = Math.max.apply(null, proofs) - Math.min.apply(null, proofs);
  if (varId === 'proof') s += Math.min(range, 40) / 2;
  else s -= Math.min(range, 60) / 4;
  return Math.round(s);
};

// The one to buy. Something not on the shelf that would extend the axis
// further than anything open can — the gap the collection cannot fill.
L.suggestPurchase = function (varId, pours, catalog, bottles) {
  const have = new Set(pours.map(p => p.k));
  const axes = new Set(pours.map(p => String(L.axisOf(varId, p))));
  const holds = L.holdsFor(varId);
  const ref = pours[0] || {};

  const candidates = Object.values(catalog).filter(p => {
    if (have.has(p.k)) return false;
    if (L.axisOf(varId, p) === null) return false;
    // Must sit in the same held context, or it changes two things.
    if (!holds.every(f => (p[f] || '?') === (ref[f] || '?'))) return false;
    return !axes.has(String(L.axisOf(varId, p)));
  });

  // Prefer something you already own but cannot pour: opening a sealed
  // spare costs nothing.
  const sealed = candidates.filter(p => L.ownedCount(p.k, bottles) > 0);
  if (sealed.length) {
    return { p: sealed[0], why: 'You own this already, sealed. Open it and the '
      + 'flight gains ' + L.axisLabel(varId, sealed[0]) + '.', own: true };
  }
  if (!candidates.length) return null;
  candidates.sort((a, b) => (a.msrp || 9999) - (b.msrp || 9999));
  const pick = candidates[0];
  return { p: pick, why: 'Not on the shelf. It would add '
    + L.axisLabel(varId, pick) + ', which nothing open covers.', own: false };
};

L.axisLabel = function (varId, p) {
  const v = L.axisOf(varId, p);
  if (varId === 'proof') return v + ' proof';
  if (varId === 'age') return v + ' years';
  if (varId === 'price') return L.titleCase(String(v));
  return String(v);
};

// The whole proposal, ready to render or to turn into a flight.
L.buildFlight = function (varId, premise, catalog, bottles, opts) {
  const cands = L.flightCandidates(varId, catalog, bottles, opts);
  if (!cands.length) {
    return { ok: false,
      why: 'Nothing open holds still enough for that variable. Try another, '
        + 'or open a few sealed bottles.' };
  }
  const best = cands[0];
  const pours = L.sortByProof(best.pours.map(p => ({ k: p.k })), catalog);
  const full = pours.map(x => catalog[x.k]);
  return {
    ok: true, variable: varId, premise: premise || '',
    holds: best.holds, held: best.key,
    pours: pours, score: best.score,
    notes: L.validate(pours, catalog, { bottles: bottles }),
    buy: L.suggestPurchase(varId, full, catalog, bottles),
    alternatives: cands.length - 1
  };
};


/* --- AI-assisted flight design ---------------------------------------- */

// What the model is allowed to see: the open shelf, compactly. Sending the
// whole catalog would include sealed bottles it must not reach for.
L.flightPayload = function (catalog, bottles) {
  return Object.values(catalog)
    .filter(p => L.pourable(p.k, bottles) && !p.drained)
    .map(p => {
      // Null fields are dropped rather than sent: 325 bottles of "f":null is
      // a third of the payload and tells the model nothing.
      const o = { n: p.name, pf: p.proof, t: p.sub, o: p.obsc };
      if (p.dist) o.d = p.dist;
      if (p.fin) o.f = p.fin;
      if (p.region) o.r = p.region;
      if (p.age) o.a = p.age;
      if (p.msrp) o.pr = p.msrp;
      return o;
    });
};

// The house rules, sent with every request so the model designs to the same
// standard the validators check against.
L.FLIGHT_RULES = [
  'One variable per flight. Everything else is held as still as the shelf allows.',
  'Six core pours unless there is a reason for another number.',
  'Proof ascends across the flight unless you say why it does not.',
  'At least one pour the room will not recognise.',
  'A matched pair at the same proof differing in one perceptible way is the '
    + 'strongest shape available; use one where the shelf allows.',
  'The answer must be TASTEABLE. Reject a variable whose answer has to be told '
    + 'rather than tasted, such as who owns a distillery or how it was allocated.',
  'Reject a production mechanism with no flavour signature of its own, such as '
    + 'cask size or the shape of the still.',
  'Use only bottles from the shelf provided. Never invent one.'
];

// Anything the model returns is a proposal, not a fact. Every pour has to
// resolve to a bottle that is actually open, or it is dropped and reported.
// This is the whole safety story: a name that does not exist cannot be poured.
// How close a returned name must be before it counts as a real bottle.
// High on purpose: a false accept pours something that does not exist, a
// false reject only shortens the flight and says so.
L.PROPOSAL_MATCH = 0.75;

L.verifyProposal = function (raw, catalog, bottles) {
  if (!raw || typeof raw !== 'object') {
    return { ok: false, why: 'Nothing usable came back.' };
  }
  const str = (v, n) => typeof v === 'string' ? v.trim().slice(0, n) : '';
  const out = { ok: true, pours: [], rejected: [],
                title: str(raw.title, 60), premise: str(raw.premise, 400),
                variable: str(raw.variable, 60), why: [], buy: null };
  if (Array.isArray(raw.why)) {
    out.why = raw.why.filter(x => typeof x === 'string')
      .map(x => x.trim().slice(0, 300)).slice(0, 6);
  }

  const byName = {};
  Object.values(catalog).forEach(p => { byName[L.shopNorm(p.name)] = p; });
  const seen = {};

  (Array.isArray(raw.pours) ? raw.pours : []).forEach(x => {
    const name = typeof x === 'string' ? x : (x && (x.name || x.k));
    if (!name) return;
    // Exact first. The fuzzy fallback is deliberately strict: the model is
    // told to copy names character for character, and a loose match turns an
    // invented bottle into a real one -- "Completely Invented Whisky 12"
    // scored a match on the token "12" before this threshold existed.
    let hit = byName[L.shopNorm(name)];
    if (!hit) {
      // A one-token name is not evidence: "Bourbon 12" reduces to "12",
      // which scores a perfect match against anything with 12 in it. Two
      // meaningful tokens minimum before a fuzzy match is allowed at all.
      const tokens = L.shopNorm(name).split(' ').filter(Boolean);
      if (tokens.length >= 2) {
        const near = L.shopSearch(name, catalog, 1)[0];
        if (near && near.score >= L.PROPOSAL_MATCH) hit = near.p;
      }
    }
    if (!hit) { out.rejected.push({ name: String(name), why: 'not on the shelf' }); return; }
    if (seen[hit.k]) { out.rejected.push({ name: hit.name, why: 'listed twice' }); return; }
    if (!L.pourable(hit.k, bottles)) {
      out.rejected.push({ name: hit.name, why: 'not open' }); return;
    }
    seen[hit.k] = true;
    out.pours.push({ k: hit.k,
      note: (x && typeof x.note === 'string') ? x.note.trim().slice(0, 200) : null });
  });

  if (raw.buy && (raw.buy.name || typeof raw.buy === 'string')) {
    const bn = raw.buy.name || raw.buy;
    // A purchase suggestion is meant to be something you do not own, so it is
    // not checked against the shelf -- only trimmed, and labelled if it turns
    // out you already have it.
    out.buy = { name: String(bn).trim().slice(0, 80),
                why: str(raw.buy.why, 300),
                onShelf: !!byName[L.shopNorm(bn)] };
  }

  if (out.pours.length < 3) {
    return { ok: false, rejected: out.rejected,
      why: 'Only ' + out.pours.length + ' of the suggested pours are open on '
        + 'your shelf.' };
  }
  out.pours = L.sortByProof(out.pours, catalog);
  out.notes = L.validate(out.pours, catalog, { bottles: bottles });
  return out;
};

L.flightRequestBody = function (varLabel, premise, catalog, bottles) {
  return { mode: 'flight', variable: varLabel, premise: premise,
           rules: L.FLIGHT_RULES, shelf: L.flightPayload(catalog, bottles) };
};


/* --- flight editing -------------------------------------------------- */

L.newFlight = function (title) {
  return { title: (title || 'NEW FLIGHT').toUpperCase(), tag: '', premise: '',
           why: [], core: [], ext: [], cards: [], custom: true };
};

// Pour letters are positional: removing pour C makes the old D into C, so
// they are always relabelled from the current order rather than stored.
L.relabel = function (pours) {
  return (pours || []).map((p, i) => Object.assign({}, p, {
    letter: String.fromCharCode(65 + i), ord: i + 1 }));
};

L.addPour = function (pours, key) {
  return L.relabel((pours || []).concat([{ k: key, role: 'core' }]));
};

L.removePour = function (pours, idx) {
  const out = (pours || []).slice();
  out.splice(idx, 1);
  return L.relabel(out);
};

L.movePour = function (pours, idx, delta) {
  const out = (pours || []).slice();
  const to = idx + delta;
  if (to < 0 || to >= out.length) return L.relabel(out);
  const [x] = out.splice(idx, 1);
  out.splice(to, 0, x);
  return L.relabel(out);
};

// Order the pours by ascending proof -- the house rule, applied in one call.
L.sortByProof = function (pours, catalog) {
  const out = (pours || []).slice().sort((a, b) => {
    const pa = catalog[a.k], pb = catalog[b.k];
    return ((pa && pa.proof) || 0) - ((pb && pb.proof) || 0);
  });
  return L.relabel(out);
};

/* --- pours that are not a bottle on the shelf ------------------------- */

// A flight pour is one of three things, and only the first was ever
// modelled. The other two were silently dropped on import, which is why
// Who's Your Daddy? reads as a three-pour flight and QA reports it short
// on every run.
//
//   shelf  a bottle you own          { k: 'Weller 12' }
//   wish   one you do not, yet       { kind: 'wish', name: 'Pappy 15' }
//   blend  made from ones you own    { kind: 'blend', name: "Poor Man's
//                                      Pappy", parts: ['Weller 12', ...] }
//
// The blend is the interesting one: Poor Man's Pappy is Weller 12 and
// Weller Antique 107 in equal parts, so that pour is available tonight even
// though no bottle of it exists.

L.POUR_KINDS = ['shelf', 'wish', 'blend'];

L.pourKind = function (p) {
  if (!p) return 'shelf';
  if (p.kind === 'wish' || p.kind === 'blend') return p.kind;
  return 'shelf';
};

// Can this pour actually be poured tonight? A blend can, if every part is
// open. A wish cannot, by definition.
L.pourAvailable = function (p, catalog, bottles) {
  const kind = L.pourKind(p);
  if (kind === 'wish') return false;
  if (kind === 'blend') {
    return (p.parts || []).length > 0
      && p.parts.every(k => catalog[k] && L.pourable(k, bottles));
  }
  return !!(catalog[p.k] && L.pourable(p.k, bottles));
};

// What to call it on a card or a ladder.
L.pourLabel = function (p, catalog) {
  const kind = L.pourKind(p);
  if (kind === 'shelf') return (catalog[p.k] || {}).name || p.k || '';
  return p.name || '';
};

// A blend's proof is the average of its parts, weighted by their share.
// Equal parts of 90 and 107 is 98.5, and the ladder should place it there
// rather than treating it as unknown.
L.blendProof = function (p, catalog) {
  const parts = (p.parts || []).map(k => catalog[k]).filter(Boolean);
  if (!parts.length) return null;
  const w = p.ratio && p.ratio.length === parts.length
    ? p.ratio : parts.map(() => 1);
  const total = w.reduce((a, b) => a + b, 0);
  if (!total) return null;
  const sum = parts.reduce((a, pd, i) => a + pd.proof * w[i], 0);
  return Math.round((sum / total) * 10) / 10;
};

L.pourProof = function (p, catalog) {
  const kind = L.pourKind(p);
  if (kind === 'blend') return L.blendProof(p, catalog);
  if (kind === 'wish') return p.proof || null;
  return (catalog[p.k] || {}).proof || null;
};

/* --- running a flight again ------------------------------------------- */

// A flight is a template; the six bottles are one CAST of it. Sherry Is Not
// One Thing should be runnable next year with different pours and still be
// the same flight — the same question asked of a different shelf.
//
// The history already stores each run's cast, so this is mostly a matter of
// reading what has been poured and proposing something that is not that.

L.flightRuns = function (f, history) {
  return (history || [])
    .filter(x => x.kind === 'flight' && x.flight === f.title)
    .slice()
    .sort((a, b) => (a.at || '').localeCompare(b.at || ''))
    .map((x, i) => ({ run: i + 1, at: x.at, pours: x.pours || [] }));
};

// Every bottle this flight has ever used, so a re-cast can avoid repeating
// itself. Repeating one pour is fine and sometimes right — a control you
// keep — but repeating all six is just running it again.
L.pouredBefore = function (f, history) {
  const seen = {};
  L.flightRuns(f, history).forEach(r => {
    (r.pours || []).forEach(k => { if (k) seen[k] = (seen[k] || 0) + 1; });
  });
  return seen;
};

// Propose a fresh cast for the same variable, from what is open now.
//
// It reuses the local recommender rather than inventing a second one, then
// pushes bottles used in a previous run toward the back — so the new cast
// answers the same question with different whisky wherever the shelf allows.
L.recastFlight = function (f, catalog, bottles, history, opts) {
  const o = opts || {};
  const varId = o.variable || L.variableOfId(f);
  if (!varId) {
    return { ok: false, why: 'This flight does not state a single variable, '
      + 'so there is nothing to hold still while re-casting it.' };
  }
  const used = L.pouredBefore(f, history);

  // A re-cast must keep the flight's OWN constraints, not just its variable.
  // Sherry Is Not One Thing is all Scotch and no smoke; holding only "the
  // cask" still produced five Irish Spots, which is a fine flight and a
  // different one. Where the existing cast is uniform in a field, that
  // uniformity is part of the design and travels with it.
  const cast = (f.core || []).map(p => catalog[p.k]).filter(Boolean);
  const uniform = field => {
    const vals = new Set(cast.map(p => p[field]).filter(Boolean));
    return vals.size === 1 && cast.length >= 3 ? [...vals][0] : null;
  };
  const opts2 = Object.assign({}, o);
  if (!opts2.sub) opts2.sub = uniform('sub');

  const cands = L.flightCandidates(varId, catalog, bottles, opts2);
  if (!cands.length) {
    return { ok: false, why: 'Nothing open holds still enough for '
      + varId + ' right now.' };
  }

  // Prefer the grouping that reuses least.
  const scored = cands.map(c => {
    const repeats = c.pours.filter(p => used[p.k]).length;
    return { c: c, repeats: repeats, score: c.score - repeats * 25 };
  }).sort((a, b) => b.score - a.score);

  const best = scored[0].c;
  const pours = L.sortByProof(best.pours.map(p => ({ k: p.k })), catalog);
  const runs = L.flightRuns(f, history);
  return {
    ok: true,
    variable: varId,
    held: opts2.sub || null,
    run: runs.length + 1,
    previous: runs.length ? runs[runs.length - 1] : null,
    pours: pours,
    repeats: pours.filter(p => used[p.k]).map(p => p.k),
    fresh: pours.filter(p => !used[p.k]).length,
    notes: L.validate(pours, catalog, { bottles: bottles }),
    buy: L.suggestPurchase(varId, pours.map(p => catalog[p.k]).filter(Boolean),
      catalog, bottles)
  };
};

// The tag carries the variable as prose — "ONE VARIABLE: WHICH SHERRY" —
// so map it back to one of the ids the builder understands.
L.variableOfId = function (f) {
  const tag = ((f && f.tag) || '') + ' ' + ((f && f.title) || '');
  const t = tag.toLowerCase();
  if (/proof|strength/.test(t)) return 'proof';
  if (/sherry|cask|wood|finish|wine|port|madeira/.test(t)) return 'finish';
  if (/region|postcode|island|coast|where/.test(t)) return 'region';
  if (/age|year|old|time/.test(t)) return 'age';
  if (/grain|mash|rye|wheat|corn/.test(t)) return 'grain';
  if (/price|cost|money|worth/.test(t)) return 'price';
  if (/house|distiller/.test(t)) return 'house';
  return null;
};

/* --- what the shelf is missing ---------------------------------------- */

// Almost all of this is arithmetic, not judgement. The shelf already knows
// where it is thin; the only thing a model could add is naming specific
// bottles to fill a gap, and that comes later and last.
//
// Ranked by what a purchase ENABLES, not by what it costs or how rare it
// is. The failure mode to avoid is a list that says buy Pappy: expensive,
// obvious, and it unlocks nothing you cannot already do.

L.GAP_KINDS = ['flight', 'wish', 'extend', 'contrast', 'region', 'category',
               'proof', 'pair'];

// EXTENSION: a house you have clearly committed to, where one more bottle
// deepens something real rather than filling a hole. Twenty-four Buffalo
// Trace is not a gap, it is a preference, and the useful suggestion works
// WITH it.
L.gapsFromHouses = function (catalog, bottles) {
  const by = {};
  Object.values(catalog).forEach(p => {
    if (!p.dist) return;
    (by[p.dist] = by[p.dist] || []).push(p);
  });
  const out = [];
  Object.keys(by).forEach(dist => {
    const set = by[dist];
    if (set.length < 4) return;              // not a commitment yet
    const proofs = set.map(p => p.proof);
    const lo = Math.min.apply(null, proofs), hi = Math.max.apply(null, proofs);
    const fins = new Set(set.map(p => p.fin).filter(Boolean));
    const ages = set.map(p => p.age).filter(Boolean);

    // The dimension this house has NOT been explored along is the one worth
    // suggesting, because it is the next thing you could actually taste.
    // Weighted by how far into the house you have actually gone. Four
    // bottles is a leaning; twenty-four is a commitment, and a suggestion
    // about it is worth more.
    const commit = Math.min(set.length, 20);
    if (hi - lo < 20) {
      out.push({ kind: 'extend',
        name: 'A ' + dist + ' at a very different strength',
        why: set.length + ' from ' + dist + ', all between ' + lo + ' and '
          + hi + ' proof. The house at cask strength would be a new axis.',
        weight: 40 + commit });
    } else if (!fins.size) {
      out.push({ kind: 'extend', name: 'A finished ' + dist,
        why: set.length + ' from ' + dist + ' and not one finished bottling, '
          + 'so the wood has never been the variable.',
        weight: 38 + commit });
    } else if (!ages.length) {
      out.push({ kind: 'extend', name: 'An age-stated ' + dist,
        why: set.length + ' from ' + dist + ' and no age statement among '
          + 'them, so age has never been the variable.',
        weight: 34 + commit });
    }
  });
  // Three is a suggestion; eight near-identical lines is noise.
  out.sort((a, b) => b.weight - a.weight);
  return out.slice(0, 3);
};

// CONTRAST: where the shelf leans so far one way that the comparison cannot
// be made at all. 97 wine-cask bottles against 13 wood-only is not a
// shortage of wine casks.
L.gapsFromContrast = function (catalog, bottles) {
  const live = Object.values(catalog);
  const n = f => live.filter(f).length;
  const out = [];

  const wine = n(p => p.wine === true), wood = n(p => p.wine === false);
  if (wine >= 20 && wood * 4 < wine) {
    out.push({ kind: 'contrast', name: 'A wood-only bottling',
      why: wine + ' wine-cask bottles against ' + wood + ' finished in wood '
        + 'alone. You cannot taste what the wine is doing without the other '
        + 'side.', weight: 62 });
  }

  const peated = n(p => /peat|smok|islay/i.test((p.fin || '') + p.name)
    || p.region === 'Islay');
  const unpeatedIslay = n(p => p.region === 'Islay'
    && /bruichladdich|bunnahabhain/i.test(p.dist || ''));
  if (peated >= 25 && unpeatedIslay < 2) {
    out.push({ kind: 'contrast', name: 'An unpeated Islay',
      why: 'Islay is your biggest region and it is peated throughout. An '
        + 'unpeated one separates the island from the smoke.', weight: 60 });
  }

  const nas = n(p => !p.age), aged = n(p => p.age);
  if (nas > aged * 3 && aged < 40) {
    out.push({ kind: 'contrast', name: 'An age-stated bottle you can compare',
      why: nas + ' with no age statement against ' + aged + ' with one, so '
        + 'age is hard to hold still as a variable.', weight: 44 });
  }
  return out;
};

// A flight you cannot run because a pour is missing. The strongest kind of
// gap, because the thing it unlocks is concrete and already designed.
L.gapsFromFlights = function (flights, catalog, bottles) {
  const out = [];
  (flights || []).forEach(f => {
    const shape = L.flightShape(f, catalog, bottles);
    if (shape.ready === shape.total) return;
    const missing = (f.core || []).filter(p =>
      !L.pourAvailable(p, catalog, bottles));
    // One bottle short is worth acting on. Four short is a different flight.
    if (!missing.length || missing.length > 2) return;
    missing.forEach(p => {
      const kind = L.pourKind(p);
      out.push({
        kind: 'flight',
        name: L.pourLabel(p, catalog) || p.card || 'a missing pour',
        why: (missing.length === 1 ? 'The only thing standing between you and '
              : 'One of two pours missing from ')
             + L.sentenceCase(f.title) + '.',
        flight: f.title,
        // A sealed bottle you own costs nothing to open.
        owned: kind === 'shelf' && L.ownedCount(p.k, bottles) > 0,
        est: p.proof ? null : null,
        weight: missing.length === 1 ? 100 : 70
      });
    });
  });
  return out;
};

// Anything on the wishlist that no flight accounts for. You wanted it for
// a reason; the reason was recorded.
L.gapsFromWish = function (wish, flights) {
  const claimed = {};
  L.wishFromFlights(flights).forEach(w => { claimed[L.shopNorm(w.name)] = 1; });
  return (wish || [])
    .filter(w => !claimed[L.shopNorm(w.name)])
    .map(w => ({
      kind: 'wish', name: w.name,
      why: w.reason || 'On your wishlist since ' + w.added + '.',
      est: w.est || null, weight: 60
    }));
};

// A dimension too thin to build a flight on. One Lowland is a bottle; it is
// not a comparison, and a region flight needs at least three.
L.gapsFromThinness = function (catalog) {
  const out = [];
  const live = Object.values(catalog);
  const count = fn => {
    const c = {};
    live.forEach(p => { const v = fn(p); if (v) c[v] = (c[v] || 0) + 1; });
    return c;
  };

  const regions = count(p => p.sub === 'scotch' ? p.region : null);
  L.SCOTCH_REGIONS.forEach(r => {
    const n = regions[r] || 0;
    if (n >= 3) return;
    out.push({
      kind: 'region', name: 'A ' + r + ' Scotch',
      why: n === 0 ? 'Nothing from ' + r + ' at all.'
        : 'Only ' + n + ' from ' + r + ', so a region flight cannot use it.',
      weight: 55 - n * 5
    });
  });

  const subs = count(p => p.sub);
  Object.keys(subs).forEach(s => {
    const n = subs[s];
    if (n >= 3 || s === 'tequila' || s === 'flavored') return;
    out.push({
      kind: 'category', name: 'Another ' + L.titleCase(s),
      why: 'Only ' + n + ' on the shelf, which is too few to compare.',
      weight: 45 - n * 5
    });
  });
  return out;
};

// Where the proof ladder runs out. A flight climbing past 120 needs bottles
// up there to climb to.
L.gapsFromProof = function (catalog) {
  const live = Object.values(catalog);
  const band = f => live.filter(f).length;
  const out = [];
  const top = band(p => p.proof >= 120);
  const low = band(p => p.proof < 90);
  if (top < 12) {
    out.push({ kind: 'proof', name: 'Something above 120 proof',
      why: 'Only ' + top + ' bottles over 120, so a proof ladder runs out at '
        + 'the top.', weight: 40 });
  }
  if (low < 12) {
    out.push({ kind: 'proof', name: 'Something under 90 proof',
      why: 'Only ' + low + ' bottles under 90, so a ladder has nowhere to '
        + 'start.', weight: 35 });
  }
  return out;
};

// A matched pair is the strongest shape a flight can have: same distillery,
// same proof, differing in one perceptible way. Where a bottle sits alone at
// a proof its housemates share, the pair is one bottle away.
L.gapsFromPairs = function (catalog, bottles) {
  const byDist = {};
  Object.values(catalog).forEach(p => {
    if (!p.dist || !L.pourable(p.k, bottles)) return;
    (byDist[p.dist] = byDist[p.dist] || []).push(p);
  });
  const out = [];
  Object.keys(byDist).forEach(dist => {
    const set = byDist[dist];
    if (set.length < 2 || set.length > 12) return;
    // A house with several bottles but no two at the same strength cannot
    // hold the variable still.
    const proofs = {};
    set.forEach(p => {
      const k = Math.round(p.proof);
      proofs[k] = (proofs[k] || 0) + 1;
    });
    const hasPair = Object.keys(proofs).some(k => proofs[k] >= 2);
    if (hasPair || set.length < 3) return;
    out.push({
      kind: 'pair', name: 'A second ' + dist + ' at a proof you already have',
      why: set.length + ' from ' + dist + ' and no two at the same strength, '
        + 'so there is no matched pair to build on.',
      weight: 30
    });
  });
  return out;
};

// Everything, ranked. Something you already own but have not opened comes
// first: it costs nothing.
L.shelfGaps = function (catalog, bottles, flights, wish, history) {
  const all = []
    .concat(L.gapsFromFlights(flights, catalog, bottles))
    .concat(L.gapsFromWish(wish, flights))
    .concat(L.gapsFromHouses(catalog, bottles))
    .concat(L.gapsFromContrast(catalog, bottles))
    .concat(L.gapsFromThinness(catalog))
    .concat(L.gapsFromProof(catalog))
    .concat(L.gapsFromPairs(catalog, bottles));

  // Unlocking a flight is only worth much if flights get run. With 36
  // designed and none run, a bottle that completes one is a hypothesis;
  // a bottle that extends a house you have bought two dozen times is not.
  const runs = (history || []).filter(x => x.kind === 'flight').length;
  if (runs === 0) {
    all.forEach(g => { if (g.kind === 'flight') g.weight -= 45; });
  } else if (runs < 5) {
    all.forEach(g => { if (g.kind === 'flight') g.weight -= 20; });
  }

  all.forEach(g => { if (g.owned) g.weight += 50; });
  all.sort((a, b) => b.weight - a.weight || a.name.localeCompare(b.name));

  // One entry per bottle name: a bottle wanted by two flights is one thing
  // to buy, not two.
  const seen = {}, out = [];
  all.forEach(g => {
    const key = g.kind + '|' + L.shopNorm(g.name);
    if (seen[key]) return;
    seen[key] = 1;
    out.push(g);
  });
  return out;
};

/* --- the wishlist ----------------------------------------------------- */

// Why a bottle is on the list matters more than that it is. A name alone is
// a note to self; a name with "completes Who's Your Daddy?" is a decision
// you can act on in a shop.
L.wishAdd = function (list, entry) {
  const out = (list || []).slice();
  const key = L.shopNorm(entry.name || '');
  if (!key) return out;
  const at = out.findIndex(w => L.shopNorm(w.name) === key);
  const row = {
    name: (entry.name || '').trim(),
    reason: (entry.reason || '').trim() || null,
    forFlight: entry.forFlight || null,
    est: entry.est || null,
    added: entry.added || L.todayISO()
  };
  if (at >= 0) {
    // Already wanted. Keep the earlier date and the better reason.
    row.added = out[at].added;
    row.reason = row.reason || out[at].reason;
    row.forFlight = row.forFlight || out[at].forFlight;
    out[at] = row;
  } else {
    out.push(row);
  }
  return out;
};

L.wishRemove = function (list, name) {
  const key = L.shopNorm(name || '');
  return (list || []).filter(w => L.shopNorm(w.name) !== key);
};

L.onWishlist = function (list, name) {
  const key = L.shopNorm(name || '');
  return (list || []).some(w => L.shopNorm(w.name) === key);
};

// Every flight pour that is a wish, gathered so the wishlist can say which
// flights a bottle would unlock. One bottle can unlock more than one.
L.wishFromFlights = function (flights) {
  const by = {};
  (flights || []).forEach(f => {
    (f.core || []).forEach(p => {
      if (L.pourKind(p) !== 'wish') return;
      const key = L.shopNorm(p.name || '');
      if (!key) return;
      if (!by[key]) by[key] = { name: p.name, flights: [] };
      if (by[key].flights.indexOf(f.title) < 0) by[key].flights.push(f.title);
    });
  });
  return Object.values(by);
};

// A flight is short only when pours are MISSING, not when some of them are
// wishes — a six-pour flight with two wishes is a complete design you
// cannot run yet, which is a different thing from a broken one.
L.flightShape = function (f, catalog, bottles) {
  const core = f.core || [];
  const kinds = { shelf: 0, wish: 0, blend: 0 };
  let ready = 0;
  core.forEach(p => {
    kinds[L.pourKind(p)]++;
    if (L.pourAvailable(p, catalog, bottles)) ready++;
  });
  return {
    total: core.length, ready: ready,
    shelf: kinds.shelf, wish: kinds.wish, blend: kinds.blend,
    runnable: core.length >= 4 && ready === core.length
  };
};

/* --- flight design -------------------------------------------------- */

L.CORE_TARGET = 6;
L.EXT_TARGET = 4;

// Position a pour on the ladder by its real proof, not by its index, so
// three Cairdeas bottlings 0.4 apart visibly cluster.
L.ladderOffsets = function (proofs) {
  if (!proofs.length) return [];
  const lo = Math.min(...proofs), hi = Math.max(...proofs);
  const span = hi - lo;
  return proofs.map(p => span === 0 ? 0.5
    : Math.round(((p - lo) / span) * 10000) / 10000);
};

// Validate a flight instance against BZ's own build rules. Failing a check
// is a warning with a reason, never a block -- the proof rule has been
// deliberately overridden three times already.
L.validate = function (pours, catalog, opts) {
  const o = opts || {};
  const msgs = [];
  const prods = pours.map(p => catalog[p.k]).filter(Boolean);

  if (pours.length !== (o.coreTarget || L.CORE_TARGET)) {
    msgs.push({ level: 'warn', msg: pours.length + ' core pours, not ' +
      (o.coreTarget || L.CORE_TARGET) });
  }

  const proofs = prods.map(p => p.proof);
  let ascends = true;
  for (let i = 1; i < proofs.length; i++) if (proofs[i] < proofs[i - 1]) ascends = false;
  if (!ascends && !o.allowDescent) {
    msgs.push({ level: 'warn', msg: 'proof does not ascend — flag it or reorder' });
  }

  // "One obscure pour minimum" tests recognition, not price. The imported
  // rarity label would pass a Weller here, which is exactly backwards.
  const obscure = prods.filter(p => p.obsc === 'obscure').length;
  if (obscure < 1) msgs.push({ level: 'warn', msg: 'no obscure pour — every flight needs one' });
  else msgs.push({ level: 'ok', msg: obscure + ' obscure pour' + (obscure > 1 ? 's' : '') });

  const unpourable = prods.filter(p => !L.pourable(p.k, o.bottles || []));
  if (unpourable.length) {
    msgs.push({ level: 'warn', msg: unpourable.length + ' pour' +
      (unpourable.length > 1 ? 's are' : ' is') + ' not open: ' +
      unpourable.map(p => p.name.slice(0, 28)).join(', ') });
  }

  // Matched pairs are the strongest flight shape BZ has found: identical
  // proof, one perceptible difference.
  const pairs = [];
  for (let i = 0; i < prods.length; i++)
    for (let j = i + 1; j < prods.length; j++)
      if (Math.abs(prods[i].proof - prods[j].proof) <= 0.4) pairs.push([i, j]);
  if (pairs.length) {
    msgs.push({ level: 'ok', msg: pairs.length + ' matched pair' +
      (pairs.length > 1 ? 's' : '') + ' at proof' });
  }
  return msgs;
};

// How often a product has already been poured, across every flight and
// every recorded run. Overuse control: run two should not be run one with
// two bottles changed.
// Flights get the same treatment the shelf got: searchable, filterable by
// what state they are in and what they are made of, sortable.
L.FLIGHT_SORTS = [
  { id: 'curriculum', label: 'Curriculum order' },
  { id: 'title',      label: 'Name' },
  { id: 'ready',      label: 'Most ready' },
  { id: 'proof',      label: 'Lowest proof' },
  { id: 'run',        label: 'Recently run' }
];

// How much of a flight you could actually pour tonight.
L.flightReady = function (f, catalog, bottles) {
  const core = f.core || [];
  if (!core.length) return { open: 0, total: 0, pct: 0 };
  const open = core.filter(p => catalog[p.k] && L.pourable(p.k, bottles)).length;
  return { open: open, total: core.length,
           pct: Math.round((open / core.length) * 100) };
};

L.flightRunAt = function (f, history) {
  const runs = (history || []).filter(x => x.kind === 'flight' && x.flight === f.title);
  return runs.length ? runs.map(x => x.at).sort().slice(-1)[0] : null;
};

L.flightProof = function (f, catalog) {
  const ps = (f.core || []).map(p => catalog[p.k]).filter(Boolean).map(p => p.proof);
  return ps.length ? Math.min.apply(null, ps) : Infinity;
};

L.filterFlights = function (flights, catalog, bottles, history, opts) {
  const o = opts || {};
  const q = (o.q || '').toLowerCase().trim();
  const types = o.types && o.types.length ? o.types : null;
  return (flights || []).filter(f => {
    const ran = !!L.flightRunAt(f, history);
    if (o.state === 'run' && !ran) return false;
    if (o.state === 'todo' && ran) return false;
    if (o.state === 'ready' && L.flightReady(f, catalog, bottles).pct < 100) return false;
    if (types) {
      // A flight matches a type when any of its core pours is that type.
      const subs = (f.core || []).map(p => catalog[p.k]).filter(Boolean).map(p => p.sub);
      if (!types.some(t => subs.indexOf(t) >= 0)) return false;
    }
    if (q) {
      const hay = (f.title + ' ' + (f.tag || '') + ' ' + (f.premise || '') + ' '
        + (f.core || []).map(p => (catalog[p.k] || {}).name || p.card).join(' '))
        .toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
};

L.sortFlights = function (flights, catalog, bottles, history, id) {
  const a = (flights || []).slice();
  const name = (x, y) => x.title.localeCompare(y.title);
  const cmp = {
    curriculum: () => 0,
    title: name,
    ready: (x, y) => L.flightReady(y, catalog, bottles).pct
                   - L.flightReady(x, catalog, bottles).pct || name(x, y),
    proof: (x, y) => L.flightProof(x, catalog) - L.flightProof(y, catalog) || name(x, y),
    // Never run sorts last rather than first: an empty date is not the oldest.
    run: (x, y) => (L.flightRunAt(y, history) || '').localeCompare(
                    L.flightRunAt(x, history) || '') || name(x, y)
  };
  return id === 'curriculum' ? a : a.sort(cmp[id] || name);
};

L.useCount = function (key, flights, history) {
  let n = 0;
  (flights || []).forEach(f => f.core.forEach(p => { if (p.k === key) n++; }));
  (history || []).forEach(h => { if ((h.pours || []).includes(key)) n++; });
  return n;
};

L.overused = function (keys, flights, history, limit) {
  const cap = limit || 3;
  return keys.filter(k => L.useCount(k, flights, history) > cap);
};

/* --- snacks --------------------------------------------------------- */

// BZ's rule: simple bowls, not plates. No vinegar, no citrus -- both
// wreck the palate for the next pour. Suggestions follow the dominant
// cask, because that is what the snack has to sit beside.
L.SNACKS = {
  sherry: ['dark chocolate', 'dried cherries', 'salted pecans'],
  wine:   ['dark chocolate', 'dried figs', 'marcona almonds'],
  wood:   ['salted pecans', 'shortbread', 'toasted walnuts'],
  peat:   ['smoked almonds', 'aged cheddar', 'oatcakes'],
  plain:  ['plain crackers', 'salted almonds', 'shortbread']
};

L.snacksFor = function (prods) {
  const fin = prods.map(p => (p.fin || '')).join(' ').toLowerCase();
  const peated = prods.some(p => /laphroaig|ardbeg|lagavulin|octomore|peat|caol|bunnahabhain/i
    .test(p.name + ' ' + p.dist));
  if (peated) return L.SNACKS.peat;
  if (/ximenez|oloroso|sherry|fino|manzanilla|amontillado|cream/.test(fin)) return L.SNACKS.sherry;
  if (/port|madeira|moscatel|sauternes|bordeaux|rum|cognac|armagnac/.test(fin)) return L.SNACKS.wine;
  if (/oak|toasted|mizunara|amburana/.test(fin)) return L.SNACKS.wood;
  return L.SNACKS.plain;
};

/* --- SMS summary ---------------------------------------------------- */

// One identical text to everyone: the bottle list and the theme. Sent
// after the reveal, so it is the answer key people keep.
L.smsBody = function (flight, prods) {
  const lines = [flight.title, L.variableOf(flight)];
  prods.forEach((p, i) => {
    const letter = String.fromCharCode(65 + i);
    const bits = [p.name, p.fin, p.proof].filter(Boolean);
    lines.push(letter + ' \u00b7 ' + bits.join(', '));
  });
  lines.push('Snacks: ' + L.snacksFor(prods).join(', '));
  return lines.join('\n');
};

// The tag line carries "ONE VARIABLE: WHICH SHERRY" on most cards.
L.variableOf = function (flight) {
  const m = /ONE VARIABLE:\s*([^\u00b7]+)/i.exec(flight.tag || '');
  if (m) return 'One variable: ' + m[1].trim().toLowerCase();
  return (flight.tag || '').split('\u00b7').slice(-1)[0].trim();
};

/* =====================================================================
   STATE + RENDER
   ===================================================================== */
const S = { base: {}, catalog: {}, bottles: [], flights: [], history: [],
            edits: {}, custom: {}, deleted: {}, customFlights: [],
            filters: { status: 'open', types: [], obsc: [], regions: [], bands: [],
                        proofs: [], scars: [], cask: '', age: '',
                        showTypes: false, showStatus: false,
                        sort: 'name', showMore: false },
            refGroup: 'tasting', shop: {}, lookupUrl: '', wish: [],
            fflt: { state: 'all', types: [], sort: 'curriculum',
                    showState: false, showTypes: false },
            histTab: 'pour',
            reels: { proof: 'any', type: 'any', obsc: 'any', price: 'any' },
            held: {} };

// The effective catalog is the shipped reference data with the user's
// corrections layered on, their own bottles added, and their deletions
// hidden. Rebuilt whenever any of those three change.
function rebuildCatalog() {
  S.catalog = L.mergeCatalog(S.base, S.edits, S.custom, S.deleted);
}

const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };

const KEYS = ['history', 'edits', 'custom', 'deleted', 'customFlights',
              'bottles', 'lookupUrl', 'wish'];

// Private browsing and locked-down browsers throw on the first touch of
// localStorage. The app runs either way; it just cannot remember.
const CAN_STORE = (function () {
  try {
    localStorage.setItem('kb.probe', '1');
    localStorage.removeItem('kb.probe');
    return true;
  } catch (e) { return false; }
})();

function load() {
  if (!CAN_STORE) return;
  KEYS.forEach(k => {
    try {
      const raw = localStorage.getItem('kb.' + k);
      if (!raw) return;
      const val = JSON.parse(raw);
      // One corrupt key must not take the rest of the shelf down with it, and
      // a value of the wrong shape is corruption too.
      if (typeof S[k] !== typeof val
          || Array.isArray(S[k]) !== Array.isArray(val)) throw new Error('shape');
      S[k] = val;
    } catch (e) {
      console.warn('discarding unreadable ' + k, e);
      try { localStorage.removeItem('kb.' + k); } catch (e2) { /* nothing to do */ }
    }
  });
}

let _storageWarned = false;
function save_() {
  if (!CAN_STORE) {
    if (!_storageWarned && typeof toast === 'function') {
      _storageWarned = true;
      toast('This browser will not let the app save. Changes last until you close it.');
    }
    return;
  }
  try {
    KEYS.forEach(k => localStorage.setItem('kb.' + k, JSON.stringify(S[k])));
  } catch (e) {
    // Quota, almost always. Say so rather than failing silently, because the
    // user is about to lose an edit they think landed.
    if (typeof toast === 'function') toast('Could not save — storage is full.');
    console.warn('save failed', e);
  }
}

// Read order: your override, then the shared catalog. The UI shows which
// layer a value came from so you always know what you are trusting.
function prod(k) { return S.catalog[k] || null; }

function show(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  const t = document.getElementById('scr-' + name);
  if (t) t.classList.add('on');
  // Settings and Detail are reached from inside the app rather than the bar,
  // so no tab is marked current while they are open.
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.scr === name ? 'page' : 'false'));
  window.scrollTo(0, 0);
}

/* --- shelf ---------------------------------------------------------- */
const STATUS_FILTERS = [['open', 'Open'], ['sealed', 'Sealed'], ['all', 'All']];

function renderShelfFilters() {
  const counts = countOf('sub');
  const owned = k => Object.values(S.catalog).filter(p => {
    const n = L.ownedCount(p.k, S.bottles);
    if (!n) return false;
    const open = L.pourable(p.k, S.bottles);
    return k === 'all' || (k === 'open' ? open : !open);
  }).length;

  pickList({
    btnId: 'statusPick', listId: 'statusList', single: true,
    value: S.filters.status, allValue: 'open', allLabel: 'Open',
    open: S.filters.showStatus,
    options: STATUS_FILTERS.map(([v, label]) => [v, label, owned(v)]),
    onPick: v => { S.filters.status = v; S.filters.showStatus = false;
      renderShelfFilters(); renderShelf(); }
  });

  pickList({
    btnId: 'typePick', listId: 'typeList',
    value: S.filters.types, allLabel: 'All types', plural: 'types',
    open: S.filters.showTypes,
    options: Object.keys(counts)
      .sort((a, b) => counts[b] - counts[a] || a.localeCompare(b))
      .map(t => [t, L.titleCase(t), counts[t]]),
    onAll: () => { S.filters.types = []; renderShelfFilters(); renderShelf(); },
    onPick: t => {
      const i = S.filters.types.indexOf(t);
      if (i < 0) S.filters.types.push(t); else S.filters.types.splice(i, 1);
      renderShelfFilters(); renderShelf();
    }
  });

  const sel = $('#sortSel');
  if (!sel.options.length) {
    L.SORTS.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.label;
      sel.appendChild(o);
    });
    sel.onchange = () => { S.filters.sort = sel.value; renderShelf(); };
  }
  sel.value = S.filters.sort;

  const n = L.activeFacets(S.filters);
  const more = $('#moreBtn');
  more.textContent = n ? 'Filters \u00b7 ' + n : 'More filters';
  more.dataset.on = n > 0;
  renderMoreFilters();
}

// One pick-list control, reused wherever a row of chips was taller than the
// list it was filtering. opts.single makes it a one-of-many chooser.
function pickList(o) {
  const btn = document.getElementById(o.btnId);
  const box = document.getElementById(o.listId);
  const chosen = o.single ? [o.value] : o.value;
  const label = o.single
    ? (o.options.find(x => x[0] === o.value) || [null, o.allLabel])[1]
    : (!chosen.length ? o.allLabel
       : chosen.length === 1 ? (o.options.find(x => x[0] === chosen[0]) || [0, chosen[0]])[1]
       : chosen.length + ' ' + (o.plural || 'selected'));
  btn.textContent = label;
  btn.dataset.on = o.single ? (o.value !== o.allValue) : chosen.length > 0;
  btn.setAttribute('aria-expanded', !!o.open);

  box.hidden = !o.open;
  if (box.hidden) return;
  box.innerHTML = '';
  if (!o.single) {
    const all = el('button', 'pickrow' + (chosen.length ? '' : ' on'), o.allLabel);
    all.setAttribute('role', 'option');
    all.onclick = () => o.onAll();
    box.appendChild(all);
  }
  o.options.forEach(([v, text, n]) => {
    const on = o.single ? o.value === v : chosen.indexOf(v) >= 0;
    const r = el('button', 'pickrow' + (on ? ' on' : ''));
    r.setAttribute('role', 'option');
    r.setAttribute('aria-selected', on);
    r.appendChild(el('span', 'tick', on ? '\u2713' : ''));
    r.appendChild(el('span', 'lbl', text));
    r.appendChild(el('span', 'num', n === undefined || n === null ? '' : String(n)));
    r.onclick = () => o.onPick(v);
    box.appendChild(r);
  });
}

// Count the shelf by any field, so a chip can carry how many it would show.
function countOf(field) {
  const c = {};
  Object.values(S.catalog).forEach(p => {
    const v = p[field];
    if (v === null || v === undefined || v === '') return;
    c[v] = (c[v] || 0) + 1;
  });
  return c;
}

// One multi-select chip row. counts may be a map of value -> n, or a list of
// [value, label, n] when the value is not the label.
function facetChips(box, key, counts, opts) {
  const o = opts || {};
  box.innerHTML = '';
  const arr = Array.isArray(counts) ? counts
    : Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b))
        .map(v => [v, L.titleCase(v), counts[v]]);
  if (o.allLabel) {
    const all = el('button', 'chip', o.allLabel);
    all.setAttribute('aria-pressed', S.filters[key].length === 0);
    all.onclick = () => { S.filters[key] = []; renderShelfFilters(); renderShelf(); };
    box.appendChild(all);
  }
  arr.forEach(([v, label, n]) => {
    if (!n) return;
    const b = el('button', 'chip', label + ' ' + n);
    b.setAttribute('aria-pressed', S.filters[key].indexOf(v) >= 0);
    b.onclick = () => {
      const i = S.filters[key].indexOf(v);
      if (i < 0) S.filters[key].push(v); else S.filters[key].splice(i, 1);
      renderShelfFilters(); renderShelf();
    };
    box.appendChild(b);
  });
}

function renderMoreFilters() {
  const box = $('#moreFilters');
  box.hidden = !S.filters.showMore;
  $('#moreBtn').setAttribute('aria-expanded', !!S.filters.showMore);
  if (!S.filters.showMore) return;
  box.innerHTML = '';

  const section = (title, build) => {
    const f = el('div', 'facet');
    f.appendChild(el('div', 'fh', title));
    const row = el('div', 'scroller');
    build(row);
    f.appendChild(row);
    box.appendChild(f);
  };

  const all = Object.values(S.catalog);
  const tally = fn => {
    const c = {};
    all.forEach(p => { const v = fn(p); if (v) c[v] = (c[v] || 0) + 1; });
    return c;
  };

  section('Proof', row => facetChips(row, 'proofs',
    L.REELS[0].faces.filter(f => f.v !== 'any')
      .map(f => [f.v, f.t, all.filter(p => L.faceMatch('proof', f.v, p)).length])));
  section('Recognition', row => facetChips(row, 'obsc',
    ['known', 'niche', 'obscure'].map(v => [v, L.titleCase(v), tally(p => p.obsc)[v] || 0])));
  section('Occasion', row => facetChips(row, 'bands',
    ['everyday', 'good', 'special', 'vault']
      .map(v => [v, L.titleCase(v), tally(p => L.priceBand(p.msrp))[v] || 0])));
  section('Release', row => facetChips(row, 'scars',
    ['standard', 'batched', 'limited', 'exclusive']
      .map(v => [v, L.titleCase(v), tally(p => p.scar)[v] || 0])));
  const regions = tally(p => p.region);
  if (Object.keys(regions).length) {
    section('Scotch region', row => facetChips(row, 'regions',
      L.SCOTCH_REGIONS.map(v => [v, v, regions[v] || 0])));
  }

  // Cask and age are one-of-three, not multi-select: wine and wood-only are
  // mutually exclusive by definition.
  section('Cask', row => {
    [['', 'Any'], ['wine', 'Wine cask'], ['wood', 'Wood only'], ['none', 'No finish']]
      .forEach(([v, label]) => {
        const b = el('button', 'chip', label);
        b.setAttribute('aria-pressed', (S.filters.cask || '') === v);
        b.onclick = () => { S.filters.cask = v; renderShelfFilters(); renderShelf(); };
        row.appendChild(b);
      });
  });
  section('Age', row => {
    [['', 'Any'], ['stated', 'Age stated'], ['nas', 'No age stated']]
      .forEach(([v, label]) => {
        const b = el('button', 'chip', label);
        b.setAttribute('aria-pressed', (S.filters.age || '') === v);
        b.onclick = () => { S.filters.age = v; renderShelfFilters(); renderShelf(); };
        row.appendChild(b);
      });
  });

  const cr = el('div', 'clearrow');
  cr.appendChild(el('span', null, L.activeFacets(S.filters) + ' filters on'));
  const clear = el('button', 'chip', 'Clear all');
  clear.onclick = () => {
    ['types', 'obsc', 'regions', 'bands', 'proofs', 'scars']
      .forEach(k => { S.filters[k] = []; });
    S.filters.cask = ''; S.filters.age = '';
    renderShelfFilters(); renderShelf();
  };
  cr.appendChild(clear);
  box.appendChild(cr);
}

function shelfRows() {
  const all = Object.keys(S.catalog).map(prod).filter(Boolean);
  const opts = Object.assign({}, S.filters, { q: $('#q').value });
  const hits = L.shelfSort(L.shelfFilter(all, S.bottles, opts), S.filters.sort);
  return hits.map(p => ({ p, open: L.pourable(p.k, S.bottles),
                          owned: L.ownedCount(p.k, S.bottles) }));
}

function renderShelf() {
  const list = $('#shelfList'); list.innerHTML = '';
  const rows = shelfRows();
  $('#shelfCount').textContent = rows.length + ' of ' + Object.keys(S.catalog).length;
  if (!rows.length) {
    const n = L.activeFacets(S.filters);
    list.appendChild(el('div', 'empty', n
      ? 'Nothing matches those ' + n + ' filters.'
      : 'Nothing matches. Clear the search or switch to All.'));
    return;
  }
  rows.forEach(({ p, open, owned }) => {
    const b = el('button', 'item ' + typeClass(p) + (open ? '' : ' sealed'));
    const left = el('div');
    const nm = el('div', 'nm'); nm.innerHTML = '<span class="dot"></span>';
    nm.appendChild(document.createTextNode(p.name));
    left.appendChild(nm);
    left.appendChild(el('div', 'sub',
      [p.dist, owned > 1 ? owned + ' bottles' : null].filter(Boolean).join(' \u00b7 ')));
    b.appendChild(left);
    b.appendChild(el('div', 'ty', L.titleCase(p.style || p.sub)));
    b.appendChild(el('div', 'pf', p.proof));
    b.onclick = () => showBottle(p.k);
    list.appendChild(b);
  });
}

/* --- bottle detail -------------------------------------------------- */
// The detail action row, cleared back to just Back. Whichever screen is
// opening then adds its own buttons to it.
function detailActs() {
  const row = $('#detailActs');
  while (row.children.length > 1) row.removeChild(row.lastChild);
  return row;
}

function showBottle(k) {
  S.lastList = 'shelf';
  const p = prod(k);
  const body = $('#detailBody'); body.innerHTML = '';

  // Actions go on the row that already holds Back, so the whole header is
  // one line rather than a button stranded above a row of buttons.
  const acts = detailActs();
  const editBtn = el('button', 'btn btn-sm btn-gold', 'Edit');
  editBtn.onclick = () => productForm(p);
  acts.appendChild(editBtn);
  const notesBtn = el('button', 'btn btn-sm', 'Tasting notes');
  notesBtn.onclick = () => tastingNoteForm(p);
  acts.appendChild(notesBtn);
  const spareBtn = el('button', 'btn btn-sm', '+ Another bottle');
  spareBtn.onclick = () => askStatus(p.name, st => {
    S.bottles.push({ id: L.nextBottleId(S.bottles), k: k, status: st, paid: null });
    save_(); showBottle(k); renderShelf(); renderHome();
    toast(st === 'sealed' ? 'Sealed spare added' : 'Second bottle added, open');
  });
  acts.appendChild(spareBtn);
  const delBtn = el('button', 'btn btn-sm ghost danger', 'Delete');
  delBtn.onclick = () => {
    if (!L.canDeleteProduct(k, S.bottles)) { toast('Retire its bottles first'); return; }
    confirmDelete(p.name, () => {
      S.deleted[k] = true; delete S.custom[k]; delete S.edits[k];
      S.bottles = S.bottles.filter(b => b.k !== k);
      save_(); rebuildCatalog(); renderShelf(); renderPayline(); renderHome();
      show('shelf'); toast('Removed');
    });
  };
  acts.appendChild(delBtn);
  const h = el('div', 'sheet');
  const t = el('h2'); t.style.fontSize = '21px'; t.style.color = 'var(--ink-deep)';
  t.textContent = p.name; h.appendChild(t);

  const dl = el('dl', 'kv');
  const add = (k2, v, cls) => {
    if (v === null || v === undefined || v === '') return;
    dl.appendChild(el('dt', null, k2));
    const dd = el('dd', cls); dd.textContent = v; dl.appendChild(dd);
  };
  add('Distillery', p.dist);
  add('Style', [p.sub, p.style].filter(Boolean)
    .map(L.titleCase).join(' \u00b7 '));
  add('Proof', p.proof);
  add('Age', p.age ? p.age + ' years' : 'No age stated');
  h.appendChild(dl);

  if (p.fin) {
    const f = el('div'); f.style.marginTop = '10px';
    p.fin.split('+').forEach(part => {
      f.appendChild(el('span', 'tag ' + (p.wine ? 'wine' : 'wood'),
        L.titleCase(part)));
    });
    const src = el('div', 'src', p.finc === 'stated' ? 'confirmed from the producer'
      : p.finc === 'from_cards' ? 'from your flight cards' : 'read from the label');
    f.appendChild(src);
    h.appendChild(f);
  }

  const dl2 = el('dl', 'kv'); dl2.style.marginTop = '10px';
  const add2 = (a, b2) => { if (b2 === null || b2 === undefined || b2 === '') return;
    dl2.appendChild(el('dt', null, a)); dl2.appendChild(el('dd', null, b2)); };
  add2('Region', L.titleCase(p.region));
  add2('Recognition', L.titleCase(p.obsc));
  add2('Release', L.titleCase(p.scar));
  add2('Ohio retail', L.titleCase(p.alloc));
  const prem = L.premium(p.msrp, p.sec);
  add2(prem && prem < 1 ? 'Secondary' : 'Premium', L.premiumText(prem));
  add2('MSRP', p.msrp ? '$' + p.msrp : null);
  h.appendChild(dl2);
  body.appendChild(h);

  const mine = S.bottles.filter(b => b.k === k);
  const bs = el('div', 'sheet');
  bs.appendChild(el('h3', null, mine.length > 1 ? mine.length + ' bottles' : 'Your bottle'));
  mine.forEach(b => {
    const r = el('div'); r.style.cssText =
      'display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line)';
    r.appendChild(el('span', null, b.id + ' \u00b7 ' + L.titleCase(b.status)));
    const btn = el('button', 'chip', b.status === 'sealed' ? 'Open it' : 'Retire');
    btn.onclick = () => b.status === 'sealed' ? openBottle(b, k) : retireBottle(b, k);
    r.appendChild(btn);
    bs.appendChild(r);
  });
  body.appendChild(bs);

  // The distiller's notes first: colour, nose, palate, finish.
  const tn = L.tastingNotes(p);
  if (tn.length) {
    const tb = el('div', 'sheet');
    tb.appendChild(el('h3', null, 'Tasting notes'));
    const dl3 = el('dl', 'kv tn');
    tn.forEach(n2 => {
      dl3.appendChild(el('dt', null, n2.label));
      dl3.appendChild(el('dd', null, n2.text));
    });
    tb.appendChild(dl3);
    const srcLine = L.tnSource(p);
    if (srcLine) tb.appendChild(el('div', 'src', srcLine));
    body.appendChild(tb);
  }

  // Add or correct the four columns yourself. Anything you write is marked
  // as yours, so it never passes for a note off a card.
  const tnEdit = el('button', 'chip', tn.length ? 'Edit tasting notes' : 'Add tasting notes');
  tnEdit.style.marginTop = '9px';
  tnEdit.onclick = () => tastingNoteForm(p);
  if (tn.length) {
    body.lastChild.appendChild(tnEdit);
  } else {
    const nb0 = el('div', 'sheet');
    nb0.appendChild(el('h3', null, 'Tasting notes'));
    nb0.appendChild(el('div', 'sub',
      'Nothing recorded. Add colour, nose, palate and finish as you pour it.'));
    nb0.appendChild(tnEdit);
    body.appendChild(nb0);
  }

  // Then what every source knows, and what you have written.
  const notes = L.notesFor(p, allFlights(), (S.edits[k] || {}).userNote);
  const nb = el('div', 'sheet');
  nb.appendChild(el('h3', null, 'Notes'));
  if (!notes.length) {
    nb.appendChild(el('div', 'sub', 'Nothing recorded yet.'));
  } else {
    notes.forEach(n => {
      const row = el('div', 'note');
      row.appendChild(el('div', 'nsrc', n.src));
      row.appendChild(el('div', null, n.text));
      nb.appendChild(row);
    });
  }
  const ta = document.createElement('textarea');
  ta.className = 'field'; ta.rows = 3;
  ta.placeholder = 'Your own note \u2014 how it drank, who liked it, what it sat next to';
  ta.value = (S.edits[k] || {}).userNote || '';
  ta.style.marginTop = '9px';
  nb.appendChild(ta);
  const saveNote = el('button', 'chip', 'Save note');
  saveNote.style.marginTop = '7px';
  saveNote.onclick = () => {
    const v = ta.value.trim();
    S.edits[k] = Object.assign({}, S.edits[k], { userNote: v || null });
    save_(); rebuildCatalog(); showBottle(k); toast(v ? 'Note saved' : 'Note cleared');
  };
  nb.appendChild(saveNote);
  body.appendChild(nb);

  const used = L.useCount(k, S.flights, S.history);
  if (used) {
    const u = el('div', 'sheet');
    u.appendChild(el('h3', null, 'In the curriculum'));
    const fl = S.flights.filter(f => f.core.some(x => x.k === k) || f.ext.some(x => x.k === k));
    fl.forEach(f => {
      const isCore = f.core.some(x => x.k === k);
      const b2 = el('button', 'chip',
        L.sentenceCase(f.title) + (isCore ? '' : ' (bench)'));
      b2.style.marginRight = '5px';
      b2.onclick = () => showFlight(f);
      u.appendChild(b2);
    });
    body.appendChild(u);
  }
  show('detail');
}

function openBottle(b, k) { b.status = 'open'; showBottle(k); renderShelf(); }

function retireBottle(b, k) {
  const body = $('#detailBody');
  const box = el('div', 'sheet');
  box.appendChild(el('h3', null, 'Why is it leaving?'));
  const row = el('div', 'row'); row.style.marginTop = '8px';
  L.EXITS.forEach(reason => {
    const c = el('button', 'chip', L.titleCase(reason));
    c.onclick = () => {
      b.status = 'gone'; b.exit = reason; b.exitDate = new Date().toISOString().slice(0, 10);
      // A drain pour is the strongest opinion available. Record it so the
      // bottle never resurfaces as a flight candidate.
      if (L.isDrain(reason)) { S.edits[k] = Object.assign({}, S.edits[k], { drained: true }); }
      save_(); showBottle(k); renderShelf();
    };
    row.appendChild(c);
  });
  box.appendChild(row);
  body.insertBefore(box, body.firstChild);
  window.scrollTo(0, 0);
}

/* --- Time for a Taste: the machine ----------------------------------- */

// A Glencairn, filled to a level. The fill is the type colour, so a payout
// line reads as three different whiskies at a glance.
function glassSvg(fill, level) {
  const y = 46 - (level * 16);
  return '<svg viewBox="0 0 44 62" aria-hidden="true">'
    + '<defs><clipPath id="cg"><path d="M11 6 h22 l-2.5 20 a9 9 0 0 1-17 0 Z"/></clipPath></defs>'
    + '<rect x="0" y="' + y + '" width="44" height="30" fill="' + fill
    + '" clip-path="url(#cg)" opacity=".85"/>'
    + '<path d="M11 6 h22 l-2.5 20 a9 9 0 0 1-17 0 Z" fill="none" stroke="currentColor" '
    + 'stroke-width="1.6" stroke-linejoin="round"/>'
    + '<path d="M19.5 34 h5 l1 8 h-7 Z" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '<ellipse cx="22" cy="45" rx="9" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '<path d="M13 45 v3 a9 3.2 0 0 0 18 0 v-3" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '</svg>';
}

// Colour groups the categories by family: American grain, malt, and the
// rest of the world. Nine subcategories, six liquid colours.
const TYPE_CLASS = {
  'bourbon': 't-bourbon', 'tennessee': 't-bourbon',
  'rye': 't-rye', 'wheat': 't-rye', 'flavored': 't-rye',
  'scotch': 't-scotch',
  'irish': 't-irish',
  'american single malt': 't-malt', 'japanese': 't-malt',
  'canadian': 't-other', 'world': 't-other', 'tequila': 't-other'
};
function typeClass(p) {
  return TYPE_CLASS[(p.sub || '').toLowerCase()] || 't-other';
}
const TYPE_HEX = { 't-bourbon': '#B4762B', 't-scotch': '#5C6B63', 't-irish': '#8C8034',
                   't-rye': '#9C4A22', 't-malt': '#7A6142', 't-other': '#6B3550' };

function faceText(reelId, v) {
  const reel = L.REELS.find(r => r.id === reelId);
  const f = reel.faces.find(x => x.v === v);
  return f ? f.t : 'any';
}

function renderReels() {
  const held = L.REELS.filter(r => S.held[r.id]).length;
  const hint = $('#holdHint');
  if (hint) {
    hint.textContent = !held ? 'Tap a reel to hold it'
      : held + (held === 1 ? ' reel held \u2014 tap it again to release'
                           : ' reels held \u2014 tap to release');
  }
  const box = $('#reels'); box.innerHTML = '';
  L.REELS.forEach(reel => {
    const d = el('button', 'reel');
    d.type = 'button';
    d.dataset.reel = reel.id;
    d.dataset.held = !!S.held[reel.id];
    d.setAttribute('aria-pressed', !!S.held[reel.id]);
    d.appendChild(el('div', 'rl', reel.label));
    d.appendChild(el('div', 'rv', faceText(reel.id, S.reels[reel.id])));
    d.appendChild(el('div', 'hold', 'HELD'));
    d.onclick = () => {
      S.held[reel.id] = !S.held[reel.id];
      renderReels();
    };
    box.appendChild(d);
  });
}

function doSpin() {
  const next = L.spinValid(S.reels, S.held, S.catalog, S.bottles, Math.random);
  if (!next) {
    // The holds themselves rule out everything open. Say which, rather than
    // spinning to an empty payline.
    const heldNames = L.REELS.filter(r => S.held[r.id])
      .map(r => r.label + ' ' + faceText(r.id, S.reels[r.id]));
    toast('Nothing open matches ' + heldNames.join(' and ') + '. Release a hold.');
    return;
  }
  S.reels = next;
  document.querySelectorAll('.reel').forEach(d => {
    if (S.held[d.dataset.reel]) return;
    d.classList.remove('spinning');
    void d.offsetWidth;                 // restart the animation
    d.classList.add('spinning');
  });
  renderReels();
  renderPayline();
}

function renderPayline() {
  const box = $('#payline'); box.innerHTML = '';
  const msg = $('#payMsg');
  const hits = L.pourGlasses(S.catalog, S.bottles, S.reels, S.history);
  const total = L.reelMatches(S.catalog, S.bottles, S.reels, S.history).length;

  for (let i = 0; i < L.GLASSES; i++) {
    const hit = hits[i];
    const g = el('button', 'glass' + (hit ? '' : ' empty'));
    g.type = 'button';
    if (!hit) {
      g.disabled = true;
      g.innerHTML = glassSvg('none', 0);
      g.style.color = 'rgba(237,228,210,.30)';
      g.appendChild(el('div', 'gn', '\u2014'));
      box.appendChild(g);
      continue;
    }
    const p = prod(hit.k);
    const cls = typeClass(p);
    g.innerHTML = glassSvg(TYPE_HEX[cls], 1);
    g.style.color = '#EDE4D2';
    g.appendChild(el('div', 'gn', p.name));
    g.appendChild(el('div', 'gp', String(p.proof)));
    g.onclick = () => showPourChoice(p);
    box.appendChild(g);
  }

  if (!total) {
    msg.style.display = '';
    msg.textContent = 'Spin to pour something.';
  } else if (total > L.GLASSES) {
    msg.style.display = '';
    msg.textContent = total + ' bottles line up \u2014 showing the top three.';
  } else {
    msg.style.display = 'none';
  }
}

/* --- the map ---------------------------------------------------------- */

const REGION_HEX = { 'Islay': '#5C6B63', 'Speyside': '#B4762B', 'Highland': '#7A6142',
                     'Islands': '#3E6274', 'Lowland': '#8C8034', 'Campbeltown': '#9C4A22' };
const M = { full: null, view: null, pins: [], region: null, detail: null };

function ptStr(ring) {
  let s = '';
  for (let i = 0; i < ring.length; i++) {
    const p = L.project(ring[i][0], ring[i][1]);
    s += (i ? 'L' : 'M') + p[0].toFixed(4) + ' ' + p[1].toFixed(4);
  }
  return s + 'Z';
}

function applyView() {
  const v = M.view;
  $('#map').setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h);
  const z = M.full.w / v.w;

  // Crossing a detail threshold means new geometry; anything else is just a
  // new window on what is already drawn, so the pinch stays cheap.
  if (M.detail !== null && L.detailKey(z) !== M.detail) { renderMap(); return; }

  document.querySelectorAll('#map .pin').forEach(g => {
    const inRegion = !M.region || g.dataset.region === M.region;
    g.classList.toggle('dim', !inRegion);
    const c = g.querySelector('circle');
    // Divide by the zoom, not its square root: a pin holds a constant size on
    // screen. Shrinking slower than the view means pins GROW as you zoom in,
    // so a cluster could never come apart however far you pushed.
    const r = L.pinRadius(+g.dataset.n, M.full.w, +g.dataset.max || 1) / z;
    if (c) c.setAttribute('r', r.toFixed(6));

    const t = g.querySelector('text');
    if (t) {
      // A name needs room around its dot before it is worth showing.
      t.style.display = (z >= 2 && inRegion) ? '' : 'none';
      t.setAttribute('font-size', (L.mapFont(M.full.w, 'name') / z).toFixed(6));
      // Sit the name clear of the dot rather than a fixed distance above it.
      t.setAttribute('y', (+t.dataset.y - r * 1.25).toFixed(6));
    }
    const cnt = g.querySelector('.cnt');
    if (cnt) {
      const size = L.mapFont(M.full.w, 'count') / z;
      // Only when the digits fit inside the dot; a number spilling over its
      // own pin is worse than no number.
      const fits = r > size * 0.62 * String(g.dataset.n).length;
      cnt.style.display = (fits && inRegion) ? '' : 'none';
      cnt.setAttribute('font-size', size.toFixed(6));
    }
  });
}

// One surface. Everything that belongs at this zoom is drawn into it, and
// the geometry is rebuilt only when the detail set changes.
function svgEl(n) { return document.createElementNS('http://www.w3.org/2000/svg', n); }

function renderPlaceChips() {
  const box = $('#mapLayers'); box.innerHTML = '';
  L.MAP_PLACES.forEach(pl => {
    const b = el('button', 'chip', pl.label);
    b.onclick = () => {
      M.view = L.viewFor(pl, M.full);
      M.detail = null;                 // force the geometry to catch up
      renderMap();
      $('#mapPick').innerHTML = '';
    };
    box.appendChild(b);
  });
}

function renderMap() {
  const svg = $('#map');
  M.full = L.mapExtent(MAPDATA.world, 3);
  if (!M.view) M.view = Object.assign({}, M.full);
  renderPlaceChips();

  const z = M.full.w / M.view.w;
  const d = L.detailAt(z);
  M.detail = L.detailKey(z);
  svg.innerHTML = '';

  // Land. The detailed Scottish coastline is drawn over the world outline
  // once it is on, so the two simplifications never argue at the seam.
  const land = svgEl('path');
  land.setAttribute('class', 'land');
  land.setAttribute('d', MAPDATA.world.map(ptStr).join(' '));
  svg.appendChild(land);

  if (d.states) {
    const byState = L.stateCounts(S.catalog, MAPDATA.stateOf, S.bottles);
    Object.keys(MAPDATA.states).forEach(name => {
      const e = byState[name];
      const p = svgEl('path');
      p.setAttribute('class', 'state s' + L.choroStep(e ? e.total : 0));
      p.setAttribute('d', MAPDATA.states[name].map(ptStr).join(' '));
      if (e) p.onclick = ev => { ev.stopPropagation(); showKeyList(name, e.keys, e.open); };
      svg.appendChild(p);
    });
  }

  if (d.coast) {
    const c = svgEl('path');
    c.setAttribute('class', 'land coastline');
    c.setAttribute('d', MAPDATA.coast.map(ptStr).join(' '));
    svg.appendChild(c);
  }

  M.pins = [];
  if (d.countries) {
    const counts = L.countryCounts(S.catalog, MAPDATA.subCountry,
      MAPDATA.worldDist, S.bottles);
    const maxN = counts.reduce((m, c) => Math.max(m, c.total), 1);
    counts.forEach(c => {
      const pos = MAPDATA.countryPos[c.name];
      if (!pos) return;
      addPin(svg, L.project(pos[0], pos[1]), c.total, c.name, '#8A6A28', maxN,
        () => showKeyList(c.name, c.keys, c.open));
    });
  }

  if (d.usPins) {
    const us = L.mapPins(S.catalog, MAPDATA.usDistilleries || {}, S.bottles, L.US_SUBS)
      .filter(p => L.inView(p.lon, p.lat, M.view));
    const maxN = us.reduce((m, p) => Math.max(m, p.total), 1);
    us.forEach(pin => {
      M.pins.push(pin);
      addPin(svg, L.project(pin.lon, pin.lat), pin.total, shortName(pin.dist),
        '#7A3B1E', maxN, () => showPinBottles(pin));
    });
  }

  if (d.scotPins) {
    const sc = L.mapPins(S.catalog, MAPDATA.distilleries, S.bottles, ['scotch'])
      .filter(p => L.inView(p.lon, p.lat, M.view));
    const maxN = sc.reduce((m, p) => Math.max(m, p.total), 1);
    sc.forEach(pin => {
      M.pins.push(pin);
      addPin(svg, L.project(pin.lon, pin.lat), pin.total, shortName(pin.dist),
        REGION_HEX[pin.region] || '#6B3550', maxN, () => showPinBottles(pin));
    });
  }

  if (d.iePins) {
    const ie = L.mapPins(S.catalog, MAPDATA.ieDistilleries || {}, S.bottles, ['irish'])
      .filter(p => L.inView(p.lon, p.lat, M.view));
    const maxN = ie.reduce((m, p) => Math.max(m, p.total), 1);
    ie.forEach(pin => {
      M.pins.push(pin);
      addPin(svg, L.project(pin.lon, pin.lat), pin.total, shortName(pin.dist),
        '#8C8034', maxN, () => showPinBottles(pin));
    });
  }

  updateCount(z, d);
  applyView();
}

function shortName(s) {
  return String(s).replace(/ Distiller(y|ies)$/, '')
    .replace(/ (Company|Distilling|Spirits|Whiskey)$/, '').replace(/^The /, '');
}

function addPin(svg, xy, n, label, fill, maxN, onTap) {
  const g = svgEl('g');
  g.setAttribute('class', 'pin');
  g.dataset.n = n; g.dataset.max = maxN; g.dataset.region = '';
  const c = svgEl('circle');
  c.setAttribute('cx', xy[0]); c.setAttribute('cy', xy[1]);
  c.setAttribute('fill', fill);
  g.appendChild(c);
  const t = svgEl('text');
  t.setAttribute('x', xy[0]); t.setAttribute('y', xy[1]);
  t.dataset.y = xy[1];
  t.setAttribute('text-anchor', 'middle');
  t.textContent = label;
  g.appendChild(t);
  const num = svgEl('text');
  num.setAttribute('class', 'cnt');
  num.setAttribute('x', xy[0]); num.setAttribute('y', xy[1]);
  num.setAttribute('text-anchor', 'middle');
  num.setAttribute('dominant-baseline', 'central');
  num.textContent = n;
  g.appendChild(num);
  g.onclick = e => { e.stopPropagation(); onTap(); };
  svg.appendChild(g);
}

function updateCount(z, d) {
  const total = Object.keys(S.catalog).length;
  let txt = total + ' whiskies';
  if (M.pins.length) {
    const bottles = M.pins.reduce((n, p) => n + p.total, 0);

// Pan and pinch. Pointer events cover mouse, touch and pen in one path.
function wireMap() {
  const svg = $('#map');
  const active = new Map();
  let last = null, startDist = 0, startView = null;

  const toMap = e => {
    const r = svg.getBoundingClientRect();
    return [M.view.x + ((e.clientX - r.left) / r.width) * M.view.w,
            M.view.y + ((e.clientY - r.top) / r.height) * M.view.h];
  };

  svg.addEventListener('pointerdown', e => {
    svg.setPointerCapture(e.pointerId);
    active.set(e.pointerId, e);
    if (active.size === 1) { last = toMap(e); svg.classList.add('drag'); }
    else if (active.size === 2) {
      const [a, b] = [...active.values()];
      startDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      startView = Object.assign({}, M.view);
    }
  });

  svg.addEventListener('pointermove', e => {
    if (!active.has(e.pointerId)) return;
    active.set(e.pointerId, e);
    if (active.size === 2 && startDist) {
      const [a, b] = [...active.values()];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const r = svg.getBoundingClientRect();
      const cx = startView.x + (((a.clientX + b.clientX) / 2 - r.left) / r.width) * startView.w;
      const cy = startView.y + (((a.clientY + b.clientY) / 2 - r.top) / r.height) * startView.h;
      M.view = L.zoomAbout(startView, M.full, d / startDist, cx, cy);
      applyView();
      return;
    }
    if (active.size === 1 && last) {
      const p = toMap(e);
      M.view = L.clampView({ x: M.view.x - (p[0] - last[0]), y: M.view.y - (p[1] - last[1]),
                             w: M.view.w, h: M.view.h }, M.full);
      applyView();
    }
  });

  const up = e => {
    active.delete(e.pointerId);
    if (active.size < 2) startDist = 0;
    if (!active.size) {
      last = null;
      svg.classList.remove('drag');
      // Pins are culled to the window, so the end of a pan is when the set
      // that should be on screen has changed.
      const z = M.full.w / M.view.w;
      if (L.detailAt(z).usPins) renderMap();
    }
  };
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', up);

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const p = toMap(e);
    M.view = L.zoomAbout(M.view, M.full, e.deltaY < 0 ? 1.22 : 1 / 1.22,
      p[0], p[1]);
    applyView();
  }, { passive: false });

  const step = f => {
    M.view = L.zoomAbout(M.view, M.full, f,
      M.view.x + M.view.w / 2, M.view.y + M.view.h / 2);
    applyView();
  };
  $('#zIn').onclick = () => step(1.6);
  $('#zOut').onclick = () => step(1 / 1.6);
  $('#zRe').onclick = () => {
    M.region = null; M.view = Object.assign({}, M.full); M.detail = null;
    renderMap(); $('#mapPick').innerHTML = '';
  };
}

// A bar is a question you can follow: tapping one lists the bottles behind
// it, and tapping one of those opens it. match(label) says which bottles a
// bar stands for.
function barBlock(title, rows, opts) {
  const o = opts || {};
  const s = el('div', 'sheet');
  s.appendChild(el('h3', null, title));
  const b = el('div', 'bars');
  b.style.marginTop = '8px';
  rows.forEach(r => {
    const row = el(o.match ? 'button' : 'div',
      'bar' + (o.cls ? ' ' + o.cls(r) : '') + (o.match ? ' tappable' : ''));
    row.appendChild(el('div', 't', r.label));
    const track = el('div', 'track');

    fill.style.width = r.pct + '%';
