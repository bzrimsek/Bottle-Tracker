      // bottle stays open on undo, which is right: you have opened it.
      pourNow(k, { after: after });
    };
    m.appendChild(yes);
    const just = el('button', 'btn ghost wide', 'Just open it');
    just.onclick = () => {
      sealed[0].status = 'open';
      save_();
      closeModal();
      toast('Opened');
      if (after) after();
    };
    m.appendChild(just);
    const no = el('button', 'btn ghost wide', 'Cancel');
    no.onclick = closeModal;
    m.appendChild(no);
  });
}

function retireBottle(b, k) {
  const body = $('#detailBody');
  const box = el('div', 'sheet');
  box.appendChild(el('h3', null, 'Why is it leaving?'));
  const row = el('div', 'row'); row.style.marginTop = '8px';
  L.EXITS.forEach(reason => {
    const c = el('button', 'chip', L.titleCase(reason));
    c.onclick = () => {
      b.status = 'gone'; b.exit = reason; b.exitDate = new Date().toISOString().slice(0, 10);
      // A drain pour is the strongest opinion available. Record it so the
      // bottle never resurfaces as a flight candidate.
      if (L.isDrain(reason)) { S.edits[k] = Object.assign({}, S.edits[k], { drained: true }); }
      save_(); showBottle(k); renderShelf();
    };
    row.appendChild(c);
  });
  box.appendChild(row);
  body.insertBefore(box, body.firstChild);
  window.scrollTo(0, 0);
}

/* --- Time for a Taste: the machine ----------------------------------- */

// A Glencairn, filled to a level. The fill is the type colour, so a payout
// line reads as three different whiskies at a glance.
function glassSvg(fill, level) {
  const y = 46 - (level * 16);
  return '<svg viewBox="0 0 44 62" aria-hidden="true">'
    + '<defs><clipPath id="cg"><path d="M11 6 h22 l-2.5 20 a9 9 0 0 1-17 0 Z"/></clipPath></defs>'
    + '<rect x="0" y="' + y + '" width="44" height="30" fill="' + fill
    + '" clip-path="url(#cg)" opacity=".85"/>'
    + '<path d="M11 6 h22 l-2.5 20 a9 9 0 0 1-17 0 Z" fill="none" stroke="currentColor" '
    + 'stroke-width="1.6" stroke-linejoin="round"/>'
    + '<path d="M19.5 34 h5 l1 8 h-7 Z" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '<ellipse cx="22" cy="45" rx="9" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '<path d="M13 45 v3 a9 3.2 0 0 0 18 0 v-3" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '</svg>';
}

// Colour groups the categories by family: American grain, malt, and the
// rest of the world. Nine subcategories, six liquid colours.
const TYPE_CLASS = {
  'bourbon': 't-bourbon', 'tennessee': 't-bourbon',
  'rye': 't-rye', 'wheat': 't-rye', 'flavored': 't-rye',
  'scotch': 't-scotch',
  'irish': 't-irish',
  'american single malt': 't-malt', 'japanese': 't-malt',
  'canadian': 't-other', 'world': 't-other', 'tequila': 't-other'
};
function typeClass(p) {
  return TYPE_CLASS[(p.sub || '').toLowerCase()] || 't-other';
}
const TYPE_HEX = { 't-bourbon': '#B4762B', 't-scotch': '#5C6B63', 't-irish': '#8C8034',
                   't-rye': '#9C4A22', 't-malt': '#7A6142', 't-other': '#6B3550' };

function faceText(reelId, v) {
  const reel = L.REELS.find(r => r.id === reelId);
  const f = reel.faces.find(x => x.v === v);
  return f ? f.t : 'any';
}

// Find me a match. Only offered when somebody has actually shared a shelf,
// because an option that can never do anything is worse than no option.
function renderMatchRow() {
  const row = document.getElementById('matchRow');
  if (!row) return;
  const n = Object.keys(SHARED.shelves).length;
  row.hidden = !n;
  if (!n) return;
  row.innerHTML = '';
  const names = Object.keys(SHARED.shelves)
    .map(u => SHARED.names[u] || 'a buddy');
  [['', 'Anything I have open'],
   ['any', n === 1 ? 'Also open for ' + names[0] : 'Open for any of them'],
   ['all', n === 1 ? null : 'Open for all ' + (n + 1) + ' of us']]
    .forEach(([v, label]) => {
      if (!label) return;
      const b = el('button', 'chip', label);
      b.setAttribute('aria-pressed', (S.matchMode || '') === v);
      b.onclick = () => {
        S.matchMode = v;
        renderMatchRow();
        renderPayline();
      };
      row.appendChild(b);
    });
}

function renderReels() {
  const held = L.REELS.filter(r => S.held[r.id]).length;
  const hint = $('#holdHint');
  if (hint) {
    hint.textContent = !held
      ? 'Tap a reel to choose, or spin for a suggestion'
      : held + (held === 1 ? ' reel set \u2014 tap it and choose Any to clear'
                           : ' reels set \u2014 tap one and choose Any to clear');
  }
  renderMatchRow();
  const box = $('#reels'); box.innerHTML = '';
  L.REELS.forEach(reel => {
    const d = el('button', 'reel');
    d.type = 'button';
    d.dataset.reel = reel.id;
    d.dataset.held = !!S.held[reel.id];
    d.setAttribute('aria-pressed', !!S.held[reel.id]);
    d.appendChild(el('div', 'rl', reel.label));
    d.appendChild(el('div', 'rv', faceText(reel.id, S.reels[reel.id])));
    d.appendChild(el('div', 'hold', 'HELD'));
    // Tap to CHOOSE, not to freeze whatever came up. Holding a reel meant
    // spinning until the value you wanted appeared and then keeping it,
    // which is the wrong way round when you already know you want a rye.
    d.onclick = () => {
      pickReel(reel);
      return;
    };
    d.oncontextmenu = ev => {
      ev.preventDefault();
      S.held[reel.id] = !S.held[reel.id];
      renderReels();
    };
    box.appendChild(d);
  });
}

// Choose a value outright, with what each one means beside it. The reel
// keeps it — choosing IS holding — and Any releases it back to the spin.
function pickReel(reel) {
  const help = L.REEL_HELP[reel.id] || ['', {}];
  openModal(reel.label, m => {
    if (help[0]) m.appendChild(el('div', 'sub', help[0]));
    const list = el('div', 'recent');
    list.style.marginTop = '9px';
    reel.faces.forEach(f => {
      // How many you could actually be poured if you chose this. A face
      // that can only ever return nothing is worth knowing about before
      // you pick it rather than after.
      const trial = Object.assign({}, S.reels, { [reel.id]: f.v });
      const n = L.reelMatches(S.catalog, S.bottles, trial, S.history,
        matchOpts()).length;
      const r = el('button', 'item');
      r.style.cssText = 'width:100%;text-align:left';
      const left = el('div');
      left.appendChild(el('div', 'nm', f.t));
      const why = help[1][f.v];
      if (why) left.appendChild(el('div', 'sub', why));
      r.appendChild(left);
      r.appendChild(el('div', 'pf', n ? String(n) : '\u2014'));
      if (!n && f.v !== 'any') r.disabled = true;
      r.onclick = () => {
        S.reels[reel.id] = f.v;
        // Choosing is holding. Any means no opinion, so it stops holding.
        S.held[reel.id] = f.v !== 'any';
        save_();
        closeModal();
        renderReels();
        renderPayline();
      };
      list.appendChild(r);
    });
    m.appendChild(list);
    const close = el('button', 'btn ghost wide', 'Close');
    close.style.marginTop = '11px';
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

function doSpin() {
  const next = L.spinValid(S.reels, S.held, S.catalog, S.bottles, Math.random,
    matchOpts());
  if (!next) {
    // The holds themselves rule out everything open. Say which, rather than
    // spinning to an empty payline.
    const heldNames = L.REELS.filter(r => S.held[r.id])
      .map(r => r.label + ' ' + faceText(r.id, S.reels[r.id]));
    toast('Nothing open matches ' + heldNames.join(' and ') + '. Release a hold.');
    return;
  }
  S.reels = next;
  document.querySelectorAll('.reel').forEach(d => {
    if (S.held[d.dataset.reel]) return;
    d.classList.remove('spinning');
    void d.offsetWidth;                 // restart the animation
    d.classList.add('spinning');
  });
  renderReels();
  renderPayline();
}

// The find-a-match mode, if it is on and there is anybody to match against.
function matchOpts() {
  if (!S.matchMode) return {};
  const sets = Object.keys(SHARED.shelves).map(u => ({
    id: u, name: SHARED.names[u] || 'Buddy',
    map: L.shelfSet(SHARED.shelves[u], true)
  }));
  if (!sets.length) return {};
  return { matchWith: sets, matchAll: S.matchMode === 'all' };
}

function renderPayline() {
  const box = $('#payline'); box.innerHTML = '';
  const msg = $('#payMsg');

  // Nothing open means the machine has nothing to offer, and spinning it
  // teaches somebody the app is broken. Say what it needs instead.
  if (!Object.values(S.catalog).some(p => L.pourable(p.k, S.bottles))) {
    const e = el('div', 'sheet');
    e.appendChild(el('h3', null, 'Nothing open'));
    e.appendChild(el('div', 'sub', (S.bottles || []).length
      ? 'Everything on your shelf is sealed. Open one and this will help you '
        + 'choose between them.'
      : 'This picks something to drink from what you have open. Get your '
        + 'bottles in first.'));
    const go = el('button', 'btn wide btn-gold', (S.bottles || []).length
      ? 'Go to the shelf' : 'Add some bottles');
    go.style.marginTop = '10px';
    go.onclick = () => show('shelf');
    e.appendChild(go);
    box.appendChild(e);
    if (msg) msg.textContent = '';
    return;
  }
  const hits = L.pourGlasses(S.catalog, S.bottles, S.reels, S.history, matchOpts());
  const total = L.reelMatches(S.catalog, S.bottles, S.reels, S.history, matchOpts()).length;

  for (let i = 0; i < L.GLASSES; i++) {
    const hit = hits[i];
    const g = el('button', 'glass' + (hit ? '' : ' empty'));
    g.type = 'button';
    if (!hit) {
      g.disabled = true;
      g.innerHTML = glassSvg('none', 0);
      g.style.color = 'rgba(237,228,210,.30)';
      g.appendChild(el('div', 'gn', '\u2014'));
      box.appendChild(g);
      continue;
    }
    const p = prod(hit.k);
    const cls = typeClass(p);
    g.innerHTML = glassSvg(TYPE_HEX[cls], 1);
    g.style.color = '#EDE4D2';
    g.appendChild(el('div', 'gn', p.name));
    g.appendChild(el('div', 'gp', String(p.proof)));
    g.onclick = () => showPourChoice(p);
    box.appendChild(g);
  }

  /* The line stays, whether it has anything to say or not.

     Two of the three states put a sentence here and the third removed the
     element, so the green box lost 33px exactly when the reels landed on a
     clean three — it shrank on the result that needed no explaining. Empty
     and reserved, so the box is the same height every spin. */
  msg.style.display = 'block';
  if (!total) {
    msg.textContent = 'Spin to pour something.';
  } else if (total > L.GLASSES) {
    msg.textContent = total + ' bottles line up \u2014 showing the top three.';
  } else {
    // A non-breaking space, not an empty string and not a guessed
    // min-height: the element is then exactly one rendered line whatever
    // the font metrics turn out to be. min-height:1.35em was half of what
    // this text actually renders as, which left 15px of the jump behind.
    msg.textContent = '\u00a0';
  }
}

/* --- the map ---------------------------------------------------------- */

const REGION_HEX = { 'Islay': '#5C6B63', 'Speyside': '#B4762B', 'Highland': '#7A6142',
                     'Islands': '#3E6274', 'Lowland': '#8C8034', 'Campbeltown': '#9C4A22' };
const M = { full: null, view: null, pins: [], region: null, detail: null };

function ptStr(ring) {
  let s = '';
  for (let i = 0; i < ring.length; i++) {
    const p = L.project(ring[i][0], ring[i][1]);
    s += (i ? 'L' : 'M') + p[0].toFixed(4) + ' ' + p[1].toFixed(4);
  }
  return s + 'Z';
}

function applyView() {
  const v = M.view;
  $('#map').setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h);
  const z = M.full.w / v.w;

  // Crossing a detail threshold means new geometry; anything else is just a
  // new window on what is already drawn, so the pinch stays cheap.
  if (M.detail !== null && L.detailKey(z) !== M.detail) { renderMap(); return; }

  document.querySelectorAll('#map .pin').forEach(g => {
    const inRegion = !M.region || g.dataset.region === M.region;
    g.classList.toggle('dim', !inRegion);
    const c = g.querySelector('circle');
    // Divide by the zoom, not its square root: a pin holds a constant size on
    // screen. Shrinking slower than the view means pins GROW as you zoom in,
    // so a cluster could never come apart however far you pushed.
    const r = L.pinRadius(+g.dataset.n, M.full.w, +g.dataset.max || 1) / z;
    if (c) c.setAttribute('r', r.toFixed(6));

    const t = g.querySelector('text');
    if (t) {
      // A name needs room around its dot before it is worth showing.
      t.style.display = (z >= 2 && inRegion) ? '' : 'none';
      t.setAttribute('font-size', (L.mapFont(M.full.w, 'name') / z).toFixed(6));
      // Sit the name clear of the dot rather than a fixed distance above it.
      t.setAttribute('y', (+t.dataset.y - r * 1.25).toFixed(6));
    }
    const cnt = g.querySelector('.cnt');
    if (cnt) {
      const size = L.mapFont(M.full.w, 'count') / z;
      // Only when the digits fit inside the dot; a number spilling over its
      // own pin is worse than no number.
      const fits = r > size * 0.62 * String(g.dataset.n).length;
      cnt.style.display = (fits && inRegion) ? '' : 'none';
      cnt.setAttribute('font-size', size.toFixed(6));
    }
  });
}

// One surface. Everything that belongs at this zoom is drawn into it, and
// the geometry is rebuilt only when the detail set changes.
function svgEl(n) { return document.createElementNS('http://www.w3.org/2000/svg', n); }

function renderPlaceChips() {
  const box = $('#mapLayers'); box.innerHTML = '';
  L.MAP_PLACES.forEach(pl => {
    const b = el('button', 'chip', pl.label);
    b.onclick = () => {
      M.view = L.viewFor(pl, M.full);
      M.detail = null;                 // force the geometry to catch up
      renderMap();
      $('#mapPick').innerHTML = '';
    };
    box.appendChild(b);
  });
}

function renderMap() {
  const svg = $('#map');
  M.full = L.mapExtent(MAPDATA.world, 3);
  if (!M.view) M.view = Object.assign({}, M.full);
  renderPlaceChips();

  const z = M.full.w / M.view.w;
  const d = L.detailAt(z);
  M.detail = L.detailKey(z);
  svg.innerHTML = '';

  // Land. The detailed Scottish coastline is drawn over the world outline
  // once it is on, so the two simplifications never argue at the seam.
  const land = svgEl('path');
  land.setAttribute('class', 'land');
  land.setAttribute('d', MAPDATA.world.map(ptStr).join(' '));
  svg.appendChild(land);

  if (d.states) {
    const byState = L.stateCounts(S.catalog, MAPDATA.stateOf, S.bottles);
    Object.keys(MAPDATA.states).forEach(name => {
      const e = byState[name];
      const p = svgEl('path');
      p.setAttribute('class', 'state s' + L.choroStep(e ? e.total : 0));
      p.setAttribute('d', MAPDATA.states[name].map(ptStr).join(' '));
      if (e) p.onclick = ev => { ev.stopPropagation(); showKeyList(name, e.keys, e.open); };
      svg.appendChild(p);
    });
  }

  if (d.coast) {
    const c = svgEl('path');
    c.setAttribute('class', 'land coastline');
    c.setAttribute('d', MAPDATA.coast.map(ptStr).join(' '));
    svg.appendChild(c);
  }

  M.pins = [];
  if (d.countries) {
    const counts = L.countryCounts(S.catalog, MAPDATA.subCountry,
      MAPDATA.worldDist, S.bottles);
    const maxN = counts.reduce((m, c) => Math.max(m, c.total), 1);
    counts.forEach(c => {
      const pos = MAPDATA.countryPos[c.name];
      if (!pos) return;
      addPin(svg, L.project(pos[0], pos[1]), c.total, c.name, '#8A6A28', maxN,
        () => showKeyList(c.name, c.keys, c.open));
    });
  }

  if (d.usPins) {
    const { pins: us, maxN } = L.pinsInView(S.catalog, MAPDATA.usDistilleries,
      S.bottles, L.US_SUBS, M.view);
    us.forEach(pin => {
      M.pins.push(pin);
      addPin(svg, L.project(pin.lon, pin.lat), pin.total, shortName(pin.dist),
        '#7A3B1E', maxN, () => showPinBottles(pin));
    });
  }

  if (d.scotPins) {
    const { pins: sc, maxN } = L.pinsInView(S.catalog, MAPDATA.distilleries,
      S.bottles, ['scotch'], M.view);
    sc.forEach(pin => {
      M.pins.push(pin);
      addPin(svg, L.project(pin.lon, pin.lat), pin.total, shortName(pin.dist),
        REGION_HEX[pin.region] || '#6B3550', maxN, () => showPinBottles(pin));
    });
  }

  if (d.iePins) {
    const { pins: ie, maxN } = L.pinsInView(S.catalog, MAPDATA.ieDistilleries,
      S.bottles, ['irish'], M.view);
    ie.forEach(pin => {
      M.pins.push(pin);
      addPin(svg, L.project(pin.lon, pin.lat), pin.total, shortName(pin.dist),
        '#8C8034', maxN, () => showPinBottles(pin));
    });
  }

  updateCount(z, d);
  applyView();
}

function shortName(s) {
  return String(s).replace(/ Distiller(y|ies)$/, '')
    .replace(/ (Company|Distilling|Spirits|Whiskey)$/, '').replace(/^The /, '');
}

function addPin(svg, xy, n, label, fill, maxN, onTap) {
  const g = svgEl('g');
  g.setAttribute('class', 'pin');
  g.dataset.n = n; g.dataset.max = maxN; g.dataset.region = '';
  const c = svgEl('circle');
  c.setAttribute('cx', xy[0]); c.setAttribute('cy', xy[1]);
  c.setAttribute('fill', fill);
  g.appendChild(c);
  const t = svgEl('text');
  t.setAttribute('x', xy[0]); t.setAttribute('y', xy[1]);
  t.dataset.y = xy[1];
  t.setAttribute('text-anchor', 'middle');
  t.textContent = label;
  g.appendChild(t);
  const num = svgEl('text');
  num.setAttribute('class', 'cnt');
  num.setAttribute('x', xy[0]); num.setAttribute('y', xy[1]);
  num.setAttribute('text-anchor', 'middle');
  num.setAttribute('dominant-baseline', 'central');
  num.textContent = n;
  g.appendChild(num);
  g.onclick = e => { e.stopPropagation(); onTap(); };
  svg.appendChild(g);
}

function updateCount(z, d) {
  const total = Object.keys(S.catalog).length;
  let txt = total + ' whiskies';
  if (M.pins.length) {
    const bottles = M.pins.reduce((n, p) => n + p.total, 0);
    txt += ' \u00b7 ' + M.pins.length + ' distilleries in view, '
      + bottles + ' bottles';
  } else if (d.states) {
    txt += ' \u00b7 zoom in for distilleries';
  } else if (d.usPins || d.scotPins) {
    txt += ' \u00b7 no distilleries here \u2014 pan or zoom out';
  }
  $('#mapCount').textContent = txt;
  $('#mapLegend').innerHTML = '';
}

function showPinBottles(pin) {
  const box = $('#mapPick'); box.innerHTML = '';
  const card = el('div', 'sheet');
  card.appendChild(el('h3', null, pin.dist));
  card.appendChild(el('div', 'sub', [pin.region, pin.total + ' bottles',
    pin.open + ' open'].filter(Boolean).join(' \u00b7 ')));
  pin.keys.map(prod).filter(Boolean)
    .sort((a, b) => a.proof - b.proof)
    .forEach(p => {
      const r = el('button', 'item ' + typeClass(p)
        + (L.pourable(p.k, S.bottles) ? '' : ' sealed'));
      const left = el('div');
      const nm = el('div', 'nm'); nm.innerHTML = '<span class="dot"></span>';
      nm.appendChild(document.createTextNode(p.name));
      left.appendChild(nm);
      r.appendChild(left);
      r.appendChild(el('div', 'pf', p.proof));
      r.onclick = () => showBottle(p.k);
      card.appendChild(r);
    });
  box.appendChild(card);
}

// Pan and pinch. Pointer events cover mouse, touch and pen in one path.
function wireMap() {
  const svg = $('#map');
  const active = new Map();
  let last = null, startDist = 0, startView = null;

  const toMap = e => {
    const r = svg.getBoundingClientRect();
    return [M.view.x + ((e.clientX - r.left) / r.width) * M.view.w,
            M.view.y + ((e.clientY - r.top) / r.height) * M.view.h];
  };

  svg.addEventListener('pointerdown', e => {
    svg.setPointerCapture(e.pointerId);
    active.set(e.pointerId, e);
    if (active.size === 1) { last = toMap(e); svg.classList.add('drag'); }
    else if (active.size === 2) {
      const [a, b] = [...active.values()];
      startDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      startView = Object.assign({}, M.view);
    }
  });

  svg.addEventListener('pointermove', e => {
    if (!active.has(e.pointerId)) return;
    active.set(e.pointerId, e);
    if (active.size === 2 && startDist) {
      const [a, b] = [...active.values()];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const r = svg.getBoundingClientRect();
      const cx = startView.x + (((a.clientX + b.clientX) / 2 - r.left) / r.width) * startView.w;
      const cy = startView.y + (((a.clientY + b.clientY) / 2 - r.top) / r.height) * startView.h;
      M.view = L.zoomAbout(startView, M.full, d / startDist, cx, cy);
      applyView();
      return;
    }
    if (active.size === 1 && last) {
      const p = toMap(e);
      M.view = L.clampView({ x: M.view.x - (p[0] - last[0]), y: M.view.y - (p[1] - last[1]),
                             w: M.view.w, h: M.view.h }, M.full);
      applyView();
    }
  });

  const up = e => {
    active.delete(e.pointerId);
    if (active.size < 2) startDist = 0;
    if (!active.size) {
      last = null;
      svg.classList.remove('drag');
      // Pins are culled to the window, so the end of a pan is when the set
      // that should be on screen has changed.
      const z = M.full.w / M.view.w;
      if (L.detailAt(z).usPins) renderMap();
    }
  };
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', up);

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const p = toMap(e);
    M.view = L.zoomAbout(M.view, M.full, e.deltaY < 0 ? 1.22 : 1 / 1.22,
      p[0], p[1]);
    applyView();
  }, { passive: false });

  const step = f => {
    M.view = L.zoomAbout(M.view, M.full, f,
      M.view.x + M.view.w / 2, M.view.y + M.view.h / 2);
    applyView();
  };
  $('#zIn').onclick = () => step(1.6);
  $('#zOut').onclick = () => step(1 / 1.6);
  $('#zRe').onclick = () => {
    M.region = null; M.view = Object.assign({}, M.full); M.detail = null;
    renderMap(); $('#mapPick').innerHTML = '';
  };
}

/* --- home: the summary ------------------------------------------------ */

// A bar is a question you can follow: tapping one lists the bottles behind
// it, and tapping one of those opens it. match(label) says which bottles a
// bar stands for.
function barBlock(title, rows, opts) {
  const o = opts || {};
  // Marked, because on a wide screen the charts are the only thing that
  // should pair up two across — everything else on Home is full width.
  const s = el('div', 'sheet chartcard');
  s.appendChild(el('h3', null, title));
  const b = el('div', 'bars');
  b.style.marginTop = '8px';
  rows.forEach(r => {
    const row = el(o.match ? 'button' : 'div',
      'bar' + (o.cls ? ' ' + o.cls(r) : '') + (o.match ? ' tappable' : ''));
    row.appendChild(el('div', 't', r.label));
    const track = el('div', 'track');
    const fill = el('div', 'fill');
    fill.style.width = r.pct + '%';
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el('div', 'n', String(r.n)));
    if (o.match && r.n) {
      row.onclick = () => showBarBottles(title + ': ' + r.label, o.match(r.label));
    }
    b.appendChild(row);
  });
  s.appendChild(b);
  return s;
}

// The bottles behind a bar, and a way through to each one.
// The map hands back product KEYS, the charts hand back products. Rather
// than a second list renderer, resolve the keys and use the one that works.
function showKeyList(title, keys, openCount) {
  const list = (keys || []).map(k => S.catalog[k]).filter(Boolean);
  showBarBottles(title + (openCount ? ' \u00b7 ' + openCount + ' open' : ''),
    list);
}

function showBarBottles(title, list) {
  openModal(title, m => {
    m.appendChild(el('div', 'sub', list.length
      + (list.length === 1 ? ' whisky' : ' whiskies')));
    // NOT a scrollbox. The modal already scrolls, and a scrolling box
    // inside a scrolling modal means a touch goes to one of them and the
    // other cannot be reached — which is why a long list from a chart felt
    // stuck. One scroller, the modal's.
    // Proof descending by default. A chart drill-through is a list you are
    // scanning, and alphabetical tells you nothing you did not already know
    // from the chart — the strongest first is at least an ordering with an
    // opinion in it.
    const SORTS = [
      ['proof', 'Proof', (a, b) => (b.proof || 0) - (a.proof || 0)],
      ['price', 'Price', (a, b) => (b.msrp || 0) - (a.msrp || 0)],
      ['age', 'Age', (a, b) => (b.age || 0) - (a.age || 0)],
      ['name', 'Name', (a, b) => String(a.name).localeCompare(String(b.name))]
    ];
    let sortId = S.barSort || 'proof';

    const sr = el('div', 'actionrow');
    sr.style.margin = '9px 0 0';
    SORTS.forEach(([id, label]) => {
      const c = el('button', 'chip', label);
      c.dataset.on = id === sortId;
      c.onclick = () => {
        sortId = id;
        S.barSort = id;
        save_();
        Array.from(sr.children).forEach(x =>
          { x.dataset.on = x.textContent === label; });
        draw();
      };
      sr.appendChild(c);
    });
    m.appendChild(sr);

    const box = el('div', 'recent');
    m.appendChild(box);

    const draw = () => {
      box.innerHTML = '';
      const cmp = (SORTS.find(s => s[0] === sortId) || SORTS[0])[2];
      list.slice().sort(cmp).forEach(p => {
      const openNow = L.pourable(p.k, S.bottles);
      const r = el('button', 'item ' + typeClass(p) + (openNow ? '' : ' sealed'));
      const left = el('div');
      const nm = el('div', 'nm');
      nm.innerHTML = '<span class="dot"></span>';
      nm.appendChild(document.createTextNode(p.name));
      left.appendChild(nm);
      // Show what is being sorted on, or the order looks arbitrary: a list
      // by price with only proofs down the side reads as unsorted.
      const extra = sortId === 'price' && p.msrp ? '$' + p.msrp
        : sortId === 'age' && p.age ? p.age + ' years' : null;
      left.appendChild(el('div', 'sub',
        [p.dist, extra, openNow ? 'open' : 'sealed']
          .filter(Boolean).join(' \u00b7 ')));
      r.appendChild(left);
      r.appendChild(el('div', 'pf', String(p.proof)));
      r.onclick = () => { closeModal(); showBottle(p.k); };
        box.appendChild(r);
      });
    };
    draw();

    const close = el('button', 'btn ghost wide', 'Close');
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

/* --- logging a pour ----------------------------------------------------

   The app had 325 products, 344 bottles and 36 designed flights, and had
   never recorded anybody drinking anything. Not neglect: logging one took
   five taps and lived inside a slot machine. Everything downstream is
   weaker for it — what to pour next cannot avoid what you poured last, and
   flight findings are discounted precisely BECAUSE no flight has run.

   One function, several placements, and one tap.                          */

function pourNow(k, opts) {
  const o = opts || {};
  const p = S.catalog[k];
  if (!p) return;
  const entry = L.logEntry('pour', { k: k }, o.when || L.todayISO());
  S.history.push(entry);
  save_();
  renderPayline(); renderHome();
  if (o.after) o.after();

  // Undo lives in the toast, because a one-tap control needs a one-tap
  // way back and a confirmation would defeat the point of it.
  toast('Poured ' + p.name.slice(0, 30), {
    label: 'Undo',
    action: () => {
      const i = S.history.lastIndexOf(entry);
      if (i >= 0) S.history.splice(i, 1);
      save_(); renderPayline(); renderHome();
      if (o.after) o.after();
      toast('Not poured after all');
    }
  });

  // The only moment somebody has the glass in front of them. Asked once
  // per bottle and never again, and skippable — a prompt that nags is a
  // prompt people learn to dismiss without reading.
  if (!p.tn || !p.tn.nose) askForNote(p);
}

// A pour button, wherever a bottle is.
// The same thing on a list row, where a word costs a whole line. A glass,
// with a label for anybody who cannot see it.
function pourIcon(k, after) {
  const b = el('button', 'pourglass');
  b.type = 'button';
  // A word, not a glyph. Every pictogram tried here read as something
  // else — U+25E0 draws a bare arc that looks like a stray line — and
  // "Pour" is four characters and unambiguous.
  b.textContent = 'Pour';
  b.title = 'Record a pour';
  b.setAttribute('aria-label', 'Record a pour');
  b.onclick = ev => { ev.stopPropagation(); pourNow(k, { after: after }); };
  return b;
}

function askForNote(p) {
  openModal('What did you get?', m => {
    m.appendChild(el('div', 'sub', p.name
      + ' has no tasting note. Yours is the only one it will ever have if '
      + 'nobody has published one \u2014 a line is plenty.'));
    const fields = {};
    ['nose', 'palate', 'finish'].forEach(k => {
      const wrap = el('label', null, L.titleCase(k));
      const inp = document.createElement('input');
      inp.className = 'field';
      inp.placeholder = k === 'nose' ? 'What it smells like'
        : k === 'palate' ? 'What it tastes like' : 'What it leaves behind';
      fields[k] = inp;
      wrap.appendChild(inp);
      m.appendChild(wrap);
    });
    const save = el('button', 'btn wide btn-gold', 'Save the note');
    save.style.marginTop = '11px';
    save.onclick = () => {
      const tn = {};
      Object.keys(fields).forEach(k => {
        const v = fields[k].value.trim();
        if (v) tn[k] = v;
      });
      if (!tn.nose && !tn.palate && !tn.finish) { closeModal(); return; }
      S.edits[p.k] = Object.assign({}, S.edits[p.k],
        { tn: Object.assign({}, p.tn, tn), tnSrc: 'mine' });
      save_(); rebuildCatalog();
      closeModal(); renderShelf(); renderHome();
      toast('Noted');
    };
    m.appendChild(save);
    const skip = el('button', 'btn ghost wide', 'Not now');
    skip.onclick = closeModal;
    m.appendChild(skip);
  });
}

function renderHome() {
  const box = $('#homeBody'); box.innerHTML = '';

  // An empty shelf gets a first screen rather than empty charts. The two
  // things a new person must do — sign in, and get some bottles in — were
  // the two hardest to find: one behind a gear icon under a card they had
  // no reason to open, the other behind a gear on another tab.
  if (!(S.bottles || []).length) {
    const w = el('div', 'sheet');
    w.appendChild(el('h3', null, 'Nothing on the shelf yet'));
    w.appendChild(el('div', 'sub',
      'This keeps what you own and what you have poured, and works out what '
      + 'your collection can teach you. Start by getting your bottles in \u2014 '
      + 'anything already in the shared library arrives with its proof, cask '
      + 'and tasting notes.'));

    const imp = el('button', 'btn wide btn-gold', 'Import a collection');
    imp.style.marginTop = '11px';
    imp.onclick = () => importDialog();
    w.appendChild(imp);
    w.appendChild(el('div', 'src',
      'A CSV from Only Drams, a spreadsheet of your own, or an export from '
      + 'here.'));

    const add = el('button', 'btn wide', 'Add one bottle');
    add.style.marginTop = '9px';
    add.onclick = () => { show('shop'); $('#shopQ').focus(); };
    w.appendChild(add);

    if (!FB.user) {
      const si = el('button', 'btn wide ghost', 'Sign in to keep it');
      si.style.marginTop = '9px';
      si.onclick = fbSignIn;
      w.appendChild(si);
      w.appendChild(el('div', 'src',
        'Without signing in the shelf lives in this browser only. Signing in '
        + 'keeps it on your account and reaches it from your phone.'));
    }
    box.appendChild(w);
    return;
  }

  // The handful of things somebody actually came here to do.
  // Its own class, not sortrow. sortrow is a single non-wrapping line —
  // right for a sort control with two chips, wrong for four action chips,
  // which ran off the right edge and took the page width with them.
  // In the masthead, between the wordmark and the gear, where there was a
  // whole row of empty space — they were on a line of their own below all
  // of it, costing height on the screen where height matters most.
  const doing = document.getElementById('homeActions');
  if (!doing) return;
  doing.innerHTML = '';
  // Four became three, and one of those four was a duplicate: Add a bottle
  // and What to look for both opened Shop. Import is a once-ever thing and
  // lives under the Shelf gear. Buddies comes out of the gear, because it
  // is the half of the app nobody can find.
  [['Pour', () => { renderReels(); renderPayline(); renderHistory();
                    show('pour'); }],
   ['Add', () => { show('shop'); $('#shopQ').focus(); }],
   ['Buddies', () => showBuddiesScreen()],
   ['Library', () => { renderLibraryScreen(); goTo('library'); }]]
    .forEach(([label, fn]) => {
    const b = el('button', 'chip', label);
    b.onclick = fn;
    doing.appendChild(b);
  });
  // Only when there is a shelf worth keeping and it is not kept anywhere.
  // Somebody with nothing to lose does not need reminding; somebody who has
  // spent an evening typing bottles in should be told it lives in one
  // browser.
  if (!FB.user && (S.bottles || []).length) {
    const keep = el('div', 'sheet');
    keep.appendChild(el('h3', null, 'This shelf is in one browser'));
    keep.appendChild(el('div', 'sub',
      'Signing in keeps it on your account, reaches it from your phone, and '
      + 'lets you share it with a tasting buddy.'));
    const si = el('button', 'btn wide btn-gold', 'Sign in with Google');
    si.style.marginTop = '10px';
    si.onclick = fbSignIn;
    keep.appendChild(si);
    box.appendChild(keep);
  }

  // What you did, before what you have. Charts are a monthly curiosity;
  // pouring is every evening, and the log was at the very bottom under the
  // charts and the map.
  if ((S.history || []).length) {
    const hist = el('div');
    box.appendChild(hist);
    renderHistory(hist, true);
  }

  const stats = L.shelfStats(S.catalog, S.bottles);
  const val = L.shelfValue(S.catalog, S.bottles);

  const tiles = el('div', 'tiles');
  /* Each number goes where the number lives.

     A count of bottles is a claim about the shelf, and the shelf is one tap
     away — but the tile was a dead label and the tap went nowhere, so you
     read the number and then went and found the screen it came from. Where
     a tile has no obvious screen behind it, it stays a label: the shelf
     value is not a place. */
  [[stats.bottles, 'bottles on the shelf', 'shelf'],
   [stats.open, 'open and pourable', 'pour'],
   [stats.products, 'different whiskies', 'shelf'],
   ['$' + val.msrp.toLocaleString(), 'shelf value at MSRP', null],
   [allFlights().length, 'flights designed', 'flights'],
   [S.history.filter(x => x.kind === 'flight').length, 'flights run', 'flights']
  ].forEach(([v, l, to]) => {
    const t = el(to ? 'button' : 'div', 'tile' + (to ? ' tapped' : ''));
    if (to) {
      t.type = 'button';
      t.setAttribute('aria-label', v + ' ' + l + ' \u2014 open ' + to);
      t.onclick = () => show(to);
    }
    t.appendChild(el('div', 'v', String(v)));
    t.appendChild(el('div', 'l', l));
    tiles.appendChild(t);
  });
  box.appendChild(tiles);

  const live = Object.values(S.catalog);
  const where = fn => live.filter(fn);

  /* Two columns, filled by height rather than in order.

     column-count balances by TOTAL height, which cannot help when one card
     is taller than the other three together: By type has thirteen rows,
     Recognition has three, and the right column ended half way up the page
     with the map stranded below a lane of nothing.

     Each card goes to whichever column is shorter when it is added — the
     heights are known before anything is drawn, because a bar chart is its
     rows. Deterministic, so the same shelf always lays out the same way. */
  const charts = el('div');
  charts.id = 'homeCharts';
  const colA = el('div', 'chartcol'), colB = el('div', 'chartcol');
  charts.appendChild(colA); charts.appendChild(colB);
  let hA = 0, hB = 0;
  charts.appendChild = card => {
    // A card is its heading plus a row each: near enough, and it needs no
    // layout pass to know.
    const rows = card.querySelectorAll('.bar').length;
    if (hA <= hB) { colA.appendChild(card); hA += rows + 2; }
    else { colB.appendChild(card); hB += rows + 2; }
    return card;
  };
  box.appendChild(charts);
  charts.appendChild(barBlock('By type',
    L.barRows(L.countBy(live, p => L.titleCase(p.sub))),
    { match: v => where(p => L.titleCase(p.sub) === v) }));

  const scotch = live.filter(p => p.sub === 'scotch' && p.region);
  if (scotch.length) {
    charts.appendChild(barBlock('Scotch by region',
      L.barRows(L.countBy(scotch, p => p.region)),
      { match: v => where(p => p.region === v) }));
  }

  charts.appendChild(barBlock('Open or sealed', L.barRows({
    Open: stats.open, Sealed: stats.sealed
  }, { keepOrder: true }), {
    cls: r => 'b-' + r.label.toLowerCase(),
    match: v => where(p => L.pourable(p.k, S.bottles) === (v === 'Open'))
  }));

  // Recognition and occasion are ordered scales, so they keep their order
  // rather than being sorted by size -- a scale read out of sequence is
  // harder to read, not easier.
  const obscCounts = { Known: 0, Niche: 0, Obscure: 0 };
  live.forEach(p => { const k = L.titleCase(p.obsc); if (k in obscCounts) obscCounts[k]++; });
  charts.appendChild(barBlock('Recognition', L.barRows(obscCounts, { keepOrder: true }),
    { match: v => where(p => L.titleCase(p.obsc) === v) }));

  const bandCounts = { Everyday: 0, Good: 0, Special: 0, Vault: 0 };
  live.forEach(p => { const b = L.priceBand(p.msrp);
    if (b) bandCounts[L.titleCase(b)]++; });
  charts.appendChild(barBlock('Occasion', L.barRows(bandCounts, { keepOrder: true }),
    { match: v => where(p => L.priceBand(p.msrp) === v.toLowerCase()) }));

  // The map, small, on the home page.
  const mapCard = el('div', 'sheet');
  mapCard.appendChild(el('h3', null, 'Where it comes from'));
  /* What you drink, against what you own.

     The shelf and the log answer different questions and were never put
     side by side. Only shown once the log is long enough to mean
     something, and only when a category is far enough off its shelf share
     to be worth saying — otherwise it is a chart of noise. */
  {
    const rows = L.drinkingVsShelf(S.catalog, S.bottles, S.history);
    const pours = (S.history || []).filter(x => x.kind === 'pour').length;
    const finding = L.drinkingFinding(rows, pours);
    if (finding) {
      const dc = el('div', 'sheet');
      dc.appendChild(el('h3', null, 'What you pour'));
      dc.appendChild(el('div', 'sub', finding.text));
      dc.appendChild(el('div', 'src', finding.kind === 'over'
        ? 'Worth knowing when the shelf looks thin somewhere else: this is '
          + 'where the evenings actually go.'
        : 'Owned deeply and poured rarely. Not a gap to fill, whatever the '
          + 'shelf looks like beside it.'));
      const go = el('button', 'btn btn-sm ghost', 'Show me the ' + finding.sub);
      go.style.marginTop = '9px';
      go.onclick = () => {
        S.filters.types = [finding.sub];
        S.shelfSub = 'all';
        renderShelfFilters(); renderShelf(); show('shelf');
      };
      dc.appendChild(go);
      box.appendChild(dc);
    }
  }

  /* The bottles you keep having. A backup is revealed preference: BZ's own
     rule is that he buys one for anything he wants not to run out of. */
  {
    const keep = L.keepers(S.catalog, S.bottles);
    if (keep.length) {
      const kc = el('div', 'sheet');
      const hd = el('div', 'hdr');
      hd.style.marginBottom = '6px';
      hd.appendChild(el('h3', null, 'You keep buying these'));
      hd.appendChild(el('span', 'count', String(keep.length)));
      kc.appendChild(hd);
      kc.appendChild(el('div', 'sub',
        'More than one bottle, which is a stronger statement than a star: '
        + 'you decided not to run out.'));
      keep.slice(0, 8).forEach(r => {
        const row = el('button', 'item');
        const left = el('div');
        left.appendChild(el('div', 'nm oneline', r.name));
        left.appendChild(el('div', 'sub', r.total + ' bought'
          + (r.gone ? ' \u00b7 ' + r.gone + ' finished' : '')
          + (r.here ? ' \u00b7 ' + r.here + ' here' : '')));
        row.appendChild(left);
        row.onclick = () => showBottle(r.k);
        kc.appendChild(row);
      });
      if (keep.length > 8) {
        kc.appendChild(el('div', 'src', 'Showing the first 8 of '
          + keep.length + '.'));
      }
      box.appendChild(kc);
    }
  }

  /* The map IS the button.

     A picture of the world with a chip underneath saying "Open the map"
     asks you to read a label to reach the thing you are already looking at.
     Pressing the map opens the map, and the chip goes. */
  const wrap = el('button', 'mapwrap tapped');
  wrap.type = 'button';
  wrap.style.marginTop = '8px';
  wrap.setAttribute('aria-label', 'Open the map');
  wrap.onclick = () => show('map');
  const mini = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  mini.setAttribute('id', 'homeMap');
  mini.setAttribute('class', 'homemap');
  mini.style.width = '100%';
  wrap.appendChild(mini);
  mapCard.appendChild(wrap);
  box.appendChild(mapCard);
  drawHomeMap();

}

// A still world map for the home page: the same land and dots as the map
// screen's world layer, without the gestures.
function drawHomeMap() {
  const svg = document.getElementById('homeMap');
  if (!svg || !MAPDATA.world || !MAPDATA.world.length) return;
  svg.innerHTML = '';
  const ext = L.mapExtent(MAPDATA.world, 3);
  svg.setAttribute('viewBox', [ext.x, ext.y, ext.w, ext.h].join(' '));
  const land = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  land.setAttribute('class', 'land');
  land.setAttribute('d', MAPDATA.world.map(ptStr).join(' '));
  svg.appendChild(land);
  const cc = L.countryCounts(S.catalog, MAPDATA.subCountry, MAPDATA.worldDist, S.bottles);
  const maxN = cc.reduce((m, c) => Math.max(m, c.total), 1);
  cc.forEach(c => {
      const pos = MAPDATA.countryPos[c.name];
      if (!pos) return;
      const [x, y] = L.project(pos[0], pos[1]);
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', x); dot.setAttribute('cy', y);
      dot.setAttribute('r', L.pinRadius(c.total, ext.w, maxN));
      dot.setAttribute('fill', '#8A6A28');
      dot.setAttribute('opacity', '.82');
      svg.appendChild(dot);
    });
}

// The papers, as something you can print. Opened in a new window with its
// own print styling rather than fighting the app's, and the participant
// sheet is checked for a leaked bottle name before it is shown at all.
function tastingPapers(f, which) {
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const host = L.hostCard(f, S.catalog);
  const part = L.participantCard(f, S.catalog);

  const leaks = L.sheetLeaks(part, f, S.catalog);
  if (which !== 'host' && leaks.length) {
    toast('Not printed: the sheet names ' + leaks[0]);
    return null;
  }

  const css = `<style>
    @page { margin: 14mm }
    /* Sized to fit ONE page. The host card came to 1058px against 950px of
       Letter inside a 14mm margin, so it printed as two and the second held
       the end of the reasoning — the part you read while pouring. The
       overflow was about a tenth of a page, so the type is a half point
       tighter rather than anything being cut. */
    body { font: 10.5pt/1.35 Georgia, serif; color: #241f1b; margin: 0 }
    h1 { font-size: 15.5pt; letter-spacing: .04em; margin: 0 0 1.5mm }
    .sub { font-style: italic; color: #6b5f54; margin: 0 0 2.5mm;
           font-size: 9pt; line-height: 1.3 }
    .given { font-size: 8.5pt; letter-spacing: .05em; text-transform: uppercase;
             color: #8a6a28; margin: 0 0 3mm; line-height: 1.3 }
    /* The table is the biggest block on the card and the one that decides
       whether it fits. At 9pt a six-pour card came to 941px against 950 of
       page — inside, and Chromium still spilled it. */
    table { border-collapse: collapse; width: 100%; font-size: 8.5pt;
            line-height: 1.25 }
    th, td { border: .4pt solid #b9ada0; padding: 1.3mm 1.3mm;
             vertical-align: top; text-align: left }
    th { background: #f0ebe3; font-size: 8.5pt; letter-spacing: .04em;
         text-transform: uppercase }
    .prompt td { color: #7d7268; font-size: 7.8pt; font-style: italic }
    .lt { font-weight: bold; width: 8mm; text-align: center }
    /* Two columns. Six reasons at full width is a third of the page for
       text you glance at between pours, and it was the block that pushed
       the card onto a second sheet. */
    .why { margin-top: 3.5mm; font-size: 8.5pt }
    .why ul { margin: 1.5mm 0 0; padding-left: 5mm;
              column-count: 2; column-gap: 6mm }
    .why li { margin-bottom: 1.2mm; break-inside: avoid }
    /* A break BETWEEN the sheets, not after each one. page-break-after on
       every .pg broke after the last one too, so a host card that fits on
       a page printed as two — the second one blank. */
    .pg + .pg { page-break-before: always }
    /* And the reasoning does not get split across the fold. */
    .why, table { break-inside: avoid }
    .blank td { height: 17mm }
  </style>`;

  const hostHtml = () => {
    const rows = host.pours.map(p => `<tr>
      <td class="lt">${esc(p.letter)}</td>
      <td><b>${esc(p.bottle)}</b>${p.note ? '<br><i>' + esc(p.note) + '</i>' : ''}</td>
      <td>${esc(p.proof)}</td><td>${esc(p.wood)}</td>
      <td>${esc(p.colour)}</td><td>${esc(p.nose)}</td>
      <td>${esc(p.palate)}</td><td>${esc(p.finish)}</td></tr>`).join('');
    return `<div class="pg"><h1>${esc(host.title)}</h1>
      <p class="given">${esc(host.tag)}</p>
      <p class="sub">${esc(host.premise)}</p>
      <table><tr><th></th><th>Bottle</th><th>Proof</th><th>Wood</th>
        <th>Colour</th><th>Nose</th><th>Palate</th><th>Finish</th></tr>
        ${rows}</table>
      <p class="sub" style="margin-top:4mm">Colour, nose, palate and finish are
        prompts \u2014 say them after the room speaks, never before.</p>
      ${host.why.length ? '<div class="why"><b>WHY IT IS BUILT THIS WAY</b><ul>'
        + host.why.map(w => '<li>' + esc(w) + '</li>').join('') + '</ul></div>' : ''}
      ${host.ext.length ? '<p class="sub"><b>If the night has legs:</b> '
        // Six, then a count. Ten bottle names is a paragraph, and the card
        // is a thing you hold while pouring — the rest are on the screen.
        + esc(host.ext.slice(0, 6).map(x => L.pourLabel(x, S.catalog))
            .join(' \u00b7 '))
        + (host.ext.length > 6
            ? ' \u00b7 and ' + (host.ext.length - 6) + ' more on the app' : '')
        + '</p>' : ''}
    </div>`;
  };

  const partHtml = () => {
    const cols = part.columns;
    const head = `<tr><th></th><th>Colour</th><th>Nose</th><th>Palate</th>
      <th>Finish</th><th>${esc(cols[0][0])}</th><th>${esc(cols[1][0])}</th></tr>`;
    const prompt = `<tr class="prompt"><td></td>
      <td>${esc(part.prompts.colour)}</td><td>${esc(part.prompts.nose)}</td>
      <td>${esc(part.prompts.palate)}</td><td>${esc(part.prompts.finish)}</td>
      <td>${esc(cols[0][1])}</td><td>${esc(cols[1][1])}</td></tr>`;
    const rows = part.rows.map(r =>
      `<tr class="blank"><td class="lt">${esc(r.letter)}</td>
       <td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join('');
    return `<div class="pg"><h1>${esc(part.title)}</h1>
      <p class="given">${esc(part.given)}</p>
      <p class="sub">${esc(part.theme)}</p>
      <table>${head}${prompt}${rows}</table>
      <p class="sub" style="margin-top:4mm">Look, then smell, then taste, then
        wait. Fill the colour box before you nose it. A defensible wrong answer
        beats a blank.</p></div>`;
  };

  const body = which === 'host' ? hostHtml()
             : which === 'sheet' ? partHtml()
             : hostHtml() + partHtml();
  return '<!doctype html><meta charset="utf-8"><title>'
    + esc(f.title) + '</title>' + css + body;
}

function showPapers(f) {
  openModal('Papers for ' + L.sentenceCase(f.title), m => {
    m.appendChild(el('div', 'sub',
      'The host card carries every answer. The participant sheet carries '
      + 'none, and is checked for a leaked bottle name before it prints.'));

    const open = (which, label) => {
      const b = el('button', 'btn wide', label);
      b.style.marginTop = '9px';
      b.onclick = () => {
        const html = tastingPapers(f, which);
        if (!html) return;
        const w = window.open('', '_blank');
        if (!w) { toast('Allow popups to print'); return; }
        w.document.write(html);
        w.document.close();
        setTimeout(() => w.print(), 300);
      };
      m.appendChild(b);
    };
    open('host', 'Host card');
    open('sheet', 'Participant sheet');
    open('both', 'Both, one after the other');

    const close = el('button', 'btn ghost wide', 'Close');
    close.style.marginTop = '11px';
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

// Import and Enhance are the same kind of job — putting a shelf right — so
// they live behind one gear rather than crowding the header.
/* The scanner. The camera and the decoding are the browser's own — no
   service and no cost — and where it is unsupported the number can be
   typed, which is the same flow with a slower first step.                */
// Paste a listing, keep what parses. Additive: an existing pairing is left
// alone, because one already in use has been confirmed by somebody scanning
// it and a bulk paste has not.
function loadUpcListing() {
  openModal('Load a barcode listing', m => {
    m.appendChild(el('div', 'sub',
      'Paste a list in the form  Brand: 750 ml Expression 0-12345-67890-1 '
      + '$29.99;  one brand per line. Anything already known is left alone.'));
    const ta = document.createElement('textarea');
    ta.className = 'field';
    ta.rows = 8;
    ta.style.cssText = 'margin-top:10px;font-family:ui-monospace,monospace;'
      + 'font-size:12px';
    m.appendChild(ta);
    const msg = el('div', 'looknote');
    msg.style.marginTop = '9px';
    m.appendChild(msg);

    const go = el('button', 'btn wide btn-gold', 'Read it');
    go.style.marginTop = '10px';
    go.onclick = () => {
      const rows = L.parseUpcListing(ta.value);
      if (!rows.length) {
        msg.className = 'looknote warn2';
        msg.textContent = 'Nothing recognisable in that.';
        return;
      }
      let added = 0;
      const batch = {};
      rows.forEach(r => {
        if (knownUpcs()[r.upc]) return;
        knownUpcs()[r.upc] = { name: r.name, price: r.price, size: r.size };
        batch[r.upc] = { name: r.name, price: r.price, size: r.size,
                         at: Date.now() };
        added++;
      });
      save_();
      // Up for everybody, in one write rather than one per barcode, and
      // only the new ones.
      if (FB.user && added) {
    fbUpcRef().update(batch)
      .catch(e => appLog('barcode batch failed: ' + ((e && e.message) || e)));
  }
      msg.className = 'looknote ok';
      msg.textContent = added + ' added, ' + (rows.length - added)
        + ' already known.';
      appLog('barcodes: read ' + rows.length + ', added ' + added);
    };
    m.appendChild(go);
    const close = el('button', 'btn ghost wide', 'Close');
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

function scanBarcode() {
  const supported = 'BarcodeDetector' in window;
  openModal('Scan a bottle', m => {
    const msg = el('div', 'sub');
    msg.textContent = supported
      ? 'Point the camera at the barcode on the back.'
      : 'This browser cannot use the camera for barcodes. Type the number '
        + 'under the bars instead.';
    m.appendChild(msg);

    let stream = null, stop = false;
    const done = code => {
      stop = true;
      if (stream) stream.getTracks().forEach(t => t.stop());
      closeModal();
      afterScan(code);
    };

    if (supported) {
      const video = document.createElement('video');
      video.setAttribute('playsinline', '');
      video.style.cssText = 'width:100%;border-radius:10px;margin-top:9px;'
        + 'background:#000;max-height:46vh;object-fit:cover';
      m.appendChild(video);
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      }).then(s => {
        stream = s;
        video.srcObject = s;
        video.play();
        const det = new window.BarcodeDetector({
          formats: ['upc_a', 'upc_e', 'ean_13', 'ean_8']
        });
        const tick = () => {
          if (stop) return;
          det.detect(video).then(codes => {
            if (codes && codes.length) { done(codes[0].rawValue); return; }
            requestAnimationFrame(tick);
          }).catch(() => requestAnimationFrame(tick));
        };
        requestAnimationFrame(tick);
      }).catch(e => {
        msg.className = 'looknote warn2';
        msg.textContent = 'No camera: ' + (e.message || e)
          + '. Type the number instead.';
      });
    }

    const inp = document.createElement('input');
    inp.className = 'field';
    inp.type = 'text';
    inp.inputMode = 'numeric';
    inp.placeholder = 'or type the barcode number';
    inp.style.marginTop = '10px';
    inp.onkeydown = e => {
      if (e.key === 'Enter' && L.upcKey(inp.value)) done(inp.value);
    };
    m.appendChild(inp);

    const close = el('button', 'btn ghost wide', 'Cancel');
    close.style.marginTop = '11px';
    close.onclick = () => {
      stop = true;
      if (stream) stream.getTracks().forEach(t => t.stop());
      closeModal();
    };
    m.appendChild(close);
  });
}

/**
 * Fill in a shelf, one bottle at a time, in front of you.
 *
 * Every result is applied to YOUR edits, never to the shared catalogue —
 * one person's bad note must not become everyone's. Progress is written as
 * it goes, so stopping halfway keeps what it found, and it can be stopped
 * at any point because 300 lookups is a long wait and nobody should be
 * trapped in it.
 */
function showEnhance(queue) {
  let stop = false, done = 0, filled = 0, missed = 0;
  let noAnswer = 0, nothingNew = 0, partial = 0, retried = 0;
  let errRun = 0, halted = false;
  openModal('Filling in your shelf', m => {
    if (!S.lookupUrl) {
      m.appendChild(el('div', 'errs',
        'This needs the lookup service. Settings, Advanced, Bottle lookup.'));
      const c = el('button', 'btn ghost wide', 'Close');
      c.onclick = closeModal; m.appendChild(c);
      return;
    }
    // What it will do, how long, and what it costs, before it starts. It
    // opened on a Start button and a sentence, which is not enough to
    // decide with.
    const secs = queue.length * 6;
    // No price. What a lookup costs is BZ's to know while he is the one
    // paying for it, and a number in cents on the screen turns a useful
    // thing into one people hesitate over.
    m.appendChild(el('div', 'sub',
      queue.length + ' bottles have no tasting notes. It asks about each one '
      + 'in turn \u2014 about ' + (secs < 90 ? secs + ' seconds'
        : Math.round(secs / 60) + ' minutes')
      + '. Anything it finds is saved as it goes, so stopping halfway keeps '
      + 'what it found.'));
    m.appendChild(el('div', 'src',
      'It writes to your own shelf, never to the shared library, and never '
      + 'over a note you have written yourself.'));

    const bar = el('div', 'rs');
    bar.style.marginTop = '10px';
    m.appendChild(bar);
    const log = el('div', 'recent scrollbox');
    // Its own scroll, and tall enough to be worth scrolling. The inline
    // max-height was overriding the class's while leaving overflow to it,
    // which worked — but newest-on-top meant the earlier ones were pushed
    // out of a fixed box you then had to fight to reach.
    log.style.cssText = 'max-height:40vh;overflow-y:auto;margin-top:8px';
    m.appendChild(log);

    const go = el('button', 'btn wide btn-gold', 'Start');
    go.style.marginTop = '11px';
    m.appendChild(go);
    const close = el('button', 'btn ghost wide', 'Close');
    close.onclick = () => { stop = true; closeModal(); };
    m.appendChild(close);

    const note = (name, what, ok) => {
      const r = el('div', 'item');
      const left = el('div');
      left.appendChild(el('div', 'nm', name));
      left.appendChild(el('div', 'sub', what));
      r.appendChild(left);
      r.appendChild(el('div', 'pf', ok ? '\u2713' : '\u00b7'));
      // Appended, not prepended: a run reads top to bottom like a log, and
      // the view follows the newest line rather than jumping to it.
      const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
      log.appendChild(r);
      if (atBottom) log.scrollTop = log.scrollHeight;
    };

    go.onclick = async () => {
      if (go.textContent === 'Stop') { stop = true; return; }
      go.textContent = 'Stop';
      bar.textContent = 'Starting\u2026';
      const began = Date.now();
      for (const p of queue) {
        if (stop) break;
        // The bottle it is on, not just a number: a name moving is proof
        // it is working, where a counter alone could be stuck.
        const per = done ? (Date.now() - began) / done : 6000;
        const left = Math.round((queue.length - done) * per / 1000);
        bar.textContent = (done + 1) + ' of ' + queue.length + '  \u00b7  '
          + p.name.slice(0, 28) + (p.name.length > 28 ? '\u2026' : '')
          + (done ? '  \u00b7  about ' + (left < 90 ? left + 's'
              : Math.round(left / 60) + ' min') + ' left' : '');
        try {
          const ask = async () => {
            return askLookup(p.name);
          };
          let rawRes = await ask();
          // Not identifying anything: we know which bottle this is.
          let res = L.parseLookup(rawRes, { needIdentity: false });
          let take = res ? L.enhanceDiff(p, res) : null;

          /* One retry, and only when the first answer was no use.

             Six bottles errored in a run where the two either side of them
             filled, and twenty-two came back with pieces of a note. Neither
             is the world being silent — a reply that runs past its token
             budget mid-sentence looks exactly like both. Asking twice costs
             one extra call on the few that need it and is the difference
             between a bottle being described and being marked as tried. */
          if (!take && (!res || L.notePartial(res))) {
            await new Promise(r2 => setTimeout(r2, 500));
            const raw2 = await ask();
            const res2 = L.parseLookup(raw2, { needIdentity: false });
            const take2 = res2 ? L.enhanceDiff(p, res2) : null;
            if (take2) { rawRes = raw2; res = res2; take = take2; retried++; }
          }

          if (take) {
            errRun = 0;
            // Into YOUR edits. The shared catalogue stays read-only.
            S.edits[p.k] = Object.assign({}, S.edits[p.k], take);
            if (take.tn) S.edits[p.k].tnSrc = 'model';
            // Straight to the library. Everything here came from a lookup
            // that was checked before it was applied.
            fbPublishToLibrary(Object.assign({}, p, take,
              { src: { lookup: true } }));
            filled++;
            rebuildCatalog();
            save_();
            note(p.name, Object.keys(take).join(', '), true);
          } else {
            // Two different failures, and saying "nothing found" for both
            // is what hid the one above for a whole run. One is the world
            // having nothing to say; the other is us refusing what came
            // back.
            missed++;
            if (res && L.notePartial(res)) {
              errRun = 0;
              partial++;
              note(p.name, 'answered with only part of a note', false);
              // The WHOLE reply. Truncated at 300 it stopped mid-palate,
              // which is exactly where the answer to "which field is
              // missing" begins.
              appLog('fill partial ' + p.name + ' <- '
                + JSON.stringify(rawRes).slice(0, 1200));
            } else if (res) {
              errRun = 0;
              nothingNew++;
              note(p.name, 'nothing it does not already have', false);
            } else {
              noAnswer++;
              // What actually came back, on the admin tab. "The lookup
              // found nothing" covers the service erroring, the service
              // answering nulls, and us rejecting a good answer, and
              // telling them apart from the outside took a whole run.
              const errored = !!(rawRes && rawRes.error);
              note(p.name, errored ? 'the lookup errored'
                : 'the lookup answered nothing', false);
              appLog('fill miss ' + p.name + ' <- '
                + JSON.stringify(rawRes).slice(0, 1200));
              /* Stop when the endpoint has stopped.

                 Credits ran out mid-run and it carried on through the whole
                 queue, spending nothing, marking every remaining bottle as
                 tried and reporting that there was nothing to find about
                 Buffalo Trace. Five errors in a row twice over, with a
                 retry between each, is not a run worth finishing. The rest
                 are left untried, because they were. */
              errRun = errored ? errRun + 1 : 0;
              if (errRun >= 5) {
                stop = true;
                halted = true;
              }
            }
          }
        } catch (e) {
          missed++;
          appLog('fill failed for ' + p.name + ': ' + (e.message || e));
          note(p.name, (e.message || String(e)).slice(0, 60), false);
        }
        done++;
      }
      bar.textContent = (halted
          ? 'Stopped \u2014 the lookup failed five times running. '
            + (queue.length - done) + ' left untried. '
          : stop ? 'Stopped. ' : 'Done. ')
        + filled + ' filled in'
        + (retried ? ' (' + retried + ' on the second ask)' : '')
        + (partial ? ', ' + partial + ' answered with part of a note' : '')
        + (noAnswer ? ', ' + noAnswer + ' the lookup could not answer' : '')
        + (nothingNew ? ', ' + nothingNew + ' already had everything' : '')
        + '.';
      go.textContent = 'Start';
      go.disabled = true;
      renderShelf(); renderShelfFilters(); renderHome();
    };
  });
}

function showImportPreview(out, prep) {
  out.innerHTML = '';
  if (prep.fatal) {
    out.appendChild(el('div', 'errs', prep.fatal));
    return;
  }
  const sum = L.importSummary(prep);
  const matched = Object.keys(prep.cols).sort();
  out.appendChild(el('div', 'rs', 'Columns found: ' + matched.join(', ')));

  const lines = [
    [sum.add, 'new bottles to add', 'ok'],
    [sum.exists, 'already on your shelf \u2014 added as a sealed spare each', 'info'],
    [sum.duplicate, 'repeated inside the file \u2014 skipped', 'warn'],
    [sum.skip, 'skipped, no usable proof', 'warn']
  ];
  const box = el('div');
  box.style.marginTop = '8px';
  lines.forEach(([n, label, lvl]) => {
    if (!n) return;
    const row = el('div', 'find f-' + lvl);
    row.appendChild(el('div', 'm', lvl === 'ok' ? '\u2713' : lvl === 'warn' ? '!' : '\u00b7'));
    row.appendChild(el('div', null, n + ' ' + label));
    box.appendChild(row);
  });
  out.appendChild(box);

  const flagged = prep.rows.filter(r => r.issues.length).slice(0, 12);
  if (flagged.length) {
    const fl = el('div');
    fl.style.marginTop = '9px';
    fl.appendChild(el('div', 'rs', 'Rows worth a look'));
    flagged.forEach(r => fl.appendChild(el('div', 'sub',
      'line ' + r.line + ' \u00b7 ' + r.name.slice(0, 40)
      + ' \u2014 ' + r.issues.join(', '))));
    out.appendChild(fl);
  }

  if (!sum.add && !sum.exists) {
    out.appendChild(el('div', 'errs', 'Nothing in that file can be imported.'));
    return;
  }

  const go = el('button', 'btn wide btn-gold', 'Import '
    + (sum.add + sum.exists) + ' bottles');
  go.style.marginTop = '11px';
  go.onclick = () => {
    const added = runImport(prep);
    closeModal();
    renderShelf(); renderShelfFilters(); renderHome(); renderPayline();
    toast(added.products + ' whiskies, ' + added.bottles + ' bottles imported');
  };
  out.appendChild(go);
}

// Commit. Existing whiskies gain a bottle rather than a duplicate product,
// which is what a re-import of the same export should do.
function runImport(prep) {
  let products = 0, bottles = 0;
  prep.rows.forEach(r => {
    if (r.action === 'duplicate' || r.action === 'skip') return;
    let key = r.match;
    if (r.action === 'add') {
      const np = L.normalizeProduct({
        name: r.name, dist: r.dist || '', proof: r.proof, sub: r.sub,
        age: r.age, msrp: r.msrp, sec: r.sec, fin: r.fin || '', size: r.size
      });
      if (S.catalog[np.k]) { key = np.k; }
      else {
        np.finc = np.fin ? 'stated' : null;
        if (r.notes) np.notes = r.notes;
        S.custom[np.k] = np;
        delete S.deleted[np.k];
        key = np.k;
        products++;
      }
    }
    if (!key) return;
    S.bottles.push(L.newBottle(S.bottles, key,
      r.action === 'exists' ? 'sealed' : r.status, r.paid || null));
    bottles++;
  });
  save_(); rebuildCatalog();
  return { products: products, bottles: bottles };
}

/* --- shopping --------------------------------------------------------- */

// What the shelf is missing, ranked by what a purchase would unlock.
// Real bottles that would fill a described gap, with a budget, because the
// useless answer to every gap is an expensive famous bottle.
/* Answers already paid for, kept across reloads.

   It was a plain object, so every reload threw away every candidate list
   and the next look cost another twenty-second call. The answers do not
   go stale in any way that matters — the bottles a distillery makes are
   the same next week — so they are written with the shelf's own store and
   read back at boot. Anything already owned is filtered at render time, so
   a cached list cannot offer you something you have since bought. */
const CAND_CACHE = (() => {
  try {
    const raw = localStorage.getItem('kb.cands');
    const v = raw ? JSON.parse(raw) : null;
    return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  } catch (e) { return {}; }
})();

function saveCands() {
  try {
    localStorage.setItem('kb.cands', JSON.stringify(CAND_CACHE));
  } catch (e) {
    // Quota. The cache is a convenience; losing it costs a lookup, not data.
    appLog('candidate cache not saved: ' + ((e && e.message) || e));
  }
}
// Gaps proved impossible. Kept for the session so the shelf stops offering
// something the house does not make.
// Persisted, not per-session: a house that does not make a finished
// bottling still will not next week, and re-offering it wastes the same
// click again.
//
// Read through S every time rather than captured into a const: a top-level
// const evaluates when the script is PARSED, which is before load() reads
// localStorage. It captured an empty object every time, and the first write
// then pushed that empty object back over the saved list — so this did not
// merely fail to remember, it actively forgot.
function deadGaps() {
  if (!S.deadGaps || typeof S.deadGaps !== 'object') S.deadGaps = {};
  return S.deadGaps;
}

function candKey(g) { return L.shopNorm(g.name); }

/* Tap a finding, get bottles. No modal and no budget field.
   The budget was a number to decide before you could see anything, and it
   made the answer worse: the service censored itself to it, came back
   empty, and said nothing exists. Cheapest first is the same information
   without the decision — you can see where the money starts and stop
   reading when it gets past you.                                        */
function showCandidates(g) {
  openModal(g.name, m => {
    m.appendChild(el('div', 'sub', g.why));

    const brow = el('div', 'lookrow');
    brow.style.marginTop = '10px';
    const msg = el('div', 'looknote');
    brow.appendChild(msg);
    const find = el('button', 'btn btn-sm ghost', 'Look again');
    find.hidden = true;
    brow.appendChild(find);
    m.appendChild(brow);

    const out = el('div');
    m.appendChild(out);

    // Found earlier: show it and offer another look. Otherwise look NOW,
    // because tapping the finding is the ask — a modal whose first act is
    // making you press the thing you just pressed is a step that only
    // existed to give the budget field somewhere to sit.
    const cached = CAND_CACHE[candKey(g)];
    if (cached) {
      msg.className = 'looknote';
      msg.textContent = 'Found earlier \u2014 no waiting.';
      renderCandidateList(out, cached, g);
      find.hidden = false;
    } else {
      setTimeout(() => find.click(), 0);
    }

    find.onclick = async () => {
      if (!S.lookupUrl) {
        msg.className = 'looknote';
        msg.textContent = 'Set up the lookup service in Settings first.';
        return;
      }
      find.disabled = true;
      find.hidden = true;
      msg.className = 'looknote';
      /* A staged wait, because the service takes its time.

         One word for twenty seconds reads as a hung app: BZ pressed it,
         got "Looking…", and had no way to tell whether anything was
         happening. Each line says which part is running, and the elapsed
         seconds appear once it is slow enough to wonder about. */
      const started = Date.now();
      const stages = [
        [0, 'Asking for bottles that fit\u2026'],
        [4, 'Still asking \u2014 it is reading your shelf first\u2026'],
        [9, 'The model is slow today. Nothing is stuck\u2026'],
        [18, 'Still going. Close this and it keeps the answer for later\u2026']
      ];
      let stage = 0;
      msg.className = 'looknote';
      msg.textContent = stages[0][1];
      const tick = setInterval(() => {
        const secs = Math.round((Date.now() - started) / 1000);
        while (stage + 1 < stages.length && secs >= stages[stage + 1][0]) stage++;
        msg.textContent = stages[stage][1]
          + (secs >= 6 ? '  ' + secs + 's' : '');
      }, 500);
      const doneWaiting = () => clearInterval(tick);
      out.innerHTML = '';
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 40000);
        const r = await fetch(S.lookupUrl, {
          method: 'POST', signal: ctrl.signal,
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ mode: 'candidates', gap: g.name, why: g.why,
            dist: g.dist || null, region: g.region || null, sub: g.sub || null,
            // The axis travels with the ask, so a lookup made while
            // exploring casks comes back about casks.
            axis: S.shopDim || null,
            // No budget. It made the answer worse: the service censored
            // itself to it and came back empty saying nothing exists.
            owned: L.gapOwned(g, S.catalog) })
        });
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        let res = L.parseCandidates(await r.json(), S.catalog, null, g);

        // The second, unbudgeted ask is gone with the budget it existed
        // to work around. There is one ask now and it is already the
        // unbudgeted one, so an empty answer means empty.

        if (!res || !res.bottles.length) {
          // A live search genuinely returns nothing sometimes. Say so, and
          // keep whatever was found before rather than blanking the panel.
          // Three different empty answers, and they must not read alike:
          // nothing exists, nothing genuine came back, nothing affordable.
          // Only the last is about money.
          const nRej = (res && res.rejected) ? res.rejected.length : 0;
          msg.className = 'looknote warn2';
          msg.textContent = nRej
            ? nRej + ' came back from other distilleries and were dropped. '
              + 'Nothing genuine.'
            : (cached ? 'Nothing new. Showing the earlier find.'
                      // Not "nothing exists" — that is a claim about the
                      // world, and what actually happened is that this
                      // search came back empty. Say which, and offer the
                      // one thing that might change it.
                      : 'Nothing came back \u2014 this one may not exist. '
                        + 'It will not be offered again.');
          if (cached) { renderCandidateList(out, cached, g); return; }
          // Dead either way, and the rejected case is the STRONGER signal.
          // A search that returns nothing might have missed; a search that
          // returns only bottles from other distilleries has been told the
          // house does not make the thing, and offered substitutes instead.
          // Treating that as "not proven" is why Buffalo Trace came back
          // every time the list was worked out again.
          // Redraw the screen behind the modal. Without it the ask stays in
          // Worth looking for and the Suggestions button still counts the
          // old total — which is how "Show the 2 ruled out" opened onto
          // three. The count was never wrong; the screen was stale.
          {
            doneWaiting();
            S.askStats = L.recordAsk(S.askStats, g, 0);
            deadGaps()[L.gapKey(g)] = g.name || 1;
            save_();
            renderShop();
          }

          // The house does not make it. The observation underneath is still
          // true, so offer the question that CAN be answered rather than
          // leaving a dead end at the top of the list.
          const alt = L.reframeGap(g, S.catalog);
          if (alt) {
            // Already recorded dead above, with the redraw.
            const box2 = el('div', 'sheet');
            box2.style.marginTop = '10px';
            box2.appendChild(el('h3', null, 'Try it another way'));
            box2.appendChild(el('div', 'sub', alt.why));
            const go = el('button', 'btn wide btn-gold', alt.name);
            go.style.marginTop = '9px';
            go.onclick = () => { closeModal(); showCandidates(alt); };
            box2.appendChild(go);
            out.innerHTML = '';
            out.appendChild(box2);
          }
          return;
        }
        // Verified before it is shown, never after: a bottle on screen has
        // already been acted on by the time a caveat arrives.
        doneWaiting();
        msg.textContent = 'Checking ' + res.bottles.length + ' of them exist\u2026';
        const vres = await verifyCandidates(res, g);
        if (!vres.bottles.length) {
          S.askStats = L.recordAsk(S.askStats, g, 0);
          save_();
          msg.className = 'looknote warn2';
          msg.textContent = vres.unverified.length
            ? vres.unverified.length + ' suggestion(s) could not be found as '
              + 'real bottles and were dropped.'
            : 'Nothing came back.';
          return;
        }
        res = vres;
        CAND_CACHE[candKey(g)] = res;
        saveCands();
        S.askStats = L.recordAsk(S.askStats, g, res.bottles.length);
        save_();
        msg.className = res.overBudget ? 'looknote' : 'looknote ok';
        msg.textContent = res.overBudget
          ? 'The cheapest that fits is below.'
          : res.bottles.length + ' checked and real'
            + (res.unverified && res.unverified.length
               ? ', ' + res.unverified.length + ' dropped as not found' : '')
            + (res.rejected && res.rejected.length
               ? ', ' + res.rejected.length + ' dropped as substitutes' : '')
            + '.';
        renderCandidateList(out, res, g);
      } catch (e) {
        appLog('candidates failed: ' + (e.message || e));
        msg.className = 'looknote warn2';
        msg.textContent = e.message;
      } finally {
        doneWaiting();
        // Shown again once there is an answer, because a second look is a
        // different request from the first: you can see what came back.
        find.disabled = false;
        find.hidden = false;
      }
    };

    const close = el('button', 'btn ghost wide', 'Close');
    close.style.marginTop = '11px';
    close.onclick = closeModal;
    m.appendChild(close);

    // Tapping the recommendation IS the request. Making you press Find
    // bottles as well was asking the same question twice.
    if (!cached && S.lookupUrl) find.click();
  });
}

/**
 * Check a suggestion is a real bottle, by asking about it on its own.
 *
 * The flight builder does exactly this and it is why it can be trusted: it
 * proposes, then verifies every name and drops what does not check out.
 * A suggestion has been through no such thing — asking a model to name
 * bottles that fit a gap and then believing the names is the whole problem.
 *
 * The single-bottle lookup is a separate question with its own search, so a
 * name that was assembled rather than found tends to come back empty or
 * with nothing that matches. Not proof, but a real second opinion, and it
 * is the same mechanism already trusted elsewhere in the app.
 */
async function verifyCandidates(res, g) {
  if (!S.lookupUrl || !res || !res.bottles.length) return res;
  // In parallel. This ran one bottle at a time, each waiting for the last,
  // so five suggestions meant five round trips end to end — the whole
  // reason a five-bottle answer took as long as it did. They do not depend
  // on each other, so there was never a reason to queue them.
  const checked = [];
  await Promise.all(res.bottles.map(async b => {
    try {
      const found = L.parseLookup(await askLookup(b.name));
      // It has to come back, AND come back as the same bottle.
      const same = found && L.nameAgrees(b.name, found.name);
      b.verified = !!same;
      if (same) {
        // Take the lookup's numbers over the suggestion's: one is an answer
        // about this bottle, the other was produced while listing five.
        if (found.proof) b.proof = found.proof;
        if (found.msrp && !b.price) b.price = found.msrp;
        if (found.dist) b.dist = found.dist;
      }
    } catch (e) {
      b.verified = false;
    }
    checked.push(b);
  }));
  // Parallel completion is arbitrary, so put them back in the order the
  // service ranked them — the list is sorted by price for display anyway,
  // but a stable order means the same ask gives the same answer twice.
  checked.sort((a, b) => res.bottles.indexOf(a) - res.bottles.indexOf(b));
  const real = checked.filter(b => b.verified);
  return {
    bottles: real.length ? real : [],
    note: res.note,
    rejected: res.rejected || [],
    unverified: checked.filter(b => !b.verified).map(b => b.name),
    overBudget: res.overBudget
  };
}

function renderCandidateList(out, res, g) {
  /* What you can walk out with first, what nobody vouched for last.
     An availability the model did not give is shown as "not confirmed"
     rather than left blank: not knowing is itself a signal, because a
     bottle genuinely on shelves is the easy thing to say. */
  if (res && Array.isArray(res.bottles)) {
    res = Object.assign({}, res,
      { bottles: res.bottles.slice().sort(L.byAvailability) });
  }
  // Cheapest first, always. With no budget to set, the order IS the
  // budget: you see where the money starts and stop reading when it gets
  // past you, which is the same information without a number to decide
  // before you can see anything.
  if (res && res.bottles) {
    res.bottles = res.bottles.slice()
      .sort((a, b) => (a.price == null ? 1e9 : a.price)
                    - (b.price == null ? 1e9 : b.price));
  }
  if (res.note) out.appendChild(el('div', 'rs', res.note));
