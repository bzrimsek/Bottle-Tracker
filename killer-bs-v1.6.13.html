   with one thin suggestion three times running — kept its place at the top
   of the list and kept costing twenty seconds to disappoint.

   A tally instead. The score is what it has EARNED: found bottles push it
   up, empty hands push it down, and an ask nobody has tried sits in the
   middle where it can prove itself. Not permanent, because a house that
   released nothing last year may this year — a failure fades rather than
   ruling the ask out for ever, which is what deadGaps is still for. */
L.askScore = function (stat) {
  const st = stat || {};
  const ok = st.ok || 0, no = st.no || 0;
  if (!ok && !no) return 0;                 // never tried: no opinion
  // Each empty hand costs more than a find gains, because the cost of a
  // bad ask is twenty seconds and the gain of a good one is a bottle you
  // would have found anyway from the next ask down.
  return ok - (no * 1.5);
};

L.rankAsks = function (asks, stats) {
  const st = stats || {};
  return (asks || []).slice().sort((a, b) => {
    const d = L.askScore(st[L.gapKey(b)]) - L.askScore(st[L.gapKey(a)]);
    return d || 0;                          // otherwise the order it came in
  });
};

// One result, recorded. found is how many real bottles came back.
L.recordAsk = function (stats, g, found) {
  const st = Object.assign({}, stats || {});
  const k = L.gapKey(g);
  const was = st[k] || { ok: 0, no: 0 };
  st[k] = { ok: was.ok + (found > 0 ? 1 : 0),
            no: was.no + (found > 0 ? 0 : 1),
            at: L.todayISO ? L.todayISO() : '' };
  return st;
};

/* Some gaps are true of the shelf and false of the world. "24 from Buffalo
   Trace and not one finished bottling" is a correct reading of what is
   here, and unanswerable: Buffalo Trace does not release finished
   bottlings, which is a fact about the distillery that no amount of
   looking at a shelf reveals.
   The app learns these the only way it can — by asking once and being told
   nothing exists — and must then never ask again. */
L.DEAD_REASONS = {
  empty: 'Nothing came back when this was searched.',
  rejected: 'What came back was from other distilleries.',
  dismissed: 'You ruled this out.'
};

L.shelfGaps = function (catalog, bottles, flights, wish, history, dead) {
  const all = []
    .concat(L.gapsFromFlights(flights, catalog, bottles))
    .concat(L.gapsFromWish(wish, flights, catalog, bottles))
    .concat(L.gapsFromHouses(catalog, bottles))
    .concat(L.gapsFromContrast(catalog, bottles))
    .concat(L.gapsFromThinness(catalog))
    .concat(L.gapsFromProof(catalog))
    .concat(L.gapsFromPairs(catalog, bottles));

  // Unlocking a flight is only worth much if flights get run. With 36
  // designed and none run, a bottle that completes one is a hypothesis;
  // a bottle that extends a house you have bought two dozen times is not.
  const runs = (history || []).filter(x => x.kind === 'flight').length;
  if (runs === 0) {
    all.forEach(g => { if (g.kind === 'flight') g.weight -= 45; });
  } else if (runs < 5) {
    all.forEach(g => { if (g.kind === 'flight') g.weight -= 20; });
  }

  // A sealed bottle you own outranks anything you would have to buy: the
  // flight is short and the answer is upstairs.
  all.forEach(g => { if (g.owned) g.weight += 50; });

  // Anything already found to be impossible drops out rather than sitting
  // at the top of the list forever.
  const impossible = dead || {};
  // Sort FIRST, then filter. Filtering into a new array before sorting left
  // that array in insertion order, since the sort mutated the original —
  // so the ranking silently stopped applying.
  all.sort((a, b) => b.weight - a.weight || a.name.localeCompare(b.name));
  // A bottle you own is not a gap, whichever generator raised it. This was
  // inside gapsFromWish only, and Longrow comes from gapsFromFlights, so it
  // survived being bought. Once, here, over everything.
  // A bottle you can POUR is not a gap, whichever generator raised it —
  // this was inside gapsFromWish only, and Longrow comes from
  // gapsFromFlights, so it survived being bought.
  //
  // Pourable, not owned: a sealed bottle sitting in the cupboard is still a
  // finding, and the useful one — the flight is short and the answer is
  // upstairs rather than in a shop. Those are marked owned and rank first
  // on purpose.
  const pourable = {};
  Object.values(catalog || {}).forEach(p => {
    if (L.pourable(p.k, bottles || [])) pourable[L.shopNorm(p.name)] = 1;
  });
  const live = all.filter(g => !impossible[L.gapKey(g)]
    && !(g.name && pourable[L.shopNorm(g.name)]));

  // One entry per bottle name: a bottle wanted by two flights is one thing
  // to buy, not two.
  const seen = {}, deduped = [];
  live.forEach(g => {
    const key = g.kind + '|' + L.shopNorm(g.name);
    if (seen[key]) return;
    seen[key] = 1;
    deduped.push(g);
  });

  // Cap each kind, because a list is advice and eighteen findings is a
  // spreadsheet. Six entries all reading "no matched pair at a proof you
  // already have" say one thing six times; two make the point.
  const CAP = { flight: 3, wish: 3, extend: 2, contrast: 2,
                region: 2, category: 2, proof: 1, pair: 2 };
  const taken = {}, out = [];
  deduped.forEach(g => {
    const n = (taken[g.kind] || 0);
    if (n >= (CAP[g.kind] || 2)) return;
    taken[g.kind] = n + 1;
    out.push(g);
  });

  /* Findability, last of all.

     The ranking above decides what is worth SAYING. This decides what can
     be acted on, and those are different questions: a flight that needs
     Pappy Van Winkle 15 is a true and useful thing to know, and it is not
     the thing to put at the top of a list of what to buy next.

     After the cap, deliberately. Sinking these before it would have let an
     attainable gap take the slot and the finding would have vanished
     altogether — which is not what was asked for. They stay, they carry
     the tag, and they sit at the bottom. */
  out.forEach(g => {
    const p = (catalog || {})[g.k] || Object.values(catalog || {})
      .find(x => L.shopNorm(x.name) === L.shopNorm(g.name || ''));
    g.find = L.findability(g.name, p);
  });
  return out.filter(g => g.find !== 'allocated')
    .concat(out.filter(g => g.find === 'allocated'));
};

/* --- inviting somebody ------------------------------------------------- */

// An invite is a text, and a text gets forwarded, screenshotted and left on
// a lock screen. So the link carries NO access. It carries a code that says
// who sent it, so the person opening it does not have to find you in a list
// — and it produces a request, which you still accept. Granting stays with
// the owner of the shelf, exactly as it does everywhere else.

// An invite is a link with your user id in it. That is the only fact the
// whole thing was ever carrying — who sent it — and a uid already is that
// fact, so there is nothing to generate, store, expire or secure.
//
// It grants nothing. Opening it signs you in and sends a request, which the
// owner still accepts, exactly as if you had found them in the directory.

L.buddyLink = function (base, uid) {
  if (!base || !uid) return null;
  return String(base).replace(/[?#].*$/, '') + '#buddy=' + uid;
};

L.buddyFromUrl = function (href) {
  const m = /[#&?]buddy=([A-Za-z0-9_-]{6,64})/.exec(String(href || ''));
  return m ? m[1] : null;
};

// The message stands on its own: the reader may never have heard of any of
// this, and needs to know what it does not do as much as what it does.
L.inviteText = function (name, link) {
  return [
    (name ? name : 'I') + ' would like to share a whisky shelf with you.',
    '',
    'Killer B\u2019s Bottle Tracker keeps what you own and what you have poured.',
    'Share a shelf and you can see what each of you has open, and pour the',
    'same thing on the same night.',
    '',
    link,
    '',
    'Open it and sign in. Nobody sees your shelf until you say so.'
  ].join('\n');
};

/* --- who you are to other people --------------------------------------- */

// A display name, not an email. The directory that lets a buddy find you
// holds this and a user id and nothing else — the moment it carries a
// bottle count or a shelf value it stops being a directory and becomes a
// catalogue of who owns what.
//
// Being listed grants nobody anything. It lets them send a request; access
// comes from accepting one.

L.NAME_MIN = 2;
L.NAME_MAX = 24;

// Reserved so nobody can pass themselves off as the app or as a system
// message in a shared list.
L.NAME_TAKEN = ['admin', 'administrator', 'system', 'killer bs', 'killerbs',
                'support', 'help', 'moderator', 'anonymous', 'guest'];

L.cleanName = function (s) {
  return String(s || '')
    .replace(/\s+/g, ' ')
    .replace(/[^\p{L}\p{N} .'\-_]/gu, '')
    .trim()
    .slice(0, L.NAME_MAX);
};

// A name somebody typed, stored the way every imported name is stored.
//
// It was kept exactly as typed, so "heaven hill grain to glass wheated
// bourbon" went onto the shelf in lower case and sat among 344 title-cased
// neighbours. It looked correct on the bottle screen and wrong on the shelf
// for one reason: the headings are set in Cinzel, which is a capitals-only
// face and shows every name in caps whatever case it holds. The list is the
// only screen telling the truth.
//
// Applied where a name is TYPED, not in normalizeProduct — that also runs
// over every entry arriving from the shared library, and re-casing those
// would change the key each bottle is filed under.
//
// NOT cleanName. That one is the rule for the display name you are known by
// in the directory, and it cuts at NAME_MAX, which is 24 characters — it
// would have filed this bottle as "Heaven Hill Grain To Gla". A bottle name
// is a long thing: "Heaven Hill Bottled In Bond Bourbon 7 Year Kentucky
// Straight Bourbon Whiskey" is on the shelf already at 74.
L.typedName = function (s) {
  return L.titleCase(String(s || '').replace(/\s+/g, ' ').trim().slice(0, 120));
};

L.nameError = function (s, taken) {
  const n = L.cleanName(s);
  if (n.length < L.NAME_MIN) {
    return 'At least ' + L.NAME_MIN + ' characters.';
  }
  if (L.NAME_TAKEN.indexOf(n.toLowerCase()) >= 0) {
    return 'That one is reserved.';
  }
  // An email would put a contact address on a list that only needs a name.
  if (/@/.test(String(s))) {
    return 'A name, not an email — the list others see should not carry your '
      + 'address.';
  }
  if (taken && taken.some(t => L.nameKey(t) === L.nameKey(n))) {
    return 'Somebody is already using that.';
  }
  return null;
};

// Case and spacing folded, so "BZ" and "b z" cannot both exist and be
// mistaken for each other in a picker.
L.nameKey = function (s) {
  return L.cleanName(s).toLowerCase().replace(/[^a-z0-9]/g, '');
};

// A suggestion, from the Google account, that you can change. Given name
// only: the surname is not needed to tell three friends apart.
L.suggestName = function (user) {
  if (!user) return '';
  const dn = (user.displayName || '').trim();
  if (dn) return L.cleanName(dn.split(/\s+/)[0]);
  const em = (user.email || '').split('@')[0] || '';
  return L.cleanName(em.replace(/[._-]+/g, ' '));
};

// What a directory entry may contain. Written as a whitelist rather than
// trimmed by hand, so adding a field to the profile cannot quietly widen
// what everyone can see.
L.directoryEntry = function (uid, name, findable) {
  if (!uid || !name || !findable) return null;
  return { uid: uid, name: L.cleanName(name), key: L.nameKey(name) };
};

/* --- the wishlist ----------------------------------------------------- */

// Why a bottle is on the list matters more than that it is. A name alone is
// a note to self; a name with "completes Who's Your Daddy?" is a decision
// you can act on in a shop.
L.wishAdd = function (list, entry) {
  const out = (list || []).slice();
  const key = L.shopNorm(entry.name || '');
  if (!key) return out;
  const at = out.findIndex(w => L.shopNorm(w.name) === key);
  const row = {
    name: (entry.name || '').trim(),
    reason: (entry.reason || '').trim() || null,
    forFlight: entry.forFlight || null,
    est: entry.est || null,
    added: entry.added || L.todayISO()
  };
  if (at >= 0) {
    // Already wanted. Keep the earlier date and the better reason.
    row.added = out[at].added;
    row.reason = row.reason || out[at].reason;
    row.forFlight = row.forFlight || out[at].forFlight;
    out[at] = row;
  } else {
    out.push(row);
  }
  return out;
};

L.wishRemove = function (list, name) {
  const key = L.shopNorm(name || '');
  return (list || []).filter(w => L.shopNorm(w.name) !== key);
};

L.onWishlist = function (list, name) {
  const key = L.shopNorm(name || '');
  return (list || []).some(w => L.shopNorm(w.name) === key);
};

// Every flight pour that is a wish, gathered so the wishlist can say which
// flights a bottle would unlock. One bottle can unlock more than one.
L.wishFromFlights = function (flights) {
  const by = {};
  (flights || []).forEach(f => {
    (f.core || []).forEach(p => {
      if (L.pourKind(p) !== 'wish') return;
      const key = L.shopNorm(p.name || '');
      if (!key) return;
      if (!by[key]) by[key] = { name: p.name, flights: [] };
      if (by[key].flights.indexOf(f.title) < 0) by[key].flights.push(f.title);
    });
  });
  return Object.values(by);
};

// A flight is short only when pours are MISSING, not when some of them are
// wishes — a six-pour flight with two wishes is a complete design you
// cannot run yet, which is a different thing from a broken one.
L.flightShape = function (f, catalog, bottles) {
  const core = f.core || [];
  const kinds = { shelf: 0, wish: 0, blend: 0 };
  let ready = 0;
  core.forEach(p => {
    kinds[L.pourKind(p)]++;
    if (L.pourAvailable(p, catalog, bottles)) ready++;
  });
  return {
    total: core.length, ready: ready,
    shelf: kinds.shelf, wish: kinds.wish, blend: kinds.blend,
    runnable: core.length >= 4 && ready === core.length
  };
};

/* --- flight design -------------------------------------------------- */

L.CORE_TARGET = 6;

// Position a pour on the ladder by its real proof, not by its index, so
// three Cairdeas bottlings 0.4 apart visibly cluster.

// Validate a flight instance against BZ's own build rules. Failing a check
// is a warning with a reason, never a block -- the proof rule has been
// deliberately overridden three times already.
L.validate = function (pours, catalog, opts) {
  const o = opts || {};
  const msgs = [];
  const prods = pours.map(p => catalog[p.k]).filter(Boolean);

  if (pours.length !== (o.coreTarget || L.CORE_TARGET)) {
    msgs.push({ level: 'warn', msg: pours.length + ' core pours, not ' +
      (o.coreTarget || L.CORE_TARGET) });
  }

  const proofs = prods.map(p => p.proof);
  let ascends = true;
  for (let i = 1; i < proofs.length; i++) if (proofs[i] < proofs[i - 1]) ascends = false;
  if (!ascends && !o.allowDescent) {
    msgs.push({ level: 'warn', msg: 'proof does not ascend — flag it or reorder' });
  }

  // "One obscure pour minimum" tests recognition, not price. The imported
  // rarity label would pass a Weller here, which is exactly backwards.
  const obscure = prods.filter(p => p.obsc === 'obscure').length;
  if (obscure < 1) msgs.push({ level: 'warn', msg: 'no obscure pour — every flight needs one' });
  else msgs.push({ level: 'ok', msg: obscure + ' obscure pour' + (obscure > 1 ? 's' : '') });

  const unpourable = prods.filter(p => !L.pourable(p.k, o.bottles || []));
  if (unpourable.length) {
    msgs.push({ level: 'warn', msg: unpourable.length + ' pour' +
      (unpourable.length > 1 ? 's are' : ' is') + ' not open: ' +
      unpourable.map(p => p.name.slice(0, 28)).join(', ') });
  }

  // Matched pairs are the strongest flight shape BZ has found: identical
  // proof, one perceptible difference.
  const pairs = [];
  for (let i = 0; i < prods.length; i++)
    for (let j = i + 1; j < prods.length; j++)
      if (Math.abs(prods[i].proof - prods[j].proof) <= 0.4) pairs.push([i, j]);
  if (pairs.length) {
    msgs.push({ level: 'ok', msg: pairs.length + ' matched pair' +
      (pairs.length > 1 ? 's' : '') + ' at proof' });
  }
  return msgs;
};

// How often a product has already been poured, across every flight and
// every recorded run. Overuse control: run two should not be run one with
// two bottles changed.
// Flights get the same treatment the shelf got: searchable, filterable by
// what state they are in and what they are made of, sortable.
L.FLIGHT_SORTS = [
  // "Curriculum order" was not a sort — it returned 0 and left the list in
  // whatever order it was already in. That happened to be the order BZ
  // wrote his 36 in, which meant something to him and nothing to anybody
  // else, whose flights would all sort identically.
  { id: 'added', label: 'Order added' },
  { id: 'title',      label: 'Name' },
  { id: 'ready',      label: 'Most ready' },
  { id: 'proof',      label: 'Lowest proof' },
  { id: 'run',        label: 'Recently run' }
];

// How much of a flight you could actually pour tonight.
L.flightReady = function (f, catalog, bottles) {
  const core = f.core || [];
  if (!core.length) return { open: 0, total: 0, pct: 0 };
  const open = core.filter(p => catalog[p.k] && L.pourable(p.k, bottles)).length;
  return { open: open, total: core.length,
           pct: Math.round((open / core.length) * 100) };
};

L.flightRunAt = function (f, history) {
  const runs = (history || []).filter(x => x.kind === 'flight' && x.flight === f.title);
  return runs.length ? runs.map(x => x.at).sort().slice(-1)[0] : null;
};

L.flightProof = function (f, catalog) {
  const ps = (f.core || []).map(p => catalog[p.k]).filter(Boolean).map(p => p.proof);
  return ps.length ? Math.min.apply(null, ps) : Infinity;
};

L.filterFlights = function (flights, catalog, bottles, history, opts) {
  const o = opts || {};
  const q = (o.q || '').toLowerCase().trim();
  const types = o.types && o.types.length ? o.types : null;
  return (flights || []).filter(f => {
    const ran = !!L.flightRunAt(f, history);
    if (o.state === 'run' && !ran) return false;
    if (o.state === 'todo' && ran) return false;
    if (o.state === 'ready' && L.flightReady(f, catalog, bottles).pct < 100) return false;
    if (types) {
      // A flight matches a type when any of its core pours is that type.
      const subs = (f.core || []).map(p => catalog[p.k]).filter(Boolean).map(p => p.sub);
      if (!types.some(t => subs.indexOf(t) >= 0)) return false;
    }
    if (q) {
      const hay = (f.title + ' ' + (f.tag || '') + ' ' + (f.premise || '') + ' '
        + (f.core || []).map(p => (catalog[p.k] || {}).name || p.card).join(' '))
        .toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
};

L.sortFlights = function (flights, catalog, bottles, history, id) {
  const a = (flights || []).slice();
  const name = (x, y) => x.title.localeCompare(y.title);
  const cmp = {
    added: () => 0,      // the order they are in, which is the order made
    title: name,
    ready: (x, y) => L.flightReady(y, catalog, bottles).pct
                   - L.flightReady(x, catalog, bottles).pct || name(x, y),
    proof: (x, y) => L.flightProof(x, catalog) - L.flightProof(y, catalog) || name(x, y),
    // Never run sorts last rather than first: an empty date is not the oldest.
    run: (x, y) => (L.flightRunAt(y, history) || '').localeCompare(
                    L.flightRunAt(x, history) || '') || name(x, y)
  };
  // An old stored preference still says curriculum; treat it as the same
  // thing rather than silently falling through to the name sort.
  if (id === 'curriculum') id = 'added';
  return id === 'added' ? a : a.sort(cmp[id] || name);
};

L.useCount = function (key, flights, history) {
  let n = 0;
  (flights || []).forEach(f => f.core.forEach(p => { if (p.k === key) n++; }));
  (history || []).forEach(h => { if ((h.pours || []).includes(key)) n++; });
  return n;
};


/* --- snacks --------------------------------------------------------- */

// BZ's rule: simple bowls, not plates. No vinegar, no citrus -- both
// wreck the palate for the next pour. Suggestions follow the dominant
// cask, because that is what the snack has to sit beside.
L.SNACKS = {
  sherry: ['dark chocolate', 'dried cherries', 'salted pecans'],
  wine:   ['dark chocolate', 'dried figs', 'marcona almonds'],
  wood:   ['salted pecans', 'shortbread', 'toasted walnuts'],
  peat:   ['smoked almonds', 'aged cheddar', 'oatcakes'],
  plain:  ['plain crackers', 'salted almonds', 'shortbread']
};

L.snacksFor = function (prods) {
  const fin = prods.map(p => (p.fin || '')).join(' ').toLowerCase();
  const peated = prods.some(p => /laphroaig|ardbeg|lagavulin|octomore|peat|caol|bunnahabhain/i
    .test(p.name + ' ' + p.dist));
  if (peated) return L.SNACKS.peat;
  if (/ximenez|oloroso|sherry|fino|manzanilla|amontillado|cream/.test(fin)) return L.SNACKS.sherry;
  if (/port|madeira|moscatel|sauternes|bordeaux|rum|cognac|armagnac/.test(fin)) return L.SNACKS.wine;
  if (/oak|toasted|mizunara|amburana/.test(fin)) return L.SNACKS.wood;
  return L.SNACKS.plain;
};

/* --- SMS summary ---------------------------------------------------- */

// One identical text to everyone: the bottle list and the theme. Sent
// after the reveal, so it is the answer key people keep.
L.smsBody = function (flight, prods) {
  const lines = [flight.title, L.variableOf(flight)];
  prods.forEach((p, i) => {
    const letter = String.fromCharCode(65 + i);
    const bits = [p.name, p.fin, p.proof].filter(Boolean);
    lines.push(letter + ' \u00b7 ' + bits.join(', '));
  });
  lines.push('Snacks: ' + L.snacksFor(prods).join(', '));
  return lines.join('\n');
};

// The tag line carries "ONE VARIABLE: WHICH SHERRY" on most cards.
L.variableOf = function (flight) {
  const m = /ONE VARIABLE:\s*([^\u00b7]+)/i.exec(flight.tag || '');
  if (m) return 'One variable: ' + m[1].trim().toLowerCase();
  return (flight.tag || '').split('\u00b7').slice(-1)[0].trim();
};

/* =====================================================================
   STATE + RENDER
   ===================================================================== */
const S = { base: {}, catalog: {}, bottles: [], flights: [], history: [],
            edits: {}, custom: {}, deleted: {}, customFlights: [],
            // When this device last changed anything. Compared against the
            // account's own stamp so a first load cannot replace newer
            // local work with an older copy from the server.
            updated: 0,
            shopDim: null, shopMode: null, anyRotate: 0, gapRotate: 0,
            shopFromPage: false,
            filters: { status: 'open', favsOnly: false, wishOnly: false,
                       types: [], obsc: [], regions: [], bands: [],
                        proofs: [], scars: [], cask: '', age: '',
                        showTypes: false, showStatus: false,
                        // What arrived most recently, not what starts with
                        // a number. The shelf opened at 10th Street for
                        // 344 bottles and told nobody anything.
                        sort: 'got', showMore: false },
            refGroup: 'tasting', shop: {}, lookupUrl: '', wish: [],
            displayName: '', findable: false, matchMode: '', admin: false,
            upcs: {},
            favs: {},
            barSort: 'proof',
            log: [],
            proposals: [],
            deadGaps: {},
            // What each ask has produced, so the ones that keep coming
            // back empty sink instead of holding the top of the list.
            askStats: {},
            fflt: { state: 'all', types: [], sort: 'added',
                    showState: false, showTypes: false },
            reels: { proof: 'any', type: 'any', obsc: 'any', price: 'any' },
            held: {} };

// The effective catalog is the shipped reference data with the user's
// corrections layered on, their own bottles added, and their deletions
// hidden. Rebuilt whenever any of those three change.
function rebuildCatalog() {
  S.catalog = L.mergeCatalog(S.base, S.edits, S.custom, S.deleted);
}

const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };

const KEYS = ['history', 'edits', 'custom', 'deleted', 'customFlights',
              'bottles', 'lookupUrl', 'wish', 'displayName', 'findable',
              'admin', 'deadGaps', 'proposals', 'log', 'barSort', 'favs',
              'upcs', 'updated', 'askStats'];

// Private browsing and locked-down browsers throw on the first touch of
// localStorage. The app runs either way; it just cannot remember.
const CAN_STORE = (function () {
  try {
    localStorage.setItem('kb.probe', '1');
    localStorage.removeItem('kb.probe');
    return true;
  } catch (e) { return false; }
})();

/* Keys that would not read on the way in.

   This matters far more than it looks. A discarded key leaves S holding the
   EMPTY initial value for it — and that empty value is still treated as
   this device's copy, so a newer local stamp meant an empty bottles array
   won the comparison and was pushed over the account's good one. One
   unreadable key wiped the shelf everywhere.

   Recorded here, read by fbFirstLoad, which hands the decision to the
   account when anything was lost. */
const DISCARDED = [];

function load() {
  if (!CAN_STORE) return;
  KEYS.forEach(k => {
    try {
      const raw = localStorage.getItem('kb.' + k);
      if (!raw) return;
      const val = JSON.parse(raw);
      // One corrupt key must not take the rest of the shelf down with it, and
      // a value of the wrong shape is corruption too.
      if (typeof S[k] !== typeof val
          || Array.isArray(S[k]) !== Array.isArray(val)) throw new Error('shape');
      S[k] = val;
    } catch (e) {
      // Said out loud, not to a console nobody opens on a phone.
      DISCARDED.push(k);
      console.warn('discarding unreadable ' + k, e);
      try { localStorage.removeItem('kb.' + k); } catch (e2) { /* nothing to do */ }
    }
  });
}

let _storageWarned = false;
let _saveFailed = false;
let _pushSoon = null;
function save_() {
  // When this device last changed something. Stamped BEFORE the push, so
  // the value that goes to the account is the one the next first-load
  // compares against.
  S.updated = Date.now();
  // Every local save is also a push, so the account is never behind what is
  // on the device. The guard inside fbPush keeps it quiet when signed out.
  //
  // Coalesced: buying a bottle calls save_ once, but a screen that saves as
  // you correct a field calls it repeatedly, and each one was its own write
  // of the whole shelf. A second's wait turns a burst into one push.
  if (FB.loaded) { clearTimeout(_pushSoon); _pushSoon = setTimeout(fbPush, 1000); }
  if (FB.loaded) setTimeout(fbPushShared, 0);
  if (FB.loaded) setTimeout(fbPushStats, 0);
  if (FB.loaded) setTimeout(fbContribute, 0);
  if (!CAN_STORE) {
    if (!_storageWarned && typeof toast === 'function') {
      _storageWarned = true;
      toast('This browser will not let the app save. Changes last until you close it.');
    }
    return;
  }
  try {
    KEYS.forEach(k => localStorage.setItem('kb.' + k, JSON.stringify(S[k])));
    _saveFailed = false;
  } catch (e) {
    /* Quota, almost always. Said EVERY time, not once: a single toast an
       hour ago is not a warning when every edit since has been landing
       nowhere. The account still receives pushes, so the device and the
       account drift apart with no other signal. */
    if (typeof toast === 'function') {
      toast('Could not save on this device \u2014 storage is full. '
        + 'Back up and clear some space.');
    }
    if (!_saveFailed) appLog('local save failed: ' + ((e && e.message) || e));
    _saveFailed = true;
    console.warn('save failed', e);
  }
}

/* Another tab of this app changed something.

   Two tabs each hold their own S, and neither saw the other's writes: tab B
   would save its stale copy straight over tab A's work, and the newer stamp
   made it win the account comparison too. BZ has this open on a desktop and
   a phone, and two desktop tabs is the same thing with a shorter fuse.

   The rule is the one already used for the account: whoever is newer wins,
   and here the other tab always is — it just wrote. */
let _tabDraw = null;
let _tabTook = [];
if (CAN_STORE) {
  window.addEventListener('storage', ev => {
    if (!ev.key || ev.key.indexOf('kb.') !== 0) return;
    const k = ev.key.slice(3);
    if (KEYS.indexOf(k) < 0) return;

    /* NOT the log. It is this tab's own diary, and it is the one key whose
       adoption writes another key — appLog puts kb.log straight into
       localStorage, which the other tab then sees as a change to adopt,
       which makes it log, which this tab then sees.

       Two tabs open turned that into a loop with no end: hundreds of
       "another tab changed log; took its copy", each one redrawing every
       screen, so nothing could be clicked because the DOM was being
       rebuilt underneath the pointer and the nav went with it. */
    if (k === 'log') return;
    /* Nor `updated`, which is a stamp rather than content: every save in
       the other tab writes it, so adopting it redrew every screen for a
       number that says nothing about what is on the shelf. */
    if (k === 'updated') return;

    try {
      const val = JSON.parse(ev.newValue);
      if (typeof S[k] !== typeof val
          || Array.isArray(S[k]) !== Array.isArray(val)) return;
      S[k] = val;
    } catch (e) { return; }

    /* One redraw for the burst, not one per key. save_ writes all eighteen
       keys, so a single change in the other tab arrived here as eighteen
       storage events and eighteen full redraws of every screen. */
    if (_tabTook.indexOf(k) < 0) _tabTook.push(k);
    clearTimeout(_tabDraw);
    _tabDraw = setTimeout(() => {
      appLog('another tab changed ' + _tabTook.join(', ') + '; took its copy');
      _tabTook = [];
      rebuildCatalog();
      renderShelf(); renderShelfFilters(); renderHome();
      renderFlights(); renderPayline();
    }, 250);
  });
}

// Read order: your override, then the shared catalog. The UI shows which
// layer a value came from so you always know what you are trusting.
function prod(k) { return S.catalog[k] || null; }

/* --- the back gesture --------------------------------------------------

   A phone's back swipe closed the app outright, because nothing here ever
   pushed a history entry: every screen change and every modal happened
   without the browser knowing anything had changed.

   Both now push one, so back closes a modal, then walks back through the
   screens you came by, and only leaves the app when there is nothing left
   to go back to — which is what the gesture should do at the front door.  */

let _navBack = false;      // true while handling a back, so we do not re-push

/* Where each screen came FROM, so its Back goes there rather than to a
   fixed guess. A screen off the tab bar — the library, buddies, settings,
   a bottle — can be reached from several places, and "Done" that always
   lands on Home sends you back to the start of what you were doing. */
const _from = [];

function goBack() {
  const prev = _from.pop();
  show(prev || 'home', true);
  labelBacks();
}

// Every screen needs a header to hang the control on. Three had none.
// Say where Back goes. "Done" is fine when there is one way in and wrong
// the moment there are several — a bottle reached from the library should
// not offer to send you to the shelf.
// These are printed on a BUTTON, never inside a sentence, so they are
// capitalised like every other label in the app. Half of them read as
// mid-sentence fragments next to Home and Flights.
const SCREEN_NAMES = { home: 'Home', shelf: 'The shelf', shop: 'Shop',
  pour: 'Taste', flights: 'Flights', map: 'The map', ref: 'Info',
  library: 'The library', buddies: 'Buddies', shared: 'Our shelves',
  settings: 'Settings', diag: 'Diagnostics', detail: 'The bottle' };

// A back control on any screen with a trail behind it, inserted into the
// header if that screen has no button of its own.
function ensureBack(name) {
  const scr = document.getElementById('scr-' + name);
  if (!scr) return;
  // The bottle screen uses .detail-acts rather than .hdr — its own row that
  // already holds the back control — so look for either.
  const hdr = scr.querySelector('.hdr') || scr.querySelector('.detail-acts');
  if (!hdr) return;
  let b = hdr.querySelector('.backbtn');
  if (!b) {
    b = el('button', 'btn btn-sm ghost backbtn');
    b.type = 'button';
    b.onclick = goBack;
    hdr.insertBefore(b, hdr.firstChild);
  }
  // Shown on every screen except Home. A tab has the bar, but the bar goes
  // to a tab and never BACK — and a control that is on six screens and
  // missing from the seventh is one somebody has to think about. Home is
  // the exception because Back to Home on Home is a lie.
  b.hidden = name === 'home';
}

function labelBacks() {
  // Where it goes: the screen you came from, or Home when you arrived by
  // the bar and there is no trail.
  const to = _from.length ? _from[_from.length - 1] : 'home';
  const txt = '\u2039 ' + (SCREEN_NAMES[to] || 'Home');
  // Found by class rather than by a list of ids — a list is a thing to
  // forget to add to, and the library button was missing from it.
  document.querySelectorAll('.backbtn').forEach(b => { b.textContent = txt; });
}

// Remember where we are before leaving it.
function goTo(name) {
  const cur = document.querySelector('.screen.on');
  const id = cur && cur.id ? cur.id.replace('scr-', '') : 'home';
  if (id !== name) _from.push(id);
  show(name);
  labelBacks();
}

// Escape, for a desktop with no back gesture. Closes a modal first, then
// walks back a screen — the same order the gesture uses, so the two
// behave alike rather than being two different ideas of back.
window.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if ($('#overlay').classList.contains('on')) { closeModal(); return; }
  const cur = document.querySelector('.screen.on');
  const id = cur && cur.id ? cur.id.replace('scr-', '') : 'home';
  // Only from a screen you had to go INTO. Escape on a tab should do
  // nothing rather than quietly moving somebody off it.
  if (!document.querySelector('nav button[data-scr="' + id + '"]')) goBack();
});

window.addEventListener('popstate', ev => {
  _navBack = true;
  try {
    // A modal open at the moment of a back is what the back was for.
    if ($('#overlay').classList.contains('on')) {
      closeModal(true);
      return;
    }
    const st = ev.state;
    if (st && st.kb === 'screen' && st.scr) {
      show(st.scr);
      return;
    }
    // No state of ours left: this is the entry the app started on, so
    // going back means going home. From home, the next back leaves.
    const onHome = document.getElementById('scr-home');
    if (onHome && !onHome.classList.contains('on')) {
      show('home');
      // Replace rather than push, or home would need pressing twice.
      try { history.replaceState({ kb: 'screen', scr: 'home' }, ''); } catch (e) {}
    }
  } finally {
    _navBack = false;
  }
});

function show(name, isReturn) {
  const t = document.getElementById('scr-' + name);
  // A name with no screen behind it used to clear every screen and then
  // add the class to nothing, leaving a nav bar and a blank page. Refuse
  // rather than blank: a wrong name is a bug, and a blank page hides it.
  if (!t) {
    appLog('show: no screen called ' + name);
    return;
  }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  t.classList.add('on');
  // Not while going back, or every back would add a new entry and the
  // gesture would never reach the front door.
  if (!_navBack) {
    try { history.pushState({ kb: 'screen', scr: name }, ''); } catch (e) {}
  }
  // Arriving by the tab bar starts a fresh trail: the tabs are top level,
  // and a Back from one should not walk somebody through wherever they
  // happened to have been before pressing it.
  if (!isReturn && !_navBack
      && document.querySelector('nav button[data-scr="' + name + '"]')) {
    _from.length = 0;
  }
  // The action chips live in the masthead, which every screen shares, but
  // they belong to Home. Shown there and nowhere else.
  const acts = document.getElementById('homeActions');
  if (acts) acts.hidden = name !== 'home';

  // Every screen gets a back control when there is somewhere to go back to.
  // A tab has none by default because the bar is always there — but a tab
  // reached from somewhere else (Pour from the Home chip, Shop from a
  // suggestion, Shelf from a chart) is a dead end, because the bar takes
  // you to a tab and never back to where you were.
  ensureBack(name);

  // AFTER the trail is settled, or a tab arrival would label the button
  // with wherever you were before pressing it. And on every arrival however
  // the screen was reached — it used to run only inside goTo, so a screen
  // opened any other way kept whatever its button said last, which was
  // "Done": the thing this was meant to replace.
  labelBacks();
  // Settings and Detail are reached from inside the app rather than the bar,
  // so no tab is marked current while they are open.
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.scr === name ? 'page' : 'false'));
  window.scrollTo(0, 0);
}

/* --- shelf ---------------------------------------------------------- */
const STATUS_FILTERS = [['open', 'Open'], ['sealed', 'Sealed'], ['all', 'All']];

// A favourite is a property of the WHISKY rather than of a bottle: three
// bottles of the same thing are one favourite, and it survives finishing
// one and opening the next.
function isFav(k) { return !!(S.favs || {})[k]; }

function toggleFav(k, after) {
  if (!S.favs) S.favs = {};
  if (S.favs[k]) delete S.favs[k]; else S.favs[k] = 1;
  save_();
  if (after) after();
}

function favStar(k, after) {
  const b = el('button', 'favstar');
  b.type = 'button';
  b.textContent = isFav(k) ? '\u2605' : '\u2606';
  b.dataset.on = isFav(k);
  b.title = isFav(k) ? 'A favourite' : 'Mark as a favourite';
  b.setAttribute('aria-label', b.title);
  b.setAttribute('aria-pressed', isFav(k));
  b.onclick = ev => { ev.stopPropagation(); toggleFav(k, after); };
  return b;
}

function renderShelfFilters() {
  const counts = countOf('sub');
  const owned = k => Object.values(S.catalog).filter(p => {
    const n = L.ownedCount(p.k, S.bottles);
    if (!n) return false;
    const open = L.pourable(p.k, S.bottles);
    return k === 'all' || (k === 'open' ? open : !open);
  }).length;

  pickList({
    btnId: 'statusPick', listId: 'statusList', single: true,
    value: S.filters.status, allValue: 'open', allLabel: 'Open',
    open: S.filters.showStatus,
    options: STATUS_FILTERS.map(([v, label]) => [v, label, owned(v)]),
    onPick: v => { S.filters.status = v; S.filters.showStatus = false;
      renderShelfFilters(); renderShelf(); }
  });

  // Favourites as a status rather than a fourth control: you are either
  // looking at everything, or at the ones you keep coming back to.
  const nFav = Object.keys(S.favs || {})
    .filter(k => S.catalog[k] && L.ownedCount(k, S.bottles)).length;
  const favBtn = document.getElementById('favFilter');
  if (favBtn) {
    favBtn.hidden = !nFav;
    favBtn.textContent = '\u2605 ' + nFav;
    favBtn.dataset.on = !!S.filters.favsOnly;
    favBtn.title = S.filters.favsOnly ? 'Showing favourites only'
      : 'Show favourites only';
    favBtn.onclick = () => {
      S.filters.favsOnly = !S.filters.favsOnly;
      save_(); renderShelfFilters(); renderShelf();
    };
  }

  // The wishlist, on the shelf, because what you want and what you have are
  // the same question asked twice — and until now there was no screen that
  // listed it at all: seventeen references to the data and nowhere to see
  // it, reachable only by typing a name into Shop that you did not own.
  const wishBtn = document.getElementById('wishFilter');
  if (wishBtn) {
    const nWish = (S.wish || []).length;
    wishBtn.hidden = !nWish;
    wishBtn.textContent = 'Wanted ' + nWish;
    wishBtn.dataset.on = !!S.filters.wishOnly;
    wishBtn.onclick = () => {
      S.filters.wishOnly = !S.filters.wishOnly;
      if (S.filters.wishOnly) S.filters.favsOnly = false;
      save_(); renderShelfFilters(); renderShelf();
    };
  }

  pickList({
    btnId: 'typePick', listId: 'typeList',
    value: S.filters.types, allLabel: 'All types', plural: 'types',
    open: S.filters.showTypes,
    options: Object.keys(counts)
      .sort((a, b) => counts[b] - counts[a] || a.localeCompare(b))
      .map(t => [t, L.titleCase(t), counts[t]]),
    onAll: () => { S.filters.types = []; renderShelfFilters(); renderShelf(); },
    onPick: t => {
      const i = S.filters.types.indexOf(t);
      if (i < 0) S.filters.types.push(t); else S.filters.types.splice(i, 1);
      renderShelfFilters(); renderShelf();
    }
  });

  const sel = $('#sortSel');
  if (!sel.options.length) {
    L.SORTS.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.label;
      sel.appendChild(o);
    });
    sel.onchange = () => { S.filters.sort = sel.value; renderShelf(); };
  }
  sel.value = S.filters.sort;

  /* The headers and the Sort menu are two controls over ONE value, so they
     are painted from that value in the same place. Two painters is how a
     menu and a header end up disagreeing about what the list is sorted by. */
  document.querySelectorAll('#scr-shelf .sorthead').forEach(h => {
    const col = h.dataset.col;
    const mark = L.sortMark(col, S.filters.sort);
    h.dataset.on = !!mark;
    h.setAttribute('aria-pressed', !!mark);
    h.textContent = h.dataset.label || (h.dataset.label = h.textContent.trim());
    if (mark) {
      const m = el('span', 'mk', mark);
      h.appendChild(m);
    }
    h.onclick = () => {
      S.filters.sort = L.nextSort(col, S.filters.sort);
      renderShelfFilters(); renderShelf();
    };
  });

  const n = L.activeFacets(S.filters);
  const more = $('#moreBtn');
  more.textContent = n ? 'Filters \u00b7 ' + n : 'More filters';
  more.dataset.on = n > 0;
  renderMoreFilters();
}

// One pick-list control, reused wherever a row of chips was taller than the
// list it was filtering. opts.single makes it a one-of-many chooser.
function pickList(o) {
  const btn = document.getElementById(o.btnId);
  const box = document.getElementById(o.listId);
  const chosen = o.single ? [o.value] : o.value;
  const label = o.single
    ? (o.options.find(x => x[0] === o.value) || [null, o.allLabel])[1]
    : (!chosen.length ? o.allLabel
       : chosen.length === 1 ? (o.options.find(x => x[0] === chosen[0]) || [0, chosen[0]])[1]
       : chosen.length + ' ' + (o.plural || 'selected'));
  btn.textContent = label;
  btn.dataset.on = o.single ? (o.value !== o.allValue) : chosen.length > 0;
  btn.setAttribute('aria-expanded', !!o.open);

  box.hidden = !o.open;
  if (box.hidden) return;
  box.innerHTML = '';
  if (!o.single) {
    const all = el('button', 'pickrow' + (chosen.length ? '' : ' on'), o.allLabel);
    all.setAttribute('role', 'option');
    all.onclick = () => o.onAll();
    box.appendChild(all);
  }
  o.options.forEach(([v, text, n]) => {
    const on = o.single ? o.value === v : chosen.indexOf(v) >= 0;
    const r = el('button', 'pickrow' + (on ? ' on' : ''));
    r.setAttribute('role', 'option');
    r.setAttribute('aria-selected', on);
    r.appendChild(el('span', 'tick', on ? '\u2713' : ''));
    r.appendChild(el('span', 'lbl', text));
    r.appendChild(el('span', 'num', n === undefined || n === null ? '' : String(n)));
    r.onclick = () => o.onPick(v);
    box.appendChild(r);
  });
}

// Count the shelf by any field, so a chip can carry how many it would show.
function countOf(field) {
  const c = {};
  Object.values(S.catalog).forEach(p => {
    const v = p[field];
    if (v === null || v === undefined || v === '') return;
    c[v] = (c[v] || 0) + 1;
  });
  return c;
}

// One multi-select chip row. counts may be a map of value -> n, or a list of
// [value, label, n] when the value is not the label.
function facetChips(box, key, counts, opts) {
  const o = opts || {};
  box.innerHTML = '';
  const arr = Array.isArray(counts) ? counts
    : Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b))
        .map(v => [v, L.titleCase(v), counts[v]]);
  if (o.allLabel) {
    const all = el('button', 'chip', o.allLabel);
    all.setAttribute('aria-pressed', S.filters[key].length === 0);
    all.onclick = () => {
      S.filters[key] = [];
      // Back to the tiles when nothing is filtered any more: clearing the
      // last filter is asking to start again, and a bare list of 325 is
      // the wall the tiles exist to avoid.
      if (!L.activeFacets(S.filters)) S.shelfSub = null;
      renderShelfFilters(); renderShelf();
    };
    box.appendChild(all);
  }
  arr.forEach(([v, label, n]) => {
    if (!n) return;
    // A colon, or "Islay 39" reads as a name with a number in it and
    // "90-99 103" reads as one long number.
    const b = el('button', 'chip', label + ': ' + n);
    b.setAttribute('aria-pressed', S.filters[key].indexOf(v) >= 0);
    b.onclick = () => {
      const i = S.filters[key].indexOf(v);
      if (i < 0) S.filters[key].push(v); else S.filters[key].splice(i, 1);
      renderShelfFilters(); renderShelf();
    };
    box.appendChild(b);
  });
}

function renderMoreFilters() {
  const box = $('#moreFilters');
  box.hidden = !S.filters.showMore;
  $('#moreBtn').setAttribute('aria-expanded', !!S.filters.showMore);
  if (!S.filters.showMore) return;
  box.innerHTML = '';

  const section = (title, build) => {
    const f = el('div', 'facet');
    f.appendChild(el('div', 'fh', title));
    const row = el('div', 'scroller');
    build(row);
    f.appendChild(row);
    box.appendChild(f);
  };

  const all = Object.values(S.catalog);
  const tally = fn => {
    const c = {};
    all.forEach(p => { const v = fn(p); if (v) c[v] = (c[v] || 0) + 1; });
    return c;
  };

  section('Proof', row => facetChips(row, 'proofs',
    L.proofTens(S.catalog, S.bottles)));
  section('Recognition', row => facetChips(row, 'obsc',
    ['known', 'niche', 'obscure'].map(v => [v, L.titleCase(v), tally(p => p.obsc)[v] || 0])));
  section('Occasion', row => facetChips(row, 'bands',
    ['everyday', 'good', 'special', 'vault']
      .map(v => [v, L.titleCase(v), tally(p => L.priceBand(p.msrp))[v] || 0])));
  section('Release', row => facetChips(row, 'scars',
    ['standard', 'batched', 'limited', 'exclusive']
      .map(v => [v, L.titleCase(v), tally(p => p.scar)[v] || 0])));
  const regions = tally(p => p.region);
  if (Object.keys(regions).length) {
    section('Scotch region', row => facetChips(row, 'regions',
      L.SCOTCH_REGIONS.map(v => [v, v, regions[v] || 0])));
  }

  // Cask and age are one-of-three, not multi-select: wine and wood-only are
  // mutually exclusive by definition.
  section('Cask', row => {
    [['', 'Any'], ['wine', 'Wine cask'], ['wood', 'Wood only'], ['none', 'No finish']]
      .forEach(([v, label]) => {
        const b = el('button', 'chip', label);
        b.setAttribute('aria-pressed', (S.filters.cask || '') === v);
        b.onclick = () => { S.filters.cask = v; renderShelfFilters(); renderShelf(); };
        row.appendChild(b);
      });
  });
  section('Age', row => {
    [['', 'Any'], ['stated', 'Age stated'], ['nas', 'No age stated']]
      .forEach(([v, label]) => {
        const b = el('button', 'chip', label);
        b.setAttribute('aria-pressed', (S.filters.age || '') === v);
        b.onclick = () => { S.filters.age = v; renderShelfFilters(); renderShelf(); };
        row.appendChild(b);
      });
  });

  const cr = el('div', 'clearrow');
  cr.appendChild(el('span', null, L.activeFacets(S.filters) + ' filters on'));
  const clear = el('button', 'chip', 'Clear all');
  clear.onclick = () => {
    ['types', 'obsc', 'regions', 'bands', 'proofs', 'scars']
      .forEach(k => { S.filters[k] = []; });
    S.filters.cask = ''; S.filters.age = '';
    renderShelfFilters(); renderShelf();
  };
  cr.appendChild(clear);
  box.appendChild(cr);
}

// counts: the key-to-count map, built ONCE by the caller and handed down.
// renderShelf needs the same map for its tiles, its totals and its value
// line, so building it here as well would be the same walk twice.
/* The tag on a bottle you cannot simply pick up IS the way to go looking
   for it. A hunt and an allocated release are exactly the rows where the
   question "where do I actually get this" arrives, and the tag is already
   sitting there saying so. On the shelf it stays a label: there is nothing
   to hunt for. */
function findTag(find, name, dist) {
  const url = (find === 'hunt' || find === 'allocated')
    ? L.findUrl(name, dist) : null;
  const label = L.FIND_LABEL[find] || L.FIND_UNKNOWN;
  if (!url) return el('span', 'findtag f-' + find, label);
  const b = el('button', 'findtag f-' + find + ' findable', label);
  b.type = 'button';
  b.title = 'Search for somewhere selling ' + name;
  b.onclick = ev => {
    // The row underneath opens the bottle; this is a different question.
    ev.stopPropagation();
    window.open(url, '_blank', 'noopener');
  };
  return b;
}

function shelfRows(index) {
  const all = Object.keys(S.catalog).map(prod).filter(Boolean);
  const opts = Object.assign({}, S.filters, { q: $('#q').value });
  const ix = index || L.shelfIndex(S.bottles);
  const own = ix.counts;
  let hits = L.shelfSort(L.shelfFilter(all, S.bottles, opts, ix),
    S.filters.sort, S.bottles);
  // Applied here rather than inside shelfFilter: favourites are the user's
  // own marks and live in S, while shelfFilter is a pure function over a
  // catalogue and bottles, and giving it a dependency on state it cannot
  // see would make it untestable.
  if (S.filters.favsOnly) hits = hits.filter(p => isFav(p.k));
  return hits.map(p => ({ p, open: L.pourable(p.k, S.bottles),
                          owned: own[p.k] || 0 }));
}

function renderShelf() {
  const list = $('#shelfList'); list.innerHTML = '';
  /* How many of each and which are open, once, for the whole redraw. It was
     ownedCount AND pourable per product — 325 products against 344 bottles,
     111,800 comparisons each, about 65ms on a phone — and then again for
     the tiles, the totals and the shelf value. Two passes over 344. */
  const ix = L.shelfIndex(S.bottles);
  const own = ix.counts;

  // Wishes are not on the shelf — that is the point of them — so they are
  // not in the catalogue and cannot be filtered out of it. They get their
  // own rows: a name, why you want it, and the flight it would unlock.
  if (S.filters.wishOnly) {
    const wl = (S.wish || []).slice()
      .sort((a, b) => String(b.added).localeCompare(String(a.added)));
    $('#shelfCount').textContent = wl.length + ' wanted';
    if (!wl.length) {
      list.appendChild(el('div', 'empty',
        'Nothing on the list. Search for a bottle in Shop and mark it '
        + 'wanted when you do not own it.'));
      return;
    }
    wl.forEach(w => {
      const r = el('button', 'item');
      const left = el('div');
      left.appendChild(el('div', 'nm oneline', w.name));
      const why = [w.reason, w.forFlight ? 'for ' + L.sentenceCase(w.forFlight)
        : null].filter(Boolean).join(' \u00b7 ');
      if (why) left.appendChild(el('div', 'sub', why));
      r.appendChild(left);
      if (w.est) r.appendChild(el('div', 'pf', '$' + w.est));
      // Bought is the end of wanting: it opens Shop with the name in, so
      // the lookup and the add are the next thing rather than a search
      // somebody has to retype.
      const got = el('button', 'chip pourglass', 'Got it');
      got.onclick = ev => {
        ev.stopPropagation();
        openShopFor(w.name);
      };
      r.appendChild(got);
      /* Three answers, not one.

         Tapping the row went straight to "delete this, it cannot be
         undone" — the least likely of the things you might mean. Looking
         at a bottle you want, the first thought is usually to go and look
         at it, and the second is that you have gone off it. */
      r.onclick = () => openModal(w.name, m => {
        if (why) m.appendChild(el('div', 'sub', why));
        const go = el('button', 'btn wide btn-gold', 'Take me to it');
        go.style.marginTop = '10px';
        go.onclick = () => {
          closeModal();
          openShopFor(w.name);
        };
        m.appendChild(go);
        const drop = el('button', 'btn ghost wide danger', 'Off the list');
        drop.onclick = () => {
          closeModal();
          const removed = w;
          S.wish = L.wishRemove(S.wish, w.name);
          save_(); renderShelfFilters(); renderShelf();
          toast('Off the list', { label: 'Undo', action: () => {
            S.wish = L.wishAdd(S.wish, removed);
            save_(); renderShelfFilters(); renderShelf();
          } });
        };
        m.appendChild(drop);
        const no = el('button', 'btn ghost wide', 'Cancel');
        no.onclick = closeModal;
        m.appendChild(no);
      });
      list.appendChild(r);
    });
    return;
  }

  // Tiles as the way in, the same as the library. 325 rows beginning at
  // 10th Street is a wall; the types are how somebody actually thinks about
  // what they own. Only when nothing is searched and nothing is filtered —
  // once you have narrowed, you want the list.
  const untouched = !$('#q').value.trim() && !L.activeFacets(S.filters)
    && !S.filters.favsOnly;
  // Tiles or list: the sort control and the column labels only mean
  // something once there is a list under them.
  $('#scr-shelf').classList.toggle('listing',
    !(untouched && S.shelfSub !== 'all'));
  if (untouched && S.shelfSub !== 'all') {
    const by = {};
    Object.keys(S.catalog).forEach(k => {
      if (!own[k]) return;
      const sub = S.catalog[k].sub || 'other';
      by[sub] = (by[sub] || 0) + 1;
    });
    const total = Object.values(by).reduce((a, b) => a + b, 0);
    const tiles = el('div', 'tiles');
    Object.entries(by).sort((a, b) => b[1] - a[1]).forEach(([sub, n]) => {
      const t = el('button', 'tile');
      t.appendChild(el('div', 'v', String(n)));
      t.appendChild(el('div', 'l', L.titleCase(sub)));
      t.onclick = () => {
        S.filters.types = [sub];
        save_(); renderShelfFilters(); renderShelf();
      };
      tiles.appendChild(t);
    });
    list.appendChild(tiles);
    const all = el('button', 'chip', 'All ' + total + ' \u2014 as a list');
    all.style.marginTop = '11px';
    all.onclick = () => { S.shelfSub = 'all'; renderShelf(); };
    list.appendChild(all);
    $('#shelfCount').textContent = total + ' whiskies';
    const sum0 = document.getElementById('shelfSum');
    if (sum0) sum0.textContent = Object.keys(by).length + ' types';
    return;
  }

  // The way back. Going to the list set a flag with nothing to unset it,
  // so the tiles were a screen you could leave and not return to.
  if (S.shelfSub === 'all' || L.activeFacets(S.filters)) {
    const back = el('button', 'chip', '\u2039 All types');
    back.style.marginBottom = '9px';
    back.onclick = () => {
      S.shelfSub = null;
      S.filters.types = [];
      $('#q').value = '';
      save_(); renderShelfFilters(); renderShelf();
    };
    list.appendChild(back);
  }

  const rows = shelfRows(ix);
  // Against what you OWN, not against the catalogue. The catalogue now
  // holds library entries you have never bought, so "326 of 328" was
  // comparing your shelf to somebody else's additions and inviting exactly
  // the question of where three bottles had gone.
  const ownedAll = Object.keys(S.catalog).filter(k => own[k]).length;
  $('#shelfCount').textContent = rows.length === ownedAll
    ? ownedAll + ' whiskies'
    : rows.length + ' of ' + ownedAll;

  // What the shelf adds up to, which the screen never said: how many
  // bottles behind those whiskies, how many are open, and what they cost.
  const sum = document.getElementById('shelfSum');
  if (sum) {
    const keys = rows.map(r => r.p.k);
    const mine = keys.reduce((acc, k) => acc.concat(L.myBottles(k, S.bottles)), []);
    const open = mine.filter(L.isOpen).length;
    // Only 3 of 344 bottles here carry a real price — the rest are zero,
    // which is not a price. Totalling those as spent would put a confident
    // figure on screen that is wrong by two orders of magnitude, so the
    // total appears only when most bottles actually have one, and says how
    // many it is counting when they do not.
    // The same mistake as the Price column, in a second place I did not
    // check when I fixed the first. It summed b.paid — what you actually
    // paid, which one bourbon carries — and reported $199 across 1 with a
    // price while 129 of them have a price sitting in p.msrp.
    //
    // What it is worth is the useful number, from msrp, and what you paid
    // stands beside it when enough bottles carry it to mean anything.
    const worth = keys.reduce((a, k) => {
      const p = S.catalog[k];
      return a + (p && p.msrp ? p.msrp * (own[k] || 0) : 0);
    }, 0);
    const priced = mine.filter(b => typeof b.paid === 'number' && b.paid > 0);
    const spent = priced.reduce((a, b) => a + b.paid, 0);
    sum.textContent = [
      mine.length + (mine.length === 1 ? ' bottle' : ' bottles'),
      open + ' open',
      mine.length - open ? (mine.length - open) + ' sealed' : null,
      worth ? '$' + Math.round(worth).toLocaleString() + ' at list' : null,
      // Only when it is most of them; one bottle's price is not a total.
      priced.length >= mine.length / 2
        ? '$' + spent.toLocaleString() + ' paid' : null
    ].filter(Boolean).join('  \u00b7  ');
  }
  if (!rows.length) {
    // A favourites filter with nothing behind it is a specific dead end
    // and deserves its own line rather than "nothing matches".
    if (S.filters.favsOnly) {
      list.appendChild(el('div', 'empty',
        'No favourites match. Tap a star on a bottle to mark one.'));
      return;
    }
    const n = L.activeFacets(S.filters);
    // An empty shelf is not a failed search. The Flights empty state is
    // the pattern that works: say what the screen is for and offer the way
    // in, rather than leaving somebody to find a gear.
    if (!(S.bottles || []).length) {
      const e = el('div', 'sheet');
      e.appendChild(el('h3', null, 'Nothing here yet'));
      e.appendChild(el('div', 'sub',
        'Anything already in the shared library arrives with its proof, '
        + 'cask and tasting notes \u2014 you only type what it has never '
        + 'seen.'));
      const imp = el('button', 'btn wide btn-gold', 'Import a collection');
      imp.style.marginTop = '10px';
      imp.onclick = () => importDialog();
      e.appendChild(imp);
      const one = el('button', 'btn wide', 'Add one bottle');
      one.style.marginTop = '9px';
      one.onclick = () => { show('shop'); $('#shopQ').focus(); };
      e.appendChild(one);
      list.appendChild(e);
      return;
    }
    list.appendChild(el('div', 'empty', n
      ? 'Nothing matches those ' + n + ' filters.'
      : 'Nothing matches. Clear the search or switch to All.'));
    return;
  }
  rows.forEach(({ p, open, owned }) => {
    const b = el('button', 'item ' + typeClass(p) + (open ? '' : ' sealed'));
    const left = el('div');
    const nm = el('div', 'nm'); nm.innerHTML = '<span class="dot"></span>';
    nm.appendChild(document.createTextNode(p.name));
    left.appendChild(nm);
    // YOUR facts, not the whisky's. Proof and type are in the library and
    // on the bottle screen; what you paid, how many you have and whether
    // any of them are open are true only of your shelf, and were the three
    // things the row did not say.
    const mine = L.myBottles(p.k, S.bottles);
    const paid = L.paidFor(p.k, S.bottles);
    const sealed = mine.filter(L.isSealed).length;
    // The count and the status have columns of their own now, so the
    // sub-line is the distillery again.
    left.appendChild(el('div', 'sub', p.dist || ''));
    b.appendChild(left);
    b.appendChild(el('div', 'ty', L.titleCase(p.style || p.sub)));

    // Columns, on every row, present whether or not they have a value.
    // Hiding a column when it says nothing is why these looked missing:
    // only 14 of 325 whiskies have more than one bottle and only 3 carry a
    // price, so on 311 rows there was nothing there at all and no way to
    // tell an empty value from an absent feature. A dash says the field
    // exists and is blank, which is a fact worth showing.
    b.appendChild(el('div', 'pf', String(p.proof || '\u2014')));

    // Two different prices, and I built this on the wrong one. p.msrp is
    // what the bottle costs and every one of the 325 has it; b.paid is what
    // YOU paid and three bottles carry it. The column read Paid, ran off
    // paid, and so showed a dash on every row — and I then wrote three
    // changelog entries explaining why the data was missing.
    //
    // What you paid wins when it is known, because it is the truer number
    // for your shelf; the price stands in when it is not.
    const cost = el('div', 'pf money');
    if (paid) {
      cost.textContent = '$' + Math.round(paid.avg);
      cost.title = paid.n > 1
        ? 'Average of ' + paid.n + ' you paid' : 'What you paid';
    } else if (p.msrp) {
      cost.textContent = '$' + Math.round(p.msrp);
      cost.title = 'Price \u2014 you have not recorded what you paid';
      cost.classList.add('msrp');
    } else {
      cost.textContent = '\u2014';
    }
    b.appendChild(cost);

    // How many, and how they stand. One open bottle is the normal case and
    // still gets a column, because a row that sometimes has one and
    // sometimes does not is harder to read than one that always does.
    const have = el('div', 'pf have');
    have.textContent = owned + (sealed ? ' \u00b7 ' + sealed + 's' : '');
    have.title = owned + (owned === 1 ? ' bottle' : ' bottles')
      + (sealed ? ', ' + sealed + ' sealed' : ', all open');
    if (!open) have.classList.add('allsealed');
    b.appendChild(have);
    // One tap, where the bottle already is. Only on what is open — you
    // cannot pour a sealed one without opening it first.
    // An icon, not a chip. "Poured" as a word wrapped the row onto a second
    // line for every open bottle, which is 300 extra lines on this shelf.
    b.appendChild(favStar(p.k, () => { renderShelfFilters(); renderShelf(); }));
    // A sealed bottle had no action on the row at all — Pour appeared only
    // on what was already open, and opening one was reachable only from the
    // bottle screen. Pouring from a sealed bottle IS opening it, so the row
    // says Open and does both.
    if (open) {
      b.appendChild(pourIcon(p.k, renderShelf));
    } else {
      const op = el('button', 'chip pourglass');
      op.type = 'button';
      op.textContent = 'Open';
      op.title = 'Open this bottle and log a pour';
      op.onclick = ev => {
        ev.stopPropagation();
        openSealed(p.k, () => { renderShelfFilters(); renderShelf(); });
      };
      b.appendChild(op);
    }
    b.onclick = () => showBottle(p.k);
    list.appendChild(b);
  });
}

/* --- bottle detail -------------------------------------------------- */
// The detail action row, cleared back to just Back. Whichever screen is
// opening then adds its own buttons to it.
function detailActs() {
  const row = $('#detailActs');
  while (row.children.length > 1) row.removeChild(row.lastChild);
  return row;
}

function showBottle(k) {
  S.lastList = 'shelf';
  const p = prod(k);
  const body = $('#detailBody'); body.innerHTML = '';

  // Actions go on the row that already holds Back, so the whole header is
  // one line rather than a button stranded above a row of buttons.
  /* The controls are BUILT here and PLACED by section below.

     Nine of them sat in one row at the top: Find it, Favourite, Poured,
     Edit, Tasting notes, Look up the cask, Another bottle, Delete, and the
     back button. On a phone that wrapped to three rows of chips above the
     bottle you came to look at, and every one of them belonged to a
     different part of the screen. Each now sits under the thing it acts
     on, and the top row holds the way back and nothing else. */
  const acts = detailActs();
  const _act = {};
  // Where to get another one. One link with the name already in it, which
  // is the whole of what the app can add — the name is the fiddly part and
  // the app is holding it.
  const findUrl = L.findUrl(p.name, p.dist);
  if (findUrl) {
    const find = el('button', 'btn btn-sm ghost', 'Find it');
    find.title = 'Search for somewhere selling it';
    find.onclick = () => window.open(findUrl, '_blank', 'noopener');
    _act.find = find;
  }
  // The same one-tap pour as the shelf row, gold because on a bottle
  // screen it is the likeliest thing you came to do.
  const fav = el('button', 'btn btn-sm', isFav(k) ? '\u2605 Favourite'
    : '\u2606 Favourite');
  fav.onclick = () => toggleFav(k, () => showBottle(k));
  _act.fav = fav;

  if (L.pourable(k, S.bottles)) {
    const pb = el('button', 'btn btn-sm btn-gold', 'Pour it');
    pb.onclick = () => pourNow(k, { after: () => showBottle(k) });
    _act.pb = pb;
  }
  const editBtn = el('button', 'btn btn-sm ghost', 'Edit');
  editBtn.onclick = () => productForm(p);
  _act.editBtn = editBtn;
  /* No notes button here. The tasting-notes card carries its own "Add
     tasting notes" / "Edit tasting notes", and this one opened the same
     form — the same action twice on one screen, in two places, under two
     names. The card's copy is the one that stayed, because it sits on the
     notes it edits. */

  /* One bottle, looked up on its own.

     Until now the only way to fill anything in was the whole-shelf run,
     which is 170 lookups when what you wanted was this one. It uses the
     same parse and the same diff, so it can never write something the bulk
     run would not have, and it never overwrites: a note you wrote stays,
     and only a flight-card prompt gives way. Absent when there is nothing
     missing, and absent when there is no lookup service to ask. */
  /* One lookup, two buttons, each writing only its own half.

     It asks about that one bottle, uses the same parse and the same diff as
     the whole-shelf run so it can never write something that run would not
     have, and it never overwrites: a note you wrote stays, and only a
     flight-card prompt gives way. Absent when nothing is missing, and
     absent when there is no lookup service to ask. */
  const lookUp = (which, btn, missing) => async () => {
    btn.disabled = true;
    const was = btn.textContent;
    btn.textContent = 'Asking\u2026';
    try {
      const raw = await askLookup(p.name);
      const res = L.parseLookup(raw, { needIdentity: false });
      const take = L.takeFor(res ? L.enhanceDiff(p, res) : null, which);
      if (take) {
        S.edits[k] = Object.assign({}, S.edits[k], take);
        if (take.tn) S.edits[k].tnSrc = 'model';
        save_(); rebuildCatalog(); showBottle(k); renderShelf();
        toast('Filled in ' + Object.keys(take)
          .filter(f => f !== 'tnFrom').join(', '));
      } else {
        // The same three answers the bulk run distinguishes, because
        // "nothing found" covering all of them is what cost a whole day.
        btn.disabled = false;
        btn.textContent = was;
        appLog('fill one ' + p.name + ' (' + which + ') <- '
          + JSON.stringify(raw).slice(0, 1200));
        toast(raw && raw.error ? 'The lookup errored \u2014 see Diagnostics'
          : res ? 'Nothing it does not already have about the ' + missing
                : 'The lookup had nothing on it');
      }
    } catch (e) {
      btn.disabled = false;
      btn.textContent = was;
      appLog('fill one failed for ' + p.name + ': ' + (e && e.message));
      toast('That did not go through');
    }
  };

  const factGaps = L.factGaps(p);
  if (factGaps.length && S.lookupUrl) {
    const fillBtn = el('button', 'btn btn-sm ghost', 'Look up ' + factGaps[0]
      + (factGaps.length > 1 ? ' and ' + (factGaps.length - 1) + ' more' : ''));
    fillBtn.onclick = lookUp('facts', fillBtn, 'bottle');
    _act.fillBtn = fillBtn;
  }
  /* Offered whether or not there are notes already.

     It only appeared when they were MISSING, so on a bottle that had them
     there was no way to ask for better ones and no sign the feature
     existed — "where is the tasting notes pull?" is the right question to
     ask of a button that hides itself. It never overwrites a note you
     wrote: enhanceDiff fills what is absent and replaces a flight-card
     prompt, and nothing else. */
  if (S.lookupUrl) {
    const noteFill = el('button', 'chip',
      L.noteGaps(p).length ? 'Look up notes' : 'Look them up again');
    noteFill.style.marginTop = '9px';
    noteFill.style.marginLeft = '7px';
    noteFill.onclick = lookUp('notes', noteFill, 'notes');
    _act.noteFill = noteFill;
  }
  const spareBtn = el('button', 'btn btn-sm ghost', '+ Another bottle');
  spareBtn.onclick = () => askStatus(p.name, st => {
    S.bottles.push(L.newBottle(S.bottles, k, st, null));
    save_(); showBottle(k); renderShelf(); renderHome();
    toast(st === 'sealed' ? 'Sealed spare added' : 'Second bottle added, open');
  });
  _act.spareBtn = spareBtn;
  const delBtn = el('button', 'btn btn-sm ghost danger', 'Delete');
  delBtn.onclick = () => {
    if (!L.canDeleteProduct(k, S.bottles)) { toast('Retire its bottles first'); return; }
    confirmDelete(p.name, () => {
      S.deleted[k] = true; delete S.custom[k]; delete S.edits[k];
      S.bottles = S.bottles.filter(b => b.k !== k);
      save_(); rebuildCatalog(); renderShelf(); renderPayline(); renderHome();
      show('shelf'); toast('Removed');
    });
  };
  _act.delBtn = delBtn;
  const h = el('div', 'sheet');
  /* The name and the star on one line. A favourite is a mark ON the bottle,
     not an action to take about it, and it is already a star on every shelf
     row — a button reading "Favourite" among eight other buttons was the
     same fact spelled a different way in a different place. */
  const trow = el('div', 'titlerow');
  const t = el('h2'); t.style.fontSize = '21px'; t.style.color = 'var(--ink-deep)';
  t.textContent = p.name;
  trow.appendChild(t);
  _act.fav.className = 'favstar big';
  _act.fav.textContent = isFav(k) ? '\u2605' : '\u2606';
  _act.fav.setAttribute('aria-label',
    isFav(k) ? 'Remove from favourites' : 'Mark as a favourite');
  _act.fav.setAttribute('aria-pressed', isFav(k) ? 'true' : 'false');
  trow.appendChild(_act.fav);
  h.appendChild(trow);

  const dl = el('dl', 'kv');
  const add = (k2, v, cls) => {
    if (v === null || v === undefined || v === '') return;
    dl.appendChild(el('dt', null, k2));
    const dd = el('dd', cls); dd.textContent = v; dl.appendChild(dd);
  };
  add('Distillery', p.dist);
  add('Style', [p.sub, p.style].filter(Boolean)
    .map(L.titleCase).join(' \u00b7 '));
  add('Proof', p.proof);
  add('Age', p.age ? p.age + ' years' : 'No age stated');
  h.appendChild(dl);

  if (p.fin) {
    const f = el('div'); f.style.marginTop = '10px';
    p.fin.split('+').forEach(part => {
      f.appendChild(el('span', 'tag ' + (p.wine ? 'wine' : 'wood'),
        L.titleCase(part)));
    });
    const src = el('div', 'src', p.finc === 'stated' ? 'confirmed from the producer'
      : p.finc === 'from_cards' ? 'from your flight cards' : 'read from the label');
    f.appendChild(src);
    h.appendChild(f);
  }

  const dl2 = el('dl', 'kv'); dl2.style.marginTop = '10px';
  const add2 = (a, b2) => { if (b2 === null || b2 === undefined || b2 === '') return;
    dl2.appendChild(el('dt', null, a)); dl2.appendChild(el('dd', null, b2)); };
  add2('Region', L.titleCase(p.region));
  add2('Recognition', L.titleCase(p.obsc));
  add2('Release', L.titleCase(p.scar));
  add2('Ohio retail', L.titleCase(p.alloc));
  const prem = L.premium(p.msrp, p.sec);
  add2(prem && prem < 1 ? 'Secondary' : 'Premium', L.premiumText(prem));
  add2('MSRP', p.msrp ? '$' + p.msrp : null);
  h.appendChild(dl2);
  // What this whisky IS: look up what is missing, correct it, remove it.
  const hActs = el('div', 'sectionacts');
  if (_act.fillBtn) hActs.appendChild(_act.fillBtn);
  hActs.appendChild(_act.editBtn);
  hActs.appendChild(_act.delBtn);
  h.appendChild(hActs);
  body.appendChild(h);

  const mine = S.bottles.filter(b => b.k === k);
  const bs = el('div', 'sheet');
  bs.appendChild(el('h3', null, mine.length > 1 ? mine.length + ' bottles' : 'Your bottle'));
  mine.forEach((b, i) => {
    const r = el('div'); r.style.cssText =
      'display:flex;justify-content:space-between;align-items:center;'
      + 'padding:6px 0;border-top:1px solid var(--line)';
    /* B199 means nothing to anybody. It is the key this app files a bottle
       under, not a thing on the shelf with a number on it. What tells one
       of your bottles from another is whether it is open and when it
       turned up — and which of them it is, when there is more than one. */
    r.appendChild(el('span', null, L.bottleLabel(b, i, mine.length)));
    const btn = el('button', 'chip', L.isSealed(b) ? 'Open it' : 'Retire');
    btn.onclick = () => L.isSealed(b) ? openBottle(b, k) : retireBottle(b, k);
    r.appendChild(btn);
    bs.appendChild(r);
  });
  /* What you DO with the bottle you own. Retire and Open it stay on the
     row of the bottle they act on — with two on the shelf, a single Retire
     down here could not say which one. */
  const bActs = el('div', 'sectionacts');
  if (_act.pb) bActs.appendChild(_act.pb);
  if (_act.find) bActs.appendChild(_act.find);
  bActs.appendChild(_act.spareBtn);
  bs.appendChild(bActs);
  body.appendChild(bs);

  // The distiller's notes first: colour, nose, palate, finish.
  // Card notes stay in the tasting. They were written as prompts to be
  // read aloud beside five other pours — deeper, fuller, drier, than the
  // ones next to them — and on a bottle screen, alone, they are not a
  // description of the whisky. A caveat under them did not make them one.
  // 185 of 325 bottles carried these; the flight still has every word.
  const tn = p.tnFrom ? [] : L.tastingNotes(p);
  if (tn.length) {
    const tb = el('div', 'sheet');
    tb.appendChild(el('h3', null, 'Tasting notes'));
    const dl3 = el('dl', 'kv tn');
    tn.forEach(n2 => {
      dl3.appendChild(el('dt', null, n2.label));
      dl3.appendChild(el('dd', null, n2.text));
    });
    tb.appendChild(dl3);
    const srcLine = L.tnSource(p);
    if (srcLine) tb.appendChild(el('div', 'src', srcLine));
    body.appendChild(tb);
  }

  // Add or correct the four columns yourself. Anything you write is marked
  // as yours, so it never passes for a note off a card.
  // Say where they went, rather than showing an empty space that looks
  // like a bottle nobody has ever written about.
  if (p.tnFrom && !tn.length) {
    const nb = el('div', 'sheet');
    nb.appendChild(el('h3', null, 'Tasting notes'));
    nb.appendChild(el('div', 'sub',
      'The notes for this one were written for '
      + L.sentenceCase(p.tnFrom) + ' and belong with the flight, where the '
      + 'other pours give them their meaning. Write your own here.'));
    body.appendChild(nb);
  }

  /* One card, whatever the case. A bottle carrying a flight prompt got the
     explanation card AND a second card headed Tasting notes saying nothing
     was recorded — two cards with the same title, one saying where the
     notes went and the other saying there had never been any. The button
     goes wherever the card already is. */
  const tnEdit = el('button', 'chip', tn.length ? 'Edit tasting notes' : 'Add tasting notes');
  tnEdit.style.marginTop = '9px';
  tnEdit.onclick = () => tastingNoteForm(p);
  if (tn.length || (p.tnFrom && !tn.length)) {
    body.lastChild.appendChild(tnEdit);
    if (_act.noteFill) body.lastChild.appendChild(_act.noteFill);
  } else {
    const nb0 = el('div', 'sheet');
    nb0.appendChild(el('h3', null, 'Tasting notes'));
    nb0.appendChild(el('div', 'sub',
      'Nothing recorded. Add colour, nose, palate and finish as you pour it.'));
    nb0.appendChild(tnEdit);
    // Ask for them, rather than typing them, when there is a service to ask.
    if (_act.noteFill) nb0.appendChild(_act.noteFill);
    body.appendChild(nb0);
  }

  // Then what every source knows, and what you have written.
  const notes = L.notesFor(p, allFlights(), (S.edits[k] || {}).userNote);
  const nb = el('div', 'sheet');
  nb.appendChild(el('h3', null, 'Notes'));
  if (!notes.length) {
    nb.appendChild(el('div', 'sub', 'Nothing recorded yet.'));
  } else {
    notes.forEach(n => {
      const row = el('div', 'note');
      row.appendChild(el('div', 'nsrc', n.src));
      row.appendChild(el('div', null, n.text));
      nb.appendChild(row);
    });
  }
  const ta = document.createElement('textarea');
  ta.className = 'field'; ta.rows = 3;
  ta.placeholder = 'Your own note \u2014 how it drank, who liked it, what it sat next to';
  ta.value = (S.edits[k] || {}).userNote || '';
  ta.style.marginTop = '9px';
  nb.appendChild(ta);
  const saveNote = el('button', 'chip', 'Save note');
  saveNote.style.marginTop = '7px';
  saveNote.onclick = () => {
    const v = ta.value.trim();
    S.edits[k] = Object.assign({}, S.edits[k], { userNote: v || null });
    save_(); rebuildCatalog(); showBottle(k); toast(v ? 'Note saved' : 'Note cleared');
  };
  nb.appendChild(saveNote);
  body.appendChild(nb);

  const used = L.useCount(k, S.flights, S.history);
  if (used) {
    const u = el('div', 'sheet');
    u.appendChild(el('h3', null, 'Used in flights'));
    const fl = S.flights.filter(f => f.core.some(x => x.k === k) || f.ext.some(x => x.k === k));
    fl.forEach(f => {
      const isCore = f.core.some(x => x.k === k);
      const b2 = el('button', 'chip',
        L.sentenceCase(f.title) + (isCore ? '' : ' (bench)'));
      b2.style.marginRight = '5px';
      b2.onclick = () => showFlight(f);
      u.appendChild(b2);
    });
    body.appendChild(u);
  }
  goTo('detail');
}

function openBottle(b, k) { b.status = 'open'; showBottle(k); renderShelf(); }

/* Opening a sealed bottle, from wherever you are.

   There was no way to do it except from the bottle screen, and the shelf
   showed no action at all on a sealed row — so a finding that says "it is
   sealed and it is yours" pointed at something you could not act on.

   Opening one is a small occasion, so it asks: a vault bottle opened by a
   mis-tap is not a thing to shrug at. Confirming logs the pour too, because
   nobody opens a bottle in order to look at it.                          */
function openSealed(k, after) {
  const p = prod(k) || {};
  const ask = L.sealedPrompt(k, S.bottles, p);
  if (!ask.ok) { toast(ask.why); return; }
  const sealed = [ask.next];

  openModal('Open ' + p.name + '?', m => {
    m.appendChild(el('div', 'sub', ask.note));
    const yes = el('button', 'btn wide btn-gold', 'Open it and pour');
    yes.style.marginTop = '11px';
    yes.onclick = () => {
      sealed[0].status = 'open';
      save_();
      closeModal();
      // pourNow carries its own undo toast, which removes the pour. The
