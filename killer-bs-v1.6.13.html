 * before it was caught.
 *
 * Only fields that DIFFER, and only where the person actually set a value —
 * a blank is not a claim that the library is wrong.
 */
L.correctionFor = function (edited, libraryEntry) {
  if (!edited || !libraryEntry) return null;
  const diff = {};
  L.CORRECTABLE.forEach(f => {
    const mine = edited[f], theirs = libraryEntry[f];
    if (mine === undefined || mine === null || mine === '') return;
    if (mine === theirs) return;
    // A number that differs only by rounding is not a correction.
    if (typeof mine === 'number' && typeof theirs === 'number'
        && Math.abs(mine - theirs) < 0.05) return;
    diff[f] = { was: theirs === undefined ? null : theirs, now: mine };
  });
  /* Tasting notes are worth having where the library has none, but a
     difference of opinion about a nose is not a correction.

     And a note this app WILL NOT PUBLISH is not a difference at all. From
     v1.26.18 libraryEntry refuses to send a flight-card note, correctly —
     it is a prompt for a room, not a description of a whisky. This still
     counted its absence as a gap, so 49 bottles queued for publishing,
     published nothing, and queued again: press the button, nothing
     changes, still 49. The publisher and the queue have to agree about
     what a note is, and the publisher is the one that decides. */
  if (edited.tn && edited.tn.nose && !edited.tnFrom
      && !(libraryEntry.tn && libraryEntry.tn.nose)) {
    diff.tn = { was: null, now: edited.tn };
  }
  return Object.keys(diff).length ? diff : null;
};

/* A correction in words.

   pendingForLibrary kept only the NAMES of the fields that differ — "proof,
   fin differs" — and threw the values away, so the one screen whose whole
   job is to let you refuse a batch showed you what KIND of change it was
   and never the change. correctionFor already carries was and now on every
   field; this is only the reading of it.

   Empty reads as nothing rather than as the word null, because a field the
   library does not have yet is the commonest case here and "null to 100"
   is not a sentence. */
L.describeCorrection = function (diff) {
  const say = v => {
    if (v === null || v === undefined || v === '') return 'nothing';
    if (typeof v === 'object') {
      return v.nose ? String(v.nose).slice(0, 40) + '\u2026' : 'a note';
    }
    return String(v).slice(0, 40);
  };
  return Object.keys(diff || {}).map(f => ({
    field: f, was: say(diff[f].was), now: say(diff[f].now),
    text: f + ': ' + say(diff[f].was) + ' \u2192 ' + say(diff[f].now)
  }));
};

/* Filling a blank is not correcting anybody.

   A publish batch was 30 rows all reading "nothing to something": an age
   the library did not have, a cask it did not have, a note it did not
   have. There is no judgement to make about those — nothing is being
   overwritten, nobody's work is being replaced, and the values came from
   the same lookup the app itself ran. Thirty rows of that is a rubber
   stamp, and a rubber stamp teaches you to press the button without
   reading, which is exactly what the review screen exists to prevent.

   An OVERWRITE is different. Something is already there, somebody may
   have put it there on purpose, and it is about to be replaced. That is
   worth a row of its own and worth reading.

   So the batch splits. Both still publish, and the button still has to be
   pressed; only the reading is asked for where reading is warranted. */
L.pendingSplit = function (pend) {
  const adds = [], changes = [];
  (pend || []).forEach(x => {
    const diff = x.diff || {};
    const keys = Object.keys(diff);
    const overwrites = keys.some(f => {
      const was = diff[f].was;
      return was !== null && was !== undefined && was !== '';
    });
    // Not in the library at all is the purest addition there is.
    (overwrites ? changes : adds).push(x);
  });
  return { adds: adds, changes: changes };
};

// Searching it. The library is 325 today and could be thousands, so this
// has to work on a name, a distillery or a category without loading the
// lot into a list first.
L.searchLibrary = function (products, q, limit) {
  const t = String(q || '').trim().toLowerCase();
  const all = Object.keys(products || {}).map(k =>
    Object.assign({ _key: k }, products[k]));
  if (!t) {
    return all.sort((a, b) => String(a.name).localeCompare(String(b.name)))
      .slice(0, limit || 40);
  }
  // The same matcher the shelf uses. This had its own — a plain substring
  // over the same fields, with no synonyms — so PX found 5 here and 18 on
  // the shelf, which is the worse kind of bug: not a failure, a
  // disagreement between two answers to the same question.
  //
  // Every word must still match, so a two-word search narrows; each word
  // may match through its own synonyms.
  const words = L.queryTerms(t);
  return all.filter(p => words.every(w => L.matchesQuery(p, w)))
    .sort((a, b) => String(a.name).localeCompare(String(b.name)))
    .slice(0, limit || 40);
};

// What is thin about an entry, so an admin can find the ones worth fixing
// rather than reading all of them.
L.libraryGaps = function (p) {
  const missing = [];
  if (!p.proof) missing.push('proof');
  if (!p.dist) missing.push('distillery');
  if (!p.sub) missing.push('category');
  // Same rule: a card note is a prompt, not a description.
  if (p.tnFrom || !p.tn || !p.tn.nose) missing.push('notes');
  return missing;
};

/* What ONE bottle is short of, for a button that offers to go and get it.

   libraryGaps answers the same question for an admin reading the library.
   This one is about the bottle in front of you and says it in the words the
   button needs: a flight-card note counts as no note, which is the whole
   reason 185 bottles looked complete and were not. */
L.bottleGaps = function (p) {
  if (!p) return [];
  return L.noteGaps(p).concat(L.factGaps(p));
};

/* Split by the card each one belongs to.

   A single Look up filled the notes AND the proof and the price, and once
   the controls moved under the thing they act on it had to live in one
   section while quietly changing another. Two buttons, each under what it
   changes: notes on the tasting-notes card, facts under the bottle's own
   details. The lookup itself is one call either way — this only decides
   which fields are taken from the answer. */
L.noteGaps = function (p) {
  return (!p || p.tnFrom || !p.tn || !p.tn.nose) ? ['tasting notes'] : [];
};

L.factGaps = function (p) {
  if (!p) return [];
  const gaps = [];
  if (!p.proof) gaps.push('proof');
  if (!p.age) gaps.push('age');
  if (!p.msrp) gaps.push('price');
  if (!p.fin) gaps.push('cask');
  if (!p.dist) gaps.push('distillery');
  return gaps;
};

// What a lookup answer is allowed to write, for one of the two buttons.
// Anything outside the set is left for the other one, so pressing Look up
// notes never quietly changes the price.
L.takeFor = function (take, which) {
  if (!take) return null;
  const out = {};
  Object.keys(take).forEach(f => {
    const isNote = (f === 'tn' || f === 'tnFrom' || f === 'tnSrc');
    if (which === 'notes' ? isNote : !isNote) out[f] = take[f];
  });
  return Object.keys(out).filter(f => f !== 'tnFrom').length ? out : null;
};

// Merging an accepted contribution. It cannot overwrite: a product already
// in the library stays as it is, because the library is the thing everybody
// has agreed on and a contribution is one person's opinion.
/* Whether a contribution can join the LIBRARY.

   `base` must be the shared library, and nothing else. It was being passed
   S.base, which is this device's merged catalogue — so a phone that had
   pulled the library saw a clash and a laptop that had not saw none, and
   the same row read Drop on one and Accept on the other. Opposite verdicts,
   opposite actions, one button. Whether a bottle is already in the library
   is a fact about the library. */
/* Everything known about the bottle, not just what the offer carried.

   Accepting wrote the CONTRIBUTION into the library. The contributor's own
   shelf usually holds more — a proof, an age, a cask, a tasting note the
   offer never included — so the moment the thin version landed,
   correctionFor compared the shelf against it, found the extra fields, and
   queued the same bottle for publishing. Accept, then publish, for one
   bottle, twice, for ever: two paths writing the same row with different
   payloads, each making work for the other.

   The offer still decides WHETHER it goes in. This only decides what goes
   in with it, and it can only add — a field the offer states is the
   offer's, since that is the thing being accepted. */
L.enrichContribution = function (product, local) {
  if (!product) return product;
  const mine = local || null;
  if (!mine) return product;
  const out = Object.assign({}, product);
  ['proof', 'age', 'msrp', 'fin', 'dist', 'sub', 'region', 'scar', 'obsc',
   'type', 'style'].forEach(f => {
    if ((out[f] === null || out[f] === undefined || out[f] === '')
        && mine[f] !== null && mine[f] !== undefined && mine[f] !== '') {
      out[f] = mine[f];
    }
  });
  // A flight-card note is a prompt, not a description, and must not travel
  // into the library — the same rule the fill-in run works to.
  if ((!out.tn || !out.tn.nose) && mine.tn && mine.tn.nose && !mine.tnFrom) {
    out.tn = mine.tn;
    if (mine.tnSrc) out.tnSrc = mine.tnSrc;
  }
  return out;
};

L.mergeContribution = function (base, entry) {
  const key = L.shopNorm(entry.name);
  if (!key) return { ok: false, why: 'no name' };
  const clash = Object.values(base || {}).find(p => L.shopNorm(p.name) === key);
  if (clash) return { ok: false, why: 'already in the library as ' + clash.name };
  const p = L.normalizeProduct(entry);
  if (!p || !p.k) return { ok: false, why: 'would not normalise' };
  return { ok: true, key: p.k, product: p };
};

/* --- pooling the room's shelves ----------------------------------------

   A flight cast across everybody's bottles rather than one person's. This
   is the thing no other app can do, and it came out of an actual tasting:
   the room had the bottles for a comparison that nobody's own shelf could
   support on its own.

   The pool is a catalogue like any other, so every existing piece — the
   candidate builder, the lessons, the validators — works on it unchanged.
   What it adds is an owner on each bottle, because a flight that needs
   Marcus to bring three things is a different plan from one you can pour
   alone, and the host has to know.                                        */

L.poolShelves = function (mine, shelves, names, meLabel) {
  const pool = {}, bottles = [], owner = {};
  const add = (catalog, bots, who) => {
    Object.values(catalog || {}).forEach(p => {
      if (!p || !p.name) return;
      if (!L.pourable(p.k, bots || [])) return;      // open bottles only
      const key = L.shopNorm(p.name);
      if (!key) return;
      if (pool[key]) {
        // More than one person has it. Whoever is nearest pours it, and
        // for a flight that means the host, so yours wins.
        if (owner[key].indexOf(who) < 0) owner[key].push(who);
        return;
      }
      pool[key] = Object.assign({}, p, { k: key });
      owner[key] = [who];
      bottles.push({ id: 'pool-' + key, k: key, status: 'open' });
    });
  };
  add(mine && mine.catalog, mine && mine.bottles, meLabel || 'You');
  Object.keys(shelves || {}).forEach(uid => {
    const s = shelves[uid];
    add(s && s.catalog, s && s.bottles, (names || {})[uid] || 'a buddy');
  });
  return { catalog: pool, bottles: bottles, owner: owner };
};

// Who has to bring what. A flight everybody can already pour is worth
// knowing about; one that needs three people to turn up is a different
// evening and should say so before it is planned.
L.poolPlan = function (pours, pool, meLabel) {
  const me = meLabel || 'You';
  const bring = {};
  (pours || []).forEach(p => {
    const who = (pool.owner || {})[p.k] || [];
    const first = who.indexOf(me) >= 0 ? me : (who[0] || 'somebody');
    (bring[first] = bring[first] || []).push(
      (pool.catalog[p.k] || {}).name || p.k);
  });
  const others = Object.keys(bring).filter(w => w !== me);
  return {
    bring: bring,
    mine: (bring[me] || []).length,
    borrowed: (pours || []).length - (bring[me] || []).length,
    people: others,
    // The honest summary, in the order somebody would want it.
    summary: !others.length
      ? 'You can pour all of this yourself.'
      : others.length === 1
        ? others[0] + ' brings ' + (bring[others[0]] || []).length + '.'
        : others.map(w => w + ' brings ' + (bring[w] || []).length).join(', ')
          + '.'
  };
};

/**
 * What pooling actually buys, which is two different things.
 *
 * For somebody with forty bottles it unlocks lessons they cannot run at
 * all. For BZ, who can already build all seven alone, it does not unlock
 * anything — it makes the flights BETTER, because a region flight with one
 * Campbeltown is a claim and one with three is a comparison. Reporting
 * only the newly-possible would have said "nothing" to the person with the
 * biggest shelf, which is the wrong answer to a good idea.
 */
L.poolGain = function (mine, pool, flights) {
  const alone = {}, out = [];
  L.lessonsFor(mine.catalog, mine.bottles, flights)
    .forEach(l => { alone[l.id] = l; });

  L.lessonsFor(pool.catalog, pool.bottles, flights).forEach(l => {
    const was = alone[l.id] || { ready: false, options: 0 };
    if (!l.ready) return;
    if (!was.ready) {
      out.push(Object.assign({}, l, { gain: 'new',
        note: 'You cannot build this on your own shelf.' }));
    } else if (l.options > was.options) {
      out.push(Object.assign({}, l, { gain: 'better',
        note: was.options + ' way' + (was.options === 1 ? '' : 's')
          + ' alone, ' + l.options + ' together.' }));
    }
  });
  // Newly possible first: that is a different evening, not a better one.
  return out.sort((a, b) => (a.gain === 'new' ? 0 : 1)
    - (b.gain === 'new' ? 0 : 1) || b.options - a.options);
};

/* --- what a shelf can teach ---------------------------------------------

   The 36 flights are the real asset here, and not because of the bottles.
   They encode which QUESTIONS are worth asking of a collection, and what
   has to be held still for each one to be a fair test. Somebody arriving
   with forty bottles and no flights has no way to know that.

   Mined from the shipped flights rather than invented: six pours, one or
   two things held constant, exactly one thing varying. Eighteen of the 36
   vary proof, eight vary the cask, three the house, two the region.        */

L.LESSONS = [
  { id: 'proof', name: 'Proof is not a score',
    ask: 'Does more strength mean more whisky?',
    hold: ['sub'],
    why: 'Same category throughout, so strength is the only thing moving. '
       + 'The interesting question is not which is stronger \u2014 that takes a '
       + 'second \u2014 but which you would rather drink.' },
  { id: 'finish', name: 'The cask did that, not the spirit',
    ask: 'How much of what you taste is the wood?',
    hold: ['sub'],
    why: 'One spirit, several endings. It is the fastest way to learn what '
       + 'a sherry butt actually does, because everything else is held.' },
  { id: 'house', name: 'Does a house have a style?',
    ask: 'Can you recognise a distillery across its range?',
    hold: ['dist'],
    why: 'Everything from one house, differing in age or cask. Either a '
       + 'house signature exists or it does not, and you find out.' },
  { id: 'region', name: 'Is a region a real thing?',
    ask: 'Does where it was made tell you anything?',
    hold: ['sub'],
    why: 'The claim that Islay tastes like Islay is testable, and mostly '
       + 'assumed rather than tested.' },
  { id: 'age', name: 'Age is not a flavour',
    ask: 'Is older better, or just older?',
    hold: ['sub', 'dist'],
    why: 'The number on the bottle is the most expensive thing about it. '
       + 'Worth finding out whether you can taste it.' },
  { id: 'grain', name: 'Which grain are you tasting?',
    ask: 'Can you pick rye from wheat from corn?',
    hold: ['dist'],
    why: 'One distillery, one process, different mash bills. The grain is '
       + 'the only variable left.' },
  { id: 'price', name: 'Is it worth the money?',
    ask: 'Does the dear one taste dearer?',
    hold: ['sub'],
    why: 'Poured blind, with the prices hidden until afterwards. Nobody '
       + 'enjoys the answer to this one.' }
];

// Which lessons a given shelf can actually support, and how well. Not a
// guess: it runs the same candidate builder a flight uses, so a lesson is
// offered only when a real flight could be cast from what is open.
L.lessonsFor = function (catalog, bottles, flights) {
  const already = {};
  (flights || []).forEach(f => {
    const v = L.variableOfId(f);
    if (v) already[v] = (already[v] || 0) + 1;
  });

  return L.LESSONS.map(les => {
    const cands = L.flightCandidates(les.id, catalog, bottles) || [];
    const best = cands[0] || null;
    return {
      id: les.id, name: les.name, ask: les.ask, why: les.why,
      ready: !!best && best.pours.length >= 4,
      pours: best ? best.pours.length : 0,
      options: cands.length,
      have: already[les.id] || 0,
      // What is missing, said plainly, when it cannot be built.
      blocked: best ? null : L.lessonBlocker(les, catalog, bottles)
    };
  }).sort((a, b) => (b.ready - a.ready) || (a.have - b.have)
                 || (b.options - a.options));
};

// Why a lesson cannot be built yet. "Not enough bottles" is useless; naming
// the shape that is missing is what tells somebody what to buy.
L.lessonBlocker = function (les, catalog, bottles) {
  const open = Object.values(catalog).filter(p => L.pourable(p.k, bottles));
  if (open.length < 4) return 'Fewer than four bottles open.';
  const groups = {};
  open.forEach(p => {
    const key = (les.hold || []).map(k => p[k] || '?').join('|');
    (groups[key] = groups[key] || []).push(p);
  });
  const biggest = Object.values(groups)
    .reduce((m, g) => Math.max(m, g.length), 0);
  const held = (les.hold || []).map(k => ({
    sub: 'category', dist: 'distillery', region: 'region'
  })[k] || k).join(' and ');
  if (biggest < 4) {
    return 'Needs four open bottles sharing a ' + held + '. The largest '
      + 'group you have is ' + biggest + '.';
  }
  return 'Four bottles share a ' + held + ', but they do not differ enough '
    + 'on ' + les.id + ' to make the comparison worth pouring.';
};

// How long ago, said the way somebody would say it.
L.ago = function (ms, now) {
  if (!ms) return 'never';
  const mins = Math.floor(((now || Date.now()) - ms) / 60000);
  if (mins < 2) return 'just now';
  if (mins < 60) return mins + ' minutes ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
  const days = Math.floor(hrs / 24);
  if (days < 30) return days + (days === 1 ? ' day ago' : ' days ago');
  return Math.floor(days / 30) + ' months ago';
};

/* --- the tasting night papers ------------------------------------------ */

// Two documents with opposite requirements. The host's has every answer on
// it; the participants' must have none, or the night is not blind. They are
// built from the same flight and must never be built by the same function,
// because the one mistake that ruins a tasting is a bottle name appearing
// on a sheet that should not carry one.

// The two columns that change per flight. The sheet asks the flight's own
// question — proof for a proof ladder, which cask for a cask flight — and
// then always asks whether you would drink it again, which is the question
// nobody gets wrong and everybody has an opinion about.
L.SHEET_COLUMNS = {
  proof:  ['Proof \u2014 your number', 'Write a number, not a band. 85 to 135.'],
  age:    ['Age \u2014 your guess', 'In years. Say a number even if you are unsure.'],
  finish: ['Which cask', 'Sherry, port, wine, rum, none \u2014 commit to one.'],
  region: ['Where from', 'Island, coast, inland, another country entirely.'],
  grain:  ['Which grain leads', 'Rye, corn, wheat, barley.'],
  house:  ['Which two share a still', 'Match them by letter.'],
  price:  ['What would you pay', 'A number. Dear or cheap is not an answer.']
};

L.sheetColumns = function (f) {
  const v = L.variableOfId(f);
  const first = L.SHEET_COLUMNS[v] || ['Your call', 'Answer the question in the line above.'];
  return [first, ['Rather drink it? 1\u20135',
    '1 = would not finish the glass. 5 = pour me another.']];
};

// The vocabulary row. Lifted in spirit from the sheet BZ already uses: the
// hardest part of a blind tasting is not knowing what words are available,
// so the first row of the table hands them over.
L.SHEET_PROMPTS = {
  colour: 'gin clear \u00b7 white wine \u00b7 pale straw \u00b7 gold \u00b7 amber \u00b7 copper \u00b7 '
        + 'mahogany \u00b7 treacle',
  nose:   'WOOD oak \u00b7 toasted \u00b7 cedar \u00b7 walnut   GRAIN rye \u00b7 corn \u00b7 wheat   '
        + 'SWEET vanilla \u00b7 caramel \u00b7 honey   FRUIT orchard \u00b7 dried \u00b7 citrus   '
        + 'OTHER smoke \u00b7 brine \u00b7 leather \u00b7 mint',
  palate: 'Same families as the nose \u2014 note what CHANGED between smelling and '
        + 'tasting. FEEL thin \u00b7 oily \u00b7 creamy \u00b7 drying \u00b7 hot',
  finish: 'LENGTH vanishes \u00b7 short \u00b7 medium \u00b7 long \u00b7 will not leave.   '
        + 'Wait thirty seconds before you write.'
};

// What the host needs and the participants must not see.
L.hostCard = function (f, catalog) {
  const cards = f.cards || [];
  return {
    title: f.title,
    tag: f.tag,
    premise: f.premise,
    variable: L.variableOfId(f),
    pours: (f.core || []).map((p, i) => {
      const kind = L.pourKind(p);
      const pd = kind === 'shelf' ? (catalog[p.k] || {}) : {};
      const card = cards[i] || {};
      const tn = pd.tn || {};
      return {
        letter: p.letter || String.fromCharCode(65 + i),
        bottle: L.pourLabel(p, catalog) || card.bottle || '',
        proof: L.pourProof(p, catalog) || card.proof || '',
        wood: card.wood || pd.fin || '',
        colour: tn.colour || '', nose: tn.nose || '',
        palate: tn.palate || '', finish: tn.finish || '',
        note: kind === 'blend' ? (p.note || '') : '',
        kind: kind
      };
    }),
    why: (f.why || []).slice(),
    ext: (f.ext || []).map(k => (catalog[k] || {}).name || k).filter(Boolean)
  };
};

// The blind half. Letters, the theme, the two questions and the vocabulary
// — and NOTHING that identifies a pour. Built separately on purpose.
// The premise is the HOST's reasoning and it names bottles — "Sazerac at
// 90, 100 and 125" is the answer to the flight, written out. Putting it on
// a blind sheet hands the night away, which is exactly what the leak check
// caught. The sheet gets a theme built from the flight's own shape instead.
L.blindTheme = function (f, catalog) {
  const n = (f.core || []).length;
  const v = L.variableOfId(f);
  const subs = new Set((f.core || [])
    .map(p => (catalog[p.k] || {}).sub).filter(Boolean));
  const one = subs.size === 1 ? [...subs][0] : null;
  const what = one ? 'all ' + L.titleCase(one) : 'mixed';
  const ask = {
    proof: 'Guess the strength of each.',
    age: 'Guess the age of each.',
    finish: 'Name the cask on each.',
    region: 'Say where each is from.',
    grain: 'Say which grain leads in each.',
    house: 'Find the ones that share a distillery.',
    price: 'Say what each is worth.'
  }[v] || 'Say what is in the glass.';
  return n + ' pours, ' + what + '. ' + ask;
};

// What the room is actually told before it pours. The tag is written for
// the host and its segments differ in kind: how many pours is fine, which
// bottles were swapped in is not.
L.blindGiven = function (f) {
  const parts = String(f.tag || '').split('\u00b7').map(s => s.trim());
  const named = L.SCOTCH_REGIONS.map(r => r.toLowerCase())
    .concat(['peated', 'unpeated', 'campbeltown', 'islay', 'speyside']);
  return parts.filter(s => {
    if (!s) return false;
    const l = s.toLowerCase();
    // Counts and blind instructions are given; anything naming a place or
    // a category the flight is asking about is the answer.
    if (/\d+\s*(core|bottles|extensions)/i.test(s)) return true;
    if (/blind|spotted|poured/i.test(s) && !named.some(n => l.indexOf(n) >= 0)) {
      return true;
    }
    if (/one variable/i.test(s)) return true;
    return false;
  }).join(' \u00b7 ');
};

L.participantCard = function (f, catalog) {
  const cols = L.sheetColumns(f);
  return {
    title: f.title,
    theme: L.blindTheme(f, catalog || {}),
    // The tag's tail is a HOST note about how the flight was assembled —
    // "Unpeated Campbeltown in, peated Campbeltown out" is the answer to a
    // flight that asks where each pour is from. Only the parts that are
    // genuinely given to the room go on the sheet, and anything naming a
    // place or a house is not one of them.
    given: L.blindGiven(f),
    columns: cols,
    prompts: L.SHEET_PROMPTS,
    rows: (f.core || []).map((p, i) => ({
      letter: p.letter || String.fromCharCode(65 + i)
    }))
  };
};

// The check that matters. A participant sheet carrying a bottle name is the
// one failure that cannot be recovered from once the sheets are handed out.
// Words that are tasting vocabulary rather than an identification. Sherry
// and strength and barrel appear in the prompts on every sheet; finding
// them there is not a leak, and a check that cries wolf on all of them gets
// switched off, which is worse than no check.
L.SHEET_SAFE = ['strength', 'finish', 'finished', 'sherry', 'barrel', 'wheat',
  'grain', 'toasted', 'peated', 'blended', 'american', 'label', 'white',
  'release', 'still', 'proof', 'single', 'small', 'batch', 'straight',
  'bourbon', 'whiskey', 'whisky', 'scotch', 'irish', 'cask'];

L.sheetLeaks = function (card, flight, catalog) {
  /* Only the parts of the sheet that CHANGE with the flight.

     It read the whole card, prompts included — and the prompts are a fixed
     tasting vocabulary printed on every sheet ever made: gin clear, pale
     straw, oak, honey, GLASS. "Heaven Hill Grain to Glass" shares a word
     with that vocabulary, so the sheet refused to print and said it named
     "glass", which it does, on every flight, by design.

     SHEET_SAFE was a hand-kept copy of that vocabulary and had to be
     updated whenever the prompts changed — the same rule in two places,
     one of them untaught. The prompts are simply not searched now: a leak
     is a bottle named in the title, the theme, the given or a row, which
     are the parts a flight writes for itself. */
  const written = { title: card.title, theme: card.theme, given: card.given,
                    rows: card.rows,
                    columns: (card.columns || []).map(c => c[0]) };
  const text = JSON.stringify(written).toLowerCase();
  // A house named in the TITLE is the flight's own premise — The Aberlour
  // House tells you it is all Aberlour, and that is the given, not a leak.
  const titled = L.shopNorm(flight.title || '').split(' ');
  const leaks = [];
  const flag = w => {
    const lw = String(w).toLowerCase();
    if (!lw || lw.length < 5) return;
    if (L.SHEET_SAFE.indexOf(lw) >= 0) return;
    if (titled.indexOf(lw) >= 0) return;
    if (text.indexOf(lw) < 0) return;
    if (leaks.indexOf(lw) < 0) leaks.push(lw);
  };
  (flight.core || []).forEach(p => {
    const name = L.pourLabel(p, catalog);
    if (name) L.shopNorm(name).split(' ').forEach(flag);
    flag((catalog[p.k] || {}).dist);
  });
  return leaks;
};

/* --- filling in a shelf ------------------------------------------------- */

// After an import you have a shelf of names, proofs and prices and nothing
// else. This finds what is genuinely missing and asks the lookup service.
//
// The distinction that matters: MISSING is not the same as ABSENT. 236 of
// BZ's bottles have no age and 215 no finish, and most of those are correct
// — a no-age-statement bourbon has no age, an unfinished one has no finish.
// Asking for them anyway is how a number gets invented. So a bottle is
// worth asking about when it lacks TASTING NOTES, which every whisky has;
// and anything else that comes back is taken only where the field is empty,
// with a null treated as the honest answer it usually is.

L.ENHANCE_FIELDS = ['tn', 'age', 'fin', 'msrp'];

L.needsEnhancing = function (p) {
  if (!p) return false;
  // Notes are the reason to ask. Everything else is a bonus taken on the
  // way past, because a lookup returns the whole record anyway.
  //
  // A note WE made up for a flight card is not a note about the whisky. It
  // was a prompt to read aloud beside five other pours, and counting it as
  // a note meant 185 bottles looked described when nobody had ever
  // described them — the fill-in run said 15 missing when it was 200.
  /* A recorded source outranks a leftover prompt marker.

     tnSrc says where a note came from: absent for one we wrote onto a
     flight card, `model` or `review` for a real one. A bottle carrying a
     real note AND a stale tnFrom has been filled in already, whatever the
     marker says — and without this, the 161 filled on 2026-09-03 would be
     looked up and paid for a second time to learn nothing. */
  if (p.tn && p.tn.nose && p.tnSrc) return false;
  if (p.tnFrom) return true;
  return !p.tn || !p.tn.nose;
};

L.enhanceQueue = function (catalog, bottles, opts) {
  const o = opts || {};
  const out = [];
  Object.values(catalog).forEach(p => {
    if (!L.needsEnhancing(p)) return;
    // Only what you actually own, unless asked otherwise: there is no point
    // paying for a lookup on a bottle you deleted.
    if (!o.all && L.ownedCount(p.k, bottles) === 0) return;
    out.push(p);
  });
  // Open bottles first — those are the ones you might pour tonight.
  out.sort((a, b) => {
    const ao = L.pourable(a.k, bottles) ? 0 : 1;
    const bo = L.pourable(b.k, bottles) ? 0 : 1;
    return ao - bo || a.name.localeCompare(b.name);
  });
  return out;
};

// What a lookup gives us that this bottle does not already have. Never
// overwrites: a value you have is yours, and a blank is the only invitation.
/* Did the service answer with a NOTE, or with pieces of one?

   enhanceDiff needs all three of nose, palate and finish, because two of
   them is not a tasting note and writing it over a flight prompt would
   leave a fragment where a usable prompt used to be. But a partial answer
   is not the same as a bottle nobody has described: Lagavulin 16 came back
   partial and was reported as having nothing the shelf did not already
   have, which is the opposite of true about the most written-about whisky
   there is. Worth naming so it can be retried and counted. */
L.notePartial = function (found) {
  if (!found) return false;
  /* Partial means something sensory came back and it is not enough to
     write with. A nose and a palate IS enough — a missing finish is a note
     without a finish, which describes a great many published ones — so a
     reply carrying both is not partial however much else is absent. A
     reply carrying only one of them, or only a colour, or only a finish,
     is something the service half-knew and is worth asking again for. */
  const has = k => !!(found[k] || found['tn_' + k]);
  const any = has('nose') || has('palate') || has('finish') || has('colour');
  return any && !(has('nose') && has('palate'));
};

L.enhanceDiff = function (p, found) {
  if (!p || !found) return null;
  const take = {};
  /* A note WE made up for a flight card is a prompt to read aloud, not a
     note about the whisky. needsEnhancing was taught that and this was
     not, and the two have to agree or the run is nonsense: 185 bottles
     were queued BECAUSE of tnFrom and then rejected here for having a
     tn.nose, so the run paid for 185 lookups and could not have used one
     of them whatever came back. 24 filled, 177 nothing found — and 15 of
     the 24 were the bottles with no note at all.

     A prompt is replaceable. A note you wrote yourself still is not. */
  const prompt = !!p.tnFrom;
  if (prompt || !p.tn || !p.tn.nose) {
    const tn = {};
    ['colour', 'nose', 'palate', 'finish'].forEach(k => {
      const v = found['tn_' + k] || found[k];
      if (v && String(v).trim()) tn[k] = String(v).trim();
    });
    /* A nose and a palate. Colour and finish where they exist.

       This wanted all three of nose, palate and finish, on the reasoning
       that half a description is worse than a prompt. That reasoning was
       right about ONE of nose or palate missing and wrong about the
       finish: Ardbeg Heavy Vapours, Barrell 20 Year Toasted and Barrell
       Gray Label all came back twice with a colour, a nose and a palate
       and no finish, so all three kept an invented flight-card note and
       were queued to be paid for again on every future run, for ever.

       A nose and a palate is not a fragment, it is most of a tasting note,
       and the flight card keeps every word of the prompt regardless — it
       is shown under Notes, where it belongs. */
    if (tn.nose && tn.palate) {
      take.tn = tn;
      /* The prompt goes with it, or the bottle stays in the queue for ever
         and gets looked up again on every run.

         An EMPTY STRING, not null. `edits` is in SYNC_KEYS, and Firebase
         deletes any key whose value is null rather than storing it — so
         `tnFrom: null` was stripped on the way up, came back absent, and
         mergeCatalog let the base's own tnFrom through again. 161 bottles
         were filled and the queue still said 201. An empty string survives
         the round trip and is falsy everywhere tnFrom is read. */
      if (prompt) take.tnFrom = '';
    }
  } else if (p.tn && !p.tn.colour && (found.colour || found.tn_colour)) {
    // A note set missing only its colour is worth completing on its own.
    take.tn = Object.assign({}, p.tn,
      { colour: String(found.colour || found.tn_colour).trim() });
  }
  if (!p.age && typeof found.age === 'number' && found.age > 0 && found.age < 100) {
    take.age = found.age;
  }
  if (!p.fin) {
    /* `fin` is the cask. `finish` is the finish of the TASTE. The lookup
       schema asks for both, in the same object, under those two names —
       so reading one as the other is never right, and the guard that used
       to stand here (take `finish` as a cask only when no nose came with
       it) held for a full answer and broke on a truncated one. A reply
       that got as far as finish and stopped before nose put a tasting word
       in the cask field, which the cask nearness axis then measures by. */
    const fin = L.cleanFinish(found.fin);
    if (fin) take.fin = fin;
  }
  if (!p.msrp && typeof found.msrp === 'number' && found.msrp > 0) {
    take.msrp = found.msrp;
  }
  return Object.keys(take).length ? take : null;
};

/* --- what the shelf is missing ---------------------------------------- */

// Almost all of this is arithmetic, not judgement. The shelf already knows
// where it is thin; the only thing a model could add is naming specific
// bottles to fill a gap, and that comes later and last.
//
// Ranked by what a purchase ENABLES, not by what it costs or how rare it
// is. The failure mode to avoid is a list that says buy Pappy: expensive,
// obvious, and it unlocks nothing you cannot already do.

L.GAP_KINDS = ['flight', 'wish', 'extend', 'contrast', 'region', 'category',
               'proof', 'pair'];

// Some findings name a bottle you could go and buy — Longrow 18. Others
// describe one — "a finished Buffalo Trace", "a Campbeltown Scotch". Only
// the first is searchable, and treating the second as a search term is why
// tapping it found nothing.
L.NAMED_GAPS = ['flight', 'wish'];

L.gapIsNamed = function (g) {
  return L.NAMED_GAPS.indexOf(g.kind) >= 0;
};

// What the shelf already holds in the corner a gap describes, so a
// suggestion is never something already owned.
L.gapOwned = function (g, catalog) {
  const live = Object.values(catalog);
  const m = /^(?:A|An|Another|A second|Something)\s+(.*)$/i.exec(g.name || '');
  const subject = (m ? m[1] : g.name || '').toLowerCase();
  return live.filter(p => {
    const hay = (p.name + ' ' + (p.dist || '') + ' ' + (p.region || '')
      + ' ' + p.sub).toLowerCase();
    return subject.split(/\s+/).filter(w => w.length > 3)
      .some(w => hay.indexOf(w) >= 0);
  }).map(p => p.name).slice(0, 60);
};

// Anything a model returns here is a name, not a fact. Trim it, drop what
// is unusable, and refuse anything already on the shelf — the one check
// that can actually be made, since these are bottles BZ does not own.
// A distillery and its flagship bottle often share a name, so a suggestion
// has to be checked against what the gap actually CONSTRAINED rather than
// against the phrase describing it. Asking for a finished bottling from the
// Buffalo Trace distillery returned an Old Forester, a 1792 and a Russell's
// — three substitutes, none of them from that house.
L.candidateFits = function (b, gap) {
  if (!gap) return true;
  const hay = ((b.name || '') + ' ' + (b.dist || '')).toLowerCase();
  if (gap.dist) {
    const want = String(gap.dist).toLowerCase()
      .replace(/\s+(distillery|distillers|distilling|company|co\.?|spirits)$/, '');
    // The distillery must appear in the bottle's own name or its maker.
    if (hay.indexOf(want) < 0) return false;
  }
  if (gap.region && hay.indexOf(String(gap.region).toLowerCase()) < 0) {
    // A region is weaker evidence than a distillery: the label rarely says
    // Campbeltown. Only reject when the bottle names a DIFFERENT region.
    const others = L.SCOTCH_REGIONS
      .filter(r => r.toLowerCase() !== String(gap.region).toLowerCase());
    if (others.some(r => hay.indexOf(r.toLowerCase()) >= 0)) return false;
  }
  return true;
};

// When a house genuinely does not make the thing, the answer is not a
// substitute from another house pretending to be one — that was the bug —
// but it is not nothing either. The observation underneath stays true: 24
// bottles from Buffalo Trace and the wood has never been the variable. If
// Buffalo Trace will not supply the comparison, somebody else has to, and
// saying so out loud is the difference between a substitute and a reframe.
/* A reframe offers the question a shelf CAN answer when the one it asked
   cannot be. It was stating the reason as fact about the distillery —
   "Bunnahabhain does not bottle at cask strength" — when all it knew was
   that this shelf holds none. BZ owns a Bunnahabhain 21 Cask Strength at
   107.2 proof; the claim was false against his own bottles.

   What the app knows is what is on the shelf. It says that instead.       */
// Is this bottled at cask strength? The app had no notion of it and was
// inferring from proof, which is why it told BZ that Bunnahabhain does not
// bottle at cask strength while his Bunnahabhain 21 Cask Strength sat on
// the shelf at 107.2. A label that says so is the fact; proof is a hint.
L.isCaskStrength = function (p) {
  if (!p) return false;
  const n = (p.name || '') + ' ' + (p.style || '');
  if (/cask strength|barrel proof|full proof|\bcs\b|batch proof/i.test(n)) {
    return true;
  }
  // A'bunadh, Uigeadail and the like say it in the name of the expression
  // rather than in words, and 115+ is cask strength in practice.
  return typeof p.proof === 'number' && p.proof >= 115;
};

L.reframeGap = function (gap, catalog) {
  if (!gap || !gap.dist) return null;
  const house = Object.values(catalog).filter(p => p.dist === gap.dist);
  if (!house.length) return null;
  // Describe the house in the terms the original gap was about, so the
  // replacement question is recognisably the same question.
  const sub = house[0].sub;
  const proofs = house.map(p => p.proof).filter(Boolean);
  const mid = proofs.length
    ? Math.round(proofs.reduce((a, b) => a + b, 0) / proofs.length) : null;

  if (/finish/i.test(gap.name || '')) {
    return {
      kind: 'contrast', sub: sub,
      name: 'A finished ' + L.titleCase(sub) + ' from anywhere',
      why: 'Nothing you have from ' + gap.dist + ' is finished, so the '
        + 'comparison has to come from another house. Anything finished at '
        + 'a similar strength sets the wood against your '
        + house.length + ' from ' + gap.dist + '.',
      near: mid
    };
  }
  if (/strength/i.test(gap.name || '')) {
    // If the house DOES have one on this shelf, there is nothing to
    // reframe: the flight can be built from what is already here, and
    // saying otherwise is wrong in front of the bottle that disproves it.
    if (house.some(L.isCaskStrength)) return null;
    return {
      kind: 'contrast', sub: sub,
      name: 'A cask-strength ' + L.titleCase(sub) + ' from anywhere',
      why: 'None of your ' + house.length + ' from ' + gap.dist + ' is at '
        + 'cask strength, so the comparison has to come from another house '
        + '\u2014 or from a cask-strength ' + gap.dist + ' if they release '
        + 'one.',
      near: null
    };
  }
  if (/age-stated/i.test(gap.name || '')) {
    return {
      kind: 'contrast', sub: sub,
      name: 'An age-stated ' + L.titleCase(sub) + ' from anywhere',
      why: 'None of your ' + house.length + ' from ' + gap.dist + ' carries '
        + 'an age, so age can only be the variable against somebody '
        + 'else\u2019s.',
      near: null
    };
  }
  return null;
};

// Do two names describe the same bottle? This exact comparison has caused
// three separate bugs — digits alone matching, a common word matching, a
// prefix matching — so it reuses what those taught rather than being
// written fresh a fourth time.
//
//   the rarest word must match, since that is the one identifying it
//   a number or expression word in one and not the other means a different
//     bottling, whatever else agrees
L.nameAgrees = function (a, b) {
  const x = L.shopNorm(a).split(' ').filter(Boolean);
  const y = L.shopNorm(b).split(' ').filter(Boolean);
  if (!x.length || !y.length) return false;

  // Numbers and expression words must agree both ways.
  const marks = w => {
    const out = {};
    w.forEach(t => {
      if (/\d/.test(t)) out['#' + t] = 1;
      if (['strength', 'proof', 'bonded', 'cask', 'barrel'].indexOf(t) >= 0) {
        out[t] = 1;
      }
    });
    return out;
  };
  const mx = marks(x), my = marks(y);
  for (const k in mx) if (!my[k]) return false;
  for (const k in my) if (!mx[k]) return false;

  const shared = x.filter(w => y.indexOf(w) >= 0);
  if (shared.length < 2) return false;
  return shared.length / Math.min(x.length, y.length) >= 0.6;
};

L.parseCandidates = function (raw, catalog, budget, gap) {
  if (!raw || !Array.isArray(raw.bottles)) return null;
  // A budget is a ceiling, and asking politely is not enforcing. A little
  // over is allowed because retail varies; twice over is not an answer to
  // the question that was asked.
  const ceiling = budget ? budget * 1.15 : null;
  const owned = {};
  Object.values(catalog).forEach(p => { owned[L.shopNorm(p.name)] = 1; });
  const out = [], over = [], rejected = [];
  raw.bottles.forEach(b => {
    const name = (b && typeof b.name === 'string') ? b.name.trim() : '';
    if (!name || name.length > 90) return;
    if (owned[L.shopNorm(name)]) return;        // already on the shelf
    const price = typeof b.price_usd === 'number' && b.price_usd > 0
      && b.price_usd < 10000 ? b.price_usd : null;
    // A name is not evidence a bottle exists. Old Forester 1920 is real;
    // Old Forester 1920 Smoked Cinnamon Malt came back from a real run and
    // is not, and it passed every check we had — it was only dropped
    // because the distillery was wrong. A bottle assembled from real parts
    // is the failure mode here, and it is the one somebody acts on.
    const source = typeof b.source === 'string' ? b.source.trim() : '';
    const sourced = !!source && /[a-z]{3}/i.test(source);
    const row0 = { name: name,
      dist: typeof b.distillery === 'string' ? b.distillery.trim() : null,
      source: sourced ? source.slice(0, 60) : null,
      confident: b.confident === true && sourced };
    // A substitute is not an answer. Rejected here rather than shown with a
    // caveat, because a plausible near-miss is what gets bought by mistake.
    if (!L.candidateFits(row0, gap)) { rejected.push(name); return; }
    // Over budget is set aside rather than dropped: if NOTHING fits, the
    // cheapest thing that does not is still better than an empty panel,
    // and saying so is better than silently widening the budget.
    if (ceiling && price && price > ceiling) { over.push({ b: b, price: price }); return; }
    const proof = typeof b.proof === 'number' && b.proof >= 20
      && b.proof <= 200 ? b.proof : null;
    out.push({ name: name,
      dist: typeof b.distillery === 'string' ? b.distillery.trim().slice(0, 60) : null,
      proof: proof, price: price,
      source: row0.source, confident: row0.confident,
      // How hard it is to actually buy. A bottle somebody cannot get is
      // not a recommendation, and a $40 shelf staple and a $99 allocated
      // release are not the same suggestion at similar prices.
      find: ['shelf', 'hunt', 'allocated'].indexOf(b.find) >= 0
        ? b.find : null,
      why: typeof b.why === 'string' ? b.why.trim().slice(0, 180) : '' });
  });
  if (!out.length) {
    // Nothing inside the budget. Offer the cheapest that fits the gap and
    // say plainly that it is over, rather than returning nothing.
    if (over.length) {
      over.sort((a, b) => a.price - b.price);
      const c = over[0].b;
      return { bottles: [{ name: String(c.name).trim(),
        dist: typeof c.distillery === 'string' ? c.distillery.trim() : null,
        proof: typeof c.proof === 'number' ? c.proof : null,
        price: over[0].price,
        find: ['shelf', 'hunt', 'allocated'].indexOf(c.find) >= 0
          ? c.find : null,
        why: typeof c.why === 'string' ? c.why.trim().slice(0, 180) : '' }],
        note: 'Nothing fits that budget. This is the cheapest that does fit '
          + 'the gap, at $' + over[0].price + '.',
        overBudget: true };
    }
    return rejected.length
      ? { bottles: [], note: '', rejected: rejected }
      : null;
  }
  /* Sourced first, then findable, then cheapest — and the slice happens
     AFTER all three.

     This sorted DEAREST first and then took five, while the display sorted
     those five cheapest-first and said so in its own comment. Both ran.
     The effect was that everything cheap and easy to buy was thrown away
     before the display ever saw it, and what survived to be re-sorted
     was the expensive tail. That is why the suggestions read as bottles
     nobody can get.

     Sourced still wins, because the cost of a wrong answer here is a
     wasted trip to a shop. After that, a bottle you could walk in and buy
     outranks one you would have to hunt, which outranks one that is
     allocated — and at equal findability the cheaper one. */
  out.sort((a, b) => (b.confident ? 1 : 0) - (a.confident ? 1 : 0)
    || L.findRank(a.find) - L.findRank(b.find)
    || (a.price == null ? 1e9 : a.price) - (b.price == null ? 1e9 : b.price));
  return { bottles: out.slice(0, 5),
           note: typeof raw.note === 'string' ? raw.note.slice(0, 200) : '',
           rejected: rejected };
};

// EXTENSION: a house you have clearly committed to, where one more bottle
// deepens something real rather than filling a hole. Twenty-four Buffalo
// Trace is not a gap, it is a preference, and the useful suggestion works
// WITH it.
/* --- dimensions --------------------------------------------------------

   Findings were computed from what is ABSENT, and absence is unbounded:
   there are thousands of bottles BZ does not have, so "a Campbeltown
   Scotch" is true, arbitrary, and still true next month. The literature
   names the same problem from the other side — a recommendation has to be
   unexpected, novel AND relevant, and the acknowledged gap in the field is
   that systems tune their own output rather than letting somebody say what
   kind of variation they want.

   So the axis is chosen, not inferred. You pick what to explore and the
   app answers with named bottles against it — and the same axis narrows a
   search, because "show me Islay" and "suggest me an Islay" are one
   question asked twice.

   Every dimension works on a shelf with no flights on it.                */

/* --- reading a shop page ------------------------------------------------

   A retail listing carries far more than a name and a price: proof, age,
   cask, distillery, region, size and often the distillery's own tasting
   note, all on one page. Pulling only two of those and asking the lookup
   for the rest would be paying for what is already on the screen.

   Two ways in, because many retailers refuse a cross-origin fetch: the app
   tries the URL, and where the shop blocks it you paste the page text
   instead. Both end in the same parse.                                    */

// Numbers first: ABV and proof are the same fact written two ways, and a
// page usually gives one of them.
L.readShopText = function (text, url) {
  const t = String(text || '').replace(/\s+/g, ' ');
  const out = { source: 'shop', url: url || null };
  const grab = (re, fn) => {
    const m = t.match(re);
    return m ? (fn ? fn(m) : m[1]) : null;
  };

  const abv = grab(/(\d{2}(?:\.\d)?)\s*%\s*(?:ABV|alc)/i);
  const proof = grab(/(\d{2,3}(?:\.\d)?)\s*proof/i);
  out.proof = proof ? parseFloat(proof)
    : (abv ? Math.round(parseFloat(abv) * 20) / 10 : null);

  out.age = grab(/(\d{1,2})\s*(?:year|yr)s?\b/i, m => parseInt(m[1], 10));
  // A vintage is not an age. 1990 is when it was distilled.
  if (out.age && out.age > 60) out.age = null;

  out.msrp = grab(/\$\s*([\d,]+(?:\.\d{2})?)/, m =>
    parseFloat(m[1].replace(/,/g, '')));

  out.size = grab(/\b(750\s*ml|700\s*ml|1\.75\s*l|1\s*l|375\s*ml|200\s*ml)\b/i,
    m => m[1].replace(/\s+/g, '').toLowerCase());

  // The cask, from the words a shop actually prints.
  const woods = ['Pedro Ximenez', 'Oloroso', 'Amontillado', 'Palo Cortado',
    'Fino', 'Manzanilla', 'Sherry', 'Port', 'Madeira', 'Sauternes', 'Rum',
    'Marsala', 'Tokaji', 'Mizunara', 'Amburana', 'Cognac', 'Cabernet',
    'Chardonnay', 'Virgin Oak', 'Toasted Oak', 'French Oak'];
  let found = woods.filter(w => new RegExp('\\b' + w + '\\b', 'i').test(t));
  // Sherry is the family; PX and Oloroso are the casks. A page naming both
  // gave "Pedro Ximenez+Oloroso+Sherry", which says the same thing twice
  // and then vaguely.
  const SPECIFIC = ['Pedro Ximenez', 'Oloroso', 'Amontillado', 'Palo Cortado',
                    'Fino', 'Manzanilla'];
  if (found.indexOf('Sherry') >= 0 && found.some(w => SPECIFIC.indexOf(w) >= 0)) {
    found = found.filter(w => w !== 'Sherry');
  }
  out.fin = found.length ? found.slice(0, 3).join('+') : null;

  out.region = grab(/\b(Islay|Speyside|Highland|Lowland|Campbeltown|Islands)\b/i,
    m => L.titleCase(m[1].toLowerCase()));

  // The category, from the words that carry it.
  const subs = [['bourbon', /\bbourbon\b/i], ['rye', /\brye whisk/i],
    ['tennessee', /\btennessee\b/i], ['scotch', /\bscotch|single malt scotch\b/i],
    ['irish', /\birish whisk/i], ['canadian', /\bcanadian whisk/i],
    ['japanese', /\bjapanese whisk/i]];
  const hit = subs.find(([, re]) => re.test(t));
  out.sub = hit ? hit[0] : null;

  // Bottled in bond is a legal designation and a shop prints it verbatim.
  out.bonded = /\bbottled[\s-]?in[\s-]?bond|\bbonded\b/i.test(t) || null;
  out.caskStrength = /\bcask strength|barrel proof|full proof\b/i.test(t) || null;
  out.singleBarrel = /\bsingle barrel|single cask\b/i.test(t) || null;

  // A tasting note, where the shop prints one. Taken as the shop's, never
  // as the whisky's own — it is marketing copy until somebody tastes it.
  const note = {};
  // The colon matters. "Finish:" introduces a tasting note; "Cask Finish"
  // in a product title does not, and matching the bare word pulled the
  // shop's name in as the finish note.
  [['nose', /\bnose\s*[:\u2014-]\s*([^.]{15,220}\.)/i],
   ['palate', /\bpalate\s*[:\u2014-]\s*([^.]{15,220}\.)/i],
   ['finish', /\bfinish\s*[:\u2014-]\s*([^.]{15,220}\.)/i]].forEach(([k, re]) => {
    const v = grab(re);
    if (v) note[k] = v.trim();
  });
  out.tn = Object.keys(note).length ? note : null;

  return out;
};

// The name is the hard part: a page title carries the shop, the size and
// the price alongside it.
L.nameFromShopPage = function (title, url) {
  let t = String(title || '').trim();
  // Everything after a separator is usually the shop.
  t = t.split(/\s+[|\u2013\u2014\u00b7]\s+/)[0];
  t = t.replace(/\b(buy|shop|online|for sale|in stock)\b/gi, '');
  t = t.replace(/\b\d+\s*(ml|l)\b/gi, '');
  t = t.replace(/\$\s*[\d,.]+/g, '');
  t = t.replace(/\s{2,}/g, ' ').replace(/^[\s\-,|]+|[\s\-,|]+$/g, '');
  if (t.length > 4) return t;
  // Nothing usable in the title: the last path segment often is.
  const seg = String(url || '').split(/[?#]/)[0].split('/').filter(Boolean).pop();
  return seg ? seg.replace(/[-_]+/g, ' ').replace(/\.\w+$/, '').trim() : '';
};

/* Nearest, and on WHICH axis.

   The neighbours list had one measure: same category, within five proof
   points. That is one kind of nearness, and the dimension pills sitting
   directly above it name seven. Strength, age and price are distances;
   cask, region, distillery and category are matches. Both are nearness,
   and which one you want is exactly what the pills were already asking —
   they were drawn on the store screen and read by nothing.

   Returns null where the bottle in hand does not carry what the axis
   measures. A page that gave no age cannot be sorted by age, and saying
   so is better than an order that means nothing. */
L.NEAR_AXES = {
  strength: { field: 'proof', label: 'strength' },
  age:      { field: 'age',   label: 'age' },
  money:    { field: 'msrp',  label: 'price' },
  wood:     { match: 'fin',    label: 'cask' },
  region:   { match: 'region', label: 'region' },
  house:    { match: 'dist',   label: 'distillery' },
  style:    { match: 'sub',    label: 'category' }
};

L.nearestBy = function (axis, cand, products) {
  const ax = L.NEAR_AXES[axis];
  if (!ax || !cand) return null;
  const selfNorm = L.shopNorm(cand.name || '');
  const all = (products || []).filter(p => L.shopNorm(p.name) !== selfNorm);

  if (ax.field) {
    const v = parseFloat(cand[ax.field]);
    if (!v) return null;
    const withV = all.filter(p => typeof p[ax.field] === 'number' && p[ax.field]);
    if (!withV.length) return null;
    return { axis: axis, label: 'Nearest by ' + ax.label,
      list: withV.slice().sort((a, b) =>
        Math.abs(a[ax.field] - v) - Math.abs(b[ax.field] - v)
        || String(a.name).localeCompare(String(b.name))) };
  }

  const want = String(cand[ax.match] || '').trim().toLowerCase();
  if (!want) return null;
  const same = all.filter(p =>
    String(p[ax.match] || '').trim().toLowerCase() === want);
  // An empty answer IS the answer on a match axis: nothing you own shares
  // its region is a finding, not a failure, and it is the reason to buy.
  return { axis: axis, list: same.slice().sort((a, b) =>
      (b.proof || 0) - (a.proof || 0)
      || String(a.name).localeCompare(String(b.name))),
    label: same.length
      ? 'Same ' + ax.label + ' on your shelf'
      : 'Nothing on your shelf shares its ' + ax.label };
};

/* A pasted page is not a title, and was being read as one.

   nameFromShopPage is written for a <title>: it splits on the separator
   that puts the shop's name after the product's, strips the size and the
   price, and trusts what is left. Fed the first 160 characters of a page
   BODY it has no separator to split on, so it returned the lot — which is
   where a bottle called "Old Fitzgerald100 Proof Bottled in Bond 7 Year
   Old Bourbon starstarstarstarstar16 reviewsChoose a bottle size" came
   from, and every judgement made about it afterwards was made about that
   string.

   Selected page text arrives as LINES, and a retail page puts the product
   name in the first one or two of them and then turns to furniture: the
   star rating, the review count, the size picker, the price, the cart. So
   take lines until the furniture starts. */
L.SHOP_JUNK = [
  /^\s*star/i, /\breviews?\b/i, /\bchoose\b/i, /\bselect\b/i,
  /\badd to (cart|bag|basket)\b/i, /\bin stock\b/i, /\bout of stock\b/i,
  /\bsold out\b/i, /\bquantity\b/i, /\bsubtotal\b/i, /\bshipping\b/i,
  /^\s*\$/, /^\s*\d+(\.\d+)?\s*$/, /\bml\b/i, /\bwrite a review\b/i,
  /\bsku\b/i, /\bshare\b/i, /\bwish ?list\b/i
];

L.nameFromShopText = function (text) {
  const lines = String(text || '').split(/[\r\n]+/)
    .map(x => x.trim()).filter(Boolean);
  const parts = [];
  for (let i = 0; i < lines.length && parts.length < 3; i++) {
    const ln = lines[i];
    if (L.SHOP_JUNK.some(re => re.test(ln))) break;
    // A whole paragraph is a description, not a name.
    if (ln.length > 70) break;
    if (!/[A-Za-z]/.test(ln)) break;
    parts.push(ln);
    // A line that already names the age or the strength is the end of the
    // name; anything after it is the shop talking.
    if (/\d/.test(ln) && parts.length > 1) break;
  }
  const name = parts.join(' ').replace(/\s{2,}/g, ' ').trim();
  return name.length > 3 ? name.slice(0, 90) : '';
};

L.DIMENSIONS = [
  { id: 'region',   label: 'A region',
    hint: 'Somewhere you have little or nothing from' },
  { id: 'house',    label: 'A distillery',
    hint: 'Further into one you already know, or a new one' },
  { id: 'wood',     label: 'A cask',
    hint: 'A wood that has never touched your shelf' },
  { id: 'strength', label: 'A strength',
    hint: 'A band your shelf does not reach' },
  { id: 'age',      label: 'An age',
    hint: 'Older or younger than anything you own' },
  { id: 'money',    label: 'A price',
    hint: 'A band you have never bought in' },
  { id: 'style',    label: 'A category',
    hint: 'A whole kind of whisky you do not have' }
];

/**
 * What is thin along one axis, said as an opportunity rather than a lack.
 *
 * Returns { axis, label, opportunities: [{ value, have, why, ask }] } where
 * `ask` is the query to hand the candidate finder — a real search, not a
 * category somebody has to translate for themselves.
 */
/* Anything: the axes worth exploring right now, thinnest first.

   The findings list was deterministic — same shelf, same list, for ever —
   so "work it out again" could not return anything different however many
   times it was pressed. That is right for a ranking and wrong for a
   button, and the answer is not randomness: it is that there are seven
   axes and only one was ever on screen.

   A rotation, so pressing again moves you along the axes rather than
   redrawing the same one. The order is stable; the starting point moves. */
L.axisRanking = function (catalog, bottles) {
  return L.DIMENSIONS
    .map(d => {
      const r = L.exploreAxis(d.id, catalog, bottles);
      const thinnest = r.opportunities.length
        ? r.opportunities[0].have : 99;
        return { id: d.id, label: d.label, n: r.opportunities.length,
               thinnest: thinnest, all: r.opportunities,
               top: r.opportunities[0] || null };
    })
    .filter(x => x.n > 0)
    // Nothing at all beats one you already have; more openings beats fewer.
    .sort((a, b) => a.thinnest - b.thinnest || b.n - a.n);
};

// The ages whisky is actually bottled at. Anything between them is a
// single cask somebody happened to fill, not something to go and look for.
L.AGE_TIERS = [10, 12, 15, 18, 21, 25, 30];

L.exploreAxis = function (axis, catalog, bottles) {
  const mine = Object.values(catalog || {})
    .filter(p => L.ownedCount(p.k, bottles || []) > 0);
  if (!mine.length) return { axis: axis, opportunities: [] };

  const tally = fn => {
    const c = {};
    mine.forEach(p => { const v = fn(p); if (v) c[v] = (c[v] || 0) + 1; });
    return c;
  };
  const out = [];

  if (axis === 'region') {
    const have = tally(p => p.sub === 'scotch' ? p.region : null);
    L.SCOTCH_REGIONS.forEach(r => {
      const n = have[r] || 0;
      if (n >= 3) return;
      out.push({ value: r, have: n,
        why: n === 0 ? 'Nothing from ' + r + ' at all.'
          : n + ' from ' + r + '. A third makes it a flight.',
        ask: 'A ' + r + ' single malt' });
    });
  }

  if (axis === 'house') {
    // Deep in one house and never gone further is an opportunity; so is a
    // region you drink from whose houses you have never touched.
    const have = tally(p => p.dist);
    Object.keys(have).filter(d => have[d] >= 3).forEach(d => {
      const set = mine.filter(p => p.dist === d);
      const proofs = set.map(p => p.proof).filter(Boolean);
      const hi = proofs.length ? Math.max.apply(null, proofs) : null;
      /* The ask has now invented a bottle twice.

         First it was "above hi + 10", a number nobody released: Arran tops
         out at 111.6 and it asked for something above 122. That was
         replaced with "a cask-strength <house>", on the reasoning that
         cask strength is a thing houses actually release — which is true
         of houses in general and false of Benriach, Bruichladdich and
         Arran, all three of which came back with nothing. Swapping an
         invented number for an invented product line is the same error
         wearing different clothes.

         A house you own three of certainly sells a bottle you do not own.
         That is the only claim here that cannot be wrong, so that is the
         ask. The strength stays in the observation, where it is a fact
         about your shelf rather than an assertion about theirs, and it
         still reaches the finder — which will prefer a stronger one
         without being forced to return nothing when there is none. */
      out.push({ value: d, have: have[d],
        why: have[d] + ' from ' + d + ', nothing above ' + hi + ' proof.',
        ask: 'Another ' + String(d).replace(/\s+Distillery$/i, '') });
    });
  }

  if (axis === 'wood') {
    const have = {};
    mine.forEach(p => String(p.fin || '').split('+')
      .forEach(w => { if (w.trim()) have[w.trim().toLowerCase()] = 1; }));
    ['Pedro Ximenez', 'Oloroso', 'Port', 'Madeira', 'Sauternes', 'Rum',
     'Mizunara', 'Amburana', 'Marsala', 'Tokaji'].forEach(w => {
      if (have[w.toLowerCase()]) return;
      out.push({ value: w, have: 0,
        why: 'No ' + w + ' cask on the shelf.',
        ask: 'A whisky finished in ' + w });
    });
  }

  if (axis === 'strength') {
    const bands = [[80, 89], [90, 99], [100, 109], [110, 119], [120, 129],
                   [130, 145]];
    bands.forEach(([lo, hi]) => {
      const n = mine.filter(p => p.proof >= lo && p.proof <= hi).length;
      if (n >= 3) return;
      out.push({ value: lo + '\u2013' + hi, have: n,
        why: n ? n + ' between ' + lo + ' and ' + hi + '.'
               : 'Nothing between ' + lo + ' and ' + hi + '.',
        ask: 'A whisky between ' + lo + ' and ' + hi + ' proof' });
    });
  }

  if (axis === 'age') {
    const ages = mine.map(p => p.age).filter(Boolean);
    if (ages.length) {
      const hi = Math.max.apply(null, ages), lo = Math.min.apply(null, ages);
      /* Older than your oldest is unbounded, and above a certain point it
         is unbuyable as well: a shelf topping out at 33 was being told to
         find something older than 33, which is a real category and not a
         thing anybody walks in and buys.

         Ages are bottled at tiers, not on a continuum. The ask is the next
         tier up, which certainly exists and is certainly sold. A shelf
         already past the top tier gets no ask at all — the observation is
         still true and there is nothing to go and buy. */
      const next = L.AGE_TIERS.find(a => a > hi);
      if (next) {
        out.push({ value: 'over ' + hi, have: 0,
          why: 'Nothing older than ' + hi + ' years.',
          ask: 'A ' + next + ' year old whisky' });
      }
      if (lo > 6) {
        out.push({ value: 'under ' + lo, have: 0,
          why: 'Nothing younger than ' + lo + ' years.',
          ask: 'A good whisky under ' + lo + ' years old' });
      }
    }
  }

  if (axis === 'money') {
    ['everyday', 'good', 'special', 'vault'].forEach(band => {
      const n = mine.filter(p => L.priceBand(p.msrp) === band).length;
      if (n >= 5) return;
      out.push({ value: L.titleCase(band), have: n,
        why: n ? 'Only ' + n + ' in the ' + band + ' band.'
               : 'Nothing in the ' + band + ' band.',
        ask: 'A ' + band + '-priced whisky worth having' });
    });
  }

  if (axis === 'style') {
    const have = tally(p => p.sub);
    L.TYPES.forEach(t => {
      const n = have[t] || 0;
      if (n >= 3) return;
      out.push({ value: L.titleCase(t), have: n,
        why: n ? 'Only ' + n + ' ' + t + '.' : 'No ' + t + ' at all.',
        ask: (/^[aeiou]/i.test(t) ? 'An ' : 'A ') + L.titleCase(t)
          + ' worth owning' });
    });
  }

  // Thinnest first: nothing at all beats one you already have.
  out.sort((a, b) => a.have - b.have);
  const d = L.DIMENSIONS.find(x => x.id === axis);
  return { axis: axis, label: d ? d.label : axis,
           opportunities: out.slice(0, 6) };
};

L.gapsFromHouses = function (catalog, bottles) {
  // The whole shelf, because a gap in one HOUSE is not a gap on the shelf
  // and the questions these raise are asked category-wide.
  const all = Object.values(catalog)
    .filter(p => L.ownedCount(p.k, bottles || []) > 0);
  const by = {};
  Object.values(catalog).forEach(p => {
    if (!p.dist) return;
    (by[p.dist] = by[p.dist] || []).push(p);
  });
  const out = [];
  Object.keys(by).forEach(dist => {
    const set = by[dist];
    if (set.length < 4) return;              // not a commitment yet
    const proofs = set.map(p => p.proof);
    const lo = Math.min.apply(null, proofs), hi = Math.max.apply(null, proofs);
    const fins = new Set(set.map(p => p.fin).filter(Boolean));
    const ages = set.map(p => p.age).filter(Boolean);

    // The dimension this house has NOT been explored along is the one worth
    // suggesting, because it is the next thing you could actually taste.
    // Weighted by how far into the house you have actually gone. Four
    // bottles is a leaning; twenty-four is a commitment, and a suggestion
    // about it is worth more.
    const commit = Math.min(set.length, 20);
    // A narrow spread AND nothing at cask strength. The spread alone was
    // the test, so Bunnahabhain — 92.6 to 107.2, a 14.6 spread — was
    // offered a cask-strength suggestion while a Bunnahabhain 21 Cask
    // Strength sat in the very set being described.
    // Same for strength: asking for a cask-strength bourbon when 64 bottles
    // on the shelf are at cask strength is asking for what you have.
    if (hi - lo < 20 && !set.some(L.isCaskStrength)
        && !all.some(p => p.sub === set[0].sub && L.isCaskStrength(p))) {
      out.push({ kind: 'extend', sub: set[0].sub,
        name: 'A cask-strength ' + L.titleCase(set[0].sub || 'whisky'),
        why: set.length + ' from ' + dist + ', all between ' + lo + ' and '
          + hi + ' proof \u2014 nothing you own from them is at strength. '
          + 'Theirs if they make one, anybody\u2019s if not.',
        weight: 40 + commit });
    // The ASK is category-wide now, so the TEST must be too. v1.8.0 changed
    // "a finished bottling from Buffalo Trace" to "a finished Bourbon"
    // without changing the condition, which stayed house-scoped — so it
    // asked BZ for a finished bourbon while he owned 36 of them. A gap in
    // one house is not a gap on the shelf.
    } else if (!fins.size && !all.some(p => p.sub === set[0].sub && p.fin)) {
      // NOT "a finished bottling from Buffalo Trace". Naming the house
      // asks for something the app has no grounds to believe that house
      // makes — it can see 24 bottles and no finish, and nothing more.
      // The observation is sound; the instruction was not.
      out.push({ kind: 'extend', sub: set[0].sub,
        name: 'A finished ' + L.titleCase(set[0].sub || 'whisky'),
        why: set.length + ' from ' + dist + ' and not one finished bottling, '
          + 'so the wood has never been the variable against them. Theirs '
          + 'if they release one, anybody\u2019s if not.',
        weight: 38 + commit });
    } else if (!ages.length && !all.some(p => p.sub === set[0].sub && p.age)) {
      out.push({ kind: 'extend', sub: set[0].sub,
        name: 'An age-stated ' + L.titleCase(set[0].sub || 'whisky'),
        why: set.length + ' from ' + dist + ' and no age statement among '
          + 'them, so age has never been the variable against them. Theirs '
          + 'if they put one on a bottle, anybody\u2019s if not.',
        weight: 34 + commit });
    }
  });
  // Three is a suggestion; eight near-identical lines is noise. And two
  // findings of the same KIND saying the same thing about different values
  // — a Campbeltown Scotch and a Lowland Scotch — is one finding as far as
  // anybody reading it is concerned, so only the best of each kind rises to
  // the top; the rest fall below the fold.
  out.sort((a, b) => b.weight - a.weight);
  const seenKind = {};
  out.forEach(g => {
    seenKind[g.kind] = (seenKind[g.kind] || 0) + 1;
    if (seenKind[g.kind] > 1) g.weight -= 12 * (seenKind[g.kind] - 1);
  });
  out.sort((a, b) => b.weight - a.weight);
  return out.slice(0, 3);
};

// CONTRAST: where the shelf leans so far one way that the comparison cannot
// be made at all. 97 wine-cask bottles against 13 wood-only is not a
// shortage of wine casks.
L.gapsFromContrast = function (catalog, bottles) {
  const live = Object.values(catalog);
  const n = f => live.filter(f).length;
  const out = [];

  const wine = n(p => p.wine === true), wood = n(p => p.wine === false);
  if (wine >= 20 && wood * 4 < wine) {
    out.push({ kind: 'contrast', name: 'A wood-only bottling',
      why: wine + ' wine-cask bottles against ' + wood + ' finished in wood '
        + 'alone. You cannot taste what the wine is doing without the other '
        + 'side.', weight: 62 });
  }

  const peated = n(p => /peat|smok|islay/i.test((p.fin || '') + p.name)
    || p.region === 'Islay');
  const unpeatedIslay = n(p => p.region === 'Islay'
    && /bruichladdich|bunnahabhain/i.test(p.dist || ''));
  if (peated >= 25 && unpeatedIslay < 2) {
    out.push({ kind: 'contrast', name: 'An unpeated Islay',
      why: 'Islay is your biggest region and it is peated throughout. An '
        + 'unpeated one separates the island from the smoke.', weight: 60 });
  }

  const nas = n(p => !p.age), aged = n(p => p.age);
  if (nas > aged * 3 && aged < 40) {
    out.push({ kind: 'contrast', name: 'An age-stated bottle you can compare',
      why: nas + ' with no age statement against ' + aged + ' with one, so '
        + 'age is hard to hold still as a variable.', weight: 44 });
  }
  return out;
};

// A flight you cannot run because a pour is missing. The strongest kind of
// gap, because the thing it unlocks is concrete and already designed.
L.gapsFromFlights = function (flights, catalog, bottles) {
  const out = [];
  (flights || []).forEach(f => {
    const shape = L.flightShape(f, catalog, bottles);
    if (shape.ready === shape.total) return;
    const missing = (f.core || []).filter(p =>
      !L.pourAvailable(p, catalog, bottles));
    // One bottle short is worth acting on. Four short is a different flight.
    if (!missing.length || missing.length > 2) return;
    // Say what the flight IS, not what it is called. A name only means
    // something to whoever wrote it, and once shelves are shared these
    // flights are not the reader's flights.
    // What every OTHER pour in this flight has in common, which is the best
    // evidence about the one that is missing — and often there is none.
    // Peat Is a Postcode runs Scotch, Canadian and Irish on purpose, since
    // the flight is about peat crossing borders, so inferring a category
    // from its other pours would be a guess wearing the clothes of a fact.
    const known = (f.core || []).map(p => catalog[p.k]).filter(Boolean);
    const subs = new Set(known.map(p => p.sub).filter(Boolean));
    const uniformSub = subs.size === 1 && known.length >= 3
      ? [...subs][0] : null;

    const shapeName = (f.core || []).length + '-pour '
      + (L.variableOfId(f) === 'proof' ? 'proof ladder'
         : L.variableOfId(f) === 'finish' ? 'cask comparison'
         : L.variableOfId(f) === 'region' ? 'regional comparison'
         : L.variableOfId(f) === 'age' ? 'age comparison'
         : L.variableOfId(f) === 'grain' ? 'grain comparison'
         : L.variableOfId(f) === 'house' ? 'single-distillery flight'
         : 'tasting');
    missing.forEach(p => {
      const kind = L.pourKind(p);
      out.push({
        kind: 'flight',
        name: L.pourLabel(p, catalog) || p.card || 'a missing pour',
        why: missing.length === 1
          ? 'The last bottle you need for a ' + shapeName + ' you have designed.'
          : 'One of two bottles missing from a ' + shapeName + ' you have designed.',
        flight: f.title,
        // A sealed bottle you own costs nothing to open.
        owned: kind === 'shelf' && L.ownedCount(p.k, bottles) > 0,
        // A wish pour records what the card knew, so clicking through does
        // not arrive at an empty form for a bottle we can describe. Where
        // the pour itself says nothing, the flight does: every other pour
        // in Peat Is a Postcode is a Scotch, so the missing one is too.
        proof: p.proof || (catalog[p.k] || {}).proof || null,
        sub: (catalog[p.k] || {}).sub || uniformSub,
        weight: missing.length === 1 ? 100 : 70
      });
    });
  });
  return out;
};

// Anything on the wishlist that no flight accounts for. You wanted it for
// a reason; the reason was recorded.
L.gapsFromWish = function (wish, flights, catalog, bottles) {
  const claimed = {};
  L.wishFromFlights(flights).forEach(w => { claimed[L.shopNorm(w.name)] = 1; });
  // Buying it is the end of wanting it. A wish is removed when you add the
  // bottle through Shop, but a bottle added any OTHER way — imported,
  // typed on the shelf, arrived from a lookup — left the wish standing, so
  // Longrow kept being suggested after BZ had it in his hand.
  const owned = {};
  Object.values(catalog || {}).forEach(p => {
    if (L.ownedCount(p.k, bottles || []) > 0) owned[L.shopNorm(p.name)] = 1;
  });
  return (wish || [])
    .filter(w => !claimed[L.shopNorm(w.name)] && !owned[L.shopNorm(w.name)])
    .map(w => ({
      kind: 'wish', name: w.name,
      // Your own reason stands alone when you gave one — appending to it
      // buries what you actually said. Only the default changes, and it
      // now says the finding is yours rather than something the app worked
      // out, which is why a named bottle among the findings read as noise.
      why: w.reason
        || ('You added this to your list'
            + (w.added ? ' on ' + w.added : '') + '.'),
      est: w.est || null, price: w.est || null, weight: 60
    }));
};

// A dimension too thin to build a flight on. One Lowland is a bottle; it is
// not a comparison, and a region flight needs at least three.
L.gapsFromThinness = function (catalog) {
  const out = [];
  const live = Object.values(catalog);
  const count = fn => {
    const c = {};
    live.forEach(p => { const v = fn(p); if (v) c[v] = (c[v] || 0) + 1; });
    return c;
  };

  const regions = count(p => p.sub === 'scotch' ? p.region : null);
  L.SCOTCH_REGIONS.forEach(r => {
    const n = regions[r] || 0;
    if (n >= 3) return;
    // One per screen, and not two. Campbeltown and Lowland both sat above
    // a real finding, saying the same thing in different words — and the
    // gap is only worth acting on when it is CLOSE to being useful, since
    // a region you own nothing from needs three bottles rather than one.
    out.push({
      kind: 'region', region: r, sub: 'scotch',
      name: 'A ' + r + ' Scotch',
      why: n === 0
        ? 'Nothing from ' + r + ' at all \u2014 three would make a region '
          + 'flight possible.'
        : 'Only ' + n + ' from ' + r + '. ' + (3 - n) + ' more and a region '
          + 'flight can use it.',
      // Nearly there ranks above nowhere near: two bottles short is a
      // shopping trip, three is a project.
      weight: n >= 1 ? 52 - (3 - n) * 4 : 30
    });
  });

  const subs = count(p => p.sub);
  Object.keys(subs).forEach(s => {
    const n = subs[s];
    if (n >= 3 || s === 'tequila' || s === 'flavored') return;
    out.push({
      kind: 'category', sub: s,
      name: 'Another ' + L.titleCase(s),
      why: 'Only ' + n + ' on the shelf, which is too few to compare.',
      weight: 45 - n * 5
    });
  });
  return out;
};

// Where the proof ladder runs out. A flight climbing past 120 needs bottles
// up there to climb to.
L.gapsFromProof = function (catalog) {
  const live = Object.values(catalog);
  const band = f => live.filter(f).length;
  const out = [];
  const top = band(p => p.proof >= 120);
  const low = band(p => p.proof < 90);
  if (top < 12) {
    out.push({ kind: 'proof', name: 'Something above 120 proof',
      why: 'Only ' + top + ' bottles over 120, so a proof ladder runs out at '
        + 'the top.', weight: 40 });
  }
  if (low < 12) {
    out.push({ kind: 'proof', name: 'Something under 90 proof',
      why: 'Only ' + low + ' bottles under 90, so a ladder has nowhere to '
        + 'start.', weight: 35 });
  }
  return out;
};

// A matched pair is the strongest shape a flight can have: same distillery,
// same proof, differing in one perceptible way. Where a bottle sits alone at
// a proof its housemates share, the pair is one bottle away.
L.gapsFromPairs = function (catalog, bottles) {
  const byDist = {};
  Object.values(catalog).forEach(p => {
    if (!p.dist || !L.pourable(p.k, bottles)) return;
    (byDist[p.dist] = byDist[p.dist] || []).push(p);
  });
  const out = [];
  Object.keys(byDist).forEach(dist => {
    const set = byDist[dist];
    if (set.length < 2 || set.length > 12) return;
    // A house with several bottles but no two at the same strength cannot
    // hold the variable still.
    const proofs = {};
    set.forEach(p => {
      const k = Math.round(p.proof);
      proofs[k] = (proofs[k] || 0) + 1;
    });
    const hasPair = Object.keys(proofs).some(k => proofs[k] >= 2);
    if (hasPair || set.length < 3) return;
    out.push({
      kind: 'pair', dist: dist,
      name: 'A second bottling from ' + dist + ' at a proof you already have',
      why: set.length + ' from ' + dist + ' and no two at the same strength, '
        + 'so there is no matched pair to build on.',
      weight: 30
    });
  });
  return out;
};

// Everything, ranked. Something you already own but have not opened comes
// first: it costs nothing.
// Gaps that turned out to be impossible. Recorded so the shelf stops
// recommending something the house does not make.
L.gapKey = function (g) { return (g.kind || '') + '|' + L.shopNorm(g.name || ''); };

/* What each ask has actually produced.

   deadGaps was binary and permanent: an ask either had been proven
   impossible or had not. Everything in between — an ask that comes back
