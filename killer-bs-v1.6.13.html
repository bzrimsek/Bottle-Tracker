      left.appendChild(el('div', 'nm oneline', x.p.name));
      // The change, not the name of the kind of change. A row saying
      // "proof, fin differs" tells you a batch is about to go out and
      // nothing about what is in it.
      if (x.changes && x.changes.length) {
        x.changes.slice(0, 4).forEach(c =>
          left.appendChild(el('div', 'sub', c.text)));
        if (x.changes.length > 4) {
          left.appendChild(el('div', 'src',
            (x.changes.length - 4) + ' more fields'));
        }
      } else {
        left.appendChild(el('div', 'sub', x.why));
      }
      r.appendChild(left);
      /* In or out, said out loud. This was a tick, a dash and a change of
         opacity — three ways of saying the same quiet thing, none of which
         reads as a decision at a glance on a list of 58. */
      const mark = el('div', 'findtag f-shelf');
      const paint = () => {
        mark.textContent = chosen[i] ? '\u002b publish' : '\u00d7 skip';
        mark.className = 'findtag ' + (chosen[i] ? 'f-shelf' : 'f-allocated');
        r.style.opacity = chosen[i] ? '1' : '.55';
      };
      paint();
      r.appendChild(mark);
      r.onclick = () => { chosen[i] = !chosen[i]; paint(); };
      (addBox && isAdd[i] ? addBox : list).appendChild(r);
    });
    m.appendChild(list);

    // Named after the mark on the row. It said "ticked" while the rows
    // carry a publish or skip pill, which is two names for one decision.
    const go = el('button', 'btn wide btn-gold', 'Publish the ones marked publish');
    go.style.marginTop = '11px';
    go.onclick = () => {
      const picked = pend.filter((x, i) => chosen[i]).map(x => x.p);
      closeModal();
      publishBatch(picked, after);
    };
    m.appendChild(go);
    const close = el('button', 'btn ghost wide', 'Close');
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

// A library entry, read only. What it holds and where it came from — no
// controls, because there is nothing here a reader may change.
function showLibraryEntry(p) {
  openModal(p.name, m => {
    const rows = [['Proof', p.proof], ['Distillery', p.dist],
                  ['Category', p.sub && L.titleCase(p.sub)],
                  ['Region', p.region], ['Age', p.age],
                  ['Cask', p.fin], ['Price', p.msrp && '$' + p.msrp]];
    const list = el('div', 'recent');
    rows.forEach(([k, v]) => {
      if (!v) return;
      const r = el('div', 'item');
      r.appendChild(el('div', 'nm', k));
      r.appendChild(el('div', 'pf', String(v)));
      list.appendChild(r);
    });
    m.appendChild(list);
    if (p.tn && p.tn.nose) {
      const tn = el('div', 'sheet');
      tn.style.marginTop = '9px';
      ['colour', 'nose', 'palate', 'finish'].forEach(k => {
        if (!p.tn[k]) return;
        tn.appendChild(el('div', 'rs', L.titleCase(k)));
        tn.appendChild(el('div', 'sub', p.tn[k]));
      });
      m.appendChild(tn);
    }
    m.appendChild(el('div', 'src',
      'From the shared library. If something here is wrong, correct it on '
      + 'your own shelf and it will be offered as a fix.'));
    const close = el('button', 'btn ghost wide', 'Close');
    close.style.marginTop = '11px';
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

function fbLibraryRef() {
  return firebase.database().ref('bz-apps/whisky/shared/catalog/products');
}

// The library on its own screen. Browsing is for everybody — it is the
// answer to what does this app already know about, and the thing people are
// contributing to — while editing and removing are an admin's. Those were
// both behind Admin mode, so a normal user could not see the library at
// all despite feeding it.
function renderLibraryScreen() {
  const box = $('#libBody');
  box.innerHTML = '';
  if (!FB.user) {
    box.appendChild(el('div', 'empty',
      'Sign in to see the library. It is the shared list of whiskies '
      + 'everybody reads and adds to \u2014 your own shelf is separate.'));
    return;
  }
  box.appendChild(el('div', 'empty', 'Loading\u2026'));
  fbCheckAdmin().then(() => {
    box.innerHTML = '';
    // Waiting entries first, and only for an admin. Buried in Diagnostics
    // they would sit unseen; here they are in front of the person who can
    // act on them, on the screen the library actually lives on.
    if (LIB.admin) renderContrib(box);
    renderLibrary(box);
  });
}

function renderLibrary(box) {
  const card = el('div', 'sheet');
  card.appendChild(el('h3', null, 'The library'));
  box.appendChild(card);
  if (!FB.user) { card.appendChild(el('div', 'sub', 'Sign in first.')); return; }

  // Fetch if we do not have it, then draw. The only safe callback for
  // anything that has just changed the library.
  const load = () => {
    if (LIB.products) { draw(); return; }
    card.innerHTML = '';
    card.appendChild(el('h3', null, 'The library'));
    card.appendChild(el('div', 'sub', 'Loading\u2026'));
    fbLibraryRef().once('value').then(sn => {
      const v = sn.val();
      // Either shape: a library imported before the keyed change is a list.
      LIB.products = Array.isArray(v)
        ? Object.fromEntries(v.filter(Boolean).map(p => [L.libKey(p.name), p]))
        : (v || {});
      draw();
    }).catch(() => {
      card.innerHTML = '';
      card.appendChild(el('h3', null, 'The library'));
      card.appendChild(el('div', 'sub', 'Could not read it.'));
    });
  };

  const draw = () => {
    card.innerHTML = '';
    card.appendChild(el('h3', null, 'The library'));
    const all = LIB.products || {};
    const n = Object.keys(all).length;
    const thin = Object.values(all).filter(p => L.libraryGaps(p).length).length;
    const cnt = document.getElementById('libCount');
    if (cnt) cnt.textContent = n;
    card.appendChild(el('div', 'sub', n + ' whiskies'
      + (LIB.admin && thin ? ', ' + thin + ' missing something' : '')
      + '. Everybody reads this and adds to it; a bottle you look up that '
      + 'is not here joins it for everybody.'));

    // What differs between this shelf and the library, publishable without
    // replacing anything else. The Firebase import is a seeding tool and
    // destroys whatever it lands on; this is the tool for every day after
    // the first.
    if (LIB.admin) {
      const pend = pendingForLibrary();
      if (pend.length) {
        const pb = el('button', 'btn wide btn-gold',
          'Publish ' + pend.length + ' to the library');
        pb.style.marginTop = '10px';
        // load, never draw: publishBatch clears the cache on the way out.
        pb.onclick = () => reviewBatch(pend, load);
        card.appendChild(pb);
        card.appendChild(el('div', 'src',
          'Writes only these, leaving everything else in the library alone.'));
      }

      /* Cleaning up after the publish that went out before libraryEntry
         knew the rule. A note written onto a flight card is a prompt for
         that room, not a description of the whisky, and the published entry
         does not carry tnFrom — so once it is in the library nobody can
         tell. The shelf it came from still knows, which is what makes this
         findable at all. */
      const invented = L.promptNotesInLibrary(S.catalog, all);
      if (invented.length) {
        const cb = el('button', 'btn wide', 'Take back ' + invented.length
          + ' invented note' + (invented.length === 1 ? '' : 's'));
        cb.style.marginTop = '10px';
        cb.onclick = () => confirmDelete(
          invented.length + ' flight-card notes from the library', () => {
            const updates = { stamp: Date.now() };
            invented.forEach(x => {
              updates['catalog/products/' + x.key + '/tn'] = null;
            });
            firebase.database().ref('bz-apps/whisky/shared').update(updates)
              .then(() => {
                appLog('library: took back ' + invented.length
                  + ' flight-card notes');
                LIB.products = null;
                toast(invented.length + ' taken back');
                renderLibraryScreen();
              })
              .catch(e => toast('Failed: ' + (e.message || e)));
          });
        card.appendChild(cb);
        card.appendChild(el('div', 'src',
          'These carry a note written for a flight card rather than a '
          + 'description of the whisky. Everything else about the entry '
          + 'stays; only the note goes.'));
      }
    }

    const q = document.createElement('input');
    q.className = 'field';
    q.style.marginTop = '9px';
    q.placeholder = 'Name, distillery, cask, region';
    q.value = LIB.q;
    q.oninput = () => { LIB.q = q.value; list(); };
    q.placeholder = 'Search all ' + n + ' by name, distillery, cask or region';
    card.appendChild(q);

    const out = el('div', 'scrollbox');
    out.style.cssText = 'max-height:46vh;overflow-y:auto;margin-top:8px';
    card.appendChild(out);

    const list = () => {
      out.innerHTML = '';

      // Nothing searched and no category chosen: show the way in rather
      // than the first sixty alphabetically, which begins at 10th Street
      // and tells nobody anything.
      if (!LIB.q && !LIB.sub) {
        const by = {};
        Object.values(all).forEach(p => {
          const k = p.sub || 'other';
          by[k] = (by[k] || 0) + 1;
        });
        const tiles = el('div', 'tiles');
        Object.entries(by).sort((a, b) => b[1] - a[1]).forEach(([k, n]) => {
          const t = el('button', 'tile');
          t.appendChild(el('div', 'v', String(n)));
          t.appendChild(el('div', 'l', L.titleCase(k)));
          t.onclick = () => { LIB.sub = k; list(); };
          tiles.appendChild(t);
        });
        out.appendChild(tiles);
        return;
      }

      if (LIB.sub) {
        const back = el('button', 'chip', '\u2039 All types');
        back.style.marginBottom = '9px';
        back.onclick = () => { LIB.sub = null; list(); };
        out.appendChild(back);
      }

      // A search leaves the type behind. Somebody who types Lagavulin
      // while looking at Bourbon means the whole library, not nothing.
      const pool = (LIB.sub && !LIB.q)
        ? Object.fromEntries(Object.entries(all)
            .filter(([, p]) => (p.sub || 'other') === LIB.sub))
        : all;
      const hits = L.searchLibrary(pool, LIB.q, 60);
      if (!hits.length) {
        out.appendChild(el('div', 'empty', 'Nothing matches.'));
        return;
      }
      hits.forEach(p => {
        const gaps = L.libraryGaps(p);
        const r = el('button', 'item');
        r.style.cssText = 'width:100%;text-align:left';
        const left = el('div');
        left.appendChild(el('div', 'nm', p.name));
        left.appendChild(el('div', 'sub',
          [p.dist, p.proof ? p.proof + ' proof' : null, p.fin]
            .filter(Boolean).join(' \u00b7 ') || '\u2014'));
        if (gaps.length) {
          left.appendChild(el('div', 'src', 'no ' + gaps.join(', no ')));
        }
        r.appendChild(left);
        r.appendChild(el('div', 'pf', gaps.length ? '!' : ''));
        // Everybody can look; only an admin can change.
        r.onclick = () => LIB.admin ? editLibraryEntry(p, draw)
                                    : showLibraryEntry(p);
        out.appendChild(r);
      });
      if (hits.length === 60) {
        out.appendChild(el('div', 'src', LIB.sub
          ? 'First 60 of ' + Object.keys(pool).length + '. Search to narrow it.'
          : 'First 60. Search, or pick a type.'));
      }
    };
    list();
  };

  /* draw() renders whatever LIB.products holds. load() makes sure it holds
     something first.

     Publishing set LIB.products = null to force a re-read and then called
     draw directly — which read null as an empty library, said 0 whiskies,
     and offered to publish the whole shelf again, because pendingForLibrary
     compares against that same empty object. Going Home and back fixed it,
     since that path goes through the fetch. Nothing that clears the cache
     may call draw; it calls this. */
  load();
}

// Fixing one. Every write moves the stamp, or devices keep the copy they
// already hold and a correction only some people see is worse than none.
function editLibraryEntry(p, after) {
  openModal(p.name, m => {
    m.appendChild(el('div', 'sub',
      'Changing this changes it for everybody, on their next open.'));
    const form = el('div', 'form');
    // The name first, because it is the field this is usually opened for:
    // an entry published in the case it happened to be typed in. Renaming
    // moves the entry, since the library is keyed by the name.
    const nameWrap = el('label', null, 'Name');
    const nameInp = document.createElement('input');
    nameInp.className = 'field';
    nameInp.type = 'text';
    nameInp.value = p.name || '';
    nameWrap.appendChild(nameInp);
    form.appendChild(nameWrap);
    const fields = [
      ['proof', 'Proof', 'number'], ['dist', 'Distillery', 'text'],
      ['age', 'Age', 'number'], ['fin', 'Cask', 'text'],
      ['region', 'Region', 'text'], ['msrp', 'Price', 'number']
    ];
    const inputs = {};
    fields.forEach(([k, label, type]) => {
      const wrap = el('label', null, label);
      const inp = document.createElement('input');
      inp.className = 'field';
      inp.type = type;
      if (type === 'number') inp.step = '0.1';
      inp.value = p[k] == null ? '' : p[k];
      inputs[k] = inp;
      wrap.appendChild(inp);
      form.appendChild(wrap);
    });
    m.appendChild(form);

    const save = el('button', 'btn wide btn-gold', 'Save for everybody');
    save.style.marginTop = '11px';
    save.onclick = () => {
      const oldKey = p._key || L.libKey(p.name);
      const rename = L.libraryRename(LIB.products || {}, oldKey, nameInp.value);
      if (!rename.ok) { toast(rename.why); return; }

      const next = Object.assign({}, p, { name: rename.name });
      delete next._key;
      fields.forEach(([k, , type]) => {
        const v = inputs[k].value.trim();
        if (!v) { delete next[k]; return; }
        // Never NaN into the shared library, where everybody would read it.
        if (type === 'number') {
          const n = L.toNum(v);
          if (n === null) { delete next[k]; return; }
          next[k] = n;
        } else { next[k] = v; }
      });
      const now = Date.now();
      // A rename is a MOVE: written at the new key and cleared from the old
      // one in the same update, or the library holds it twice.
      const write = { ['catalog/products/' + rename.key]:
                        Object.assign({}, next, { at: now }),
                      stamp: now };
      if (rename.moved) write['catalog/products/' + oldKey] = null;
      firebase.database().ref('bz-apps/whisky/shared')
        .update(L.fbEncodePaths(write))
        .then(() => {
          if (rename.moved) delete LIB.products[oldKey];
          LIB.products[rename.key] = next;
          appLog('library: ' + (rename.moved
            ? 'renamed ' + p.name + ' to ' + rename.name
            : 'edited ' + rename.name));
          closeModal(); after();
          toast(rename.moved ? 'Renamed for everybody' : 'Changed for everybody');
        }).catch(e => toast(e.message || String(e)));
    };
    m.appendChild(save);

    const rm = el('button', 'btn ghost wide', 'Remove from the library');
    rm.onclick = () => confirmDelete(p.name + ' from the library', () => {
      const key = p._key || L.libKey(p.name);
      /* Kept, so it can be put back. This is the only destructive action in
         the app that changes what EVERYBODY sees, and it was the one with a
         confirm and no undo — the wrong way round. A confirm asks whether
         you meant it; an undo helps when you did mean it and were wrong. */
      const gone = Object.assign({}, p);
      delete gone._key;
      firebase.database().ref('bz-apps/whisky/shared')
        .update({ ['catalog/products/' + key]: null, stamp: Date.now() })
        .then(() => {
          delete LIB.products[key];
          appLog('library: removed ' + p.name);
          closeModal(); after();
          toast('Removed for everybody', { label: 'Undo', action: () => {
            firebase.database().ref('bz-apps/whisky/shared')
              .update(L.fbEncodePaths({ ['catalog/products/' + key]:
                                     Object.assign({}, gone, { at: Date.now() }),
                                   stamp: Date.now() }))
              .then(() => {
                LIB.products[key] = gone;
                appLog('library: put ' + p.name + ' back');
                after();
                toast('Back in the library');
              })
              .catch(e => {
                appLog('library: could not put ' + p.name + ' back: '
                  + ((e && e.message) || e));
                toast('Could not put it back: ' + ((e && e.message) || e));
              });
          } });
        }).catch(e => toast(e.message || String(e)));
    });
    m.appendChild(rm);

    const close = el('button', 'btn ghost wide', 'Close');
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

// Who has asked, who is in, and who you could ask. Rebuilt from the server
// each time rather than cached, since a share is a permission and a stale
// view of a permission is worse than a slow one.
// Send an invite: a link with your uid in it. It carries no access — the
// request it produces still has to be accepted, exactly as if they had
// found you in the directory.
function showInvite() {
  openModal('Invite a drinking buddy', m => {
    if (!S.displayName) {
      m.appendChild(el('div', 'errs',
        'Set a display name first, or the invite arrives from nobody.'));
      const close = el('button', 'btn ghost wide', 'Close');
      close.onclick = closeModal;
      m.appendChild(close);
      return;
    }
    const link = L.buddyLink(location.href, FB.user.uid);
    const body = L.inviteText(S.displayName, link);

    m.appendChild(el('div', 'sub',
      'Edit this however you like, then send it. They open the link and '
      + 'sign in, and it asks you to let them in \u2014 the link gives away '
      + 'nothing on its own.'));

    // Editable. It is your message to somebody you know, and the wording
    // that suits one friend does not suit another.
    const ta = document.createElement('textarea');
    ta.className = 'field';
    ta.rows = 9;
    ta.style.cssText = 'margin-top:10px;font-size:13px;line-height:1.5;resize:vertical';
    ta.value = body;
    m.appendChild(ta);

    const sms = el('button', 'btn wide btn-gold', 'Send the text');
    sms.style.marginTop = '11px';
    sms.onclick = () => {
      location.href = 'sms:?&body=' + encodeURIComponent(ta.value);
    };
    m.appendChild(sms);

    const copy = el('button', 'btn ghost wide', 'Copy the message');
    copy.onclick = () => {
      if (!navigator.clipboard) { toast('Clipboard not available'); return; }
      navigator.clipboard.writeText(ta.value)
        .then(() => toast('Link copied')).catch(() => toast('Could not copy'));
    };
    m.appendChild(copy);

    const close = el('button', 'btn ghost wide', 'Close');
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

function renderBuddies() {
  const card = document.getElementById('buddyCard');
  if (!card || !FB.user) return;

  Promise.all([fbMyRequests(), fbSharedWith(), fbDirectory()])
    .then(([reqs, shared, dir]) => {
      card.innerHTML = '';
      card.appendChild(el('h3', null, 'Tasting buddies'));

      // Requests first: somebody is waiting on you.
      if (reqs.length) {
        card.appendChild(el('div', 'rs', reqs.length === 1
          ? 'One person has asked to see your shelf'
          : reqs.length + ' people have asked to see your shelf'));
        reqs.forEach(r => {
          const row = el('div', 'item');
          const left = el('div');
          left.appendChild(el('div', 'nm', r.name || '(no name)'));
          left.appendChild(el('div', 'sub',
            'Letting them in shows your whole shelf. They can never change it.'));
          row.appendChild(left);
          const yes = el('button', 'chip', 'Let in');
          yes.dataset.on = 'true';
          yes.onclick = () => fbAccept(r.from).then(renderBuddies)
            .catch(e => toast(e.message || String(e)));
          row.appendChild(yes);
          const no = el('button', 'chip', 'No');
          no.onclick = () => fbDecline(r.from).then(renderBuddies);
          row.appendChild(no);
          card.appendChild(row);
        });
      }

      // Who can see your shelf, and how to stop them.
      const sh = el('div');
      sh.style.marginTop = reqs.length ? '12px' : '0';
      sh.appendChild(el('div', 'rs', shared.length
        ? 'Can see your shelf' : 'Nobody can see your shelf yet'));
      shared.forEach(s => {
        const row = el('div', 'item');
        row.appendChild(el('div', 'nm', s.name));
        const off = el('button', 'chip', 'Stop sharing');
        off.onclick = () => confirmDelete(s.name + '\u2019s access',
          () => fbRevoke(s.uid).then(renderBuddies));
        row.appendChild(off);
        sh.appendChild(row);
      });
      card.appendChild(sh);

      // People you could ask. Only those who chose to be findable, and
      // never anyone already in.
      const already = {};
      shared.forEach(s => { already[s.uid] = 1; });
      const askable = dir.filter(d => !already[d.uid]);
      const find = el('div');
      find.style.marginTop = '12px';
      if (!S.findable) {
        find.appendChild(el('div', 'src',
          'You are not findable yourself, so nobody can ask you. That is a '
          + 'separate switch from asking others.'));
      }
      // Inviting somebody who is not here yet. Above the directory, since
      // with three friends the person you want is more often not on it.
      const inv = el('div', 'lookrow');
      inv.style.marginTop = '12px';
      const invBtn = el('button', 'btn btn-sm btn-gold', 'Invite by text');
      invBtn.onclick = () => showInvite();
      inv.appendChild(invBtn);
      find.appendChild(inv);

      if (askable.length) {
        find.appendChild(el('div', 'rs', 'Or ask someone already here'));
        askable.slice(0, 12).forEach(d => {
          const row = el('div', 'item');
          row.appendChild(el('div', 'nm', d.name));
          const ask = el('button', 'chip', 'Ask');
          ask.onclick = () => {
            ask.disabled = true;
            fbSendRequest(d.uid)
              .then(() => { ask.textContent = 'Asked'; })
              .catch(e => { ask.disabled = false; toast(e.message || String(e)); });
          };
          row.appendChild(ask);
          find.appendChild(row);
        });
      } else {
        find.appendChild(el('div', 'src',
          'Nobody else is findable yet. They each need to set a name and turn '
          + 'the switch on.'));
      }
      card.appendChild(find);

      card.appendChild(el('div', 'src',
        'Sharing is one-way and you control your side. Letting somebody see '
        + 'your shelf does not let you see theirs, and stopping takes effect '
        + 'at once.'));
      // What is shared, listed rather than promised. It is short enough to
      // read, and the list is the thing people actually want to know.
      card.appendChild(el('div', 'src',
        'They see your bottles, whether each is open, and your own '
        + 'corrections to them. They do not see what you have poured, your '
        + 'wishlist or your flights \u2014 those are not readable by anybody '
        + 'but you.'));
    })
    .catch(e => {
      card.innerHTML = '';
      card.appendChild(el('h3', null, 'Tasting buddies'));
      card.appendChild(el('div', 'errs', 'Could not load: ' + (e.message || e)));
    });
}

// Setup that most people touch once and never again. Closed by default, on
// MadGolf's pattern, so Settings reads as the things you actually change.
function renderLookupSetup(box) {
  const wrap = el('details', 'advanced');
  const sum = el('summary');
  sum.textContent = 'Advanced';
  wrap.appendChild(sum);

  const card = el('div', 'sheet');
  card.style.marginTop = '9px';
  card.appendChild(el('h3', null, 'Bottle lookup'));
  card.appendChild(el('div', 'sub',
    'The web-app URL of your lookup script. Leave it blank and adding a '
    + 'bottle stays manual.'));

  const inp = document.createElement('input');
  inp.className = 'field'; inp.type = 'url'; inp.style.marginTop = '9px';
  inp.placeholder = 'https://script.google.com/macros/s/…/exec';
  inp.value = S.lookupUrl || '';
  card.appendChild(inp);
  const save = el('button', 'chip', 'Save');
  save.style.marginTop = '8px';
  save.onclick = () => {
    const v = inp.value.trim();
    if (v && !/^https:\/\//.test(v)) { toast('That has to be an https URL'); return; }
    S.lookupUrl = v;
    save_();
    toast(v ? 'Lookup endpoint saved' : 'Lookup turned off');
  };
  card.appendChild(save);
  wrap.appendChild(card);

  // Getting a stuck phone unstuck. A control beats advice about clearing
  // caches, and this is exactly the situation where the automatic path has
  // already failed.
  const upd = el('div', 'sheet');
  upd.style.marginTop = '9px';
  upd.appendChild(el('h3', null, 'Version'));
  upd.appendChild(el('div', 'sub',
    'Running v' + APP_VERSION + ', built ' + BUILD_TIME + '. The app and the '
    + 'catalogue update themselves; these force the check. The catalogue is '
    + 'the shared list of whiskies \u2014 your own bottles, notes and edits '
    + 'are separate and are never touched by it.'));
  const ur = el('div', 'lookrow');
  ur.style.marginTop = '9px';
  const cb = el('button', 'btn btn-sm', 'Check the catalogue');
  cb.onclick = () => {
    if (!FB.user) { toast('Sign in first'); return; }
    cb.disabled = true;
    fbSyncCatalog().then(changed => {
      cb.disabled = false;
      if (!changed) toast('Catalogue is already current');
    });
  };

  // A device can be left holding a marker later than anything in the
  // library — an earlier build stored the clock when the data carried no
  // timestamps — and then nothing ever looks new to it again. This forgets
  // the marker and takes the library whole.
  const cf = el('button', 'btn btn-sm ghost', 'Fetch the whole catalogue');
  cf.onclick = () => {
    if (!FB.user) { toast('Sign in first'); return; }
    try { localStorage.removeItem(CAT_STAMP_KEY); } catch (e) {}
    cf.disabled = true;
    fbSyncCatalog().then(changed => {
      cf.disabled = false;
      if (!changed) toast('The library is empty');
    });
  };

  const ub = el('button', 'btn btn-sm', 'Check for an update');
  ub.onclick = () => {
    ub.disabled = true;
    ub.textContent = 'Checking\u2026';
    if (!navigator.serviceWorker) { toast('Not supported here'); return; }
    navigator.serviceWorker.getRegistration().then(reg => {
      if (!reg) { toast('No service worker registered'); ub.disabled = false;
        ub.textContent = 'Check for an update'; return; }
      return reg.update().then(() => {
        if (reg.waiting) {
          toast('Update found \u2014 loading it now');
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          return;
        }
        // Nothing waiting: either up to date, or the worker itself is being
        // served stale. Unregistering forces a clean fetch on reload.
        toast('Already current. Reloading to be sure.');
        setTimeout(() => location.reload(), 900);
      });
    }).catch(e => {
      toast('Could not check: ' + (e.message || e));
      ub.disabled = false;
      ub.textContent = 'Check for an update';
    });
  };
  ur.appendChild(ub);
  ur.appendChild(cb);
  ur.appendChild(cf);

  const hard = el('button', 'btn btn-sm ghost', 'Force a clean reload');
  hard.onclick = () => confirmDelete('the cached copy of the app', () => {
    // Everything cached, and the worker with it. Your shelf lives in
    // localStorage and your account, so this loses nothing.
    Promise.all([
      navigator.serviceWorker.getRegistrations()
        .then(rs => Promise.all(rs.map(r => r.unregister()))).catch(() => {}),
      (window.caches ? caches.keys().then(ks =>
        Promise.all(ks.map(k => caches.delete(k)))) : Promise.resolve())
        .catch(() => {})
    ]).then(() => location.reload(true));
  });
  ur.appendChild(hard);
  upd.appendChild(ur);
  wrap.appendChild(upd);

  // Admin mode. Off by default, and it adds a screen rather than changing
  // how anything behaves — nothing here can alter the shelf.
  const adm = el('div', 'sheet');
  adm.style.marginTop = '9px';
  adm.appendChild(el('h3', null, 'Admin mode'));
  adm.appendChild(el('div', 'sub',
    'Adds a Diagnostics screen showing what the app knows about its own '
    + 'state and a log of what it last did \u2014 including what a lookup '
    + 'actually returned when one fails \u2014 copyable in one tap. Nothing '
    + 'here changes your shelf.'));
  const arow = el('div', 'lookrow');
  arow.style.marginTop = '9px';
  const t = el('button', 'chip', S.admin ? 'Admin mode on' : 'Admin mode off');
  t.dataset.on = !!S.admin;
  t.onclick = () => { S.admin = !S.admin; save_(); renderSettings(); };
  arow.appendChild(t);
  if (S.admin) {
    const open = el('button', 'btn btn-sm', 'Diagnostics');
    open.onclick = () => { renderDiag(); goTo('diag'); };
    arow.appendChild(open);
  }
  adm.appendChild(arow);
  wrap.appendChild(adm);

  box.appendChild(wrap);
}

function renderReference() {
  const box = $('#refBody'); box.innerHTML = '';
  const q = $('#refQ').value;
  renderRefGroups();
  // Searching spans every group; browsing shows the group you picked.
  $('#refGroups').style.display = q.trim() ? 'none' : '';
  const secs = L.searchReference(q, S.refGroup);
  $('#refCount').textContent = q.trim()
    ? secs.reduce((n, s) => n + s.items.length, 0) + ' matches'
    : L.referenceCount(S.refGroup) + ' terms';
  if (!secs.length) {
    box.appendChild(el('div', 'empty', 'Nothing matches that.'));
    return;
  }
  secs.forEach(s => {
    const card = el('div', 'sheet refsec');
    card.appendChild(el('h3', null, s.section));

/* --- history ---------------------------------------------------------- */

// Everything a removal from the log changes. The pour log, the home glance,
// the flight cards (a run date and the done stripe come out of history) and
// the payline all read S.history, and a removal that redrew only the list it
// was pressed in left the other three showing the entry still there.
function afterHistoryChange() {
  save_();
  renderHome();
  renderFlights();
  renderPayline();
  renderHistory();
}

// The X on a log row. One shape for both logs, so the pour log and the
// flight log cannot drift into two different ideas of what removing means.
//
// stopPropagation, because the row itself opens the bottle or the flight:
// without it every removal also navigated.
function histDropBtn(x) {
  const b = el('button', 'dismiss');
  b.type = 'button';
  b.textContent = '\u00d7';
  b.title = 'Remove from the log';
  b.setAttribute('aria-label', 'Remove ' + x.label + ' from the log');
  b.onclick = ev => {
    ev.stopPropagation();
    // A run takes the pours it logged with it, or removing the row you can
    // see leaves the six underneath it.
    const cut = L.histDropRun(S.history, x._i);
    if (!cut.entry) return;
    S.history = cut.list;
    afterHistoryChange();
    toast(cut.also.length
      ? 'Removed, with ' + cut.also.length + ' pours from that run'
      : 'Removed from the log',
      { label: 'Undo', action: () => {
        S.history = L.histRestoreRun(S.history, x._i, cut.entry, cut.also);
        afterHistoryChange();
      } });
  };
  return b;
}

// compact: the last few, scrollable, no controls. Home wants a glance at
// what you have been drinking; Taste is where the whole log belongs, next
// to the machine that chooses the next one.
//
// Pours only, both ways. Flights you have run are on the Flights tab, on
// the same screen as the flights themselves — a second tab in here put the
// evening you ran two screens away from the thing you ran.
function renderHistory(host, compact) {
  const box = host || document.getElementById('histBody');
  if (!box) return;
  box.innerHTML = '';

  const card = el('div', 'sheet');
  const hd = el('div', 'hdr');
  hd.style.marginBottom = '6px';
  hd.appendChild(el('h3', null, 'Recent pours'));
  card.appendChild(hd);

  const rows = L.historyRows(S.history, S.catalog, allFlights(), 'pour');

  if (!rows.length) {
    card.appendChild(el('div', 'sub',
      'Nothing logged yet. Spin, tap a glass, and record the pour.'));
    box.appendChild(card);
    return;
  }

  if (compact) {
    // Three visible, and the rest behind a scroll: the housekeeping —
    // dates, removals — belongs on Taste, where you go to look things up
    // rather than to glance.
    const list = el('div', 'recent');
    list.style.cssText = 'max-height:132px;overflow-y:auto';
    rows.slice(0, 20).forEach(x => {
      const p = prod(x.k);
      const r = el('button', 'item ' + (p ? typeClass(p) : ''));
      const left = el('div');
      const nm = el('div', 'nm oneline');
      if (p) nm.innerHTML = '<span class="dot"></span>';
      nm.appendChild(document.createTextNode(x.label));
      nm.title = x.label;
      left.appendChild(nm);
      r.appendChild(left);
      // No date. On a glance at the last three, 09-02 against 09-02 against
      // 09-02 says nothing — they are the last three, which is what the
      // card is for. The dated record is on Taste.
      if (p && L.pourable(p.k, S.bottles)) {
        r.appendChild(pourIcon(p.k, () => renderHistory(box, true)));
      }
      r.onclick = () => { if (p) showBottle(p.k); };
      list.appendChild(r);
    });
    card.appendChild(list);
    // No "the whole log" button: the Taste tab is in the bar, always, and
    // a second way to the same place is a row of nothing on the screen
    // where height matters most.
    box.appendChild(card);
    return;
  }

  const list = el('div', 'recent');
  rows.slice(0, 60).forEach(x => {
    const p = prod(x.k);
    const r = el('button', 'item ' + (p ? typeClass(p) : ''));
    const left = el('div');
    // One line. A long bottle name took three, so twenty rows of log filled
    // several screens for information that is one word wide.
    const nm = el('div', 'nm oneline');
    if (p) nm.innerHTML = '<span class="dot"></span>';
    nm.appendChild(document.createTextNode(x.label));
    nm.title = x.label;
    left.appendChild(nm);
    r.appendChild(left);
    r.appendChild(el('div', 'pf', x.at));
    // Pour it again from here. This list IS the recent list, so a separate
    // Pour again section above it was the same three bottles twice.
    if (p && L.pourable(p.k, S.bottles)) {
      r.appendChild(pourIcon(p.k, () => renderHistory(box)));
    }
    // Removing a mistaken entry, on the line it belongs to. A single
    // "Remove the most recent" chip could only ever reach the newest one,
    // so a wrong entry three pours back meant deleting two right ones.
    r.appendChild(histDropBtn(x));
    r.onclick = () => { if (p) showBottle(p.k); };
    list.appendChild(r);
  });
  card.appendChild(list);
  if (rows.length > 60) card.appendChild(el('div', 'sub', 'Showing the most recent 60.'));
  box.appendChild(card);
}

/* --- the shared shelves screen ----------------------------------------- */

const SHARED = { shelves: {}, names: {}, openOnly: true, loading: false };

// Shelves shared WITH you. Nobody's shelf is fetched until you ask, and the
// rules refuse anything not actually shared, so a stale entry fails closed.
function loadSharedShelves() {
  if (!FB.user || SHARED.loading) return Promise.resolve();
  SHARED.loading = true;
  return fbSharedWithRef().child(FB.user.uid).once('value')
    .then(snap => {
      // Only your own node: who has let you in, without being able to see
      // anybody else's arrangements.
      const owners = [];
      snap.forEach(c => owners.push(c.key));
      return Promise.all(owners.map(uid =>
        fbReadShelf(uid).then(v => ({ uid: uid, shelf: v }))
          .catch(() => ({ uid: uid, shelf: null }))));
    })
    .then(rows => {
      rows.forEach(r => { if (r.shelf) SHARED.shelves[r.uid] = r.shelf; });
      return fbDirRef().once('value');
    })
    .then(dir => {
      dir.forEach(c => { const v = c.val(); if (v) SHARED.names[c.key] = v.name; });
      SHARED.loading = false;
    })
    .catch(e => { SHARED.loading = false; throw e; });
}

function renderShared() {
  const box = $('#sharedBody');
  if (!box) return;
  box.innerHTML = '';

  if (!FB.user) {
    box.appendChild(el('div', 'empty',
      'Sign in to compare shelves with a tasting buddy.'));
    return;
  }
  const uids = Object.keys(SHARED.shelves);
  if (!uids.length) {
    box.appendChild(el('div', 'empty',
      'Nobody has shared a shelf with you yet. Ask someone in Settings, and '
      + 'their shelf appears here once they let you in.'));
    return;
  }

  // Two or three shelves: yours plus up to two. Past three a Venn stops
  // working and the honest answer is a different chart entirely.
  const chosen = uids.slice(0, 2);
  const sets = [{ id: 'me', name: 'You',
                  map: L.shelfSet({ catalog: S.catalog, bottles: S.bottles },
                                  SHARED.openOnly) }]
    .concat(chosen.map(u => ({ id: u, name: SHARED.names[u] || 'Buddy',
      map: L.shelfSet(SHARED.shelves[u], SHARED.openOnly) })));

  const names = { me: 'You' };
  chosen.forEach(u => { names[u] = SHARED.names[u] || 'Buddy'; });

  const regions = L.vennRegions(sets);
  const hi = L.vennHighlights(regions, 'me');

  // The toggle. Open is the default because the rest of this is about what

  const tog = el('div', 'sortrow');

  });
  box.appendChild(tog);

  // What the room has proposed. Above the Venn, because a plan somebody is
  // waiting on you for beats a diagram.
  const props = [];
  Object.keys(SHARED.shelves).forEach(u => {
    (SHARED.shelves[u].proposals || []).forEach(p => props.push(p));
  });
  (S.proposals || []).forEach(p => props.push(p));
  if (props.length) {
    const pc = el('div', 'sheet');
    pc.appendChild(el('h3', null, 'Proposed for the room'));
    props.sort((a, b) => String(b.at).localeCompare(String(a.at)))
      .slice(0, 6).forEach(p => {
      const asks = L.proposalAsks(p, S.catalog, S.bottles, S.displayName || 'You');
      const r = el('button', 'find f-info');
      r.style.cssText = 'width:100%;text-align:left';
      const body = el('div');
      const nm = el('div', 'nm', L.sentenceCase(p.title));

      }

        + ' \u00b7 ' + p.pours.length + ' pours \u00b7 ' + p.summary));

  regions.slice().sort((a, b) => b.count - a.count).forEach(r => {

    const row = el('button', 'find f-' + (r.ids.length === sets.length
      ? 'ok' : 'info'));
    row.style.width = '100%';
    row.style.textAlign = 'left';
    const body = el('div');

function vennSvg(sets, regions, names) {
  const wrap = el('div', 'sheet');
  const n = sets.length;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 300 260');
  svg.setAttribute('class', 'venn');
  const mk = (tag, attrs) => {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
    return e;
  };
  const R = 72;
  const pos = n === 2
    ? [[110, 120], [190, 120]]
    : [[110, 100], [190, 100], [150, 168]];
  const FILL = ['#3E6274', '#8A6A28', '#5B7355'];

  pos.slice(0, n).forEach((p, i) => {
    svg.appendChild(mk('circle', { cx: p[0], cy: p[1], r: R,
      fill: FILL[i], 'fill-opacity': '.26', stroke: FILL[i],
      'stroke-width': '1.5' }));
  });

  // Where each region's number sits. Worked out by hand rather than
  // computed, because seven labels in a fixed diagram is a fixed problem.
  const at = n === 2
    ? { 'me': [78, 126], 'x': [222, 126], 'me+x': [150, 126] }
    : {};
  const key = r => r.ids.slice().sort().join('+');
  const P3 = {};
  if (n === 3) {
    const ids = sets.map(s => s.id);
    P3[ids[0]] = [86, 78];
    P3[ids[1]] = [214, 78];
    P3[ids[2]] = [150, 196];
    P3[[ids[0], ids[1]].sort().join('+')] = [150, 78];
    P3[[ids[0], ids[2]].sort().join('+')] = [104, 152];
    P3[[ids[1], ids[2]].sort().join('+')] = [196, 152];
    P3[ids.slice().sort().join('+')] = [150, 124];
  }

  regions.forEach(r => {
    const k = key(r);
    let p = null;
    if (n === 3) p = P3[k];
    else p = at[r.ids.length === 2 ? 'me+x' : (r.ids[0] === 'me' ? 'me' : 'x')];
    if (!p) return;
    const t = mk('text', { x: p[0], y: p[1], 'text-anchor': 'middle',
      class: 'vcount' });
    t.textContent = r.count;
    svg.appendChild(t);
  });

  // Names outside the circles, so they never sit on a number.
  const labelAt = n === 2 ? [[60, 40], [240, 40]]
                          : [[60, 34], [240, 34], [150, 248]];
  sets.forEach((s, i) => {
    const t = mk('text', { x: labelAt[i][0], y: labelAt[i][1],
      'text-anchor': 'middle', class: 'vname' });
    t.textContent = s.name;
    svg.appendChild(t);
  });

  wrap.appendChild(svg);
  wrap.appendChild(el('div', 'src',
    'Circles are equal size on purpose \u2014 three circles cannot show true '
    + 'proportions for shelves this different, so the counts carry it.'));
  return wrap;
}

/* --- modal + toast ---------------------------------------------------- */

/* Nine places in the app open one modal from another — Shelf tools opening
   Import, a lesson opening the builder — and they all do closeModal() then
   openModal(). The close asked the browser to go back, the open pushed a
   new entry, and the back landed AFTER the push and closed the modal that
   had just opened. From the outside the second modal flashed and vanished,
   which is exactly what happened to Fill in your shelf.

   So the pop is deferred a tick. If another modal opened in the meantime,
   it replaces this one in the history rather than popping at all.          */
let _modalDepth = 0;

function closeModal(fromBack) {
  const wasOpen = $('#overlay').classList.contains('on');
  $('#overlay').classList.remove('on');
  $('#modal').innerHTML = '';
  if (!wasOpen || fromBack || _navBack) return;
  const at = _modalDepth;
  setTimeout(() => {
    // Another modal opened in the gap: it took this one's place, so there
    // is nothing to pop.
    if (_modalDepth !== at) return;
    if ($('#overlay').classList.contains('on')) return;
    try {
      if (history.state && history.state.kb === 'modal') history.back();
    } catch (e) {}
  }, 0);
}

function openModal(title, build) {
  const m = $('#modal'); m.innerHTML = '';
  m.appendChild(el('h2', null, title));
  build(m);
  $('#overlay').classList.add('on');
  // A modal is a place you can be, so back should leave it rather than
  // leaving the app. This is the case that matters most: a full-screen
  // sheet on a phone looks exactly like a screen.
  _modalDepth++;
  if (!_navBack) {
    try {
      // Replace when one modal opened straight from another, so back
      // returns to the screen rather than to a sheet already dismissed.
      if (history.state && history.state.kb === 'modal') {
        history.replaceState({ kb: 'modal' }, '');
      } else {
        history.pushState({ kb: 'modal' }, '');
      }
    } catch (e) {}
  }
  const first = m.querySelector('input,select');
  if (first) first.focus();
}

let _toastTimer = null;
// An optional action, because a one-tap control needs a one-tap way back
// and a confirmation dialogue would defeat the point of the one tap.
function toast(msg, act) {
  const t = $('#toast');
  t.innerHTML = '';
  t.appendChild(document.createTextNode(msg));
  clearTimeout(_toastTimer);
  if (act && act.label) {
    const b = el('button', 'toastact', act.label);
    b.onclick = () => {
      t.classList.remove('on');
      clearTimeout(_toastTimer);
      act.action();
    };
    t.appendChild(b);
  }
  t.classList.add('on');
  _toastTimer = setTimeout(() => t.classList.remove('on'),
    act ? 5200 : 1900);   // longer when there is something to press
}

function fieldRow(label, name, value, attrs) {
  const l = el('label', null, label);
  const i = document.createElement('input');
  i.className = 'field'; i.name = name; i.value = (value === null || value === undefined) ? '' : value;
  Object.keys(attrs || {}).forEach(a => i.setAttribute(a, attrs[a]));
  l.appendChild(i);
  return l;
}

function selectRow(label, name, value, options) {
  const l = el('label', null, label);
  const s = document.createElement('select');
  s.className = 'field'; s.name = name;
  options.forEach(o => {
    const op = document.createElement('option');
    op.value = o; op.textContent = L.titleCase(o);
    if (o === value) op.selected = true;
    s.appendChild(op);
  });
  l.appendChild(s);
  return l;
}

/* --- add / edit a product --------------------------------------------- */

// The add/edit form offers exactly the categories the reels can name, so a
// hand-typed bottle can never land somewhere no spin reaches.
const SUBS = L.TYPES.slice();

function productForm(existing) {
  const p = existing || {};
  openModal(existing ? 'Edit ' + p.name : 'Add a bottle', m => {
    const errBox = el('div', 'errs'); errBox.style.display = 'none';
    m.appendChild(errBox);
    const f = el('div', 'form');
    const nameRow = fieldRow('Name', 'name', p.name, { placeholder: 'Bottle name' });
    f.appendChild(nameRow);

    // Type the name, take the rest. The catalog answers for free; only a
    // genuinely new bottle reaches the network, and nothing auto-commits.
    const lookRow = el('div', 'lookrow');
    const look = el('button', 'btn ghost', 'Fill in the rest');
    const lookMsg = el('div', 'looknote');
    lookRow.appendChild(look);
    lookRow.appendChild(lookMsg);
    f.appendChild(lookRow);

    const applyLookup = res => {
      const filled = L.lookupFilled(res);
      filled.forEach(k => {
        const input = f.querySelector('[name="' + k + '"]');
        if (!input) return;
        // Never overwrite something already typed: what you entered wins.
        if (input.value && input.name !== 'name') return;
        input.value = res[k];
        input.classList.add('looked');
      });
      lookMsg.textContent = (res.source === 'shelf'
        ? 'From the library \u2014 ' : 'Looked up \u2014 ')
        + filled.length + ' fields filled. Check them before saving.';
      lookMsg.className = 'looknote ok';
    };

    look.onclick = async () => {
      const nameInput = f.querySelector('[name="name"]');
      const q = (nameInput.value || '').trim();
      if (q.length < 3) { lookMsg.textContent = 'Type a name first.';
        lookMsg.className = 'looknote'; return; }

      const fromShelf = L.lookupFromCatalog(q, S.catalog);
      if (fromShelf) { applyLookup(fromShelf); return; }

      if (!S.lookupUrl) {
        lookMsg.className = 'looknote';
        lookMsg.textContent = 'Not on your shelf. Set up lookup in Info \u203a '
          + 'Definitions to fill new bottles automatically, or type the rest.';
        return;
      }
      look.disabled = true;
      lookMsg.className = 'looknote';
      lookMsg.textContent = 'Looking it up\u2026';
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        if (navigator.onLine === false) throw new Error('you are offline');
        const r = await fetch(L.lookupUrl(S.lookupUrl, q), { signal: ctrl.signal });
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const res = L.parseLookup(await r.json());
        if (!res) throw new Error('nothing usable came back');
        applyLookup(res);
      } catch (e) {
        lookMsg.className = 'looknote warn2';
        lookMsg.textContent = 'Lookup failed (' + e.message + '). Type the rest.';
      } finally {
        look.disabled = false;
      }
    };

    f.appendChild(fieldRow('Distillery', 'dist', p.dist, {}));
    const two1 = el('div', 'two');
    two1.appendChild(fieldRow('Proof', 'proof', p.proof, { type: 'number', step: '0.1' }));
    two1.appendChild(fieldRow('Age (blank = NAS)', 'age', p.age, { type: 'number' }));
    f.appendChild(two1);
    const two2 = el('div', 'two');
    two2.appendChild(selectRow('Type', 'sub', p.sub || 'bourbon', SUBS));
    two2.appendChild(fieldRow('Style', 'style', p.style, { placeholder: 'e.g. single malt' }));
    f.appendChild(two2);
    f.appendChild(fieldRow('Finish (join several with +)', 'fin', p.fin,
      { placeholder: 'e.g. Oloroso+American Oak' }));
    const two3 = el('div', 'two');
    two3.appendChild(fieldRow('MSRP', 'msrp', p.msrp, { type: 'number', step: '0.01' }));
    two3.appendChild(fieldRow('Secondary', 'sec', p.sec, { type: 'number', step: '0.01' }));
    f.appendChild(two3);
    const two4 = el('div', 'two');
    two4.appendChild(selectRow('Recognition', 'obsc', p.obsc || 'known',
      ['known', 'niche', 'obscure']));
    two4.appendChild(selectRow('Release', 'scar', p.scar || 'standard',
      ['standard', 'batched', 'limited', 'exclusive']));
    f.appendChild(two4);
    if (!existing) {
      f.appendChild(selectRow('Status', 'status', 'open', ['open', 'sealed']));
    }
    m.appendChild(f);

    const save = el('button', 'btn wide', existing ? 'Save changes' : 'Add to the shelf');
    save.onclick = () => {
      const vals = {};
      f.querySelectorAll('input,select').forEach(i => { vals[i.name] = i.value; });
      // Typed, so cased the way the shelf is cased. This also repairs a row
      // already saved in the wrong case: open Edit, press Save changes.
      if (vals.name) vals.name = L.typedName(vals.name);
      const errs = L.validateProduct(vals);
      if (errs.length) {
        errBox.style.display = 'block'; errBox.textContent = errs.join(' ');
        return;
      }
      if (existing) {
        vals.k = p.k;
        const np = L.normalizeProduct(vals);
        delete np.k;
        S.edits[p.k] = Object.assign({}, S.edits[p.k], np, { finc: 'stated' });
      } else {
        const np = L.normalizeProduct(vals);
        if (S.catalog[np.k]) { errBox.style.display = 'block';
          errBox.textContent = 'A bottle with that name is already on the shelf.'; return; }
        np.finc = np.fin ? 'stated' : null;
        S.custom[np.k] = np;
        S.bottles.push(L.newBottle(S.bottles, np.k,
          vals.status === 'sealed' ? 'sealed' : 'open', null));
      }
      save_(); rebuildCatalog();
      closeModal(); renderShelf(); renderPayline(); renderHome();
      toast(existing ? 'Saved' : 'Added to the shelf');
    };
    m.appendChild(save);

    const cancel = el('button', 'btn ghost wide', 'Cancel');
    cancel.onclick = closeModal;
    m.appendChild(cancel);
  });
}

// Log something as done, on a date you pick. Defaults to today but never
// assumes it: a flight is written up the morning after as often as the night
// of, and a wrong date is worse than a prompt.
function tastingNoteForm(p) {
  openModal('Tasting notes \u2014 ' + p.name, m => {
    const cur = (p.tn || {});
    const f = el('div', 'form');
    const fields = {};
    L.TN_ORDER.forEach(k => {
      const l = el('label', null, L.titleCase(k));
      const ta = document.createElement('textarea');
      ta.className = 'field'; ta.rows = 2; ta.value = cur[k] || '';
      ta.placeholder = { colour: 'Pale gold, amber, deep mahogany\u2026',
        nose: 'What it smells like', palate: 'What it tastes like',
        finish: 'What is left, and for how long' }[k];
      l.appendChild(ta);
      fields[k] = ta;
      f.appendChild(l);
    });
    m.appendChild(f);
    const src = el('div', 'sub');
    src.style.marginTop = '8px';
    src.textContent = 'Saved as your own tasting. Existing card notes stay '
      + 'credited to the card unless you change them.';
    m.appendChild(src);

    const save = el('button', 'btn wide', 'Save notes');
    save.onclick = () => {
      const tn = {};
      L.TN_ORDER.forEach(k => {
        const v = fields[k].value.trim();
        if (v) tn[k] = v;
      });
      const patch = Object.keys(tn).length
        ? { tn: tn, tnSrc: 'you', tnFrom: null }
        : { tn: null, tnSrc: null, tnFrom: null };
      S.edits[p.k] = Object.assign({}, S.edits[p.k], patch);
      save_(); rebuildCatalog(); closeModal(); showBottle(p.k);
      toast(Object.keys(tn).length ? 'Notes saved' : 'Notes cleared');
    };

    const cancel = el('button', 'btn ghost wide', 'Cancel');

    m.appendChild(cancel);

}
