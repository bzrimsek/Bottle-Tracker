/* --- flights -------------------------------------------------------- */
function renderFlightFilters() {
  const all = allFlights();
  const stateCount = v => L.filterFlights(all, S.catalog, S.bottles, S.history,
    { state: v }).length;

  pickList({
    btnId: 'fstatePick', listId: 'fstateList', single: true,
    value: S.fflt.state, allValue: 'all', allLabel: 'All',
    open: S.fflt.showState,
    options: [['all', 'All'], ['todo', 'Not run'], ['run', 'Run'],
              ['ready', 'Fully pourable']].map(([v, t]) => [v, t, stateCount(v)]),
    onPick: v => { S.fflt.state = v; S.fflt.showState = false; renderFlights(); }
  });

  // Type counts here are flights that use the type, not bottles.
  const counts = {};
  all.forEach(f => {
    const subs = new Set(f.core.map(p => (S.catalog[p.k] || {}).sub).filter(Boolean));
    subs.forEach(s => { counts[s] = (counts[s] || 0) + 1; });
  });
  pickList({
    btnId: 'ftypePick', listId: 'ftypeList',
    value: S.fflt.types, allLabel: 'Any type', plural: 'types',
    open: S.fflt.showTypes,
    options: Object.keys(counts).sort((a, b) => counts[b] - counts[a])
      .map(t => [t, L.titleCase(t), counts[t]]),
    onAll: () => { S.fflt.types = []; renderFlights(); },
    onPick: t => {
      const i = S.fflt.types.indexOf(t);
      if (i < 0) S.fflt.types.push(t); else S.fflt.types.splice(i, 1);
      renderFlights();
    }
  });

  const sel = $('#fsortSel');
  if (!sel.options.length) {
    L.FLIGHT_SORTS.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.label;
      sel.appendChild(o);
    });
    sel.onchange = () => { S.fflt.sort = sel.value; renderFlights(); };
  }
  sel.value = S.fflt.sort;
}

function renderFlights() {
  const box = $('#flightList'); box.innerHTML = '';
  renderFlightFilters();
  const opts = Object.assign({}, S.fflt, { q: $('#fq').value });
  const hits = L.sortFlights(
    L.filterFlights(allFlights(), S.catalog, S.bottles, S.history, opts),
    S.catalog, S.bottles, S.history, S.fflt.sort);

  $('#flightCount').textContent = hits.length === allFlights().length
    ? hits.length + ' flights'
    : hits.length + ' of ' + allFlights().length;

  if (!hits.length) {
    // A shelf with no flights at all is a new one, not a failed search, and
    // it wants a way in rather than a shrug. The 36 that used to ship here
    // were one person's curriculum; the lessons are the part that belongs
    // to everybody.
    if (!allFlights().length) {
      const e = el('div', 'sheet');
      e.appendChild(el('h3', null, 'No flights yet'));
      e.appendChild(el('div', 'sub',
        'A flight holds everything still but one thing \u2014 proof, cask, '
        + 'age, where it was made \u2014 so you can taste what that one thing '
        + 'does. Start from what your shelf can already teach you.'));
      const go = el('button', 'btn wide btn-gold', 'What my shelf can teach me');
      go.style.marginTop = '10px';
      go.onclick = () => showLessons();
      e.appendChild(go);
      box.appendChild(e);
      return;
    }
    box.appendChild(el('div', 'empty', 'No flight matches that.'));
    return;
  }
  hits.forEach(f => {
    const runAt = L.flightRunAt(f, S.history);
    const ready = L.flightReady(f, S.catalog, S.bottles);
    const c = el('button', 'fcard' + (runAt ? ' done' : ''));
    c.appendChild(el('h3', null, L.sentenceCase(f.title)));
    c.appendChild(el('div', 'var', L.variableOf(f)));
    const bits = [f.core.length + ' core', f.ext.length + ' bench'];
    if (ready.open < ready.total) bits.push(ready.open + ' of ' + ready.total + ' open');
    if (runAt) bits.push('run ' + runAt);
    c.appendChild(el('div', 'meta', bits.join(' \u00b7 ')));
    c.onclick = () => showFlight(f);
    box.appendChild(c);
  });
  const log = flightRunLog();
  if (log) box.appendChild(log);
}

// What has actually been run, on the screen where flights live.
//
// This was a second tab inside the pour log on Taste, which put the record
// of an evening two screens away from the flight it was an evening of. A
// row opens the flight; the X takes the run back out of the log, which also
// clears the run date and the done stripe from the card above it.
//
// It sits after the cards rather than before them: the flights are what the
// screen is for, and a log of six evenings should not push them down.
function flightRunLog() {
  const rows = L.historyRows(S.history, S.catalog, allFlights(), 'flight');
  if (!rows.length) return null;

  const card = el('div', 'sheet');
  const hd = el('div', 'hdr');
  hd.style.marginBottom = '6px';
  hd.appendChild(el('h3', null, 'Flights you have run'));
  card.appendChild(hd);

  const list = el('div', 'recent');
  rows.slice(0, 60).forEach(x => {
    const r = el('button', 'item');
    const left = el('div');
    const nm = el('div', 'nm oneline');
    nm.appendChild(document.createTextNode(x.label));
    nm.title = x.label;
    left.appendChild(nm);
    if (x.pours) left.appendChild(el('div', 'sub', x.pours.length + ' pours'));
    r.appendChild(left);
    r.appendChild(el('div', 'pf', x.at));
    r.appendChild(histDropBtn(x));
    r.onclick = () => {
      const f = allFlights().find(y => y.title === x.flight);
      if (f) showFlight(f);
    };
    list.appendChild(r);
  });
  card.appendChild(list);
  if (rows.length > 60) {
    card.appendChild(el('div', 'sub', 'Showing the most recent 60.'));
  }
  return card;
}

// Shipped flights and the ones BZ builds live in one list; only the custom
// ones can be deleted, and either can be edited.
function allFlights() { return S.flights.concat(S.customFlights); }

// Build a flight: you give the variable and the premise, it proposes the
// pours off your shelf and names one bottle that would improve it.
// The same flight, a different cast. Same question, different whisky.
function showRecast(f) {
  const res = L.recastFlight(f, S.catalog, S.bottles, S.history);
  openModal('Remix ' + L.sentenceCase(f.title), m => {
    if (!res.ok) {
      m.appendChild(el('div', 'errs', res.why));
      const close = el('button', 'btn ghost wide', 'Close');
      close.onclick = closeModal;
      m.appendChild(close);
      return;
    }
    m.appendChild(el('div', 'sub',
      'The same question, different bottles. Holding ' + res.variable
      + (res.held ? ', still all ' + L.titleCase(res.held) : '')
      + ' \u2014 cast from what is open now.'));
    if (res.previous) {
      m.appendChild(el('div', 'rs', 'Last run ' + res.previous.at
        + ', ' + res.previous.pours.length + ' pours.'));
    }

    const list = el('div', 'recent');
    list.style.marginTop = '9px';
    res.pours.forEach((x, i) => {
      const p = prod(x.k);
      if (!p) return;
      const repeat = res.repeats.indexOf(x.k) >= 0;
      const r = el('button', 'item ' + typeClass(p));
      const left = el('div');
      const nm = el('div', 'nm');
      nm.innerHTML = '<span class="dot"></span>';
      nm.appendChild(document.createTextNode(
        String.fromCharCode(65 + i) + '  ' + p.name));
      if (repeat) nm.appendChild(el('span', 'pourtag blend', 'poured before'));
      left.appendChild(nm);
      r.appendChild(left);
      r.appendChild(el('div', 'pf', String(p.proof)));
      r.onclick = () => { closeModal(); showBottle(p.k); };
      list.appendChild(r);
    });
    m.appendChild(list);
    m.appendChild(el('div', 'rs', res.fresh + ' of ' + res.pours.length
      + ' have not been poured in this flight before.'));

    (res.notes || []).forEach(n => {
      const w = el('div', 'find f-' + (n.level === 'ok' ? 'ok' : 'warn'));
      w.appendChild(el('div', 'm', n.level === 'ok' ? '\u2713' : '!'));
      w.appendChild(el('div', null, n.msg));
      m.appendChild(w);
    });

    // Keeping it makes a NEW flight rather than overwriting the original,
    // because run one is a record of what was actually poured that night.
    const keep = el('button', 'btn wide btn-gold', 'Keep this remix');
    keep.onclick = () => {
      // A distinct name, or two flights with the same title sit in the list
      // indistinguishable and the second one looks like a duplicate rather
      // than a variant. Counted among its own siblings, so a third remix is
      // III rather than colliding with the second.
      const sibs = allFlights().filter(x =>
        x.recastOf === f.title || x.title === f.title).length;
      const ROMAN = ['', ' II', ' III', ' IV', ' V', ' VI', ' VII', ' VIII'];
      const nf = L.newFlight(f.title + (ROMAN[sibs] || ' ' + (sibs + 1)));
      nf.core = L.relabel(res.pours);
      nf.premise = f.premise;
      nf.tag = f.tag;
      nf.why = (f.why || []).slice();
      nf.recastOf = f.title;
      nf.run = res.run;
      nf.cards = nf.core.map(p => {
        const pd = prod(p.k) || {};
        return { letter: p.letter, bottle: pd.name || '', proof: pd.proof || '',
                 wood: pd.fin || '' };
      });
      closeModal();
      flightEditor(nf);
    };
    m.appendChild(keep);
    const cancel = el('button', 'btn ghost wide', 'Cancel');
    cancel.onclick = closeModal;
    m.appendChild(cancel);
  });
}

// What this shelf can teach, offered before the blank builder. Somebody
// arriving with forty bottles does not know that proof, cask, house, region,
// age, grain and price are the questions worth asking, or what has to be
// held still for each. The 36 shipped flights know, and this is that
// knowledge pointed at whatever shelf is in front of it.
/* Loading flights from a file.

   Needed because I deleted BZ's 36. They were S.flights, read from
   data.json, and when the flights stopped shipping at v1.0.1 — correctly,
   since they are his rather than everybody's — nothing had ever copied
   them into his own storage, so they simply vanished. His, and gone,
   because of a change made on his instruction without checking where the
   data actually lived.

   This is also the general answer: flights are portable, and somebody who
   has built a curriculum should be able to move it.                       */
function importFlights() {
  openModal('Load flights from a file', m => {
    m.appendChild(el('div', 'sub',
      'A JSON file of flights, from an export here or from a backup. '
      + 'Anything already on your list with the same title is left alone.'));
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json,application/json';
    inp.className = 'field';
    inp.style.marginTop = '10px';
    m.appendChild(inp);
    const msg = el('div', 'looknote');
    msg.style.marginTop = '9px';
    m.appendChild(msg);

    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        let arr;
        try { arr = JSON.parse(rd.result); } catch (e) {
          msg.className = 'looknote warn2';
          msg.textContent = 'That is not readable JSON.';
          return;
        }
        if (!Array.isArray(arr)) arr = arr.flights || [];
        const good = arr.filter(x => x && x.title && Array.isArray(x.core));
        if (!good.length) {
          msg.className = 'looknote warn2';
          msg.textContent = 'No flights in that file.';
          return;
        }
        const have = {};
        allFlights().forEach(x => { have[x.title] = 1; });
        const add = good.filter(x => !have[x.title]);
        msg.className = 'looknote ok';
        msg.textContent = add.length
          ? add.length + ' to add' + (good.length - add.length
              ? ', ' + (good.length - add.length) + ' already here' : '') + '.'
          : 'All ' + good.length + ' are already on your list.';
        if (!add.length) return;

        const go = el('button', 'btn wide btn-gold', 'Add ' + add.length);
        go.style.marginTop = '10px';
        go.onclick = () => {
          S.customFlights = (S.customFlights || []).concat(add);
          save_();
          closeModal();
          renderFlights();
          toast(add.length + ' flights loaded');
        };
        m.appendChild(go);
      };
      rd.readAsText(f);
    };

    const close = el('button', 'btn ghost wide', 'Close');
    close.style.marginTop = '11px';
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

// The other half: get them out, so a curriculum is never trapped in one
// browser again.
function showLessons() {
  openModal('What your shelf can teach you', m => {
    const list = L.lessonsFor(S.catalog, S.bottles, allFlights());
    const ready = list.filter(l => l.ready);
    m.appendChild(el('div', 'sub', ready.length
      ? ready.length + ' of these can be poured from what is open now. Each '
        + 'holds everything still but one thing \u2014 that is what makes it a '
        + 'test rather than a tasting.'
      : 'Nothing is buildable from what is open yet. Each line says what '
        + 'shape is missing.'));

    const box = el('div', '');
    box.style.marginTop = '9px';
    list.forEach(l => {
      const r = el('button', 'find f-' + (l.ready ? 'ok' : 'info'));
      r.style.cssText = 'width:100%;text-align:left';
      const body = el('div');
      const nm = el('div', 'nm', l.name);
      if (l.have) nm.appendChild(el('span', 'pourtag blend',
        l.have + ' built'));
      body.appendChild(nm);
      body.appendChild(el('div', 'sub', l.ask));
      body.appendChild(el('div', 'src', l.ready
        ? l.why : l.blocked));
      r.appendChild(el('div', 'm', l.ready ? '\u2605' : '\u00b7'));
      r.appendChild(body);
      if (l.ready) {
        r.onclick = () => { closeModal(); flightBuilder(l.id); };
      } else {
        r.disabled = true;
      }
      box.appendChild(r);
    });
    m.appendChild(box);

    // Pooling, when there is anybody to pool with. On a 325-bottle shelf it
    // adds little — the honest finding when this was measured — but it is
    // the only way a small shelf gets a real flight, and BZ is the one with
    // the collection.
    const shared = Object.keys(SHARED.shelves || {});
    if (shared.length) {
      const pool = L.poolShelves(
        { catalog: S.catalog, bottles: S.bottles },
        SHARED.shelves, SHARED.names, 'You');
      const gain = L.poolGain({ catalog: S.catalog, bottles: S.bottles },
        pool, allFlights());
      const pb = el('button', 'btn wide',
        gain.length ? 'Pool the room: ' + gain.length + ' more'
                    : 'Pool the room');
      pb.style.marginTop = '11px';
      pb.onclick = () => { closeModal(); showPooled(pool, gain); };
      m.appendChild(pb);
      m.appendChild(el('div', 'src', gain.length
        ? 'Casting from everybody\u2019s open bottles rather than only yours.'
        : 'Your own shelf already covers everything the room can build.'));
    }

    const load = el('button', 'btn ghost wide', 'Load flights from a file');
    load.style.marginTop = '11px';
    load.onclick = () => { closeModal(); importFlights(); };
    m.appendChild(load);

    const own = el('button', 'btn ghost wide', 'Design one myself');
    own.style.marginTop = '11px';
    own.onclick = () => { closeModal(); flightBuilder(); };
    m.appendChild(own);
    const close = el('button', 'btn ghost wide', 'Close');
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

// A flight cast from everybody's bottles. The plan matters as much as the
// pours: one that needs three people to turn up is a different evening from
// one you can pour alone, and the host should know before inviting anybody.
// Keep it, and tell the room. A proposal is read-only to everybody except
// whoever made it, which is what stops a plan drifting under the people
// relying on it.
function proposeToRoom(flight, pours, pool) {
  const prop = L.makeProposal(flight, pours, pool,
    S.displayName || 'You', FB.user && FB.user.uid);
  S.proposals = (S.proposals || []).concat([prop]);
  save_();
  toast('Proposed \u2014 ' + prop.summary);
  return prop;
}

function showPooled(pool, gain) {
  openModal('Pool the room', m => {
    const n = Object.keys(pool.catalog).length;
    m.appendChild(el('div', 'sub', n + ' bottles open across the room. '
      + (gain.length
         ? 'These are better, or only possible, together.'
         : 'Nothing here needs anybody else \u2014 your own shelf covers it.')));

    const box = el('div', '');
    box.style.marginTop = '9px';
    (gain.length ? gain
      : L.lessonsFor(pool.catalog, pool.bottles, allFlights())
          .filter(l => l.ready)).forEach(l => {
      const cands = L.flightCandidates(l.id, pool.catalog, pool.bottles) || [];
      const plan = cands[0] ? L.poolPlan(cands[0].pours, pool, 'You') : null;
      const r = el('button', 'find f-' + (l.gain === 'new' ? 'ok' : 'info'));
      r.style.cssText = 'width:100%;text-align:left';
      const body = el('div');
      body.appendChild(el('div', 'nm', l.name));
      body.appendChild(el('div', 'sub', l.note || l.ask));
      if (plan) body.appendChild(el('div', 'src', plan.summary));
      r.appendChild(el('div', 'm', l.gain === 'new' ? '\u2605' : '\u00b7'));
      r.appendChild(body);
      r.onclick = () => { closeModal(); flightBuilder(l.id, pool); };
      box.appendChild(r);
    });
    m.appendChild(box);

    const close = el('button', 'btn ghost wide', 'Close');
    close.style.marginTop = '11px';
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

function flightBuilder(preset, pool) {
  openModal('Build a flight', m => {
    // Arrived from a lesson: the variable is already chosen, so do not ask
    // again.
    const chosen = preset || null;
    // Casting from the room rather than one shelf. Everything downstream is
    // unchanged: a pool is a catalogue like any other.
    const fromCat = (pool && pool.catalog) || S.catalog;
    const fromBot = (pool && pool.bottles) || S.bottles;
    m.appendChild(el('div', 'sub',
      'Pick what the flight changes. Everything else is held as still as '
      + 'your shelf allows, and only open bottles are used.'));

    const form = el('div', 'form');
    const varSel = document.createElement('select');
    varSel.className = 'field';
    L.VARIABLES.forEach(v => {
      const o = document.createElement('option');
      o.value = v.id; o.textContent = v.label + ' \u2014 ' + v.hint;
      varSel.appendChild(o);
    });
    if (chosen) varSel.value = chosen;
    const vl = el('label', null, 'The variable');
    vl.appendChild(varSel);
    form.appendChild(vl);

    const prem = document.createElement('textarea');
    prem.className = 'field'; prem.rows = 2;
    prem.placeholder = 'What is the room being asked? One sentence.';
    const pl = el('label', null, 'The premise');
    pl.appendChild(prem);
    form.appendChild(pl);
    m.appendChild(form);

    const out = el('div');
    m.appendChild(out);

    const status = el('div', 'looknote');
    status.style.marginTop = '9px';
    m.appendChild(status);

    // Ask the model first when it is configured. It sees only what is open,
    // it is told the house rules, and everything it returns is checked
    // against the real shelf before a drop of it reaches the screen.
    const ask = el('button', 'btn wide btn-gold', 'Design it');
    ask.style.marginTop = '10px';
    ask.onclick = async () => {
      const premise = prem.value.trim();
      const vLabel = (L.VARIABLES.find(v => v.id === varSel.value) || {}).label
        || varSel.value;
      if (!S.lookupUrl) {
        renderProposal(out, L.buildFlight(varSel.value, premise,
          fromCat, fromBot), varSel.value, premise, pool);
        return;
      }
      ask.disabled = true;
      status.className = 'looknote';
      status.textContent = 'Designing against your shelf\u2026';
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 45000);
        const r = await fetch(S.lookupUrl, {
          method: 'POST', signal: ctrl.signal,
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(L.flightRequestBody(vLabel, premise,
            fromCat, fromBot))
        });
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const res = L.verifyProposal(await r.json(), fromCat, fromBot);
        if (!res.ok) throw new Error(res.why);
        status.className = 'looknote ok';
        status.textContent = 'Designed for your shelf.'
          + (res.rejected.length ? '  ' + res.rejected.length
            + ' suggestion(s) dropped \u2014 see below.' : '');
        renderAIProposal(out, res, premise, pool);
      } catch (e) {
        status.className = 'looknote warn2';
        // Not "falling back to your shelf" — the shelf was always the
        // source, and saying that suggested there had been another one.
        status.textContent = e.message + ' \u2014 designed it here instead.';
        renderProposal(out, L.buildFlight(varSel.value, premise,
          fromCat, fromBot), varSel.value, premise, pool);
      } finally {
        ask.disabled = false;
      }
    };
    m.appendChild(ask);

    if (S.lookupUrl) {
      // Removed. Both routes designed against the same shelf and differed
      // only in which engine picked the six — the model, or the local
      // grouping rule. That is an implementation detail, and offering it as
      // a choice made somebody decide something they have no basis to
      // decide. The local route is still there as the fallback it always
      // was: if the service is unset or fails, it runs automatically.
    } else {
      const hint = el('div', 'sub');
      hint.style.marginTop = '7px';
      hint.textContent = 'Set up the design service in Settings to have a '
        + 'flight written for you, with its reasoning.';
      m.appendChild(hint);
    }

    // This one IS different: you choose the bottles rather than being
    // handed a cast.
    const manual = el('button', 'btn ghost wide', 'Pick the bottles myself');
    manual.onclick = () => { closeModal(); flightEditor(L.newFlight('New flight')); };
    m.appendChild(manual);
    const cancel = el('button', 'btn ghost wide', 'Cancel');
    cancel.onclick = closeModal;
    m.appendChild(cancel);
  });
}

// A designed flight, with the reasoning it came with and everything that
// was thrown out for not being on the shelf.
function renderAIProposal(out, res, premise, pool) {
  out.innerHTML = '';
  if (res.title) {
    const t = el('h3', null, L.sentenceCase(res.title));
    t.style.marginTop = '11px';
    out.appendChild(t);
  }
  if (res.variable) out.appendChild(el('div', 'var', 'One variable: ' + res.variable));
  if (res.premise) {
    const p = el('p'); p.style.cssText = 'font-size:13.5px;margin:7px 0 0';
    p.textContent = res.premise;
    out.appendChild(p);
  }

  const list = el('div', 'recent');
  list.style.marginTop = '9px';
  res.pours.forEach((x, i) => {
    const p = prod(x.k);
    if (!p) return;
    const r = el('button', 'item ' + typeClass(p));
    const left = el('div');
    const nm = el('div', 'nm');
    nm.innerHTML = '<span class="dot"></span>';
    nm.appendChild(document.createTextNode(
      String.fromCharCode(65 + i) + '  ' + p.name));
    left.appendChild(nm);
    if (x.note) left.appendChild(el('div', 'sub', x.note));
    r.appendChild(left);
    r.appendChild(el('div', 'pf', String(p.proof)));
    r.onclick = () => { closeModal(); showBottle(p.k); };
    list.appendChild(r);
  });
  out.appendChild(list);

  (res.notes || []).forEach(n => {
    const w = el('div', 'find f-' + (n.level === 'ok' ? 'ok' : 'warn'));
    w.appendChild(el('div', 'm', n.level === 'ok' ? '\u2713' : '!'));
    w.appendChild(el('div', null, n.msg));
    out.appendChild(w);
  });

  // Anything it named that is not on the shelf is shown, not hidden: it is
  // the difference between a proposal and a fact.
  if (res.rejected && res.rejected.length) {
    const rj = el('div');
    rj.style.marginTop = '9px';
    rj.appendChild(el('div', 'rs', 'Dropped'));
    res.rejected.forEach(x => rj.appendChild(el('div', 'sub',
      x.name + ' \u2014 ' + x.why)));
    out.appendChild(rj);
  }

  if (res.why.length) {
    const w = el('div', 'sheet');
    w.style.marginTop = '10px';
    w.appendChild(el('h3', null, 'Why it is built this way'));
    res.why.forEach(x => {
      const p = el('p');
      p.style.cssText = 'font-size:13px;margin:7px 0 0';
      p.textContent = x;
      w.appendChild(p);
    });
    out.appendChild(w);
  }

  if (res.buy) {
    const b = el('div', 'sheet');
    b.style.marginTop = '10px';
    b.appendChild(el('h3', null, res.buy.onShelf ? 'Open this' : 'One to buy'));
    b.appendChild(el('div', 'nm', res.buy.name));
    if (res.buy.why) b.appendChild(el('div', 'rd', res.buy.why));
    if (!res.buy.onShelf) {
      b.appendChild(el('div', 'src', 'Not on your shelf \u2014 check it before you buy.'));
    }
    out.appendChild(b);
  }

  // Cast from the room, so it can be proposed to it.
  if (pool) {
    const prop = el('button', 'btn wide btn-gold', 'Propose it to the room');
    prop.style.marginTop = '11px';
    prop.onclick = () => {
      proposeToRoom({ title: (premise || 'An evening').split(/[.?!]/)[0]
        .slice(0, 48), premise: premise, variable: res.variable || '' },
        res.pours, pool);
      closeModal();
      renderShared();
    };
    out.appendChild(prop);
  }

  const keep = el('button', 'btn wide ' + (pool ? '' : 'btn-gold'),
    pool ? 'Or keep it for yourself' : 'Keep it and edit');
  keep.style.marginTop = pool ? '0' : '11px';
  keep.onclick = () => {
    const f = L.newFlight(res.title || 'New flight');
    f.core = L.relabel(res.pours.map(x => ({ k: x.k })));
    f.premise = res.premise || premise;
    f.tag = res.variable ? 'ONE VARIABLE: ' + res.variable.toUpperCase() : '';
    f.why = res.why.slice();
    f.cards = f.core.map((p, i) => {
      const pd = prod(p.k) || {};
      return { letter: p.letter, bottle: pd.name || '', proof: pd.proof || '',
               wood: pd.fin || '' };
    });
    closeModal();
    flightEditor(f);
  };
  out.appendChild(keep);
}

function renderProposal(out, res, varId, premise, pool) {
  out.innerHTML = '';
  if (!res.ok) {
    out.appendChild(el('div', 'errs', res.why));
    return;
  }
  const head = el('div');
  head.style.marginTop = '11px';
  head.appendChild(el('div', 'rs', 'Holding ' + res.holds.join(' and ')
    + ' at ' + res.held + (res.alternatives
      ? '  \u00b7  ' + res.alternatives + ' other groupings possible' : '')));
  out.appendChild(head);

  const list = el('div', 'recent');
  list.style.marginTop = '8px';
  res.pours.forEach((x, i) => {
    const p = prod(x.k);
    if (!p) return;
    const r = el('button', 'item ' + typeClass(p));
    const left = el('div');
    const nm = el('div', 'nm');
    nm.innerHTML = '<span class="dot"></span>';
    nm.appendChild(document.createTextNode(
      String.fromCharCode(65 + i) + '  ' + p.name));
    left.appendChild(nm);
    left.appendChild(el('div', 'sub', L.axisLabel(varId, p)));
    r.appendChild(left);
    r.appendChild(el('div', 'pf', String(p.proof)));
    r.onclick = () => { closeModal(); showBottle(p.k); };
    list.appendChild(r);
  });
  out.appendChild(list);

  (res.notes || []).forEach(n => {
    const w = el('div', 'find f-' + (n.level === 'ok' ? 'ok' : 'warn'));
    w.appendChild(el('div', 'm', n.level === 'ok' ? '\u2713' : '!'));
    w.appendChild(el('div', null, n.msg));
    out.appendChild(w);
  });

  if (res.buy) {
    const b = el('div', 'sheet');
    b.style.marginTop = '10px';
    b.appendChild(el('h3', null, res.buy.own ? 'Open this' : 'One to buy'));
    b.appendChild(el('div', 'nm', res.buy.p.name));
    b.appendChild(el('div', 'sub', [res.buy.p.dist, res.buy.p.proof,
      res.buy.p.msrp ? '$' + res.buy.p.msrp : null].filter(Boolean).join(' \u00b7 ')));
    b.appendChild(el('div', 'rd', res.buy.why));
    out.appendChild(b);
  }

  // Cast from the room, so it can be proposed to the room. A flight from
  // your own shelf has nobody to propose it to.
  if (pool) {
    const prop = el('button', 'btn wide btn-gold', 'Propose it to the room');
    prop.style.marginTop = '11px';
    prop.onclick = () => {
      const title = premise ? premise.split(/[.?!]/)[0].slice(0, 48)
        : (L.VARIABLES.find(v => v.id === varId) || {}).label + ' flight';
      proposeToRoom({ title: title, premise: premise, variable: varId },
        res.pours, pool);
      closeModal();
      renderShared();
    };
    out.appendChild(prop);
  }

  const keep = el('button', 'btn wide ' + (pool ? '' : 'btn-gold'),
    pool ? 'Or keep it for yourself' : 'Keep it and edit');
  keep.style.marginTop = pool ? '0' : '11px';
  keep.onclick = () => {
    const f = L.newFlight(premise ? premise.split(/[.?!]/)[0].slice(0, 48)
      : (L.VARIABLES.find(v => v.id === varId) || {}).label + ' flight');
    f.core = L.relabel(res.pours);
    f.premise = premise;
    f.tag = 'ONE VARIABLE: ' + (L.VARIABLES.find(v => v.id === varId) || {})
      .label.toUpperCase();
    f.cards = f.core.map((p, i) => {
      const pd = prod(p.k) || {};
      return { letter: p.letter, bottle: pd.name || '', proof: pd.proof || '',
               wood: pd.fin || '' };
    });
    closeModal();
    flightEditor(f);
  };
  out.appendChild(keep);
}

function flightEditor(f) {
  // The shipped title, not the current one. The saved edit is looked up at
  // load by the title data.json ships, so keying it to a renamed flight
  // meant the lookup never matched again and every adjustment -- tag,
  // premise, pour order, and now the host lines -- reverted on the next
  // load. _base is stamped on at load and is the only reliable key.
  const editKey = 'flight:' + (f._base || f.title);
  // The host line travels on the pour from here on, so reordering cannot
  // separate the two.
  f.core = L.foldNotes(f.core, f.cards);
  openModal(f.custom ? 'Edit flight' : 'Adjust ' + L.sentenceCase(f.title), m => {
    const form = el('div', 'form');
    form.appendChild(fieldRow('Title', 'title', f.title, {}));
    form.appendChild(fieldRow('Variable', 'tag', f.tag,
      { placeholder: 'ONE VARIABLE: WHICH SHERRY' }));
    form.appendChild(fieldRow('Premise', 'premise', f.premise, {}));
    m.appendChild(form);

    // Pours: reorder, remove, sort by proof, add from the open shelf.
    const list = el('div');
    function paint() {
      list.innerHTML = '';
      list.appendChild(el('h3', null, f.core.length + ' pours'));
      f.core.forEach((p, i) => {
        const pd = prod(p.k);
        const r = el('div', 'pourrow');
        r.appendChild(el('div', null, (p.letter || String.fromCharCode(65 + i))
          + ' \u00b7 ' + (pd ? pd.name + '  ' + pd.proof : p.card)));
        const mv = el('div', 'mv');
        [['\u2191', -1], ['\u2193', 1]].forEach(([g, d]) => {
          const b = el('button', null, g);
          b.onclick = () => { f.core = L.movePour(f.core, i, d); paint(); };
          mv.appendChild(b);
        });
        const x = el('button', null, '\u00d7');
        x.onclick = () => { f.core = L.removePour(f.core, i); paint(); };
        mv.appendChild(x);
        r.appendChild(mv);
        // The host's line for this pour. It writes straight back to the
        // pour on input rather than being read at save, because the row is
        // rebuilt by every move, sort and remove — a value left sitting in
        // the DOM would be thrown away by the next arrow press.
        const note = document.createElement('input');
        note.type = 'text';
        note.className = 'field pnote';
        note.value = p.note || '';
        note.placeholder = 'Host line for this pour';
        note.oninput = () => { f.core[i].note = note.value; };
        r.appendChild(note);
        list.appendChild(r);
      });

      const sortBtn = el('button', 'chip', 'Sort by proof');
      sortBtn.style.marginTop = '8px';
      sortBtn.onclick = () => { f.core = L.sortByProof(f.core, S.catalog); paint(); };
      list.appendChild(sortBtn);

      const pick = document.createElement('select');
      pick.className = 'field'; pick.style.marginTop = '8px';
      const first = document.createElement('option');
      first.value = ''; first.textContent = 'Add a pour\u2026';
      pick.appendChild(first);
      const opts = L.pourOptions(f, S.catalog, S.bottles);
      const option = p => {
        const o = document.createElement('option');
        o.value = p.k; o.textContent = p.name + '  ' + p.proof;
        return o;
      };
      const group = (label, list) => {
        if (!list.length) return;
        const g = document.createElement('optgroup');
        g.label = label;
        list.forEach(p => g.appendChild(option(p)));
        pick.appendChild(g);
      };
      // The ones that suit the flight first, named as such, and everything
      // else still reachable underneath.
      group(opts.variable
        ? 'Fits this flight \u2014 ' + opts.variable
          + (opts.held ? ', all ' + opts.held : '')
        : 'On the shelf', opts.fits);
      group(opts.fits.length ? 'Everything else open' : 'On the shelf',
        opts.rest);
      pick.onchange = () => {
        if (!pick.value) return;
        f.core = L.addPour(f.core, pick.value);
        paint();
      };
      list.appendChild(pick);
    }
    paint();
    m.appendChild(list);

    const save = el('button', 'btn wide', 'Save flight');
    save.onclick = () => {
      const vals = {};
      form.querySelectorAll('input').forEach(i => { vals[i.name] = i.value; });
      const title = (vals.title || '').trim();
      if (title.length < 2) { toast('A flight needs a title'); return; }
      f.title = title.toUpperCase();
      f.tag = vals.tag; f.premise = vals.premise;
      f.cards = L.cardsFrom(f.core, S.catalog);
      if (f.custom && S.customFlights.indexOf(f) < 0) S.customFlights.push(f);
      // cards as well as core: the shipped flight is merged over at load,
      // so an edited host line that lived only on core would be masked by
      // the cards data.json ships.
      if (!f.custom) S.edits[editKey] = { title: f.title, tag: f.tag,
        premise: f.premise, core: f.core, cards: f.cards };
      save_(); closeModal(); renderFlights(); showFlight(f); toast('Flight saved');
    };
    m.appendChild(save);

    if (f.custom) {
      const del = el('button', 'btn ghost wide danger', 'Delete this flight');
      del.onclick = () => confirmDelete(L.sentenceCase(f.title), () => {
        S.customFlights = S.customFlights.filter(x => x !== f);
        save_(); closeModal(); renderFlights(); show('flights'); toast('Flight deleted');
      });
      m.appendChild(del);
    }
    const cancel = el('button', 'btn ghost wide', 'Cancel');
    cancel.onclick = closeModal;
    m.appendChild(cancel);
  });
}

// Running a flight IS pouring its bottles. Recording it as one thing and
// its pours as nothing meant the shelf never learned what a tasting night
// had actually emptied.
function runFlight(f, after) {
  const when = L.todayISO();
  // Already logged today. Not refused — a flight can be run twice in a day
  // — but asked, so the second one is a decision. Pressing Poured it again
  // because the first press appeared to fail is how a run got logged twice.
  if (L.alreadyRun(S.history, f.title, when)) {
    confirmAsk('You already logged ' + L.sentenceCase(f.title) + ' today. '
      + 'Log it again?', () => runFlightNow(f, after, when));
    return;
  }
  runFlightNow(f, after, when);
}

function runFlightNow(f, after, when) {
  const poured = (f.core || [])
    .filter(p => L.pourKind(p) === 'shelf' && S.catalog[p.k])
    .map(p => p.k);
  const entry = L.logEntry('flight',
    // A wish and a blend have no k, and mapping them straight to x.k put
    // undefined into the record — which Firebase refuses outright: "values
    // argument contains undefined in property history.8.pours.5". The whole
    // push failed on it, so a run marked on the app never reached the
    // account. pouredBefore already skips falsy entries, so a name here is
    // read as "not a shelf key" and the count of pours stays honest.
    { flight: f.title,
      pours: (f.core || []).map(x => x.k || x.name || '').filter(Boolean) },
    when);
  S.history.push(entry);
  // Kept, so undo removes these and nothing else.
  const added = poured.map(k => {
    const e = L.logEntry('pour', { k: k }, when);
    S.history.push(e);
    return e;
  });
  save_();
  renderFlights(); renderHome(); renderPayline();
  if (after) after();
  toast('Ran it \u2014 ' + poured.length + ' pours logged', {
    label: 'Undo',
    action: () => {
      // Drop exactly what was just added, by identity for the flight and by
      // a set of the entries themselves for the pours. An earlier version
      // filtered on the date as well, which would have taken a pour logged
      // separately the same evening.
      const mine = new Set(added);
      S.history = S.history.filter(x => x !== entry && !mine.has(x));
      save_(); renderFlights(); renderHome(); renderPayline();
      if (after) after();
      toast('Not run after all');
    }
  });
}

function showFlight(f) {
  S.lastList = 'flights';
  const body = $('#detailBody'); body.innerHTML = '';

  const fa = detailActs();
  const fEdit = el('button', 'btn btn-sm btn-gold', 'Edit');
  fEdit.onclick = () => flightEditor(f);
  fa.appendChild(fEdit);
  const fSms = el('button', 'btn btn-sm', 'Text it');
  fSms.onclick = () => {
    const prods0 = f.core.map(x => prod(x.k)).filter(Boolean);
    location.href = 'sms:?&body=' + encodeURIComponent(L.smsBody(f, prods0));
  };
  fa.appendChild(fSms);
  // Remix: the same question, different bottles. It was gated behind
  // having run the flight and called Run it again, which made it sound
  // like repeating an evening rather than making a variant — and the
  // reason to want one is usually that a pour is empty or a guest has
  // already had it, neither of which requires having run it first.
  const remix = el('button', 'btn btn-sm', 'Remix');
  remix.title = 'Same question, different bottles';
  remix.onclick = () => showRecast(f);
  fa.appendChild(remix);

  const papers = el('button', 'btn btn-sm', 'Papers');
  papers.onclick = () => showPapers(f);
  fa.appendChild(papers);

  const fRun = el('button', 'btn btn-sm btn-gold', 'Poured it');
  fRun.onclick = () => runFlight(f, () => showFlight(f));
  fa.appendChild(fRun);
  const head = el('div', 'sheet');
  const t = el('h2'); t.style.cssText = 'font-size:23px;color:var(--ink-deep)';
  t.textContent = L.sentenceCase(f.title);
  head.appendChild(t);
  head.appendChild(el('div', 'var', L.variableOf(f)));
  const pr = el('p'); pr.style.cssText = 'font-size:14px;margin:9px 0 0';
  pr.textContent = f.premise || '';
  head.appendChild(pr);
  body.appendChild(head);

  const prods = f.core.map(p => prod(p.k)).filter(Boolean);

  // validators
  const vbox = el('div');
  L.validate(f.core, S.catalog, { bottles: S.bottles, coreTarget: L.CORE_TARGET })
    .forEach(m => {
      const w = el('div', 'warn' + (m.level === 'ok' ? ' ok' : ''));
      w.innerHTML = '<b>' + (m.level === 'ok' ? '\u2713' : '!') + '</b> ';
      w.appendChild(document.createTextNode(m.msg));
      vbox.appendChild(w);
    });
  body.appendChild(vbox);

  // the proof ladder
  const lad = el('div', 'sheet');
  lad.appendChild(el('h3', null, 'The pours'));
  const ladder = el('div', 'ladder');
  ladder.appendChild(el('div', 'axis'));
  f.core.forEach((p, i) => {
    const kind = L.pourKind(p);
    const pd = kind === 'shelf' ? prod(p.k) : null;
    const card = f.cards[i] || {};
    const spotted = /SPOTTED/i.test(card.wood || '');
    const proof = L.pourProof(p, S.catalog);
    const r = el('div', 'rung ' + (spotted ? 'spot' : 'blind')
      + (kind === 'wish' ? ' wish' : ''));
    r.appendChild(el('div', 'pin', proof !== null ? proof : (card.proof || '')));
    r.appendChild(el('div', 'tick'));
    const b = el('div', 'body');
    const line = el('div', 'b');
    line.appendChild(document.createTextNode(
      (p.letter || String.fromCharCode(65 + i)) + ' \u00b7 '
      + (L.pourLabel(p, S.catalog) || p.card || '')));
    // A wish and a blend are not bottles on the shelf, and the ladder should
    // not pretend otherwise.
    if (kind !== 'shelf') {
      line.appendChild(el('span', 'pourtag ' + kind,
        kind === 'wish' ? 'want it' : 'blend'));
    }
    b.appendChild(line);

    if (kind === 'blend') {
      // Say what it is made of, since that is the whole instruction.
      const parts = (p.parts || []).map(k => (S.catalog[k] || {}).name || k);
      b.appendChild(el('div', 'w', p.note || ('Equal parts ' + parts.join(' and '))));
    } else {
      const woodBits = pd && pd.fin ? pd.fin
        : (card.wood || '').split('\u2014')[0].trim();
      if (woodBits) b.appendChild(el('div', 'w', woodBits));
    }

    if (pd) { b.style.cursor = 'pointer'; b.onclick = () => showBottle(pd.k); }
    r.appendChild(b);
    ladder.appendChild(r);
  });
  lad.appendChild(ladder);
  lad.appendChild(el('div', 'snack', 'Snacks: ' + L.snacksFor(prods).join(', ')));
  body.appendChild(lad);

  // bench
  if (f.ext.length) {
    const e = el('div', 'sheet');
    e.appendChild(el('h3', null, 'On the bench'));
    f.ext.forEach(x => {
      const pd = prod(x.k);
      e.appendChild(el('div', 'sub', (pd ? pd.name + ' \u00b7 ' + pd.proof : x.card)));
    });
    body.appendChild(e);
  }

  // why it is built this way
  if (f.why && f.why.length) {
    const w = el('div', 'sheet');
    w.appendChild(el('h3', null, 'Why it is built this way'));
    f.why.forEach(x => {
      const p2 = el('p'); p2.style.cssText = 'font-size:13px;margin:8px 0 0;color:var(--ink)';
      p2.textContent = x; w.appendChild(p2);
    });
    body.appendChild(w);
  }

  goTo('detail');
}

// Three separate ideas, kept separate on purpose:
//
//   directory  who exists and is willing to be found
//   requests   who has asked
//   shares     who YOU have let in
//
// Being in the directory grants nothing. A request grants nothing. Only a
// share grants anything, and only the owner of a shelf can write one — so
// access is always given, never taken.
