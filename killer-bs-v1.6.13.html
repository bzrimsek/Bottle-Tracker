  const list = el('div', 'recent');
  list.style.marginTop = '8px';
  res.bottles.forEach(b => {
    const r = el('button', 'item find-' + (b.find || 'unknown'));
    const left = el('div');
    const nm = el('div', 'nm', b.name);
    // Whether you can buy it, beside what it is. A $40 shelf staple and a
    // $99 allocated release are not the same suggestion at similar prices,
    // and a bottle nobody can get is a taunt rather than a recommendation.
    {
      // Always a tag. A blank where the availability goes reads as "we
      // checked and it is fine"; it means nobody said.
      nm.appendChild(findTag(b.find || 'unknown', b.name, b.dist));
    }
    left.appendChild(nm);
    left.appendChild(el('div', 'sub',
      [b.dist, b.proof ? b.proof + ' proof' : null, b.why]
        .filter(Boolean).join(' \u00b7 ')));
    r.appendChild(left);
    r.appendChild(el('div', 'pf', b.price ? '$' + b.price : '\u2014'));
    // Straight into the judging half, with the name filled in.
    r.onclick = () => {
      closeModal();
      /* Carry what was just found, and land ON it.

         It set the name and re-rendered without setting the mode, so a
         candidate opened from the planning screen arrived back at the
         planning screen and you had to say "in a store" yourself. Asking
         you to look up a bottle we have this second been told the proof
         and price of is absurd; asking twice is worse. */
      const extra = {};
      if (b.proof) extra.proof = String(b.proof);
      if (b.price) extra.msrp = String(b.price);
      if (b.dist) extra.dist = b.dist;
      S.shopFound = b.name;
      openShopFor(b.name, extra);
    };
    list.appendChild(r);
  });
  out.appendChild(list);
  out.appendChild(el('div', 'src',
    'Suggested, not verified. Anything already on your shelf is filtered '
    + 'out; the rest is worth checking before you buy.'));
}

/* The dimension row: what you are exploring. It sits above both modes,
   because the axis is as good a filter for a search as it is a shape for
   a suggestion — "show me Islay" and "suggest me an Islay" are the same
   question asked twice. */
/* Where are you standing?

   Suggest and Search named what the APP does. This names the situation the
   person is in, which is the thing they actually know when they arrive. It
   is the empty state and not a gate: once answered it collapses to a small
   control, because being interrogated every time you open Shop is worse
   than a toggle that did nothing.                                        */
/* Three situations, and the drawing of each.

   The art carries the meaning: a bottle in a hand, a shelf with a gap in
   it, a browser window. A row of three sentences is a form to read before
   you can start, and this is the screen somebody opens standing up in a
   shop. The label stays underneath — a picture alone is a guessing game. */
const SHOP_MODES = [
  { id: 'store',  label: 'In a store, holding a bottle',
    hint: 'Scan it or type the name. Straight to a verdict.',
    art: '<rect x="20" y="14" width="20" height="10" rx="2"/>'
       + '<path d="M23 24h14v28a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6z"/>'
       + '<path d="M23 40h14" class="ln"/>'
       + '<path d="M12 46c0-6 4-8 8-8" class="ln"/>'
       + '<path d="M10 46h8v12h-8z" class="hd"/>' },
  { id: 'plan',   label: 'Deciding what to buy next',
    hint: 'Pick a dimension and see what your shelf is thin on.',
    art: '<path d="M8 20h44M8 40h44M8 60h44" class="ln"/>'
       + '<rect x="12" y="8" width="7" height="12" rx="1"/>'
       + '<rect x="23" y="6" width="7" height="14" rx="1"/>'
       + '<rect x="34" y="10" width="7" height="10" rx="1"/>'
       + '<rect x="12" y="28" width="7" height="12" rx="1"/>'
       + '<rect x="34" y="26" width="7" height="14" rx="1"/>'
       + '<rect x="23" y="26" width="7" height="14" rx="1" class="gap"/>' },
  { id: 'online', label: 'Looking at it on a website',
    hint: 'Paste the link and it reads the page.',
    art: '<rect x="6" y="12" width="48" height="38" rx="3" class="ln"/>'
       + '<path d="M6 22h48" class="ln"/>'
       + '<circle cx="12" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/>'
       + '<rect x="14" y="28" width="10" height="18" rx="2"/>'
       + '<path d="M30 30h16M30 36h16M30 42h9" class="ln"/>' }
];

/* Open Shop, holding a named bottle.

   Four places did this by hand, and each had to remember to set the mode:
   the ones that forgot landed on whichever screen Shop was last showing,
   so a bottle arrived and the planning screen was still up. Hence "the
   data gets there already but the user has to click 2 times."  */
function openShopFor(name, extra) {
  S.shopMode = 'store';
  S.shopFromPage = false;
  if (extra) S.shop = Object.assign({ name: name }, extra);
  save_();
  show('shop');
  const box = document.getElementById('shopQ');
  if (box) box.value = name;
  renderShop();
}

function renderShopQuestion(box) {
  const card = el('div', 'sheet');
  card.appendChild(el('h3', null, 'What are you doing?'));
  // Three tiles across, because there are three answers and they are the
  // whole of this screen. Stacked sentences read as a form; this reads as
  // a choice, which is what it is.
  const grid = el('div', 'modegrid');
  SHOP_MODES.forEach(mo => {
    const b = el('button', 'modetile');
    b.type = 'button';
    // Set as markup rather than built with createElementNS: the drawing is
    // a constant in SHOP_MODES, nothing here comes from a user, and the
    // namespace dance costs five lines a tile for no gain.
    const art = el('div', 'artwrap');
    art.innerHTML = '<svg viewBox="0 0 60 66" class="modeart" '
      + 'aria-hidden="true">' + mo.art + '</svg>';
    b.appendChild(art);
    b.appendChild(el('div', 'nm', mo.label));
    b.appendChild(el('div', 'sub', mo.hint));
    b.onclick = () => { S.shopMode = mo.id; save_(); renderShop(); };
    grid.appendChild(b);
  });
  card.appendChild(grid);
  box.appendChild(card);
}

// Once answered, a line rather than a question.
function renderModeLine(box) {
  const mo = SHOP_MODES.find(x => x.id === S.shopMode);
  if (!mo) return;
  const row = el('div', 'hdr');
  row.style.marginBottom = '9px';
  // Arriving from a pasted page lands in store mode, because that is where
  // the bottle view is. Saying "I am in a store, holding a bottle" there
  // is a lie about where somebody is standing.
  row.appendChild(el('div', 'sub', S.shopFromPage && S.shopMode === 'store'
    ? 'Read off the page you pasted' : mo.label));
  /* A back button, not a Change pill.

     Answering the question is a step INTO the screen, so leaving it is a
     step back — and every other screen in the app spells that the same way,
     on the left, with a chevron. "Change" was a third word for the one idea
     the chevron already carries, sitting on the opposite side of the row
     from where the app puts going back. */
  /* Beside Home, not under it, and exactly ONE of it.

     Two faults met here. This row is the screen's own header, which
     renderShop does not clear — only #shopHead is emptied — so building a
     button each time piled up a new one on every render: three, four, five
     of them across the top. And it carried the backbtn class, which
     labelBacks renames on every navigation, so the ones that survived read
     "Home" instead of "Back".

     Built once, found by id afterwards, and NOT a .backbtn: it does not go
     where the trail goes, it returns to the question. */
  const top = document.querySelector('#scr-shop .hdr');
  let back = document.getElementById('shopBack');
  if (!back && top) {
    back = el('button', 'btn btn-sm ghost shopback');
    back.id = 'shopBack';
    back.type = 'button';
    const home = top.querySelector('.backbtn');
    if (home && home.nextSibling) top.insertBefore(back, home.nextSibling);
    else top.insertBefore(back, top.firstChild);
  }
  /* What you meant to buy, from wherever you are.

     The list only existed on the planning screen, so in a shop — which is
     what a wishlist is FOR — there was no way to see it. A chip carrying
     the count, in the header, in every mode. */
  let wish = document.getElementById('shopWish');
  if (!wish && top) {
    wish = el('button', 'chip shopwish');
    wish.id = 'shopWish';
    wish.type = 'button';
    wish.onclick = () => openModal('Your wishlist', m => {
      const draw = () => {
        m.innerHTML = '';
        m.appendChild(el('h2', null, 'Your wishlist'));
        m.appendChild(wishCard(draw));
        const close = el('button', 'btn ghost wide', 'Close');
        close.onclick = closeModal;
        m.appendChild(close);
      };
      draw();
    });
    const acts = top.querySelector('.hdr-acts') || top;
    acts.appendChild(wish);
  }
  if (wish) {
    wish.textContent = 'Wanted \u00b7 ' + (S.wish || []).length;
    wish.hidden = false;
  }

  if (back) {
    back.textContent = '\u2039 Back';
    back.hidden = false;
    back.onclick = () => {
      S.shopMode = null; S.shopDim = null; S.shopFromPage = false;
      save_(); renderShop();
    };
  }
  box.appendChild(row);
}

/* Reading a page you are looking at.

   Many shops refuse a cross-origin fetch, so this tries the URL and falls
   back to pasted text — the same parse either way, rather than a feature
   that works on some sites and silently fails on the rest.              */
function renderFromUrl(box) {
  const card = el('div', 'sheet');
  card.appendChild(el('h3', null, 'Paste the link'));
  card.appendChild(el('div', 'sub',
    'It reads the page for the name, proof, age, cask, size and price. '
    + 'If the shop refuses, paste the page text instead.'));

  const inp = document.createElement('input');
  inp.className = 'field';
  inp.type = 'url';
  inp.placeholder = 'https://…';
  inp.style.marginTop = '10px';
  card.appendChild(inp);

  const msg = el('div', 'looknote');
  msg.style.marginTop = '8px';
  card.appendChild(msg);

  const ta = document.createElement('textarea');
  ta.className = 'field';
  ta.rows = 5;
  ta.placeholder = 'or paste the page text here';
  ta.style.marginTop = '9px';
  card.appendChild(ta);

  const use = res => {
    if (!res.name) {
      msg.className = 'looknote warn2';
      msg.textContent = 'No bottle name in that. Paste the page text, or '
        + 'type the name in the store option.';
      return;
    }
    // What the page carried is already here. What it did NOT carry has to
    // be fetched, and that was the whole fault: the reasoning below said
    // there is nothing to look up, which is true of a page that gave a
    // distillery and a proof and false of one that gave neither. When the
    // parse comes back thin the lookup runs on its own. That was written
    // when Look it up was folded inside a disclosure; the button is on the
    // glass now, and running the lookup anyway is still the right answer
    // for a page that carried almost nothing.
    S.shopFound = res.name;
    S.shop = {
      name: res.name,
      proof: res.proof || '', msrp: res.msrp || '',
      sub: res.sub || 'bourbon', fin: L.cleanFinish(res.fin) || '',
      dist: res.dist || '', scar: res.singleBarrel ? 'exclusive' : 'standard'
    };
    // The richer fields the form has no row for, kept so buying it carries
    // them onto the shelf.
    S.shopExtra = {
      age: res.age || null, region: res.region || null,
      size: res.size || null, bonded: res.bonded || null,
      tn: res.tn || null, tnSrc: res.tn ? 'shop' : null,
      src: res.url ? { shop: res.url } : null
    };
    // Store is where the bottle view lives, so that is where this lands —
    // but the header then claimed you were standing in a shop, which is
    // not where you are. It says what actually happened instead.
    S.shopMode = 'store';
    S.shopFromPage = true;
    $('#shopQ').value = res.name;
    save_();
    renderShop();
    toast('Read ' + Object.keys(res)
      .filter(k => res[k] !== null && k !== 'source' && k !== 'url').length
      + ' things off that page');
    // Thin means the page named neither the house nor the strength, which
    // is most of what a verdict is built from.
    if ((!res.dist || !res.proof) && S.lookupUrl) {
      const auto = document.getElementById('shopLookBtn');
      if (auto) auto.click();
    }
  };

  const go = el('button', 'btn wide btn-gold', 'Read it');
  go.style.marginTop = '10px';
  go.onclick = async () => {
    const pasted = ta.value.trim();
    if (pasted) {
      const res = L.readShopText(pasted, inp.value.trim());
      // A paste is lines, not a title. Falling back to the title parser on
      // the URL alone still helps when the paste is one unbroken blob.
      res.name = L.nameFromShopText(pasted)
        || L.nameFromShopPage('', inp.value.trim());
      use(res);
      return;
    }
    const url = inp.value.trim();
    if (!/^https?:\/\//.test(url)) {
      msg.className = 'looknote warn2';
      msg.textContent = 'That is not a link.';
      return;
    }
    msg.className = 'looknote';
    msg.textContent = 'Reading\u2026';
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const html = await r.text();
      const title = (html.match(/<title[^>]*>([^<]+)<\/title>/i) || [])[1] || '';
      const text = html.replace(/<script[\s\S]*?<\/script>/gi, ' ')
        .replace(/<style[\s\S]*?<\/style>/gi, ' ')
        .replace(/<[^>]+>/g, ' ');
      const res = L.readShopText(text, url);
      res.name = L.nameFromShopPage(title, url);
      use(res);
    } catch (e) {
      // Expected on most retail sites: a browser cannot fetch across
      // origins without the shop's permission, and shops do not give it.
      msg.className = 'looknote warn2';
      msg.textContent = 'That shop will not let the app read it. '
        + 'Select the page, copy, and paste it below.';
      ta.focus();
    }
  };
  card.appendChild(go);
  box.appendChild(card);
}

function renderDimensions(box, caption) {
  // The same eight pills mean two different things: on the planning screen
  // they choose what to go shopping ALONG, and next to a named bottle they
  // choose how to measure what your shelf already holds near it. Neither
  // was said anywhere, so the row read as eight unexplained nouns.
  if (caption) box.appendChild(el('div', 'dimcap', caption));
  const row = el('div', 'dimrow');
  const any = el('button', 'chip', 'Anything');
  any.type = 'button';
  any.setAttribute('aria-pressed', !S.shopDim);
  any.onclick = () => { S.shopDim = null; save_(); renderShop(); };
  row.appendChild(any);

  L.DIMENSIONS.forEach(d => {
    const c = el('button', 'chip', d.label);
    c.type = 'button';
    c.title = d.hint;
    c.setAttribute('aria-pressed', S.shopDim === d.id);
    c.onclick = () => {
      S.shopDim = S.shopDim === d.id ? null : d.id;
      save_(); renderShop();
    };
    row.appendChild(c);
  });
  box.appendChild(row);
}

// What is thin along the chosen axis, as named things to go and find.
/* Anything: the best opening from each axis, as named things to find.

   The old list was three abstract categories and two bottles, and it never
   changed — the same five for ever, whatever was pressed. This shows the
   strongest opening from each axis that has one, rotated so pressing again
   moves you along them rather than redrawing the same thing. */
function renderAnything(box) {
  // An ask that came back with nothing is recorded dead, and this is where
  // it has to be honoured — otherwise the Arran-above-122 that found
  // nothing is offered again on the next render, which is exactly the
  // stagnation BZ is describing.
  const dead = deadGaps();
  const isDead = o => dead[L.gapKey({ kind: 'axis', name: o.ask })];
  const ranked = L.axisRanking(S.catalog, S.bottles)
    .map(a => Object.assign({}, a, { all: a.all.filter(o => !isDead(o)) }))
    .filter(a => a.all.length);
  if (!ranked.length) {
    // The old findings still have a job here: a flight you cannot run, a
    // sealed bottle upstairs. Those are not axis gaps.
    renderGaps(box);
    return;
  }

  const off = S.anyRotate || 0;
  const card = el('div', 'sheet');
  const hd = el('div', 'hdr');
  hd.style.marginBottom = '4px';
  hd.appendChild(el('h3', null, 'Worth looking for'));
  const acts = el('div', 'hdr-acts');
  const again = el('button', 'chip', 'Something else');
  again.onclick = () => {
    // Moves along the axes rather than pretending to recalculate. The
    // ranking is stable; where it starts is not.
    S.anyRotate = (off + 1) % ranked.length;
    save_();
    renderShop();
  };
  acts.appendChild(again);
  hd.appendChild(acts);
  card.appendChild(hd);
  card.appendChild(el('div', 'sub',
    'Worked out from your shelf. Tap one to find real bottles for it.'));

  const list = el('div', 'recent');
  list.style.marginTop = '9px';
  // Most options first. The number on the right was how many you ALREADY
  // own, which is not what anybody reads it as — and a row saying 0 or a
  // dash looks like a result count of nothing.
  ranked.sort((a, b) => b.all.length - a.all.length);

  ranked.forEach((ax, i) => {
    // Advance WITHIN each axis, not just around them. Rotating the order
    // alone showed the same five in a different sequence, which is not
    // something else — it is the same thing rearranged. Each press takes
    // the next opening that axis has, and wraps when it runs out.
    // An axis with one opening repeats it, which reads as the rotation
    // being broken. Show it once and let the axes that have more carry
    // the change.
    if (off > 0 && ax.all.length === 1) return;
    const at = off % ax.all.length;
    const o = ax.all[at];
    if (!o) return;
    const r = el('button', 'item' + (i ? '' : ' leadrow'));
    const left = el('div');
    left.appendChild(el('div', 'nm', o.ask));
    left.appendChild(el('div', 'sub', o.why));
    // The count belongs to the AXIS, never to the ask on this row. In the
    // pf slot it sat where proof and price sit everywhere else in the app,
    // so "6 ways" read as six bottles for THIS ask — and then the search
    // came back with none and the two numbers looked like a contradiction
    // when both were right. One counts openings on your shelf; the other
    // counts bottles in the world. On the axis line, as a position, it
    // also says what Something else will do.
    left.appendChild(el('div', 'src', ax.all.length > 1
      ? ax.label + ' \u00b7 ' + (at + 1) + ' of ' + ax.all.length
      : ax.label));
    r.appendChild(left);
    r.onclick = () => showCandidates({
      kind: 'axis', name: o.ask, why: o.why, sub: o.sub || null
    });
    list.appendChild(r);
  });
  card.appendChild(list);
  box.appendChild(card);

  // What the axes cannot see: a flight that is short, a sealed bottle you
  // already own. Below, because those are rarer and this is the common case.
  renderGaps(box);
}

function renderAxis(box, axis) {
  const res = L.exploreAxis(axis, S.catalog, S.bottles);
  const card = el('div', 'sheet');
  const d = L.DIMENSIONS.find(x => x.id === axis) || {};
  card.appendChild(el('h3', null, d.label || 'Explore'));

  if (!res.opportunities.length) {
    card.appendChild(el('div', 'sub',
      'Your shelf is well covered on this one \u2014 nothing here is thin '
      + 'enough to be worth calling a gap. Try another dimension.'));
    box.appendChild(card);
    return;
  }

  card.appendChild(el('div', 'sub', d.hint || ''));
  const list = el('div', 'recent');
  list.style.marginTop = '9px';
  res.opportunities.forEach((o, i) => {
    const r = el('button', 'item' + (i ? '' : ' leadrow'));
    const left = el('div');
    left.appendChild(el('div', 'nm', o.ask));
    left.appendChild(el('div', 'sub', o.why));
    r.appendChild(left);
    r.appendChild(el('div', 'pf', o.have ? String(o.have) : '\u2014'));
    /* Straight to real bottles for that category — the same modal the
       findings above use.

       It used to type the ASK into the search box and run a lookup on it.
       "A World worth owning" is a category, not a bottle: the lookup came
       back with nothing usable, and the screen then offered a verdict, an
       Edit form and a Want it button for a whisky that does not exist. It
       also set shopMode to 'search', which is not one of the three modes
       this screen has. */
    r.onclick = () => showCandidates({
      kind: 'axis', name: o.ask, why: o.why, sub: o.sub || null
    });
    list.appendChild(r);
  });
  card.appendChild(list);
  box.appendChild(card);
}

function renderGaps(box) {
  /* Ordered by what each ask has actually produced. An ask that came back
     empty twice sinks below one nobody has tried; one that found real
     bottles rises. deadGaps still removes the proven-impossible outright —
     this is for everything between "works" and "never". */
  const gaps = L.rankAsks(
    L.shelfGaps(S.catalog, S.bottles, allFlights(), S.wish,
      S.history, deadGaps()),
    S.askStats);
  const card = el('div', 'sheet');
  const hd = el('div', 'hdr');
  hd.style.marginBottom = '4px';
  hd.appendChild(el('h3', null, 'Suggestions'));

  /* Something else, here too.

     It was removed because pressing it recomputed a deterministic list and
     returned the same four rows, which is right about the computation and
     wrong about the button. The list is longer than what is shown: four
     are on the screen and the rest sit behind a disclosure nobody opens.
     So this does not recompute anything — it moves the window four along,
     which is other options, which is what was asked for. */
  const goff = S.gapRotate || 0;
  card.appendChild(hd);
  card.appendChild(el('div', 'sub',
    'Worked out from your own shelf: houses worth going further into, '
    + 'contrasts you cannot currently taste, and dimensions too thin to '
    + 'compare. Type a name above to judge a specific bottle instead.'));

  if (!gaps.length) {
    card.appendChild(el('div', 'empty', 'Nothing obvious is missing.'));
    box.appendChild(card);
    return;
  }

  const KIND_LABEL = { flight: 'Unlocks a flight', wish: 'You wanted it',
    extend: 'Goes further', contrast: 'The other side',
    region: 'Thin region', category: 'Thin category', proof: 'Proof range',
    pair: 'No matched pair' };

  // Four recommendations. The rest are behind a disclosure, because a
  // ranked list stops being advice somewhere around the fifth item and the
  // tail was six entries all saying the same thing about matched pairs.
  const TOP = 4;
  // Rotated, not reordered. The ranking is stable and the window moves,
  // so the top four are genuinely different rows and the ranking still
  // means what it says.
  const off = gaps.length > TOP ? goff % gaps.length : 0;
  const view = off ? gaps.slice(off).concat(gaps.slice(0, off)) : gaps;
  if (gaps.length > TOP) {
    const more = el('button', 'chip', 'Something else');
    more.onclick = () => {
      S.gapRotate = (off + TOP) % gaps.length;
      renderShop();
    };
    const acts = el('div', 'hdr-acts');
    acts.appendChild(more);
    hd.appendChild(acts);
  }
  let rest = null, restBox = null;
  if (gaps.length > TOP) {
    restBox = el('details', 'gapmore');
    const sum = el('summary');
    sum.textContent = (gaps.length - TOP) + ' more, ranked below these';
    restBox.appendChild(sum);
    rest = el('div');
    restBox.appendChild(rest);
  }
  const place = (g, i) => (i < TOP ? card : rest);

  view.forEach((g, gi) => {
    // The first is the one worth acting on. Four identical grey rows say
    // they are all equally worth reading, which is not what a ranking
    // means — and it was the ranking that put this one first.
    const r = el('button', 'find f-'
      + (g.kind === 'flight' || g.kind === 'extend' ? 'ok' : 'info')
      + (gi ? '' : ' gaplead'));
    r.style.width = '100%';
    r.style.textAlign = 'left';
    const body = el('div');
    const nm = el('div', 'nm', g.name);
    // Whether you could actually buy it, beside what it is. Only where it
    // is worth noticing: on the shelf is the quiet default and tagging
    // every row with it would be noise on the rows that need nothing said.
    if (g.find === 'allocated' || g.find === 'hunt') {
      nm.appendChild(findTag(g.find, g.name, g.dist));
    }
    if (g.owned) {
      const p = S.catalog[g.k] || Object.values(S.catalog)
        .find(x => L.shopNorm(x.name) === L.shopNorm(g.name));
      // Whether to open a sealed bottle depends on the bottle and the
      // flight. "You own it" says neither. The occasion band is the part
      // that decides it: opening an everyday bottle to finish a flight is
      // nothing, opening a vault bottle is a decision.
      const band = p && p.msrp ? L.priceBand(p.msrp) : null;
      nm.appendChild(el('span', 'pourtag blend',
        band && (band === 'vault' || band === 'special')
          ? 'sealed \u00b7 ' + band : 'sealed, and yours'));
      // And the action, on the finding. Telling somebody the answer is
      // upstairs and giving them no way to act on it is half a feature —
      // this is the row where the decision gets made.
      if (p) {
        const op = el('button', 'chip');
        op.type = 'button';
        op.textContent = 'Open it';
        op.style.marginLeft = '7px';
        op.onclick = ev => {
          ev.stopPropagation();
          openSealed(p.k, () => renderShop());
        };
        nm.appendChild(op);
      }
    }
    body.appendChild(nm);
    body.appendChild(el('div', 'sub', g.why));
    // The flight's own name, where there is one, as a label rather than as
    // the explanation — it only means something if you remember writing it.
    if (g.flight) {
      body.appendChild(el('div', 'src', L.sentenceCase(g.flight)));
    }
    r.appendChild(el('div', 'm',
      g.kind === 'wish' ? '\u2661'
      : g.kind === 'flight' ? '\u2605'
      : g.kind === 'extend' ? '\u2197'
      : g.kind === 'contrast' ? '\u21c4' : '\u00b7'));
    r.appendChild(body);
    // Dismissable directly. Ruling something out only when a search came
    // back empty meant running a search you already knew would fail, just
    // to make a finding go away.
    const no = el('button', 'dismiss');
    no.type = 'button';
    no.textContent = '\u00d7';
    no.title = 'Not interested';
    no.setAttribute('aria-label', 'Dismiss this');
    no.onclick = ev => {
      ev.stopPropagation();
      deadGaps()[L.gapKey(g)] = g.name || 1;
      save_();
      renderShop();
      toast('Dropped', { label: 'Undo', action: () => {
        delete deadGaps()[L.gapKey(g)];
        save_(); renderShop();
      } });
    };
    r.appendChild(no);
    r.title = KIND_LABEL[g.kind] || '';
    // Tapping searches for it, which drops you into the judging half with
    // the name already filled in.
    r.onclick = () => {
      // A named bottle goes straight to the search. A description cannot —
      // "a finished Buffalo Trace" is not something a shop stocks — so it
      // asks for real bottles that would fill it instead.
      if (L.gapIsNamed(g)) {
        // Carry what is already known, so a bottle we can describe does not
        // arrive at a blank form.
        S.shop = { name: g.name };
        if (g.proof) S.shop.proof = String(g.proof);
        if (g.sub) S.shop.sub = g.sub;
        if (g.price) S.shop.msrp = String(g.price);
        if (g.proof || g.sub || g.price) S.shopFound = g.name;
        // Coming from a recommendation, you have already said which bottle
        // you mean. Telling you to press Enter now is asking twice.
        S.shopFromGaps = true;
        $('#shopQ').value = g.name;
        renderShop();
        const auto = document.getElementById('shopLookBtn');
        if (auto && S.lookupUrl) auto.click();
      } else {
        showCandidates(g);
      }
    };
    place(g, gi).appendChild(r);
  });
  // A gap can be marked impossible wrongly — a house releases something new,
  // or a search failed for a reason that had nothing to do with the bottle.
  // Nothing should be permanently unrecommendable on the strength of one
  // empty answer.
  const nDead = Object.keys(deadGaps()).length;
  if (nDead) {
    const clr = el('button', 'chip',
      'Show the ' + nDead + ' ruled out');
    clr.style.marginTop = '10px';
    clr.onclick = () => {
      // Listed and restored one at a time. Restoring all of them brings
      // back the ones proved unanswerable along with any ruled out by
      // mistake, and the first thing you would see is the goose chase you
      // just escaped.
      openModal('Ruled out', m => {
        m.appendChild(el('div', 'sub',
          'These were searched for and nothing genuine came back, or you '
          + 'dismissed them. Bring one back if you think that was wrong.'));
        const list = el('div', 'recent');
        list.style.marginTop = '9px';
        Object.keys(deadGaps()).forEach(key => {
          const r = el('button', 'item');
          const left = el('div');
          /* The ask's own words, where they were kept.

             This rebuilt the label from the key, and the key holds the
             NORMALISED name — which has had the noise words stripped out
             of it for matching. "A whisky finished in Tokaji" came back
             as "A finished in tokaji". The name is stored beside the flag
             now; anything ruled out before that still falls back to the
             key, which is where those three came from. */
          const kept = deadGaps()[key];
          left.appendChild(el('div', 'nm oneline',
            typeof kept === 'string' && kept
              ? kept : L.sentenceCase(key.split('|')[1] || key)));
          left.appendChild(el('div', 'sub', 'Nothing genuine came back'));
          r.appendChild(left);
          r.appendChild(el('div', 'pf', 'Restore'));
          r.onclick = () => {
            delete deadGaps()[key];
            save_();
            closeModal();
            renderShop();
            toast('Back on the list');
          };
          list.appendChild(r);
        });
        m.appendChild(list);
        const close = el('button', 'btn ghost wide', 'Close');
        close.style.marginTop = '11px';
        close.onclick = closeModal;
        m.appendChild(close);
      });
      return;
    };
    card.appendChild(clr);
  }

  if (restBox) card.appendChild(restBox);
  box.appendChild(card);

  // The wishlist here too, empty or not: a list you cannot see when it is
  // empty is a feature nobody discovers.
  box.appendChild(wishCard());
}

/* The wishlist, built once and shown wherever it is wanted.

   It lived inside the planning screen only, so standing in a shop — the
   one place the list is FOR — there was no way to see what you had meant
   to buy. Same card on the planning screen and behind the Wanted chip in
   the header, rather than a second copy that drifts. */
function wishCard(after) {
  const w = el('div', 'sheet');
  const hd = el('div', 'hdr');
  hd.style.marginBottom = '6px';
  hd.appendChild(el('h3', null, 'Your wishlist'));
  hd.appendChild(el('span', 'count', String(S.wish.length)));
  w.appendChild(hd);
  if (!S.wish.length) {
    w.appendChild(el('div', 'sub',
      'Nothing on it yet. Want it, on any bottle, puts it here with the '
      + 'reason \u2014 which flight it would finish, or how it would fit.'));
    return w;
  }
  S.wish.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(x => {
    const r = el('div', 'item');
    const left = el('div');
    left.appendChild(el('div', 'nm', x.name));
    left.appendChild(el('div', 'sub', x.forFlight
      ? 'For ' + L.sentenceCase(x.forFlight)
      : (x.reason || 'Added ' + x.added)));
    r.appendChild(left);
    // Tapping the row takes you to it, the same as everywhere else a
    // bottle name appears.
    r.style.cursor = 'pointer';
    r.onclick = () => { closeModal(); openShopFor(x.name); };
    const acts = el('div', 'lookrow');
    acts.style.margin = '0';
    // In a shop, the question is where to get it — so the same one-tap
    // search the bottle screen carries.
    const url = L.findUrl(x.name, x.dist);
    if (url) {
      const f = el('button', 'chip', 'Find it');
      f.onclick = ev => { ev.stopPropagation(); window.open(url, '_blank', 'noopener'); };
      acts.appendChild(f);
    }
    const drop = el('button', 'chip', 'Remove');
    drop.onclick = ev => {
      ev.stopPropagation();
      S.wish = L.wishRemove(S.wish, x.name);
      save_(); renderShop(); toast('Off the wishlist');
      if (after) after();
    };
    acts.appendChild(drop);
    r.appendChild(acts);
    w.appendChild(r);
  });
  return w;
}

/* --- Shop: two ways in, one destination ---------------------------------

   Suggestions and Search are different activities and were sharing one
   surface with the mode implied by whether the box had text in it. They
   are not the same job: judging is standing in a shop with a bottle in
   your hand and wanting a verdict before you put it down; discovering is
   having no target and wanting to be told what is missing.

   So: two entry points, and BOTH resolve to the same place — one bottle,
   with what it is, what your shelf says about it, and whether it fits.    */

// The destination. Everything about one bottle, whether you typed its name
// or arrived from a suggestion.
function shopBottleView(box, cand, mid) {
  const q = (cand.name || '').trim();
  const fit = L.shelfFit(cand, S.catalog, S.bottles, allFlights());
  const owned = fit.own ? S.catalog[fit.own.key] : null;

  // 1. WHAT IT IS.
  const card = el('div', 'sheet');
  const hd = el('div', 'hdr');
  hd.style.marginBottom = '2px';
  hd.appendChild(el('h3', null, q));
  card.appendChild(hd);

  const facts = [
    cand.dist,
    cand.proof ? cand.proof + ' proof' : null,
    cand.sub ? L.titleCase(cand.sub) : null,
    cand.age ? cand.age + ' years' : null,
    cand.fin,
    cand.region,
    cand.msrp ? '$' + cand.msrp : null
  ].filter(Boolean);
  card.appendChild(el('div', 'sub', facts.join('  \u00b7  ') || 'Nothing known yet.'));
  if (cand.source === 'lookup') {
    card.appendChild(el('div', 'src', 'Looked up. Check it before you trust it.'));
  } else if (cand.k) {
    card.appendChild(el('div', 'src', S.base[cand.k]
      ? 'From the library.' : 'From your own shelf.'));
  }
  box.appendChild(card);

  // What you can DO about it, and the fields you can correct, directly under
  // the name. They were both inside a collapsed "Correct these details"
  // fold at the very bottom, which meant Want it and I bought it — the two
  // reasons to be on this screen — were invisible until you opened a fold
  // that claimed to be about editing.
  if (mid) box.appendChild(mid);

  // 2. THE VERDICT, then the reasoning behind it.
  const vcard = el('div', 'sheet');
  vcard.style.marginTop = '9px';
  vcard.appendChild(el('div', 'verdict', L.fitVerdict(fit)));
  L.fitByGroup(fit).forEach(g => {
    const head = el('div', 'rs');
    head.style.cssText = 'margin:10px 0 3px;font-size:10.5px;'
      + 'letter-spacing:.08em;text-transform:uppercase;color:var(--mute)';
    head.textContent = g.label;
    vcard.appendChild(head);
    g.items.forEach(x => {
      const row = el('div', 'find f-' + x.level);
      row.appendChild(el('div', 'm', x.level === 'ok' ? '\u2713'
        : x.level === 'warn' ? '!' : '\u00b7'));
      row.appendChild(el('div', null, x.msg));
      vcard.appendChild(row);
    });
  });
  box.appendChild(vcard);

  /* 3. WHAT YOUR SHELF HAS THAT IS NEAR IT.

     Nearness is not one measure. The default is same category within five
     proof points, which is what shelfFit computes; the dimension pills
     above this card name seven others, and until now they were drawn on
     this screen and read by nothing. Picking one measures nearness that
     way instead, and the heading says which — a list whose ordering is
     invisible is the same list in a different sequence. */
  const byAxis = L.nearestBy(S.shopDim, cand, Object.values(S.catalog));
  const near = (byAxis ? byAxis.list : (fit.neighbours || [])).slice(0, 5);
  const nearLabel = byAxis ? byAxis.label : 'Nearest on your shelf';
  if (owned || near.length || byAxis) {
    const scard = el('div', 'sheet');
    scard.style.marginTop = '9px';
    scard.appendChild(el('h3', null, owned ? 'On your shelf' : nearLabel));
    // An axis the bottle cannot be measured on says so rather than
    // silently falling back — otherwise pressing An age on a page that
    // gave no age looks identical to pressing nothing.
    if (!byAxis && S.shopDim) {
      const ax = L.NEAR_AXES[S.shopDim] || {};
      scard.appendChild(el('div', 'sub',
        'Nothing known about its ' + (ax.label || 'that')
        + ', so this is ordered by strength.'));
    }
    const list = el('div', 'recent');
    list.style.marginTop = '7px';
    (owned ? [owned].concat(near) : near).forEach(p => {
      const n = L.ownedCount(p.k, S.bottles);
      const open = L.pourable(p.k, S.bottles);
      const r = el('button', 'item ' + typeClass(p) + (open ? '' : ' sealed'));
      const left = el('div');
      left.appendChild(el('div', 'nm oneline', p.name));
      left.appendChild(el('div', 'sub', [n + (n === 1 ? ' bottle' : ' bottles'),
        open ? 'open' : 'sealed'].join(' \u00b7 ')));
      r.appendChild(left);
      r.appendChild(el('div', 'pf', String(p.proof || '')));
      r.onclick = () => showBottle(p.k);
      list.appendChild(r);
    });
    scard.appendChild(list);
    box.appendChild(scard);
  }
  return fit;
}

function renderShop() {
  const top = $('#shopScroll'), bottom = $('#shopFixed');
  const head = $('#shopHead');
  const row = document.getElementById('searchRow');

  top.innerHTML = ''; bottom.innerHTML = '';
  head.innerHTML = '';
  // Hidden by display, never by the hidden attribute — its own
  // display:flex rule beats that — and never by detaching, which makes
  // every $('#shopQ') in the file return null. The row is NOT moved: it
  // sits outside the containers this function empties, because moving a
  // focused input blurs it and the typing stops dead.
  if (row) row.style.display = 'none';
  // Shown only once a situation has been answered; renderModeLine puts it
  // back. It lives in the screen header, which this function never clears.
  const sback = document.getElementById('shopBack');
  if (sback) sback.hidden = true;
  const swish = document.getElementById('shopWish');
  if (swish) swish.hidden = true;
  $('#scr-shop').classList.remove('answering');


  const q = $('#shopQ').value;

  // No answer yet: ask where they are standing. Suggest and Search named
  // what the APP does; this names the situation, which is the thing
  // somebody actually knows when they arrive.
  if (!S.shopMode) {
    renderShopQuestion(top);
    return;
  }
  renderModeLine(head);

  // ONLINE: read the page they are looking at.
  if (S.shopMode === 'online') {
    renderFromUrl(top);
    return;
  }

  // PLANNING: the dimensions and what they turn up. No box, because there
  // is nothing to type into it here.
  if (S.shopMode === 'plan') {
    renderDimensions(top, 'Pick what to shop along, or leave it on Anything.');
    if (S.shopDim) { renderAxis(top, S.shopDim); return; }
    S.shopFromGaps = false;
    renderAnything(top);
    return;
  }

  // IN A STORE: the box is already in place under the mode line. Only its
  // visibility changes here.
  if (row) {
    row.style.display = 'flex';
  }

  // Nothing typed yet: the box and the scanner, and nothing else. A list of
  // findings here answers a question this person did not ask — they have
  // the bottle in their hand.
  if (!q.trim()) {
    // No hint card. The box says what to type and the scanner sits beside
    // it — a sheet repeating both was a third instruction for a screen
    // with two controls on it.
    /* The wishlist DOES belong here, though. This is the screen you open
       standing in a shop with nothing typed yet, which is the exact moment
       the question is "what was I meaning to buy?" — and until now the
       answer lived on the planning screen, behind a chip, or nowhere.
       Shown even when empty, so the feature is visible before it is used. */
    bottom.appendChild(wishCard(() => renderShop()));
    $('#shopQ').focus();
    return;
  }

  // The dimension is visible in search too, and says what it is doing —
  // an axis is as good a filter for a search as it is a shape for a
  // suggestion, which is the whole reason it sits above both.
  $('#scr-shop').classList.add('answering');
  renderDimensions(top,
    'Measure your shelf against this bottle by:');

  // Top half, scrolling: what you already own that resembles it.
  const hits = L.shopSearch(q, S.catalog, 8);
  if (S.shopFromGaps) {
    const back = el('button', 'btn btn-sm ghost', '\u2039 What to look for');
    back.style.marginBottom = '9px';
    back.onclick = () => {
      S.shopFromGaps = false;
      S.shop = {}; S.shopFound = null;
      $('#shopQ').value = '';
      renderShop();
    };
    top.appendChild(back);
  }

  // The bottle view below carries what your shelf holds near it, so a list
  // of the same bottles up here said it twice and pushed the answer off the
  // screen. What remains is the one thing it could say that the view
  // cannot: that a lookup is about to happen, or that nothing is known.
  if (!hits.length && !S.shopFound) {
    const note = el('div', 'sheet');
    note.appendChild(el('div', 'sub', S.lookupUrl
      ? 'Nothing you own matches that. Looking it up\u2026'
      : 'Nothing you own matches that, and no lookup service is set up.'));
    top.appendChild(note);
  }

  // The bottle's own details, under the name it resolved to.
  const detail = el('div', 'sheet');
  detail.style.marginTop = '9px';
  detail.appendChild(el('h3', null, 'Correct the details'));
  const f = el('div', 'form shopform');
  f.style.marginTop = '6px';
  // S.shop holds what you last typed into these fields, so the verdict
  // survives a re-render. But it must not survive a change of BOTTLE:
  // searching springbank 15 was showing Barrell Craft Spirits at 109.76
  // left over from the previous search.
  if (L.shopNorm(S.shop.name || '') !== L.shopNorm(q)) {
    S.shop = { name: q };
    S.shopFound = null;
    S.shopFromGaps = false;
    // A different bottle did not come off that page.
    S.shopFromPage = false;
  }
  const seed = hits[0] ? hits[0].p : {};
  const two = el('div', 'two');
  two.appendChild(fieldRow('Proof', 'proof', S.shop.proof || seed.proof || '',
    { type: 'number', step: '0.1' }));
  two.appendChild(fieldRow('Price', 'msrp', S.shop.msrp || seed.msrp || '',
    { type: 'number', step: '0.01' }));
  f.appendChild(two);
  const two2 = el('div', 'two');
  two2.appendChild(selectRow('Type', 'sub',
    S.shop.sub || seed.sub || 'bourbon', L.TYPES));
  two2.appendChild(selectRow('Release', 'scar',
    S.shop.scar || seed.scar || 'standard',
    ['standard', 'batched', 'limited', 'exclusive']));
  f.appendChild(two2);
  const two3 = el('div', 'two');
  two3.appendChild(fieldRow('Distillery', 'dist', S.shop.dist || seed.dist || '', {}));
  two3.appendChild(fieldRow('Finish', 'fin', S.shop.fin || seed.fin || '',
    { placeholder: 'e.g. Oloroso' }));
  f.appendChild(two3);

  // Mark anything that came from the seed rather than from you, so a lookup
  // can overwrite a guess while still deferring to what you typed.
  ['proof', 'msrp', 'sub', 'scar', 'dist', 'fin'].forEach(k => {
    const input = f.querySelector('[name="' + k + '"]');
    if (input && input.value && S.shop[k] === undefined) {
      input.dataset.seeded = '1';
    }
    // Only what was actually carried reads as found. Type defaults to
    // bourbon, and marking that default as a finding told you Longrow is a
    // bourbon in the same styling as a real answer.
    if (input && S.shopFound && L.shopNorm(S.shopFound) === L.shopNorm(q)
        && S.shop[k] !== undefined && S.shop[k] !== '') {
      input.classList.add('looked');
    }
  });
  detail.appendChild(f);

  // Lookup, wishlist and bought: the three things you came here to do.
  // This row goes into its own block above the form rather than at the
  // bottom of it — inside the form, inside a collapsed fold, it was two
  // taps from a screen whose whole purpose it is.
  const lookRow = el('div', 'lookrow sheet');
  lookRow.style.padding = '9px 11px';
  const look = el('button', 'btn btn-sm', 'Look it up');
  look.id = 'shopLookBtn';
  const buy = el('button', 'btn btn-sm btn-gold', 'I bought it');
  const wanted = L.onWishlist(S.wish, q);
  const want = el('button', 'btn btn-sm', wanted ? 'On your wishlist' : 'Want it');
  want.dataset.on = wanted;
  want.onclick = () => {
    if (L.onWishlist(S.wish, q)) {
      S.wish = L.wishRemove(S.wish, q);
      save_(); renderShop(); toast('Off the wishlist');
      return;
    }
    // Record WHY. A name alone is a note to self; a name with a reason is
    // something you can act on standing in a shop.
    const unlocks = allFlights().filter(f =>
      (f.core || []).some(p => L.pourKind(p) === 'wish'
        && L.shopNorm(p.name) === L.shopNorm(q)));
    S.wish = L.wishAdd(S.wish, {
      name: L.typedName(q),
      est: parseFloat((f.querySelector('[name=\"msrp\"]') || {}).value) || null,
      forFlight: unlocks.length ? unlocks[0].title : null,
      reason: unlocks.length ? null : L.fitVerdict(L.shelfFit({
        name: q.trim(), sub: S.shop.sub,
        proof: parseFloat(S.shop.proof) || null
      }, S.catalog, S.bottles))
    });
    save_(); renderShop(); toast('Added to your wishlist');
  };
  const lookMsg = el('div', 'looknote');
  lookRow.appendChild(look);
  /* Where to get it, on the screen where you are deciding whether to.

     The bottle screen has carried this since 1.26.24 and this one did not,
     though it is the more obvious place: standing in a shop, the bottle
     may not be on the shelf in front of you, and the name is already
     typed. Same rule as everywhere else — L.findUrl — rather than a second
     way of building the same search. */
  const findUrl = L.findUrl(q, (S.shop || {}).dist || (cand || {}).dist);
  if (findUrl) {
    const find = el('button', 'btn btn-sm', 'Find it');
    find.title = 'Search for somewhere selling it';
    find.onclick = () => window.open(findUrl, '_blank', 'noopener');
    lookRow.appendChild(find);
  }
  lookRow.appendChild(want);
  lookRow.appendChild(buy);
  lookRow.appendChild(lookMsg);

  const applyRes = res => {
    L.lookupFilled(res).forEach(k => {
      const input = f.querySelector('[name="' + k + '"]');
      if (!input) return;
      // What YOU typed wins; what was merely seeded from a similar bottle
      // does not. A looked-up proof should replace a guess, not defer to it.
      if (input.value && !input.dataset.seeded) return;
      input.value = res[k];
      delete input.dataset.seeded;
      input.classList.add('looked');
    });
    lookMsg.className = 'looknote ok';
    // Not "your catalog" — that was true when there was one shelf and one
    // user. What it matched is the shared LIBRARY, which is everybody's,
    // unless it matched something only you have.
    // From what res already carries, not by looking it up a second time —
    // that call returns null on a miss and would have thrown here.
    lookMsg.textContent = res.source !== 'shelf'
      ? 'Looked up. Check it before you trust it.'
      : (res.k && S.base[res.k]
          ? 'Already in the library.' : 'Already on your shelf.');
    judge();
  };

  look.onclick = async () => {
    const fromShelf = L.lookupFromCatalog(q, S.catalog);
    if (fromShelf) { applyRes(fromShelf); return; }
    if (!S.lookupUrl) {
      lookMsg.className = 'looknote';
      lookMsg.textContent = 'Not on your shelf. Set up lookup in Settings, '
        + 'or fill the fields in yourself.';
      return;
    }
    look.disabled = true;
    lookMsg.className = 'looknote';
    lookMsg.textContent = 'Looking it up\u2026';
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 15000);
      if (navigator.onLine === false) throw new Error('you are offline');
      const r = await fetch(L.lookupUrl(S.lookupUrl, q.trim()), { signal: ctrl.signal });
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const res = L.parseLookup(await r.json());
      if (!res) throw new Error('nothing usable came back');
      applyRes(res);
    } catch (e) {
      lookMsg.className = 'looknote warn2';
      lookMsg.textContent = 'Lookup failed (' + e.message + ').';
    } finally {
      look.disabled = false;
    }
  };
  // The bottle view first, and the actions and form directly under its
  // name — not behind a fold at the bottom of the screen.
  const verdict = el('div');
  bottom.appendChild(verdict);

  const midBlock = el('div');
  midBlock.style.margin = '9px 0';
  midBlock.appendChild(lookRow);
  midBlock.appendChild(detail);
  function judge() {
    const vals = {};
    f.querySelectorAll('input,select').forEach(i => { vals[i.name] = i.value; });
    S.shop = Object.assign({}, vals, { name: q });
    // Age and region have no form row, so they live in shopExtra. They are
    // folded in here because the nearness axes measure them: without this,
    // An age and A region are two pills that can never do anything.
    const xt = (S.shopExtra && L.shopNorm(S.shopFound || '') === L.shopNorm(q))
      ? S.shopExtra : {};
    const cand = {
      name: q.trim(), dist: (vals.dist || '').trim(), sub: vals.sub,
      proof: parseFloat(vals.proof) || null, msrp: parseFloat(vals.msrp) || null,
      fin: (vals.fin || '').trim() || null, scar: vals.scar,
      age: xt.age || null, region: xt.region || null
    };
    verdict.innerHTML = '';
    // One destination, whether you typed the name or arrived from a
    // suggestion: what it is, whether to buy it and why, and what your
    // shelf already holds near it.
    const fit = shopBottleView(verdict, Object.assign({}, cand,
      { source: S.shopFound && L.shopNorm(S.shopFound) === L.shopNorm(q)
          ? 'lookup' : null,
        k: (L.lookupFromCatalog(q, S.catalog) || {}).k || null }), midBlock);

    buy.onclick = () => {
      const errs = L.validateProduct(Object.assign({ name: q }, vals));
      if (errs.length) {
        // A toast and nothing else. The form was behind a fold, so pressing
        // the gold button flashed "Proof is required." over a screen with no
        // proof field on it and the bottle was never added — which is why
        // BZ could not tell whether buying worked at all. Now the message
        // stays, and the field it means is focused.
        toast(errs[0]);
        lookMsg.className = 'looknote warn2';
        lookMsg.textContent = errs[0];
        const which = /proof/i.test(errs[0]) ? 'proof'
          : /price/i.test(errs[0]) ? 'msrp' : null;
        const bad = which && f.querySelector('[name="' + which + '"]');
        if (bad) { bad.classList.add('needed'); bad.focus(); }
        return;
      }
      if (fit.own) {
        askStatus(q.trim(), st => {
          S.bottles.push(L.newBottle(S.bottles, fit.own.key, st, cand.msrp));
          save_(); renderShelf(); renderHome(); renderShop();
          toast(st === 'sealed' ? 'Sealed spare added' : 'Added, open');
        });
        return;
      }
      // The form has rows for six fields; a shop page gives more than
      // that. Age, region, size, the bonded flag and the shop's own note
      // ride along rather than being read and then thrown away.
      const extra = (S.shopExtra && L.shopNorm(S.shopFound || '')
        === L.shopNorm(q)) ? S.shopExtra : {};
      const np = L.normalizeProduct(
        Object.assign({ name: L.typedName(q) }, vals, extra));
      if (S.catalog[np.k]) { toast('Already on the shelf'); return; }
      // Buying it is the end of wanting it.
      S.wish = L.wishRemove(S.wish, q);
      np.finc = np.fin ? 'stated' : null;
      // A bottle whose fields came from the lookup goes into the library
      // directly rather than into the approval queue: it has already been
      // searched for, checked against the name asked for, and range-checked.
      if (S.shopFound && L.shopNorm(S.shopFound) === L.shopNorm(q)) {
        np.src = Object.assign({}, np.src, { lookup: true });
        fbPublishToLibrary(np);
      }
      S.custom[np.k] = np;
      delete S.deleted[np.k];
      S.bottles.push(L.newBottle(S.bottles, np.k, 'open', cand.msrp));
      save_(); rebuildCatalog();
      renderShelf(); renderShelfFilters(); renderHome(); renderPayline();
      toast('Added to the shelf');
      showBottle(np.k);
    };
  }

  // Re-judge as you correct a field, so the verdict is never stale.
  f.querySelectorAll('input,select').forEach(i => {
    i.addEventListener('change', judge);
  });
  judge();
}

/* --- reference -------------------------------------------------------- */

function renderRefGroups() {
  const box = $('#refGroups'); box.innerHTML = '';
  L.REF_GROUPS.forEach(g => {
    const b = el('button', 'chip', g.label);
    b.setAttribute('aria-pressed', S.refGroup === g.id);
    b.onclick = () => { S.refGroup = g.id; renderReference(); };
    box.appendChild(b);
  });
}

function renderSettings() {
  const box = $('#settingsBody'); box.innerHTML = '';

  // Account: nothing to configure until sign-in exists, but the shape of the
  // page should not change when it does.
  const acct = el('div', 'sheet');
  const ah = el('div', 'hdr');
  ah.style.marginBottom = '6px';
  ah.appendChild(el('h3', null, 'Account'));
  const dot = el('span', 'syncdot');
  dot.id = 'syncDot';
  dot.dataset.status = FB.status;
  ah.appendChild(dot);
  acct.appendChild(ah);

  const MSG = {
    off: 'This shelf lives in this browser only. Sign in to keep it on your '
       + 'account and reach it from your phone as well.',
    connecting: 'Connecting\u2026',
    signedout: 'Signed out. This shelf lives in this browser only.',
    signedin: 'Signed in as ' + ((FB.user && FB.user.email) || '')
            + '. Loading your shelf\u2026',
    synced: 'Signed in as ' + ((FB.user && FB.user.email) || '')
          + '. Every change is saved to your account.',
    error: 'Sync problem: ' + (FB.detail || 'unknown')
  };
  acct.appendChild(el('div', 'sub', MSG[FB.status] || MSG.off));

  const iosStandalone = window.navigator.standalone === true;
  if (!FB.user && iosStandalone) {
    acct.appendChild(el('div', 'src',
      'You are running this from the home screen. If sign-in does not open '
      + 'a window, open bzrimsek.github.io/Bottle-Tracker in Safari, sign in '
      + 'there once, and come back \u2014 it stays signed in.'));
  }

  const arow = el('div', 'detail-acts');
  arow.style.marginTop = '9px';
  if (FB.user) {   // the user, not the status: a stalled read is still signed in
    const out = el('button', 'btn btn-sm ghost', 'Sign out');
    out.onclick = fbSignOut;
    arow.appendChild(out);
  } else {
    const inb = el('button', 'btn btn-sm btn-gold', 'Sign in with Google');
    inb.onclick = fbSignIn;
    arow.appendChild(inb);
  }
  acct.appendChild(arow);
  acct.appendChild(el('div', 'src',
    'Your shelf is stored under your own account id. Nobody else can read '
    + 'it, and sharing with a tasting buddy is a separate step you have not '
    + 'taken yet.'));
  box.appendChild(acct);

  // Only worth showing once there is an account for a name to belong to.
  if (FB.user) {
    box.appendChild(nameCard());
    const buddies = el('div', 'sheet');
    buddies.id = 'buddyCard';
    buddies.appendChild(el('h3', null, 'Tasting buddies'));
    buddies.appendChild(el('div', 'sub', 'Loading\u2026'));
    box.appendChild(buddies);
    renderBuddies();
  }

  // Your data, in a form you can take away.
  const data = el('div', 'sheet');
  data.appendChild(el('h3', null, 'Your data'));
  const st = L.shelfStats(S.catalog, S.bottles);
  data.appendChild(el('div', 'sub', st.bottles + ' bottles, '
    + st.products + ' whiskies, ' + S.history.length + ' logged entries, '
    + Object.keys(S.edits).length + ' of your own corrections.'));
  const row = el('div', 'detail-acts');
  row.style.marginTop = '9px';

  const exp = el('button', 'btn btn-sm', 'Export CSV');
  exp.onclick = () => {
    const rows = [L.TEMPLATE_COLS.join(',')];
    S.bottles.filter(L.isOwned).forEach(b => {
      const p = prod(b.k);
      if (!p) return;
      rows.push([p.name, p.dist || '', p.proof, p.sub, p.age || '', p.fin || '',
                 p.msrp || '', p.sec || '', b.paid || '', p.size || 750,
                 b.status, (p.notes || '').replace(/\n/g, ' ')]
        .map(c => /[",]/.test(String(c)) ? '"' + String(c).replace(/"/g, '""') + '"' : c)
        .join(','));
    });
    const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'killer-bs-shelf.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  row.appendChild(exp);

  const imp = el('button', 'btn btn-sm', 'Import');
  imp.onclick = importDialog;
  row.appendChild(imp);

  /* Everything, in one file. The CSV above is for spreadsheets and for
     other apps; this is the one that brings the shelf back. */
  const back = el('button', 'btn btn-sm', 'Back up everything');
  back.onclick = () => {
    const b = L.makeBackup(S, KEYS, Date.now());
    const blob = new Blob([JSON.stringify(b)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'killer-bs-backup-' + L.todayISO() + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    appLog('backed up ' + KEYS.length + ' keys to a file');
    toast('Backed up \u2014 keep it somewhere that is not this phone');
  };
  row.appendChild(back);

  const rest = el('button', 'btn btn-sm', 'Restore');
  rest.onclick = () => {
    const f = document.createElement('input');
    f.type = 'file';
    f.accept = 'application/json,.json';
    f.onchange = () => {
      const file = f.files && f.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        const read = L.readBackup(String(r.result), KEYS);
        if (!read.ok) { toast(read.why); return; }
        // Said in full before anything is replaced, because a restore
        // overwrites the shelf and there is no undo for it.
        confirmDelete('everything on this device, replaced by that backup'
          + (read.at ? ' from ' + new Date(read.at).toLocaleString() : '')
          + ' \u2014 ' + read.summary, () => {
          Object.keys(read.keys).forEach(k => { S[k] = read.keys[k]; });
          save_(); rebuildCatalog();
          renderShelf(); renderShelfFilters(); renderHome(); renderFlights();
          renderPayline(); renderSettings();
          appLog('restored from a backup: ' + read.summary);
          toast('Restored');
        });
      };
      r.readAsText(file);
    };
    f.click();
  };
  row.appendChild(rest);

  const reset = el('button', 'btn btn-sm ghost danger', 'Reset my changes');
  reset.onclick = () => confirmDelete('every change you have made', () => {
    // The shipped shelf is untouched by this: only the layers on top go.
    S.edits = {}; S.custom = {}; S.deleted = {}; S.customFlights = [];
    S.history = [];
    save_(); rebuildCatalog();
    renderShelf(); renderShelfFilters(); renderHome(); renderFlights();
    renderPayline(); renderSettings();
    toast('Back to the shipped shelf');
  });
  row.appendChild(reset);
  data.appendChild(row);
  box.appendChild(data);

  const about = el('div', 'sheet');
  about.appendChild(el('h3', null, 'About'));
  about.appendChild(el('div', 'sub',
    'Killer B\u2019s Bottle Tracker v' + APP_VERSION + ' \u00b7 built ' + BUILD_TIME));
  box.appendChild(about);

  // Last, because it is the least-used thing on the page: set once, then
  // never again.
  renderLookupSetup(box);
}

// How you appear to a tasting buddy, and whether you appear at all.
function nameCard() {
  const c = el('div', 'sheet');
  c.appendChild(el('h3', null, 'How others see you'));
  c.appendChild(el('div', 'sub',
    'A display name, not your email. This is what a tasting buddy picks from '
    + 'when sharing a shelf or setting up a pour.'));

  const inp = document.createElement('input');
  inp.className = 'field';
  inp.style.marginTop = '9px';
  inp.maxLength = L.NAME_MAX;
  inp.placeholder = L.suggestName(FB.user) || 'Your name';
  inp.value = S.displayName || '';
  c.appendChild(inp);

  const err = el('div', 'looknote');
  c.appendChild(err);

  // Off by default, and deliberately so. Turning it off removes the entry
  // rather than hiding it.
  const row = el('div', 'lookrow');
  row.style.marginTop = '9px';
  const toggle = el('button', 'chip',
    S.findable ? 'Others can find me' : 'Not findable');
  toggle.dataset.on = !!S.findable;
  toggle.onclick = () => {
    if (!S.findable && !L.cleanName(inp.value)) {
      err.className = 'looknote warn2';
      err.textContent = 'Set a name first.';
      return;
    }
    S.findable = !S.findable;
    save_();
    if (FB.user) {
    fbPublishName()
      .catch(e => appLog('your directory entry did not publish, so nobody '
        + 'can find you: ' + ((e && e.message) || e)));
  }
    renderSettings();
  };
  row.appendChild(toggle);

  const save = el('button', 'btn btn-sm btn-gold', 'Save name');
  save.onclick = () => {
    const problem = L.nameError(inp.value);
    if (problem) {
      err.className = 'looknote warn2';
      err.textContent = problem;
      return;
    }
    S.displayName = L.cleanName(inp.value);
    save_();
    if (FB.user) fbPublishName().catch(e => {
      err.className = 'looknote warn2';
      err.textContent = 'Could not publish: ' + (e.message || e);
    });
    err.className = 'looknote ok';
    err.textContent = 'Saved.';
    renderSettings();
  };
  row.appendChild(save);
  c.appendChild(row);

  c.appendChild(el('div', 'src', S.findable
    ? 'You are listed as ' + (S.displayName || '?') + '. The list holds your '
      + 'name and nothing else — not what you own, not how much of it. Being '
      + 'listed lets somebody send you a request; it does not let them see '
      + 'your shelf.'
    : 'You are not listed. Nobody can find you, and sharing would have to '
      + 'start from a code you send them.'));
  return c;
}

/* --- diagnostics -------------------------------------------------------
   Everything the app knows about its own state, in one place and copyable
   in one tap. Describing a fault from the outside has cost several rounds
   today; the app knows what happened and should be able to hand it over.   */

function diagReport() {
  const S_ = S || {};
  const g = (fn, fallback) => { try { return fn(); } catch (e) { return fallback; } };

  const lsBytes = g(() => {
    let n = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      n += k.length + (localStorage.getItem(k) || '').length;
    }
    return n;
  }, -1);

  return [
    ['Build', [
      ['version', APP_VERSION],
      ['built', BUILD_TIME],
      ['url', location.href.replace(/#.*$/, '')],
      ['standalone', String(g(() => window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true, '?'))],
      ['viewport', window.innerWidth + '\u00d7' + window.innerHeight],
      ['touch', String('ontouchstart' in window)],
      ['sign-in method', 'popup (redirect cannot work from GitHub Pages)']
    ]],
    ['Data', [
      ['products', String(Object.keys(S_.catalog || {}).length)],
      ['bottles', String((S_.bottles || []).length)],
      ['flights', String((S_.flights || []).length)],
      ['map loaded', String(!!MAPDATA)],
      ['catalogue stamp', String(fbCatalogStamp() || 'built-in')],
      ['pours logged', String((S_.history || []).filter(x => x.kind === 'pour').length)],
      ['flights run', String((S_.history || []).filter(x => x.kind === 'flight').length)],
      ['your edits', String(Object.keys(S_.edits || {}).length)],
      ['wishlist', String((S_.wish || []).length)],
      // A bottle whose whisky is not in the catalogue is invisible: the
      // shelf lists products and skips any with no bottles, so a bottle
      // pointing at a missing key is on nobody's screen. That is what a
      // half-applied sync leaves behind, and it took a round of guessing
      // to find the first one.
      ['bottles with no whisky', String(L.orphanBottles(
        S_.bottles, S_.catalog).length)],
      ['last local change', String(S_.updated || 0)]
    ]],
    ['Account', [
      ['sdk loaded', String(FB.ready)],
      ['status', FB.status],
      ['signed in as', (FB.user && FB.user.email) || 'nobody'],
      ['user id', (FB.user && FB.user.uid) || '\u2014'],
      ['first read done', String(FB.loaded)],
      ['display name', S_.displayName || '(none)'],
      ['findable', String(!!S_.findable)],
      ['detail', FB.detail || '(none)'],
      ['shared with me', String(Object.keys(SHARED.shelves || {}).length)]
    ]],
    ['Storage', [
      ['localStorage bytes', lsBytes < 0 ? 'unavailable' : String(lsBytes)],
      ['signed-in flag', g(() => localStorage.getItem('kb_signedin'), '?') || '(unset)'],
      ['service worker', String(g(() => !!navigator.serviceWorker.controller, false))],
      ['lookup endpoint', S_.lookupUrl ? 'configured' : '(none)']
    ]],
    ['What sign-in did', FBLOG.length
      ? FBLOG.map(l => ['', l]) : [['', '(nothing yet)']]],
    /* What the app did, and what came back.

       appLog has been writing this to storage since it was added and
       nothing has ever shown it. Every failure this week — a lookup that
       errored, a lookup that answered with half a note, a push that never
       came back — wrote its reason here and then had to be chased by
       reading code instead, or by asking somebody to open a browser
       console, which is not a thing anybody should be asked to open.

       Newest first, because the thing you want is what happened just
       before it broke. */
    ['What the app did', (S_.log || []).length
      ? (S_.log || []).slice(0, 40).map(l => ['', l])
      : [['', '(nothing yet)']]]
  ];
}

// Who is using this, on what version, and whether they have got anywhere.
// Empty rather than an error for a non-admin: a message they cannot act on
// is noise.
function renderUsers(box) {
  const card = el('div', 'sheet');
  card.appendChild(el('h3', null, 'Everybody'));
  card.appendChild(el('div', 'sub', FB.user ? 'Loading\u2026' : 'Sign in first.'));
  box.appendChild(card);
  if (!FB.user) return;

  fbStatsRef().once('value').then(snap => {
    const rows = [];
    snap.forEach(c => rows.push(Object.assign({ uid: c.key }, c.val() || {})));
    card.innerHTML = '';
    card.appendChild(el('h3', null, 'Everybody'));
    if (!rows.length) {
      card.appendChild(el('div', 'sub', 'Nobody has reported yet.'));
      return;
    }
    rows.sort((a, b) => (b.at || 0) - (a.at || 0));
    const stale = rows.filter(r => r.version !== APP_VERSION).length;
    card.appendChild(el('div', 'sub', rows.length + ' '
      + (rows.length === 1 ? 'person' : 'people')
      + (stale ? ', ' + stale + ' on an older version' : ', all current')
      + '. Counts only.'));

    rows.forEach(r => {
      const item = el('div', 'item');
      const left = el('div');
      const nm = el('div', 'nm', r.name || '(no name)');
      if (r.uid === FB.user.uid) nm.appendChild(el('span', 'pourtag blend', 'you'));
      if (r.version !== APP_VERSION) {
        nm.appendChild(el('span', 'pourtag wish', 'v' + (r.version || '?')));
      }
      left.appendChild(nm);
      left.appendChild(el('div', 'sub',
        [r.bottles + ' bottles', r.open + ' open', r.pours + ' pours',
         r.flights + ' flights'].join(' \u00b7 ')));
      if (r.suspended) nm.appendChild(el('span', 'pourtag wish', 'suspended'));
      left.appendChild(el('div', 'src', 'last seen ' + L.ago(r.at)
        + (r.findable ? ' \u00b7 findable' : ' \u00b7 not findable')));
      item.appendChild(left);
      item.appendChild(el('div', 'pf', String(r.products || 0)));
      card.appendChild(item);

      // Managing them, not just looking at them.
      if (r.uid !== FB.user.uid) {
        const acts = el('div', 'lookrow');
        acts.style.marginBottom = '10px';
        const sus = el('button', 'chip',
          r.suspended ? 'Restore access' : 'Suspend');
        sus.dataset.on = !r.suspended;
        sus.onclick = () => fbSetSuspended(r.uid, !r.suspended)
          .then(() => renderDiag())
          .catch(e => toast(e.message || String(e)));
        acts.appendChild(sus);
        // An admin cannot clear somebody's shelf: the rules forbid writing
        // another person's node, and that is right. What he can do is flag
        // it, so they are asked plainly on their next open rather than in a
        // message somewhere they may not read.
        if (r.bottles === SHIPPED_SHELF_COUNT) {
          const fix = el('button', 'chip', 'Flag inherited shelf');
          fix.onclick = () => fbStatsRef().child(r.uid).child('inherited')
            .set(true)
            .then(() => { toast('Flagged'); renderDiag(); })
            .catch(e => toast(e.message || String(e)));
          acts.appendChild(fix);
        }

        const rm = el('button', 'chip', 'Remove');
        rm.onclick = () => confirmDelete(
          (r.name || 'this user') + ' from the list', () =>
          fbRemoveUser(r.uid).then(() => renderDiag()));
        acts.appendChild(rm);
        card.appendChild(acts);
        card.appendChild(el('div', 'src',
          'Removing takes them off this list only. Their whisky is in their '
          + 'own account and cannot be reached from here, and they reappear '
          + 'when they next sign in.'));
      }
    });
  }).catch(() => {
    card.innerHTML = '';
    card.appendChild(el('h3', null, 'Everybody'));
    card.appendChild(el('div', 'sub',
      'Not an admin. Add your user id under bz-apps/whisky/admins in the '
      + 'Firebase console \u2014 your id is in Account below.'));
  });
}

// What people have added that the library does not have. Held rather than
// merged: one person's typo becoming everybody's is the thing to avoid, and
// a queue somebody works through is the cheap way to avoid it.
function renderContrib(box) {
  const card = el('div', 'sheet');
  card.appendChild(el('h3', null, 'Offered to the library'));
  card.appendChild(el('div', 'sub', 'Loading\u2026'));
  box.appendChild(card);
  if (!FB.user) return;

  fbContribRef().once('value').then(snap => {
    const rows = [];
    snap.forEach(who => {
      who.forEach(c => {
        const v = c.val() || {};
        if (v.name) rows.push({ uid: who.key, slug: c.key, entry: v });
      });
    });
    card.innerHTML = '';
    card.appendChild(el('h3', null, 'Offered to the library'));
    if (!rows.length) {
      card.appendChild(el('div', 'sub', 'Nothing waiting.'));
      return;
    }
    card.appendChild(el('div', 'sub', rows.length + ' offered. Accepting adds '
      + 'to the shared library everybody reads; it never overwrites a '
      + 'product already in it.'));

    rows.slice(0, 30).forEach(r => {
      // Judged against the LIBRARY, which is the same everywhere, and not
      // against S.base, which is whatever this device has merged so far.
      const merged = L.mergeContribution(LIB.products || {}, r.entry);
      const item = el('div', 'item');
      const left = el('div');
      left.appendChild(el('div', 'nm', r.entry.name));
      left.appendChild(el('div', 'sub',
        [r.entry.dist, r.entry.proof ? r.entry.proof + ' proof' : null,
         r.entry.fin].filter(Boolean).join(' \u00b7 ')));
      // Your own offers are the commonest ones here, since every fill-in
      // publishes, and "from somebody" for your own shelf reads as a
      // stranger sending you your own bottles.
      const mine = FB.user && r.uid === FB.user.uid;
      left.appendChild(el('div', 'src',
        'from ' + (mine ? 'you' : (r.entry.by || 'somebody'))
        + (merged.ok ? '' : ' \u00b7 ' + merged.why)));
      item.appendChild(left);

      /* Two buttons, always both, never one whose label flips.

         This was a single chip reading Accept or Drop depending on a
         verdict computed from local state — so the same row offered
         opposite actions on two devices, and neither said what the other
         one was. Add and Drop are different things and both are always
         available; the verdict now only decides which is suggested. */
      const acts = el('div');
      acts.style.cssText = 'display:flex;gap:6px;align-items:center';
      const drop = el('button', 'chip', '\u00d7 Drop');
      const act = el('button', 'chip', '\u002b Add');
      act.dataset.on = merged.ok;
      act.disabled = !merged.ok;
      if (!merged.ok) act.style.opacity = '.45';
      drop.onclick = () => {
        fbContribRef().child(r.uid).child(r.slug).remove()
          .then(() => { renderLibraryScreen(); fbBadgeContrib(); });
      };
      act.onclick = () => {
        // The library moved to its own screen; this still redrew
        // Diagnostics, so accepting appeared to do nothing at all.
        const done = () => fbContribRef().child(r.uid).child(r.slug).remove()
          .then(() => {
            LIB.products = null;      // re-read, it has changed
            renderLibraryScreen();
            fbBadgeContrib();
          });
        // One node, one write. The old shape read the whole library back,
        // appended, and wrote it all again — 354 KB down and up to add one
        // bottle, and every device re-downloading the lot afterwards.
        const key = L.libKey(merged.product.name);
        // What you know about it goes in with it, so accepting does not
        // immediately queue the same bottle for publishing.
        const full = L.enrichContribution(merged.product,
          (S.catalog || {})[merged.product.name]
          || (S.catalog || {})[key] || null);
        firebase.database().ref('bz-apps/whisky/shared')
          .update({ ['catalog/products/' + key]:
                      Object.assign({}, full, { at: Date.now() }),
                    stamp: Date.now() })
          .then(done)
          .catch(e => toast(e.message || String(e)));
      };
      acts.appendChild(act);
      acts.appendChild(drop);
      /* Back on the row, beside the bottle they act on.
         They were moved out to their own line because the .item grid's
         second column is 48px on a phone — one chip's worth — so two of
         them ran off the right of the screen and took the page width, and
         the nav, with them. That was the fixed track, not the arrangement:
         a row placed straight into a card now gets minmax(0,1fr) auto, so
         the controls size to themselves and the name shrinks instead. */
      item.appendChild(acts);
      card.appendChild(item);
    });
  }).catch(() => {
    card.innerHTML = '';
    card.appendChild(el('h3', null, 'Offered to the library'));
    card.appendChild(el('div', 'sub', 'Not an admin.'));
  });
}

/* --- managing the library ---------------------------------------------
   Browse it, search it, fix an entry, remove one. Without this, a wrong
   entry accepted once was permanent, which is a poor property for the
   thing everybody reads.                                                 */

const LIB = { products: null, q: '', admin: false, sub: null };

// Are you an admin? Read once, and treated as no when the read fails —
// which is what a non-admin's read does, so a failure and a no are the same
// answer and neither is an error worth showing.
function fbCheckAdmin() {
  if (!FB.user) { LIB.admin = false; return Promise.resolve(false); }
  return firebase.database().ref('bz-apps/whisky/admins')
    .child(FB.user.uid).once('value')
    .then(s => { LIB.admin = s.val() === true; return LIB.admin; })
    .catch(() => { LIB.admin = false; return false; });
}

/* --- publishing a batch of corrections --------------------------------

   An Import JSON in the Firebase console REPLACES everything at the path.
   That is the right tool for seeding an empty library and the wrong one
   the moment anybody else is using it: a contribution accepted since, or a
   correction somebody made in the editor, is destroyed without a word.

   This writes named products only. Nine corrections is nine writes and
   everything else is untouched — additive by construction rather than by
   remembering to be careful.                                              */

function publishBatch(products, after) {
  if (!products || !products.length) { toast('Nothing to publish'); return; }
  if (!LIB.admin) { toast('Only an admin can publish'); return; }

  const built = L.publishWrite(products, Date.now());
  const names = built.names;
  if (!names.length) { toast('Nothing usable to publish'); return; }

  firebase.database().ref('bz-apps/whisky/shared')
    .update(L.fbEncodePaths(built.updates))
    .then(() => {
      appLog('library: published ' + names.length);
      LIB.products = null;
      toast(names.length + ' published to the library');
      if (after) after();
    })
    .catch(e => toast('Failed: ' + (e.message || e)));
}

// What on this shelf differs from the library, so a batch can be reviewed
// before it is sent rather than trusted.
function pendingForLibrary() {
  return L.pendingForLibrary(S.catalog, LIB.products || {});
}

// Reviewed before it is sent. A batch you cannot see is a batch you cannot
// refuse, and publishing is the one action here that reaches everybody.
function reviewBatch(pend, after) {
  const chosen = {};
  pend.forEach((x, i) => { chosen[i] = true; });
  openModal('Publish to the library', m => {
    /* Overwrites first and open; additions behind a summary.

       Thirty rows all reading "nothing to something" is a rubber stamp,
       and a rubber stamp trains you to press the button without reading —
       which is the one thing this screen exists to prevent. Nothing here
       is hidden: the additions are counted, listed on request, and marked
       publish like everything else. They are just not what the reading is
       for. */
    const split = L.pendingSplit(pend);
    m.appendChild(el('div', 'sub',
      pend.length + ' differ from the library'
      + (split.changes.length
          ? ' \u2014 ' + split.changes.length
            + (split.changes.length === 1 ? ' replaces a value that is'
                                          : ' replace values that are')
            + ' already there, the rest fill blanks.'
          : ', all of them filling blanks the library has nothing in.')
      + ' Publishing writes only these \u2014 anything else in the library, '
      + 'including what other people have added, is untouched.'));
    const list = el('div', 'recent');
    list.style.marginTop = '9px';

    // The additions get their own box, closed, so the list you land on is
    // the list worth reading.
    let addBox = null;
    if (split.adds.length && split.changes.length) {
      const det = el('details', 'gapmore');
      const sum = el('summary');
      sum.textContent = split.adds.length + ' filling blanks';
      det.appendChild(sum);
      addBox = el('div', 'recent');
      det.appendChild(addBox);
      list.appendChild(det);
    }
    const isAdd = {};
    split.adds.forEach(x => { isAdd[pend.indexOf(x)] = true; });

    pend.forEach((x, i) => {
      const r = el('button', 'item');
      const left = el('div');
