   pours behind — so cleaning up a run that got logged twice would remove
   the row you can see and keep the six under it.

   One pour per key, because that is what the run logged. A bottle poured
   again the same evening on its own is a separate fact and stays. */
L.histDropRun = function (history, i) {
  const list = (history || []).slice();
  if (!(i >= 0) || i >= list.length) return { list: list, entry: null, also: [] };
  const entry = list[i];
  if (entry.kind !== 'flight') {
    list.splice(i, 1);
    return { list: list, entry: entry, also: [] };
  }
  const want = {};
  (entry.pours || []).forEach(k => { want[k] = (want[k] || 0) + 1; });
  const also = [];
  const keep = [];
  list.forEach((x, at) => {
    if (at === i) return;
    if (x.kind === 'pour' && x.at === entry.at && want[x.k] > 0) {
      want[x.k] -= 1;
      also.push({ at: at, entry: x });
      return;
    }
    keep.push(x);
  });
  return { list: keep, entry: entry, also: also };
};

// Put a removed run back, the flight and its pours together, so Undo undoes
// the whole of what the X did.
L.histRestoreRun = function (history, i, entry, also) {
  let list = L.histRestore(history, i, entry);
  (also || []).forEach(x => { list = L.histRestore(list, x.at, x.entry); });
  return list;
};

/* Was this flight already logged today?

   Pressing Poured it twice — because the first press appeared to fail — is
   exactly how Peat Is a Postcode reached the log twice. Not a block: a
   flight CAN be run twice in a day. A question, once, so the second one is
   a decision rather than an accident. */
L.alreadyRun = function (history, title, when) {
  return (history || []).some(x => x.kind === 'flight'
    && x.flight === title && x.at === when);
};

L.histRestore = function (history, i, entry) {
  const list = (history || []).slice();
  if (!entry) return list;
  const at = Math.max(0, Math.min(i, list.length));
  list.splice(at, 0, entry);
  return list;
};

/* --- add / edit / delete -------------------------------------------- */

// The shared catalog is reference data. A user's corrections, additions and
// removals are layered on top, so nothing the app ships with is ever
// destroyed -- deleting a stock product hides it for you alone.
/* What a remote copy is allowed to do to a local one, per key.

   Taking the remote wholesale threw away a twenty-minute run. `edits` is a
   MAP keyed by product: 161 bottles had a real tasting note written into
   it locally, the account had not caught up, and the next load did
   S.edits = remote.edits and every one of them was gone. The bottles were
   back to their flight prompts and the queue was back to 201.

   A keyed map merges: remote wins on a key both sides have, and a key only
   one side has survives. That is the same rule dismissals and barcodes
   already got, for the same reason — a device with older state must not
   silently undo work done on another one.

   Lists do not merge, because a list has an order and a length that mean
   something, and two shelves interleaved is not a shelf. */
/* Which copy wins when a device signs in and the account already holds a
   shelf.

   This went wrong in the worst way it could. bottles, history and
   customFlights are not in SYNC_MERGE, and mergeSyncValue returns the
   REMOTE copy for those — unconditionally, whatever their ages. A bottle
   bought and a pour added on this device, with the push still in flight or
   failed, were replaced by the account's older arrays on the next load. The
   whisky itself survived, because `custom` merges and the library lives on
   the server; the BOTTLE and the flight pour did not, which is why the
   shelf lost a bottle it had just gained while the library kept the entry.

   The rule: the newer copy wins, and where the ages cannot be compared the
   remote wins as before. Local only holds when it is provably newer, which
   is exactly the case that was losing work. Deletions still travel — a
   device that removes a bottle and pushes it is newer, so its copy is the
   one that lands. */
// A bottle whose whisky is not in the catalogue. It cannot appear anywhere:
// the shelf iterates PRODUCTS and skips those with no bottles, so a bottle
// with no product is on no screen at all and the counts do not mention it.
L.orphanBottles = function (bottles, catalog) {
  const cat = catalog || {};
  return (bottles || []).filter(b => L.isOwned(b) && !cat[b.k]);
};

// Which of these keys differ from what was last written to the account.
//
// fbPush sent the WHOLE payload on every save, and on BZ's shelf that is at
// least 189KB — 31KB of bottles and 161KB of custom flights — re-sent when a
// pour is logged, a favourite is starred, or a bottle is bought. The push
// for his purchase never came back inside twenty seconds, and the log line
// "fb push did not come back in 20s" is that write, still in flight, while
// the shelf carried on. Pouring a dram should not re-upload thirty-six
// flights.
/* Firebase will not accept a key holding . # $ / [ or ] — and this app keys
   edits, custom, deleted, favs and deadGaps by the PRODUCT NAME. "Elmer T.
   Lee Single Barrel Bourbon" has two full stops in it, so every push of
   those maps was refused outright:

     set failed: value argument contains an invalid key
     (Elmer T. Lee Single Barrel Bourbon) in property '...edits'

   That is the root of the whole week of sync trouble. The write never
   landed, the account stayed behind, and a later load handed back the older
   copy — which is how a bought bottle and a flight pour disappeared. It was
   invisible until the SDK was fetched with crossorigin, because before that
   every one of these arrived as the bare string "Script error."

   Escaped on the way up, restored on the way down. The escape character is
   escaped first, so the transform is reversible for any name at all.

   Firebase also refuses undefined anywhere in a payload, which the flight
   log hit separately. Both are stripped in one pass here, because a payload
   that cannot be written is a payload that loses work silently. */
L.FB_ESCAPES = { '~': '~t', '.': '~d', '#': '~h', '$': '~s',
                 '/': '~f', '[': '~o', ']': '~c' };
L.FB_UNESCAPES = { t: '~', d: '.', h: '#', s: '$', f: '/', o: '[', c: ']' };

L.fbKey = function (k) {
  return String(k).replace(/[~.#$/[\]]/g, ch => L.FB_ESCAPES[ch]);
};

L.unFbKey = function (k) {
  return String(k).replace(/~([tdhsfoc])/g, (m, c) => L.FB_UNESCAPES[c]);
};

// Deep, both directions, and it drops undefined on the way up. An array
// keeps its shape; only object KEYS are touched.
L.fbEncode = function (v) {
  if (Array.isArray(v)) {
    /* null as well as undefined. The bad run record is already SAVED: an
       undefined in an array becomes null the moment localStorage round-trips
       it, and Firebase reads a null inside a list as "delete this index", so
       the run would come back a pour short. Dropping it here means the
       record already on the device can be written at all. */
    return v.filter(x => x !== undefined && x !== null).map(L.fbEncode);
  }
  if (v && typeof v === 'object') {
    const out = {};
    Object.keys(v).forEach(k => {
      if (v[k] === undefined) return;
      out[L.fbKey(k)] = L.fbEncode(v[k]);
    });
    return out;
  }
  return v;
};

L.fbDecode = function (v) {
  if (Array.isArray(v)) return v.map(L.fbDecode);
  if (v && typeof v === 'object') {
    const out = {};
    Object.keys(v).forEach(k => { out[L.unFbKey(k)] = L.fbDecode(v[k]); });
    return out;
  }
  return v;
};

/* One signature for "is this the same data", used by every side of the
   comparison.

   JSON.stringify is key-ORDER sensitive, and the merge keys are built with
   Object.assign(local, remote) — same content, different order. So edits,
   wish, deadGaps and proposals compared unequal to the copy just read and
   pushed 61KB on every load, for ever, with nothing in them changed.

   Object keys sorted; arrays left alone, because their order is the data
   for bottles and history. Three call sites share this deliberately: a
   signature written by one rule and read by another is how this file has
   found six faults in a week. */
L.syncSig = function (v) {
  if (v === undefined) return undefined;
  const norm = x => {
    if (Array.isArray(x)) return x.map(norm);
    if (x && typeof x === 'object') {
      const out = {};
      Object.keys(x).sort().forEach(k => { out[k] = norm(x[k]); });
      return out;
    }
    return x;
  };
  return JSON.stringify(norm(v));
};

/* What the account demonstrably already holds.

   Seeded after a first load so the push that follows sends the DIFFERENCE
   rather than the shelf. A key whose local value is identical to the one
   just read is on the account by definition; a key that was merged, or
   kept because this device was newer, is not — and those are exactly the
   ones that have to go up. */
// Firebase cannot STORE an empty list or an empty map: write [] and the key
// is simply absent afterwards. So an empty wishlist never matched the
// account that had nothing there, and 179 bytes of [] went up on every load
// for ever — the same shape as the 61KB above, three orders smaller.
L.isEmptyValue = function (v) {
  if (v === undefined || v === null) return true;
  if (Array.isArray(v)) return v.length === 0;
  if (typeof v === 'object') return Object.keys(v).length === 0;
  return false;
};

L.pushedFromRemote = function (keys, state, remote) {
  const r = remote || {};
  const out = {};
  (keys || []).forEach(k => {
    const mine = L.syncSig((state || {})[k]);
    if (mine === undefined) return;
    // Empty here and absent there is not a difference the account can hold.
    if (L.isEmptyValue((state || {})[k]) && L.isEmptyValue(r[k])) {
      out[k] = mine;
      return;
    }
    if (mine === L.syncSig(r[k])) out[k] = mine;
  });
  return out;
};

/* A map key writes only the entries that changed.

   edits, custom, deleted, favs, deadGaps and upcs are MAPS, and Firebase
   treats each as one child: correcting the proof of one bottle rewrote the
   whole edits map, 61KB, because that is the child the write names. Naming
   the entries instead — edits/<key> — sends the one that moved.

   A removed entry is written as null, which is exactly how Firebase deletes
   a child, and is the one place in this file where a null is the point
   rather than a hazard. Arrays are left whole: bottles and history are
   ordered lists, and addressing them by index is how a concurrent write
   turns into a shuffled shelf. */
L.MAP_KEYS = ['edits', 'custom', 'deleted', 'favs', 'deadGaps', 'upcs'];

L.mapDelta = function (key, next, prevJson) {
  if (L.MAP_KEYS.indexOf(key) < 0) return null;
  const now = next || {};
  if (Array.isArray(now)) return null;
  let before;
  try { before = prevJson ? JSON.parse(prevJson) : null; } catch (e) { before = null; }
  // Nothing to diff against: send the map whole, as before.
  if (!before || typeof before !== 'object' || Array.isArray(before)) return null;
  const out = {};
  Object.keys(now).forEach(k => {
    if (L.syncSig(now[k]) !== L.syncSig(before[k])) out[key + '/' + L.fbKey(k)] = now[k];
  });
  Object.keys(before).forEach(k => {
    if (!(k in now)) out[key + '/' + L.fbKey(k)] = null;
  });
  return out;
};

/* An update whose keys are PATHS.

   Firebase's update() takes "a/b/c" as a path to a child. fbEncode escapes
   every key it meets, so running it over such a payload turns the slashes
   into ~f and writes ONE child called "catalog~fproducts~fweller_12" at the
   top of the node. The write succeeds, the app says "2 published to the
   library", and the library never receives anything.

   That is exactly what happened to the publish button that would not clear:
   publish 1, told it worked, still says publish 1, for ever.

   Each SEGMENT is escaped, because a segment is a key and a bottle name can
   hold a full stop. The separators are left alone, because they are the
   only reason update() knows where to write. Values are encoded as usual.
   Written once and used by all three callers, rather than a fourth copy of
   a rule this file has already been bitten by twice. */
L.fbEncodePaths = function (updates) {
  const out = {};
  Object.keys(updates || {}).forEach(k => {
    const path = String(k).split('/').map(L.fbKey).join('/');
    out[path] = updates[k] === null ? null : L.fbEncode(updates[k]);
  });
  return out;
};

/* What is worth OFFERING, given what has already been offered.

   fbContribute rebuilt the same payload on every save_ and wrote it
   unconditionally: "offered 3 to the library" six times in thirty seconds
   in BZ's log. So accepting the three removed them from the queue and the
   next save put them straight back, for ever — "I accept, and they come
   back every build."

   Two things had to change. The comparison, which did not exist; and the
   stamp, because `at: Date.now()` made every payload different from the
   last one, so no comparison could have worked either. The signature is
   the entry WITHOUT its timestamp — the same reason the account push sends
   the stamp the device carries rather than the moment of the write. */
L.contribSig = function (entry) {
  const e = Object.assign({}, entry || {});
  delete e.at;
  delete e.by;
  return L.syncSig(e);
};

L.contribDelta = function (entries, sent) {
  const was = sent || {};
  const send = {}, sigs = {};
  Object.keys(entries || {}).forEach(slug => {
    const sig = L.contribSig(entries[slug]);
    sigs[slug] = sig;
    if (was[slug] !== sig) send[slug] = entries[slug];
  });
  return { send: send, sigs: sigs };
};

L.changedKeys = function (keys, state, pushed) {
  const was = pushed || {};
  return (keys || []).filter(k => L.syncSig((state || {})[k]) !== was[k]);
};

L.syncDecision = function (localUpdated, remoteUpdated) {
  const l = typeof localUpdated === 'number' ? localUpdated : 0;
  const r = typeof remoteUpdated === 'number' ? remoteUpdated : 0;
  if (!l) return 'remote';           // this device has never saved
  if (!r) return 'remote';           // the account predates the stamp
  return l > r ? 'local' : 'remote';
};

L.SYNC_MERGE = ['deadGaps', 'favs', 'upcs', 'edits', 'custom', 'proposals',
  'askStats'];

L.mergeSyncValue = function (key, local, remote) {
  if (remote === undefined || remote === null) return local;
  if (L.SYNC_MERGE.indexOf(key) < 0) return remote;
  if (Array.isArray(remote) || Array.isArray(local)) return remote;
  return Object.assign({}, local || {}, remote);
};

L.mergeCatalog = function (base, edits, custom, deleted) {
  const out = {};
  Object.keys(base || {}).forEach(k => {
    if (deleted && deleted[k]) return;
    out[k] = (edits && edits[k]) ? Object.assign({}, base[k], edits[k]) : base[k];
  });
  Object.keys(custom || {}).forEach(k => {
    if (deleted && deleted[k]) return;
    out[k] = (edits && edits[k]) ? Object.assign({}, custom[k], edits[k]) : custom[k];
  });
  return out;
};


// Reject what cannot be stored rather than storing a broken record. Name and
// proof are the identity; everything else can be filled in later.
L.validateProduct = function (f) {
  const errs = [];
  const name = (f.name || '').trim();
  if (name.length < 2) errs.push('Name is required.');
  const proof = parseFloat(f.proof);
  if (!(proof > 0)) errs.push('Proof is required.');
  else if (proof < 20 || proof > 200) errs.push('Proof must be between 20 and 200.');
  if (f.msrp !== '' && f.msrp !== undefined && f.msrp !== null
      && isNaN(parseFloat(f.msrp))) errs.push('Price must be a number.');
  if (f.age !== '' && f.age !== undefined && f.age !== null && f.age !== '') {
    const a = parseFloat(f.age);
    if (isNaN(a) || a < 1 || a > 80) errs.push('Age must be 1 to 80 years, or blank.');
  }
  return errs;
};

// A finish names a wood or a wine. A bare year, a proof or a batch number
// is not one, and letting one through produced the finding "a finish you do
// not have: 2021" from a bottle called Longrow 18 — 2021 Release.
/* Anything a model returns can carry citation markup, and nothing was
   stripping it — so a cask field reached the screen reading
   'A finish you do not have: [cite index=2-5]Long and dry with butterscotch
   flavours[/cite]'. Stripped in one place that every lookup value passes
   through, because the next field to carry it will be a different one. */
L.stripMarkup = function (v) {
  if (typeof v !== 'string') return v;
  return v.replace(/<\/?cite[^>]*>/gi, '')
          .replace(/<[^>]+>/g, '')
          .replace(/\s{2,}/g, ' ')
          .trim();
};

L.cleanFinish = function (v) {
  const s = L.stripMarkup(String(v == null ? '' : v).trim());
  if (!s) return null;
  if (!/[a-z]{3}/i.test(s)) return null;             // no word in it at all
  if (/^\s*(19|20)\d\d\s*$/.test(s)) return null;     // a year
  // A cask is a NAME, not a sentence. That butterscotch line is a tasting
  // note that arrived in the finish field, and keeping it made the app
  // announce a cask by that name which BZ did not own.
  const words = s.split(/\s+/).filter(Boolean);
  if (words.length > 5) return null;
  if (/\b(and|with|of|notes?|flavou?rs?)\b/i.test(s) && words.length > 2) {
    return null;
  }
  return s.slice(0, 80);
};

// Guess a category from the name when nothing supplied one. Silently
// defaulting to bourbon turned a Longrow 18 — a peated Campbeltown malt —
// into a bourbon, which is worse than leaving it blank: a blank invites a
// correction, a confident wrong answer does not.
L.SCOTCH_HOUSES = ['springbank', 'longrow', 'kilkerran', 'hazelburn',
  'ardbeg', 'lagavulin', 'laphroaig', 'bowmore', 'bruichladdich', 'octomore',
  'caol ila', 'talisker', 'oban', 'glenlivet', 'glenfiddich', 'macallan',
  'aberlour', 'balvenie', 'glenmorangie', 'highland park', 'dalmore',
  'glendronach', 'benriach', 'bunnahabhain', 'ledaig', 'tobermory',
  'craigellachie', 'glen scotia', 'clynelish', 'bladnoch', 'auchentoshan',
  'glenkinchie', 'arran', 'raasay', 'kilchoman', 'glenfarclas', 'mortlach'];

L.IRISH_HOUSES = ['redbreast', 'jameson', 'powers', 'teeling', 'bushmills',
  'midleton', 'green spot', 'yellow spot', 'gold spot', 'tullamore',
  'kilbeggan', 'tyrconnell', 'connemara', 'writers tears', 'waterford',
  'knappogue', 'boann', 'dingle', 'limavady'];

L.guessSub = function (name, dist) {
  const t = ((name || '') + ' ' + (dist || '')).toLowerCase();
  const has = w => t.indexOf(w) >= 0;
  if (has('tequila') || has('anejo') || has('reposado')) return 'tequila';
  if (has('bourbon')) return 'bourbon';
  if (has('tennessee')) return 'tennessee';
  if (has('rye')) return 'rye';
  if (has('scotch') || has('islay') || has('speyside') || has('campbeltown')
      || has('highland') || has('lowland')
      || L.SCOTCH_HOUSES.some(has)) return 'scotch';
  if (has('irish') || has('pot still')
      || L.IRISH_HOUSES.some(has)) return 'irish';
  if (has('canadian')) return 'canadian';
  if (has('japanese') || has('nikka') || has('yamazaki') || has('hakushu')
      || has('hibiki') || has('suntory')) return 'japanese';
  if (has('single malt')) return 'american single malt';
  if (has('wheat')) return 'wheat';
  return null;
};

// Proof in tens, built from what is actually on the shelf. The filter was
// reusing the slot machine's four bands — up to 90, 90 to 105, 105 to 120,
// 120 plus — which are the right shape for a reel that has to fit four
// faces and far too coarse for choosing something to drink: 148 bottles in
// one band is not a filter.
L.proofTens = function (catalog, bottles) {
  const counts = {};
  Object.values(catalog || {}).forEach(p => {
    if (!p.proof || !L.ownedCount(p.k, bottles || [])) return;
    const lo = Math.floor(p.proof / 10) * 10;
    counts[lo] = (counts[lo] || 0) + 1;
  });
  // Only the bands with something in them: an empty range is a chip
  // somebody can press to see nothing.
  return Object.keys(counts).map(Number).sort((a, b) => a - b)
    .map(lo => ['p' + lo, lo + '\u2013' + (lo + 9), counts[lo]]);
};

L.proofInTen = function (band, proof) {
  const lo = parseInt(String(band).replace(/^p/, ''), 10);
  if (!lo && lo !== 0) return false;
  return proof >= lo && proof < lo + 10;
};

/* A number, or nothing — never NaN.

   parseFloat('n/a') is NaN, and NaN stored in proof or msrp is worse than a
   blank: it sorts unpredictably, compares false against itself, renders as
   nothing in particular, and travels to the shared library where everybody
   gets it. Fifteen of the eighteen parseFloat calls in this file had no
   guard; the three that mattered — the ones whose result is SAVED — go
   through here. */
L.toNum = function (v) {
  if (v === '' || v === undefined || v === null) return null;
  const n = typeof v === 'number' ? v : parseFloat(v);
  return isFinite(n) ? n : null;
};

L.normalizeProduct = function (f) {
  const num = L.toNum;
  const p = {
    k: (f.k || '').trim() || (f.name || '').trim(),
    name: (f.name || '').trim(),
    dist: (f.dist || '').trim(),
    proof: L.toNum(f.proof),
    // A guess from the name beats a default, and a null beats a wrong
    // guess: the form shows it as unset and asks rather than asserting.
    sub: (f.sub || L.guessSub(f.name, f.dist) || '').trim(),
    style: (f.style || '').trim(),
    age: num(f.age), msrp: num(f.msrp), sec: num(f.sec),
    fin: L.cleanFinish(f.fin),
    obsc: f.obsc || 'known', scar: f.scar || 'standard',
    size: num(f.size) || 750
  };
  p.wine = p.fin ? L.finIsWine(p.fin) : null;
  return p;
};

// Same wood-versus-wine split the enrichment pass uses, so a hand-typed
// finish classifies the way an imported one does.
L.WOOD_ONLY = ['Toasted Oak', 'French Oak', 'Virgin Oak', 'Mizunara',
               'Hungarian Oak', 'Chinkapin Oak', 'American Oak', 'Amburana'];
L.UNKNOWN_CASK = ['Multi-cask', 'STR'];
L.finIsWine = function (fin) {
  if (!fin) return null;
  const parts = String(fin).split('+').map(s => s.trim()).filter(Boolean);
  if (!parts.length) return null;
  if (parts.every(p => L.UNKNOWN_CASK.indexOf(p) >= 0)) return null;
  return parts.some(p => L.WOOD_ONLY.indexOf(p) < 0 && L.UNKNOWN_CASK.indexOf(p) < 0);
};

// Bottle ids must not collide with the shipped B001..B344 range.
// The day a bottle showed up, which is the only acquisition date there is:
// nothing in the Only Drams export carried one, and the 344 that came in
// through the audit all arrived at once. Written at every site that creates
// a bottle, through one helper, because five sites is five chances to forget.
/* How a bottle is named to the person who owns it.

   The id is a filing key: B199 is where the app keeps it, not something on
   the shelf with a number on the side. Open or sealed is the thing you
   actually want to know, the day it arrived is what tells two apart, and
   the count is what tells you WHICH of two you are looking at. */
L.bottleLabel = function (b, i, total) {
  if (!b) return '';
  const bits = [L.titleCase(b.status || 'open')];
  if (total > 1) bits.unshift('Bottle ' + (i + 1) + ' of ' + total);
  if (b.got) bits.push('added ' + b.got);
  return bits.join(' \u00b7 ');
};

L.newBottle = function (bottles, k, status, paid, when) {
  return { id: L.nextBottleId(bottles), k: k,
           status: status, paid: (paid === undefined ? null : paid),
           got: when || L.today() };
};

L.today = function () {
  return new Date().toISOString().slice(0, 10);
};

L.nextBottleId = function (bottles) {
  let max = 0;
  (bottles || []).forEach(b => {
    const m = /^B(\d+)$/.exec(b.id || '');
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return 'B' + String(max + 1).padStart(3, '0');
};

// A product cannot be deleted while bottles of it remain -- that would strand
// them. Retire the bottles first.
L.canDeleteProduct = function (key, bottles) {
  return !(bottles || []).some(b => b.k === key && L.isOwned(b));
};

/* --- notes ----------------------------------------------------------- */

// Everything the app knows about one bottle, gathered from every source it
// came from, plus whatever the user has written. Each note carries its
// origin so a producer fact never gets confused with a tasting impression.
// The distiller's tasting notes: colour, nose, palate, finish. Kept apart
// from the provenance notes because they are a different kind of fact --
// these are what the bottle tastes like, not where it came from.
L.TN_ORDER = ['colour', 'nose', 'palate', 'finish'];

// Where a tasting note came from. Kept on the record because a note you
// wrote, a note lifted off your own flight card and a note sourced from a
// producer are three different levels of trust, and a blank is more useful
// than a plausible invention.
// Three levels, and the first one is weaker than it looks: the flight-card
// notes were WRITTEN FOR the cards as prompts to guide a taster, not taken
// from a producer. They are a starting point, not a source. Saying so is the
// difference between a useful note and one that quietly poses as fact.
L.TN_SOURCES = {
  card:      'written for the flight card \u2014 a prompt, not a source',
  distiller: "the producer's own notes",
  you:       'your own tasting'
};

L.tastingNotes = function (p) {
  if (!p || !p.tn) return [];
  return L.TN_ORDER.filter(k => p.tn[k])
    .map(k => ({ label: L.titleCase(k), text: p.tn[k] }));
};

L.tnSource = function (p) {
  if (!p || !p.tn) return null;
  if (p.tnSrc && L.TN_SOURCES[p.tnSrc]) return L.TN_SOURCES[p.tnSrc];
  // A comparative note needs the comparison, not a caveat. "Deeper fruit,
  // fuller, drier" — than what? It was written beside five other Aberlours
  // and says nothing on its own, and calling it a prompt does not fix that.
  // 37 of the 185 card notes read this way.
  const COMPARATIVE = /\b(deeper|fuller|drier|sweeter|richer|lighter|softer|sharper|thinner|rounder|more|less)\b/i;
  const tnText = p.tn
    ? [p.tn.nose, p.tn.palate, p.tn.finish].filter(Boolean).join(' ') : '';
  return p.tnFrom
    ? (COMPARATIVE.test(tnText)
        ? 'Written beside the other pours in ' + L.sentenceCase(p.tnFrom)
          + ' \u2014 the comparisons are to those, not to whisky in general'
        : 'Written for the ' + L.sentenceCase(p.tnFrom)
          + ' card \u2014 a prompt, not a source')
    : null;
};

L.notesFor = function (p, flights, userNote) {
  const out = [];
  if (!p) return out;
  if (p.notes) out.push({ src: 'inventory', text: p.notes });
  if (p.msrpNote) out.push({ src: 'price', text: p.msrpNote });
  if (p.fin) {
    out.push({ src: 'cask',
      text: p.fin.split('+').join(', ')
            + (p.wine === true ? ' \u2014 a wine cask'
             : p.wine === false ? ' \u2014 wood only, no wine' : '') });
  }
  if (p.region) out.push({ src: 'region', text: p.region });
  // The flight cards carry a line of host prose per pour; surface the ones
  // that mention this bottle.
  (flights || []).forEach(f => {
    const i = (f.core || []).findIndex(x => x.k === p.k);
    if (i < 0) return;
    const card = (f.cards || [])[i];
    if (card && card.wood) out.push({ src: f.title.toLowerCase(), text: card.wood });
  });
  if (userNote) out.push({ src: 'you', text: userNote });
  return out;
};

/* --- flight builder --------------------------------------------------- */

// Give it a variable and a premise; it proposes pours off the shelf.
//
// The whole design follows one rule BZ arrived at the hard way: a flight
// works when the room can TASTE the answer. So the builder scores candidates
// on whether they separate along the stated variable, holds everything else
// as still as it can, and refuses to reach for a bottle that is not open.

L.VARIABLES = [
  { id: 'proof',   label: 'Proof',            hint: 'same everything, strength climbs' },
  { id: 'finish',  label: 'The cask',         hint: 'one spirit, several finishes' },
  { id: 'region',  label: 'Place',            hint: 'one category, several regions' },
  { id: 'house',   label: 'The house',        hint: 'one distillery, its whole range' },
  { id: 'age',     label: 'Age',              hint: 'one house, years apart' },
  { id: 'grain',   label: 'Grain',            hint: 'one distillery, different mashbills' },
  { id: 'price',   label: 'Price',            hint: 'cheap against dear, proof held' }
];

// What the variable reads off a bottle. A candidate with no value here
// cannot take part, because it cannot sit anywhere on the axis.
L.axisOf = function (varId, p) {
  switch (varId) {
    case 'proof':  return p.proof || null;
    case 'finish': return p.fin || null;
    case 'region': return p.region || p.sub || null;
    case 'house':  return p.fin || p.style || p.name || null;
    case 'age':    return p.age || null;
    case 'grain':  return p.sub || null;
    case 'price':  return L.priceBand(p.msrp) || null;
    default:       return null;
  }
};

// What has to stay STILL for that variable to be readable. Change two things
// and the flight answers neither.
L.holdsFor = function (varId) {
  return {
    proof:  ['dist'],
    finish: ['dist'],
    region: ['sub'],
    house:  ['dist'],
    age:    ['dist'],
    grain:  ['dist'],
    price:  ['sub']
  }[varId] || [];
};

// Every group of open bottles that could carry the variable, best first.
// A group is a set that agrees on the held fields and differs on the axis.
/* What can be added to a flight, split into the ones that suit it and the
   rest — both in alphabetical order.

   The picker offered every open bottle on the shelf in ASCENDING PROOF, so
   326 rows arrived in an order that reads as no order at all and finding a
   named bottle meant scrolling the lot. Two things fix it: sort by name,
   and lead with the ones that actually belong in this flight.

   "Belongs" is not a new judgment. axisOf already says whether a bottle can
   be placed on the flight's variable at all — a bottle with no age cannot
   sit in an age flight — and recastFlight already treats a cast that is
   uniform in a field as part of the design, which is what stops an all-rye
   flight being offered a Scotch. Both are reused rather than restated; a
   second copy of this rule is how six faults happened in one week.

   Nothing is removed from the list. The rest are still there, below, because
   a flight that breaks its own rule on purpose is a flight BZ builds. */
L.pourOptions = function (f, catalog, bottles) {
  const cat = catalog || {};
  const varId = L.variableOfId(f);
  const core = (f && f.core) || [];
  const taken = {};
  core.forEach(p => { if (p && p.k) taken[p.k] = true; });

  // Where the cast already agrees on a type, that agreement travels.
  const cast = core.map(p => cat[p.k]).filter(Boolean);
  const subs = new Set(cast.map(p => p.sub).filter(Boolean));
  const held = (subs.size === 1 && cast.length >= 3) ? [...subs][0] : null;

  const openNow = L.openKeys(bottles);
  const open = Object.values(cat)
    .filter(p => !taken[p.k] && openNow[p.k] && !p.drained);
  const byName = (a, b) => (a.name || '').localeCompare(b.name || '');
  const suits = p => varId
    ? (L.axisOf(varId, p) !== null && (!held || p.sub === held))
    : false;

  return {
    variable: varId,
    held: held,
    fits: open.filter(suits).sort(byName),
    rest: open.filter(p => !suits(p)).sort(byName)
  };
};

L.flightCandidates = function (varId, catalog, bottles, opts) {
  const o = opts || {};
  const size = o.size || L.CORE_TARGET;
  const holds = L.holdsFor(varId);
  const openNow = L.openKeys(bottles);
  const pool = Object.values(catalog).filter(p =>
    openNow[p.k] && !p.drained && L.axisOf(varId, p) !== null
    && (!o.sub || p.sub === o.sub));

  // Bucket by whatever must be held still.
  const groups = {};
  pool.forEach(p => {
    const key = holds.length ? holds.map(f => p[f] || '?').join('|') : 'all';
    (groups[key] = groups[key] || []).push(p);
  });

  const out = [];
  Object.keys(groups).forEach(key => {
    const members = groups[key];
    // Distinct positions on the axis is the whole point: six bottles that
    // all read the same are not a flight.
    const axes = new Set(members.map(p => String(L.axisOf(varId, p))));
    if (axes.size < 3) return;
    const picked = L.pickSpread(varId, members, size);
    if (picked.length < 4) return;
    out.push({
      key: key, holds: holds, pours: picked,
      spread: new Set(picked.map(p => String(L.axisOf(varId, p)))).size,
      score: L.flightScore(varId, picked)
    });
  });
  out.sort((a, b) => b.score - a.score);
  return out;
};

// Choose a spread along the axis rather than the first N. For a numeric
// variable that means even steps; for a categorical one, one of each.
L.pickSpread = function (varId, members, size) {
  const numeric = varId === 'proof' || varId === 'age';
  if (numeric) {
    const sorted = members.slice().sort((a, b) =>
      L.axisOf(varId, a) - L.axisOf(varId, b));
    if (sorted.length <= size) return sorted;
    const out = [];
    for (let i = 0; i < size; i++) {
      out.push(sorted[Math.round(i * (sorted.length - 1) / (size - 1))]);
    }
    return out.filter((p, i, a) => a.indexOf(p) === i);
  }
  // Categorical: one per value, the most interesting first, then fill.
  const byVal = {};
  members.forEach(p => {
    const v = String(L.axisOf(varId, p));
    (byVal[v] = byVal[v] || []).push(p);
  });
  const rank = p => (p.obsc === 'obscure' ? 2 : p.obsc === 'niche' ? 1 : 0);
  const vals = Object.keys(byVal);
  vals.forEach(v => byVal[v].sort((a, b) => rank(b) - rank(a) || a.proof - b.proof));

  // One of each value first, so the axis is covered before anything is
  // doubled up. Then keep going round, taking a second of each, until the
  // flight is full -- otherwise a three-value axis yields three pours and
  // fails the floor.
  const out = [];
  for (let round = 0; out.length < size; round++) {
    let took = 0;
    vals.forEach(v => {
      if (out.length >= size) return;
      const p = byVal[v][round];
      if (p) { out.push(p); took++; }
    });
    if (!took) break;
  }
  out.sort((a, b) => a.proof - b.proof);
  return out.slice(0, size);
};

// How good a flight this set would make, by the rules BZ actually uses.
L.flightScore = function (varId, pours) {
  if (!pours.length) return 0;
  let s = 0;
  const axes = pours.map(p => String(L.axisOf(varId, p)));
  s += new Set(axes).size * 12;                       // spread along the axis

  const proofs = pours.map(p => p.proof);
  let ascends = true;
  for (let i = 1; i < proofs.length; i++) if (proofs[i] < proofs[i - 1]) ascends = false;
  if (ascends) s += 15;

  // A matched pair at the same proof is the strongest shape there is.
  for (let i = 0; i < pours.length; i++) {
    for (let j = i + 1; j < pours.length; j++) {
      if (Math.abs(pours[i].proof - pours[j].proof) <= 0.5
          && axes[i] !== axes[j]) { s += 20; }
    }
  }
  if (pours.some(p => p.obsc === 'obscure')) s += 18;   // the build rule
  else if (pours.some(p => p.obsc === 'niche')) s += 6;
  if (pours.length === L.CORE_TARGET) s += 10;

  // For a proof flight the range has to be worth tasting; for the others a
  // wide proof range is noise on top of the variable.
  const range = Math.max.apply(null, proofs) - Math.min.apply(null, proofs);
  if (varId === 'proof') s += Math.min(range, 40) / 2;
  else s -= Math.min(range, 60) / 4;
  return Math.round(s);
};

// The one to buy. Something not on the shelf that would extend the axis
// further than anything open can — the gap the collection cannot fill.
L.suggestPurchase = function (varId, pours, catalog, bottles) {
  const have = new Set(pours.map(p => p.k));
  const axes = new Set(pours.map(p => String(L.axisOf(varId, p))));
  const holds = L.holdsFor(varId);
  const ref = pours[0] || {};

  const candidates = Object.values(catalog).filter(p => {
    if (have.has(p.k)) return false;
    if (L.axisOf(varId, p) === null) return false;
    // Must sit in the same held context, or it changes two things.
    if (!holds.every(f => (p[f] || '?') === (ref[f] || '?'))) return false;
    return !axes.has(String(L.axisOf(varId, p)));
  });

  // Prefer something you already own but cannot pour: opening a sealed
  // spare costs nothing.
  const sealed = candidates.filter(p => L.ownedCount(p.k, bottles) > 0);
  if (sealed.length) {
    return { p: sealed[0], why: 'You own this already, sealed. Open it and the '
      + 'flight gains ' + L.axisLabel(varId, sealed[0]) + '.', own: true };
  }
  if (!candidates.length) return null;
  candidates.sort((a, b) => (a.msrp || 9999) - (b.msrp || 9999));
  const pick = candidates[0];
  return { p: pick, why: 'Not on the shelf. It would add '
    + L.axisLabel(varId, pick) + ', which nothing open covers.', own: false };
};

L.axisLabel = function (varId, p) {
  const v = L.axisOf(varId, p);
  if (varId === 'proof') return v + ' proof';
  if (varId === 'age') return v + ' years';
  if (varId === 'price') return L.titleCase(String(v));
  return String(v);
};

// The whole proposal, ready to render or to turn into a flight.
L.buildFlight = function (varId, premise, catalog, bottles, opts) {
  const cands = L.flightCandidates(varId, catalog, bottles, opts);
  if (!cands.length) {
    return { ok: false,
      why: 'Nothing open holds still enough for that variable. Try another, '
        + 'or open a few sealed bottles.' };
  }
  const best = cands[0];
  const pours = L.sortByProof(best.pours.map(p => ({ k: p.k })), catalog);
  const full = pours.map(x => catalog[x.k]);
  return {
    ok: true, variable: varId, premise: premise || '',
    holds: best.holds, held: best.key,
    pours: pours, score: best.score,
    notes: L.validate(pours, catalog, { bottles: bottles }),
    buy: L.suggestPurchase(varId, full, catalog, bottles),
    alternatives: cands.length - 1
  };
};


/* --- AI-assisted flight design ---------------------------------------- */

// What the model is allowed to see: the open shelf, compactly. Sending the
// whole catalog would include sealed bottles it must not reach for.
L.flightPayload = function (catalog, bottles) {
  return Object.values(catalog)
    .filter(p => L.pourable(p.k, bottles) && !p.drained)
    .map(p => {
      // Null fields are dropped rather than sent: 325 bottles of "f":null is
      // a third of the payload and tells the model nothing.
      const o = { n: p.name, pf: p.proof, t: p.sub, o: p.obsc };
      if (p.dist) o.d = p.dist;
      if (p.fin) o.f = p.fin;
      if (p.region) o.r = p.region;
      if (p.age) o.a = p.age;
      if (p.msrp) o.pr = p.msrp;
      return o;
    });
};

// The house rules, sent with every request so the model designs to the same
// standard the validators check against.
L.FLIGHT_RULES = [
  'One variable per flight. Everything else is held as still as the shelf allows.',
  'Six core pours unless there is a reason for another number.',
  'Proof ascends across the flight unless you say why it does not.',
  'At least one pour the room will not recognise.',
  'A matched pair at the same proof differing in one perceptible way is the '
    + 'strongest shape available; use one where the shelf allows.',
  'The answer must be TASTEABLE. Reject a variable whose answer has to be told '
    + 'rather than tasted, such as who owns a distillery or how it was allocated.',
  'Reject a production mechanism with no flavour signature of its own, such as '
    + 'cask size or the shape of the still.',
  'Use only bottles from the shelf provided. Never invent one.'
];

// Anything the model returns is a proposal, not a fact. Every pour has to
// resolve to a bottle that is actually open, or it is dropped and reported.
// This is the whole safety story: a name that does not exist cannot be poured.
// How close a returned name must be before it counts as a real bottle.
// High on purpose: a false accept pours something that does not exist, a
// false reject only shortens the flight and says so.
L.PROPOSAL_MATCH = 0.75;

L.verifyProposal = function (raw, catalog, bottles) {
  if (!raw || typeof raw !== 'object') {
    return { ok: false, why: 'Nothing usable came back.' };
  }
  const str = (v, n) => typeof v === 'string' ? v.trim().slice(0, n) : '';
  const out = { ok: true, pours: [], rejected: [],
                title: str(raw.title, 60), premise: str(raw.premise, 400),
                variable: str(raw.variable, 60), why: [], buy: null };
  if (Array.isArray(raw.why)) {
    out.why = raw.why.filter(x => typeof x === 'string')
      .map(x => x.trim().slice(0, 300)).slice(0, 6);
  }

  const byName = {};
  Object.values(catalog).forEach(p => { byName[L.shopNorm(p.name)] = p; });
  const seen = {};

  (Array.isArray(raw.pours) ? raw.pours : []).forEach(x => {
    const name = typeof x === 'string' ? x : (x && (x.name || x.k));
    if (!name) return;
    // Exact first. The fuzzy fallback is deliberately strict: the model is
    // told to copy names character for character, and a loose match turns an
    // invented bottle into a real one -- "Completely Invented Whisky 12"
    // scored a match on the token "12" before this threshold existed.
    let hit = byName[L.shopNorm(name)];
    if (!hit) {
      // A one-token name is not evidence: "Bourbon 12" reduces to "12",
      // which scores a perfect match against anything with 12 in it. Two
      // meaningful tokens minimum before a fuzzy match is allowed at all.
      const tokens = L.shopNorm(name).split(' ').filter(Boolean);
      if (tokens.length >= 2) {
        const near = L.shopSearch(name, catalog, 1)[0];
        if (near && near.score >= L.PROPOSAL_MATCH) hit = near.p;
      }
    }
    if (!hit) { out.rejected.push({ name: String(name), why: 'not on the shelf' }); return; }
    if (seen[hit.k]) { out.rejected.push({ name: hit.name, why: 'listed twice' }); return; }
    if (!L.pourable(hit.k, bottles)) {
      out.rejected.push({ name: hit.name, why: 'not open' }); return;
    }
    seen[hit.k] = true;
    out.pours.push({ k: hit.k,
      note: (x && typeof x.note === 'string') ? x.note.trim().slice(0, 200) : null });
  });

  if (raw.buy && (raw.buy.name || typeof raw.buy === 'string')) {
    const bn = raw.buy.name || raw.buy;
    // A purchase suggestion is meant to be something you do not own, so it is
    // not checked against the shelf -- only trimmed, and labelled if it turns
    // out you already have it.
    out.buy = { name: String(bn).trim().slice(0, 80),
                why: str(raw.buy.why, 300),
                onShelf: !!byName[L.shopNorm(bn)] };
  }

  if (out.pours.length < 3) {
    return { ok: false, rejected: out.rejected,
      why: 'Only ' + out.pours.length + ' of the suggested pours are open on '
        + 'your shelf.' };
  }
  out.pours = L.sortByProof(out.pours, catalog);
  out.notes = L.validate(out.pours, catalog, { bottles: bottles });
  return out;
};

L.flightRequestBody = function (varLabel, premise, catalog, bottles) {
  return { mode: 'flight', variable: varLabel, premise: premise,
           rules: L.FLIGHT_RULES, shelf: L.flightPayload(catalog, bottles) };
};


/* --- flight editing -------------------------------------------------- */

L.newFlight = function (title) {
  return { title: (title || 'NEW FLIGHT').toUpperCase(), tag: '', premise: '',
           why: [], core: [], ext: [], cards: [], custom: true };
};

// Pour letters are positional: removing pour C makes the old D into C, so
// they are always relabelled from the current order rather than stored.
L.relabel = function (pours) {
  return (pours || []).map((p, i) => Object.assign({}, p, {
    letter: String.fromCharCode(65 + i), ord: i + 1 }));
};

L.addPour = function (pours, key) {
  return L.relabel((pours || []).concat([{ k: key, role: 'core' }]));
};

L.removePour = function (pours, idx) {
  const out = (pours || []).slice();
  out.splice(idx, 1);
  return L.relabel(out);
};

L.movePour = function (pours, idx, delta) {
  const out = (pours || []).slice();
  const to = idx + delta;
  if (to < 0 || to >= out.length) return L.relabel(out);
  const [x] = out.splice(idx, 1);
  out.splice(to, 0, x);
  return L.relabel(out);
};

// Order the pours by ascending proof -- the house rule, applied in one call.
L.sortByProof = function (pours, catalog) {
  const out = (pours || []).slice().sort((a, b) => {
    const pa = catalog[a.k], pb = catalog[b.k];
    return ((pa && pa.proof) || 0) - ((pb && pb.proof) || 0);
  });
  return L.relabel(out);
};

/* --- the host's line per pour ----------------------------------------- */

// f.cards is the host's copy of a flight: one line of prose per pour, and
// the only place a flight says anything about a particular bottle. It shows
// on the bottle view sourced to the flight, on the host card, and it is what
// the ladder reads to decide a pour is SPOTTED.
//
// Nothing could write one. Worse, Save flight rebuilt cards wholesale from
// the catalogue -- wood came from pd.fin -- so a line written by hand lasted
// until the next save. These two functions are the pair that fixes it, and
// they are a pair on purpose: the line has to be ON the pour while the
// editor is reordering, or Sort by proof leaves every note under the wrong
// whisky. foldNotes puts it there, cardsFrom writes it back out.
//
// An empty string is a cleared line and is kept as one; undefined means the
// pour has never been through the editor, and only then does the cask fall
// back in. Same distinction as the Firebase tombstone: absent and empty are
// not the same answer.
L.foldNotes = function (core, cards) {
  const c = cards || [];
  return (core || []).map((p, i) => Object.assign({}, p, {
    note: p.note === undefined ? ((c[i] || {}).wood || '') : p.note
  }));
};

L.cardsFrom = function (core, catalog) {
  const cat = catalog || {};
  return (core || []).map((p, i) => ({
    letter: p.letter || String.fromCharCode(65 + i),
    // pourLabel and pourProof already know what a wish and a blend are.
    // The inline version this replaces read pd.name off the catalogue, so
    // saving a flight blanked the name of every pour that was not a bottle
    // on the shelf.
    bottle: L.pourLabel(p, cat),
    proof: L.pourProof(p, cat) || '',
    wood: p.note === undefined ? ((cat[p.k] || {}).fin || '') : p.note
  }));
};

/* --- pours that are not a bottle on the shelf ------------------------- */

// A flight pour is one of three things, and only the first was ever
// modelled. The other two were silently dropped on import, which is why
// Who's Your Daddy? reads as a three-pour flight and QA reports it short
// on every run.
//
//   shelf  a bottle you own          { k: 'Weller 12' }
//   wish   one you do not, yet       { kind: 'wish', name: 'Pappy 15' }
//   blend  made from ones you own    { kind: 'blend', name: "Poor Man's
//                                      Pappy", parts: ['Weller 12', ...] }
//
// The blend is the interesting one: Poor Man's Pappy is Weller 12 and
// Weller Antique 107 in equal parts, so that pour is available tonight even
// though no bottle of it exists.


L.pourKind = function (p) {
  if (!p) return 'shelf';
  if (p.kind === 'wish' || p.kind === 'blend') return p.kind;
  return 'shelf';
};

// Can this pour actually be poured tonight? A blend can, if every part is
// open. A wish cannot, by definition.
L.pourAvailable = function (p, catalog, bottles) {
  const kind = L.pourKind(p);
  if (kind === 'wish') return false;
  if (kind === 'blend') {
    return (p.parts || []).length > 0
      && p.parts.every(k => catalog[k] && L.pourable(k, bottles));
  }
  return !!(catalog[p.k] && L.pourable(p.k, bottles));
};

// What to call it on a card or a ladder.
L.pourLabel = function (p, catalog) {
  const kind = L.pourKind(p);
  if (kind === 'shelf') return (catalog[p.k] || {}).name || p.k || '';
  return p.name || '';
};

// A blend's proof is the average of its parts, weighted by their share.
// Equal parts of 90 and 107 is 98.5, and the ladder should place it there
// rather than treating it as unknown.
L.blendProof = function (p, catalog) {
  const parts = (p.parts || []).map(k => catalog[k]).filter(Boolean);
  if (!parts.length) return null;
  const w = p.ratio && p.ratio.length === parts.length
    ? p.ratio : parts.map(() => 1);
  const total = w.reduce((a, b) => a + b, 0);
  if (!total) return null;
  const sum = parts.reduce((a, pd, i) => a + pd.proof * w[i], 0);
  return Math.round((sum / total) * 10) / 10;
};

L.pourProof = function (p, catalog) {
  const kind = L.pourKind(p);
  if (kind === 'blend') return L.blendProof(p, catalog);
  if (kind === 'wish') return p.proof || null;
  return (catalog[p.k] || {}).proof || null;
};

/* --- running a flight again ------------------------------------------- */

// A flight is a template; the six bottles are one CAST of it. Sherry Is Not
// One Thing should be runnable next year with different pours and still be
// the same flight — the same question asked of a different shelf.
//
// The history already stores each run's cast, so this is mostly a matter of
// reading what has been poured and proposing something that is not that.

L.flightRuns = function (f, history) {
  return (history || [])
    .filter(x => x.kind === 'flight' && x.flight === f.title)
    .slice()
    .sort((a, b) => (a.at || '').localeCompare(b.at || ''))
    .map((x, i) => ({ run: i + 1, at: x.at, pours: x.pours || [] }));
};

// Every bottle this flight has ever used, so a re-cast can avoid repeating
// itself. Repeating one pour is fine and sometimes right — a control you
// keep — but repeating all six is just running it again.
/* --- what you drink, against what you own ---------------------------- */

/* The shelf says what BZ bought. The log says what he actually reaches
   for, and the two are different questions the app had never put side by
   side — 344 bottles and a pour log, and nothing compared them.

   It matters for buying: a category owned deeply and poured rarely is not
   a gap however thin it looks, and one poured constantly off a narrow
   shelf is a gap however many bottles are nearby.

   Shares are of the TOTAL each side, so a shelf of 344 and a log of 30 can
   be compared at all. A category is only called over- or under-poured when
   there is enough of it to mean something: one pour of one bottle is an
   evening, not a pattern. */
L.MIN_POURS_TO_JUDGE = 6;

L.drinkingVsShelf = function (catalog, bottles, history) {
  const cat = catalog || {};
  const owned = {}, poured = {};
  let ownTotal = 0, pourTotal = 0;

  (bottles || []).forEach(b => {
    if (!L.isOwned(b)) return;
    const sub = (cat[b.k] || {}).sub;
    if (!sub) return;
    owned[sub] = (owned[sub] || 0) + 1;
    ownTotal++;
  });
  (history || []).forEach(x => {
    if (!x || x.kind !== 'pour') return;
    const sub = (cat[x.k] || {}).sub;
    if (!sub) return;
    poured[sub] = (poured[sub] || 0) + 1;
    pourTotal++;
  });
  if (!ownTotal || !pourTotal) return [];

  return Object.keys(owned).map(sub => {
    const shelf = owned[sub] / ownTotal;
    const glass = (poured[sub] || 0) / pourTotal;
    return {
      sub: sub,
      bottles: owned[sub],
      pours: poured[sub] || 0,
      shelfShare: shelf,
      pourShare: glass,
      // Positive: you reach for it more than you stock it.
      gap: glass - shelf
    };
  }).sort((a, b) => b.gap - a.gap);
};

/* The sentence worth saying, or none.

   Only where the log is long enough to carry an opinion, and only for a
   difference big enough to act on — a category five points off its shelf
   share is noise on 30 pours. */
L.drinkingFinding = function (rows, pourTotal) {
  if (!rows || !rows.length || (pourTotal || 0) < L.MIN_POURS_TO_JUDGE) return null;
  const top = rows[0], bottom = rows[rows.length - 1];
  const pc = n => Math.round(n * 100);
  /* The two directions need different evidence.

     OVER-poured is a claim about the POURS: seven evenings out of eight
     from two bottles is a pattern about those two bottles, and requiring a
     deep shelf before saying so would miss the case where somebody drinks
     one thing constantly off a narrow shelf — which is the case worth
     knowing.

     UNDER-poured is a claim about the SHELF: it only means anything when
     there is a lot of it. Eight bottles poured twice says something;
     one bottle poured never says nothing at all. */
  if (top.gap >= 0.15 && top.pours >= 3) {
    return { kind: 'over', sub: top.sub, row: top,
             text: L.titleCase(top.sub) + ' is ' + pc(top.pourShare)
               + '% of what you pour and ' + pc(top.shelfShare)
               + '% of what you own.' };
  }
  if (bottom.gap <= -0.15 && bottom.bottles >= 8) {
    return { kind: 'under', sub: bottom.sub, row: bottom,
             text: L.titleCase(bottom.sub) + ' is ' + pc(bottom.shelfShare)
               + '% of the shelf and ' + pc(bottom.pourShare)
               + '% of what you pour.' };
  }
  return null;
};

/* --- the bottles you keep having ------------------------------------- */

/* A second bottle is a stronger statement than a star.

   BZ's own stocking rule: he buys a backup of anything he wants to keep
   having, so a whisky he owns more than one of is one he has decided not
   to run out of. The star is aspirational and gets set once; a backup is
   revealed preference and costs money.

   Retired bottles count. Having bought the same whisky three times and
   finished two of them is the strongest version of this signal, and
   counting only what is on the shelf right now would erase it. */
L.keepers = function (catalog, bottles) {
  const cat = catalog || {};
  const seen = {};
  (bottles || []).forEach(b => {
    if (!b || !b.k) return;
    const r = seen[b.k] || (seen[b.k] = { k: b.k, total: 0, here: 0, gone: 0 });
    r.total++;
    if (L.isOwned(b)) r.here++; else r.gone++;
  });
  return Object.values(seen)
    .filter(r => r.total > 1)
    .map(r => Object.assign(r, { name: (cat[r.k] || {}).name || r.k,
                                 sub: (cat[r.k] || {}).sub || null }))
    .sort((a, b) => b.total - a.total
      || (a.name || '').localeCompare(b.name || ''));
};

L.pouredBefore = function (f, history) {
  const seen = {};
  L.flightRuns(f, history).forEach(r => {
    (r.pours || []).forEach(k => { if (k) seen[k] = (seen[k] || 0) + 1; });
  });
  return seen;
};

// Propose a fresh cast for the same variable, from what is open now.
//
// It reuses the local recommender rather than inventing a second one, then
// pushes bottles used in a previous run toward the back — so the new cast
// answers the same question with different whisky wherever the shelf allows.
L.recastFlight = function (f, catalog, bottles, history, opts) {
  const o = opts || {};
  const varId = o.variable || L.variableOfId(f);
  if (!varId) {
    return { ok: false, why: 'This flight does not state a single variable, '
      + 'so there is nothing to hold still while re-casting it.' };
  }
  const used = L.pouredBefore(f, history);

  // A re-cast must keep the flight's OWN constraints, not just its variable.
  // Sherry Is Not One Thing is all Scotch and no smoke; holding only "the
  // cask" still produced five Irish Spots, which is a fine flight and a
  // different one. Where the existing cast is uniform in a field, that
  // uniformity is part of the design and travels with it.
  const cast = (f.core || []).map(p => catalog[p.k]).filter(Boolean);
  const uniform = field => {
    const vals = new Set(cast.map(p => p[field]).filter(Boolean));
    return vals.size === 1 && cast.length >= 3 ? [...vals][0] : null;
  };
  const opts2 = Object.assign({}, o);
  if (!opts2.sub) opts2.sub = uniform('sub');

  const cands = L.flightCandidates(varId, catalog, bottles, opts2);
  if (!cands.length) {
    return { ok: false, why: 'Nothing open holds still enough for '
      + varId + ' right now.' };
  }

  // Prefer the grouping that reuses least.
  const scored = cands.map(c => {
    const repeats = c.pours.filter(p => used[p.k]).length;
    return { c: c, repeats: repeats, score: c.score - repeats * 25 };
  }).sort((a, b) => b.score - a.score);

  const best = scored[0].c;
  const pours = L.sortByProof(best.pours.map(p => ({ k: p.k })), catalog);
  const runs = L.flightRuns(f, history);
  return {
    ok: true,
    variable: varId,
    held: opts2.sub || null,
    run: runs.length + 1,
    previous: runs.length ? runs[runs.length - 1] : null,
    pours: pours,
    repeats: pours.filter(p => used[p.k]).map(p => p.k),
    fresh: pours.filter(p => !used[p.k]).length,
    notes: L.validate(pours, catalog, { bottles: bottles }),
    buy: L.suggestPurchase(varId, pours.map(p => catalog[p.k]).filter(Boolean),
      catalog, bottles)
  };
};

// The tag carries the variable as prose — "ONE VARIABLE: WHICH SHERRY" —
// so map it back to one of the ids the builder understands.
/* The TITLE first, then the tag.

   Both were concatenated and tested in one fixed order, so any flight whose
   tag mentioned proof was a proof flight — and "PROOF ASCENDS" is a house
   rule that appears on nearly every tag BZ writes. It is the ordering rule
   for the pours, not the question being asked. Eleven of thirty-six flights
   were read wrong because of it: No Age Stated, Is It Worth $100 More?,
   Wheat Turned Up, The Aberlour House and seven more all came back "proof".
   Remix cast them on the wrong variable too, which is the part nobody would
   have noticed from the outside.

   The title is where the question lives. The tag is where the mechanics
   live, and it is only consulted when the title says nothing. */
L.varInText = function (t) {
  const s = String(t || '').toLowerCase();
  if (/proof|strength/.test(s)) return 'proof';
  if (/sherry|cask|wood|finish|wine|port|madeira/.test(s)) return 'finish';
  if (/region|postcode|island|coast|where/.test(s)) return 'region';
  if (/age|year|old|time/.test(s)) return 'age';
  if (/grain|mash|rye|wheat|corn/.test(s)) return 'grain';
  if (/price|cost|money|worth/.test(s)) return 'price';
  if (/house|distiller/.test(s)) return 'house';
  return null;
};

L.variableOfId = function (f) {
  const tag = (f && f.tag) || '';
  // An explicit declaration outranks everything. Three of the thirty-six
  // say "ONE VARIABLE: WHICH SHERRY" outright, and a flight that states its
  // own variable should never be second-guessed by a regex over its title —
  // "A RYE FLIGHT" names what is HELD, not what is being asked.
  const stated = /one variable\s*:\s*([^·|]+)/i.exec(tag);
  if (stated) {
    const v = L.varInText(stated[1]);
    if (v) return v;
  }
  return L.varInText((f && f.title) || '') || L.varInText(tag);
};

/* --- join me: the message ---------------------------------------------- */

// The text has to stand on its own. Nobody installs anything to join a
// pour, so everything needed is in the message: what to pour, how much,
// and what to look for.
L.joinMeText = function (p, detail, who) {
  const d = detail || p || {};
  const lines = [];
  lines.push('Pour with me: ' + (p.name || d.name));
  const bits = [];
  if (d.proof) bits.push(d.proof + ' proof');
  if (d.sub) bits.push(L.titleCase(d.sub));
  if (d.region) bits.push(d.region);
  if (bits.length) lines.push(bits.join(' \u00b7 '));
  lines.push('');
  lines.push('We have all got this open. Pour about an ounce whenever suits '
    + 'you and say what you get.');
  // No notes in the message. A sourced nose can run to eighty words, which
  // is a wall of text on a phone — and sending somebody the answer before
  // they have poured defeats the point of asking what they get.
  return lines.join('\n');
};

/* --- comparing two shelves --------------------------------------------- */

// A shared shelf arrives as the same shape ours has: a catalog of products
// and a list of bottles. Everything below works on that pair, so the same
// code compares any two shelves without caring whose is whose.

// Only what can be poured tonight, or only what is owned. The toggle exists
// because the honest answer differs: open is what you can drink, owned is
// what says something about taste.
L.shelfSet = function (shelf, openOnly) {
  if (!shelf || !shelf.catalog) return {};
  const out = {};
  Object.values(shelf.catalog).forEach(p => {
    if (!p || !p.name) return;
    if (L.ownedCount(p.k, shelf.bottles || []) === 0) return;
    if (openOnly && !L.pourable(p.k, shelf.bottles || [])) return;
    out[L.shopNorm(p.name)] = p;
  });
  return out;
};

// The seven regions of a three-way Venn, by name rather than by index —
// "onlyA" is unreadable six months later, "mine" and "allThree" are not.
//
// Deliberately NOT area-proportional anywhere it is drawn: three circles
// cannot carry correct proportional overlaps across a 325-against-80 shelf,
// and a Venn that lies about area is worse than one that plainly does not
// encode it.
L.vennRegions = function (sets) {
  // sets: [{ id, name, map }] — two or three of them.
  const ids = sets.map(s => s.id);
  const has = (s, k) => Object.prototype.hasOwnProperty.call(s.map, k);
  const all = {};
  sets.forEach(s => Object.keys(s.map).forEach(k => { all[k] = 1; }));
  const regions = {};

  Object.keys(all).forEach(k => {
    const inIt = sets.filter(s => has(s, k)).map(s => s.id);
    const key = inIt.slice().sort().join('+');
    (regions[key] = regions[key] || []).push(
      (sets.find(s => has(s, k)) || {}).map[k]);
  });

  // Every combination, including the empty ones, so a region that holds
  // nothing still renders as a zero rather than disappearing.
  const out = [];
  const combos = [];
  for (let mask = 1; mask < (1 << ids.length); mask++) {
    const set = ids.filter((_, b) => mask & (1 << b));
    combos.push(set);
  }
  combos.sort((a, b) => a.length - b.length || a.join().localeCompare(b.join()));
  combos.forEach(set => {
    const key = set.slice().sort().join('+');
    out.push({ ids: set, key: key, bottles: regions[key] || [],
               count: (regions[key] || []).length });
  });
  return out;
};

// The two regions worth building the picture for, named so the UI does not
// have to work them out.
L.vennHighlights = function (regions, meId) {
  const all = regions.find(r => r.ids.length === regions[regions.length - 1].ids.length);
  const onlyMe = regions.find(r => r.ids.length === 1 && r.ids[0] === meId);
  const withoutMe = regions.find(r => r.ids.length > 1 && r.ids.indexOf(meId) < 0);
  return {
    // What the room could pour together.
    common: all || null,
    // What you bring that nobody else can.
    onlyMine: onlyMe || null,
    // Two people you trust both bought it and you did not. The shopping list.
    theyBothHave: withoutMe || null
  };
};

// A label a person can read, given who is in a region.
L.vennLabel = function (region, names, meId) {
  const parts = region.ids.map(id => id === meId ? 'You' : (names[id] || id));
  if (parts.length === 1) return parts[0] + ' only';
  if (parts.length === region.ids.length && region.ids.length >= 3) {
    return 'All ' + parts.length;
  }
  return parts.join(' and ');
};

/* --- a flight proposed to the room -------------------------------------

   Not one of your own flights shared out — those stay private. This is a
   flight cast from EVERYBODY'S bottles, which exists so the room can look
   at it and decide whether to pour it. It carries who brings what, because
   that is the part that makes it a plan rather than a wish.               */

L.makeProposal = function (flight, pours, pool, meLabel, meUid) {
  const plan = L.poolPlan(pours, pool, meLabel || 'You');
  return {
    id: 'p' + Date.now().toString(36),
    by: meUid || '',
    byName: meLabel || 'You',
    title: flight.title || 'An evening',
    variable: flight.variable || L.variableOfId(flight) || '',
    premise: flight.premise || '',
    at: L.todayISO(),
    // The pours as NAMES, not keys. A key is only meaningful against the
    // catalogue the sender happened to have.
    pours: (pours || []).map((p, i) => {
      const prod = pool.catalog[p.k] || {};
      const who = (pool.owner || {})[p.k] || [];
      return {
        letter: String.fromCharCode(65 + i),
        name: prod.name || '',
        proof: prod.proof || null,
        from: who.indexOf(meLabel || 'You') >= 0 ? (meLabel || 'You') : (who[0] || '')
      };
    }),
    summary: plan.summary
  };
};

// What somebody would need to bring if they said yes. Worked out against
// the reader's own shelf, not the proposer's, so it answers the question
// the reader actually has.
L.proposalAsks = function (prop, myCatalog, myBottles, myLabel) {
  const mine = [], theirs = [];
  (prop.pours || []).forEach(p => {
    const key = L.shopNorm(p.name);
    const have = Object.values(myCatalog || {}).some(
      x => L.shopNorm(x.name) === key && L.pourable(x.k, myBottles || []));
    (have ? mine : theirs).push(p);
  });
  return {
    haveOpen: mine.length,
    total: (prop.pours || []).length,
    bringing: (prop.pours || []).filter(p => p.from === myLabel).length,
    // The honest line: how much of this evening is already on your shelf.
    note: mine.length === (prop.pours || []).length
      ? 'You have all of these open.'
      : 'You have ' + mine.length + ' of ' + (prop.pours || []).length
        + ' open.'
  };
};

/* --- barcodes ----------------------------------------------------------

   A scan gives a NUMBER, and the shelf is keyed by name — so nothing can
   be searched until the number becomes a name. The barcode source has to
   answer first or there is nothing to ask with, and when it cannot the
   honest thing is to say so rather than to guess.

   The part that makes it worth building is that it learns. A UPC nobody
   knows, where you then type the name, teaches that pairing — and it is
   shared, like the library. Somebody scans a Feis Ile bottle no retail
   listing has ever carried, types it once, and it is known for everybody
   after that.                                                             */

// A UPC as stored: digits only. Printed forms carry hyphens and a leading
// zero that scanners sometimes drop, so both are normalised away and a
// 12-digit code is compared on its last 12.
L.upcKey = function (raw) {
  const d = String(raw || '').replace(/\D/g, '');
  if (d.length < 8) return null;
  return d.length > 12 ? d.slice(-12) : d.padStart(12, '0');
};

/**
 * Parse the listing format: a brand, then entries separated by semicolons,
 * each with a size, an expression, a UPC and a price in roughly that order.
 *
 *   Glenlivet: 750 ml 12-year 0-80432-40063-0 $36.99; 750 ml 18-year ...
 *
 * The expression is whatever sits between the size and the UPC, which is
 * what distinguishes a 12 from an 18 and is the whole reason this source
 * is worth anything.
 */
L.UPC_SIZES = '750\\s*ml|1\\.75|1\\.5|liter|litre|375\\s*ml|200\\s*ml|700\\s*ml|1l';

L.parseUpcListing = function (text) {
  const out = [];
  String(text || '').split(/\n+/).forEach(line => {
    const at = line.indexOf(':');
    if (at < 1) return;
    const brand = line.slice(0, at).trim().replace(/\s+/g, ' ');
    if (!brand || brand.length > 60) return;
    line.slice(at + 1).split(';').forEach(chunk => {
      const um = chunk.match(/\d[\d-]{9,16}\d/);
      if (!um) return;
      const upc = L.upcKey(um[0]);
      if (!upc) return;
      const pm = chunk.match(/\$\s*([\d,]+\.?\d*)/);
      const sm = chunk.match(new RegExp('^\\s*(' + L.UPC_SIZES + ')', 'i'));
      const from = sm ? sm[0].length : 0;
      const expr = chunk.slice(from, um.index)
        .replace(/\s+/g, ' ').replace(/^[\s\-,]+|[\s\-,]+$/g, '');
      out.push({
        upc: upc,
        name: expr ? brand + ' ' + expr : brand,
        brand: brand,
        size: sm ? sm[1].trim() : null,
        price: pm ? parseFloat(pm[1].replace(/,/g, '')) : null
      });
    });
  });
  return out;
};

// What a scan resolves to, in the order that can actually answer. A number
// cannot be searched by name, so the barcode store comes first and
// everything else follows from what it returns.
L.resolveUpc = function (upc, known, catalog) {
  const key = L.upcKey(upc);
  if (!key) return { ok: false, why: 'That is not a barcode.' };
  const hit = (known || {})[key];
  if (!hit) {
    return { ok: false, key: key,
      why: 'No listing we know carries that barcode.' };
  }
  const onShelf = L.lookupFromCatalog(hit.name, catalog || {});
  return { ok: true, key: key, name: hit.name, price: hit.price || null,
           size: hit.size || null, onShelf: onShelf || null };
};

/* --- the master library ------------------------------------------------

   BZ's 325 products seed a library everybody reads, and everybody adds to.
   A product is reference data — a name, a distillery, a proof, a cask, a
   tasting note — and there is no reason for the second person to type in
   Lagavulin 16 again because the first person already did.

   Contributions are held rather than merged. One person's typo becoming
   everybody's is the failure this has to avoid, and a queue an admin works
   through is the cheap way to avoid it. The cost is a delay; the cost of
   the alternative is a library nobody trusts.                             */

// What is worth contributing: something the library does not have, with
// enough on it to be useful to somebody else.
L.worthContributing = function (p, base) {
  if (!p || !p.name || !p.proof) return false;
  const key = L.shopNorm(p.name);
  if (!key) return false;
  const known = Object.values(base || {}).some(x => L.shopNorm(x.name) === key);
  if (known) return false;
  // A bottle with only a name and a proof helps nobody. A distillery or a
  // category makes it findable, which is the point of a library.
  return !!(p.dist || p.sub);
};

// Trimmed to what a library holds. Not what YOU paid, not whether yours is
// open — those are facts about your shelf, not about the whisky.
L.libraryEntry = function (p) {
  const out = { name: String(p.name).trim(), proof: p.proof };
  ['dist', 'sub', 'style', 'region', 'age', 'fin', 'msrp', 'obsc', 'scar']
    .forEach(k => { if (p[k] !== undefined && p[k] !== null && p[k] !== '') out[k] = p[k]; });
  /* A flight-card note must never leave this shelf.

     This published any note with a nose. A note written onto a flight card
     is a prompt to read aloud beside five other pours — it was invented for
     that room, it is not a description of the whisky, and the entry does
     not carry tnFrom, so once it is in the library nothing downstream can
     tell it from a real one. Every other path in the app has been taught
     that a prompt is not a note; this one was the last that had not, and it
     is the one that shares it with everybody. */
  if (p.tn && p.tn.nose && !p.tnFrom) {
    out.tn = p.tn;
    // Where it came from, so the library can say rather than imply.
    if (p.tnSrc) out.tnSrc = p.tnSrc;
  }
  return out;
};

/* Which library entries are carrying a note we invented for a flight.

   The published entry does not keep tnFrom, so the library cannot answer
   this on its own — but the shelf it came from still knows, and matching
   on the key is enough. Used to clean up after the one publish that went
   out before libraryEntry was taught the rule. */
L.promptNotesInLibrary = function (catalog, lib) {
  const out = [];
  Object.values(catalog || {}).forEach(p => {
    if (!p || !p.tnFrom) return;
    const key = L.libKey(p.name);
    const there = (lib || {})[key];
    if (there && there.tn && there.tn.nose) out.push({ key: key, name: p.name });
  });
  return out.sort((a, b) => a.name.localeCompare(b.name));
};

// The fields a correction may touch. Not everything: a name change is a
// different bottle rather than a correction to this one, and a key change
// would orphan every reference to it.
// A key Firebase will accept, derived from the name and stable across
// devices. Firebase forbids . # $ [ ] and / in a key, and bottle names are
// full of full stops — E.H. Taylor, J. Mattingly, Belle Meade 108.3 Proof.
// The first version dodged that by storing the library as one array, which
// threw away every property of a database: one blob, read whole, written
// whole. Encoding the key is the fix; abandoning keys was not.
// Built from the RAW name, not the normalised one. shopNorm drops words
// like "whiskey" for matching, which is right for matching and fatal for a
// key: "Barrell Craft Spirits Private Release" and "...Private Release
// Whiskey" are two bottles that normalise to one string, and a keyed store
// would have silently merged them.
L.libKey = function (name) {
  return String(name || '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '')
    .slice(0, 120);
};

/* Renaming an entry in the shared library.

   The library is keyed by libKey(name), so a rename is a MOVE: written at
   the new key and removed from the old one, or the library ends up holding
   the bottle twice under two spellings. And it has to refuse a name already
   taken, because the write would silently replace somebody else's entry.

   Cased like everything else typed, so a rename fixes exactly the fault it
   is usually opened to fix — an entry that went up in lower case. */
L.libraryRename = function (products, oldKey, name) {
  const clean = L.typedName(name);
  if (clean.length < 2) return { ok: false, why: 'A name is required.' };
  const key = L.libKey(clean);
  if (!key) return { ok: false, why: 'That name has nothing to file it under.' };
  if (key !== oldKey && (products || {})[key]) {
    return { ok: false, key: key, name: clean,
             why: 'The library already holds '
               + ((products[key] || {}).name || clean) + '.' };
  }
  return { ok: true, key: key, name: clean, moved: key !== oldKey };
};

/* --- what the render functions were computing ---------------------------

   Rule 30, applied to the three the backlog names. Each of these decided
   something inside a function that also draws, so the harness could not
   reach the decision — and every serious fault of the week of 2026-09-03
   was in code the tests could not see, or could see only one half of.

   Nothing about WHAT they decide has changed; the deciding has moved out
   of the drawing.                                                       */

// Opening a sealed bottle: which one, and what to warn about first.
L.sealedPrompt = function (key, bottles, product) {
  const sealed = L.myBottles(key, bottles).filter(L.isSealed);
  if (!sealed.length) return { ok: false, why: 'Nothing sealed to open' };
  const p = product || {};
  const band = p.msrp ? L.priceBand(p.msrp) : null;
  const dear = band === 'vault' || band === 'special';
  return {
    ok: true,
    sealed: sealed,
    // The one that opens is the first sealed one, and the caller must not
    // have to know that.
    next: sealed[0],
    band: band,
    dear: dear,
    note: (sealed.length > 1 ? 'You have ' + sealed.length + ' sealed. ' : '')
      + (dear ? 'This is a ' + L.titleCase(band) + ' bottle. ' : '')
      + 'Opening it logs a pour, because nobody opens one to look at it.'
  };
};

// What on this shelf differs from the library, so a batch can be reviewed
// before it is sent rather than trusted.
L.pendingForLibrary = function (catalog, lib) {
  const library = lib || {};
  const out = [];
  Object.values(catalog || {}).forEach(p => {
    const there = library[L.libKey(p.name)];
    if (!there) {
      if (L.worthContributing(p, {})) out.push({ p: p, why: 'not in the library' });
      return;
    }
    const diff = L.correctionFor(p, there);
    if (diff) {
      // The diff itself travels, not a list of field names. The review
      // screen exists to be refused, and it cannot be refused on
      // "proof, fin differs".
      out.push({ p: p, why: Object.keys(diff).join(', ') + ' differs',
                 diff: diff, changes: L.describeCorrection(diff) });
    }
  });
  return out;
};

// The write a publish makes, built before anything is sent so the harness
// can read it. One update, so the whole batch lands or none of it does — a
// half-published set is worse than an unpublished one.
L.publishWrite = function (products, now) {
  const updates = { stamp: now };
  const names = [];
  (products || []).forEach(p => {
    const key = L.libKey(p && p.name);
    if (!key) return;
    updates['catalog/products/' + key] =
      Object.assign(L.libraryEntry(p), { at: now });
    names.push(p.name);
  });
  return { updates: updates, names: names };
};

/* Where a hard bottle can actually be got.

   What BZ does today: search the name, find the shops that have it, compare
   the prices, buy it. The only thing the app can add is that the exact name
   is already typed — which IS the work, because the name is the fiddly part
   and the app is holding it.

   Three larger designs were proposed first and rejected: the secondary
   market, OHLQ alone, and a shop list with search templates and price
   comparison. BZ's words: "seems way more complex than a google search."
   Nothing is stored, nothing is fetched, and nothing breaks when a shop
   redesigns its site. */
L.findUrl = function (name, dist) {
  const q = [String(name || '').trim(), String(dist || '').trim()]
    // The distillery only when the name does not already carry it, or the
    // query reads "Ardbeg 10 Ardbeg" and the results get worse.
    .filter((v, i) => v && (i === 0
      || !new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i')
           .test(String(name || ''))))
    .join(' ');
  if (!q) return null;
  return 'https://www.google.com/search?q=' + encodeURIComponent(q + ' buy');
};

/* A backup that is actually a backup.

   The CSV export carries bottles and products: twelve columns. It does not
   carry the history, the custom flights, the edits, the favourites, the
   barcodes, the wishlist or the dismissals — so the 36 designed flights,
   which are the least replaceable thing on this shelf, existed in one
   browser and one Firebase node and in no file BZ could hold.

   Everything that is stored, in one file, with a version and a stamp so a
   restore can say what it is about to do. */
L.BACKUP_FORMAT = 1;

L.makeBackup = function (state, keys, when) {
  const out = { format: L.BACKUP_FORMAT, app: 'killer-bs', at: when || 0,
                keys: {} };
  (keys || []).forEach(k => { out.keys[k] = (state || {})[k]; });
  return out;
};

// What a restore would do, decided before anything is written, so it can be
// shown and refused. A file that is not one of ours is refused by name
// rather than half-applied.
L.readBackup = function (text, keys) {
  let raw;
  try { raw = JSON.parse(text); } catch (e) {
    return { ok: false, why: 'That file is not readable JSON.' };
  }
  if (!raw || raw.app !== 'killer-bs' || !raw.keys) {
    return { ok: false, why: 'That is not a Killer B\u2019s backup.' };
  }
  if (raw.format > L.BACKUP_FORMAT) {
    return { ok: false, why: 'That backup was written by a newer version.' };
  }
  const take = {}, counts = [];
  (keys || []).forEach(k => {
    if (!(k in raw.keys)) return;
    const v = raw.keys[k];
    if (v === undefined || v === null) return;
    take[k] = v;
    counts.push(k + ' ' + (Array.isArray(v) ? v.length
      : (typeof v === 'object' ? Object.keys(v).length : String(v).length ? 1 : 0)));
  });
  if (!Object.keys(take).length) {
    return { ok: false, why: 'That backup holds nothing this version reads.' };
  }
  return { ok: true, at: raw.at || 0, keys: take, summary: counts.join(', ') };
};

L.CORRECTABLE = ['proof', 'age', 'fin', 'dist', 'sub', 'region', 'msrp',
                 'obsc', 'scar', 'style'];

/**
 * What somebody's edit says the library has wrong.
 *
 * The more valuable half of contributing. A missing bottle is an absence
 * anybody can work around; a wrong proof in a library everybody reads is an
 * error that spreads, and Wee Beastie sat at the wrong age here for weeks
