<!DOCTYPE html>
<!-- Killer B's Bottle Tracker v0.1.2 — whisky shelf and tasting curriculum.
  CHANGELOG
    0.1.2 (2026-09-01 01:12:57) — rebrand to Killer B's Bottle Tracker: roundel masthead, Cinzel display face, palette shifted to the logo's ink, PWA icons from the logo
    0.1.1 (2026-09-01 01:10:31) — initial build: shelf, bottle detail with exit reasons, pick my pour, 36 flights with proof ladder, snack suggestions, overuse control, SMS summary
    0.1.0 — initial build: shelf, bottle detail, pick my pour, 36 flights,
            proof ladder, snack suggestions, run history, SMS summary.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1613">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Killer B's Bottle Tracker</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink-deep:#1A1613; --gold:#8A6A28; --rust:#7A3B1E;
  --paper:#F5F3EE; --card:#FFFFFF; --ink:#241F1A; --mute:#6E665C;
  --line:#DAD3C5; --ok:#2E6B4F;
  --nav-h:58px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:15px; line-height:1.45;
  font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
h1,h2,h3{font-family:'Cinzel',Georgia,serif;font-weight:600;margin:0;line-height:1.2;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink-deep);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- structure ---------- */
.screen{display:none;padding:14px 14px 24px}
.screen.on{display:block}
.hdr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.hdr h1{font-size:21px;color:var(--ink-deep)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.brand img{width:52px;height:52px;flex:none}
.brand .wm{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:17px;
  line-height:1.1;color:var(--ink-deep)}
.brand .wm span{display:block;font-family:'IBM Plex Sans',sans-serif;font-weight:400;
  font-size:11.5px;color:var(--mute);letter-spacing:.04em;margin-top:3px}
.count{color:var(--mute);font-size:13px}

/* ---------- nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:250;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--ink-deep);
}
nav button{
  background:none;border:0;color:#B9C3D4;font-size:11.5px;letter-spacing:.02em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:0;
}
nav button .g{font-size:17px;line-height:1}
nav button[aria-current="page"]{color:#fff;box-shadow:inset 0 2px 0 var(--gold)}

/* ---------- controls ---------- */
.field{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
  background:var(--card);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{
  padding:5px 11px;border:1px solid var(--line);border-radius:999px;
  background:var(--card);font-size:13px;color:var(--mute);
}
.chip[aria-pressed="true"]{background:var(--ink-deep);border-color:var(--ink-deep);color:#fff}
.btn{padding:10px 15px;border:1px solid var(--ink-deep);border-radius:7px;
  background:var(--ink-deep);color:#fff;font-size:14px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink-deep)}
.btn.wide{width:100%;margin-top:8px}

/* ---------- bottle rows ---------- */
.list{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:9px;overflow:hidden}
.item{background:var(--card);border:0;width:100%;text-align:left;
  padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.item .nm{font-size:14px;font-weight:500}
.item .sub{font-size:12px;color:var(--mute);margin-top:1px}
.item .pf{font-size:15px;color:var(--ink-deep);font-weight:600}
.sealed .nm{color:var(--mute)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:middle;
  margin-right:5px;background:var(--ok)}
.sealed .dot{background:var(--line)}
.gone .dot{background:var(--rust)}

/* ---------- detail ---------- */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;
  background:#EDE9DF;color:var(--gold);margin:0 4px 4px 0}
.tag.wine{background:#F3E4E4;color:var(--rust)}
.tag.wood{background:#E6EAE6;color:var(--ok)}
.src{font-size:11px;color:var(--mute)}

/* ---------- proof ladder: the signature element ---------- */
.ladder{position:relative;margin:14px 0 6px;padding-left:52px}
.ladder .axis{position:absolute;left:42px;top:0;bottom:0;width:1px;background:var(--line)}
.rung{position:relative;display:grid;grid-template-columns:1fr;padding:3px 0}
.rung .pin{position:absolute;left:-52px;width:40px;text-align:right;
  font-size:13px;color:var(--ink-deep);font-weight:600}
.rung .tick{position:absolute;left:-11px;top:50%;width:11px;height:1px;background:var(--line)}
.rung .body{border-left:3px solid var(--line);padding:4px 0 4px 10px}
.rung.spot .body{border-left-color:var(--gold)}
.rung.blind .body{border-left-color:var(--rust)}
.rung .b{font-size:13.5px;font-weight:500}
.rung .w{font-size:12px;color:var(--mute)}

/* ---------- flights ---------- */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 13px;margin-bottom:9px;width:100%;text-align:left}
.fcard h3{font-size:15px;color:var(--ink-deep);letter-spacing:.02em}
.fcard .var{font-size:12.5px;color:var(--gold);margin-top:2px}
.fcard .meta{font-size:12px;color:var(--mute);margin-top:6px}
.done{border-left:3px solid var(--ok)}
.warn{background:#FBF5EC;border:1px solid #E3D3B4;border-radius:8px;padding:9px 11px;
  font-size:13px;margin-bottom:8px}
.warn b{color:var(--gold)}
.ok{background:#EFF5F1;border-color:#CBDFD2}
.ok b{color:var(--ok)}
.snack{font-size:13px;color:var(--mute);margin-top:8px}
.empty{color:var(--mute);font-size:14px;padding:20px 4px;text-align:center}
footer{text-align:center;color:var(--mute);font-size:11px;padding:14px 0 4px}
</style>
</head>
<body>

<!-- ======================= SHELF ======================= -->
<section id="scr-shelf" class="screen on">
  <div class="brand">
    <img src="./mark.png" alt="" width="52" height="52">
    <div class="wm">Killer B’s<span>Bottle tracker</span></div>
  </div>
  <div class="hdr"><h1>The shelf</h1><span class="count" id="shelfCount"></span></div>
  <input id="q" class="field" type="search" placeholder="Search name or distillery" aria-label="Search bottles">
  <div class="row" id="shelfFilters" style="margin-top:10px"></div>
  <div class="list" id="shelfList"></div>
</section>

<!-- ======================= POUR ======================= -->
<section id="scr-pour" class="screen">
  <div class="hdr"><h1>Pick my pour</h1></div>
  <div class="sheet">
    <div class="kv" style="grid-template-columns:1fr">
      <label>Proof ceiling <input id="pourProof" class="field" type="number" placeholder="any" min="60" max="145"></label>
    </div>
    <div class="row" style="margin-top:10px" id="pourStyle"></div>
    <div class="row" id="pourObsc"></div>
    <button class="btn wide" id="pourGo">Pour me something</button>
  </div>
  <div id="pourResult"></div>
</section>

<!-- ======================= FLIGHTS ======================= -->
<section id="scr-flights" class="screen">
  <div class="hdr"><h1>Flights</h1><span class="count" id="flightCount"></span></div>
  <div class="row" id="flightFilters"></div>
  <div id="flightList"></div>
</section>

<!-- ======================= DETAIL (bottle or flight) ======================= -->
<section id="scr-detail" class="screen">
  <button class="btn ghost" id="backBtn" style="margin-bottom:12px">Back</button>
  <div id="detailBody"></div>
</section>

<nav>
  <button data-scr="shelf" aria-current="page"><span class="g">▤</span>Shelf</button>
  <button data-scr="pour"><span class="g">◍</span>Pour</button>
  <button data-scr="flights"><span class="g">≡</span>Flights</button>
  <button data-scr="detail"><span class="g">◈</span>Detail</button>
</nav>

<script>
'use strict';
const APP_VERSION = '0.1.2';
const BUILD_TIME  = '2026-09-01 01:12:57';

/* =====================================================================
   PURE LOGIC — every function below is called by the test harness.
   Render functions do templating only (build rule 30): anything that
   computes lives here, named, and is exercised by dram-test.js.
   ===================================================================== */
const L = {};

/* --- inventory ----------------------------------------------------- */

// A product is pourable when at least one bottle of it is open. Derived,
// never stored: BZ buys a backup of anything he wants to keep having, so
// "do I own two" and "can I pour it" are different questions.
L.pourable = function (key, bottles) {
  return bottles.some(b => b.k === key && b.status === 'open');
};

L.ownedCount = function (key, bottles) {
  return bottles.filter(b => b.k === key && b.status !== 'gone').length;
};

// Secondary over MSRP. Null when either side is missing or zero -- 0.0 in
// the source data means "not recorded", not "worthless".
L.premium = function (msrp, secondary) {
  if (!msrp || !secondary || msrp <= 0 || secondary <= 0) return null;
  return Math.round((secondary / msrp) * 100) / 100;
};

// Exits are not all the same event. A drain pour is an opinion; a gift
// leaves the bottle in existence somewhere else.
L.EXITS = ['finished', 'drain pour', 'gifted', 'traded', 'sold', 'broken'];

L.isDrain = function (reason) { return reason === 'drain pour'; };

/* --- pick my pour --------------------------------------------------- */

// Score a candidate. Higher is a better suggestion tonight. Every term
// has a reason attached so the UI can say WHY, which is the whole point
// of the feature -- an unexplained random pick is just a shuffle.
L.pourScore = function (prod, opts, history) {
  const o = opts || {};
  if (o.maxProof && prod.proof > o.maxProof) return null;
  if (o.style && o.style.length && !o.style.includes(prod.sub)) return null;
  if (o.obsc && o.obsc.length && !o.obsc.includes(prod.obsc)) return null;

  let score = 0;
  const why = [];
  const seen = (history || []).filter(h => h.k === prod.k).length;

  if (seen === 0) { score += 40; why.push('never poured'); }
  else if (seen === 1) { score += 15; why.push('poured once'); }
  else { score -= seen * 6; }

  if (prod.obsc === 'obscure') { score += 18; why.push('nobody you know owns this'); }
  else if (prod.obsc === 'niche') { score += 8; }

  if (prod.scar === 'exclusive') { score += 12; why.push('distillery exclusive'); }
  else if (prod.scar === 'limited') { score += 6; }

  // A bottle finished in something unusual is a better talking point than
  // another ex-bourbon pour.
  if (prod.fin && prod.wine) { score += 7; why.push('finished in ' + prod.fin); }
  else if (prod.fin) { score += 5; why.push(prod.fin); }

  return { k: prod.k, score, why };
};

L.pickPour = function (catalog, bottles, opts, history) {
  const out = [];
  Object.values(catalog).forEach(p => {
    if (!L.pourable(p.k, bottles)) return;
    const s = L.pourScore(p, opts, history);
    if (s) out.push(s);
  });
  out.sort((a, b) => b.score - a.score || a.k.localeCompare(b.k));
  return out;
};

/* --- flight design -------------------------------------------------- */

L.CORE_TARGET = 6;
L.EXT_TARGET = 4;

// Position a pour on the ladder by its real proof, not by its index, so
// three Cairdeas bottlings 0.4 apart visibly cluster.
L.ladderOffsets = function (proofs) {
  if (!proofs.length) return [];
  const lo = Math.min(...proofs), hi = Math.max(...proofs);
  const span = hi - lo;
  return proofs.map(p => span === 0 ? 0.5
    : Math.round(((p - lo) / span) * 10000) / 10000);
};

// Validate a flight instance against BZ's own build rules. Failing a check
// is a warning with a reason, never a block -- the proof rule has been
// deliberately overridden three times already.
L.validate = function (pours, catalog, opts) {
  const o = opts || {};
  const msgs = [];
  const prods = pours.map(p => catalog[p.k]).filter(Boolean);

  if (pours.length !== (o.coreTarget || L.CORE_TARGET)) {
    msgs.push({ level: 'warn', msg: pours.length + ' core pours, not ' +
      (o.coreTarget || L.CORE_TARGET) });
  }

  const proofs = prods.map(p => p.proof);
  let ascends = true;
  for (let i = 1; i < proofs.length; i++) if (proofs[i] < proofs[i - 1]) ascends = false;
  if (!ascends && !o.allowDescent) {
    msgs.push({ level: 'warn', msg: 'proof does not ascend — flag it or reorder' });
  }

  // "One obscure pour minimum" tests recognition, not price. The imported
  // rarity label would pass a Weller here, which is exactly backwards.
  const obscure = prods.filter(p => p.obsc === 'obscure').length;
  if (obscure < 1) msgs.push({ level: 'warn', msg: 'no obscure pour — every flight needs one' });
  else msgs.push({ level: 'ok', msg: obscure + ' obscure pour' + (obscure > 1 ? 's' : '') });

  const unpourable = prods.filter(p => !L.pourable(p.k, o.bottles || []));
  if (unpourable.length) {
    msgs.push({ level: 'warn', msg: unpourable.length + ' pour' +
      (unpourable.length > 1 ? 's are' : ' is') + ' not open: ' +
      unpourable.map(p => p.name.slice(0, 28)).join(', ') });
  }

  // Matched pairs are the strongest flight shape BZ has found: identical
  // proof, one perceptible difference.
  const pairs = [];
  for (let i = 0; i < prods.length; i++)
    for (let j = i + 1; j < prods.length; j++)
      if (Math.abs(prods[i].proof - prods[j].proof) <= 0.4) pairs.push([i, j]);
  if (pairs.length) {
    msgs.push({ level: 'ok', msg: pairs.length + ' matched pair' +
      (pairs.length > 1 ? 's' : '') + ' at proof' });
  }
  return msgs;
};

// How often a product has already been poured, across every flight and
// every recorded run. Overuse control: run two should not be run one with
// two bottles changed.
L.useCount = function (key, flights, history) {
  let n = 0;
  (flights || []).forEach(f => f.core.forEach(p => { if (p.k === key) n++; }));
  (history || []).forEach(h => { if ((h.pours || []).includes(key)) n++; });
  return n;
};

L.overused = function (keys, flights, history, limit) {
  const cap = limit || 3;
  return keys.filter(k => L.useCount(k, flights, history) > cap);
};

/* --- snacks --------------------------------------------------------- */

// BZ's rule: simple bowls, not plates. No vinegar, no citrus -- both
// wreck the palate for the next pour. Suggestions follow the dominant
// cask, because that is what the snack has to sit beside.
L.SNACKS = {
  sherry: ['dark chocolate', 'dried cherries', 'salted pecans'],
  wine:   ['dark chocolate', 'dried figs', 'marcona almonds'],
  wood:   ['salted pecans', 'shortbread', 'toasted walnuts'],
  peat:   ['smoked almonds', 'aged cheddar', 'oatcakes'],
  plain:  ['plain crackers', 'salted almonds', 'shortbread']
};

L.snacksFor = function (prods) {
  const fin = prods.map(p => (p.fin || '')).join(' ').toLowerCase();
  const peated = prods.some(p => /laphroaig|ardbeg|lagavulin|octomore|peat|caol|bunnahabhain/i
    .test(p.name + ' ' + p.dist));
  if (peated) return L.SNACKS.peat;
  if (/ximenez|oloroso|sherry|fino|manzanilla|amontillado|cream/.test(fin)) return L.SNACKS.sherry;
  if (/port|madeira|moscatel|sauternes|bordeaux|rum|cognac|armagnac/.test(fin)) return L.SNACKS.wine;
  if (/oak|toasted|mizunara|amburana/.test(fin)) return L.SNACKS.wood;
  return L.SNACKS.plain;
};

/* --- SMS summary ---------------------------------------------------- */

// One identical text to everyone: the bottle list and the theme. Sent
// after the reveal, so it is the answer key people keep.
L.smsBody = function (flight, prods) {
  const lines = [flight.title, L.variableOf(flight)];
  prods.forEach((p, i) => {
    const letter = String.fromCharCode(65 + i);
    const bits = [p.name, p.fin, p.proof].filter(Boolean);
    lines.push(letter + ' \u00b7 ' + bits.join(', '));
  });
  lines.push('Snacks: ' + L.snacksFor(prods).join(', '));
  return lines.join('\n');
};

// The tag line carries "ONE VARIABLE: WHICH SHERRY" on most cards.
L.variableOf = function (flight) {
  const m = /ONE VARIABLE:\s*([^\u00b7]+)/i.exec(flight.tag || '');
  if (m) return 'One variable: ' + m[1].trim().toLowerCase();
  return (flight.tag || '').split('\u00b7').slice(-1)[0].trim();
};

/* =====================================================================
   STATE + RENDER
   ===================================================================== */
const S = { catalog: {}, bottles: [], flights: [], history: [], edits: {},
            filters: { status: 'open', style: null }, pourOpts: {} };

const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };

function load() {
  try {
    S.history = JSON.parse(localStorage.getItem('dram.history') || '[]');
    S.edits = JSON.parse(localStorage.getItem('dram.edits') || '{}');
  } catch (e) { S.history = []; S.edits = {}; }
}
function save() {
  localStorage.setItem('dram.history', JSON.stringify(S.history));
  localStorage.setItem('dram.edits', JSON.stringify(S.edits));
}

// Read order: your override, then the shared catalog. The UI shows which
// layer a value came from so you always know what you are trusting.
function prod(k) {
  const base = S.catalog[k];
  if (!base) return null;
  const ov = S.edits[k];
  return ov ? Object.assign({}, base, ov) : base;
}

function show(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  const t = document.getElementById('scr-' + name);
  if (t) t.classList.add('on');
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.scr === name ? 'page' : 'false'));
  window.scrollTo(0, 0);
}

/* --- shelf ---------------------------------------------------------- */
const STATUS_FILTERS = [['open', 'Open'], ['sealed', 'Sealed'], ['all', 'All']];

function renderShelfFilters() {
  const box = $('#shelfFilters'); box.innerHTML = '';
  STATUS_FILTERS.forEach(([v, label]) => {
    const b = el('button', 'chip', label);
    b.setAttribute('aria-pressed', S.filters.status === v);
    b.onclick = () => { S.filters.status = v; renderShelfFilters(); renderShelf(); };
    box.appendChild(b);
  });
}

function shelfRows() {
  const q = ($('#q').value || '').toLowerCase().trim();
  const rows = [];
  Object.keys(S.catalog).forEach(k => {
    const p = prod(k);
    const open = L.pourable(k, S.bottles);
    const owned = L.ownedCount(k, S.bottles);
    if (owned === 0) return;
    if (S.filters.status === 'open' && !open) return;
    if (S.filters.status === 'sealed' && open) return;
    if (q && !(p.name + ' ' + p.dist).toLowerCase().includes(q)) return;
    rows.push({ p, open, owned });
  });
  rows.sort((a, b) => a.p.name.localeCompare(b.p.name));
  return rows;
}

function renderShelf() {
  const list = $('#shelfList'); list.innerHTML = '';
  const rows = shelfRows();
  $('#shelfCount').textContent = rows.length + ' of ' + Object.keys(S.catalog).length;
  if (!rows.length) {
    list.appendChild(el('div', 'empty', 'Nothing matches. Clear the search or switch filters.'));
    return;
  }
  rows.slice(0, 400).forEach(({ p, open, owned }) => {
    const b = el('button', 'item' + (open ? '' : ' sealed'));
    const left = el('div');
    const nm = el('div', 'nm'); nm.innerHTML = '<span class="dot"></span>';
    nm.appendChild(document.createTextNode(p.name));
    const sub = el('div', 'sub', [p.dist, p.style, owned > 1 ? owned + ' bottles' : null]
      .filter(Boolean).join(' \u00b7 '));
    left.appendChild(nm); left.appendChild(sub);
    b.appendChild(left);
    b.appendChild(el('div', 'pf', p.proof));
    b.onclick = () => showBottle(p.k);
    list.appendChild(b);
  });
}

/* --- bottle detail -------------------------------------------------- */
function showBottle(k) {
  const p = prod(k);
  const body = $('#detailBody'); body.innerHTML = '';
  const h = el('div', 'sheet');
  const t = el('h2'); t.style.fontSize = '21px'; t.style.color = 'var(--ink-deep)';
  t.textContent = p.name; h.appendChild(t);

  const dl = el('dl', 'kv');
  const add = (k2, v, cls) => {
    if (v === null || v === undefined || v === '') return;
    dl.appendChild(el('dt', null, k2));
    const dd = el('dd', cls); dd.textContent = v; dl.appendChild(dd);
  };
  add('Distillery', p.dist);
  add('Style', [p.sub, p.style].filter(Boolean).join(' \u00b7 '));
  add('Proof', p.proof);
  add('Age', p.age ? p.age + ' years' : 'No age stated');
  h.appendChild(dl);

  if (p.fin) {
    const f = el('div'); f.style.marginTop = '10px';
    p.fin.split('+').forEach(part => {
      f.appendChild(el('span', 'tag ' + (p.wine ? 'wine' : 'wood'), part));
    });
    const src = el('div', 'src', p.finc === 'stated' ? 'confirmed from the producer'
      : p.finc === 'from_cards' ? 'from your flight cards' : 'read from the label');
    f.appendChild(src);
    h.appendChild(f);
  }

  const dl2 = el('dl', 'kv'); dl2.style.marginTop = '10px';
  const add2 = (a, b2) => { if (b2 === null || b2 === undefined || b2 === '') return;
    dl2.appendChild(el('dt', null, a)); dl2.appendChild(el('dd', null, b2)); };
  add2('Recognition', p.obsc);
  add2('Release', p.scar);
  add2('Ohio retail', p.alloc);
  const prem = L.premium(p.msrp, p.sec);
  add2('Premium', prem ? prem + '\u00d7 over MSRP' : null);
  add2('MSRP', p.msrp ? '$' + p.msrp : null);
  h.appendChild(dl2);
  body.appendChild(h);

  const mine = S.bottles.filter(b => b.k === k);
  const bs = el('div', 'sheet');
  bs.appendChild(el('h3', null, mine.length > 1 ? mine.length + ' bottles' : 'Your bottle'));
  mine.forEach(b => {
    const r = el('div'); r.style.cssText =
      'display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line)';
    r.appendChild(el('span', null, b.id + ' \u00b7 ' + b.status));
    const btn = el('button', 'chip', b.status === 'sealed' ? 'Open it' : 'Retire');
    btn.onclick = () => b.status === 'sealed' ? openBottle(b, k) : retireBottle(b, k);
    r.appendChild(btn);
    bs.appendChild(r);
  });
  body.appendChild(bs);

  const used = L.useCount(k, S.flights, S.history);
  if (used) {
    const u = el('div', 'sheet');
    u.appendChild(el('h3', null, 'In the curriculum'));
    const fl = S.flights.filter(f => f.core.some(x => x.k === k) || f.ext.some(x => x.k === k));
    fl.forEach(f => {
      const isCore = f.core.some(x => x.k === k);
      const b2 = el('button', 'chip', f.title.toLowerCase() + (isCore ? '' : ' (bench)'));
      b2.style.marginRight = '5px';
      b2.onclick = () => showFlight(f);
      u.appendChild(b2);
    });
    body.appendChild(u);
  }
  show('detail');
}

function openBottle(b, k) { b.status = 'open'; showBottle(k); renderShelf(); }

function retireBottle(b, k) {
  const body = $('#detailBody');
  const box = el('div', 'sheet');
  box.appendChild(el('h3', null, 'Why is it leaving?'));
  const row = el('div', 'row'); row.style.marginTop = '8px';
  L.EXITS.forEach(reason => {
    const c = el('button', 'chip', reason);
    c.onclick = () => {
      b.status = 'gone'; b.exit = reason; b.exitDate = new Date().toISOString().slice(0, 10);
      // A drain pour is the strongest opinion available. Record it so the
      // bottle never resurfaces as a flight candidate.
      if (L.isDrain(reason)) { S.edits[k] = Object.assign({}, S.edits[k], { drained: true }); }
      save(); showBottle(k); renderShelf();
    };
    row.appendChild(c);
  });
  box.appendChild(row);
  body.insertBefore(box, body.firstChild);
  window.scrollTo(0, 0);
}

/* --- pick my pour --------------------------------------------------- */
function renderPourControls() {
  const styles = [...new Set(Object.values(S.catalog).map(p => p.sub))].sort();
  const sb = $('#pourStyle'); sb.innerHTML = '';
  styles.forEach(s => {
    const c = el('button', 'chip', s);
    c.setAttribute('aria-pressed', 'false');
    c.onclick = () => { const on = c.getAttribute('aria-pressed') === 'true';
      c.setAttribute('aria-pressed', !on); };
    sb.appendChild(c);
  });
  const ob = $('#pourObsc'); ob.innerHTML = '';
  ['known', 'niche', 'obscure'].forEach(o => {
    const c = el('button', 'chip', o);
    c.setAttribute('aria-pressed', 'false');
    c.onclick = () => { const on = c.getAttribute('aria-pressed') === 'true';
      c.setAttribute('aria-pressed', !on); };
    ob.appendChild(c);
  });
}

function pressed(sel) {
  return [...document.querySelectorAll(sel + ' .chip')]
    .filter(c => c.getAttribute('aria-pressed') === 'true').map(c => c.textContent);
}

function doPour() {
  const opts = {
    maxProof: parseFloat($('#pourProof').value) || null,
    style: pressed('#pourStyle'),
    obsc: pressed('#pourObsc')
  };
  const ranked = L.pickPour(S.catalog, S.bottles, opts, S.history).slice(0, 3);
  const box = $('#pourResult'); box.innerHTML = '';
  if (!ranked.length) {
    box.appendChild(el('div', 'empty', 'Nothing open matches that. Loosen a filter.'));
    return;
  }
  ranked.forEach((r, i) => {
    const p = prod(r.k);
    const c = el('div', 'sheet');
    if (i === 0) c.style.borderLeft = '3px solid var(--gold)';
    const t = el('h3', null, p.name); t.style.fontSize = i === 0 ? '19px' : '15px';
    c.appendChild(t);
    c.appendChild(el('div', 'sub', [p.dist, p.proof, p.style].join(' \u00b7 ')));
    if (r.why.length) {
      const w = el('div'); w.style.marginTop = '8px';
      r.why.forEach(x => w.appendChild(el('span', 'tag', x)));
      c.appendChild(w);
    }
    const go = el('button', 'chip', 'Pour it');
    go.style.marginTop = '8px';
    go.onclick = () => {
      S.history.push({ k: r.k, at: new Date().toISOString().slice(0, 10), kind: 'pour' });
      save(); doPour();
    };
    c.appendChild(go);
    box.appendChild(c);
  });
}

/* --- flights -------------------------------------------------------- */
function renderFlights() {
  const box = $('#flightList'); box.innerHTML = '';
  $('#flightCount').textContent = S.flights.length + ' flights';
  S.flights.forEach(f => {
    const ran = S.history.some(h => h.flight === f.title);
    const c = el('button', 'fcard' + (ran ? ' done' : ''));
    c.appendChild(el('h3', null, f.title.toLowerCase()));
    c.appendChild(el('div', 'var', L.variableOf(f)));
    const notOpen = f.core.filter(p => S.catalog[p.k] && !L.pourable(p.k, S.bottles)).length;
    c.appendChild(el('div', 'meta', f.core.length + ' core \u00b7 ' + f.ext.length + ' bench'
      + (notOpen ? ' \u00b7 ' + notOpen + ' not open' : '') + (ran ? ' \u00b7 run' : '')));
    c.onclick = () => showFlight(f);
    box.appendChild(c);
  });
}

function showFlight(f) {
  const body = $('#detailBody'); body.innerHTML = '';
  const head = el('div', 'sheet');
  const t = el('h2'); t.style.cssText = 'font-size:23px;color:var(--ink-deep)';
  t.textContent = f.title.toLowerCase();
  head.appendChild(t);
  head.appendChild(el('div', 'var', L.variableOf(f)));
  const pr = el('p'); pr.style.cssText = 'font-size:14px;margin:9px 0 0';
  pr.textContent = f.premise || '';
  head.appendChild(pr);
  body.appendChild(head);

  const prods = f.core.map(p => prod(p.k)).filter(Boolean);

  // validators
  const vbox = el('div');
  L.validate(f.core, S.catalog, { bottles: S.bottles, coreTarget: L.CORE_TARGET })
    .forEach(m => {
      const w = el('div', 'warn' + (m.level === 'ok' ? ' ok' : ''));
      w.innerHTML = '<b>' + (m.level === 'ok' ? '\u2713' : '!') + '</b> ';
      w.appendChild(document.createTextNode(m.msg));
      vbox.appendChild(w);
    });
  body.appendChild(vbox);

  // the proof ladder
  const lad = el('div', 'sheet');
  lad.appendChild(el('h3', null, 'The pours'));
  const ladder = el('div', 'ladder');
  ladder.appendChild(el('div', 'axis'));
  f.core.forEach((p, i) => {
    const pd = prod(p.k);
    const card = f.cards[i] || {};
    const spotted = /SPOTTED/i.test(card.wood || '');
    const r = el('div', 'rung ' + (spotted ? 'spot' : 'blind'));
    r.appendChild(el('div', 'pin', pd ? pd.proof : (card.proof || '')));
    r.appendChild(el('div', 'tick'));
    const b = el('div', 'body');
    b.appendChild(el('div', 'b', (p.letter || String.fromCharCode(65 + i)) + ' \u00b7 '
      + (pd ? pd.name : p.card)));
    const woodBits = pd && pd.fin ? pd.fin : (card.wood || '').split('\u2014')[0].trim();
    if (woodBits) b.appendChild(el('div', 'w', woodBits));
    r.appendChild(b);
    ladder.appendChild(r);
  });
  lad.appendChild(ladder);
  lad.appendChild(el('div', 'snack', 'Snacks: ' + L.snacksFor(prods).join(', ')));
  body.appendChild(lad);

  // bench
  if (f.ext.length) {
    const e = el('div', 'sheet');
    e.appendChild(el('h3', null, 'On the bench'));
    f.ext.forEach(x => {
      const pd = prod(x.k);
      e.appendChild(el('div', 'sub', (pd ? pd.name + ' \u00b7 ' + pd.proof : x.card)));
    });
    body.appendChild(e);
  }

  // why it is built this way
  if (f.why && f.why.length) {
    const w = el('div', 'sheet');
    w.appendChild(el('h3', null, 'Why it is built this way'));
    f.why.forEach(x => {
      const p2 = el('p'); p2.style.cssText = 'font-size:13px;margin:8px 0 0;color:var(--ink)';
      p2.textContent = x; w.appendChild(p2);
    });
    body.appendChild(w);
  }

  const act = el('div', 'sheet');
  const sms = el('button', 'btn wide', 'Text the summary');
  sms.onclick = () => {
    const bodyTxt = L.smsBody(f, prods);
    location.href = 'sms:?&body=' + encodeURIComponent(bodyTxt);
  };
  act.appendChild(sms);
  const ran = el('button', 'btn ghost wide', 'Mark as run tonight');
  ran.onclick = () => {
    S.history.push({ flight: f.title, at: new Date().toISOString().slice(0, 10),
                     pours: f.core.map(p => p.k), kind: 'flight' });
    save(); renderFlights(); showFlight(f);
  };
  act.appendChild(ran);
  body.appendChild(act);

  show('detail');
}

/* --- boot ----------------------------------------------------------- */
function boot(data) {
  S.catalog = data.catalog; S.bottles = data.bottles; S.flights = data.flights;
  load();
  renderShelfFilters(); renderShelf(); renderPourControls(); renderFlights();
  const f = el('footer');
  f.innerHTML = 'Killer B\u2019s Bottle Tracker <span id="verString">v0.1.2</span>';
  document.body.appendChild(f);
}

document.querySelectorAll('nav button').forEach(b =>
  b.onclick = () => show(b.dataset.scr));
$('#backBtn').onclick = () => show('flights');
$('#q').addEventListener('input', renderShelf);
$('#pourGo').onclick = doPour;

fetch('./data.json').then(r => r.json()).then(boot).catch(() => {
  document.body.insertBefore(
    Object.assign(document.createElement('div'), {
      className: 'warn',
      textContent: 'Could not load data.json. It must sit next to index.html.'
    }), document.body.firstChild);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}

if (typeof module !== 'undefined' && module.exports) module.exports = L;
</script>
</body>
</html>
