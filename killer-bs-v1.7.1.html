L.flightReady = function (f, catalog, bottles) {
  const core = f.core || [];
  if (!core.length) return { open: 0, total: 0, pct: 0 };
  const open = core.filter(p => catalog[p.k] && L.pourable(p.k, bottles)).length;
  return { open: open, total: core.length,
           pct: Math.round((open / core.length) * 100) };
};

L.flightRunAt = function (f, history) {
  const runs = (history || []).filter(x => x.kind === 'flight' && x.flight === f.title);
  return runs.length ? runs.map(x => x.at).sort().slice(-1)[0] : null;
};

L.flightProof = function (f, catalog) {
  const ps = (f.core || []).map(p => catalog[p.k]).filter(Boolean).map(p => p.proof);
  return ps.length ? Math.min.apply(null, ps) : Infinity;
};

L.filterFlights = function (flights, catalog, bottles, history, opts) {
  const o = opts || {};
  const q = (o.q || '').toLowerCase().trim();
  const types = o.types && o.types.length ? o.types : null;
  return (flights || []).filter(f => {
    const ran = !!L.flightRunAt(f, history);
    if (o.state === 'run' && !ran) return false;
    if (o.state === 'todo' && ran) return false;
    if (o.state === 'ready' && L.flightReady(f, catalog, bottles).pct < 100) return false;
    if (types) {
      // A flight matches a type when any of its core pours is that type.
      const subs = (f.core || []).map(p => catalog[p.k]).filter(Boolean).map(p => p.sub);
      if (!types.some(t => subs.indexOf(t) >= 0)) return false;
    }
    if (q) {
      const hay = (f.title + ' ' + (f.tag || '') + ' ' + (f.premise || '') + ' '
        + (f.core || []).map(p => (catalog[p.k] || {}).name || p.card).join(' '))
        .toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
};

L.sortFlights = function (flights, catalog, bottles, history, id) {
  const a = (flights || []).slice();
  const name = (x, y) => x.title.localeCompare(y.title);
  const cmp = {
    added: () => 0,      // the order they are in, which is the order made
    title: name,
    ready: (x, y) => L.flightReady(y, catalog, bottles).pct
                   - L.flightReady(x, catalog, bottles).pct || name(x, y),
    proof: (x, y) => L.flightProof(x, catalog) - L.flightProof(y, catalog) || name(x, y),
    // Never run sorts last rather than first: an empty date is not the oldest.
    run: (x, y) => (L.flightRunAt(y, history) || '').localeCompare(
                    L.flightRunAt(x, history) || '') || name(x, y)
  };
  // An old stored preference still says curriculum; treat it as the same
  // thing rather than silently falling through to the name sort.
  if (id === 'curriculum') id = 'added';
  return id === 'added' ? a : a.sort(cmp[id] || name);
};

L.useCount = function (key, flights, history) {
  let n = 0;
  (flights || []).forEach(f => f.core.forEach(p => { if (p.k === key) n++; }));
  (history || []).forEach(h => { if ((h.pours || []).includes(key)) n++; });
  return n;
};


/* --- snacks --------------------------------------------------------- */

// BZ's rule: simple bowls, not plates. No vinegar, no citrus -- both
// wreck the palate for the next pour. Suggestions follow the dominant
// cask, because that is what the snack has to sit beside.
L.SNACKS = {
  sherry: ['dark chocolate', 'dried cherries', 'salted pecans'],
  wine:   ['dark chocolate', 'dried figs', 'marcona almonds'],
  wood:   ['salted pecans', 'shortbread', 'toasted walnuts'],
  peat:   ['smoked almonds', 'aged cheddar', 'oatcakes'],
  plain:  ['plain crackers', 'salted almonds', 'shortbread']
};

L.snacksFor = function (prods) {
  const fin = prods.map(p => (p.fin || '')).join(' ').toLowerCase();
  const peated = prods.some(p => /laphroaig|ardbeg|lagavulin|octomore|peat|caol|bunnahabhain/i
    .test(p.name + ' ' + p.dist));
  if (peated) return L.SNACKS.peat;
  if (/ximenez|oloroso|sherry|fino|manzanilla|amontillado|cream/.test(fin)) return L.SNACKS.sherry;
  if (/port|madeira|moscatel|sauternes|bordeaux|rum|cognac|armagnac/.test(fin)) return L.SNACKS.wine;
  if (/oak|toasted|mizunara|amburana/.test(fin)) return L.SNACKS.wood;
  return L.SNACKS.plain;
};

/* --- SMS summary ---------------------------------------------------- */

// One identical text to everyone: the bottle list and the theme. Sent
// after the reveal, so it is the answer key people keep.
L.smsBody = function (flight, prods) {
  const lines = [flight.title, L.variableOf(flight)];
  prods.forEach((p, i) => {
    const letter = String.fromCharCode(65 + i);
    const bits = [p.name, p.fin, p.proof].filter(Boolean);
    lines.push(letter + ' \u00b7 ' + bits.join(', '));
  });
  lines.push('Snacks: ' + L.snacksFor(prods).join(', '));
  return lines.join('\n');
};

// The tag line carries "ONE VARIABLE: WHICH SHERRY" on most cards.
L.variableOf = function (flight) {
  const m = /ONE VARIABLE:\s*([^\u00b7]+)/i.exec(flight.tag || '');
  if (m) return 'One variable: ' + m[1].trim().toLowerCase();
  return (flight.tag || '').split('\u00b7').slice(-1)[0].trim();
};

/* =====================================================================
   STATE + RENDER
   ===================================================================== */
const S = { base: {}, catalog: {}, bottles: [], flights: [], history: [],
            edits: {}, custom: {}, deleted: {}, customFlights: [],
            filters: { status: 'open', favsOnly: false, wishOnly: false,
                       types: [], obsc: [], regions: [], bands: [],
                        proofs: [], scars: [], cask: '', age: '',
                        showTypes: false, showStatus: false,
                        sort: 'name', showMore: false },
            refGroup: 'tasting', shop: {}, lookupUrl: '', wish: [], gapBudget: 80,
            displayName: '', findable: false, matchMode: '', admin: false,
            favs: {},
            barSort: 'proof',
            log: [],
            proposals: [],
            deadGaps: {},
            fflt: { state: 'all', types: [], sort: 'added',
                    showState: false, showTypes: false },
            histTab: 'pour',
            reels: { proof: 'any', type: 'any', obsc: 'any', price: 'any' },
            held: {} };

// The effective catalog is the shipped reference data with the user's
// corrections layered on, their own bottles added, and their deletions
// hidden. Rebuilt whenever any of those three change.
function rebuildCatalog() {
  S.catalog = L.mergeCatalog(S.base, S.edits, S.custom, S.deleted);
}

const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };

const KEYS = ['history', 'edits', 'custom', 'deleted', 'customFlights',
              'bottles', 'lookupUrl', 'wish', 'displayName', 'findable',
              'admin', 'deadGaps', 'proposals', 'log', 'barSort', 'favs'];

// Private browsing and locked-down browsers throw on the first touch of
// localStorage. The app runs either way; it just cannot remember.
const CAN_STORE = (function () {
  try {
    localStorage.setItem('kb.probe', '1');
    localStorage.removeItem('kb.probe');
    return true;
  } catch (e) { return false; }
})();

function load() {
  if (!CAN_STORE) return;
  KEYS.forEach(k => {
    try {
      const raw = localStorage.getItem('kb.' + k);
      if (!raw) return;
      const val = JSON.parse(raw);
      // One corrupt key must not take the rest of the shelf down with it, and
      // a value of the wrong shape is corruption too.
      if (typeof S[k] !== typeof val
          || Array.isArray(S[k]) !== Array.isArray(val)) throw new Error('shape');
      S[k] = val;
    } catch (e) {
      console.warn('discarding unreadable ' + k, e);
      try { localStorage.removeItem('kb.' + k); } catch (e2) { /* nothing to do */ }
    }
  });
}

let _storageWarned = false;
function save_() {
  // Every local save is also a push, so the account is never behind what is
  // on the device. The guard inside fbPush keeps it quiet when signed out.
  if (FB.loaded) setTimeout(fbPush, 0);
  if (FB.loaded) setTimeout(fbPushShared, 0);
  if (FB.loaded) setTimeout(fbPushStats, 0);
  if (FB.loaded) setTimeout(fbContribute, 0);
  if (!CAN_STORE) {
    if (!_storageWarned && typeof toast === 'function') {
      _storageWarned = true;
      toast('This browser will not let the app save. Changes last until you close it.');
    }
    return;
  }
  try {
    KEYS.forEach(k => localStorage.setItem('kb.' + k, JSON.stringify(S[k])));
  } catch (e) {
    // Quota, almost always. Say so rather than failing silently, because the
    // user is about to lose an edit they think landed.
    if (typeof toast === 'function') toast('Could not save — storage is full.');
    console.warn('save failed', e);
  }
}

// Read order: your override, then the shared catalog. The UI shows which
// layer a value came from so you always know what you are trusting.
function prod(k) { return S.catalog[k] || null; }

/* --- the back gesture --------------------------------------------------

   A phone's back swipe closed the app outright, because nothing here ever
   pushed a history entry: every screen change and every modal happened
   without the browser knowing anything had changed.

   Both now push one, so back closes a modal, then walks back through the
   screens you came by, and only leaves the app when there is nothing left
   to go back to — which is what the gesture should do at the front door.  */

let _navBack = false;      // true while handling a back, so we do not re-push

/* Where each screen came FROM, so its Back goes there rather than to a
   fixed guess. A screen off the tab bar — the library, buddies, settings,
   a bottle — can be reached from several places, and "Done" that always
   lands on Home sends you back to the start of what you were doing. */
const _from = [];

function goBack() {
  const prev = _from.pop();
  show(prev || 'home', true);
  labelBacks();
}

// Say where Back goes. "Done" is fine when there is one way in and wrong
// the moment there are several — a bottle reached from the library should
// not offer to send you to the shelf.
const SCREEN_NAMES = { home: 'Home', shelf: 'the shelf', shop: 'Shop',
  pour: 'Taste', flights: 'Flights', map: 'the map', ref: 'Info',
  library: 'the library', buddies: 'buddies', shared: 'our shelves',
  settings: 'settings', diag: 'diagnostics', detail: 'the bottle' };

function labelBacks() {
  const to = _from.length ? _from[_from.length - 1] : 'home';
  const txt = '\u2039 ' + (SCREEN_NAMES[to] || 'back');
  // Every back button, found by class rather than by a list of ids — a
  // list is a thing to forget to add to, and the library button was
  // missing from it.
  document.querySelectorAll('.backbtn').forEach(b => { b.textContent = txt; });
}

// Remember where we are before leaving it.
function goTo(name) {
  const cur = document.querySelector('.screen.on');
  const id = cur && cur.id ? cur.id.replace('scr-', '') : 'home';
  if (id !== name) _from.push(id);
  show(name);
  labelBacks();
}

// Escape, for a desktop with no back gesture. Closes a modal first, then
// walks back a screen — the same order the gesture uses, so the two
// behave alike rather than being two different ideas of back.
window.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if ($('#overlay').classList.contains('on')) { closeModal(); return; }
  const cur = document.querySelector('.screen.on');
  const id = cur && cur.id ? cur.id.replace('scr-', '') : 'home';
  // Only from a screen you had to go INTO. Escape on a tab should do
  // nothing rather than quietly moving somebody off it.
  if (!document.querySelector('nav button[data-scr="' + id + '"]')) goBack();
});

window.addEventListener('popstate', ev => {
  _navBack = true;
  try {
    // A modal open at the moment of a back is what the back was for.
    if ($('#overlay').classList.contains('on')) {
      closeModal(true);
      return;
    }
    const st = ev.state;
    if (st && st.kb === 'screen' && st.scr) {
      show(st.scr);
      return;
    }
    // No state of ours left: this is the entry the app started on, so
    // going back means going home. From home, the next back leaves.
    const onHome = document.getElementById('scr-home');
    if (onHome && !onHome.classList.contains('on')) {
      show('home');
      // Replace rather than push, or home would need pressing twice.
      try { history.replaceState({ kb: 'screen', scr: 'home' }, ''); } catch (e) {}
    }
  } finally {
    _navBack = false;
  }
});

function show(name, isReturn) {
  const t = document.getElementById('scr-' + name);
  // A name with no screen behind it used to clear every screen and then
  // add the class to nothing, leaving a nav bar and a blank page. Refuse
  // rather than blank: a wrong name is a bug, and a blank page hides it.
  if (!t) {
    appLog('show: no screen called ' + name);
    return;
  }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  t.classList.add('on');
  // Not while going back, or every back would add a new entry and the
  // gesture would never reach the front door.
  if (!_navBack) {
    try { history.pushState({ kb: 'screen', scr: name }, ''); } catch (e) {}
  }
  // Arriving by the tab bar starts a fresh trail: the tabs are top level,
  // and a Back from one should not walk somebody through wherever they
  // happened to have been before pressing it.
  if (!isReturn && !_navBack
      && document.querySelector('nav button[data-scr="' + name + '"]')) {
    _from.length = 0;
  }
  // AFTER the trail is settled, or a tab arrival would label the button
  // with wherever you were before pressing it. And on every arrival however
  // the screen was reached — it used to run only inside goTo, so a screen
  // opened any other way kept whatever its button said last, which was
  // "Done": the thing this was meant to replace.
  labelBacks();
  // Settings and Detail are reached from inside the app rather than the bar,
  // so no tab is marked current while they are open.
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.scr === name ? 'page' : 'false'));
  window.scrollTo(0, 0);
}

/* --- shelf ---------------------------------------------------------- */
const STATUS_FILTERS = [['open', 'Open'], ['sealed', 'Sealed'], ['all', 'All']];

// A favourite is a property of the WHISKY rather than of a bottle: three
// bottles of the same thing are one favourite, and it survives finishing
// one and opening the next.
function isFav(k) { return !!(S.favs || {})[k]; }

function toggleFav(k, after) {
  if (!S.favs) S.favs = {};
  if (S.favs[k]) delete S.favs[k]; else S.favs[k] = 1;
  save_();
  if (after) after();
}

function favStar(k, after) {
  const b = el('button', 'favstar');
  b.type = 'button';
  b.textContent = isFav(k) ? '\u2605' : '\u2606';
  b.dataset.on = isFav(k);
  b.title = isFav(k) ? 'A favourite' : 'Mark as a favourite';
  b.setAttribute('aria-label', b.title);
  b.setAttribute('aria-pressed', isFav(k));
  b.onclick = ev => { ev.stopPropagation(); toggleFav(k, after); };
  return b;
}

function renderShelfFilters() {
  const counts = countOf('sub');
  const owned = k => Object.values(S.catalog).filter(p => {
    const n = L.ownedCount(p.k, S.bottles);
    if (!n) return false;
    const open = L.pourable(p.k, S.bottles);
    return k === 'all' || (k === 'open' ? open : !open);
  }).length;

  pickList({
    btnId: 'statusPick', listId: 'statusList', single: true,
    value: S.filters.status, allValue: 'open', allLabel: 'Open',
    open: S.filters.showStatus,
    options: STATUS_FILTERS.map(([v, label]) => [v, label, owned(v)]),
    onPick: v => { S.filters.status = v; S.filters.showStatus = false;
      renderShelfFilters(); renderShelf(); }
  });

  // Favourites as a status rather than a fourth control: you are either
  // looking at everything, or at the ones you keep coming back to.
  const nFav = Object.keys(S.favs || {})
    .filter(k => S.catalog[k] && L.ownedCount(k, S.bottles)).length;
  const favBtn = document.getElementById('favFilter');
  if (favBtn) {
    favBtn.hidden = !nFav;
    favBtn.textContent = '\u2605 ' + nFav;
    favBtn.dataset.on = !!S.filters.favsOnly;
    favBtn.title = S.filters.favsOnly ? 'Showing favourites only'
      : 'Show favourites only';
    favBtn.onclick = () => {
      S.filters.favsOnly = !S.filters.favsOnly;
      save_(); renderShelfFilters(); renderShelf();
    };
  }

  // The wishlist, on the shelf, because what you want and what you have are
  // the same question asked twice — and until now there was no screen that
  // listed it at all: seventeen references to the data and nowhere to see
  // it, reachable only by typing a name into Shop that you did not own.
  const wishBtn = document.getElementById('wishFilter');
  if (wishBtn) {
    const nWish = (S.wish || []).length;
    wishBtn.hidden = !nWish;
    wishBtn.textContent = 'Wanted ' + nWish;
    wishBtn.dataset.on = !!S.filters.wishOnly;
    wishBtn.onclick = () => {
      S.filters.wishOnly = !S.filters.wishOnly;
      if (S.filters.wishOnly) S.filters.favsOnly = false;
      save_(); renderShelfFilters(); renderShelf();
    };
  }

  pickList({
    btnId: 'typePick', listId: 'typeList',
    value: S.filters.types, allLabel: 'All types', plural: 'types',
    open: S.filters.showTypes,
    options: Object.keys(counts)
      .sort((a, b) => counts[b] - counts[a] || a.localeCompare(b))
      .map(t => [t, L.titleCase(t), counts[t]]),
    onAll: () => { S.filters.types = []; renderShelfFilters(); renderShelf(); },
    onPick: t => {
      const i = S.filters.types.indexOf(t);
      if (i < 0) S.filters.types.push(t); else S.filters.types.splice(i, 1);
      renderShelfFilters(); renderShelf();
    }
  });

  const sel = $('#sortSel');
  if (!sel.options.length) {
    L.SORTS.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.label;
      sel.appendChild(o);
    });
    sel.onchange = () => { S.filters.sort = sel.value; renderShelf(); };
  }
  sel.value = S.filters.sort;

  const n = L.activeFacets(S.filters);
  const more = $('#moreBtn');
  more.textContent = n ? 'Filters \u00b7 ' + n : 'More filters';
  more.dataset.on = n > 0;
  renderMoreFilters();
}

// One pick-list control, reused wherever a row of chips was taller than the
// list it was filtering. opts.single makes it a one-of-many chooser.
function pickList(o) {
  const btn = document.getElementById(o.btnId);
  const box = document.getElementById(o.listId);
  const chosen = o.single ? [o.value] : o.value;
  const label = o.single
    ? (o.options.find(x => x[0] === o.value) || [null, o.allLabel])[1]
    : (!chosen.length ? o.allLabel
       : chosen.length === 1 ? (o.options.find(x => x[0] === chosen[0]) || [0, chosen[0]])[1]
       : chosen.length + ' ' + (o.plural || 'selected'));
  btn.textContent = label;
  btn.dataset.on = o.single ? (o.value !== o.allValue) : chosen.length > 0;
  btn.setAttribute('aria-expanded', !!o.open);

  box.hidden = !o.open;
  if (box.hidden) return;
  box.innerHTML = '';
  if (!o.single) {
    const all = el('button', 'pickrow' + (chosen.length ? '' : ' on'), o.allLabel);
    all.setAttribute('role', 'option');
    all.onclick = () => o.onAll();
    box.appendChild(all);
  }
  o.options.forEach(([v, text, n]) => {
    const on = o.single ? o.value === v : chosen.indexOf(v) >= 0;
    const r = el('button', 'pickrow' + (on ? ' on' : ''));
    r.setAttribute('role', 'option');
    r.setAttribute('aria-selected', on);
    r.appendChild(el('span', 'tick', on ? '\u2713' : ''));
    r.appendChild(el('span', 'lbl', text));
    r.appendChild(el('span', 'num', n === undefined || n === null ? '' : String(n)));
    r.onclick = () => o.onPick(v);
    box.appendChild(r);
  });
}

// Count the shelf by any field, so a chip can carry how many it would show.
function countOf(field) {
  const c = {};
  Object.values(S.catalog).forEach(p => {
    const v = p[field];
    if (v === null || v === undefined || v === '') return;
    c[v] = (c[v] || 0) + 1;
  });
  return c;
}

// One multi-select chip row. counts may be a map of value -> n, or a list of
// [value, label, n] when the value is not the label.
function facetChips(box, key, counts, opts) {
  const o = opts || {};
  box.innerHTML = '';
  const arr = Array.isArray(counts) ? counts
    : Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b))
        .map(v => [v, L.titleCase(v), counts[v]]);
  if (o.allLabel) {
    const all = el('button', 'chip', o.allLabel);
    all.setAttribute('aria-pressed', S.filters[key].length === 0);
    all.onclick = () => { S.filters[key] = []; renderShelfFilters(); renderShelf(); };
    box.appendChild(all);
  }
  arr.forEach(([v, label, n]) => {
    if (!n) return;
    // A colon, or "Islay 39" reads as a name with a number in it and
    // "90-99 103" reads as one long number.
    const b = el('button', 'chip', label + ': ' + n);
    b.setAttribute('aria-pressed', S.filters[key].indexOf(v) >= 0);
    b.onclick = () => {
      const i = S.filters[key].indexOf(v);
      if (i < 0) S.filters[key].push(v); else S.filters[key].splice(i, 1);
      renderShelfFilters(); renderShelf();
    };
    box.appendChild(b);
  });
}

function renderMoreFilters() {
  const box = $('#moreFilters');
  box.hidden = !S.filters.showMore;
  $('#moreBtn').setAttribute('aria-expanded', !!S.filters.showMore);
  if (!S.filters.showMore) return;
  box.innerHTML = '';

  const section = (title, build) => {
    const f = el('div', 'facet');
    f.appendChild(el('div', 'fh', title));
    const row = el('div', 'scroller');
    build(row);
    f.appendChild(row);
    box.appendChild(f);
  };

  const all = Object.values(S.catalog);
  const tally = fn => {
    const c = {};
    all.forEach(p => { const v = fn(p); if (v) c[v] = (c[v] || 0) + 1; });
    return c;
  };

  section('Proof', row => facetChips(row, 'proofs',
    L.proofTens(S.catalog, S.bottles)));
  section('Recognition', row => facetChips(row, 'obsc',
    ['known', 'niche', 'obscure'].map(v => [v, L.titleCase(v), tally(p => p.obsc)[v] || 0])));
  section('Occasion', row => facetChips(row, 'bands',
    ['everyday', 'good', 'special', 'vault']
      .map(v => [v, L.titleCase(v), tally(p => L.priceBand(p.msrp))[v] || 0])));
  section('Release', row => facetChips(row, 'scars',
    ['standard', 'batched', 'limited', 'exclusive']
      .map(v => [v, L.titleCase(v), tally(p => p.scar)[v] || 0])));
  const regions = tally(p => p.region);
  if (Object.keys(regions).length) {
    section('Scotch region', row => facetChips(row, 'regions',
      L.SCOTCH_REGIONS.map(v => [v, v, regions[v] || 0])));
  }

  // Cask and age are one-of-three, not multi-select: wine and wood-only are
  // mutually exclusive by definition.
  section('Cask', row => {
    [['', 'Any'], ['wine', 'Wine cask'], ['wood', 'Wood only'], ['none', 'No finish']]
      .forEach(([v, label]) => {
        const b = el('button', 'chip', label);
        b.setAttribute('aria-pressed', (S.filters.cask || '') === v);
        b.onclick = () => { S.filters.cask = v; renderShelfFilters(); renderShelf(); };
        row.appendChild(b);
      });
  });
  section('Age', row => {
    [['', 'Any'], ['stated', 'Age stated'], ['nas', 'No age stated']]
      .forEach(([v, label]) => {
        const b = el('button', 'chip', label);
        b.setAttribute('aria-pressed', (S.filters.age || '') === v);
        b.onclick = () => { S.filters.age = v; renderShelfFilters(); renderShelf(); };
        row.appendChild(b);
      });
  });

  const cr = el('div', 'clearrow');
  cr.appendChild(el('span', null, L.activeFacets(S.filters) + ' filters on'));
  const clear = el('button', 'chip', 'Clear all');
  clear.onclick = () => {
    ['types', 'obsc', 'regions', 'bands', 'proofs', 'scars']
      .forEach(k => { S.filters[k] = []; });
    S.filters.cask = ''; S.filters.age = '';
    renderShelfFilters(); renderShelf();
  };
  cr.appendChild(clear);
  box.appendChild(cr);
}

function shelfRows() {
  const all = Object.keys(S.catalog).map(prod).filter(Boolean);
  const opts = Object.assign({}, S.filters, { q: $('#q').value });
  let hits = L.shelfSort(L.shelfFilter(all, S.bottles, opts), S.filters.sort);
  // Applied here rather than inside shelfFilter: favourites are the user's
  // own marks and live in S, while shelfFilter is a pure function over a
  // catalogue and bottles, and giving it a dependency on state it cannot
  // see would make it untestable.
  if (S.filters.favsOnly) hits = hits.filter(p => isFav(p.k));
  return hits.map(p => ({ p, open: L.pourable(p.k, S.bottles),
                          owned: L.ownedCount(p.k, S.bottles) }));
}

function renderShelf() {
  const list = $('#shelfList'); list.innerHTML = '';

  // Wishes are not on the shelf — that is the point of them — so they are
  // not in the catalogue and cannot be filtered out of it. They get their
  // own rows: a name, why you want it, and the flight it would unlock.
  if (S.filters.wishOnly) {
    const wl = (S.wish || []).slice()
      .sort((a, b) => String(b.added).localeCompare(String(a.added)));
    $('#shelfCount').textContent = wl.length + ' wanted';
    if (!wl.length) {
      list.appendChild(el('div', 'empty',
        'Nothing on the list. Search for a bottle in Shop and mark it '
        + 'wanted when you do not own it.'));
      return;
    }
    wl.forEach(w => {
      const r = el('button', 'item');
      const left = el('div');
      left.appendChild(el('div', 'nm oneline', w.name));
      const why = [w.reason, w.forFlight ? 'for ' + L.sentenceCase(w.forFlight)
        : null].filter(Boolean).join(' \u00b7 ');
      if (why) left.appendChild(el('div', 'sub', why));
      r.appendChild(left);
      if (w.est) r.appendChild(el('div', 'pf', '$' + w.est));
      // Bought is the end of wanting: it opens Shop with the name in, so
      // the lookup and the add are the next thing rather than a search
      // somebody has to retype.
      const got = el('button', 'chip pourglass', 'Got it');
      got.onclick = ev => {
        ev.stopPropagation();
        $('#shopQ').value = w.name;
        show('shop');
        renderShop();
      };
      r.appendChild(got);
      r.onclick = () => confirmDelete('\u201c' + w.name + '\u201d from the list',
        () => { S.wish = L.wishRemove(S.wish, w.name); save_();
                renderShelfFilters(); renderShelf(); });
      list.appendChild(r);
    });
    return;
  }

  const rows = shelfRows();
  // Against what you OWN, not against the catalogue. The catalogue now
  // holds library entries you have never bought, so "326 of 328" was
  // comparing your shelf to somebody else's additions and inviting exactly
  // the question of where three bottles had gone.
  const ownedAll = Object.keys(S.catalog)
    .filter(k => L.ownedCount(k, S.bottles)).length;
  $('#shelfCount').textContent = rows.length === ownedAll
    ? ownedAll + ' whiskies'
    : rows.length + ' of ' + ownedAll;

  // What the shelf adds up to, which the screen never said: how many
  // bottles behind those whiskies, how many are open, and what they cost.
  const sum = document.getElementById('shelfSum');
  if (sum) {
    const keys = rows.map(r => r.p.k);
    const mine = keys.reduce((acc, k) => acc.concat(L.myBottles(k, S.bottles)), []);
    const open = mine.filter(b => b.status === 'open').length;
    // Only 3 of 344 bottles here carry a real price — the rest are zero,
    // which is not a price. Totalling those as spent would put a confident
    // figure on screen that is wrong by two orders of magnitude, so the
    // total appears only when most bottles actually have one, and says how
    // many it is counting when they do not.
    const priced = mine.filter(b => typeof b.paid === 'number' && b.paid > 0);
    const spent = priced.reduce((a, b) => a + b.paid, 0);
    sum.textContent = [
      mine.length + (mine.length === 1 ? ' bottle' : ' bottles'),
      open + ' open',
      mine.length - open ? (mine.length - open) + ' sealed' : null,
      priced.length
        ? '$' + spent.toLocaleString() + ' across '
          + (priced.length === mine.length ? 'all of them'
             : priced.length + ' with a price')
        : null
    ].filter(Boolean).join('  \u00b7  ');
  }
  if (!rows.length) {
    // A favourites filter with nothing behind it is a specific dead end
    // and deserves its own line rather than "nothing matches".
    if (S.filters.favsOnly) {
      list.appendChild(el('div', 'empty',
        'No favourites match. Tap a star on a bottle to mark one.'));
      return;
    }
    const n = L.activeFacets(S.filters);
    // An empty shelf is not a failed search. The Flights empty state is
    // the pattern that works: say what the screen is for and offer the way
    // in, rather than leaving somebody to find a gear.
    if (!(S.bottles || []).length) {
      const e = el('div', 'sheet');
      e.appendChild(el('h3', null, 'Nothing here yet'));
      e.appendChild(el('div', 'sub',
        'Anything already in the shared library arrives with its proof, '
        + 'cask and tasting notes \u2014 you only type what it has never '
        + 'seen.'));
      const imp = el('button', 'btn wide btn-gold', 'Import a collection');
      imp.style.marginTop = '10px';
      imp.onclick = () => importDialog();
      e.appendChild(imp);
      const one = el('button', 'btn wide', 'Add one bottle');
      one.style.marginTop = '9px';
      one.onclick = () => { show('shop'); $('#shopQ').focus(); };
      e.appendChild(one);
      list.appendChild(e);
      return;
    }
    list.appendChild(el('div', 'empty', n
      ? 'Nothing matches those ' + n + ' filters.'
      : 'Nothing matches. Clear the search or switch to All.'));
    return;
  }
  rows.forEach(({ p, open, owned }) => {
    const b = el('button', 'item ' + typeClass(p) + (open ? '' : ' sealed'));
    const left = el('div');
    const nm = el('div', 'nm'); nm.innerHTML = '<span class="dot"></span>';
    nm.appendChild(document.createTextNode(p.name));
    left.appendChild(nm);
    // YOUR facts, not the whisky's. Proof and type are in the library and
    // on the bottle screen; what you paid, how many you have and whether
    // any of them are open are true only of your shelf, and were the three
    // things the row did not say.
    const mine = L.myBottles(p.k, S.bottles);
    const paid = L.paidFor(p.k, S.bottles);
    const sealed = mine.filter(x => x.status !== 'open').length;
    left.appendChild(el('div', 'sub', [
      p.dist,
      owned > 1 ? owned + ' bottles' : null,
      // Only when it says something: every bottle open is the normal case
      // and does not need announcing.
      owned > 1 && sealed && sealed < owned ? sealed + ' sealed' : null,
      owned === 1 && !open ? 'sealed' : null
    ].filter(Boolean).join(' \u00b7 ')));
    b.appendChild(left);
    b.appendChild(el('div', 'ty', L.titleCase(p.style || p.sub)));
    // What you paid, where the proof was. An average when they cost
    // different amounts, because one number for three bottles bought years
    // apart is a fiction either way and the average is the honest one.
    const pf = el('div', 'pf');
    if (paid) {
      pf.textContent = '$' + Math.round(paid.avg);
      pf.title = paid.n > 1
        ? 'Average of ' + paid.n + ' you bought' : 'What you paid';
    } else {
      pf.textContent = p.proof;
      pf.title = 'Proof \u2014 no price recorded';
      pf.style.color = 'var(--mute)';
    }
    b.appendChild(pf);
    // One tap, where the bottle already is. Only on what is open — you
    // cannot pour a sealed one without opening it first.
    // An icon, not a chip. "Poured" as a word wrapped the row onto a second
    // line for every open bottle, which is 300 extra lines on this shelf.
    b.appendChild(favStar(p.k, () => { renderShelfFilters(); renderShelf(); }));
    if (open) b.appendChild(pourIcon(p.k, renderShelf));
    b.onclick = () => showBottle(p.k);
    list.appendChild(b);
  });
}

/* --- bottle detail -------------------------------------------------- */
// The detail action row, cleared back to just Back. Whichever screen is
// opening then adds its own buttons to it.
function detailActs() {
  const row = $('#detailActs');
  while (row.children.length > 1) row.removeChild(row.lastChild);
  return row;
}

function showBottle(k) {
  S.lastList = 'shelf';
  const p = prod(k);
  const body = $('#detailBody'); body.innerHTML = '';

  // Actions go on the row that already holds Back, so the whole header is
  // one line rather than a button stranded above a row of buttons.
  const acts = detailActs();
  // The same one-tap pour as the shelf row, gold because on a bottle
  // screen it is the likeliest thing you came to do.
  const fav = el('button', 'btn btn-sm', isFav(k) ? '\u2605 Favourite'
    : '\u2606 Favourite');
  fav.onclick = () => toggleFav(k, () => showBottle(k));
  acts.appendChild(fav);

  if (L.pourable(k, S.bottles)) {
    const pb = el('button', 'btn btn-sm btn-gold', 'Poured');
    pb.onclick = () => pourNow(k, { after: () => showBottle(k) });
    acts.appendChild(pb);
  }
  const editBtn = el('button', 'btn btn-sm', 'Edit');
  editBtn.onclick = () => productForm(p);
  acts.appendChild(editBtn);
  const notesBtn = el('button', 'btn btn-sm', 'Tasting notes');
  notesBtn.onclick = () => tastingNoteForm(p);
  acts.appendChild(notesBtn);
  const spareBtn = el('button', 'btn btn-sm', '+ Another bottle');
  spareBtn.onclick = () => askStatus(p.name, st => {
    S.bottles.push({ id: L.nextBottleId(S.bottles), k: k, status: st, paid: null });
    save_(); showBottle(k); renderShelf(); renderHome();
    toast(st === 'sealed' ? 'Sealed spare added' : 'Second bottle added, open');
  });
  acts.appendChild(spareBtn);
  const delBtn = el('button', 'btn btn-sm ghost danger', 'Delete');
  delBtn.onclick = () => {
    if (!L.canDeleteProduct(k, S.bottles)) { toast('Retire its bottles first'); return; }
    confirmDelete(p.name, () => {
      S.deleted[k] = true; delete S.custom[k]; delete S.edits[k];
      S.bottles = S.bottles.filter(b => b.k !== k);
      save_(); rebuildCatalog(); renderShelf(); renderPayline(); renderHome();
      show('shelf'); toast('Removed');
    });
  };
  acts.appendChild(delBtn);
  const h = el('div', 'sheet');
  const t = el('h2'); t.style.fontSize = '21px'; t.style.color = 'var(--ink-deep)';
  t.textContent = p.name; h.appendChild(t);

  const dl = el('dl', 'kv');
  const add = (k2, v, cls) => {
    if (v === null || v === undefined || v === '') return;
    dl.appendChild(el('dt', null, k2));
    const dd = el('dd', cls); dd.textContent = v; dl.appendChild(dd);
  };
  add('Distillery', p.dist);
  add('Style', [p.sub, p.style].filter(Boolean)
    .map(L.titleCase).join(' \u00b7 '));
  add('Proof', p.proof);
  add('Age', p.age ? p.age + ' years' : 'No age stated');
  h.appendChild(dl);

  if (p.fin) {
    const f = el('div'); f.style.marginTop = '10px';
    p.fin.split('+').forEach(part => {
      f.appendChild(el('span', 'tag ' + (p.wine ? 'wine' : 'wood'),
        L.titleCase(part)));
    });
    const src = el('div', 'src', p.finc === 'stated' ? 'confirmed from the producer'
      : p.finc === 'from_cards' ? 'from your flight cards' : 'read from the label');
    f.appendChild(src);
    h.appendChild(f);
  }

  const dl2 = el('dl', 'kv'); dl2.style.marginTop = '10px';
  const add2 = (a, b2) => { if (b2 === null || b2 === undefined || b2 === '') return;
    dl2.appendChild(el('dt', null, a)); dl2.appendChild(el('dd', null, b2)); };
  add2('Region', L.titleCase(p.region));
  add2('Recognition', L.titleCase(p.obsc));
  add2('Release', L.titleCase(p.scar));
  add2('Ohio retail', L.titleCase(p.alloc));
  const prem = L.premium(p.msrp, p.sec);
  add2(prem && prem < 1 ? 'Secondary' : 'Premium', L.premiumText(prem));
  add2('MSRP', p.msrp ? '$' + p.msrp : null);
  h.appendChild(dl2);
  body.appendChild(h);

  const mine = S.bottles.filter(b => b.k === k);
  const bs = el('div', 'sheet');
  bs.appendChild(el('h3', null, mine.length > 1 ? mine.length + ' bottles' : 'Your bottle'));
  mine.forEach(b => {
    const r = el('div'); r.style.cssText =
      'display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line)';
    r.appendChild(el('span', null, b.id + ' \u00b7 ' + L.titleCase(b.status)));
    const btn = el('button', 'chip', b.status === 'sealed' ? 'Open it' : 'Retire');
    btn.onclick = () => b.status === 'sealed' ? openBottle(b, k) : retireBottle(b, k);
    r.appendChild(btn);
    bs.appendChild(r);
  });
  body.appendChild(bs);

  // The distiller's notes first: colour, nose, palate, finish.
  const tn = L.tastingNotes(p);
  if (tn.length) {
    const tb = el('div', 'sheet');
    tb.appendChild(el('h3', null, 'Tasting notes'));
    const dl3 = el('dl', 'kv tn');
    tn.forEach(n2 => {
      dl3.appendChild(el('dt', null, n2.label));
      dl3.appendChild(el('dd', null, n2.text));
    });
    tb.appendChild(dl3);
    const srcLine = L.tnSource(p);
    if (srcLine) tb.appendChild(el('div', 'src', srcLine));
    body.appendChild(tb);
  }

  // Add or correct the four columns yourself. Anything you write is marked
  // as yours, so it never passes for a note off a card.
  const tnEdit = el('button', 'chip', tn.length ? 'Edit tasting notes' : 'Add tasting notes');
  tnEdit.style.marginTop = '9px';
  tnEdit.onclick = () => tastingNoteForm(p);
  if (tn.length) {
    body.lastChild.appendChild(tnEdit);
  } else {
    const nb0 = el('div', 'sheet');
    nb0.appendChild(el('h3', null, 'Tasting notes'));
    nb0.appendChild(el('div', 'sub',
      'Nothing recorded. Add colour, nose, palate and finish as you pour it.'));
    nb0.appendChild(tnEdit);
    body.appendChild(nb0);
  }

  // Then what every source knows, and what you have written.
  const notes = L.notesFor(p, allFlights(), (S.edits[k] || {}).userNote);
  const nb = el('div', 'sheet');
  nb.appendChild(el('h3', null, 'Notes'));
  if (!notes.length) {
    nb.appendChild(el('div', 'sub', 'Nothing recorded yet.'));
  } else {
    notes.forEach(n => {
      const row = el('div', 'note');
      row.appendChild(el('div', 'nsrc', n.src));
      row.appendChild(el('div', null, n.text));
      nb.appendChild(row);
    });
  }
  const ta = document.createElement('textarea');
  ta.className = 'field'; ta.rows = 3;
  ta.placeholder = 'Your own note \u2014 how it drank, who liked it, what it sat next to';
  ta.value = (S.edits[k] || {}).userNote || '';
  ta.style.marginTop = '9px';
  nb.appendChild(ta);
  const saveNote = el('button', 'chip', 'Save note');
  saveNote.style.marginTop = '7px';
  saveNote.onclick = () => {
    const v = ta.value.trim();
    S.edits[k] = Object.assign({}, S.edits[k], { userNote: v || null });
    save_(); rebuildCatalog(); showBottle(k); toast(v ? 'Note saved' : 'Note cleared');
  };
  nb.appendChild(saveNote);
  body.appendChild(nb);

  const used = L.useCount(k, S.flights, S.history);
  if (used) {
    const u = el('div', 'sheet');
    u.appendChild(el('h3', null, 'Used in flights'));
    const fl = S.flights.filter(f => f.core.some(x => x.k === k) || f.ext.some(x => x.k === k));
    fl.forEach(f => {
      const isCore = f.core.some(x => x.k === k);
      const b2 = el('button', 'chip',
        L.sentenceCase(f.title) + (isCore ? '' : ' (bench)'));
      b2.style.marginRight = '5px';
      b2.onclick = () => showFlight(f);
      u.appendChild(b2);
    });
    body.appendChild(u);
  }
  goTo('detail');
}

function openBottle(b, k) { b.status = 'open'; showBottle(k); renderShelf(); }

function retireBottle(b, k) {
  const body = $('#detailBody');
  const box = el('div', 'sheet');
  box.appendChild(el('h3', null, 'Why is it leaving?'));
  const row = el('div', 'row'); row.style.marginTop = '8px';
  L.EXITS.forEach(reason => {
    const c = el('button', 'chip', L.titleCase(reason));
    c.onclick = () => {
      b.status = 'gone'; b.exit = reason; b.exitDate = new Date().toISOString().slice(0, 10);
      // A drain pour is the strongest opinion available. Record it so the
      // bottle never resurfaces as a flight candidate.
      if (L.isDrain(reason)) { S.edits[k] = Object.assign({}, S.edits[k], { drained: true }); }
      save_(); showBottle(k); renderShelf();
    };
    row.appendChild(c);
  });
  box.appendChild(row);
  body.insertBefore(box, body.firstChild);
  window.scrollTo(0, 0);
}

/* --- Time for a Taste: the machine ----------------------------------- */

// A Glencairn, filled to a level. The fill is the type colour, so a payout
// line reads as three different whiskies at a glance.
function glassSvg(fill, level) {
  const y = 46 - (level * 16);
  return '<svg viewBox="0 0 44 62" aria-hidden="true">'
    + '<defs><clipPath id="cg"><path d="M11 6 h22 l-2.5 20 a9 9 0 0 1-17 0 Z"/></clipPath></defs>'
    + '<rect x="0" y="' + y + '" width="44" height="30" fill="' + fill
    + '" clip-path="url(#cg)" opacity=".85"/>'
    + '<path d="M11 6 h22 l-2.5 20 a9 9 0 0 1-17 0 Z" fill="none" stroke="currentColor" '
    + 'stroke-width="1.6" stroke-linejoin="round"/>'
    + '<path d="M19.5 34 h5 l1 8 h-7 Z" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '<ellipse cx="22" cy="45" rx="9" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '<path d="M13 45 v3 a9 3.2 0 0 0 18 0 v-3" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '</svg>';
}

// Colour groups the categories by family: American grain, malt, and the
// rest of the world. Nine subcategories, six liquid colours.
const TYPE_CLASS = {
  'bourbon': 't-bourbon', 'tennessee': 't-bourbon',
  'rye': 't-rye', 'wheat': 't-rye', 'flavored': 't-rye',
  'scotch': 't-scotch',
  'irish': 't-irish',
  'american single malt': 't-malt', 'japanese': 't-malt',
  'canadian': 't-other', 'world': 't-other', 'tequila': 't-other'
};
function typeClass(p) {
  return TYPE_CLASS[(p.sub || '').toLowerCase()] || 't-other';
}
const TYPE_HEX = { 't-bourbon': '#B4762B', 't-scotch': '#5C6B63', 't-irish': '#8C8034',
                   't-rye': '#9C4A22', 't-malt': '#7A6142', 't-other': '#6B3550' };

function faceText(reelId, v) {
  const reel = L.REELS.find(r => r.id === reelId);
  const f = reel.faces.find(x => x.v === v);
  return f ? f.t : 'any';
}

// Find me a match. Only offered when somebody has actually shared a shelf,
// because an option that can never do anything is worse than no option.
function renderMatchRow() {
  const row = document.getElementById('matchRow');
  if (!row) return;
  const n = Object.keys(SHARED.shelves).length;
  row.hidden = !n;
  if (!n) return;
  row.innerHTML = '';
  const names = Object.keys(SHARED.shelves)
    .map(u => SHARED.names[u] || 'a buddy');
  [['', 'Anything I have open'],
   ['any', n === 1 ? 'Also open for ' + names[0] : 'Open for any of them'],
   ['all', n === 1 ? null : 'Open for all ' + (n + 1) + ' of us']]
    .forEach(([v, label]) => {
      if (!label) return;
      const b = el('button', 'chip', label);
      b.setAttribute('aria-pressed', (S.matchMode || '') === v);
      b.onclick = () => {
        S.matchMode = v;
        renderMatchRow();
        renderPayline();
      };
      row.appendChild(b);
    });
}

function renderReels() {
  const held = L.REELS.filter(r => S.held[r.id]).length;
  const hint = $('#holdHint');
  if (hint) {
    hint.textContent = !held
      ? 'Tap a reel to choose, or spin for a suggestion'
      : held + (held === 1 ? ' reel set \u2014 tap it and choose Any to clear'
                           : ' reels set \u2014 tap one and choose Any to clear');
  }
  renderMatchRow();
  const box = $('#reels'); box.innerHTML = '';
  L.REELS.forEach(reel => {
    const d = el('button', 'reel');
    d.type = 'button';
    d.dataset.reel = reel.id;
    d.dataset.held = !!S.held[reel.id];
    d.setAttribute('aria-pressed', !!S.held[reel.id]);
    d.appendChild(el('div', 'rl', reel.label));
    d.appendChild(el('div', 'rv', faceText(reel.id, S.reels[reel.id])));
    d.appendChild(el('div', 'hold', 'HELD'));
    // Tap to CHOOSE, not to freeze whatever came up. Holding a reel meant
    // spinning until the value you wanted appeared and then keeping it,
    // which is the wrong way round when you already know you want a rye.
    d.onclick = () => {
      pickReel(reel);
      return;
    };
    d.oncontextmenu = ev => {
      ev.preventDefault();
      S.held[reel.id] = !S.held[reel.id];
      renderReels();
    };
    box.appendChild(d);
  });
}

// Choose a value outright, with what each one means beside it. The reel
// keeps it — choosing IS holding — and Any releases it back to the spin.
function pickReel(reel) {
  const help = L.REEL_HELP[reel.id] || ['', {}];
  openModal(reel.label, m => {
    if (help[0]) m.appendChild(el('div', 'sub', help[0]));
    const list = el('div', 'recent');
    list.style.marginTop = '9px';
    reel.faces.forEach(f => {
      // How many you could actually be poured if you chose this. A face
      // that can only ever return nothing is worth knowing about before
      // you pick it rather than after.
      const trial = Object.assign({}, S.reels, { [reel.id]: f.v });
      const n = L.reelMatches(S.catalog, S.bottles, trial, S.history,
        matchOpts()).length;
      const r = el('button', 'item');
      r.style.cssText = 'width:100%;text-align:left';
      const left = el('div');
      left.appendChild(el('div', 'nm', f.t));
      const why = help[1][f.v];
      if (why) left.appendChild(el('div', 'sub', why));
      r.appendChild(left);
      r.appendChild(el('div', 'pf', n ? String(n) : '\u2014'));
      if (!n && f.v !== 'any') r.disabled = true;
      r.onclick = () => {
        S.reels[reel.id] = f.v;
        // Choosing is holding. Any means no opinion, so it stops holding.
        S.held[reel.id] = f.v !== 'any';
        save_();
        closeModal();
        renderReels();
        renderPayline();
      };
      list.appendChild(r);
    });
    m.appendChild(list);
    const close = el('button', 'btn ghost wide', 'Close');
    close.style.marginTop = '11px';
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

function doSpin() {
  const next = L.spinValid(S.reels, S.held, S.catalog, S.bottles, Math.random,
    matchOpts());
  if (!next) {
    // The holds themselves rule out everything open. Say which, rather than
    // spinning to an empty payline.
    const heldNames = L.REELS.filter(r => S.held[r.id])
      .map(r => r.label + ' ' + faceText(r.id, S.reels[r.id]));
    toast('Nothing open matches ' + heldNames.join(' and ') + '. Release a hold.');
    return;
  }
  S.reels = next;
  document.querySelectorAll('.reel').forEach(d => {
    if (S.held[d.dataset.reel]) return;
    d.classList.remove('spinning');
    void d.offsetWidth;                 // restart the animation
    d.classList.add('spinning');
  });
  renderReels();
  renderPayline();
}

// The find-a-match mode, if it is on and there is anybody to match against.
function matchOpts() {
  if (!S.matchMode) return {};
  const sets = Object.keys(SHARED.shelves).map(u => ({
    id: u, name: SHARED.names[u] || 'Buddy',
    map: L.shelfSet(SHARED.shelves[u], true)
  }));
  if (!sets.length) return {};
  return { matchWith: sets, matchAll: S.matchMode === 'all' };
}

function renderPayline() {
  const box = $('#payline'); box.innerHTML = '';
  const msg = $('#payMsg');

  // Nothing open means the machine has nothing to offer, and spinning it
  // teaches somebody the app is broken. Say what it needs instead.
  if (!Object.values(S.catalog).some(p => L.pourable(p.k, S.bottles))) {
    const e = el('div', 'sheet');
    e.appendChild(el('h3', null, 'Nothing open'));
    e.appendChild(el('div', 'sub', (S.bottles || []).length
      ? 'Everything on your shelf is sealed. Open one and this will help you '
        + 'choose between them.'
      : 'This picks something to drink from what you have open. Get your '
        + 'bottles in first.'));
    const go = el('button', 'btn wide btn-gold', (S.bottles || []).length
      ? 'Go to the shelf' : 'Add some bottles');
    go.style.marginTop = '10px';
    go.onclick = () => show('shelf');
    e.appendChild(go);
    box.appendChild(e);
    if (msg) msg.textContent = '';
    return;
  }
  const hits = L.pourGlasses(S.catalog, S.bottles, S.reels, S.history, matchOpts());
  const total = L.reelMatches(S.catalog, S.bottles, S.reels, S.history, matchOpts()).length;

  for (let i = 0; i < L.GLASSES; i++) {
    const hit = hits[i];
    const g = el('button', 'glass' + (hit ? '' : ' empty'));
    g.type = 'button';
    if (!hit) {
      g.disabled = true;
      g.innerHTML = glassSvg('none', 0);
      g.style.color = 'rgba(237,228,210,.30)';
      g.appendChild(el('div', 'gn', '\u2014'));
      box.appendChild(g);
      continue;
    }
    const p = prod(hit.k);
    const cls = typeClass(p);
    g.innerHTML = glassSvg(TYPE_HEX[cls], 1);
    g.style.color = '#EDE4D2';
    g.appendChild(el('div', 'gn', p.name));
    g.appendChild(el('div', 'gp', String(p.proof)));
    g.onclick = () => showPourChoice(p);
    box.appendChild(g);
  }

  if (!total) {
    msg.style.display = 'block';
    msg.textContent = 'Spin to pour something.';
  } else if (total > L.GLASSES) {
    msg.style.display = 'block';
    msg.textContent = total + ' bottles line up \u2014 showing the top three.';
  } else {
    msg.style.display = 'none';
  }
}

/* --- the map ---------------------------------------------------------- */

const REGION_HEX = { 'Islay': '#5C6B63', 'Speyside': '#B4762B', 'Highland': '#7A6142',
                     'Islands': '#3E6274', 'Lowland': '#8C8034', 'Campbeltown': '#9C4A22' };
const M = { full: null, view: null, pins: [], region: null, detail: null };

function ptStr(ring) {
  let s = '';
  for (let i = 0; i < ring.length; i++) {
    const p = L.project(ring[i][0], ring[i][1]);
    s += (i ? 'L' : 'M') + p[0].toFixed(4) + ' ' + p[1].toFixed(4);
  }
  return s + 'Z';
}

function applyView() {
  const v = M.view;
  $('#map').setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h);
  const z = M.full.w / v.w;

  // Crossing a detail threshold means new geometry; anything else is just a
  // new window on what is already drawn, so the pinch stays cheap.
  if (M.detail !== null && L.detailKey(z) !== M.detail) { renderMap(); return; }

  document.querySelectorAll('#map .pin').forEach(g => {
    const inRegion = !M.region || g.dataset.region === M.region;
    g.classList.toggle('dim', !inRegion);
    const c = g.querySelector('circle');
    // Divide by the zoom, not its square root: a pin holds a constant size on
    // screen. Shrinking slower than the view means pins GROW as you zoom in,
    // so a cluster could never come apart however far you pushed.
    const r = L.pinRadius(+g.dataset.n, M.full.w, +g.dataset.max || 1) / z;
    if (c) c.setAttribute('r', r.toFixed(6));

    const t = g.querySelector('text');
    if (t) {
      // A name needs room around its dot before it is worth showing.
      t.style.display = (z >= 2 && inRegion) ? '' : 'none';
      t.setAttribute('font-size', (L.mapFont(M.full.w, 'name') / z).toFixed(6));
      // Sit the name clear of the dot rather than a fixed distance above it.
      t.setAttribute('y', (+t.dataset.y - r * 1.25).toFixed(6));
    }
    const cnt = g.querySelector('.cnt');
    if (cnt) {
      const size = L.mapFont(M.full.w, 'count') / z;
      // Only when the digits fit inside the dot; a number spilling over its
      // own pin is worse than no number.
      const fits = r > size * 0.62 * String(g.dataset.n).length;
      cnt.style.display = (fits && inRegion) ? '' : 'none';
      cnt.setAttribute('font-size', size.toFixed(6));
    }
  });
}

// One surface. Everything that belongs at this zoom is drawn into it, and
// the geometry is rebuilt only when the detail set changes.
function svgEl(n) { return document.createElementNS('http://www.w3.org/2000/svg', n); }

function renderPlaceChips() {
  const box = $('#mapLayers'); box.innerHTML = '';
  L.MAP_PLACES.forEach(pl => {
    const b = el('button', 'chip', pl.label);
    b.onclick = () => {
      M.view = L.viewFor(pl, M.full);
      M.detail = null;                 // force the geometry to catch up
      renderMap();
      $('#mapPick').innerHTML = '';
    };
    box.appendChild(b);
  });
}

function renderMap() {
  const svg = $('#map');
  M.full = L.mapExtent(MAPDATA.world, 3);
  if (!M.view) M.view = Object.assign({}, M.full);
  renderPlaceChips();

  const z = M.full.w / M.view.w;
  const d = L.detailAt(z);
  M.detail = L.detailKey(z);
  svg.innerHTML = '';

  // Land. The detailed Scottish coastline is drawn over the world outline
  // once it is on, so the two simplifications never argue at the seam.
  const land = svgEl('path');
  land.setAttribute('class', 'land');
  land.setAttribute('d', MAPDATA.world.map(ptStr).join(' '));
  svg.appendChild(land);

  if (d.states) {
    const byState = L.stateCounts(S.catalog, MAPDATA.stateOf, S.bottles);
    Object.keys(MAPDATA.states).forEach(name => {
      const e = byState[name];
      const p = svgEl('path');
      p.setAttribute('class', 'state s' + L.choroStep(e ? e.total : 0));
      p.setAttribute('d', MAPDATA.states[name].map(ptStr).join(' '));
      if (e) p.onclick = ev => { ev.stopPropagation(); showKeyList(name, e.keys, e.open); };
      svg.appendChild(p);
    });
  }

  if (d.coast) {
    const c = svgEl('path');
    c.setAttribute('class', 'land coastline');
    c.setAttribute('d', MAPDATA.coast.map(ptStr).join(' '));
    svg.appendChild(c);
  }

  M.pins = [];
  if (d.countries) {
    const counts = L.countryCounts(S.catalog, MAPDATA.subCountry,
      MAPDATA.worldDist, S.bottles);
    const maxN = counts.reduce((m, c) => Math.max(m, c.total), 1);
    counts.forEach(c => {
      const pos = MAPDATA.countryPos[c.name];
      if (!pos) return;
      addPin(svg, L.project(pos[0], pos[1]), c.total, c.name, '#8A6A28', maxN,
        () => showKeyList(c.name, c.keys, c.open));
    });
  }

  if (d.usPins) {
    const { pins: us, maxN } = L.pinsInView(S.catalog, MAPDATA.usDistilleries,
      S.bottles, L.US_SUBS, M.view);
    us.forEach(pin => {
      M.pins.push(pin);
      addPin(svg, L.project(pin.lon, pin.lat), pin.total, shortName(pin.dist),
        '#7A3B1E', maxN, () => showPinBottles(pin));
    });
  }

  if (d.scotPins) {
    const { pins: sc, maxN } = L.pinsInView(S.catalog, MAPDATA.distilleries,
      S.bottles, ['scotch'], M.view);
    sc.forEach(pin => {
      M.pins.push(pin);
      addPin(svg, L.project(pin.lon, pin.lat), pin.total, shortName(pin.dist),
        REGION_HEX[pin.region] || '#6B3550', maxN, () => showPinBottles(pin));
    });
  }

  if (d.iePins) {
    const { pins: ie, maxN } = L.pinsInView(S.catalog, MAPDATA.ieDistilleries,
      S.bottles, ['irish'], M.view);
    ie.forEach(pin => {
      M.pins.push(pin);
      addPin(svg, L.project(pin.lon, pin.lat), pin.total, shortName(pin.dist),
        '#8C8034', maxN, () => showPinBottles(pin));
    });
  }

  updateCount(z, d);
  applyView();
}

function shortName(s) {
  return String(s).replace(/ Distiller(y|ies)$/, '')
    .replace(/ (Company|Distilling|Spirits|Whiskey)$/, '').replace(/^The /, '');
}

function addPin(svg, xy, n, label, fill, maxN, onTap) {
  const g = svgEl('g');
  g.setAttribute('class', 'pin');
  g.dataset.n = n; g.dataset.max = maxN; g.dataset.region = '';
  const c = svgEl('circle');
  c.setAttribute('cx', xy[0]); c.setAttribute('cy', xy[1]);
  c.setAttribute('fill', fill);
  g.appendChild(c);
  const t = svgEl('text');
  t.setAttribute('x', xy[0]); t.setAttribute('y', xy[1]);
  t.dataset.y = xy[1];
  t.setAttribute('text-anchor', 'middle');
  t.textContent = label;
  g.appendChild(t);
  const num = svgEl('text');
  num.setAttribute('class', 'cnt');
  num.setAttribute('x', xy[0]); num.setAttribute('y', xy[1]);
  num.setAttribute('text-anchor', 'middle');
  num.setAttribute('dominant-baseline', 'central');
  num.textContent = n;
  g.appendChild(num);
  g.onclick = e => { e.stopPropagation(); onTap(); };
  svg.appendChild(g);
}

function updateCount(z, d) {
  const total = Object.keys(S.catalog).length;
  let txt = total + ' whiskies';
  if (M.pins.length) {
    const bottles = M.pins.reduce((n, p) => n + p.total, 0);
    txt += ' \u00b7 ' + M.pins.length + ' distilleries in view, '
      + bottles + ' bottles';
  } else if (d.states) {
    txt += ' \u00b7 zoom in for distilleries';
  } else if (d.usPins || d.scotPins) {
    txt += ' \u00b7 no distilleries here \u2014 pan or zoom out';
  }
  $('#mapCount').textContent = txt;
  $('#mapLegend').innerHTML = '';
}

function showPinBottles(pin) {

// Pan and pinch. Pointer events cover mouse, touch and pen in one path.
function wireMap() {
  const svg = $('#map');
  const active = new Map();
  let last = null, startDist = 0, startView = null;

  const toMap = e => {
    const r = svg.getBoundingClientRect();
    return [M.view.x + ((e.clientX - r.left) / r.width) * M.view.w,
            M.view.y + ((e.clientY - r.top) / r.height) * M.view.h];
  };

  svg.addEventListener('pointerdown', e => {
    svg.setPointerCapture(e.pointerId);
    active.set(e.pointerId, e);
    if (active.size === 1) { last = toMap(e); svg.classList.add('drag'); }
    else if (active.size === 2) {
      const [a, b] = [...active.values()];
      startDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      startView = Object.assign({}, M.view);
    }
  });

  svg.addEventListener('pointermove', e => {
    if (!active.has(e.pointerId)) return;
    active.set(e.pointerId, e);
    if (active.size === 2 && startDist) {
      const [a, b] = [...active.values()];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const r = svg.getBoundingClientRect();
      const cx = startView.x + (((a.clientX + b.clientX) / 2 - r.left) / r.width) * startView.w;
      const cy = startView.y + (((a.clientY + b.clientY) / 2 - r.top) / r.height) * startView.h;
      M.view = L.zoomAbout(startView, M.full, d / startDist, cx, cy);
      applyView();
      return;
    }
    if (active.size === 1 && last) {
      const p = toMap(e);
      M.view = L.clampView({ x: M.view.x - (p[0] - last[0]), y: M.view.y - (p[1] - last[1]),
                             w: M.view.w, h: M.view.h }, M.full);
      applyView();
    }
  });

  const up = e => {
    active.delete(e.pointerId);
    if (active.size < 2) startDist = 0;
    if (!active.size) {
      last = null;
      svg.classList.remove('drag');
      // Pins are culled to the window, so the end of a pan is when the set
      // that should be on screen has changed.
      const z = M.full.w / M.view.w;
      if (L.detailAt(z).usPins) renderMap();
    }
  };
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', up);

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const p = toMap(e);
    M.view = L.zoomAbout(M.view, M.full, e.deltaY < 0 ? 1.22 : 1 / 1.22,
      p[0], p[1]);
    applyView();
  }, { passive: false });

  const step = f => {
    M.view = L.zoomAbout(M.view, M.full, f,
      M.view.x + M.view.w / 2, M.view.y + M.view.h / 2);
    applyView();
  };
  $('#zIn').onclick = () => step(1.6);
  $('#zOut').onclick = () => step(1 / 1.6);
  $('#zRe').onclick = () => {
    M.region = null; M.view = Object.assign({}, M.full); M.detail = null;
    renderMap(); $('#mapPick').innerHTML = '';
  };
}

// A bar is a question you can follow: tapping one lists the bottles behind
// it, and tapping one of those opens it. match(label) says which bottles a
// bar stands for.
function barBlock(title, rows, opts) {
  const o = opts || {};
  // Marked, because on a wide screen the charts are the only thing that
  // should pair up two across — everything else on Home is full width.
  const s = el('div', 'sheet chartcard');
  s.appendChild(el('h3', null, title));
  const b = el('div', 'bars');
  b.style.marginTop = '8px';
  rows.forEach(r => {
    const row = el(o.match ? 'button' : 'div',
      'bar' + (o.cls ? ' ' + o.cls(r) : '') + (o.match ? ' tappable' : ''));
    row.appendChild(el('div', 't', r.label));
    const track = el('div', 'track');
    const fill = el('div', 'fill');
    fill.style.width = r.pct + '%';
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el('div', 'n', String(r.n)));
    if (o.match && r.n) {
      row.onclick = () => showBarBottles(title + ': ' + r.label, o.match(r.label));
    }
    b.appendChild(row);
  });
  s.appendChild(b);
  return s;
}

// The bottles behind a bar, and a way through to each one.
// The map hands back product KEYS, the charts hand back products. Rather
// than a second list renderer, resolve the keys and use the one that works.
function showKeyList(title, keys, openCount) {
  const list = (keys || []).map(k => S.catalog[k]).filter(Boolean);
  showBarBottles(title + (openCount ? ' \u00b7 ' + openCount + ' open' : ''),
    list);
}

function showBarBottles(title, list) {
  openModal(title, m => {
    m.appendChild(el('div', 'sub', list.length
      + (list.length === 1 ? ' whisky' : ' whiskies')));
    // NOT a scrollbox. The modal already scrolls, and a scrolling box
    // inside a scrolling modal means a touch goes to one of them and the
    // other cannot be reached — which is why a long list from a chart felt
    // stuck. One scroller, the modal's.
    // Proof descending by default. A chart drill-through is a list you are
    // scanning, and alphabetical tells you nothing you did not already know
    // from the chart — the strongest first is at least an ordering with an
    // opinion in it.
    const SORTS = [
      ['proof', 'Proof', (a, b) => (b.proof || 0) - (a.proof || 0)],
      ['price', 'Price', (a, b) => (b.msrp || 0) - (a.msrp || 0)],
      ['age', 'Age', (a, b) => (b.age || 0) - (a.age || 0)],
      ['name', 'Name', (a, b) => String(a.name).localeCompare(String(b.name))]
    ];
    let sortId = S.barSort || 'proof';

    const sr = el('div', 'actionrow');
    sr.style.margin = '9px 0 0';
    SORTS.forEach(([id, label]) => {
      const c = el('button', 'chip', label);
      c.dataset.on = id === sortId;
      c.onclick = () => {
        sortId = id;
        S.barSort = id;
        save_();
        Array.from(sr.children).forEach(x =>
          { x.dataset.on = x.textContent === label; });
        draw();
      };
      sr.appendChild(c);
    });
    m.appendChild(sr);

    const box = el('div', 'recent');
    m.appendChild(box);

    const draw = () => {
      box.innerHTML = '';
      const cmp = (SORTS.find(s => s[0] === sortId) || SORTS[0])[2];
      list.slice().sort(cmp).forEach(p => {
      const openNow = L.pourable(p.k, S.bottles);
      const r = el('button', 'item ' + typeClass(p) + (openNow ? '' : ' sealed'));
      const left = el('div');
      const nm = el('div', 'nm');
      nm.innerHTML = '<span class="dot"></span>';
      nm.appendChild(document.createTextNode(p.name));
      left.appendChild(nm);
      // Show what is being sorted on, or the order looks arbitrary: a list
      // by price with only proofs down the side reads as unsorted.
      const extra = sortId === 'price' && p.msrp ? '$' + p.msrp
        : sortId === 'age' && p.age ? p.age + ' years' : null;
      left.appendChild(el('div', 'sub',
        [p.dist, extra, openNow ? 'open' : 'sealed']
          .filter(Boolean).join(' \u00b7 ')));
      r.appendChild(left);
      r.appendChild(el('div', 'pf', String(p.proof)));
      r.onclick = () => { closeModal(); showBottle(p.k); };
        box.appendChild(r);
      });
    };
    draw();

    const close = el('button', 'btn ghost wide', 'Close');
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

/* --- logging a pour ----------------------------------------------------

   The app had 325 products, 344 bottles and 36 designed flights, and had
   never recorded anybody drinking anything. Not neglect: logging one took
   five taps and lived inside a slot machine. Everything downstream is
   weaker for it — what to pour next cannot avoid what you poured last, and
   flight findings are discounted precisely BECAUSE no flight has run.

   One function, several placements, and one tap.                          */

function pourNow(k, opts) {
  const o = opts || {};
  const p = S.catalog[k];
  if (!p) return;
  const entry = L.logEntry('pour', { k: k }, o.when || L.todayISO());
  S.history.push(entry);
  save_();
  renderPayline(); renderHome();
  if (o.after) o.after();

  // Undo lives in the toast, because a one-tap control needs a one-tap
  // way back and a confirmation would defeat the point of it.
  toast('Poured ' + p.name.slice(0, 30), {
    label: 'Undo',
    action: () => {
      const i = S.history.lastIndexOf(entry);
      if (i >= 0) S.history.splice(i, 1);
      save_(); renderPayline(); renderHome();
      if (o.after) o.after();
      toast('Not poured after all');
    }
  });

  // The only moment somebody has the glass in front of them. Asked once
  // per bottle and never again, and skippable — a prompt that nags is a
  // prompt people learn to dismiss without reading.
  if (!p.tn || !p.tn.nose) askForNote(p);
}

// A pour button, wherever a bottle is.
function pourButton(k, cls, after) {
  const b = el('button', cls || 'chip', 'Poured');
  b.onclick = ev => { ev.stopPropagation(); pourNow(k, { after: after }); };
  return b;
}

// The same thing on a list row, where a word costs a whole line. A glass,
// with a label for anybody who cannot see it.
function pourIcon(k, after) {
  const b = el('button', 'pourglass');
  b.type = 'button';
  // A word, not a glyph. Every pictogram tried here read as something
  // else — U+25E0 draws a bare arc that looks like a stray line — and
  // "Pour" is four characters and unambiguous.
  b.textContent = 'Pour';
  b.title = 'Record a pour';
  b.setAttribute('aria-label', 'Record a pour');
  b.onclick = ev => { ev.stopPropagation(); pourNow(k, { after: after }); };
  return b;
}

function askForNote(p) {
  openModal('What did you get?', m => {
    m.appendChild(el('div', 'sub', p.name
      + ' has no tasting note. Yours is the only one it will ever have if '
      + 'nobody has published one \u2014 a line is plenty.'));
    const fields = {};
    ['nose', 'palate', 'finish'].forEach(k => {
      const wrap = el('label', null, L.titleCase(k));
      const inp = document.createElement('input');
      inp.className = 'field';
      inp.placeholder = k === 'nose' ? 'What it smells like'
        : k === 'palate' ? 'What it tastes like' : 'What it leaves behind';
      fields[k] = inp;
      wrap.appendChild(inp);
      m.appendChild(wrap);
    });
    const save = el('button', 'btn wide btn-gold', 'Save the note');
    save.style.marginTop = '11px';
    save.onclick = () => {
      const tn = {};
      Object.keys(fields).forEach(k => {
        const v = fields[k].value.trim();
        if (v) tn[k] = v;
      });
      if (!tn.nose && !tn.palate && !tn.finish) { closeModal(); return; }
      S.edits[p.k] = Object.assign({}, S.edits[p.k],
        { tn: Object.assign({}, p.tn, tn), tnSrc: 'mine' });
      save_(); rebuildCatalog();
      closeModal(); renderShelf(); renderHome();
      toast('Noted');
    };
    m.appendChild(save);
    const skip = el('button', 'btn ghost wide', 'Not now');
    skip.onclick = closeModal;
    m.appendChild(skip);
  });
}

function renderHome() {
  const box = $('#homeBody'); box.innerHTML = '';

  // An empty shelf gets a first screen rather than empty charts. The two
  // things a new person must do — sign in, and get some bottles in — were
  // the two hardest to find: one behind a gear icon under a card they had
  // no reason to open, the other behind a gear on another tab.
  if (!(S.bottles || []).length) {
    const w = el('div', 'sheet');
    w.appendChild(el('h3', null, 'Nothing on the shelf yet'));
    w.appendChild(el('div', 'sub',
      'This keeps what you own and what you have poured, and works out what '
      + 'your collection can teach you. Start by getting your bottles in \u2014 '
      + 'anything already in the shared library arrives with its proof, cask '
      + 'and tasting notes.'));

    const imp = el('button', 'btn wide btn-gold', 'Import a collection');
    imp.style.marginTop = '11px';
    imp.onclick = () => importDialog();
    w.appendChild(imp);
    w.appendChild(el('div', 'src',
      'A CSV from Only Drams, a spreadsheet of your own, or an export from '
      + 'here.'));

    const add = el('button', 'btn wide', 'Add one bottle');
    add.style.marginTop = '9px';
    add.onclick = () => { show('shop'); $('#shopQ').focus(); };
    w.appendChild(add);

    if (!FB.user) {
      const si = el('button', 'btn wide ghost', 'Sign in to keep it');
      si.style.marginTop = '9px';
      si.onclick = fbSignIn;
      w.appendChild(si);
      w.appendChild(el('div', 'src',
        'Without signing in the shelf lives in this browser only. Signing in '
        + 'keeps it on your account and reaches it from your phone.'));
    }
    box.appendChild(w);
    return;
  }

  // The handful of things somebody actually came here to do.
  // Its own class, not sortrow. sortrow is a single non-wrapping line —
  // right for a sort control with two chips, wrong for four action chips,
  // which ran off the right edge and took the page width with them.
  const doing = el('div', 'actionrow');
  // Four became three, and one of those four was a duplicate: Add a bottle
  // and What to look for both opened Shop. Import is a once-ever thing and
  // lives under the Shelf gear. Buddies comes out of the gear, because it
  // is the half of the app nobody can find.
  [['Pour', () => { renderReels(); renderPayline(); renderHistory();
                    show('pour'); }],
   ['Add', () => { show('shop'); $('#shopQ').focus(); }],
   ['Buddies', () => showBuddiesScreen()],
   ['Library', () => { renderLibraryScreen(); goTo('library'); }]]
    .forEach(([label, fn]) => {
    const b = el('button', 'chip', label);
    b.onclick = fn;
    doing.appendChild(b);
  });
  box.appendChild(doing);

  // Only when there is a shelf worth keeping and it is not kept anywhere.
  // Somebody with nothing to lose does not need reminding; somebody who has
  // spent an evening typing bottles in should be told it lives in one
  // browser.
  if (!FB.user && (S.bottles || []).length) {
    const keep = el('div', 'sheet');
    keep.appendChild(el('h3', null, 'This shelf is in one browser'));
    keep.appendChild(el('div', 'sub',
      'Signing in keeps it on your account, reaches it from your phone, and '
      + 'lets you share it with a tasting buddy.'));
    const si = el('button', 'btn wide btn-gold', 'Sign in with Google');
    si.style.marginTop = '10px';
    si.onclick = fbSignIn;
    keep.appendChild(si);
    box.appendChild(keep);
  }

  // What you did, before what you have. Charts are a monthly curiosity;
  // pouring is every evening, and the log was at the very bottom under the
  // charts and the map.
  if ((S.history || []).length) {
    const hist = el('div');
    box.appendChild(hist);
    renderHistory(hist, true);
  }

  const stats = L.shelfStats(S.catalog, S.bottles);
  const val = L.shelfValue(S.catalog, S.bottles);

  const tiles = el('div', 'tiles');
  [[stats.bottles, 'bottles on the shelf'],
   [stats.open, 'open and pourable'],
   [stats.products, 'different whiskies'],
   ['$' + val.msrp.toLocaleString(), 'shelf value at MSRP'],
   [allFlights().length, 'flights designed'],
   [S.history.filter(x => x.kind === 'flight').length, 'flights run']
  ].forEach(([v, l]) => {
    const t = el('div', 'tile');
    t.appendChild(el('div', 'v', String(v)));
    t.appendChild(el('div', 'l', l));
    tiles.appendChild(t);
  });
  box.appendChild(tiles);

  const live = Object.values(S.catalog);
  const where = fn => live.filter(fn);

  // The two long charts sit side by side at the top; the three short scales
  // run beneath them, so nothing tall is stranded next to something short.
  box.appendChild(barBlock('By type',
    L.barRows(L.countBy(live, p => L.titleCase(p.sub))),
    { match: v => where(p => L.titleCase(p.sub) === v) }));

  const scotch = live.filter(p => p.sub === 'scotch' && p.region);
  if (scotch.length) {
    box.appendChild(barBlock('Scotch by region',
      L.barRows(L.countBy(scotch, p => p.region)),
      { match: v => where(p => p.region === v) }));
  }

  box.appendChild(barBlock('Open or sealed', L.barRows({
    Open: stats.open, Sealed: stats.sealed
  }, { keepOrder: true }), {
    cls: r => 'b-' + r.label.toLowerCase(),
    match: v => where(p => L.pourable(p.k, S.bottles) === (v === 'Open'))
  }));

  // Recognition and occasion are ordered scales, so they keep their order
  // rather than being sorted by size -- a scale read out of sequence is
  // harder to read, not easier.
  const obscCounts = { Known: 0, Niche: 0, Obscure: 0 };
  live.forEach(p => { const k = L.titleCase(p.obsc); if (k in obscCounts) obscCounts[k]++; });
  box.appendChild(barBlock('Recognition', L.barRows(obscCounts, { keepOrder: true }),
    { match: v => where(p => L.titleCase(p.obsc) === v) }));

  const bandCounts = { Everyday: 0, Good: 0, Special: 0, Vault: 0 };
  live.forEach(p => { const b = L.priceBand(p.msrp);
    if (b) bandCounts[L.titleCase(b)]++; });
  box.appendChild(barBlock('Occasion', L.barRows(bandCounts, { keepOrder: true }),
    { match: v => where(p => L.priceBand(p.msrp) === v.toLowerCase()) }));

  // The map, small, on the home page.
  const mapCard = el('div', 'sheet');
  mapCard.appendChild(el('h3', null, 'Where it comes from'));
  const wrap = el('div', 'mapwrap');
  wrap.style.marginTop = '8px';
  const mini = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  mini.setAttribute('id', 'homeMap');
  mini.setAttribute('class', 'homemap');
  mini.style.width = '100%';
  wrap.appendChild(mini);
  mapCard.appendChild(wrap);
  const go = el('button', 'chip', 'Open the map');
  go.style.marginTop = '8px';
  go.onclick = () => show('map');
  mapCard.appendChild(go);
  box.appendChild(mapCard);
  drawHomeMap();

}

// A still world map for the home page: the same land and dots as the map
// screen's world layer, without the gestures.
function drawHomeMap() {
  const svg = document.getElementById('homeMap');
  if (!svg || !MAPDATA.world || !MAPDATA.world.length) return;
  svg.innerHTML = '';
  const ext = L.mapExtent(MAPDATA.world, 3);
  svg.setAttribute('viewBox', [ext.x, ext.y, ext.w, ext.h].join(' '));
  const land = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  land.setAttribute('class', 'land');
  land.setAttribute('d', MAPDATA.world.map(ptStr).join(' '));
  svg.appendChild(land);
  const cc = L.countryCounts(S.catalog, MAPDATA.subCountry, MAPDATA.worldDist, S.bottles);
  const maxN = cc.reduce((m, c) => Math.max(m, c.total), 1);
  cc.forEach(c => {
      const pos = MAPDATA.countryPos[c.name];
      if (!pos) return;
      const [x, y] = L.project(pos[0], pos[1]);
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', x); dot.setAttribute('cy', y);
      dot.setAttribute('r', L.pinRadius(c.total, ext.w, maxN));
      dot.setAttribute('fill', '#8A6A28');
      dot.setAttribute('opacity', '.82');
      svg.appendChild(dot);
    });
}

    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const hostHtml = () => {

    const cols = part.columns;
    const head = `<tr><th></th><th>Colour</th><th>Nose</th><th>Palate</th>
      <th>Finish</th><th>${esc(cols[0][0])}</th><th>${esc(cols[1][0])}</th></tr>`;
    const prompt = `<tr class="prompt"><td></td>
      <td>${esc(part.prompts.colour)}</td><td>${esc(part.prompts.nose)}</td>
      <td>${esc(part.prompts.palate)}</td><td>${esc(part.prompts.finish)}</td>
      <td>${esc(cols[0][1])}</td><td>${esc(cols[1][1])}</td></tr>`;
    const rows = part.rows.map(r =>
      `<tr class="blank"><td class="lt">${esc(r.letter)}</td>
       <td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join('');
    return `<div class="pg"><h1>${esc(part.title)}</h1>
      <p class="given">${esc(part.given)}</p>
      <p class="sub">${esc(part.theme)}</p>
      <table>${head}${prompt}${rows}</table>
      <p class="sub" style="margin-top:4mm">Look, then smell, then taste, then
        wait. Fill the colour box before you nose it. A defensible wrong answer
        beats a blank.</p></div>`;
  };

  const body = which === 'host' ? hostHtml()
             : which === 'sheet' ? partHtml()
             : hostHtml() + partHtml();
  return '<!doctype html><meta charset="utf-8"><title>'
    + esc(f.title) + '</title>' + css + body;
}
