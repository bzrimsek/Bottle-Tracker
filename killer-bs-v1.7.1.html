/**
 * Fill in a shelf, one bottle at a time, in front of you.
 *
 * Every result is applied to YOUR edits, never to the shared catalogue —
 * one person's bad note must not become everyone's. Progress is written as
 * it goes, so stopping halfway keeps what it found, and it can be stopped
 * at any point because 300 lookups is a long wait and nobody should be
 * trapped in it.
 */
function showEnhance(queue) {
  let stop = false, done = 0, filled = 0, missed = 0;
  openModal('Filling in your shelf', m => {
    if (!S.lookupUrl) {
      m.appendChild(el('div', 'errs',
        'This needs the lookup service. Settings, Advanced, Bottle lookup.'));
      const c = el('button', 'btn ghost wide', 'Close');
      c.onclick = closeModal; m.appendChild(c);
      return;
    }
    // What it will do, how long, and what it costs, before it starts. It
    // opened on a Start button and a sentence, which is not enough to
    // decide with.
    const secs = queue.length * 6;
    // No price. What a lookup costs is BZ's to know while he is the one
    // paying for it, and a number in cents on the screen turns a useful
    // thing into one people hesitate over.
    m.appendChild(el('div', 'sub',
      queue.length + ' bottles have no tasting notes. It asks about each one '
      + 'in turn \u2014 about ' + (secs < 90 ? secs + ' seconds'
        : Math.round(secs / 60) + ' minutes')
      + '. Anything it finds is saved as it goes, so stopping halfway keeps '
      + 'what it found.'));
    m.appendChild(el('div', 'src',
      'It writes to your own shelf, never to the shared library, and never '
      + 'over a note you have written yourself.'));

    const bar = el('div', 'rs');
    bar.style.marginTop = '10px';
    m.appendChild(bar);
    const log = el('div', 'recent scrollbox');
    // Its own scroll, and tall enough to be worth scrolling. The inline
    // max-height was overriding the class's while leaving overflow to it,
    // which worked — but newest-on-top meant the earlier ones were pushed
    // out of a fixed box you then had to fight to reach.
    log.style.cssText = 'max-height:40vh;overflow-y:auto;margin-top:8px';
    m.appendChild(log);

    const go = el('button', 'btn wide btn-gold', 'Start');
    go.style.marginTop = '11px';
    m.appendChild(go);
    const close = el('button', 'btn ghost wide', 'Close');
    close.onclick = () => { stop = true; closeModal(); };
    m.appendChild(close);

    const note = (name, what, ok) => {
      const r = el('div', 'item');
      const left = el('div');
      left.appendChild(el('div', 'nm', name));
      left.appendChild(el('div', 'sub', what));
      r.appendChild(left);
      r.appendChild(el('div', 'pf', ok ? '\u2713' : '\u00b7'));
      // Appended, not prepended: a run reads top to bottom like a log, and
      // the view follows the newest line rather than jumping to it.
      const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
      log.appendChild(r);
      if (atBottom) log.scrollTop = log.scrollHeight;
    };

    go.onclick = async () => {
      if (go.textContent === 'Stop') { stop = true; return; }
      go.textContent = 'Stop';
      bar.textContent = 'Starting\u2026';
      const began = Date.now();
      for (const p of queue) {
        if (stop) break;
        // The bottle it is on, not just a number: a name moving is proof
        // it is working, where a counter alone could be stuck.
        const per = done ? (Date.now() - began) / done : 6000;
        const left = Math.round((queue.length - done) * per / 1000);
        bar.textContent = (done + 1) + ' of ' + queue.length + '  \u00b7  '
          + p.name.slice(0, 28) + (p.name.length > 28 ? '\u2026' : '')
          + (done ? '  \u00b7  about ' + (left < 90 ? left + 's'
              : Math.round(left / 60) + ' min') + ' left' : '');
        try {
          const r = await fetch(L.lookupUrl(S.lookupUrl, p.name));
          const res = L.parseLookup(await r.json());
          const take = res ? L.enhanceDiff(p, res) : null;
          if (take) {
            // Into YOUR edits. The shared catalogue stays read-only.
            S.edits[p.k] = Object.assign({}, S.edits[p.k], take);
            if (take.tn) S.edits[p.k].tnSrc = 'model';
            // Straight to the library. Everything here came from a lookup
            // that was checked before it was applied.
            fbPublishToLibrary(Object.assign({}, p, take,
              { src: { lookup: true } }));
            filled++;
            rebuildCatalog();
            save_();
            note(p.name, Object.keys(take).join(', '), true);
          } else {
            missed++;
            note(p.name, 'nothing found', false);
          }
        } catch (e) {
          missed++;
          appLog('fill failed for ' + p.name + ': ' + (e.message || e));
          note(p.name, (e.message || String(e)).slice(0, 60), false);
        }
        done++;
      }
      bar.textContent = (stop ? 'Stopped. ' : 'Done. ') + filled
        + ' filled in, ' + missed + ' with nothing to find.';
      go.textContent = 'Start';
      go.disabled = true;
      renderShelf(); renderShelfFilters(); renderHome();
    };
  });
}

  const lines = [
    [sum.add, 'new bottles to add', 'ok'],
    [sum.exists, 'already on your shelf \u2014 added as a sealed spare each', 'info'],
    [sum.duplicate, 'repeated inside the file \u2014 skipped', 'warn'],
    [sum.skip, 'skipped, no usable proof', 'warn']

    row.appendChild(el('div', null, n + ' ' + label));

  });

  if (flagged.length) {
    const fl = el('div');

    out.appendChild(el('div', 'errs', 'Nothing in that file can be imported.'));

    const added = runImport(prep);
    closeModal();
    renderShelf(); renderShelfFilters(); renderHome(); renderPayline();
    toast(added.products + ' whiskies, ' + added.bottles + ' bottles imported');
  };
  out.appendChild(go);
}

// Commit. Existing whiskies gain a bottle rather than a duplicate product,
// which is what a re-import of the same export should do.
function runImport(prep) {
  let products = 0, bottles = 0;
  prep.rows.forEach(r => {
    if (r.action === 'duplicate' || r.action === 'skip') return;
    let key = r.match;
    if (r.action === 'add') {
      const np = L.normalizeProduct({
        name: r.name, dist: r.dist || '', proof: r.proof, sub: r.sub,
        age: r.age, msrp: r.msrp, sec: r.sec, fin: r.fin || '', size: r.size
      });
      if (S.catalog[np.k]) { key = np.k; }
      else {
        np.finc = np.fin ? 'stated' : null;
        if (r.notes) np.notes = r.notes;
        S.custom[np.k] = np;
        delete S.deleted[np.k];
        key = np.k;
        products++;
      }
    }
    if (!key) return;
    S.bottles.push({ id: L.nextBottleId(S.bottles), k: key,
                     status: r.action === 'exists' ? 'sealed' : r.status,
                     paid: r.paid || null });
    bottles++;
  });
  save_(); rebuildCatalog();
  return { products: products, bottles: bottles };
}

/* --- shopping --------------------------------------------------------- */

// What the shelf is missing, ranked by what a purchase would unlock.
// Real bottles that would fill a described gap, with a budget, because the
// useless answer to every gap is an expensive famous bottle.
const CAND_CACHE = {};
function CAND_CACHE_CLEAR() {
  Object.keys(CAND_CACHE).forEach(k => { delete CAND_CACHE[k]; });
}
// Gaps proved impossible. Kept for the session so the shelf stops offering
// something the house does not make.
// Persisted, not per-session: a house that does not make a finished
// bottling still will not next week, and re-offering it wastes the same
// click again.
//
// Read through S every time rather than captured into a const: a top-level
// const evaluates when the script is PARSED, which is before load() reads
// localStorage. It captured an empty object every time, and the first write
// then pushed that empty object back over the saved list — so this did not
// merely fail to remember, it actively forgot.
function deadGaps() {
  if (!S.deadGaps || typeof S.deadGaps !== 'object') S.deadGaps = {};
  return S.deadGaps;
}

function candKey(g, budget) { return L.shopNorm(g.name) + '|' + budget; }

function showCandidates(g) {
  openModal(g.name, m => {
    m.appendChild(el('div', 'sub', g.why));

    const brow = el('div', 'lookrow');
    brow.style.marginTop = '10px';
    const bl = el('label', null, 'Budget');
    bl.style.cssText = 'font-size:12px;color:var(--mute);display:flex;'
      + 'align-items:center;gap:6px';
    const budget = document.createElement('input');
    budget.type = 'number'; budget.className = 'field';
    budget.style.cssText = 'width:110px;padding:7px 9px';
    budget.value = S.gapBudget || 80;
    bl.appendChild(budget);
    brow.appendChild(bl);
    const find = el('button', 'btn btn-sm btn-gold',
      CAND_CACHE[candKey(g, S.gapBudget)] ? 'Ask again' : 'Find bottles');
    brow.appendChild(find);
    const msg = el('div', 'looknote');
    brow.appendChild(msg);
    m.appendChild(brow);

    const out = el('div');
    m.appendChild(out);

    // Show what was found last time for this gap and budget, so re-opening
    // does not silently ask a different question and get a different answer.
    const cached = CAND_CACHE[candKey(g, S.gapBudget)];
    if (cached) {
      msg.className = 'looknote';
      msg.textContent = 'Found earlier. Change the budget or ask again.';
      renderCandidateList(out, cached, g);
    }

    find.onclick = async () => {
      const wanted = parseFloat(budget.value) || 80;
      const again = wanted === S.gapBudget && CAND_CACHE[candKey(g, wanted)];
      S.gapBudget = wanted;
      if (!S.lookupUrl) {
        msg.className = 'looknote';
        msg.textContent = 'Set up the lookup service in Settings first.';
        return;
      }
      find.disabled = true;
      msg.className = 'looknote';
      msg.textContent = 'Looking\u2026';
      out.innerHTML = '';
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 40000);
        const r = await fetch(S.lookupUrl, {
          method: 'POST', signal: ctrl.signal,
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ mode: 'candidates', gap: g.name, why: g.why,
            dist: g.dist || null, region: g.region || null, sub: g.sub || null,
            budget: S.gapBudget, owned: L.gapOwned(g, S.catalog) })
        });
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        let res = L.parseCandidates(await r.json(), S.catalog, S.gapBudget, g);

        // Empty at this budget is usually about the budget. Ask once more
        // without one and show the cheapest that fits the gap, rather than
        // making somebody guess a number and press again — the question was
        // what would fill this gap, and an empty answer does not answer it.
        if (!res || !res.bottles.length) {
          msg.textContent = 'Nothing at $' + S.gapBudget
            + '. Looking for the cheapest that fits\u2026';
          const r2 = await fetch(S.lookupUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ mode: 'candidates', gap: g.name,
              why: g.why, dist: g.dist || null, region: g.region || null,
              sub: g.sub || null, owned: L.gapOwned(g, S.catalog) })
          });
          if (r2.ok) {
            // No budget passed to the parser either, or it would filter
            // out the very answers this second ask exists to find.
            const wide = L.parseCandidates(await r2.json(), S.catalog, null, g);
            if (wide && wide.bottles.length) {
              wide.bottles.sort((a, b) => (a.price || 1e9) - (b.price || 1e9));
              wide.bottles = wide.bottles.slice(0, 3);
              wide.overBudget = true;
              wide.note = 'Nothing at $' + S.gapBudget
                + '. The cheapest that fits the gap:';
              res = wide;
            }
          }
        }

        if (!res || !res.bottles.length) {
          // A live search genuinely returns nothing sometimes. Say so, and
          // keep whatever was found before rather than blanking the panel.
          // Three different empty answers, and they must not read alike:
          // nothing exists, nothing genuine came back, nothing affordable.
          // Only the last is about money.
          const nRej = (res && res.rejected) ? res.rejected.length : 0;
          msg.className = 'looknote warn2';
          msg.textContent = nRej
            ? nRej + ' came back from other distilleries and were dropped. '
              + 'Nothing genuine.'
            : (cached ? 'Nothing new. Showing the earlier find.'
                      // Not "nothing exists" — that is a claim about the
                      // world, and what actually happened is that this
                      // search came back empty. Say which, and offer the
                      // one thing that might change it.
                      : 'Nothing came back. Try a higher budget, or the '
                        + 'search may simply have missed.');
          if (cached) { renderCandidateList(out, cached, g); return; }
          // Dead either way, and the rejected case is the STRONGER signal.
          // A search that returns nothing might have missed; a search that
          // returns only bottles from other distilleries has been told the
          // house does not make the thing, and offered substitutes instead.
          // Treating that as "not proven" is why Buffalo Trace came back
          // every time the list was worked out again.
          {
            deadGaps()[L.gapKey(g)] = 1;
            save_();
          }

          // The house does not make it. The observation underneath is still
          // true, so offer the question that CAN be answered rather than
          // leaving a dead end at the top of the list.
          const alt = L.reframeGap(g, S.catalog);
          if (alt) {
            deadGaps()[L.gapKey(g)] = 1;
            save_();
            const box2 = el('div', 'sheet');
            box2.style.marginTop = '10px';
            box2.appendChild(el('h3', null, 'Try it another way'));
            box2.appendChild(el('div', 'sub', alt.why));
            const go = el('button', 'btn wide btn-gold', alt.name);
            go.style.marginTop = '9px';
            go.onclick = () => { closeModal(); showCandidates(alt); };
            box2.appendChild(go);
            out.innerHTML = '';
            out.appendChild(box2);
          }
          return;
        }
        // Verified before it is shown, never after: a bottle on screen has
        // already been acted on by the time a caveat arrives.
        msg.textContent = 'Checking ' + res.bottles.length + ' of them exist\u2026';
        const vres = await verifyCandidates(res, g);
        if (!vres.bottles.length) {
          msg.className = 'looknote warn2';
          msg.textContent = vres.unverified.length
            ? vres.unverified.length + ' suggestion(s) could not be found as '
              + 'real bottles and were dropped.'
            : 'Nothing came back.';
          return;
        }
        res = vres;
        CAND_CACHE[candKey(g, S.gapBudget)] = res;
        msg.className = res.overBudget ? 'looknote' : 'looknote ok';
        msg.textContent = res.overBudget
          ? 'Nothing at $' + S.gapBudget + '. The cheapest that fits is below.'
          : res.bottles.length + ' checked and real'
            + (res.unverified && res.unverified.length
               ? ', ' + res.unverified.length + ' dropped as not found' : '')
            + (again ? ', asked again' : '')
            + (res.rejected && res.rejected.length
               ? ', ' + res.rejected.length + ' dropped as substitutes' : '')
            + '.';
        renderCandidateList(out, res, g);
      } catch (e) {
        appLog('candidates failed: ' + (e.message || e));
        msg.className = 'looknote warn2';
        msg.textContent = e.message;
      } finally {
        find.disabled = false;
      }
    };

    const close = el('button', 'btn ghost wide', 'Close');
    close.style.marginTop = '11px';
    close.onclick = closeModal;
    m.appendChild(close);

    // Tapping the recommendation IS the request. Making you press Find
    // bottles as well was asking the same question twice.
    if (!cached && S.lookupUrl) find.click();
  });
}

/**
 * Check a suggestion is a real bottle, by asking about it on its own.
 *
 * The flight builder does exactly this and it is why it can be trusted: it
 * proposes, then verifies every name and drops what does not check out.
 * A suggestion has been through no such thing — asking a model to name
 * bottles that fit a gap and then believing the names is the whole problem.
 *
 * The single-bottle lookup is a separate question with its own search, so a
 * name that was assembled rather than found tends to come back empty or
 * with nothing that matches. Not proof, but a real second opinion, and it
 * is the same mechanism already trusted elsewhere in the app.
 */
async function verifyCandidates(res, g) {
  if (!S.lookupUrl || !res || !res.bottles.length) return res;
  const checked = [];
  for (const b of res.bottles) {
    try {
      const r = await fetch(L.lookupUrl(S.lookupUrl, b.name));
      const found = L.parseLookup(await r.json());
      // It has to come back, AND come back as the same bottle.
      const same = found && L.nameAgrees(b.name, found.name);
      b.verified = !!same;
      if (same) {
        // Take the lookup's numbers over the suggestion's: one is an answer
        // about this bottle, the other was produced while listing five.
        if (found.proof) b.proof = found.proof;
        if (found.msrp && !b.price) b.price = found.msrp;
        if (found.dist) b.dist = found.dist;
      }
    } catch (e) {
      b.verified = false;
    }
    checked.push(b);
  }
  const real = checked.filter(b => b.verified);
  return {
    bottles: real.length ? real : [],
    note: res.note,
    rejected: res.rejected || [],
    unverified: checked.filter(b => !b.verified).map(b => b.name),
    overBudget: res.overBudget
  };
}

function renderCandidateList(out, res, g) {
  if (res.note) out.appendChild(el('div', 'rs', res.note));
  const list = el('div', 'recent');
  list.style.marginTop = '8px';
  res.bottles.forEach(b => {
    const r = el('button', 'item');
    const left = el('div');
    left.appendChild(el('div', 'nm', b.name));
    left.appendChild(el('div', 'sub',
      [b.dist, b.proof ? b.proof + ' proof' : null, b.why]
        .filter(Boolean).join(' \u00b7 ')));
    r.appendChild(left);
    r.appendChild(el('div', 'pf', b.price ? '$' + b.price : '\u2014'));
    // Straight into the judging half, with the name filled in.
    r.onclick = () => {
      closeModal();
      // Carry what was just found. Asking you to look up a bottle we have
      // this second been told the proof and price of is absurd.
      S.shop = { name: b.name };
      if (b.proof) S.shop.proof = String(b.proof);
      if (b.price) S.shop.msrp = String(b.price);
      if (b.dist) S.shop.dist = b.dist;
      S.shopFound = b.name;
      $('#shopQ').value = b.name;
      renderShop();
    };
    list.appendChild(r);
  });
  out.appendChild(list);
  out.appendChild(el('div', 'src',
    'Suggested, not verified. Anything already on your shelf is filtered '
    + 'out; the rest is worth checking before you buy.'));
}

function renderGaps(box) {
  const gaps = L.shelfGaps(S.catalog, S.bottles, allFlights(), S.wish,
    S.history, deadGaps());
  const card = el('div', 'sheet');
  const hd = el('div', 'hdr');
  hd.style.marginBottom = '4px';
  hd.appendChild(el('h3', null, 'What to look for'));
  // Worked out from the shelf every time this screen draws, so a refresh is
  // only ever needed after something changed elsewhere — but when a finding
  // looks stale, pressing something beats wondering.
  const again = el('button', 'chip', 'Work it out again');
  again.onclick = () => {
    // Clears the cached ANSWERS, never the ruled-out list. A finding proved
    // unanswerable stays ruled out — resurrecting it is how somebody ends
    // up on the same goose chase twice, which is what a refresh button did.
    CAND_CACHE_CLEAR();
    renderShop();
    const n = Object.keys(deadGaps()).length;
    toast('Recalculated' + (n ? ' \u2014 ' + n + ' still ruled out' : ''));
  };
  hd.appendChild(again);
  card.appendChild(hd);
  card.appendChild(el('div', 'sub',
    'Worked out from your own shelf: houses worth going further into, '
    + 'contrasts you cannot currently taste, and dimensions too thin to '
    + 'compare. Type a name above to judge a specific bottle instead.'));

  if (!gaps.length) {
    card.appendChild(el('div', 'empty', 'Nothing obvious is missing.'));
    box.appendChild(card);
    return;
  }

  const KIND_LABEL = { flight: 'Unlocks a flight', wish: 'You wanted it',
    extend: 'Goes further', contrast: 'The other side',
    region: 'Thin region', category: 'Thin category', proof: 'Proof range',
    pair: 'No matched pair' };

  // Four recommendations. The rest are behind a disclosure, because a
  // ranked list stops being advice somewhere around the fifth item and the
  // tail was six entries all saying the same thing about matched pairs.
  const TOP = 4;
  let rest = null, restBox = null;
  if (gaps.length > TOP) {
    restBox = el('details', 'gapmore');
    const sum = el('summary');
    sum.textContent = (gaps.length - TOP) + ' more, ranked below these';
    restBox.appendChild(sum);
    rest = el('div');
    restBox.appendChild(rest);
  }
  const place = (g, i) => (i < TOP ? card : rest);

  gaps.forEach((g, gi) => {
    const r = el('button', 'find f-'
      + (g.kind === 'flight' || g.kind === 'extend' ? 'ok' : 'info'));
    r.style.width = '100%';
    r.style.textAlign = 'left';
    const body = el('div');
    const nm = el('div', 'nm', g.name);
    if (g.owned) nm.appendChild(el('span', 'pourtag blend', 'you own it'));
    body.appendChild(nm);
    body.appendChild(el('div', 'sub', g.why));
    // The flight's own name, where there is one, as a label rather than as
    // the explanation — it only means something if you remember writing it.
    if (g.flight) {
      body.appendChild(el('div', 'src', L.sentenceCase(g.flight)));
    }
    r.appendChild(el('div', 'm',
      g.kind === 'flight' ? '\u2605'
      : g.kind === 'extend' ? '\u2197'
      : g.kind === 'contrast' ? '\u21c4' : '\u00b7'));
    r.appendChild(body);
    // Dismissable directly. Ruling something out only when a search came
    // back empty meant running a search you already knew would fail, just
    // to make a finding go away.
    const no = el('button', 'dismiss');
    no.type = 'button';
    no.textContent = '\u00d7';
    no.title = 'Not interested';
    no.setAttribute('aria-label', 'Dismiss this');
    no.onclick = ev => {
      ev.stopPropagation();
      deadGaps()[L.gapKey(g)] = 1;
      save_();
      renderShop();
      toast('Dropped', { label: 'Undo', action: () => {
        delete deadGaps()[L.gapKey(g)];
        save_(); renderShop();
      } });
    };
    r.appendChild(no);
    r.title = KIND_LABEL[g.kind] || '';
    // Tapping searches for it, which drops you into the judging half with
    // the name already filled in.
    r.onclick = () => {
      // A named bottle goes straight to the search. A description cannot —
      // "a finished Buffalo Trace" is not something a shop stocks — so it
      // asks for real bottles that would fill it instead.
      if (L.gapIsNamed(g)) {
        // Carry what is already known, so a bottle we can describe does not
        // arrive at a blank form.
        S.shop = { name: g.name };
        if (g.proof) S.shop.proof = String(g.proof);
        if (g.sub) S.shop.sub = g.sub;
        if (g.price) S.shop.msrp = String(g.price);
        if (g.proof || g.sub || g.price) S.shopFound = g.name;
        // Coming from a recommendation, you have already said which bottle
        // you mean. Telling you to press Enter now is asking twice.
        S.shopFromGaps = true;
        $('#shopQ').value = g.name;
        renderShop();
        const auto = document.getElementById('shopLookBtn');
        if (auto && S.lookupUrl) auto.click();
      } else {
        showCandidates(g);
      }
    };
    place(g, gi).appendChild(r);
  });
  // A gap can be marked impossible wrongly — a house releases something new,
  // or a search failed for a reason that had nothing to do with the bottle.
  // Nothing should be permanently unrecommendable on the strength of one
  // empty answer.
  const nDead = Object.keys(deadGaps()).length;
  if (nDead) {
    const clr = el('button', 'chip',
      'Show the ' + nDead + ' ruled out');
    clr.style.marginTop = '10px';
    clr.onclick = () => {
      // Listed and restored one at a time. Restoring all of them brings
      // back the ones proved unanswerable along with any ruled out by
      // mistake, and the first thing you would see is the goose chase you
      // just escaped.
      openModal('Ruled out', m => {
        m.appendChild(el('div', 'sub',
          'These were searched for and nothing genuine came back, or you '
          + 'dismissed them. Bring one back if you think that was wrong.'));
        const list = el('div', 'recent');
        list.style.marginTop = '9px';
        Object.keys(deadGaps()).forEach(key => {
          const r = el('button', 'item');
          const left = el('div');
          // The key is kind|normalised-name; the name is the readable half.
          left.appendChild(el('div', 'nm oneline',
            L.sentenceCase(key.split('|')[1] || key)));
          left.appendChild(el('div', 'sub', 'Nothing genuine came back'));
          r.appendChild(left);
          r.appendChild(el('div', 'pf', 'Restore'));
          r.onclick = () => {
            delete deadGaps()[key];
            save_();
            closeModal();
            renderShop();
            toast('Back on the list');
          };
          list.appendChild(r);
        });
        m.appendChild(list);
        const close = el('button', 'btn ghost wide', 'Close');
        close.style.marginTop = '11px';
        close.onclick = closeModal;
        m.appendChild(close);
      });
      return;
    };
    card.appendChild(clr);
  }

  if (restBox) card.appendChild(restBox);
  box.appendChild(card);

  // The wishlist itself, since this is where you would look at it.
  if (S.wish.length) {
    const w = el('div', 'sheet');
    const hd = el('div', 'hdr');
    hd.style.marginBottom = '6px';
    hd.appendChild(el('h3', null, 'Your wishlist'));
    hd.appendChild(el('span', 'count', String(S.wish.length)));
    w.appendChild(hd);
    S.wish.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(x => {
      const r = el('div', 'item');
      const left = el('div');
      left.appendChild(el('div', 'nm', x.name));
      left.appendChild(el('div', 'sub', x.forFlight
        ? 'For ' + L.sentenceCase(x.forFlight)
        : (x.reason || 'Added ' + x.added)));
      r.appendChild(left);
      const drop = el('button', 'chip', 'Remove');
      drop.onclick = () => {
        S.wish = L.wishRemove(S.wish, x.name);
        save_(); renderShop(); toast('Off the wishlist');
      };
      r.appendChild(drop);
      w.appendChild(r);
    });
    box.appendChild(w);
  }
}

function renderShop() {
  const top = $('#shopScroll'), bottom = $('#shopFixed');
  top.innerHTML = ''; bottom.innerHTML = '';
  const q = $('#shopQ').value;
  if (!q.trim()) {
    // An empty box is not a dead end, it is the other half of the question:
    // typing a name judges a bottle, and this says what to look for.
    S.shopFromGaps = false;
    renderGaps(top);
    return;
  }

  // Top half, scrolling: what you already own that resembles it.
  const hits = L.shopSearch(q, S.catalog, 8);
  if (S.shopFromGaps) {
    const back = el('button', 'btn btn-sm ghost', '\u2039 What to look for');
    back.style.marginBottom = '9px';
    back.onclick = () => {
      S.shopFromGaps = false;
      S.shop = {}; S.shopFound = null;
      $('#shopQ').value = '';
      renderShop();
    };
    top.appendChild(back);
  }

  const owned = el('div', 'sheet');
  owned.appendChild(el('h3', null, hits.length
    ? 'Already on your shelf' : 'Not on your shelf'));
  if (!hits.length) {
    owned.appendChild(el('div', 'sub', S.lookupUrl
      ? 'Nothing you own matches that name. Press Enter to look it up.'
      : 'Nothing you own matches that name.'));
    if (S.lookupUrl) {
      // The prompt only makes sense if the box has the focus, and after a
      // click it does not.
      $('#shopQ').focus();
    }
  }
  hits.forEach(hit => {
    const p = hit.p;
    const n = L.ownedCount(p.k, S.bottles);
    const open = L.pourable(p.k, S.bottles);
    const r = el('button', 'item ' + typeClass(p) + (open ? '' : ' sealed'));
    const left = el('div');
    const nm = el('div', 'nm'); nm.innerHTML = '<span class="dot"></span>';
    nm.appendChild(document.createTextNode(p.name));
    left.appendChild(nm);
    left.appendChild(el('div', 'sub', [n + (n > 1 ? ' bottles' : ' bottle'),
      open ? 'open' : 'sealed', p.msrp ? '$' + p.msrp : null]
      .filter(Boolean).join(' \u00b7 ')));
    r.appendChild(left);
    r.appendChild(el('div', 'pf', String(p.proof)));
    r.onclick = () => showBottle(p.k);
    owned.appendChild(r);
  });
  top.appendChild(owned);

  // The bottle's own details, fixed at the bottom with the verdict.
  const detail = el('div', 'sheet');
  detail.appendChild(el('h3', null, 'The bottle'));
  const f = el('div', 'form');
  f.style.marginTop = '8px';
  // S.shop holds what you last typed into these fields, so the verdict
  // survives a re-render. But it must not survive a change of BOTTLE:
  // searching springbank 15 was showing Barrell Craft Spirits at 109.76
  // left over from the previous search.
  if (L.shopNorm(S.shop.name || '') !== L.shopNorm(q)) {
    S.shop = { name: q };
    S.shopFound = null;
    S.shopFromGaps = false;
  }
  const seed = hits[0] ? hits[0].p : {};
  const two = el('div', 'two');
  two.appendChild(fieldRow('Proof', 'proof', S.shop.proof || seed.proof || '',
    { type: 'number', step: '0.1' }));
  two.appendChild(fieldRow('Price', 'msrp', S.shop.msrp || seed.msrp || '',
    { type: 'number', step: '0.01' }));
  f.appendChild(two);
  const two2 = el('div', 'two');
  two2.appendChild(selectRow('Type', 'sub',
    S.shop.sub || seed.sub || 'bourbon', L.TYPES));
  two2.appendChild(selectRow('Release', 'scar',
    S.shop.scar || seed.scar || 'standard',
    ['standard', 'batched', 'limited', 'exclusive']));
  f.appendChild(two2);
  const two3 = el('div', 'two');
  two3.appendChild(fieldRow('Distillery', 'dist', S.shop.dist || seed.dist || '', {}));
  two3.appendChild(fieldRow('Finish', 'fin', S.shop.fin || seed.fin || '',
    { placeholder: 'e.g. Oloroso' }));
  f.appendChild(two3);

  // Mark anything that came from the seed rather than from you, so a lookup
  // can overwrite a guess while still deferring to what you typed.
  ['proof', 'msrp', 'sub', 'scar', 'dist', 'fin'].forEach(k => {
    const input = f.querySelector('[name="' + k + '"]');
    if (input && input.value && S.shop[k] === undefined) {
      input.dataset.seeded = '1';
    }
    // Only what was actually carried reads as found. Type defaults to
    // bourbon, and marking that default as a finding told you Longrow is a
    // bourbon in the same styling as a real answer.
    if (input && S.shopFound && L.shopNorm(S.shopFound) === L.shopNorm(q)
        && S.shop[k] !== undefined && S.shop[k] !== '') {
      input.classList.add('looked');
    }
  });
  detail.appendChild(f);

  // Lookup lives here, where you are standing in front of the bottle.
  const lookRow = el('div', 'lookrow');
  lookRow.style.marginTop = '9px';
  const look = el('button', 'btn btn-sm', 'Look it up');
  look.id = 'shopLookBtn';
  const buy = el('button', 'btn btn-sm btn-gold', 'I bought it');
  const wanted = L.onWishlist(S.wish, q);
  const want = el('button', 'btn btn-sm', wanted ? 'On your wishlist' : 'Want it');
  want.dataset.on = wanted;
  want.onclick = () => {
    if (L.onWishlist(S.wish, q)) {
      S.wish = L.wishRemove(S.wish, q);
      save_(); renderShop(); toast('Off the wishlist');
      return;
    }
    // Record WHY. A name alone is a note to self; a name with a reason is
    // something you can act on standing in a shop.
    const unlocks = allFlights().filter(f =>
      (f.core || []).some(p => L.pourKind(p) === 'wish'
        && L.shopNorm(p.name) === L.shopNorm(q)));
    S.wish = L.wishAdd(S.wish, {
      name: q.trim(),
      est: parseFloat((f.querySelector('[name=\"msrp\"]') || {}).value) || null,
      forFlight: unlocks.length ? unlocks[0].title : null,
      reason: unlocks.length ? null : L.fitVerdict(L.shelfFit({
        name: q.trim(), sub: S.shop.sub,
        proof: parseFloat(S.shop.proof) || null
      }, S.catalog, S.bottles))
    });
    save_(); renderShop(); toast('Added to your wishlist');
  };
  const lookMsg = el('div', 'looknote');
  lookRow.appendChild(look);
  lookRow.appendChild(want);
  lookRow.appendChild(buy);
  lookRow.appendChild(lookMsg);
  detail.appendChild(lookRow);

  const applyRes = res => {
    L.lookupFilled(res).forEach(k => {
      const input = f.querySelector('[name="' + k + '"]');
      if (!input) return;
      // What YOU typed wins; what was merely seeded from a similar bottle
      // does not. A looked-up proof should replace a guess, not defer to it.
      if (input.value && !input.dataset.seeded) return;
      input.value = res[k];
      delete input.dataset.seeded;
      input.classList.add('looked');
    });
    lookMsg.className = 'looknote ok';
    // Not "your catalog" — that was true when there was one shelf and one
    // user. What it matched is the shared LIBRARY, which is everybody's,
    // unless it matched something only you have.
    // From what res already carries, not by looking it up a second time —
    // that call returns null on a miss and would have thrown here.
    lookMsg.textContent = res.source !== 'shelf'
      ? 'Looked up. Check it before you trust it.'
      : (res.k && S.base[res.k]
          ? 'Already in the library.' : 'Already on your shelf.');
    judge();
  };

  look.onclick = async () => {
    const fromShelf = L.lookupFromCatalog(q, S.catalog);
    if (fromShelf) { applyRes(fromShelf); return; }
    if (!S.lookupUrl) {
      lookMsg.className = 'looknote';
      lookMsg.textContent = 'Not on your shelf. Set up lookup in Settings, '
        + 'or fill the fields in yourself.';
      return;
    }
    look.disabled = true;
    lookMsg.className = 'looknote';
    lookMsg.textContent = 'Looking it up\u2026';
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 15000);
      const r = await fetch(L.lookupUrl(S.lookupUrl, q.trim()), { signal: ctrl.signal });
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const res = L.parseLookup(await r.json());
      if (!res) throw new Error('nothing usable came back');
      applyRes(res);
    } catch (e) {
      lookMsg.className = 'looknote warn2';
      lookMsg.textContent = 'Lookup failed (' + e.message + ').';
    } finally {
      look.disabled = false;
    }
  };
  bottom.appendChild(detail);

  // And the verdict under it, which is the reason you opened this.
  const verdict = el('div');
  bottom.appendChild(verdict);
  function judge() {
    const vals = {};
    f.querySelectorAll('input,select').forEach(i => { vals[i.name] = i.value; });
    S.shop = Object.assign({}, vals, { name: q });
    const cand = {
      name: q.trim(), dist: (vals.dist || '').trim(), sub: vals.sub,
      proof: parseFloat(vals.proof) || null, msrp: parseFloat(vals.msrp) || null,
      fin: (vals.fin || '').trim() || null, scar: vals.scar
    };
    const fit = L.shelfFit(cand, S.catalog, S.bottles);
    verdict.innerHTML = '';
    verdict.appendChild(el('div', 'verdict', L.fitVerdict(fit)));
    const list = el('div');
    list.style.marginTop = '7px';
    fit.findings.forEach(x => {
      const row = el('div', 'find f-' + x.level);
      row.appendChild(el('div', 'm', x.level === 'ok' ? '\u2713'
        : x.level === 'warn' ? '!' : '\u00b7'));
      row.appendChild(el('div', null, x.msg));
      list.appendChild(row);
    });
    verdict.appendChild(list);

    buy.onclick = () => {
      const errs = L.validateProduct(Object.assign({ name: q }, vals));
      if (errs.length) { toast(errs[0]); return; }
      if (fit.own) {
        askStatus(q.trim(), st => {
          S.bottles.push({ id: L.nextBottleId(S.bottles), k: fit.own.key,
                           status: st, paid: cand.msrp });
          save_(); renderShelf(); renderHome(); renderShop();
          toast(st === 'sealed' ? 'Sealed spare added' : 'Added, open');
        });
        return;
      }
      const np = L.normalizeProduct(Object.assign({ name: q }, vals));
      if (S.catalog[np.k]) { toast('Already on the shelf'); return; }
      // Buying it is the end of wanting it.
      S.wish = L.wishRemove(S.wish, q);
      np.finc = np.fin ? 'stated' : null;
      // A bottle whose fields came from the lookup goes into the library
      // directly rather than into the approval queue: it has already been
      // searched for, checked against the name asked for, and range-checked.
      if (S.shopFound && L.shopNorm(S.shopFound) === L.shopNorm(q)) {
        np.src = Object.assign({}, np.src, { lookup: true });
        fbPublishToLibrary(np);
      }
      S.custom[np.k] = np;
      delete S.deleted[np.k];
      S.bottles.push({ id: L.nextBottleId(S.bottles), k: np.k,
                       status: 'open', paid: cand.msrp });
      save_(); rebuildCatalog();
      renderShelf(); renderShelfFilters(); renderHome(); renderPayline();
      toast('Added to the shelf');
      showBottle(np.k);
    };
  }

  // Re-judge as you correct a field, so the verdict is never stale.
  f.querySelectorAll('input,select').forEach(i => {
    i.addEventListener('change', judge);
  });
  judge();
}

function renderSettings() {
  const box = $('#settingsBody'); box.innerHTML = '';

  // Account: nothing to configure until sign-in exists, but the shape of the
  // page should not change when it does.
  const acct = el('div', 'sheet');
  const ah = el('div', 'hdr');
  ah.style.marginBottom = '6px';
  ah.appendChild(el('h3', null, 'Account'));
  const dot = el('span', 'syncdot');
  dot.id = 'syncDot';
  dot.dataset.status = FB.status;
  ah.appendChild(dot);
  acct.appendChild(ah);

  const MSG = {
    off: 'This shelf lives in this browser only. Sign in to keep it on your '
       + 'account and reach it from your phone as well.',
    connecting: 'Connecting\u2026',
    signedout: 'Signed out. This shelf lives in this browser only.',
    signedin: 'Signed in as ' + ((FB.user && FB.user.email) || '')
            + '. Loading your shelf\u2026',
    synced: 'Signed in as ' + ((FB.user && FB.user.email) || '')
          + '. Every change is saved to your account.',
    error: 'Sync problem: ' + (FB.detail || 'unknown')

/* --- diagnostics -------------------------------------------------------
   Everything the app knows about its own state, in one place and copyable
   in one tap. Describing a fault from the outside has cost several rounds
   today; the app knows what happened and should be able to hand it over.   */

function diagReport() {
  const S_ = S || {};
  const g = (fn, fallback) => { try { return fn(); } catch (e) { return fallback; } };

  const lsBytes = g(() => {
    let n = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      n += k.length + (localStorage.getItem(k) || '').length;
    }
    return n;
  }, -1);

  return [
    ['Build', [
      ['version', APP_VERSION],
      ['built', BUILD_TIME],
      ['url', location.href.replace(/#.*$/, '')],
      ['standalone', String(g(() => window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true, '?'))],
      ['viewport', window.innerWidth + '\u00d7' + window.innerHeight],
      ['touch', String('ontouchstart' in window)],
      ['sign-in method', 'popup (redirect cannot work from GitHub Pages)']
    ]],
    ['Data', [
      ['products', String(Object.keys(S_.catalog || {}).length)],
      ['bottles', String((S_.bottles || []).length)],
      ['flights', String((S_.flights || []).length)],
      ['map loaded', String(!!MAPDATA)],
      ['catalogue stamp', String(fbCatalogStamp() || 'built-in')],
      ['pours logged', String((S_.history || []).filter(x => x.kind === 'pour').length)],
      ['flights run', String((S_.history || []).filter(x => x.kind === 'flight').length)],
      ['your edits', String(Object.keys(S_.edits || {}).length)],
      ['wishlist', String((S_.wish || []).length)]
    ]],
    ['Account', [
      ['sdk loaded', String(FB.ready)],
      ['status', FB.status],
      ['signed in as', (FB.user && FB.user.email) || 'nobody'],
      ['user id', (FB.user && FB.user.uid) || '\u2014'],
      ['first read done', String(FB.loaded)],
      ['display name', S_.displayName || '(none)'],
      ['findable', String(!!S_.findable)],
      ['detail', FB.detail || '(none)'],
      ['shared with me', String(Object.keys(SHARED.shelves || {}).length)]
    ]],
    ['Storage', [
      ['localStorage bytes', lsBytes < 0 ? 'unavailable' : String(lsBytes)],
      ['signed-in flag', g(() => localStorage.getItem('kb_signedin'), '?') || '(unset)'],
      ['service worker', String(g(() => !!navigator.serviceWorker.controller, false))],
      ['lookup endpoint', S_.lookupUrl ? 'configured' : '(none)']
    ]],
    ['What sign-in did', FBLOG.length
      ? FBLOG.map(l => ['', l]) : [['', '(nothing yet)']]]
  ];
}

// What people have added that the library does not have. Held rather than
// merged: one person's typo becoming everybody's is the thing to avoid, and

function renderContrib(box) {
  const card = el('div', 'sheet');
  card.appendChild(el('h3', null, 'Offered to the library'));
  card.appendChild(el('div', 'sub', 'Loading\u2026'));
  box.appendChild(card);
  if (!FB.user) return;

  fbContribRef().once('value').then(snap => {
    const rows = [];
    snap.forEach(who => {
      who.forEach(c => {
        const v = c.val() || {};
        if (v.name) rows.push({ uid: who.key, slug: c.key, entry: v });
      });
    });
    card.innerHTML = '';
    card.appendChild(el('h3', null, 'Offered to the library'));
    if (!rows.length) {
      card.appendChild(el('div', 'sub', 'Nothing waiting.'));
      return;
    }
    card.appendChild(el('div', 'sub', rows.length + ' offered. Accepting adds '
      + 'to the shared library everybody reads; it never overwrites a '
      + 'product already in it.'));

    rows.slice(0, 30).forEach(r => {
      const merged = L.mergeContribution(S.base, r.entry);
      const item = el('div', 'item');
      const left = el('div');
      left.appendChild(el('div', 'nm', r.entry.name));
      left.appendChild(el('div', 'sub',
        [r.entry.dist, r.entry.proof ? r.entry.proof + ' proof' : null,
         r.entry.fin].filter(Boolean).join(' \u00b7 ')));
      left.appendChild(el('div', 'src', 'from ' + (r.entry.by || 'somebody')
        + (merged.ok ? '' : ' \u00b7 ' + merged.why)));
      item.appendChild(left);
      const act = el('button', 'chip', merged.ok ? 'Accept' : 'Drop');
      act.dataset.on = merged.ok;
      act.onclick = () => {
        // The library moved to its own screen; this still redrew
        // Diagnostics, so accepting appeared to do nothing at all.
        const done = () => fbContribRef().child(r.uid).child(r.slug).remove()
          .then(() => {
            LIB.products = null;      // re-read, it has changed
            renderLibraryScreen();
            fbBadgeContrib();
          });
        if (!merged.ok) { done(); return; }
        // One node, one write. The old shape read the whole library back,
        // appended, and wrote it all again — 354 KB down and up to add one
        // bottle, and every device re-downloading the lot afterwards.
        const key = L.libKey(merged.product.name);
        firebase.database().ref('bz-apps/whisky/shared')
          .update({ ['catalog/products/' + key]:
                      Object.assign({}, merged.product, { at: Date.now() }),
                    stamp: Date.now() })
          .then(done)
          .catch(e => toast(e.message || String(e)));
      };
      item.appendChild(act);
      card.appendChild(item);
    });
  }).catch(() => {
    card.innerHTML = '';
    card.appendChild(el('h3', null, 'Offered to the library'));
    card.appendChild(el('div', 'sub', 'Not an admin.'));
  });
}

/* --- managing the library ---------------------------------------------
   Browse it, search it, fix an entry, remove one. Without this, a wrong
   entry accepted once was permanent, which is a poor property for the
   thing everybody reads.                                                 */

const LIB = { products: null, q: '', admin: false, sub: null };

// Are you an admin? Read once, and treated as no when the read fails —
// which is what a non-admin's read does, so a failure and a no are the same
// answer and neither is an error worth showing.
function fbCheckAdmin() {
  if (!FB.user) { LIB.admin = false; return Promise.resolve(false); }
  return firebase.database().ref('bz-apps/whisky/admins')
    .child(FB.user.uid).once('value')
    .then(s => { LIB.admin = s.val() === true; return LIB.admin; })
    .catch(() => { LIB.admin = false; return false; });
}

/* --- publishing a batch of corrections --------------------------------

   An Import JSON in the Firebase console REPLACES everything at the path.
   That is the right tool for seeding an empty library and the wrong one
   the moment anybody else is using it: a contribution accepted since, or a
   correction somebody made in the editor, is destroyed without a word.

   This writes named products only. Nine corrections is nine writes and
   everything else is untouched — additive by construction rather than by
   remembering to be careful.                                              */

function publishBatch(products, after) {
  if (!products || !products.length) { toast('Nothing to publish'); return; }
  if (!LIB.admin) { toast('Only an admin can publish'); return; }

  const now = Date.now();
  const updates = { stamp: now };
  const names = [];
  products.forEach(p => {
    const key = L.libKey(p.name);
    if (!key) return;
    updates['catalog/products/' + key] =
      Object.assign(L.libraryEntry(p), { at: now });
    names.push(p.name);
  });
  if (!names.length) { toast('Nothing usable to publish'); return; }

  // One update call, so the whole batch lands or none of it does — a half
  // published set is worse than an unpublished one.
  firebase.database().ref('bz-apps/whisky/shared').update(updates)
    .then(() => {
      appLog('library: published ' + names.length);
      LIB.products = null;
      toast(names.length + ' published to the library');
      if (after) after();
    })
    .catch(e => toast('Failed: ' + (e.message || e)));
}

// What on this shelf differs from the library, so a batch can be reviewed
// before it is sent rather than trusted.
function pendingForLibrary() {
  const lib = LIB.products || {};
  const out = [];
  Object.values(S.catalog).forEach(p => {
    const key = L.libKey(p.name);
    const there = lib[key];
    if (!there) {
      if (L.worthContributing(p, {})) out.push({ p: p, why: 'not in the library' });
      return;
    }
    const diff = L.correctionFor(p, there);
    if (diff) {
      out.push({ p: p, why: Object.keys(diff).join(', ') + ' differs' });
    }
  });
  return out;
}

// Reviewed before it is sent. A batch you cannot see is a batch you cannot
// refuse, and publishing is the one action here that reaches everybody.
function reviewBatch(pend, after) {
  const chosen = {};
  pend.forEach((x, i) => { chosen[i] = true; });
  openModal('Publish to the library', m => {
    m.appendChild(el('div', 'sub',
      pend.length + ' differ from the library. Publishing writes only these '
      + '\u2014 anything else in the library, including what other people '
      + 'have added, is untouched.'));
    const list = el('div', 'recent');
    list.style.marginTop = '9px';
    pend.forEach((x, i) => {
      const r = el('button', 'item');
      const left = el('div');
      left.appendChild(el('div', 'nm oneline', x.p.name));
      left.appendChild(el('div', 'sub', x.why));
      r.appendChild(left);
      const mark = el('div', 'pf', '\u2713');
      r.appendChild(mark);
      r.onclick = () => {
        chosen[i] = !chosen[i];
        mark.textContent = chosen[i] ? '\u2713' : '\u2014';
        r.style.opacity = chosen[i] ? '1' : '.45';
      };
      list.appendChild(r);
    });
    m.appendChild(list);

    const go = el('button', 'btn wide btn-gold', 'Publish the ticked ones');
    go.style.marginTop = '11px';
    go.onclick = () => {
      const picked = pend.filter((x, i) => chosen[i]).map(x => x.p);
      closeModal();
      publishBatch(picked, after);
    };
    m.appendChild(go);
    const close = el('button', 'btn ghost wide', 'Close');
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

// answer to what does this app already know about, and the thing people are

function renderLibraryScreen() {
  const box = $('#libBody');

  fbCheckAdmin().then(() => {
    box.innerHTML = '';

function renderLibrary(box) {
  const card = el('div', 'sheet');
  card.appendChild(el('h3', null, 'The library'));
  box.appendChild(card);
  if (!FB.user) { card.appendChild(el('div', 'sub', 'Sign in first.')); return; }

  const draw = () => {
    card.innerHTML = '';
    card.appendChild(el('h3', null, 'The library'));
    const all = LIB.products || {};
    const n = Object.keys(all).length;
    const thin = Object.values(all).filter(p => L.libraryGaps(p).length).length;
    const cnt = document.getElementById('libCount');
    if (cnt) cnt.textContent = n;
    card.appendChild(el('div', 'sub', n + ' whiskies'
      + (LIB.admin && thin ? ', ' + thin + ' missing something' : '')
      + '. Everybody reads this and adds to it; a bottle you look up that '
      + 'is not here joins it for everybody.'));

    // What differs between this shelf and the library, publishable without
    // replacing anything else. The Firebase import is a seeding tool and
    // destroys whatever it lands on; this is the tool for every day after
    // the first.
    if (LIB.admin) {
      const pend = pendingForLibrary();
      if (pend.length) {
        const pb = el('button', 'btn wide btn-gold',
          'Publish ' + pend.length + ' to the library');
        pb.style.marginTop = '10px';
        pb.onclick = () => reviewBatch(pend, draw);
        card.appendChild(pb);
        card.appendChild(el('div', 'src',
          'Writes only these, leaving everything else in the library alone.'));
      }
    }

    const q = document.createElement('input');
    q.className = 'field';
    q.style.marginTop = '9px';
    q.placeholder = 'Name, distillery, cask, region';
    q.value = LIB.q;
    q.oninput = () => { LIB.q = q.value; list(); };
    q.placeholder = 'Search all ' + n + ' by name, distillery, cask or region';
    card.appendChild(q);

    const out = el('div', 'scrollbox');
    out.style.cssText = 'max-height:46vh;overflow-y:auto;margin-top:8px';
    card.appendChild(out);

    const list = () => {
      out.innerHTML = '';

      // Nothing searched and no category chosen: show the way in rather
      // than the first sixty alphabetically, which begins at 10th Street
      // and tells nobody anything.
      if (!LIB.q && !LIB.sub) {
        const by = {};
        Object.values(all).forEach(p => {
          const k = p.sub || 'other';
          by[k] = (by[k] || 0) + 1;
        });
        const tiles = el('div', 'tiles');
        Object.entries(by).sort((a, b) => b[1] - a[1]).forEach(([k, n]) => {
          const t = el('button', 'tile');
          t.appendChild(el('div', 'v', String(n)));
          t.appendChild(el('div', 'l', L.titleCase(k)));
          t.onclick = () => { LIB.sub = k; list(); };
          tiles.appendChild(t);
        });
        out.appendChild(tiles);
        return;
      }

      if (LIB.sub) {
        const back = el('button', 'chip', '\u2039 All types');
        back.style.marginBottom = '9px';
        back.onclick = () => { LIB.sub = null; list(); };
        out.appendChild(back);
      }

      // A search leaves the type behind. Somebody who types Lagavulin
      // while looking at Bourbon means the whole library, not nothing.
      const pool = (LIB.sub && !LIB.q)
        ? Object.fromEntries(Object.entries(all)
            .filter(([, p]) => (p.sub || 'other') === LIB.sub))
        : all;
      const hits = L.searchLibrary(pool, LIB.q, 60);
      if (!hits.length) {
        out.appendChild(el('div', 'empty', 'Nothing matches.'));
        return;
      }
      hits.forEach(p => {
        const gaps = L.libraryGaps(p);
        const r = el('button', 'item');
        r.style.cssText = 'width:100%;text-align:left';
        const left = el('div');
        left.appendChild(el('div', 'nm', p.name));
        left.appendChild(el('div', 'sub',
          [p.dist, p.proof ? p.proof + ' proof' : null, p.fin]
            .filter(Boolean).join(' \u00b7 ') || '\u2014'));
        if (gaps.length) {
          left.appendChild(el('div', 'src', 'no ' + gaps.join(', no ')));
        }
        r.appendChild(left);
        r.appendChild(el('div', 'pf', gaps.length ? '!' : ''));
        // Everybody can look; only an admin can change.
        r.onclick = () => LIB.admin ? editLibraryEntry(p, draw)
                                    : showLibraryEntry(p);
        out.appendChild(r);
      });
      if (hits.length === 60) {
        out.appendChild(el('div', 'src', LIB.sub
          ? 'First 60 of ' + Object.keys(pool).length + '. Search to narrow it.'
          : 'First 60. Search, or pick a type.'));
      }
    };
    list();
  };

  if (LIB.products) { draw(); return; }
  card.appendChild(el('div', 'sub', 'Loading\u2026'));
  fbLibraryRef().once('value').then(s => {
    const v = s.val();
    // Either shape: a library imported before the keyed change is a list.
    LIB.products = Array.isArray(v)
      ? Object.fromEntries(v.filter(Boolean).map(p => [L.libKey(p.name), p]))
      : (v || {});
    draw();
  }).catch(() => {
    card.innerHTML = '';
    card.appendChild(el('h3', null, 'The library'));
    card.appendChild(el('div', 'sub', 'Could not read it.'));
  });
}

// Fixing one. Every write moves the stamp, or devices keep the copy they
// already hold and a correction only some people see is worse than none.
function editLibraryEntry(p, after) {
  openModal(p.name, m => {
    m.appendChild(el('div', 'sub',
      'Changing this changes it for everybody, on their next open.'));
    const form = el('div', 'form');
    const fields = [
      ['proof', 'Proof', 'number'], ['dist', 'Distillery', 'text'],
      ['age', 'Age', 'number'], ['fin', 'Cask', 'text'],
      ['region', 'Region', 'text'], ['msrp', 'Price', 'number']
    ];
    const inputs = {};
    fields.forEach(([k, label, type]) => {
      const wrap = el('label', null, label);
      const inp = document.createElement('input');
      inp.className = 'field';
      inp.type = type;
      if (type === 'number') inp.step = '0.1';
      inp.value = p[k] == null ? '' : p[k];
      inputs[k] = inp;
      wrap.appendChild(inp);
      form.appendChild(wrap);
    });
    m.appendChild(form);

    const save = el('button', 'btn wide btn-gold', 'Save for everybody');
    save.style.marginTop = '11px';
    save.onclick = () => {
      const next = Object.assign({}, p);
      delete next._key;
      fields.forEach(([k, , type]) => {
        const v = inputs[k].value.trim();
        if (!v) { delete next[k]; return; }
        next[k] = type === 'number' ? parseFloat(v) : v;
      });
      const key = p._key || L.libKey(p.name);
      firebase.database().ref('bz-apps/whisky/shared')
        .update({ ['catalog/products/' + key]:
                    Object.assign({}, next, { at: Date.now() }),
                  stamp: Date.now() })
        .then(() => {
          LIB.products[key] = next;
          appLog('library: edited ' + p.name);
          closeModal(); after();
          toast('Changed for everybody');
        }).catch(e => toast(e.message || String(e)));
    };
    m.appendChild(save);

    const rm = el('button', 'btn ghost wide', 'Remove from the library');
    rm.onclick = () => confirmDelete(p.name + ' from the library', () => {
      const key = p._key || L.libKey(p.name);
      firebase.database().ref('bz-apps/whisky/shared')
        .update({ ['catalog/products/' + key]: null, stamp: Date.now() })
        .then(() => {
          delete LIB.products[key];
          appLog('library: removed ' + p.name);
          closeModal(); after();
          toast('Removed');
        }).catch(e => toast(e.message || String(e)));
    });
    m.appendChild(rm);

    const close = el('button', 'btn ghost wide', 'Close');
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

// Who has asked, who is in, and who you could ask. Rebuilt from the server
// each time rather than cached, since a share is a permission and a stale
// view of a permission is worse than a slow one.
// Send an invite: a link with your uid in it. It carries no access — the
// request it produces still has to be accepted, exactly as if they had
// found you in the directory.
function showInvite() {
  openModal('Invite a drinking buddy', m => {
    if (!S.displayName) {
      m.appendChild(el('div', 'errs',
        'Set a display name first, or the invite arrives from nobody.'));
      const close = el('button', 'btn ghost wide', 'Close');
      close.onclick = closeModal;
      m.appendChild(close);
      return;
    }
    const link = L.buddyLink(location.href, FB.user.uid);
    const body = L.inviteText(S.displayName, link);

    m.appendChild(el('div', 'sub',
      'Edit this however you like, then send it. They open the link and '
      + 'sign in, and it asks you to let them in \u2014 the link gives away '
      + 'nothing on its own.'));

    // Editable. It is your message to somebody you know, and the wording
    // that suits one friend does not suit another.
    const ta = document.createElement('textarea');
    ta.className = 'field';
    ta.rows = 9;
    ta.style.cssText = 'margin-top:10px;font-size:13px;line-height:1.5;resize:vertical';
    ta.value = body;
    m.appendChild(ta);

    const sms = el('button', 'btn wide btn-gold', 'Send the text');
    sms.style.marginTop = '11px';
    sms.onclick = () => {
      location.href = 'sms:?&body=' + encodeURIComponent(ta.value);
    };
    m.appendChild(sms);

    const copy = el('button', 'btn ghost wide', 'Copy the message');
    copy.onclick = () => {
      if (!navigator.clipboard) { toast('Clipboard not available'); return; }
      navigator.clipboard.writeText(ta.value)
        .then(() => toast('Link copied')).catch(() => toast('Could not copy'));
    };
    m.appendChild(copy);

    const close = el('button', 'btn ghost wide', 'Close');
    close.onclick = closeModal;
    m.appendChild(close);
  });
}

function renderBuddies() {
  const card = document.getElementById('buddyCard');
  if (!card || !FB.user) return;

  Promise.all([fbMyRequests(), fbSharedWith(), fbDirectory()])
    .then(([reqs, shared, dir]) => {
      card.innerHTML = '';
      card.appendChild(el('h3', null, 'Tasting buddies'));

      // Requests first: somebody is waiting on you.
      if (reqs.length) {
        card.appendChild(el('div', 'rs', reqs.length === 1
          ? 'One person has asked to see your shelf'
          : reqs.length + ' people have asked to see your shelf'));
        reqs.forEach(r => {
          const row = el('div', 'item');
          const left = el('div');
          left.appendChild(el('div', 'nm', r.name || '(no name)'));
          left.appendChild(el('div', 'sub',
            'Letting them in shows your whole shelf. They can never change it.'));
          row.appendChild(left);
          const yes = el('button', 'chip', 'Let in');
          yes.dataset.on = 'true';
          yes.onclick = () => fbAccept(r.from).then(renderBuddies)
            .catch(e => toast(e.message || String(e)));
          row.appendChild(yes);
          const no = el('button', 'chip', 'No');
          no.onclick = () => fbDecline(r.from).then(renderBuddies);
          row.appendChild(no);
          card.appendChild(row);
        });
      }

      // Who can see your shelf, and how to stop them.
      const sh = el('div');
      sh.style.marginTop = reqs.length ? '12px' : '0';
      sh.appendChild(el('div', 'rs', shared.length
        ? 'Can see your shelf' : 'Nobody can see your shelf yet'));
      shared.forEach(s => {
        const row = el('div', 'item');
        row.appendChild(el('div', 'nm', s.name));
        const off = el('button', 'chip', 'Stop sharing');
        off.onclick = () => confirmDelete(s.name + '\u2019s access',
          () => fbRevoke(s.uid).then(renderBuddies));
        row.appendChild(off);
        sh.appendChild(row);
      });
      card.appendChild(sh);

      // People you could ask. Only those who chose to be findable, and
      // never anyone already in.
      const already = {};
      shared.forEach(s => { already[s.uid] = 1; });
      const askable = dir.filter(d => !already[d.uid]);
      const find = el('div');
      find.style.marginTop = '12px';
      if (!S.findable) {
        find.appendChild(el('div', 'src',
          'You are not findable yourself, so nobody can ask you. That is a '
          + 'separate switch from asking others.'));
      }
      // Inviting somebody who is not here yet. Above the directory, since
      // with three friends the person you want is more often not on it.
      const inv = el('div', 'lookrow');
      inv.style.marginTop = '12px';
      const invBtn = el('button', 'btn btn-sm btn-gold', 'Invite by text');
      invBtn.onclick = () => showInvite();
      inv.appendChild(invBtn);
      find.appendChild(inv);

      if (askable.length) {
        find.appendChild(el('div', 'rs', 'Or ask someone already here'));
        askable.slice(0, 12).forEach(d => {
          const row = el('div', 'item');
          row.appendChild(el('div', 'nm', d.name));
          const ask = el('button', 'chip', 'Ask');
          ask.onclick = () => {
            ask.disabled = true;
            fbSendRequest(d.uid)
              .then(() => { ask.textContent = 'Asked'; })
              .catch(e => { ask.disabled = false; toast(e.message || String(e)); });
          };
          row.appendChild(ask);
          find.appendChild(row);
        });
      } else {
        find.appendChild(el('div', 'src',
          'Nobody else is findable yet. They each need to set a name and turn '
          + 'the switch on.'));
      }
      card.appendChild(find);

      card.appendChild(el('div', 'src',
        'Sharing is one-way and you control your side. Letting somebody see '
        + 'your shelf does not let you see theirs, and stopping takes effect '
        + 'at once.'));
      // What is shared, listed rather than promised. It is short enough to
      // read, and the list is the thing people actually want to know.
      card.appendChild(el('div', 'src',
        'They see your bottles, whether each is open, and your own '
        + 'corrections to them. They do not see what you have poured, your '
        + 'wishlist or your flights \u2014 those are not readable by anybody '
        + 'but you.'));
    })
    .catch(e => {
      card.innerHTML = '';
      card.appendChild(el('h3', null, 'Tasting buddies'));
      card.appendChild(el('div', 'errs', 'Could not load: ' + (e.message || e)));
    });
}

// Setup that most people touch once and never again. Closed by default, on
// MadGolf's pattern, so Settings reads as the things you actually change.
function renderLookupSetup(box) {
  const wrap = el('details', 'advanced');
  const sum = el('summary');
  sum.textContent = 'Advanced';
  wrap.appendChild(sum);

  const card = el('div', 'sheet');
  card.style.marginTop = '9px';
  card.appendChild(el('h3', null, 'Bottle lookup'));
  card.appendChild(el('div', 'sub',
    'The web-app URL of your lookup script. Leave it blank and adding a '
    + 'bottle stays manual.'));

  const inp = document.createElement('input');
  inp.className = 'field'; inp.type = 'url'; inp.style.marginTop = '9px';
  inp.placeholder = 'https://script.google.com/macros/s/…/exec';
  inp.value = S.lookupUrl || '';
  card.appendChild(inp);
  const save = el('button', 'chip', 'Save');
  save.style.marginTop = '8px';
  save.onclick = () => {
    const v = inp.value.trim();
    if (v && !/^https:\/\//.test(v)) { toast('That has to be an https URL'); return; }
    S.lookupUrl = v;
    save_();
    toast(v ? 'Lookup endpoint saved' : 'Lookup turned off');
  };
  card.appendChild(save);
  wrap.appendChild(card);

  // Getting a stuck phone unstuck. A control beats advice about clearing
  // caches, and this is exactly the situation where the automatic path has
  // already failed.
  const upd = el('div', 'sheet');
  upd.style.marginTop = '9px';
  upd.appendChild(el('h3', null, 'Version'));
  upd.appendChild(el('div', 'sub',
    'Running v' + APP_VERSION + ', built ' + BUILD_TIME + '. The app and the '
    + 'catalogue update themselves; these force the check. The catalogue is '
    + 'the shared list of whiskies \u2014 your own bottles, notes and edits '
    + 'are separate and are never touched by it.'));
  const ur = el('div', 'lookrow');
  ur.style.marginTop = '9px';
  const cb = el('button', 'btn btn-sm', 'Check the catalogue');
  cb.onclick = () => {
    if (!FB.user) { toast('Sign in first'); return; }
    cb.disabled = true;
    fbSyncCatalog().then(changed => {
      cb.disabled = false;
      if (!changed) toast('Catalogue is already current');
    });
  };

  // A device can be left holding a marker later than anything in the
  // library — an earlier build stored the clock when the data carried no
  // timestamps — and then nothing ever looks new to it again. This forgets
  // the marker and takes the library whole.
  const cf = el('button', 'btn btn-sm ghost', 'Fetch the whole catalogue');
  cf.onclick = () => {
    if (!FB.user) { toast('Sign in first'); return; }
    try { localStorage.removeItem(CAT_STAMP_KEY); } catch (e) {}
    cf.disabled = true;
    fbSyncCatalog().then(changed => {
      cf.disabled = false;
      if (!changed) toast('The library is empty');
    });
  };

  const ub = el('button', 'btn btn-sm', 'Check for an update');
  ub.onclick = () => {
    ub.disabled = true;
    ub.textContent = 'Checking\u2026';
    if (!navigator.serviceWorker) { toast('Not supported here'); return; }
    navigator.serviceWorker.getRegistration().then(reg => {
      if (!reg) { toast('No service worker registered'); ub.disabled = false;
        ub.textContent = 'Check for an update'; return; }
      return reg.update().then(() => {
        if (reg.waiting) {
          toast('Update found \u2014 loading it now');
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          return;
        }
        // Nothing waiting: either up to date, or the worker itself is being
        // served stale. Unregistering forces a clean fetch on reload.
        toast('Already current. Reloading to be sure.');
        setTimeout(() => location.reload(), 900);
      });
    }).catch(e => {
      toast('Could not check: ' + (e.message || e));
      ub.disabled = false;
      ub.textContent = 'Check for an update';
    });
  };
  ur.appendChild(ub);
  ur.appendChild(cb);
  ur.appendChild(cf);

  const hard = el('button', 'btn btn-sm ghost', 'Force a clean reload');
  hard.onclick = () => confirmDelete('the cached copy of the app', () => {
    // Everything cached, and the worker with it. Your shelf lives in
    // localStorage and your account, so this loses nothing.
    Promise.all([
      navigator.serviceWorker.getRegistrations()
        .then(rs => Promise.all(rs.map(r => r.unregister()))).catch(() => {}),
      (window.caches ? caches.keys().then(ks =>
        Promise.all(ks.map(k => caches.delete(k)))) : Promise.resolve())
        .catch(() => {})
    ]).then(() => location.reload(true));
  });
  ur.appendChild(hard);
  upd.appendChild(ur);
  wrap.appendChild(upd);

  // Admin mode. Off by default, and it adds a screen rather than changing
  // how anything behaves — nothing here can alter the shelf.
  const adm = el('div', 'sheet');
  adm.style.marginTop = '9px';
  adm.appendChild(el('h3', null, 'Admin mode'));
  adm.appendChild(el('div', 'sub',
    'Adds a Diagnostics screen showing what the app knows about its own '
    + 'state, copyable in one tap. Nothing here changes your shelf.'));
  const arow = el('div', 'lookrow');
  arow.style.marginTop = '9px';
  const t = el('button', 'chip', S.admin ? 'Admin mode on' : 'Admin mode off');
  t.dataset.on = !!S.admin;
  t.onclick = () => { S.admin = !S.admin; save_(); renderSettings(); };
  arow.appendChild(t);
  if (S.admin) {
    const open = el('button', 'btn btn-sm', 'Diagnostics');
    open.onclick = () => { renderDiag(); goTo('diag'); };
    arow.appendChild(open);
  }
  adm.appendChild(arow);
  wrap.appendChild(adm);

  box.appendChild(wrap);
}

function renderReference() {
  const box = $('#refBody'); box.innerHTML = '';
  const q = $('#refQ').value;
  renderRefGroups();
  // Searching spans every group; browsing shows the group you picked.
  $('#refGroups').style.display = q.trim() ? 'none' : '';
  const secs = L.searchReference(q, S.refGroup);
  $('#refCount').textContent = q.trim()
    ? secs.reduce((n, s) => n + s.items.length, 0) + ' matches'
    : L.referenceCount(S.refGroup) + ' terms';
  if (!secs.length) {
    box.appendChild(el('div', 'empty', 'Nothing matches that.'));
    return;
  }
  secs.forEach(s => {
    const card = el('div', 'sheet refsec');
    card.appendChild(el('h3', null, s.section));
    if (s.group) card.appendChild(el('div', 'rs', s.group));
    if (s.note) card.appendChild(el('div', 'snote', s.note));
    if (s.src) card.appendChild(el('div', 'snote', s.src));
    s.items.forEach(i => {
      const it = el('div', 'refitem');
      it.appendChild(el('div', 'rt', i.term));
      if (i.src) it.appendChild(el('div', 'rs', i.src));
      it.appendChild(el('div', 'rd', i.def));
      card.appendChild(it);
    });
    box.appendChild(card);
  });
}

const HIST_TABS = [{ id: 'pour', label: 'Pours' }, { id: 'flight', label: 'Flights' }];

// compact: the last few, scrollable, no month chart and no controls. Home
// wants a glance at what you have been drinking; Taste is where the whole
// log belongs, next to the machine that chooses the next one.
function renderHistory(host, compact) {
  const box = host || document.getElementById('histBody');
  if (!box) return;
  box.innerHTML = '';

  const card = el('div', 'sheet');
  const hd = el('div', 'hdr');
  hd.style.marginBottom = '6px';
  hd.appendChild(el('h3', null,
    S.histTab === 'pour' ? 'What you have poured' : 'Flights you have run'));
  const tabs = el('div', 'hdr-acts');
  HIST_TABS.forEach(t => {
    const n = S.history.filter(x => x.kind === t.id).length;
    const b = el('button', 'chip', t.label + (n ? ' ' + n : ''));
    b.setAttribute('aria-pressed', S.histTab === t.id);
    b.onclick = () => { S.histTab = t.id; renderHistory(box); };
    tabs.appendChild(b);
  });
  hd.appendChild(tabs);
  card.appendChild(hd);

  const rows = L.historyRows(S.history, S.catalog, allFlights(), S.histTab);

  if (!rows.length) {
    card.appendChild(el('div', 'sub', S.histTab === 'pour'
      ? 'Nothing logged yet. Spin, tap a glass, and record the pour.'
      : 'No flight marked run yet. Open one and mark it when you have.'));
    box.appendChild(card);
    return;
  }

  // A count per month, so a run of quiet weeks is visible. Six bars is
  // right once there are six months of history; on a log a week old it is
  // five empty rows and one real one, which says nothing and costs half a
  // screen. The window follows the data.
  //
  // historyByMonth returns an OBJECT keyed by month, not an array — the
  // first version of this filtered it and would have thrown on the first
  // render.
  if (compact) {
    const list = el('div', 'recent');
    // Three. Twelve was still most of the fold on a phone, and this is a
    // glance at what you have been drinking rather than the record — the
    // record is on Taste, next to the thing that chooses the next one.
    rows.slice(0, 3).forEach(x => {
      const p = x.kind === 'pour' ? prod(x.k) : null;
      const r = el('button', 'item ' + (p ? typeClass(p) : ''));
      const left = el('div');
      const nm = el('div', 'nm oneline');
      if (p) nm.innerHTML = '<span class="dot"></span>';
      nm.appendChild(document.createTextNode(x.label));
      nm.title = x.label;
      left.appendChild(nm);
      r.appendChild(left);
      r.appendChild(el('div', 'pf', x.at.slice(5)));
      if (p && L.pourable(p.k, S.bottles)) {
        r.appendChild(pourIcon(p.k, () => renderHistory(box, true)));
      }
      r.onclick = () => { if (p) showBottle(p.k); };
      list.appendChild(r);
    });
    card.appendChild(list);
    const all = el('button', 'chip', 'The whole log');
    all.style.marginTop = '9px';
    all.onclick = () => { renderReels(); renderPayline(); show('pour'); };
    card.appendChild(all);
    box.appendChild(card);
    return;
  }

  const wide = L.historyByMonth(S.history, S.histTab, 12);
  const spread = Object.keys(wide).filter(k => wide[k] > 0).length;
  const byMonth = L.historyByMonth(S.history, S.histTab,
    spread <= 1 ? 2 : Math.max(3, Math.min(12, spread + 1)));
  const bars = L.barRows(byMonth, { keepOrder: true });
  if (bars.some(b => b.n)) {
    const b = el('div', 'bars');
    b.style.margin = '4px 0 10px';
    bars.forEach(r => {
      const row = el('div', 'bar');
      row.appendChild(el('div', 't', r.label));
      const track = el('div', 'track');
      const fill = el('div', 'fill');
      fill.style.width = r.pct + '%';
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el('div', 'n', String(r.n)));
      b.appendChild(row);
    });
    card.appendChild(b);
  }

  const list = el('div', 'recent');
  rows.slice(0, 60).forEach(x => {
    const p = x.kind === 'pour' ? prod(x.k) : null;
    const r = el('button', 'item ' + (p ? typeClass(p) : ''));
    const left = el('div');
    // One line. A long bottle name took three, so twenty rows of log filled
    // several screens for information that is one word wide.
    const nm = el('div', 'nm oneline');
    if (p) nm.innerHTML = '<span class="dot"></span>';
    nm.appendChild(document.createTextNode(x.label));
    nm.title = x.label;
    left.appendChild(nm);
    if (x.kind === 'flight' && x.pours) {
      left.appendChild(el('div', 'sub', x.pours.length + ' pours'));
    }
    r.appendChild(left);
    r.appendChild(el('div', 'pf', x.at));
    // Pour it again from here. This list IS the recent list, so a separate
    // Pour again section above it was the same three bottles twice.
    if (p && L.pourable(p.k, S.bottles)) {
      r.appendChild(pourIcon(p.k, () => renderHistory(box)));
    }
    r.onclick = () => {
      if (p) return showBottle(p.k);
      const f = allFlights().find(y => y.title === x.flight);
      if (f) showFlight(f);
    };
    list.appendChild(r);
  });
  card.appendChild(list);
  if (rows.length > 60) card.appendChild(el('div', 'sub', 'Showing the most recent 60.'));

  // Removing a mistaken entry, since a wrong date in the log is worse than
  // a missing one.
  const undo = el('button', 'chip', 'Remove the most recent');
  undo.style.marginTop = '9px';
  undo.onclick = () => {
    const newest = rows[0];
    confirmDelete(newest.label + ' on ' + newest.at, () => {
      S.history.splice(newest._i, 1);
      save_(); renderHome(); renderFlights(); renderPayline();
      toast('Removed from the log');
    });
  };
  card.appendChild(undo);
  box.appendChild(card);
}

/* --- the shared shelves screen ----------------------------------------- */

const SHARED = { shelves: {}, names: {}, openOnly: true, loading: false };

// Shelves shared WITH you. Nobody's shelf is fetched until you ask, and the
// rules refuse anything not actually shared, so a stale entry fails closed.
function loadSharedShelves() {
  if (!FB.user || SHARED.loading) return Promise.resolve();
  SHARED.loading = true;
  return fbSharedWithRef().child(FB.user.uid).once('value')
    .then(snap => {
      // Only your own node: who has let you in, without being able to see
      // anybody else's arrangements.
      const owners = [];
      snap.forEach(c => owners.push(c.key));
      return Promise.all(owners.map(uid =>
        fbReadShelf(uid).then(v => ({ uid: uid, shelf: v }))
          .catch(() => ({ uid: uid, shelf: null }))));
    })
    .then(rows => {
      rows.forEach(r => { if (r.shelf) SHARED.shelves[r.uid] = r.shelf; });
      return fbDirRef().once('value');
    })
    .then(dir => {
      dir.forEach(c => { const v = c.val(); if (v) SHARED.names[c.key] = v.name; });
      SHARED.loading = false;
    })
    .catch(e => { SHARED.loading = false; throw e; });
}

function renderShared() {
  const box = $('#sharedBody');
  if (!box) return;
  box.innerHTML = '';

  if (!FB.user) {
    box.appendChild(el('div', 'empty',
      'Sign in to compare shelves with a tasting buddy.'));

  }
  const uids = Object.keys(SHARED.shelves);

    box.appendChild(el('div', 'empty',
      'Nobody has shared a shelf with you yet. Ask someone in Settings, and '
      + 'their shelf appears here once they let you in.'));

  }

  // Two or three shelves: yours plus up to two. Past three a Venn stops
  // working and the honest answer is a different chart entirely.
  const chosen = uids.slice(0, 2);
  const sets = [{ id: 'me', name: 'You',
                  map: L.shelfSet({ catalog: S.catalog, bottles: S.bottles },
                                  SHARED.openOnly) }]
    .concat(chosen.map(u => ({ id: u, name: SHARED.names[u] || 'Buddy',
      map: L.shelfSet(SHARED.shelves[u], SHARED.openOnly) })));

  const names = { me: 'You' };
  chosen.forEach(u => { names[u] = SHARED.names[u] || 'Buddy'; });

  const regions = L.vennRegions(sets);
  const hi = L.vennHighlights(regions, 'me');

  // The toggle. Open is the default because the rest of this is about what
