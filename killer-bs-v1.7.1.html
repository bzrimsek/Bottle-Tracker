// A rolling log of what the app did, kept across reloads. Lifted from
// MadGolf, where it exists because "it broke" is not a bug report and the
// thing you need is what happened just before. Capped at 100 and stored
// with everything else, so a user can send it without knowing what it is.
function appLog(msg) {
  const ts = new Date().toISOString().slice(11, 19);
  S.log = ([ts + '  ' + msg]).concat(S.log || []).slice(0, 100);
  // Written directly rather than through save_, which would push to
  // Firebase on every log line and turn a diagnostic into traffic.
  try { localStorage.setItem('kb.log', JSON.stringify(S.log)); } catch (e) {}
}
function fbNote(msg) {
  FBLOG.push(new Date().toISOString().slice(11, 19) + '  ' + msg);
  if (FBLOG.length > 12) FBLOG.shift();
  appLog(msg);          // the sign-in trace is part of the same story
}

function fbSetStatus(s, detail) {
  FB.status = s;
  FB.detail = detail || '';
  const dot = document.getElementById('syncDot');
  if (dot) dot.dataset.status = s;
  const scr = document.getElementById('scr-settings');
  if (typeof renderSettings === 'function' && scr
      && scr.classList.contains('on')) {
    renderSettings();
  }
}

// The SDK is only fetched when you ask to sign in. Someone who never signs
// in pays nothing for this and the app keeps working with no network.
function fbLoad(cb) {
  if (FB.ready) { fbNote('sdk already loaded'); return cb(); }
  fbNote('loading sdk');
  fbSetStatus('connecting');
  const urls = [
    'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js',
    'https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js'
  ];
  let i = 0;
  const next = () => {
    if (i >= urls.length) {
      try {
        firebase.initializeApp(FB.config);
        FB.ready = true;
        fbNote('sdk ready');
        cb();
      } catch (e) {
        fbSetStatus('error', String(e));
      }
      return;
    }
    const s = document.createElement('script');
    s.src = urls[i++];
    s.onload = next;
    s.onerror = () => fbSetStatus('error', 'could not load the Firebase SDK');
    document.head.appendChild(s);
  };
  next();
}

/* --- running the thing -------------------------------------------------

   Somebody has to be able to see who is using this, on what version, and
   whether they have got anywhere. Counts do that and reveal nothing: forty
   bottles is a number, and it is not the same question as which forty.

   Each client reports its own, which keeps shelves readable only by their
   owners. Self-reported, and for a handful of friends that is the right
   trade against a back door into everybody's collection.                  */

function fbContribRef() {
  return firebase.database().ref('bz-apps/whisky/contrib');
}

// Offer anything you have added that the library does not know. Quiet: it
// is a by-product of adding a bottle, not a thing to be asked about.
/**
 * A bottle the API returned goes straight into the library.
 *
 * It has already been through more than a review would give it: the lookup
 * searched for it, the reply was checked against the name that was asked
 * for, and the fields were range-checked on the way in. A queue would add a
 * delay and no scrutiny.
 *
 * Hand-typed entries still queue. Somebody's typo is the thing review is
 * actually for, and it is the only thing it catches that the checks do not.
 */
function fbPublishToLibrary(p) {
  if (!FB.user || !p || !p.name) return Promise.resolve(false);
  const key = L.libKey(p.name);
  if (!key) return Promise.resolve(false);
  const ref = firebase.database().ref('bz-apps/whisky/shared');
  // Never overwrite: the library is what everybody has agreed on, and a
  // fresh lookup is not grounds to replace an entry somebody corrected.
  return ref.child('catalog/products/' + key).once('value').then(s => {
    if (s.exists()) return false;
    const now = Date.now();
    // Stamped, or the incremental sync will never see it and the rules
    // will refuse it.
    return ref.update({ ['catalog/products/' + key]:
                          Object.assign(L.libraryEntry(p), { at: now }),
                        stamp: now })
      .then(() => { appLog('library: added ' + p.name + ' from a lookup');
                    return true; });
  }).catch(() => false);
}

function fbContribute() {
  if (!FB.user || !FB.loaded) return;
  const mine = Object.values(S.custom || {})
    .concat(Object.keys(S.edits || {}).map(k => S.catalog[k]).filter(Boolean));
  const send = {};
  mine.forEach(p => {
    if (!L.worthContributing(p, S.base)) return;
    // Anything that came from a lookup is already published, not queued.
    if (p.src && p.src.lookup) return;
    send[L.shopNorm(p.name).replace(/[^a-z0-9]/g, '_').slice(0, 60)] =
      Object.assign(L.libraryEntry(p), { by: S.displayName || '', at: Date.now() });
  });
  if (!Object.keys(send).length) return;
  fbContribRef().child(FB.user.uid).update(send)
    .then(() => appLog('offered ' + Object.keys(send).length + ' to the library'))
    .catch(() => {});
}

function fbStatsRef() {
  return firebase.database().ref('bz-apps/whisky/stats');
}

// Suspending somebody. From MadGolf, where the honesty is the good part:
// removing a user removes the REGISTRY ENTRY, not their whisky — that lives
// in their own account and cannot be reached from here, and they reappear
// the moment they sign in again. Saying that plainly is better than a
// button that implies more power than it has.
function fbSetSuspended(uid, off) {
  return fbStatsRef().child(uid).child('suspended').set(!!off)
    .then(() => { appLog((off ? 'suspended ' : 'restored ') + uid.slice(0, 8)); });
}

function fbRemoveUser(uid) {
  return fbStatsRef().child(uid).remove()
    .then(() => { appLog('removed ' + uid.slice(0, 8) + ' from the registry'); });
}

// Checked on sign-in. Client-side, like MadGolf's — it stops somebody using
// the app, not somebody determined to read their own data, which they are
// entitled to anyway.
function fbCheckSuspended() {
  if (!FB.user) return Promise.resolve(false);
  return fbStatsRef().child(FB.user.uid).child('suspended').once('value')
    .then(s => {
      if (s.val() !== true) return false;
      appLog('access suspended');
      document.body.innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;'
        + 'height:100dvh;text-align:center;padding:40px 24px;font:16px Georgia,'
        + 'serif;color:#241f1b;background:#f2ede5">'
        + '<div><div style="font-size:19px;margin-bottom:10px">'
        + 'Access suspended</div><div style="color:#6b5f54;font-size:14px">'
        + 'Your shelf is untouched. Speak to whoever runs this to restore it.'
        + '</div></div></div>';
      return true;
    }).catch(() => false);
}

// Cleared, not asked about. He never chose these bottles — they arrived
// inside the app — so presenting them as a decision is asking somebody to
// take responsibility for a mistake that was not theirs. An admin flags the
// account and the next open empties it, with a line saying what happened.
function fbCheckInherited() {
  if (!FB.user) return;
  fbStatsRef().child(FB.user.uid).child('inherited').once('value')
    .then(s => {
      if (s.val() !== true) return;
      const n = (S.bottles || []).length;
      S.bottles = []; S.edits = {}; S.custom = {}; S.deleted = {};
      S.history = []; S.wish = [];
      save_();
      rebuildCatalog();
      appLog('cleared ' + n + ' inherited bottles');
      fbStatsRef().child(FB.user.uid).child('inherited').remove();
      if (FB.loaded) { fbPush(); fbPushShared(); fbPushStats(); }
      renderShelf(); renderShelfFilters(); renderHome(); renderFlights();
      // Said once, plainly, and not as a question.
      toast('An earlier version put somebody else\u2019s bottles on your '
        + 'shelf. Cleared \u2014 the shelf is yours.');
    }).catch(() => {});
}

function fbPushStats() {
  if (!FB.user || !FB.loaded) return;
  const hist = S.history || [];
  fbStatsRef().child(FB.user.uid).set({
    name: S.displayName || '',
    at: Date.now(),
    version: APP_VERSION,
    bottles: (S.bottles || []).length,
    products: Object.keys(S.catalog || {}).length,
    open: (S.bottles || []).filter(b => b.status === 'open').length,
    pours: hist.filter(x => x.kind === 'pour').length,
    flights: hist.filter(x => x.kind === 'flight').length,
    wish: (S.wish || []).length,
    findable: !!S.findable
  }).catch(() => {});
}

function fbDirRef()  { return firebase.database().ref('bz-apps/whisky/directory'); }
function fbReqRef()  { return firebase.database().ref('bz-apps/whisky/requests'); }
function fbShareRef(){ return firebase.database().ref('bz-apps/whisky/shares'); }
// The mirror image: written by the owner, at the viewer's address, so a
// viewer reads only their own node to learn who has let them in. Scanning
// everyone's share list to find yourself is what the rules rightly refuse.
function fbSharedWithRef(){ return firebase.database().ref('bz-apps/whisky/sharedWith'); }

// Publish or withdraw your entry. Withdrawing removes it rather than
// flagging it hidden, because a hidden row is still a row somebody can read.
function fbPublishName() {
  if (!FB.user) return Promise.resolve();
  const entry = L.directoryEntry(FB.user.uid, S.displayName, S.findable);
  const ref = fbDirRef().child(FB.user.uid);
  return entry ? ref.set(entry) : ref.remove();
}

// Everyone willing to be found, minus you, sorted so a picker reads the
// same way twice.
function fbDirectory() {
  return fbDirRef().once('value').then(snap => {
    const out = [];
    snap.forEach(c => {
      const v = c.val();
      if (v && v.uid && v.uid !== (FB.user && FB.user.uid)) out.push(v);
    });
    out.sort((a, b) => String(a.name).localeCompare(String(b.name)));
    return out;
  });
}

function fbSendRequest(toUid) {
  if (!FB.user) return Promise.reject(new Error('not signed in'));
  return fbReqRef().child(toUid).child(FB.user.uid).set({
    from: FB.user.uid,
    name: S.displayName || L.suggestName(FB.user),
    at: Date.now()
  });
}

function fbMyRequests() {
  if (!FB.user) return Promise.resolve([]);
  return fbReqRef().child(FB.user.uid).once('value').then(snap => {
    const out = [];
    snap.forEach(c => { const v = c.val(); if (v && v.from) out.push(v); });
    return out;
  });
}

// Accepting is the only act that grants access, and only the shelf's owner
// can perform it. Both sides are written together so they cannot drift: the
// grant, and the index that lets the other person find it.
function fbAccept(fromUid) {
  const at = Date.now();
  return fbShareRef().child(FB.user.uid).child(fromUid).set({ at: at })
    .then(() => fbSharedWithRef().child(fromUid).child(FB.user.uid).set({ at: at }))
    .then(() => fbReqRef().child(FB.user.uid).child(fromUid).remove());
}

function fbDecline(fromUid) {
  return fbReqRef().child(FB.user.uid).child(fromUid).remove();
}

// Revoking is immediate and total: the rule reads the grant on every access,
// so removing it ends the access with nothing cached to expire. The grant
// goes first — if the index write fails, access is already gone.
function fbRevoke(uid) {
  return fbShareRef().child(FB.user.uid).child(uid).remove()
    .then(() => fbSharedWithRef().child(uid).child(FB.user.uid).remove());
}

// Who has let you in, with their names from the directory. Somebody who has
// since withdrawn shows as withdrawn rather than vanishing, since the share
// is still real.
function fbSharedWith() {
  if (!FB.user) return Promise.resolve([]);
  return fbSharedWithRef().child(FB.user.uid).once('value').then(snap => {
    const uids = [];
    snap.forEach(c => uids.push(c.key));
    if (!uids.length) return [];
    return fbDirRef().once('value').then(dir => {
      const names = {};
      dir.forEach(c => { const v = c.val(); if (v) names[c.key] = v.name; });
      return uids.map(u => ({ uid: u, name: names[u] || '(withdrawn)' }));
    });
  });
}

/**
 * What a buddy may see, written explicitly rather than by omission.
 *
 * Letting somebody see your shelf used to hand them the whole node: every
 * pour you had logged with its date, your wishlist, the endpoint you use.
 * "See my shelf" means the bottles, and nothing else should travel with it
 * by accident.
 *
 * So the shared view is a SEPARATE snapshot containing exactly what is
 * meant, rebuilt whenever the shelf changes. Anything added to the app
 * later is private until somebody puts it here on purpose.
 */
function fbBuildShared() {
  const out = {
    name: S.displayName || '',
    at: Date.now(),
    // The shelf itself: what you own, and your corrections to the base,
    // since a buddy seeing your shelf should see your proof fix.
    bottles: S.bottles || [],
    edits: S.edits || {},
    custom: S.custom || {},
    deleted: S.deleted || {}
  };
  // Your own 36 flights stay private — sharing means the shelf. But a
  // flight PROPOSED to the room is a different object: it was cast from
  // everybody's bottles and it exists to be read by them, so it travels
  // with the shelf and is visible to exactly the people already let in.
  if ((S.proposals || []).length) out.proposals = S.proposals;
  return out;
}

// Never sent unless it changed: this runs on every save.
let _sharedLast = '';
function fbPushShared() {
  if (!FB.user || !FB.loaded) return;
  const payload = fbBuildShared();
  const sig = JSON.stringify(payload.bottles) + JSON.stringify(payload.edits)
    + JSON.stringify(payload.custom) + JSON.stringify(payload.deleted)
    + JSON.stringify(payload.proposals || []) + payload.name;
  if (sig === _sharedLast) return;
  _sharedLast = sig;
  firebase.database().ref('bz-apps/whisky/view/' + FB.user.uid)
    .set(payload).catch(e => fbNote('shared view failed: ' + (e && e.message)));
}

// A shelf somebody has shared with you. The snapshot only — their private
// node is not readable at all any more.
function fbReadShelf(uid) {
  return firebase.database().ref('bz-apps/whisky/view/' + uid).once('value')
    .then(s => {
      const v = s.val();
      if (!v) return null;
      // Rebuilt into the shape every other piece expects, from the shared
      // catalogue plus their own corrections.
      return {
        name: v.name || '',
        catalog: L.mergeCatalog(S.base, v.edits || {}, v.custom || {},
                                v.deleted || {}),
        bottles: v.bottles || [],
        proposals: v.proposals || []
      };
    });
}

// POPUP EVERYWHERE, INCLUDING PHONES. This is not a preference.
//
// signInWithRedirect cannot work from bzrimsek.github.io at all. The SDK
// completes a redirect through a cross-origin iframe on
// bottle-tracker-7d3a1.firebaseapp.com, and every current browser blocks a
// third-party origin from reading its own storage in that position —
// required behaviour since Chrome M115, Firefox 109 and Safari 16.1. The
// redirect returns, the SDK finds no pending sign-in, and reports NO ERROR.
// That is exactly what a phone was doing: back to the home page, still
// signed out, nothing in the log.
//
// Google's documented fixes all mean serving the auth handler from our own
// domain, which GitHub Pages cannot do. So: popup, which is a first-party
// window and never touches that iframe. A popup opened from a real tap is
// permitted on mobile Safari and Chrome — the gesture is what matters, and
// a Sign in button is a gesture. My assumption that phones block popups is
// what caused this.

function fbAuthError(e) {
  const code = (e && e.code) || '';
  if (code === 'auth/unauthorized-domain') {
    return 'This domain is not authorised in Firebase. Add '
      + location.hostname + ' under Authentication, Settings, '
      + 'Authorized domains.';
  }
  if (code === 'auth/popup-blocked') {
    return 'Your browser blocked the sign-in window. Allow popups for this '
      + 'site and try again.';
  }
  if (code === 'auth/popup-closed-by-user'
      || code === 'auth/cancelled-popup-request') {
    return 'Sign-in was closed before it finished.';
  }
  if (code === 'auth/operation-not-supported-in-this-environment') {
    return 'This browser will not open the sign-in window. Open the app in '
      + 'Safari or Chrome rather than from the home screen, and sign in '
      + 'there \u2014 it stays signed in afterwards.';
  }
  return (e && e.message) || String(e);
}

/* --- the shared catalogue ---------------------------------------------- */

// The 325 products and 36 flights are the same for everybody, and until now
// a correction to them only reached a device by redeploying data.json. That
// was right when there was one shelf and no account; it is not right now.
//
// data.json stays as the first-run seed and the offline copy, so the app is
// unchanged when signed out and still works with no network. Signed in, the
// device reads a STAMP — a few bytes — and pulls the catalogue only when
// that stamp has moved. 400 KB is not something to re-read on every start.
//
// Nobody writes it from the app. One person's typo becoming everyone's is
// exactly what a shared catalogue must not allow.

function fbSharedRef() {
  return firebase.database().ref('bz-apps/whisky/shared');
}

const CAT_STAMP_KEY = 'kb_catalog_stamp';

function fbCatalogStamp() {
  try { return Number(localStorage.getItem(CAT_STAMP_KEY)) || 0; }
  catch (e) { return 0; }
}

/**
 * Take a newer shared catalogue if there is one.
 *
 * Replaces S.base ONLY. Everything of yours — your edits, your own bottles,
 * what you have deleted, your custom entries — lives in separate state and
 * is layered on top by rebuildCatalog, so it survives untouched and your
 * own note still beats whatever the base says about the same bottle.
 */
/**
 * Take whatever the library has gained or changed since this device last
 * looked. NOT the whole library.
 *
 * Keyed children fixed the write — adding a bottle is one node — but the
 * read was still the whole catalogue on every stamp move. At 325 products
 * that is 350 KB and invisible; seeded to 5,700 it would be 6 MB every
 * time anybody anywhere added a bottle, over cellular, in a shop.
 *
 * Each product carries the moment it was written, and this asks only for
 * products written since. A first run has nothing to compare against and
 * takes the lot, which is the one time that is the right thing to do.
 */
function fbSyncCatalog() {
  if (!FB.user) return Promise.resolve(false);
  const since = fbCatalogStamp();
  const ref = firebase.database().ref('bz-apps/whisky/shared/catalog/products');
  const q = since ? ref.orderByChild('at').startAt(since + 1) : ref;

  return q.once('value').then(snap => {
    const got = snap.val();
    const items = !got ? [] : (Array.isArray(got)
      ? got.filter(Boolean) : Object.values(got));
    if (!items.length) {
      fbNote(since ? 'library is current' : 'library is empty');
      return false;
    }
    // Merged into the base rather than replacing it, so a device that has
    // been away picks up the difference without losing what it had.
    const base = since ? Object.assign({}, S.base) : {};
    // The marker comes from the DATA and never from the clock. Falling back
    // to Date.now() when nothing carried a timestamp stored a moment in the
    // future of the library, and every query afterwards asked for products
    // newer than that — the answer is always none, permanently.
    let newest = 0;
    items.forEach(p => {
      if (!p || !p.name) return;
      // Through normalizeProduct, which recomputes the derived fields —
      // so a library entry with a stale verdict is corrected on arrival
      // rather than spreading.
      const np = L.normalizeProduct(p);
      if (np && np.k) base[np.k] = np;
      if (typeof p.at === 'number' && p.at > newest) newest = p.at;
    });
    S.base = base;
    if (newest) {
      try { localStorage.setItem(CAT_STAMP_KEY, String(newest)); } catch (e) {}
    } else {
      // A library with no timestamps at all: take it, and stay at zero so
      // the next check tries again rather than locking us out.
      try { localStorage.removeItem(CAT_STAMP_KEY); } catch (e) {}
    }
    rebuildCatalog();
    renderShelf(); renderShelfFilters(); renderHome();
    renderFlights(); renderPayline();
    appLog('library: took ' + items.length
      + (since ? ' changed' : ' on first run'));
    if (since) toast(items.length + ' added to the library');
    return true;
  }).catch(e => {
    // A library that will not load is not a reason to stop: the built-in
    // catalogue is still there and still correct, just older.
    fbNote('library check failed: ' + ((e && e.message) || e));
    return false;
  });
}

function fbSignIn() {
  fbLoad(() => {
    fbWatch();
    fbNote('signing in by popup');
    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider).catch(e => {
      fbNote('popup failed: ' + ((e && e.code) || e));
      fbSetStatus('error', fbAuthError(e));
    });
  });
}

function fbSignOut() {
  if (!FB.ready) return;
  firebase.auth().signOut();
  try { localStorage.removeItem('kb_signedin'); } catch (e) {}
  FB.user = null; FB.base = null; FB.loaded = false;
  fbSetStatus('signedout');
}

function fbWatch() {
  // Returning from a redirect: collect the result, or an error there is
  // never seen and the sign-in simply appears not to have happened.
  fbNote('watching for auth');
  firebase.auth().onAuthStateChanged(user => {
    if (!user) {
      fbNote('auth says: nobody signed in');
      FB.user = null; FB.base = null; FB.loaded = false;
      fbSetStatus('signedout'); renderHome(); return;
    }
    fbNote('auth says: ' + (user.email || user.uid));
    FB.user = user;
    try { localStorage.setItem('kb_signedin', '1'); } catch (e) {}
    FB.base = firebase.database().ref('bz-apps/whisky/' + user.uid);
    // Say so NOW. The panel used to wait for the first database read before
    // it heard anything, so a slow or failed read left the screen showing
    // signed out while the user was signed in.
    fbSetStatus('signedin');
    // Before anything loads: no point fetching a shelf for somebody who
    // will not be allowed to see it.
    fbCheckSuspended().then(off => {
      if (off) return;
      fbCheckInherited();
      fbFirstLoad();
      renderSettings();
    });
  });
}

/**
 * The first read decides which side wins.
 *
 * Remote wins when it has anything, because the common case is a second
 * device joining a shelf that already exists. Local wins only when remote
 * is empty, which is the first sign-in on the device that has the data.
 * Getting this backwards would wipe a shelf, so it is decided once, here,
 * rather than field by field.
 */
function fbFirstLoad() {
  FB.base.once('value').then(snap => {
    const remote = snap.val();
    const hasRemote = remote && SYNC_KEYS.some(k =>
      remote[k] && (Array.isArray(remote[k]) ? remote[k].length
                                             : Object.keys(remote[k]).length));
    // A shelf that came from the shipped file has never been in an account.
    // Checked HERE because this is the only place that fact is known, and
    // it is what separates an inherited copy from the shelf it was copied
    // from — the contents are identical by definition.
    if (!hasRemote && looksInherited(false)) {
      clearInherited();
      toast('Starting you with an empty shelf');
    }
    if (hasRemote) {
      SYNC_KEYS.forEach(k => {
        if (remote[k] !== undefined && remote[k] !== null) S[k] = remote[k];
      });
      if (remote.lookupUrl && !S.lookupUrl) S.lookupUrl = remote.lookupUrl;
      save_();
      rebuildCatalog();
      renderShelf(); renderShelfFilters(); renderHome();
      renderFlights(); renderPayline();
      toast('Shelf loaded from your account');
    }
    FB.loaded = true;
    fbSetStatus('synced');
    // After your own shelf, never before it: a catalogue read must not
    // delay the thing you opened the app for.
    fbSyncCatalog();
    fbBadgeContrib();
    // Arrived by an invite link: ask on their behalf, then clear the id from
    // the address bar so a reload does not ask twice.
    const inviter = L.buddyFromUrl(location.href);
    if (inviter && inviter !== user.uid) {
      history.replaceState(null, '', location.pathname);
      fbSendRequest(inviter)
        .then(() => { toast('Asked to be let in'); renderSettings(); goTo('settings'); })
        .catch(e => toast(e.message || String(e)));
    }
    // Show the shared-shelves entry only when there is something behind it.
    loadSharedShelves().then(() => {
      const b = document.getElementById('sharedBtn');
      if (b) b.hidden = !Object.keys(SHARED.shelves).length;
      renderReels();
    }).catch(() => {});
    if (!hasRemote) fbPush();          // seed the account from this device
    fbListen();
  }).catch(e => {
    // Signed in but the shelf would not load. Say both, or it reads as a
    // sign-in that did not happen.
    FB.loaded = false;
    fbSetStatus('error', 'Signed in, but your shelf would not load: '
      + ((e && e.message) || String(e)));
  });
}

// Never write before the first read completes. Without this guard a slow
// read races an early save and an empty local state overwrites a real shelf.
function fbPush() {
  if (!FB.base || !FB.loaded || FB.saving) return;
  const payload = { updated: Date.now() };
  SYNC_KEYS.forEach(k => { payload[k] = S[k]; });
  if (S.lookupUrl) payload.lookupUrl = S.lookupUrl;
  FB.saving = true;
  FB.base.set(payload)
    .then(() => { FB.saving = false; fbSetStatus('synced'); })
    .catch(e => { FB.saving = false;
      fbSetStatus('error', (e && e.message) || String(e)); });
}

// Another device changed something. Only take it when it is genuinely newer,
// or two devices will push each other back and forth.
function fbListen() {
  FB.base.on('value', snap => {
    const v = snap.val();
    if (!v || FB.saving) return;
    if (FB.lastSeen && v.updated && v.updated <= FB.lastSeen) return;
    FB.lastSeen = v.updated || Date.now();
  });
}

/* --- boot ----------------------------------------------------------- */
// A shelf that has never been touched. Used to tell a genuinely new user
// apart from somebody whose storage failed to load, which look identical
// from here and want opposite responses.
function shelfIsEmpty() {
  return !(S.bottles || []).length && !Object.keys(S.custom || {}).length;
}

// The shelf that used to ship inside data.json. Anybody who signed in
// before v0.2.13 has it saved as their own, and cannot be expected to know
// that or to pick through 344 bottles to find the ones they added.
//
// It is recognisable because it is exact: the same count, and every bottle
// keyed to a product in the shipped catalogue with nothing of their own
// among them. A shelf somebody has actually used will not match.
const SHIPPED_SHELF_COUNT = 344;

// CANNOT be decided from the shelf's contents. BZ's own 344 bottles and an
// inherited copy of them are the same bottles — that is what inherited
// means — so any test on what is in the shelf would clear his as readily as
// anybody else's, and clearing the wrong one is unrecoverable.
//
// The thing that DOES tell them apart is where they came from. A shelf that
// arrived from the shipped file has never been written to an account, so
// the account is empty on first read. A real shelf has been.
function looksInherited(hadRemote) {
  if (hadRemote) return false;              // the account has their history
  const b = S.bottles || [];
  if (b.length !== SHIPPED_SHELF_COUNT) return false;
  if (Object.keys(S.custom || {}).length) return false;
  if (Object.keys(S.edits || {}).length) return false;
  if (Object.keys(S.deleted || {}).length) return false;
  if ((S.history || []).length) return false;
  return b.every(x => x && x.k && S.base[x.k]);
}

function clearInherited() {
  const n = (S.bottles || []).length;
  S.bottles = [];
  S.wish = [];
  save_();
  rebuildCatalog();
  appLog('cleared ' + n + ' inherited bottles');
  // The account and the shared view go with it, or the copy outlives the
  // clearing and a buddy still sees a shelf that was never theirs.
  if (FB.user && FB.loaded) { fbPush(); fbPushShared(); fbPushStats(); }
  return n;
}

function boot(data) {
  // Derived fields recomputed on the way in, rather than trusted. The wine
  // verdict follows from the cask, and editing a cask by hand — as with
  // Aberlour 18 — leaves the verdict saying whatever it said before. A
  // value computed from another should be computed, not stored and hoped
  // over: this makes a stale one impossible rather than merely detected.
  Object.values(data.catalog || {}).forEach(p => {
    p.wine = p.fin ? L.finIsWine(p.fin) : null;
  });
  S.base = data.catalog;
  // NOT data.flights either. The 325 products are reference data and belong
  // to everybody; the 36 flights are one person's curriculum — his opinion
  // about how to drink them — and shipping those was the same mistake as
  // shipping his bottles. A new shelf gets the LESSONS instead, which are
  // in the app rather than the data, and builds its own.
  S.flights = data.flights || [];
  // NOT data.bottles. The catalogue is reference data and is meant to
  // travel; which bottles somebody OWNS is not, and shipping it meant every
  // new user opened the app already holding BZ's 344 bottles. Harmless
  // while there was one user, and exactly wrong the moment there were two.
  S.bottles = [];
  load();                       // their own bottles, if they have any

  rebuildCatalog();
  // A shipped flight the user has adjusted: re-apply their version.
  S.flights = S.flights.map(f => {
    const ov = S.edits['flight:' + f.title];
    return ov ? Object.assign({}, f, ov) : f;
  });
  renderShelfFilters(); renderShelf(); renderReels(); renderPayline();
  renderFlights(); renderHome(); renderReference(); renderShop();
  // Someone who has signed in before should not have to do it again on
  // every load, so the SDK is fetched at boot in that case only.
  if (localStorage.getItem('kb_signedin') === '1') {
    fbLoad(() => fbWatch());
  }
  fetch('./map.json').then(r => r.json()).then(md => {
    MAPDATA = md; wireMap(); renderMap(); drawHomeMap();
  }).catch(() => {
    $('#mapCount').textContent = 'map.json did not load';
  });
  // Inside the scrolling screen, not on body: body is a flex column ending
  // with the nav, so anything appended after it lands below the bar.
  const f = el('footer');
  f.innerHTML = 'Killer B\u2019s Bottle Tracker <span id="verString">v1.7.1</span>'
    + ' \u00b7 <span id="buildTime"></span>';
  const home = document.getElementById('scr-home');
  if (home) home.appendChild(f);
  // Header sub-line and build stamp, kept in sync with the constants.
  const hv = document.getElementById('header-version');
  if (hv) hv.textContent = 'v' + APP_VERSION;
  const bt = document.getElementById('buildTime');
  if (bt) bt.textContent = 'Build ' + BUILD_TIME;
}

/* --- install and auto-update ------------------------------------------
   The same shape MadGolf uses: check for a new worker on every load, take
   it immediately when nothing is half-finished on screen, and hold it with
   a toast when something is. */
if ('serviceWorker' in navigator) {
  let _swReg = null;
  let _swReloading = false;

  // The analogue of "mid-round" here is an open form: a modal with typing in
  // it, or a flight being edited. Reloading under those loses work.
  function _swIsBusy() {
    const ov = document.getElementById('overlay');
    if (ov && ov.classList.contains('on')) return true;
    const el2 = document.activeElement;
    return !!(el2 && /^(INPUT|TEXTAREA|SELECT)$/.test(el2.tagName) && el2.value);
  }

  let _swLastCheck = 0;

  function _swActivateNow() {
    if (_swReg && _swReg.waiting) _swReg.waiting.postMessage({ type: 'SKIP_WAITING' });
  }

  function _swHandleUpdate(worker) {
    if (!worker) return;
    const act = () => {
      if (!_swIsBusy()) { _swActivateNow(); return; }
      if (typeof toast === 'function') toast('Update ready — reload when you are done');
      // Take it as soon as the screen is idle rather than leaving it waiting
      // until the next cold start — but not forever. A modal left open or a
      // form with something typed in it would otherwise hold an update back
      // indefinitely, which is how a phone stays on an old version.
      let waited = 0;
      const poll = setInterval(() => {
        waited += 20000;
        if (!_swIsBusy() || waited >= 120000) {
          clearInterval(poll);
          _swActivateNow();
        }
      }, 20000);
    };
    if (worker.state === 'installed') act();
    worker.addEventListener('statechange', () => {
      if (worker.state === 'installed' && navigator.serviceWorker.controller) act();
    });
  }

  window.addEventListener('load', () => {
    // updateViaCache:'none' is the whole reason a phone can get stuck. The
    // default lets the browser serve sw.js itself from the HTTP cache, so
    // reg.update() is answered from that cache, sees identical bytes and
    // reports no update — pinning the app to whatever version was last
    // genuinely fetched, with every check answered by the problem.
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(reg => {
      _swReg = reg;
      reg.update().catch(() => {});          // bypass the browser's 24-hour delay
      reg.addEventListener('updatefound', () => _swHandleUpdate(reg.installing));
      if (reg.waiting) _swHandleUpdate(reg.waiting);
      // Used at home and in shops rather than all day: an hourly check is
      // plenty and costs nothing when the app is closed.
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);

      // And on resume. A phone keeps the app suspended for days at a time,
      // so an interval that only ticks while it is awake and a check that
      // only runs on a cold start can both miss every release. Coming back
      // to the app is the moment to look.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          if (Date.now() - _swLastCheck < 60000) return;   // not on every glance
          _swLastCheck = Date.now();
          reg.update().catch(() => {});
        }
      });
    }).catch(err => console.warn('SW registration failed:', err));

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!_swReloading) { _swReloading = true; window.location.reload(); }
    });
  });
}

// Install to the home screen. Chrome fires this; iOS Safari does not, so the
// home page tells iOS users to use Share, Add to Home Screen instead.

  e.preventDefault();
  _installEvt = e;
  const b = document.getElementById('installBtn');

    b.hidden = false;
    b.onclick = async () => {
      if (!_installEvt) return;
      _installEvt.prompt();
      await _installEvt.userChoice;
      _installEvt = null;
      b.hidden = true;
    };
  }
});

  _installEvt = null;
  const b = document.getElementById('installBtn');
  if (b) b.hidden = true;
});
